<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakout</title>
<style>:root{--bg:#0f1115;--panel:#1a1d24;--line:#2b303b;--text:#e6e8ec;--mute:#8a91a0;--acc:#d5ef6c;--acc2:#5294e0}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px}header small{color:var(--mute);font-size:12px}main{padding:14px;max-width:900px;margin:0 auto}canvas{display:block;width:100%;background:#0b0d11;border:1px solid var(--line);border-radius:12px;touch-action:none}button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:42px}button.pri{background:var(--acc);color:#0b1020;border-color:var(--acc);font-weight:600}input,textarea,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px}textarea{width:100%;min-height:40vh;resize:vertical}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.big{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:16px 0}.mute{color:var(--mute)}.pad{display:grid;gap:8px}.hud{display:flex;justify-content:space-between;font-family:ui-monospace,monospace;color:var(--mute);margin:8px 0}.ctl{display:flex;gap:8px;justify-content:center;margin-top:10px}.ctl button{width:64px;height:54px;font-size:22px}footer{padding:10px 16px;color:var(--mute);font-size:12px;text-align:center}</style>
</head>
<body>
<header><b>Breakout</b><small>a game built inside Fawagatchi</small></header>
<main>
<canvas id="c" style="aspect-ratio:3/4;max-width:520px;margin:0 auto"></canvas><div class="hud"><span id="score">score 0</span><span id="best">best 0</span></div><div class="ctl"><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div>
</main>
<footer>built inside Fawagatchi · single file, no dependencies · source: www.fweddle.com</footer>
<script>
const store = (() => { try { const l = window.localStorage; l.getItem("_"); return l; } catch (e) { const m = {}; return { getItem: (k) => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: (k) => { delete m[k]; } }; } })();
const $=(s)=>document.querySelector(s);const canvas=$("#c"),ctx=canvas.getContext("2d");let W=0,H=0;function resize(){const r=window.devicePixelRatio||1;W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*r;canvas.height=H*r;ctx.setTransform(r,0,0,r,0,0);}window.addEventListener("resize",resize);resize();const keys={};window.addEventListener("keydown",(e)=>{keys[e.key]=true;if(/^Arrow| $/.test(e.key))e.preventDefault();});window.addEventListener("keyup",(e)=>{keys[e.key]=false;});document.querySelectorAll("[data-k]").forEach((b)=>{const on=(e)=>{e.preventDefault();keys[b.dataset.k]=true;tap(b.dataset.k);};const off=(e)=>{e.preventDefault();keys[b.dataset.k]=false;};b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointerleave",off);b.addEventListener("pointercancel",off);});function tap(k){}const KEY="best:"+location.pathname+document.title;let best=+(store.getItem(KEY)||0),score=0;function setScore(s){score=s;if(s>best){best=s;try{store.setItem(KEY,best);}catch(e){}}if($("#score"))$("#score").textContent="score "+s;if($("#best"))$("#best").textContent="best "+best;}setScore(0);let sx=0,sy=0;canvas.addEventListener("pointerdown",(e)=>{sx=e.clientX;sy=e.clientY;pointer(e,"down");});canvas.addEventListener("pointermove",(e)=>pointer(e,"move"));canvas.addEventListener("pointerup",(e)=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>24||Math.abs(dy)>24)swipe(Math.abs(dx)>Math.abs(dy)?(dx>0?"ArrowRight":"ArrowLeft"):(dy>0?"ArrowDown":"ArrowUp"));else tapCanvas(e);pointer(e,"up");});function swipe(k){}function tapCanvas(e){}function pointer(e,t){}function px(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}let bricks,paddle,ball,lives,alive;function reset(){bricks=[];const cols=8,rows=6;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:c,y:r,on:true});paddle=W/2;ball={x:W/2,y:H-60,vx:3.20*.7,vy:-3.20};lives=3;alive=true;setScore(0);}pointer=(e,t)=>{if(t!=="up")paddle </script>
</body>
</html>
