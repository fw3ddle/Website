<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRISM — core</title>
<style>
  :root{
    --void:#050A08;
    --deep:#0A1512;
    --mint:#7AFFC4;
    --mint-dim:#3FBF8E;
    --ice:#EAFFF6;
    --slate:#7C9C92;
    --ink:#08221A;
    --track: 28px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--void)}
  body{
    font-family:Verdana,Geneva,"DejaVu Sans",Tahoma,sans-serif;
    color:var(--ice);
    letter-spacing:.06em;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
    user-select:none;
  }

  /* ---------- desktop ---------- */
  #desk{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1100ms ease}
  #desk.on{opacity:1}
  #desk .aurora{
    position:absolute;inset:-25%;
    background:
      radial-gradient(45% 38% at 22% 28%, rgba(122,255,196,.14), transparent 62%),
      radial-gradient(38% 44% at 78% 68%, rgba(64,190,220,.10), transparent 64%),
      radial-gradient(60% 50% at 50% 110%, rgba(122,255,196,.07), transparent 70%);
    filter:blur(14px);
    animation:drift 34s ease-in-out infinite alternate;
  }
  @keyframes drift{ from{transform:translate3d(-2%,-1%,0) scale(1)} to{transform:translate3d(3%,2%,0) scale(1.08)} }
  #desk .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(122,255,196,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(122,255,196,.045) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(70% 65% at 50% 45%,#000 25%,transparent 78%);
    -webkit-mask-image:radial-gradient(70% 65% at 50% 45%,#000 25%,transparent 78%);
  }
  #desk .vig{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 40%,transparent 45%,rgba(0,0,0,.72) 100%)}

  /* ---------- the water bar ---------- */
  #bar{
    position:fixed;left:20px;top:20px;z-index:20;
    height:60px;width:min(660px,calc(100vw - 40px));
    border-radius:30px;
    background:linear-gradient(180deg,rgba(228,255,246,.17),rgba(110,190,168,.06) 52%,rgba(255,255,255,.045));
    -webkit-backdrop-filter:blur(20px) saturate(1.5);
    backdrop-filter:blur(20px) saturate(1.5);
    border:1px solid rgba(214,255,240,.17);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.4),
      inset 0 -18px 28px -18px rgba(0,0,0,.55),
      0 22px 50px -22px rgba(0,0,0,.85);
    overflow:hidden;
    opacity:0;transform:translateY(-14px) scaleX(.94);
    transition:opacity 900ms cubic-bezier(.2,.8,.2,1),transform 900ms cubic-bezier(.2,.8,.2,1);
  }
  #bar.on{opacity:1;transform:none}
  #bar .gloss{position:absolute;left:0;right:0;top:0;height:52%;border-radius:30px 30px 40% 40%/30px 30px 100% 100%;
    background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.02));pointer-events:none}
  #bar .fog{position:absolute;width:44%;height:280%;top:-90%;border-radius:50%;filter:blur(22px);opacity:.5}
  #bar .fog.a{background:radial-gradient(closest-side,rgba(122,255,196,.5),transparent);animation:fogA 19s ease-in-out infinite alternate}
  #bar .fog.b{background:radial-gradient(closest-side,rgba(150,235,255,.35),transparent);animation:fogB 27s ease-in-out infinite alternate}
  @keyframes fogA{from{left:-16%}to{left:74%}}
  @keyframes fogB{from{left:70%}to{left:-10%}}
  #caustic{position:absolute;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(122,255,196,.42),rgba(122,255,196,.06) 58%,transparent 72%);
    filter:blur(9px);pointer-events:none}
  #ripple{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
    border:1px solid rgba(232,255,246,.85);opacity:0;pointer-events:none}
  #ripple.go{animation:rip 620ms ease-out}
  @keyframes rip{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(4.6)}}
  #clock{position:absolute;right:26px;top:50%;transform:translateY(-50%);text-align:right;line-height:1.25;pointer-events:none}
  #clock b{display:block;font-size:15px;font-weight:400;letter-spacing:.14em;color:rgba(238,255,248,.92)}
  #clock i{display:block;font-style:normal;font-size:9px;letter-spacing:.3em;color:rgba(160,205,190,.7)}
  #charge{position:absolute;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;pointer-events:none;opacity:0}
  #charge circle{fill:none;stroke:rgba(122,255,196,.95);stroke-width:2;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:50% 50%}

  /* ---------- hint ---------- */
  #hint{position:fixed;left:36px;top:92px;z-index:22;font-size:10.5px;letter-spacing:.26em;
    color:rgba(140,190,175,.75);opacity:0;transition:opacity 700ms ease;pointer-events:none;text-transform:uppercase}
  #hint.on{opacity:1}

  /* ---------- core hit target ---------- */
  #hit{position:fixed;z-index:60;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;
    cursor:grab;opacity:0;pointer-events:none;outline:none}
  #hit:focus-visible{box-shadow:0 0 0 2px rgba(122,255,196,.95),0 0 18px rgba(122,255,196,.5)}
  #hit.live{opacity:1;pointer-events:auto}
  #hit.drag{cursor:grabbing}

  /* ---------- stage canvas ---------- */
  #stage{position:fixed;inset:0;z-index:40;pointer-events:none;
    filter:drop-shadow(0 0 16px rgba(122,255,196,.32))}

  /* ---------- power panel (DS-lite glass) ---------- */
  #panel{
    position:fixed;z-index:50;width:min(392px,calc(100vw - 40px));
    border-radius:22px;padding:18px 18px 14px;
    background:linear-gradient(180deg,rgba(244,255,251,.94),rgba(214,240,232,.88));
    border:1px solid rgba(255,255,255,.85);
    box-shadow:inset 0 1px 0 rgba(255,255,255,1),inset 0 -22px 30px -24px rgba(8,60,44,.35),
               0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(10,40,32,.25);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    color:var(--ink);opacity:0;transform:scale(.72);pointer-events:none;
    transition:opacity 260ms ease,transform 380ms cubic-bezier(.2,1.05,.3,1);
    cursor:pointer;
  }
  #panel.on{opacity:1;transform:none;pointer-events:auto}
  #panel .sheen{position:absolute;left:6px;right:6px;top:4px;height:44%;border-radius:18px 18px 50% 50%/18px 18px 100% 100%;
    background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
  .phead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;position:relative}
  .phead h1{font-size:15px;font-weight:700;letter-spacing:.3em}
  .phead span{font-size:9.5px;letter-spacing:.2em;color:#4A7266}
  .row{position:relative;margin-bottom:11px}
  .rowtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .rowtop b{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:#123A2D}
  .rowtop i{font-style:normal;font-size:10.5px;letter-spacing:.08em;color:#39604F}
  .meter{height:9px;border-radius:5px;background:rgba(10,50,38,.13);
    box-shadow:inset 0 1px 2px rgba(8,40,30,.28);overflow:hidden}
  .meter u{display:block;height:100%;width:0;border-radius:5px;text-decoration:none;
    background:linear-gradient(180deg,#9CFFD8,#37C08C);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.75);transition:width 500ms cubic-bezier(.2,.8,.2,1)}
  .meter u.warm{background:linear-gradient(180deg,#FFE59C,#E0A02F)}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
  .chip{border-radius:13px;padding:9px 11px;background:rgba(255,255,255,.62);
    border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(10,50,38,.1)}
  .chip b{display:block;font-size:8.5px;font-weight:700;letter-spacing:.22em;color:#5A8073;margin-bottom:3px}
  .chip i{font-style:normal;font-size:13px;letter-spacing:.06em;color:#0E3226}
  .pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:13px;
    padding-top:10px;border-top:1px solid rgba(10,50,38,.14)}
  .pfoot span{font-size:8.5px;letter-spacing:.22em;color:#5A8073}

  @media (max-width:520px){
    #bar{height:54px;left:14px;top:14px;width:calc(100vw - 28px)}
    #clock b{font-size:13px} #hint{left:26px;top:80px;font-size:9.5px}
  }
  @media (prefers-reduced-motion:reduce){
    #desk .aurora,#bar .fog{animation:none}
  }
</style>
</head>
<body>

<div id="desk"><div class="aurora"></div><div class="grid"></div><div class="vig"></div></div>

<div id="bar">
  <div class="fog a"></div><div class="fog b"></div>
  <div class="gloss"></div>
  <div id="caustic"></div>
  <div id="ripple"></div>
  <svg id="charge" viewBox="0 0 74 74"><circle cx="37" cy="37" r="33"></circle></svg>
  <div id="clock"><b>--:--</b><i>PRISM</i></div>
</div>

<div id="hint">Hold the core for system stats</div>

<canvas id="stage"></canvas>
<div id="hit" tabindex="-1" role="slider" aria-label="Core" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

<div id="panel">
  <div class="sheen"></div>
  <div class="phead"><h1>CORE</h1><span id="uptime">UP 0:00</span></div>

  <div class="row">
    <div class="rowtop"><b>SESSION MEMORY</b><i id="v-heap">—</i></div>
    <div class="meter"><u id="m-heap"></u></div>
  </div>

  <div class="row">
    <div class="rowtop"><b>LOCAL VAULT</b><i id="v-store">—</i></div>
    <div class="meter"><u id="m-store"></u></div>
  </div>

  <div class="pgrid">
    <div class="chip"><b>SYSTEM MEMORY</b><i id="v-ram">—</i></div>
    <div class="chip"><b>THREADS</b><i id="v-cpu">—</i></div>
    <div class="chip"><b>DISPLAY</b><i id="v-disp">—</i></div>
    <div class="chip"><b>POWER</b><i id="v-batt">—</i></div>
  </div>

  <div class="pfoot"><span id="v-src">BROWSER SANDBOX</span><span>TAP TO CLOSE</span></div>
</div>

<script>
(function(){
"use strict";
const TAU=Math.PI*2;
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const eOutCubic=t=>1-Math.pow(1-t,3);
const eInCubic=t=>t*t*t;
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);

const cvs=document.getElementById("stage"), ctx=cvs.getContext("2d");
const bar=document.getElementById("bar"), hit=document.getElementById("hit");
const panel=document.getElementById("panel"), caustic=document.getElementById("caustic");
const chargeSvg=document.getElementById("charge"), chargeC=chargeSvg.querySelector("circle");
const hintEl=document.getElementById("hint"), rippleEl=document.getElementById("ripple");
const CIRC=2*Math.PI*33; chargeC.style.strokeDasharray=CIRC;

let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR);
  cvs.style.width=W+"px"; cvs.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize); resize();

/* ---------- logo -> shards ---------- */
const IMG=new Image();
let cells=[], chunks=[], LW=0, LH=0, src=null, ready=false;

/* The logo is sliced into fine vertical cells so the y-axis spin foreshortens
   correctly, but the cells are welded into a handful of coarse plates that
   break away and tumble as whole pieces. */
function buildShards(){
  const off=document.createElement("canvas");
  off.width=IMG.naturalWidth; off.height=IMG.naturalHeight;
  const octx=off.getContext("2d");
  octx.drawImage(IMG,0,0);
  LW=off.width; LH=off.height; src=off;

  const COLS=22, ROWS=28, CK=5;      // CK cells per plate edge
  const cw=LW/COLS, ch=LH/ROWS;
  let data=null;
  try{ data=octx.getImageData(0,0,LW,LH).data; }catch(e){}

  function inked(x0,y0,x1,y1){
    if(!data) return true;
    x0=Math.max(0,Math.floor(x0)); y0=Math.max(0,Math.floor(y0));
    x1=Math.min(LW-1,Math.floor(x1)); y1=Math.min(LH-1,Math.floor(y1));
    for(let y=y0;y<=y1;y+=2) for(let x=x0;x<=x1;x+=2)
      if(data[(y*LW+x)*4+3]>14) return true;
    return false;
  }

  const cx0=LW/2, cy0=LH/2;
  const PC=Math.ceil(COLS/CK), PR=Math.ceil(ROWS/CK);
  for(let J=0;J<PR;J++){
    const ry0=J*CK*ch, ry1=Math.min(ROWS,(J+1)*CK)*ch;
    for(let I=0;I<PC;I++){
      const strips=[];
      const i1=Math.min(COLS,(I+1)*CK);
      for(let i=I*CK;i<i1;i++){
        const sx=i*cw;
        if(!inked(sx,ry0,sx+cw,ry1)) continue;
        strips.push({sx:sx,sy:ry0,sw:cw,sh:ry1-ry0,lx:sx+cw/2-cx0});
      }
      if(!strips.length) continue;
      let sum=0; for(let q=0;q<strips.length;q++) sum+=strips[q].lx;
      const c={cells:strips,cx:sum/strips.length,cy:(ry0+ry1)/2-cy0};
      for(let q=0;q<strips.length;q++){
        strips[q].c=c; strips[q].dx=strips[q].lx-c.cx; cells.push(strips[q]);
      }
      chunks.push(c);
    }
  }
  for(let k=0;k<chunks.length;k++){
    const c=chunks[k];
    const len=Math.hypot(c.cx,c.cy)||1;
    const jit=0.85+Math.random()*0.55;
    c.ox=(c.cx/len)*250*jit+(Math.random()-.5)*54;
    c.oy=(c.cy/len)*250*jit+(Math.random()-.5)*54;
    c.oz=(Math.random()-.5)*430;
    c.fall=(Math.random()-.4)*70;
    c.tumble=(Math.random()*2-1)*3.6;
    c.delay=Math.random()*0.3;
  }
  ready=true;
}

/* ---------- state ---------- */
const S={
  ang:0, vel:0, burst:0, spread:1,
  cx:0, cy:0, scale:0, alpha:0,
  phase:"boot", t0:performance.now(), boot0:performance.now(),
  charge:0, open:0, holding:false, dragging:false,
  pos:0.0, glint:0
};

function bigScale(){ return Math.min(W,H)*0.44/ (LH||560); }
function coreScale(){ return (Math.min(W,H)<520?38:46)/(LH||560); }
function barRect(){ return bar.getBoundingClientRect(); }
function trackX(p){
  const r=barRect(), pad=r.height/2+2;
  return r.left+pad+(r.width-pad*2)*p;
}
function trackY(){ const r=barRect(); return r.top+r.height/2; }
function posFromX(x){
  const r=barRect(), pad=r.height/2+2;
  return clamp((x-r.left-pad)/(r.width-pad*2),0,1);
}

/* ---------- render ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  if(!ready||S.alpha<=0.001) return;
  const cs=Math.cos(S.ang), sn=Math.sin(S.ang);
  const F=1200, sc=S.scale, b=S.burst, sp=S.spread;

  // one pass per plate, not per cell
  for(let k=0;k<chunks.length;k++){
    const c=chunks[k];
    const bb=clamp((b-c.delay)/(1-c.delay),0,1);
    const e=bb*bb*(3-2*bb);
    const phi=c.tumble*e;
    c._cp=Math.cos(phi); c._sp=Math.sin(phi);
    c._ox=c.cx+c.ox*e*sp;
    c._oy=c.cy+c.oy*e*sp+c.fall*e*e;
    c._oz=c.oz*e*sp;
    c._face=Math.abs(Math.cos(S.ang+phi));
  }

  const list=[];
  for(let k=0;k<cells.length;k++){
    const cl=cells[k], c=cl.c;
    const X=c._ox+cl.dx*c._cp;
    const Z=c._oz+cl.dx*c._sp;
    list.push({cl:cl,rx:X*cs-Z*sn,ry:c._oy,rz:X*sn+Z*cs});
  }
  list.sort((a,b2)=>b2.rz-a.rz);

  for(let k=0;k<list.length;k++){
    const it=list[k], cl=it.cl, face=cl.c._face;
    const per=clamp(F/(F+it.rz*sc),0.12,3.2);
    const w=cl.sw*sc*per*face*1.1+0.9;
    const h=cl.sh*sc*per+0.6;
    if(w<0.25||h<0.25) continue;
    const px=S.cx+it.rx*sc*per;
    const py=S.cy+it.ry*sc*per;
    if(px<-160||px>W+160||py<-160||py>H+160) continue;

    let a=S.alpha*clamp(0.46+per*0.62,0,1);
    if(face<0.16){ a=Math.min(1,a*(1+(0.16-face)*4.5)); }
    ctx.globalAlpha=clamp(a,0,1);
    ctx.drawImage(src,cl.sx,cl.sy,cl.sw,cl.sh,px-w/2,py-h/2,w,h);
  }
  ctx.globalAlpha=1;

  // core glow
  if(S.phase!=="boot"||S.t0-S.boot0>6100){
    const g=ctx.createRadialGradient(S.cx,S.cy,0,S.cx,S.cy,60+S.charge*40);
    g.addColorStop(0,"rgba(122,255,196,"+(0.16+S.charge*0.3)+")");
    g.addColorStop(1,"rgba(122,255,196,0)");
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle=g; ctx.fillRect(S.cx-120,S.cy-120,240,240);
    ctx.globalCompositeOperation="source-over";
  }
}

/* ---------- boot timeline ---------- */
const K={A:700,B:2600,C:4200,D:5600,E:6100,F:7300};
let settleFrom=null, settleTo=0, deskShown=false, barShown=false;

function boot(ms,dt){
  const bs=bigScale(), midX=W/2, midY=H*0.46;
  S.cx=midX; S.cy=midY; S.spread=1;
  if(ms<K.A){
    const p=ms/K.A;
    S.alpha=eOutCubic(p); S.scale=lerp(bs*0.5,bs,eOutCubic(p));
    S.vel=lerp(0.4,3.2,p); S.burst=0; S.ang+=S.vel*dt;
  }else if(ms<K.B){
    const p=(ms-K.A)/(K.B-K.A);
    S.alpha=1; S.vel=lerp(3.2,12,eInCubic(p));
    S.scale=bs*(1+0.045*Math.sin(p*Math.PI)); S.burst=0; S.ang+=S.vel*dt;
  }else if(ms<K.C){
    const p=(ms-K.B)/(K.C-K.B);
    S.burst=eOutCubic(p); S.vel=lerp(12,6.4,p);
    S.scale=bs*(1+0.05*eOutCubic(p)); S.ang+=S.vel*dt;
  }else if(ms<K.D){
    const p=(ms-K.C)/(K.D-K.C);
    S.burst=1-eInOut(p); S.vel=lerp(6.4,2.0,p);
    S.scale=bs*(1+0.05*(1-p)); S.ang+=S.vel*dt;
  }else if(ms<K.E){
    const p=(ms-K.D)/(K.E-K.D);
    if(settleFrom===null){ settleFrom=S.ang; settleTo=Math.ceil(S.ang/TAU)*TAU; if(settleTo-settleFrom<0.9) settleTo+=TAU; }
    S.burst=0; S.scale=bs; S.ang=lerp(settleFrom,settleTo,eOutCubic(p)); S.vel=0;
    if(!deskShown && p>0.25){ deskShown=true; document.getElementById("desk").classList.add("on"); }
  }else if(ms<K.F){
    const p=(ms-K.E)/(K.F-K.E), q=eInOut(p);
    if(!deskShown){ deskShown=true; document.getElementById("desk").classList.add("on"); }
    S.cx=lerp(midX,trackX(S.pos),q);
    S.cy=lerp(midY,trackY(),eInOut(clamp(p*1.15,0,1)));
    S.scale=lerp(bs,coreScale(),eInOut(clamp(p*1.1,0,1)));
    S.ang=settleTo+TAU*eInOut(p);
    S.burst=0.16*Math.sin(p*Math.PI);
    if(!barShown && p>0.42){ barShown=true; bar.classList.add("on"); }
    syncCaustic();
  }else{
    S.phase="idle"; S.ang=settleTo+TAU; S.vel=0.5;
    hit.classList.add("live"); hit.tabIndex=0;
    if(!barShown){ barShown=true; bar.classList.add("on"); }
    setTimeout(()=>hintEl.classList.add("on"),260);
  }
}

/* ---------- interaction ---------- */
let downX=0,downY=0,downT=0,grabOff=0,holdTimer=null,charging=false,lastTap=0;
let openT=0, openDir=0; // -1 closing, 1 opening

function corePt(){ return {x:S.cx,y:S.cy}; }
function syncHit(){ hit.style.left=S.cx+"px"; hit.style.top=S.cy+"px"; }
function syncCaustic(){
  const r=barRect();
  caustic.style.left=(trackX(S.pos)-r.left)+"px";
  chargeSvg.style.left=(trackX(S.pos)-r.left-37)+"px";
}

hit.addEventListener("pointerdown",e=>{
  if(S.phase==="boot") return;
  hit.setPointerCapture(e.pointerId);
  downX=e.clientX; downY=e.clientY; downT=performance.now();
  grabOff=e.clientX-trackX(S.pos);
  S.dragging=false; S.holding=true;
  if(!panelOpen){
    holdTimer=setTimeout(()=>{ charging=true; chargeSvg.style.opacity="1"; },150);
  }
});
hit.addEventListener("pointermove",e=>{
  if(!S.holding) return;
  const dx=e.clientX-downX, dy=e.clientY-downY;
  if(!S.dragging && Math.hypot(dx,dy)>7){
    S.dragging=true; hit.classList.add("drag");
    clearTimeout(holdTimer); charging=false; S.charge=0; chargeSvg.style.opacity="0";
  }
  if(S.dragging && !panelOpen){ S.pos=posFromX(e.clientX-grabOff); }
});
function release(){
  if(!S.holding) return;
  const quick=performance.now()-downT<260 && !S.dragging;
  S.holding=false; S.dragging=false; charging=false;
  hit.classList.remove("drag");
  clearTimeout(holdTimer); chargeSvg.style.opacity="0";
  if(quick && !panelOpen){
    rippleEl.classList.remove("go"); void rippleEl.offsetWidth;
    const r=barRect(); rippleEl.style.left=(trackX(S.pos)-r.left)+"px";
    rippleEl.classList.add("go");
    const now=performance.now();
    if(now-lastTap<330){ reboot(); }
    lastTap=now;
  }
}
hit.addEventListener("pointerup",release);
hit.addEventListener("pointercancel",release);

let panelOpen=false;
function openPanel(){
  if(panelOpen) return;
  panelOpen=true; openDir=1; openT=0;
  hintEl.classList.remove("on");
  const r=barRect();
  const pw=Math.min(392,innerWidth-40);
  const x=clamp(trackX(S.pos)-pw*0.34, 20, innerWidth-pw-20);
  panel.style.left=x+"px";
  panel.style.top=(r.bottom+22)+"px";
  panel.classList.add("on");
  refresh(); if(!refreshTimer) refreshTimer=setInterval(refresh,900);
}
function closePanel(){
  if(!panelOpen) return;
  panelOpen=false; openDir=-1;
  panel.classList.remove("on");
  clearInterval(refreshTimer); refreshTimer=null;
}
panel.addEventListener("pointerdown",e=>{e.stopPropagation();closePanel();});
addEventListener("keydown",e=>{
  if(e.key==="Escape") closePanel();
  if(e.key===" "&&S.phase!=="boot"){ e.preventDefault(); panelOpen?closePanel():openPanel(); }
  if(S.phase==="idle"&&!panelOpen&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){
    e.preventDefault(); S.pos=clamp(S.pos+(e.key==="ArrowRight"?0.05:-0.05),0,1);
  }
  if(S.phase==="boot") skipBoot();
});
addEventListener("pointerdown",e=>{ if(S.phase==="boot") skipBoot(); });

function skipBoot(){
  if(S.phase!=="boot") return;
  S.boot0=performance.now()-K.F-1;
}
function reboot(){
  closePanel();
  S.phase="boot"; S.boot0=performance.now(); settleFrom=null;
  deskShown=false; barShown=false;
  document.getElementById("desk").classList.remove("on");
  bar.classList.remove("on"); hit.classList.remove("live"); hintEl.classList.remove("on");
}

/* ---------- panel data ---------- */
let refreshTimer=null, batt=null, fps=60, fAcc=0, fN=0, fT=performance.now();
if(navigator.getBattery){ navigator.getBattery().then(b=>{batt=b;}).catch(()=>{}); }
const fmt=b=>{
  if(b==null||!isFinite(b)) return "—";
  const u=["B","KB","MB","GB","TB"]; let i=0;
  while(b>=1024&&i<u.length-1){b/=1024;i++;}
  return (b<10&&i>1?b.toFixed(1):Math.round(b))+" "+u[i];
};
function setMeter(id,vid,used,total,label){
  const m=document.getElementById(id), v=document.getElementById(vid);
  if(total&&isFinite(total)){
    const pc=clamp(used/total,0,1);
    m.style.width=(pc*100).toFixed(2)+"%";
    m.classList.toggle("warm",pc>0.8);
    v.textContent=label||(fmt(used)+" / "+fmt(total));
  }else{ m.style.width="0%"; v.textContent="NOT REPORTED"; }
}
function refresh(){
  const pm=performance.memory;
  if(pm) setMeter("m-heap","v-heap",pm.usedJSHeapSize,pm.jsHeapSizeLimit);
  else setMeter("m-heap","v-heap",0,0);

  if(navigator.storage&&navigator.storage.estimate){
    navigator.storage.estimate().then(est=>{
      setMeter("m-store","v-store",est.usage||0,est.quota||0);
    }).catch(()=>setMeter("m-store","v-store",0,0));
  }else setMeter("m-store","v-store",0,0);

  document.getElementById("v-ram").textContent=navigator.deviceMemory?navigator.deviceMemory+" GB":"—";
  document.getElementById("v-cpu").textContent=navigator.hardwareConcurrency?navigator.hardwareConcurrency+" ×":"—";
  document.getElementById("v-disp").textContent=Math.round(screen.width)+"×"+Math.round(screen.height)+" @"+Math.round(fps);
  document.getElementById("v-batt").textContent=batt?(Math.round(batt.level*100)+"%"+(batt.charging?" ⌁":"")):"WALL";
  const up=(performance.now()-S.t0start)/1000;
  document.getElementById("uptime").textContent="UP "+Math.floor(up/60)+":"+String(Math.floor(up%60)).padStart(2,"0");
}
S.t0start=performance.now();

function tickClock(){
  const d=new Date();
  document.querySelector("#clock b").textContent=
    String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
tickClock(); setInterval(tickClock,15000);

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now; S.t0=now;
  fAcc+=dt; fN++; if(fAcc>0.5){ fps=fN/fAcc; fAcc=0; fN=0; }

  if(S.phase==="boot"){
    boot(now-S.boot0,dt);
  }else{
    // charge
    if(charging&&!panelOpen){
      S.charge=clamp(S.charge+dt/0.95,0,1);
      if(S.charge>=1){ charging=false; chargeSvg.style.opacity="0"; openPanel(); }
    }else if(!panelOpen){
      S.charge=clamp(S.charge-dt/0.35,0,1);
    }
    chargeC.style.strokeDashoffset=CIRC*(1-S.charge);

    // open/close easing
    if(openDir>0) openT=clamp(openT+dt/0.5,0,1);
    else if(openDir<0) openT=clamp(openT-dt/0.4,0,1);
    const op=openDir>0?eOutExpo(openT):eInOut(openT);

    const idleVel=RM?0:0.5;
    S.vel=idleVel+S.charge*S.charge*26+op*1.1;
    S.ang+=S.vel*dt;

    const tx=trackX(S.pos), ty=trackY();
    const bob=RM?0:Math.sin(now*0.0014)*1.6;
    const pr=panel.getBoundingClientRect();
    const px=panelOpen||openT>0?pr.left+pr.width/2:tx;
    const py=panelOpen||openT>0?pr.top+pr.height/2:ty;

    S.cx=lerp(tx,px,op);
    S.cy=lerp(ty+bob,py,op);
    S.scale=coreScale()*(1+S.charge*0.3+op*2.9);
    S.burst=clamp(S.charge*0.14+op*0.95,0,1);
    S.spread=1+op*1.7;
    S.alpha=1-op*0.55;
    if(openT<=0&&openDir<0) openDir=0;
    syncHit(); syncCaustic();
    hit.setAttribute("aria-valuenow",Math.round(S.pos*100));
  }
  draw();
  requestAnimationFrame(frame);
}

IMG.onload=function(){
  buildShards();
  if(RM){ S.boot0=performance.now()-K.F-1; }
  requestAnimationFrame(frame);
};
