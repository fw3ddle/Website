    bx=isX[nI-1];by=2;while(by<H-2&&get(bx,by+1)==='.')by++;
    if(by>H-3-hgt){by=H-4-hgt-irn(2,4);fillR(bx-1,by,bx+1,by+1,'.');set(bx,by+1,'=');}
  }else{ /* ELYSIAE II: the world tree; a trunk, its branches, the crown */
    const cxm=Math.floor(W/2);
    fillR(cxm-1,1,cxm+1,H-2,'#');                  /* the trunk */
    let side=R()<0.5?1:-1;
    for(let y=H-6;y>=5;y-=irn(4,6)){
      side*=-1;
      fillR(cxm-1,y,cxm+1,y+1,'.');                /* a hollow through the trunk */
      set(cxm-1+ (side>0?0:2)-1+1,y+2,'m');        /* a cap to climb inside */
      set(cxm,y+2,'m');
      /* the branch: a long shelf reaching out, drooping as it goes */
      let bxx=cxm+side*2,byy=y+1,len=irn(6,Math.floor(W/2)-3);
      for(let k=0;k<len;k++){
        if(bxx<=1||bxx>=W-1)break;
        set(bxx,byy,'-');
        if(k>2&&R()<0.3)byy=Math.min(H-3,byy+1);   /* the droop */
        bxx+=side;}
      /* a leaf pocket at the tip */
      if(bxx>2&&bxx<W-2){set(bxx-side,byy-1,'.');set(bxx,byy,'=');}
    }
    /* shelf stubs up the trunk faces: the climb the bark offers */
    let stubSide=1;
    for(let y=H-4;y>=6;y-=3){stubSide*=-1;
      const sxx=cxm+(stubSide>0?2:-2);
      if(get(sxx,y)==='.')set(sxx,y,'=');
      if(get(sxx+stubSide,y)==='.'&&R()<0.5)set(sxx+stubSide,y,'=');}
    /* crown meadow at the top */
    fillR(2,4,W-3,4,'-');fillR(cxm-1,1,cxm+1,4,'.');
    sx0=cxm+3;sy0=H-2;
    bx=cxm;by=2;set(bx,by+1,'=');set(bx-1,by+1,'=');set(bx+1,by+1,'=');
    ladder(cxm+2,H-4,6);
  }
  /* ================== the second pass: air, islands, and teeth ==================
     The first architect draws the ground plan. This pass opens the boxed-in
     middle of it -- knocking out hollows and hanging islands so the stage
     breathes -- and then charges for the crossing.                            */
  {const diff=Math.min(1,gi/30);                 /* 0 first stage of the game .. 1 last */
   const openP=(GP.open||0.4);
   /* A. hollows: bite chunks out of the solid mass so nothing reads as a box */
   const nH=Math.round((W*H)/260*openP);
   for(let n=0;n<nH;n++){
     const hx=irn(3,W-6),hy=irn(3,H-6),hw=irn(2,5),hh=irn(2,4);
     let solid=0;
     for(let y=hy;y<=hy+hh;y++)for(let x=hx;x<=hx+hw;x++)if(get(x,y)==='#')solid++;
     if(solid<(hw+1)*(hh+1)*0.7)continue;        /* only carve into real mass */
     fillR(hx,hy,hx+hw,hy+hh,'.');
     if(R()<0.7)for(let x=hx;x<=hx+hw;x++)if(get(x,hy+hh+1)==='#'&&R()<0.6)set(x,hy+hh,'=');
   }
   /* B. islands: hanging ledges strung through the new air, so the open reads as reachable */
   const nI=Math.round((W*H)/150*openP);
   for(let n=0;n<nI;n++){
     const ix=irn(2,W-7),iy=irn(4,H-6),len=irn(2,5);
     let clear=true;
     for(let x=ix-1;x<=ix+len+1;x++)for(let y=iy-3;y<=iy+2;y++)
       if(get(x,y)!=='.'){clear=false;break;}
     if(!clear)continue;
     const kind=R();
     const anch=(get(ix-1,iy)==='#'||get(ix+len,iy)==='#');
     for(let k=0;k<len;k++)set(ix+k,iy,kind<0.20?'x':(anch&&kind<0.60?'-':'='));
     if(R()<0.30&&len>2)set(ix+irn(0,len-1),iy-1,'b');
   }
   /* C. teeth: spike beds under the long drops, and thorns on the ledge lips */
   for(let y=3;y<H-2;y++)for(let x=2;x<W-2;x++){
     if(get(x,y)!=='.'||get(x,y+1)!=='#')continue;
     let drop=0;while(drop<9&&get(x,y-1-drop)==='.')drop++;
     if(drop>=6&&R()<0.10+diff*0.20)set(x,y,'^');
   }
   /* D. chokes: a narrow pinch every so often, so the climb has punctuation */
   if(H>44)for(let b=1;b<Math.floor(H/12);b++){
     const cy=b*12+irn(-2,2);if(cy<4||cy>H-5)continue;
     let gap=-1;
     for(let x=2;x<W-2;x++)if(get(x,cy)==='.'&&get(x,cy+1)==='.'){gap=x;break;}
     if(gap<0)continue;
     for(let x=2;x<W-2;x++){
       if(Math.abs(x-gap)<=1+((R()<0.5)?1:0))continue;
       if(get(x,cy)==='.'&&R()<0.55+diff*0.25)set(x,cy,'#');}
     for(let k=-1;k<=1;k++)if(get(gap+k,cy+2)==='.')set(gap+k,cy+2,'=');
   }
   /* E. the crumbling crossings get longer, and rarer, the deeper the disc goes */
   for(let y=4;y<H-3;y++)for(let x=2;x<W-3;x++)
     if(get(x,y)==='='&&R()<0.06+diff*0.16)set(x,y,'x');
  }
  /* ============================ shared furnishing ============================ */
  for(let k=-1;k<=1;k++)if(sx0+k>0&&sx0+k<W-1&&get(sx0+k,sy0)!=='='&&get(sx0+k,sy0)!=='-')set(sx0+k,sy0,'.');
  if(get(sx0,sy0+1)==='.'&&sy0<H-2)set(sx0,sy0+1,'=');
  g[sy0][sx0]='S';
  if(get(bx,by)!=='.'&&get(bx,by)!=='S')fillR(bx,by,bx,by,'.');
  if(C6ONE.indexOf(get(bx,by+1))<0&&get(bx,by+1)!=='#')set(bx,by+1,'=');
  g[by][bx]='B';
  if(get(bx-1,by)==='#'&&get(bx+1,by)==='#')set(bx-1,by,'.');
  /* secret pockets: sealed by one cracked block, holding something worth the pound */
  if(R()<GP.secretP){
    for(let t=0;t<80;t++){const x=irn(2,W-4),y=irn(3,H-5);
      if(get(x,y)!=='#'||get(x+1,y)!=='#'||get(x,y-1)!=='#')continue;
      if(get(x-1,y)!=='.'&&get(x+2,y)!=='.')continue;
      set(x,y,'x');set(x+1,y,'i');
      if(get(x+1,y+1)==='.')set(x+1,y+1,'=');
      break;}
  }
  /* produce, bubbles, caps, bugs, keys, crates, ammunition */
  const openAbove=(x,y)=>get(x,y)==='.'&&C6ONE.indexOf(get(x,y+1))>=0;
  const floorAbove=(x,y)=>get(x,y)==='.'&&(C6ONE.indexOf(get(x,y+1))>=0||get(x,y+1)==='#');
  const diff2=Math.min(1,gi/30);
  let rare=false,key=false,doorPut=false,ammoN=0,jetPut=false;
  const AMMOMAX=3+Math.floor(gi/9);
  /* one monotonic ladder of bands, so nothing later is unreachable by chance */
  const bFruit=0.085, bBub=0.100, bCap=0.124,
        bAnt =bCap +0.030+diff2*0.040,
        bScor=bAnt +(gi>6 ?0.014+diff2*0.026:0),
        bPede=bScor+(gi>12?0.010+diff2*0.020:0),
        bRare=bPede+0.008, bKey=bRare+0.008, bTrk=bKey+0.010,
        bAmmo=bTrk +0.014, bCrate=bAmmo+0.012;
  for(let y=2;y<H-2;y++)for(let x=1;x<W-1;x++){
    if(!floorAbove(x,y)||(x===bx&&y===by)||(Math.abs(x-sx0)<2&&Math.abs(y-sy0)<2))continue;
    const r=R();
    if(r<bFruit)set(x,y,'b');
    else if(r<bBub)set(x,y,'o');
    else if(r<bCap&&get(x,y+1)!=='m'&&w!==4)set(x,y,'m');
    else if(r<bAnt)set(x,y,'a');                               /* crawlers thicken with depth */
    else if(r<bScor)set(x,y,'q');
    else if(r<bPede)set(x,y,'p');
    else if(r<bRare&&!rare&&y<H-6){set(x,y,'*');rare=true;}
    else if(r<bKey&&!key){set(x,y,'k');key=true;}
    else if(r<bTrk)set(x,y,'i');
    else if(r<bAmmo&&ammoN<AMMOMAX){set(x,y,'Q');ammoN++;}     /* a cache of this disc's own shot */
    else if(r<bCrate&&gi>3&&x<W-2&&get(x+1,y)==='.'&&C6ONE.indexOf(get(x+1,y+1))>=0){
      set(x,y,'C');set(x+1,y,'C');}
  }
  /* the stage specimen is not left to chance: every disc-stage grows exactly one */
  if(!rare)for(let t=0;t<400&&!rare;t++){
    const x=irn(2,W-3),y=irn(3,H-6);
    if(floorAbove(x,y)&&get(x,y)==='.'&&!(x===bx&&y===by)&&
       !(Math.abs(x-sx0)<3&&Math.abs(y-sy0)<3)){set(x,y,'*');rare=true;}}
  if(!key)for(let t=0;t<300&&!key;t++){
    const x=irn(2,W-3),y=irn(3,H-4);
    if(floorAbove(x,y)&&get(x,y)==='.'&&!(x===bx&&y===by)){set(x,y,'k');key=true;}}
  while(ammoN<2){                                  /* every stage feeds the pouch at least twice */
    let put=false;
    for(let t=0;t<120&&!put;t++){const x=irn(2,W-3),y=irn(3,H-4);
      if(floorAbove(x,y)&&get(x,y)==='.'&&!(x===bx&&y===by)){set(x,y,'Q');ammoN++;put=true;}}
    if(!put)break;
  }
  /* a jetpack, where the stage is more climb than walk */
  if(GP.jet){
    for(let t=0;t<160&&!jetPut;t++){
      const x=irn(2,W-3),y=irn(Math.max(3,H-16),H-4);
      if(floorAbove(x,y)&&get(x,y)==='.'&&Math.abs(x-sx0)+Math.abs(y-sy0)>4){set(x,y,'P');jetPut=true;}}
    if(!jetPut)for(let t=0;t<400&&!jetPut;t++){
      const x=irn(2,W-3),y=irn(3,H-4);
      if(floorAbove(x,y)&&get(x,y)==='.'&&!(x===bx&&y===by)){set(x,y,'P');jetPut=true;}}
    if(!jetPut&&sy0>3&&get(sx0+1,sy0)==='.')set(sx0+1,sy0,'P');
  }
  /* the fliers own the open air, and there are more of them every disc */
  const nw=Math.min(9,2+Math.floor(gi/4));
  for(let n=0;n<nw;n++){const x=irn(2,W-3),y=irn(3,H-8);
    if(get(x,y)==='.')set(x,y,R()<0.35?'e':'w');}
  if(key&&R()<0.8){                              /* one honest locked pocket */
    for(let t=0;t<60&&!doorPut;t++){
      const x=irn(2,W-3),y=irn(3,H-8);
      if(get(x,y)==='#'&&get(x,y-1)==='#'){set(x,y,'A');set(x,y-1,'A');doorPut=true;}}
  }
  /* the milestone gifts, laid on the doormat of each new discipline */
  const gk={1:'U',7:'D',15:'W',22:'P',32:'M',36:'f'}[C6OFF[w]+li];
  if(gk){let px2=sx0+2;if(px2>W-2)px2=sx0-2;g[sy0-1][px2>0?px2:1]=gk;}
  /* crates obey gravity in the engine: settle them here first, or the proof lies */
  const settleCrates=()=>{const SOLID='#=-CAm';let moved=true,guard=0;
   while(moved&&guard++<H){moved=false;
     for(let y=H-3;y>=1;y--)for(let x=1;x<W-1;x++){
       if(g[y][x]!=='C')continue;
       const below=g[y+1][x];
       if(below==='.'){g[y+1][x]='C';g[y][x]='.';moved=true;}
       else if(SOLID.indexOf(below)<0){g[y][x]='.';moved=true;}
     }}
   for(let x=1;x<W-1;x++)for(let y=1;y<H-1;y++){
     if(g[y][x]!=='C')continue;
     if((x>=sx0-1&&x<=sx0+1&&y>=sy0-2)||(x===bx&&y<=by+1))g[y][x]='.';
   }};
  settleCrates();
  /* proof of passage, on the settled grid -- with one honest rescue attempt:
     if the world's own shape defeats the climb, carve a shelf trail and try again */
  if(!c6Reach(g,W,H,sx0,sy0,bx,by)){
    const tX=ladder(sx0,sy0-2,by+3);
    for(let x=Math.min(tX,bx);x<=Math.max(tX,bx);x++){
      if(get(x,by+1)==='#'||get(x,by+1)==='.')set(x,by+1,'=');
      if('#ACx|'.indexOf(get(x,by))>=0&&g[by][x]!=='B')set(x,by,'.');}
    settleCrates();
    if(!c6Reach(g,W,H,sx0,sy0,bx,by))return null;
  }
  /* ---- vines: hung from shelves into open shafts ----------------------------
     Refix hung a great many of these and the stages were better for it: a rope
     is a corridor, and corridors are what an open stage needs. Three shapes --
     plumb, arcing, and the long lazy sweep -- and no two crowd each other.   */
  const vn=[];
  const clash=(x,y)=>vn.some(v=>Math.abs(v[0][0]/16-x)<2.5&&Math.abs(v[0][1]/16-y)<9);
  for(let n=0;n<GP.vineN;n++){
    for(let t=0;t<90;t++){
      const x=irn(2,W-3);
      const y0=irn(2,H-12);
      if(C6ONE.indexOf(get(x,y0))<0)continue;      /* it must hang off something real */
      if(clash(x,y0))continue;
      let len=0;while(y0+1+len<H-1&&get(x,y0+1+len)==='.')len++;
      if(len<6)continue;
      const n2=Math.min(len,6+Math.floor(R()*9));
      const pts=[];
      const kind=R();
      if(kind<0.24){                               /* an arc: it bows out and comes back */
        const amp=(R()<0.5?-1:1)*(0.9+R()*1.6);
        for(let k=1;k<=n2;k++){const f=k/n2;
          pts.push([Math.round(x*16+8+amp*16*f*(1-f)*4),(y0+k)*16-8]);}
      }else if(kind<0.38&&n2>=9){                  /* a sweep: it leans the whole way */
        const lean=(R()<0.5?-1:1)*(0.6+R()*0.9);
        for(let k=1;k<=n2;k++){const f=k/n2;
          pts.push([Math.round(x*16+8+lean*16*f*f*3),(y0+k)*16-8]);}
      }else{
        for(let k=1;k<=n2;k++)pts.push([x*16+8,(y0+k)*16-8]);
      }
      /* a rope through rock is not a rope; drop any that ends up buried */
      let buried=0;
      for(const q of pts){const tx=Math.floor(q[0]/16),ty=Math.floor(q[1]/16);
        if(tx<1||tx>W-2||ty<1||ty>H-2||'#ACx|'.indexOf(get(tx,ty))>=0)buried++;}
      if(buried>1)continue;
      vn.push(pts);break;}
  }
  /* a second, less fussy pass: on tight stages a rope may hang from bare rock,
     which is what a real vine does anyway. No stage leaves here with none. */
  if(vn.length<Math.max(3,GP.vineN>>1)){
    const anchor=c=>C6ONE.indexOf(c)>=0||c==='#';
    for(let n=vn.length;n<GP.vineN;n++){
      let put=false;
      for(let t=0;t<160&&!put;t++){
        const x=irn(2,W-3),y0=irn(2,H-10);
        if(!anchor(get(x,y0))||get(x,y0+1)!=='.')continue;
        if(clash(x,y0))continue;
        let len=0;while(y0+1+len<H-1&&get(x,y0+1+len)==='.')len++;
        if(len<5)continue;
        const n2=Math.min(len,5+Math.floor(R()*8));
        const pts=[];for(let k=1;k<=n2;k++)pts.push([x*16+8,(y0+k)*16-8]);
        vn.push(pts);put=true;}
      if(!put)break;}
  }
  /* and if the stage is so packed that nothing will hang, make room for one:
     a single shaft is cheap, and a stage with no rope in it feels wrong now. */
  if(!vn.length){
    for(let t=0;t<200&&!vn.length;t++){
      const x=irn(3,W-4),y0=irn(3,Math.max(4,H-14));
      if('#ACx|'.indexOf(get(x,y0))<0)continue;
      let ok=true;
      for(let k=1;k<=8;k++)if(get(x,y0+k)==='#'&&get(x-1,y0+k)==='#'&&get(x+1,y0+k)==='#'){ok=false;break;}
      if(!ok)continue;
      for(let k=1;k<=8;k++)if('#Cx'.indexOf(get(x,y0+k))>=0)set(x,y0+k,'.');
      const pts=[];for(let k=1;k<=8;k++)pts.push([x*16+8,(y0+k)*16-8]);
      vn.push(pts);}
  }
  /* drifting platforms -- one at first, a small fleet by the last disc */
  {const nP2=1+Math.floor(gi/11);
   for(let n=0;n<nP2;n++)if(R()<GP.driftP+0.2){
     const x=irn(2,W-6)*16,y=irn(4,H-10)*16;
     mc.push({k:'plat',x:x,y:y,w:26,h:6,ay:14+Math.floor(R()*14),sp:0.018+R()*0.016,ph:R()*6.28});}
   if(gi>16&&R()<0.5){const x=irn(3,W-5)*16,y=irn(6,H-12)*16;
     mc.push({k:'piston',x:x,y:y,w:22,h:10,ay:20,sp:0.02,ph:R()*6.28});}}
  return {rows:g.map(r=>r.join('')),vn:vn,mc:mc,np:[],pl:pl};
}

function c6Gen(w,li){
  for(let t=0;t<60;t++){
    const out=c6TryGen(w,li,(w*131+li*17+t*7919+626)>>>0);
    if(out)return out;
  }
  /* the fallback shelf: dull, but it cannot fail */
  const W=19,H=36,g=[];
  for(let y=0;y<H;y++){const r=[];
    for(let x=0;x<W;x++)r.push((y===0||y===H-1||x===0||x===W-1)?'#':'.');g.push(r);}
  for(let y=H-3;y>=3;y-=3)for(let x=1;x<W-1;x++)g[y][x]='=';
  g[H-2][3]='S';g[3][9]='B';
  return {rows:g.map(r=>r.join('')),vn:[],mc:[],np:[]};
}

/* ---------------- the ship: a pill of a cabin, a deck, and six rooms ----------------
   Chip's room is a vertical pill. A door on its back wall opens onto the main
   deck -- a hallway the height of the old cabin -- and off the deck hang the
   holds: crew disco, the homes, Pure Green Cedar Mill, the curio shop, the
   furniture floor, and the engine dark. Every room sizes itself from its
   manifest, so anything added later simply makes the room longer.            */
const SHIP={doors:[],rooms:[],W:0,H:0,ham:null,poster:null,cab:null,
  win:[],cabin:null,bridge:null,deck:null,logs:[],sign:[],toll:null,plinth:[]};
/* ---------------- the ship, rebuilt -------------------------------------
   Every compartment lives inside its own camera-room box and is inset one
   tile from that box on all four sides. The room-locked camera can see one
   tile past a room in each direction -- that tile is always hull. So no
   compartment can ever be seen from inside another, and the deck is nowhere
   near the cabin. Doors do the walking.                                    */
function c6Ship(){
  const RW=9,RH=18,T=16;
  /* Twelve holds now. The cabin is one screen exactly; the deck runs the length
     of the ship with a cybernetic gate two thirds of the way along it.        */
  const MAN=[
    {kind:'obs',   lbl:'OBSERVATORY', pre:1},      /* pre: this side of the gate */
    {kind:'garden',lbl:'THE GARDEN'},
    {kind:'disco', lbl:'CREW DECK'},
    {kind:'houses',lbl:'THE HOMES'},
    {kind:'fruits',lbl:'CEDAR MILL'},
    {kind:'items', lbl:'CURIO HOLD'},
    {kind:'ammo',  lbl:'ARMOURY'},
    {kind:'furn',  lbl:'FLURNIR'},
    {kind:'mach',  lbl:'ENGINE DARK'},
    {kind:'arcade',lbl:'THE ARCADE'}];
  const RCOLS=8;
  const W=RW*RCOLS, H=RH*(3+MAN.length);
  const g=[];for(let y=0;y<H;y++)g.push(new Array(W).fill('#'));
  SHIP.doors.length=0;SHIP.rooms.length=0;SHIP.win.length=0;SHIP.logs.length=0;
  SHIP.sign=[];SHIP.toll=null;SHIP.plinth=[];
  SHIP.W=W;SHIP.H=H;
  const carve=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)
    if(x>0&&y>0&&x<W-1&&y<H-1)g[y][x]='.';};
  const win=(k,x,y,w2,h2,tint)=>SHIP.win.push({k:k,x:x,y:y,w:w2,h:h2,tint:tint||null});
  const sign=(x,y,txt)=>SHIP.sign.push({x:x,y:y,t:txt});

  /* ============ 1. THE CABIN -- one room, one screen, still a pill ============ */
  const CY0=1,CY1=16,PCX=4,HW=3,RTOP=3,RBOT=2;
  const cap=(d,R)=>d>=R?HW:Math.max(1,Math.round(HW-R+Math.sqrt(Math.max(0,R*R-(R-d)*(R-d)))));
  for(let y=CY0;y<=CY1;y++){
    const h2=Math.min(cap(y-CY0,RTOP),cap(CY1-y,RBOT));
    carve(PCX-h2,y,PCX+h2,y);}
  SHIP.cabin={x0:PCX-HW,y0:CY0,x1:PCX+HW,y1:CY1,pcx:PCX,hw:HW,rad:RTOP};
  /* four shelves, alternating, every third row -- the whole climb fits the screen */
  const shelfRows=[];let side=1;
  for(let y=CY1-3;y>=CY0+3;y-=3){side*=-1;
    const x0=side>0?PCX+1:PCX-3;
    for(let k=0;k<3;k++)g[y][x0+k]='=';
    shelfRows.push([x0,y,side]);}
  if(shelfRows[0]){const[sx,sy]=shelfRows[0];SHIP.ham=[sx,sy];}          /* hammock, low */
  if(shelfRows[1]){const[sx,sy]=shelfRows[1];g[sy-1][sx+1]='B';SHIP.cab=[sx+1,sy-1];}
  SHIP.poster=[PCX+2,CY0+3];
  g[CY1-1][PCX-2]='S';
  win('oval',(PCX-3)*T+2,(CY0+1)*T+2,7*T-4,3*T);

  win('hex', (PCX+1)*T+2,(CY0+9)*T,3*T,3*T);
  SHIP.rooms.push({kind:'cabin',lbl:'CHIP\u2019S ROOM',x0:PCX-HW,y0:CY0,x1:PCX+HW,y1:CY1});

  const BX0=10,BX1=32,BY0=RH+1,BY1=RH+16;

    carve(BX0+Math.round(t2*t2*7),y,BX1-Math.round(t2*t2*7),y);}
  for(let k=0;k<5;k++)g[BY1-4][BX0+4+k]='=';
  for(let k=0;k<5;k++)g[BY1-4][BX1-8+k]='=';
  for(let k=0;k<6;k++)g[BY1-8][Math.floor((BX0+BX1)/2)-3+k]='=';
  SHIP.bridge={x0:BX0,y0:BY0,x1:BX1,y1:BY1};
  SHIP.rooms.push({kind:'bridge',lbl:'THE BRIDGE',x0:BX0,y0:BY0,x1:BX1,y1:BY1});
  win('pano',(BX0+5)*T,(BY0+2)*T,13*T,6*T);
  win('hex',(BX0+1)*T,(BY0+9)*T,4*T,3*T);
  win('hex',(BX1-4)*T,(BY0+9)*T,4*T,3*T);
  win('slit',(BX0+9)*T+4,(BY1-9)*T,T+4,4*T);
  win('slit',(BX1-9)*T+4,(BY1-9)*T,T+4,4*T);

  /* ============ 3. THE MAIN DECK -- doors, and the gate ============ */
  const DR=2, DY1=DR*RH+16, DY0=DR*RH+3;
  carve(1,DY0,W-2,DY1);
  SHIP.deck={x0:1,y0:DY0,x1:W-2,y1:DY1};
  SHIP.rooms.push({kind:'deck',lbl:'MAIN DECK',x0:1,y0:DY0,x1:W-2,y1:DY1});
  for(let k=0;k<6;k++){const sx9=6+k*11;
    g[DY1-5][sx9]='=';g[DY1-5][sx9+1]='=';
    g[DY1-9][sx9+5]='=';g[DY1-9][sx9+6]='=';}
  for(let x=4;x<W-4;x+=9)win('port',x*T+2,(DY0+1)*T+4,2*T+8,2*T+8);
  win('bay',(W>>1)*T-4*T,(DY0+5)*T,8*T,3*T);
  win('slit',3*T+6,(DY0+5)*T,T+4,4*T);win('slit',(W-5)*T+6,(DY0+5)*T,T+4,4*T);

  const mkPair=(ax,ay,bx2,by2,albl,blbl)=>{

  mkPair(PCX+2,CY1-1, 4,DY1, 'DECK','CABIN');

  mkPair(BX0+2,BY1, 13,DY1,'DECK','BRIDGE');

  const GX=30;

  sign(GX-4,DY1-7,'AFT HOLDS');

    }
    if(m.kind==='disco'){for(let k=0;k<4;k++){g[y1-4][5+k]='=';g[y1-6][W-9+k]='=';}}
    if(m.kind==='obs'){for(let x=5;x<W-5;x+=9)for(let k=0;k<3;k++)g[y1-5][x+k]='=';}
    if(m.kind==='mach'){for(let x=8;x<W-8;x+=14)for(let k=0;k<3;k++)g[y1-6][x+k]='=';}
    if(m.kind==='houses'){for(let x=4;x<W-8;x+=9)for(let k=0;k<3;k++)g[y1-7][x+k]='=';}
    if(m.kind==='garden'){

        if(c==='v'){g[y1-2][bx+1]='v';g[y1-3][bx+1]='v';}
      });
      for(let x=6;x<W-6;x+=11)for(let k=0;k<4;k++)g[y1-7][x+k]='=';
      for(let x=12;x<W-8;x+=15)for(let k=0;k<3;k++)g[y1-11][x+k]='=';
    }
    if(m.kind==='arcade'){
      /* a raised carpet run, with plinths spaced for cabinets present and future */
      for(let x=3;x<W-3;x++)g[y1-4][x]='=';
      for(let x=8;x<W-8;x+=12)for(let k=0;k<4;k++)g[y1-9][x+k]='=';
      for(let k=0;k<10;k++)SHIP.plinth.push({x:(4+k*6),y:y1});
    }
    SHIP.rooms.push({kind:m.kind,lbl:m.lbl,x0:1,y0:y0,x1:W-2,y1:y1});
    const sh=['port','hex','oval','slit','tri','arch','bay','pano'];
    const k0=sh[i%sh.length],k1=sh[(i+3)%sh.length],k2=sh[(i+5)%sh.length];
    if(m.kind==='garden'){                       /* the garden gets the big glass */
      win('pano',6*T,(y0)*T+6,16*T,7*T);

      win('arch',48*T,(y0+1)*T,10*T,6*T);

      win(k0,4*T,(y0+1)*T,4*T,3*T);
      win(k1,16*T,(y0)*T+10,3*T+8,2*T+12);
      win(k2,30*T,(y0+1)*T,5*T,3*T);
      win(k0,(W-9)*T,(y0)*T+8,4*T,3*T);

      if(i%3===0)win('port',(W-16)*T,(y0+2)*T,2*T+8,2*T+8);
    }
  });
  return {rows:g.map(r=>r.join('')),vn:[],np:[]};
}

const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,d,ty,v,dest,bend){
  if(!AU.ready)return;
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=ty||'square';o.frequency.setValueAtTime(f,t);
  if(bend)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*bend),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest||AU.sfx);o.start(t);o.stop(t+d+0.02);
}
let nb=null;
function noise(t,d,v,f,dest,q){
  if(!AU.ready)return;
  if(!nb){nb=AU.ctx.createBuffer(1,AU.ctx.sampleRate*0.5,AU.ctx.sampleRate);
    const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const s=AU.ctx.createBufferSource();s.buffer=nb;
  const bf=AU.ctx.createBiquadFilter();bf.type='bandpass';
  bf.frequency.setValueAtTime(f,t);bf.Q.value=q||1;
  const g=AU.ctx.createGain();g.gain.setValueAtTime(v,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(bf);bf.connect(g);g.connect(dest||AU.sfx);s.start(t);s.stop(t+d);

/* --- ambient bus: everything wet goes through a long feedback delay --- */
function buildBus(){
  AU.delay=AU.ctx.createDelay(2.0);AU.delay.delayTime.value=0.44;
  AU.fb=AU.ctx.createGain();AU.fb.gain.value=0.46;
  AU.wet=AU.ctx.createGain();AU.wet.gain.value=0.55;
  const lp=AU.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
  AU.wet.connect(AU.delay);AU.delay.connect(AU.fb);AU.fb.connect(lp);lp.connect(AU.delay);
  AU.delay.connect(AU.music);AU.wet.connect(AU.music);
}
function pad(root,ch,t,dur){
  if(!AU.ready)return;
  ch.forEach(s2=>{
    for(let d=-1;d<=1;d++){
      const o=AU.ctx.createOscillator(),g=AU.ctx.createGain(),f=AU.ctx.createBiquadFilter();
      o.type=d===0?'sawtooth':'triangle';
      o.frequency.value=mtof(root+s2)*Math.pow(2,d*0.0012);
      f.type='lowpass';
      f.frequency.setValueAtTime(240,t);
      f.frequency.linearRampToValueAtTime(1500,t+dur*0.55);
      f.frequency.linearRampToValueAtTime(320,t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.030,t+dur*0.4);
      g.gain.linearRampToValueAtTime(0.0001,t+dur);
      o.connect(f);f.connect(g);g.connect(AU.music);o.start(t);o.stop(t+dur+0.1);
    }
  });
}
function bell(f,t,d){
  if(!AU.ready)return;
  tone(f,t,d,'sine',0.055,AU.wet);
  tone(f*2.005,t,d*0.55,'sine',0.022,AU.wet);
  tone(f*0.501,t,d*1.3,'triangle',0.030,AU.music);
}

function setTrack(i){if(AU.track===i)return;AU.track=i;AU.step=0;
  if(AU.ready)AU.next=AU.ctx.currentTime+0.05;}
function pumpMusic(){
  if(!AU.ready||!AU.on||AU.track<0)return;
  if(!AU.delay)buildBus();
  const K=TRACKS[AU.track],t0=AU.ctx.currentTime;
  while(AU.next<t0+0.35){
    const t=AU.next,st=AU.step;
    if(st%K.every===0)pad(K.root,K.chords[Math.floor(st/K.every)%K.chords.length],t,K.step*K.every*0.98);
    const m=K.mel[st%K.mel.length];
    if(m!==null&&m!==undefined)bell(mtof(K.root+24+m),t,K.step*2.6);
    if(st%8===0)noise(t,0.55,0.028,85,AU.music,0.6);
    if(st%16===11)noise(t,0.22,0.016,2600,AU.wet,0.9);
    AU.step++;AU.next+=K.step;
  }
}

const MODES=[[0,2,4,7,9],[0,2,3,7,10],[0,3,5,7,10],[0,1,5,7,8],[0,2,5,7,11],[0,4,7,11,14]];
function famOf(i){
  if(i===24)return 3;if(i===27)return 3;if(i===28)return 1;if(i===29)return 2;
  if(i<0)return 0;
  if(i<10)return i<3?1:(i<7?2:3);
  if(i<20)return i<15?4:5;
  return (i%2)?4:2;
}
function makeTrack(i){
  const base=TRACKS[famOf(i)];
  const h=(k)=>{let x=(i*2654435761+k*40503)>>>0;x^=x>>13;x=(x*1274126177)>>>0;return (x>>>8)/16777216;};
  const mode=MODES[Math.floor(h(1)*MODES.length)%MODES.length];
  const root=base.root+([0,2,3,5,7,-2,-4,-5])[Math.floor(h(2)*8)%8];
  const step=+(base.step*(0.86+h(3)*0.3)).toFixed(3);
  const chords=[];
  for(let c=0;c<4;c++){
    const deg=Math.floor(h(10+c)*mode.length)%mode.length;
    const r0=mode[deg]-(h(20+c)<0.35?12:0);
    chords.push([r0,r0+mode[(deg+2)%mode.length],
                 r0+12+mode[(deg+1)%mode.length],
                 r0+12+mode[(deg+4)%mode.length]]);
  }
  const mel=[];
  const dens=0.30+h(4)*0.28;
  for(let k=0;k<16;k++){
    if(h(60+k)<dens){
      const d=Math.floor(h(80+k)*mode.length)%mode.length;
      mel.push(mode[d]+(h(100+k)<0.28?12:0));
    }else mel.push(null);
  }
  if(!mel.some(v=>v!==null))mel[0]=mode[0];
  return {root:root,step:step,every:8,chords:chords,mel:mel};
}

/* ================= input ================= */
const padEl=document.getElementById('pad'),zone=document.getElementById('stickZone');
const base=document.getElementById('stickBase'),knob=document.getElementById('stickKnob');
const bJump=document.getElementById('bJump'),bAct=document.getElementById('bClover'),
      bStar=document.getElementById('bStar');
const held=new Map();let stickPid=null,sx=0,sy=0,tx=0,ty=0;
const ctrl={jump:false,act:false,star:false},keys={};
const rectOf=e=>e.getBoundingClientRect();
const inR=(r,x,y,m)=>{m=m===undefined?6:m;return x>=r.left-m&&x<=r.right+m&&y>=r.top-m&&y<=r.bottom+m;};
padEl.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();resumeAudio();
  const X=e.clientX,Y=e.clientY;
  if(inR(rectOf(bJump),X,Y)){held.set(e.pointerId,'jump');ctrl.jump=true;bJump.classList.add('on');return;}
  if(inR(rectOf(bStar),X,Y)){held.set(e.pointerId,'star');ctrl.star=true;bStar.classList.add('on');return;}
  if(inR(rectOf(bAct),X,Y)){held.set(e.pointerId,'act');ctrl.act=true;bAct.classList.add('on');return;}
  const z=rectOf(zone);
  if(inR(z,X,Y,0)&&stickPid===null){
    stickPid=e.pointerId;held.set(e.pointerId,'stick');
    base.style.left=(X-z.left)+'px';base.style.top=(Y-z.top)+'px';
    const b=rectOf(base);sx=b.left+b.width/2;sy=b.top+b.height/2;moveStick(X,Y);}
},{passive:false});
function moveStick(X,Y){
  const R=rectOf(base).width*0.42;let dx=X-sx,dy=Y-sy;const d=Math.hypot(dx,dy)||1;
  if(d>R){dx=dx/d*R;dy=dy/d*R;}
  knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

function blockAt(x,y,down,pb){
  const t=at(x,y);
  if(HARD(t))return true;
  if(ONEWAY(t))return down&&P.dropT<=0&&pb<=y*T+2;
  return false;
}
function hitsX(a,b){
  /* the box is [a, a+P.w). Testing a+P.w-1 made the right edge a pixel
     shorter than the left, so Chip stopped flush walking left and sank a
     pixel into the wall walking right. Same width both ways now. */
  const x0=Math.floor(a/T),x1=Math.ceil((a+P.w)/T)-1;
  const y0=Math.floor(b/T),y1=Math.floor((b+P.h-1)/T);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(HARD(at(x,y)))return true;
  return false;
}
function hitsY(a,b,down,pb){
  const x0=Math.floor(a/T),x1=Math.floor((a+P.w-1)/T);
  const y0=Math.floor(b/T),y1=Math.floor((b+P.h-1)/T);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(blockAt(x,y,down,pb))return true;
  return false;
}
function eachTile(fn){
  const x0=Math.floor(P.x/T),x1=Math.floor((P.x+P.w-1)/T);
  const y0=Math.floor(P.y/T),y1=Math.floor((P.y+P.h-1)/T);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(fn(at(x,y),x,y))return true;
  return false;
}

const ALIENSUB='XZVKQJWYPFGMBHDTNCRLSAOEUI';       // a fixed cipher: the saucer's alphabet
function alienize(l){let o='';
  for(const ch of l.toUpperCase()){
    const c2=ch.charCodeAt(0);
    o+=(c2>=65&&c2<=90)?ALIENSUB[c2-65]:ch;}
  return o;}
function voiceLines(n,lns){
  if(n.sign)return lns;
  const h=(k)=>H3((n.x|0)+k,(n.y|0),577+k);
  if(sp(theme)){
    if(n.kind>=2)return lns.map((l,i)=>{            // robots: caps, buzzes and dings
      let o=h(i)<0.4?l.toUpperCase():l;
      if(h(i+9)<0.30)o='[BZZT] '+o;
      else if(h(i+17)<0.22)o=o+' *DING*';
      else if(h(i+23)<0.14)o='[WHIRR] '+o;
      return o;});
    return lns.map((l,i)=>(i%4===3||h(i)<0.25)?l:alienize(l));  // aliens: 75% encrypted
  }
  const ONO={3:'...hmmm.',4:'Sssss.',5:'Hoo!',6:'Mrrow.',7:'SQUAWK!',9:'Hrrmph.',
             10:'...spore.',11:'Squeak!',1:'Ribbit.'};
  const o2=ONO[n.kind];
  if(o2&&lns.length)lns=lns.map((l,i)=>(i===lns.length-1||h(i)<0.22)?l+' '+o2:l);
  return lns;
}

function fireAimed(hold){
  // on a vine the stick steers the shot — press a direction while firing
  const n0=seeds.length;usePower(hold);
  if(!(IN.x||IN.y))return;
  const L2=Math.hypot(IN.x,IN.y)||1,ax2=IN.x/L2,ay2=IN.y/L2;
  if(IN.x)P.face=IN.x>0?1:-1;
  for(let i=n0;i<seeds.length;i++){const s=seeds[i];
    const sp2=Math.hypot(s.vx,s.vy)||3.8;
    s.vx=sp2*ax2;s.vy=sp2*ay2;s.x=P.x+4+ax2*7;s.y=P.y+5+ay2*6;}
}
function doPound(){
  if(!PR.pound||P.grounded||P.pounding||P.onVine||P.swing)return;
  P.pounding=true;P.vy=POUNDV;P.gliding=false;shake=2;P.launchT=0;SFX.pound();
}

/* ---- ropes: fixed vines and swinging vines answer the same button ----
   Nothing grabs Chip. Chip grabs it. Whichever rope is nearest wins. */
function grabRope(){
  if(P.vineCool>0)return false;
  const cxp=P.x+P.w/2,cyp=P.y+P.h/2;
  let best=null,bd=20*20;                         // same reach for both kinds
  for(const v of vines)for(let i=0;i<v.pts.length;i++){
    const p=v.pts[i],dx=cxp-p.x,dy=cyp-p.y,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best={k:'v',v:v,i:i};}
  }
  for(const s of swings){
    if(s.rider)continue;
    for(let f=0.32;f<=1.02;f+=0.06){              // sample down the swinging rope
      const rx=s.ax+Math.sin(s.ang)*s.len*f,ry=s.ay+Math.cos(s.ang)*s.len*f;
      const dx=cxp-rx,dy=cyp-ry,d=dx*dx+dy*dy;
      if(d<bd){bd=d;best={k:'s',s:s,f:f,x:rx,y:ry};}
    }
  }
  if(!best)return false;
  if(best.k==='v'){
    P.vine=best.v;P.vi=vines.indexOf(best.v);P.vt=best.i;P.onVine=true;P.swing=null;
    P.vx=0;P.vy=0;P.pounding=false;P.launchT=0;SFX.vine();
    burst(best.v.pts[best.i].x,best.v.pts[best.i].y,'#6ade8a',7,1.2);
    return true;
  }
  const s=best.s;
  s.rider=true;P.swing=s;s.grip=best.f;           // the rope keeps whatever length he caught
  s.vel+=P.vx/Math.max(20,s.len)*0.6;             // and takes his run with it
  P.onVine=false;P.vine=null;P.pounding=false;P.launchT=0;
  SFX.vine();burst(best.x,best.y,'#6ade8a',7,1.2);
  return true;
}
function releaseRope(){
  if(P.onVine){P.onVine=false;P.vine=null;P.vineCool=14;SFX.vine();return true;}
  if(P.swing){const s=P.swing;s.rider=false;P.swing=null;P.vineCool=14;
    if(Math.abs(s.vel)<0.006&&Math.abs(s.ang)<0.3)s.vel=0.012;
    P.vx=Math.max(-3,Math.min(3,P.vx));SFX.vine();return true;}
  return false;
}
function vineTangent(v,t){
  const n=v.pts.length,i=Math.max(0,Math.min(n-2,Math.floor(t)));
  const a=v.pts[i],b=v.pts[i+1];
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
  return[dx/L,dy/L];
}
function rideVine(){
  const v=P.vine,n=v.pts.length;
  if(IN.x||IN.y){
    const[tx2,ty2]=vineTangent(v,P.vt);
    const dot=IN.x*tx2+IN.y*ty2;
    if(Math.abs(dot)>0.12){P.vdir=Math.sign(dot);P.vt+=P.vdir*0.155;}
    // at a junction, lean the stick toward the other strand to switch onto it
    for(const j of joins){
      let o=-1,oi=0;
      if(j[0]===P.vi&&Math.abs(P.vt-j[1])<1.0){o=j[2];oi=j[3];}
      else if(j[2]===P.vi&&Math.abs(P.vt-j[3])<1.0){o=j[0];oi=j[1];}
      if(o<0||!vines[o])continue;
      const ov=vines[o],[ox2,oy2]=vineTangent(ov,oi);
      if(Math.abs(IN.x*ox2+IN.y*oy2)>Math.abs(dot)+0.30){
        P.vine=ov;P.vi=o;P.vt=oi;SFX.vine();
        burst(ov.pts[oi].x,ov.pts[oi].y,'#8fe8a8',5,1.0);break;
      }
    }
    P.vt=Math.max(0,Math.min(n-1,P.vt));
  }
  const i=Math.floor(P.vt),f=P.vt-i;
  const a=v.pts[i],b=v.pts[Math.min(n-1,i+1)];
  const nx2=a.x+(b.x-a.x)*f,ny2=a.y+(b.y-a.y)*f;
  P.face=(b.x-a.x)>=0?1:-1;
  P.x=nx2-P.w/2;P.y=ny2-4;P.vx=0;P.vy=0;
  if(IN.jumpP){                         // only JUMP lets go
    const[tx2,ty2]=vineTangent(v,P.vt);
    const d=P.vdir||-1;
    P.onVine=false;P.vine=null;P.vineCool=16;
    // a full jump regardless of which way the rope happens to point, plus
    // whatever momentum you had along it
    P.vx=tx2*d*2.8;
    P.vy=JUMPV;                       // never higher than a ground jump
    P.noCut=true;SFX.jump();
  }
  if(P.iframes>0)P.iframes--;
}
function updatePlay(){
  if(mapT%10===0)tintClover();
  PHIST.push({x:P.x,y:P.y});if(PHIST.length>120)PHIST.shift();
  if(P.dancing){                       // boombox finale: he bounces off the very corners of the room
    P.dancing++;P.vx=0;
    boombox.jam=(boombox.jam||0)+1;boombox.t+=0.18;
    if(P.dancing>230){                 // ...until the music peaks: both of them POSE
      P.vy=Math.min(P.vy+G,MAXFALL);
      let npy=P.y+P.vy;
      if(hitsY(P.x,npy,true,P.y+P.h)){while(!hitsY(P.x,P.y+1,true,P.y+P.h))P.y+=1;P.vy=0;P.grounded=true;}
      else P.y=npy;
      P.rollA=0;
      if(P.dancing===231){SFX.clear();ring(P.x+4,P.y+8,'#ffffff',16);shake=4;}
      if(P.dancing%22===0)ring(boombox.x,boombox.y-8,'hsl('+((P.dancing*31)%360)+',95%,65%)',10);
      updateEnemies();updateMotes();
      if(P.dancing>80&&(IN.starP||IN.jumpP)){finishLevel();stepFX();return;}
      if(P.dancing>300)finishLevel();
      stepFX();return;
    }
    const rx0=roomX*RW*T+3,rx1=(roomX+1)*RW*T-3-P.w;
    const ry0=roomY*RH*T+3;
    P.x+=P.danceVX||0;
    if(P.x<=rx0){P.x=rx0;P.danceVX=Math.abs(P.danceVX||1.5);burst(P.x,P.y+6,'#ffd93a',5,1.4);}
    if(P.x>=rx1){P.x=rx1;P.danceVX=-Math.abs(P.danceVX||1.5);burst(P.x+P.w,P.y+6,'#ff8ac0',5,1.4);}
    P.vy=Math.min(P.vy+G,MAXFALL);
    if(P.y<=ry0&&P.vy<0){P.y=ry0;P.vy=0.5;burst(P.x+4,P.y,'#8ae8ff',5,1.4);}   // boops the ceiling
    let ny=P.y+P.vy;
    if(hitsY(P.x,ny,true,P.y+P.h)){while(!hitsY(P.x,P.y+1,true,P.y+P.h))P.y+=1;
      P.vy=-(2.4+((P.dancing>>5)%3)*1.3);                                       // land = leap again
      P.face*=-1;burst(P.x+4,P.y+P.h,'hsl('+((P.dancing*23)%360)+',90%,62%)',4,1.2);}
    else P.y=ny;
    P.rollA=(P.rollA||0)+(P.danceVX||1.5)*0.2;                                  // he ROLLS
    if(P.dancing%9===0)particles.push({x:P.x+4,y:P.y-3,vx:(Math.random()-.5)*1.2,
      vy:-0.8,life:26,c:['#ff8ac0','#ffd93a','#8ae8ff'][((P.dancing/9)|0)%3]});
    if(P.dancing%14===0)ring(boombox.x,boombox.y-6,'hsl('+((P.dancing*17)%360)+',90%,60%)',6+(P.dancing%28===0?6:0));
    if(P.dancing%9===0)particles.push({x:boombox.x+(Math.random()-.5)*28,y:boombox.y-14,
      vx:(Math.random()-.5)*0.8,vy:-1.2-Math.random(),life:30,
      c:['#ffd93a','#6ade8a','#ff8ab0','#7fd8ff'][(P.dancing/9|0)%4],note:true});
    updateEnemies();                                   // hostiles carry on, uninvited
    updateMotes();                                     // the helix turns
    if(P.dancing>80&&(IN.starP||IN.jumpP)){finishLevel();stepFX();return;}
    if(P.dancing>300)finishLevel();
    stepFX();return;
  }
  if(P.dead){P.dead--;if(!P.dead){if(P.fainting)faint();else respawn();}return;}
  if(IN.starP)starAction();
  if(box){                                   // conversation: text types itself out
    box.t2=(box.t2||0)+1;
    const cur=box.lines[box.i]||'';
    if(box.t2%2===0&&box.ch<cur.length)box.ch++;
    const n=box.src;                         // stepping away ends the chat, and the bugs wake
    if(n&&n.x!==undefined&&
       (Math.abs(P.x+P.w/2-(n.x+(n.w||12)/2))>34||Math.abs(P.y-n.y)>34)){
      n.cool=40;box=null;SFX.select();}
  }
  if(P.disco>0){P.disco--;
    if(P.disco%3===0)particles.push({x:P.x+2+Math.random()*6,y:P.y+2+Math.random()*9,
      vx:(Math.random()-.5)*0.8,vy:-0.5,life:14,
      c:'hsl('+((mapT*11)%360)+',95%,62%)'});
    if(P.disco===0)ring(P.x+4,P.y+6,'#ffffff',10);}
  const free=!box;

  if(P.swing){
    const s=P.swing,R=s.len*(s.grip||1);       // hang from the grip point, not the rope's end
    if(P.shootCool>0)P.shootCool--;
    if(free&&(IN.actP||(IN.act&&holdFire())))fireAimed(!IN.actP);  // aimed shots, same as a still vine
    if(free&&IN.x)s.vel+=IN.x*0.0011;
    s.vel+=-(0.0016)*Math.sin(s.ang);s.vel*=0.9985;s.ang+=s.vel;
    P.x=s.ax+Math.sin(s.ang)*R-P.w/2;P.y=s.ay+Math.cos(s.ang)*R-4;
    P.face=s.vel>0?1:-1;
    P.vx=Math.cos(s.ang)*R*s.vel;P.vy=-Math.sin(s.ang)*R*s.vel;
    if(free&&IN.jumpP){s.rider=false;P.swing=null;P.vineCool=18;
      if(Math.abs(s.vel)<0.006&&Math.abs(s.ang)<0.3)s.vel=0.012;   // leave it with a kick
      P.vy=Math.max(JUMPV,Math.min(P.vy+JUMPV*0.85,-2));P.vx=Math.max(-4,Math.min(4,P.vx*1.15));SFX.jump();}
    if(P.iframes>0)P.iframes--;afterMove();return;
  }
  if(P.onVine&&P.vine){
    if(P.shootCool>0)P.shootCool--;
    if(free&&(IN.actP||(IN.act&&holdFire())))fireAimed(!IN.actP);  // aimed shots from the rope
    if(free)rideVine();
    afterMove();return;
  }

  updateMach();
  if(P.riding){P.x+=P.riding.dx;P.y+=P.riding.dy;}
  if(P.dropT>0)P.dropT--;
  if(P.launchT>0)P.launchT--;
  if(P.vineCool>0)P.vineCool--;
  if(P.squash>0)P.squash--;
  if(P.shootCool>0)P.shootCool--;

  if(!P.pounding&&P.launchT<=0){
    const tg=IN.x*MAXSPD;
    if(IN.x)P.vx+=Math.sign(tg-P.vx)*ACC;else P.vx*=(P.grounded?FRIC:0.955);
    const lim=P.sticky?MAXSPD*0.45:MAXSPD;
    if(IN.x&&Math.abs(P.vx)>lim)P.vx=Math.sign(tg)*lim;
    if(Math.abs(P.vx)<0.05)P.vx=0;
    if(IN.x)P.face=IN.x;
  }else if(P.pounding)P.vx=0;
  else if(P.launchT>0&&IN.x)P.vx+=IN.x*0.08;

  if(IN.jumpP&&!(IN.y>0&&!P.grounded&&P.coyote<=0))P.buffer=9;
  else if(P.buffer>0)P.buffer--;
  if(P.grounded){P.coyote=9;P.noCut=false;P.fuel=Math.min(FUELMAX,P.fuel+0.55);}
  else if(P.coyote>0)P.coyote--;
  if(P.grounded&&IN.y>0&&IN.jumpP){P.dropT=10;P.buffer=0;P.vy=1.2;P.grounded=false;}

  P.cling=0;
  if(PR.cling&&!P.grounded&&!P.pounding&&P.vy>-1){
    if(hitsX(P.x-1,P.y)&&IN.x<0){P.cling=1;P.clingDir=-1;P.face=-1;}
    else if(hitsX(P.x+1,P.y)&&IN.x>0){P.cling=1;P.clingDir=1;P.face=1;}
  }
  if(P.buffer>0&&P.dropT<=0){
    if(P.coyote>0){
      const sfy=Math.floor((P.y+P.h+1)/T),sfx=Math.floor((P.x+P.w/2)/T);
      if(at(sfx,sfy)===6){                        // stood on a mushroom: full launch
        P.vy=springV(sfx,sfy);P.noCut=true;mush.set(sfy*MAPW+sfx,14);
        shake=4;SFX.spring();ring(sfx*T+8,sfy*T+4,'#ff8ab0',10);
      }else{P.vy=JUMPV;burst(P.x+4,P.y+P.h,'#9fe8ac',4,1);SFX.jump();}
      P.buffer=0;P.coyote=0;P.grounded=false;}
    else if(P.cling){P.vy=WJY;P.vx=-P.clingDir*WJX;P.face=-P.clingDir;P.buffer=0;P.cling=0;
      burst(P.x+4+P.clingDir*4,P.y+6,'#d8c08a',5,1.2);SFX.jump();}
    else if(P.bubbles>0){P.bubbles--;P.vy=JUMPV*1.06;P.buffer=0;P.noCut=false;
      ring(P.x+4,P.y+8,'#a8e8ff',10);SFX.bubble();}
  }
  // jetpack: hold JUMP in the air, burns fuel, refuels on the ground
  P.jetting=false;
  if(PR.jet&&P.jetHere&&free&&IN.jump&&!P.grounded&&!P.pounding&&!P.cling&&P.buffer<=0&&P.fuel>0&&P.vy>-2.6){
    P.vy-=JETTHRUST;P.fuel-=1;P.jetting=true;P.noCut=true;
    if(P.fuel%4===0)SFX.jet();
    particles.push({x:P.x+4+(Math.random()-.5)*4,y:P.y+11,vx:(Math.random()-.5)*0.6,
      vy:1.2+Math.random(),life:12,c:Math.random()<.5?'#ffd24a':'#ff7a3a'});
  }
  if(!IN.jump&&P.vy<0&&!P.pounding&&!P.noCut)P.vy*=CUT;
  if(P.vy>=0)P.noCut=false;

  if(free&&(IN.actP||(IN.act&&holdFire())))usePower(!IN.actP);
  // and the shortcut: in the air, down + JUMP is the drop
  if(free&&IN.jumpP&&IN.y>0&&!P.grounded&&P.coyote<=0)doPound();
  P.gliding=PR.glide&&!P.jetting&&IN.jump&&P.vy>0&&!P.grounded&&!P.pounding&&!P.cling&&P.launchT<=0;

  P.vy+=G*P.gmul;
  if(P.cling)P.vy=Math.min(P.vy,0.4);
  else if(P.pounding)P.vy=POUNDV;
  else if(P.gliding)P.vy=Math.min(P.vy,GLIDEFALL);
  else P.vy=Math.min(P.vy,MAXFALL);

  let nx=P.x+P.vx;
  if(hitsX(nx,P.y)){const s=Math.sign(P.vx);
    /* to the exact face: whole pixels first, then halve what is left */
    if(s){
      while(!hitsX(P.x+s,P.y)&&Math.abs(nx-P.x)>=1)P.x+=s;
      let step=0.5;
      for(let it=0;it<6;it++){
        if(!hitsX(P.x+s*step,P.y))P.x+=s*step;
        step*=0.5;}
      P.x=Math.round(P.x*64)/64;
    }
    let ric=false;
    if(s){const wx2=Math.floor((s>0?P.x+P.w+1:P.x-2)/T);
      for(let yy2=Math.floor(P.y/T);yy2<=Math.floor((P.y+P.h-1)/T);yy2++)
        if(at(wx2,yy2)===23){ric=true;mush.set(yy2*MAPW+wx2,12);break;}}
    if(ric&&Math.abs(P.vx)>0.7){                  // caps punch back sideways
      P.vx=-s*Math.max(2.2,Math.abs(P.vx)*0.9);P.vy=Math.min(P.vy,-1.4);
      shake=2;SFX.spring();ring(P.x+4,P.y+8,'#ff8ab0',8);}
    else P.vx=0;}
  else P.x=nx;

  const pb=P.y+P.h;let ny=P.y+P.vy;const down=P.vy>0,wasAir=!P.grounded;
  P.grounded=false;
  if(hitsY(P.x,ny,down,pb)){
    const s=Math.sign(P.vy);
    while(s&&!hitsY(P.x,P.y+s,down,pb)&&Math.abs(ny-P.y)>0.01)P.y+=s;
    if(down){
      const fy=Math.floor((P.y+P.h+1)/T),fx=Math.floor((P.x+P.w/2)/T);
      if(at(fx,fy)===23){                         // bumper cap: he IS the pinball
        dex('spring');P.launchT=0;P.pounding=false;
        P.vy=-7.6;P.noCut=true;
        mush.set(fy*MAPW+fx,14);shake=4;SFX.spring();ring(fx*T+8,fy*T+4,'#ff5a7a',12);
      }
      else if(at(fx,fy)===6){
        dex('spring');P.launchT=0;P.pounding=false;
        if(IN.jump){                              // held JUMP: the full boost
          P.vy=springV(fx,fy);P.noCut=true;
          mush.set(fy*MAPW+fx,14);shake=4;SFX.spring();ring(fx*T+8,fy*T+4,'#ff8ab0',10);
        }else if(P.vy>2.6){                       // a couple of damped hops...
          P.vy=-P.vy*0.42;mush.set(fy*MAPW+fx,10);SFX.land();
        }else{                                    // ...then it just sits there, squished and ready
          P.grounded=true;P.vy=0;mush.set(fy*MAPW+fx,6);
          if(wasAir)SFX.land();
        }
      }else{
        P.grounded=true;P.vy=0;
        if(wasAir&&!P.pounding)SFX.land();
        if(P.pounding){
          P.pounding=false;shake=8;P.squash=8;burst(P.x+4,P.y+P.h,'#d8a86a',16,2.4);
          const R=maxed()?3:1;                    // full serum widens the shockwave
          let broke=false;
          let brokeC=false;
          for(let dx=-R;dx<=R;dx++){const bx=fx+dx;
            const t2=at(bx,fy);
            if(t2===5||t2===15||t2===21){setT(bx,fy,0);broke=true;if(t2===15)brokeC=true;burst(bx*T+8,fy*T+8,t2===21?'#b8c0cc':'#a07a4a',10,2.2);if(t2===15)crateLoot(bx,fy);}}
          if(maxed()){shake=12;ring(P.x+4,P.y+P.h,'#ffd93a',14);
            for(const e of ants.concat(wasps)){
              if(e.gone)continue;
              if(Math.abs(e.x-P.x)<R*T+10&&Math.abs(e.y-P.y)<26)killBug(e);}}
          if(broke){SFX.smash();say(maxed()?'the whole shelf caves in':(brokeC?'the crate splits open':'the rotten wood gives way'),maxed()?'smash2':(brokeC?'crateb':'smash'));}
        }
      }
    }else{
      const hy2=Math.floor((P.y-1)/T),hx2=Math.floor((P.x+P.w/2)/T);
      if(at(hx2,hy2)===23){                       // bonk: the cap spikes him back down
        P.vy=3.2;mush.set(hy2*MAPW+hx2,12);shake=2;SFX.spring();ring(P.x+4,P.y,'#ff8ab0',8);}
      else P.vy=0;
    }
  }else P.y=ny;
  collideMach();
  afterMove();
}

function sanePlayer(){
  const ok=v=>Number.isFinite(v);
  if(ok(P.x)&&ok(P.y)&&ok(P.vx)&&ok(P.vy)){
    if(P.grounded){P.lastX=P.x;P.lastY=P.y;}       /* the last honest footing */
    return true;}
  console.warn('CHIP: a coordinate went non-finite; putting the monkey back');
  P.x=Number.isFinite(P.lastX)?P.lastX:(Number.isFinite(P.safeX)?P.safeX:16);
  P.y=Number.isFinite(P.lastY)?P.lastY:(Number.isFinite(P.safeY)?P.safeY:16);
  P.vx=0;P.vy=0;P.riding=null;P.swing=null;P.onVine=false;P.vine=null;
  P.iframes=Math.max(P.iframes,30);
  if(!Number.isFinite(roomX)||!Number.isFinite(roomY)){
    roomX=Math.floor((P.x+P.w/2)/(RW*T));roomY=Math.floor((P.y+P.h/2)/(RH*T));}
  if(!Number.isFinite(camX))camX=Math.max(-T,Math.min(MAPW*T-VW+T,roomX*RW*T-T));
  if(!Number.isFinite(camY))camY=Math.max(-T,Math.min(MAPH*T-VH+T,roomY*RH*T-T));
  return false;
}

    if(discoball.cool<=0&&Math.abs(P.x+P.w/2-discoball.x)<13&&Math.abs(P.y+P.h/2-discoball.y)<15){
      P.disco=540;discoball.cool=620;dex('disco');SFX.rare();shake=5;
      ring(discoball.x,discoball.y,'#ffffff',14);
      say('MIRRORBALL','chip cannot be stopped while the beat lasts','disco');}}
  if(P.nightv>0)P.nightv--;
  if(P.hurtT>0)P.hurtT--;
  if(P.magnet)for(const p of pickups){
    if(p.got||p.kind!=='fruit')continue;
    const mdx=P.x+P.w/2-p.x,mdy=P.y+P.h/2-p.y;
    if(Math.abs(mdx)<40&&Math.abs(mdy)<40){p.x+=mdx*0.11;p.y+=mdy*0.11;}}
  if(P.pepper>0&&P.shootCool<=0&&!P.dead&&!P.fainting&&!box&&!P.dancing){
    const cold=P.mint>0;                           // it will not be told to stop
    seeds.push({x:P.x+4+P.face*6,y:P.y+5,vx:P.face*3.6,vy:0,g:0.02,
                fire:!cold,coldfire:cold,freeze:cold,push:cold?2.0:0,life:90,r:5});
    P.shootCool=6;SFX.fire();
  }
  if(P.pepper>0){P.pepper--;
    if(P.pepper%3===0)particles.push({x:P.x+4,y:P.y+3,vx:(Math.random()-.5)*0.5,
      vy:-0.7,life:14,c:Math.random()<.5?'#ff8a2a':'#ffd93a'});}
  for(let i=seeds.length-1;i>=0;i--){
    const s=seeds[i];
    s.x+=s.vx;
    if(s.hel){s.t2=(s.t2||0)+1;s.y=s.oy+Math.sin(s.t2*0.34+s.ph)*8;}
    else if(s.g||s.vy){s.vy=(s.vy||0)+(s.g||0);s.y+=s.vy;}
    s.life--;
    if(s.fuse!==undefined&&--s.fuse<=0){gourdBlast(s);seeds.splice(i,1);continue;}
    const tx2=Math.floor(s.x/T),ty2=Math.floor(s.y/T),tt=at(tx2,ty2);
    if(s.life<=0){if(s.puff)puffBurst(s);seeds.splice(i,1);continue;}
    if(HARD(tt)||tt===15){
      if(tt===21){                                 // trap blocks die to any seed
        setT(tx2,ty2,0);burst(tx2*T+8,ty2*T+8,'#b8c0cc',12,2.2);burst(tx2*T+8,ty2*T+8,'#ff6a5a',5,1.4);
        SFX.smash();seeds.splice(i,1);continue;}
      if((s.fire||s.coldfire||s.big||s.melon||s.mint||s.wand||s.spike||s.fw)&&(tt===15||tt===5)){
        // fire, coconuts, watermelon seeds, peppermints and wand blasts smash crates
        setT(tx2,ty2,0);burst(tx2*T+8,ty2*T+8,'#c8a06a',12,2.2);SFX.smash();
        if(tt===15)crateLoot(tx2,ty2);
        if(s.big){for(let d=-1;d<=1;d++){const t3=at(tx2+d,ty2);
          if(t3===15||t3===5){setT(tx2+d,ty2,0);burst((tx2+d)*T+8,ty2*T+8,'#c8a06a',8,2);if(t3===15)crateLoot(tx2+d,ty2);}}
          if(!s.giant&&!s.dur)continue;}           // a crate never stops a coconut
      }
      if(s.dur){                                     // the durian lands: spikes in every direction
        for(let k2=0;k2<8;k2++){const an=k2*0.785+0.39;
          seeds.push({x:s.x-s.vx,y:s.y-(s.vy||0),vx:Math.cos(an)*3.4,vy:Math.sin(an)*3.4,g:0,
            spike:true,life:110,r:2});}
        burst(s.x,s.y,'#b8c84a',12,2.2);shake=3;SFX.smash();seeds.splice(i,1);continue;}
      if(s.gourd){gourdBlast(s);seeds.splice(i,1);continue;}
      if(s.puff){puffBurst(s);seeds.splice(i,1);continue;}
      if(s.bounce>0){                                // glass ricochets off honest stone
        s.bounce--;
        const hx=HARD(at(Math.floor((s.x+Math.sign(s.vx))/T),Math.floor(s.y/T)));
        if(hx)s.vx=-s.vx;else s.vy=-(s.vy||0)*1.02-0.2;
        s.x+=s.vx*0.6;s.y+=(s.vy||0)*0.6;
        burst(s.x,s.y,'#cfeaff',3,1.0);continue;}
      if(s.big&&s.vy>0){s.vy=-s.vy*0.45;s.y-=2;}     // coconuts bounce once or twice
      else{burst(s.x,s.y,s.fire?'#ff8a2a':(s.freeze?'#bfeaff':'#8a7a5a'),6,1.4);seeds.splice(i,1);continue;}
    }
    let hit=false;
    for(const e of ants.concat(wasps)){
      if(e.gone)continue;
      const r=s.r||3;
      if(s.x>e.x-r&&s.x<e.x+e.w+r&&s.y>e.y-r&&s.y<e.y+e.h+r){
        if(s.freeze)freezeBug(e,(s.push?Math.sign(s.vx)*s.push:0),!!s.root);
        else killBug(e);
        hit=true;
        if(!s.big&&!s.fire&&!s.giant&&!s.zap)break;}
    }
    if(hit&&s.bola){if(--s.hits<=0){burst(s.x,s.y,'#9a9aa2',8,1.6);seeds.splice(i,1);continue;}}
    if(hit&&s.gourd){gourdBlast(s);seeds.splice(i,1);continue;}
    if(hit&&s.puff){puffBurst(s);seeds.splice(i,1);continue;}
    if(hit&&s.dur){
      for(let k2=0;k2<8;k2++){const an=k2*0.785+0.39;
        seeds.push({x:s.x,y:s.y,vx:Math.cos(an)*3.4,vy:Math.sin(an)*3.4,g:0,
          spike:true,life:110,r:2});}
      burst(s.x,s.y,'#b8c84a',12,2.2);SFX.smash();seeds.splice(i,1);}
    else if(hit&&!s.big&&!s.giant&&!s.zap&&!s.spike){burst(s.x,s.y,s.fire?'#ff8a2a':(s.freeze?'#bfeaff':'#c8b890'),6,1.4);seeds.splice(i,1);}
  }
  if(mapT%30===0)dexMut();
  updateAmbient();updateEnemies();updateMotes();stepFX();
  /* teleport pads: stand on one and the ship folds the corridor for you */
  for(const tp of teles){tp.t+=0.09;
    const on=P.grounded&&P.x+P.w>tp.x+2&&P.x<tp.x+T-2&&Math.abs(P.y+P.h-(tp.y+T))<4;
    if(on){tp.hold++;
      if(tp.hold===1)SFX.select();
      if(tp.hold%6===0)ring(tp.x+8,tp.y+12,'#7fd8ff',6);
      if(tp.hold>=26){
        burst(P.x+4,P.y+6,'#7fd8ff',14,2.2);burst(tp.px+4,tp.py+6,'#a8e8ff',14,2.2);
        P.x=tp.px;P.y=tp.py-P.h+14;P.vx=0;P.vy=0;P.iframes=Math.max(P.iframes,26);
        tp.hold=0;for(const o of teles)o.cool=40;
        shake=2;SFX.door();}
    }else tp.hold=Math.max(0,tp.hold-2);
    if(tp.cool>0){tp.cool--;tp.hold=0;}
  }
  /* the electric riders: they own their chain, and only a projectile argues */
  for(const z of zaps){
    if(z.gone)continue;
    z.t++;const v=vines[z.v];if(!v)continue;
    z.f+=0.006*z.dir;if(z.f>=1){z.f=1;z.dir=-1;}if(z.f<=0){z.f=0;z.dir=1;}
    const fi=z.f*(v.pts.length-1),i0=Math.floor(fi),fr=fi-i0;
    const a=v.pts[i0],b=v.pts[Math.min(i0+1,v.pts.length-1)];
    z.x=a.x+(b.x-a.x)*fr;z.y=a.y+(b.y-a.y)*fr;
    if(P.iframes<=0&&P.disco<=0&&Math.abs(P.x+P.w/2-z.x)<8&&Math.abs(P.y+P.h/2-z.y)<9)
      hurt(Math.sign(P.x+P.w/2-z.x)||1,20);
    for(let i=seeds.length-1;i>=0;i--){const sd=seeds[i];
      if(Math.abs(sd.x-z.x)<7&&Math.abs(sd.y-z.y)<7){
        z.gone=true;burst(z.x,z.y,'#7fd8ff',12,2.2);burst(z.x,z.y,'#ffffff',6,1.4);
        SFX.smash();if(!sd.big&&!sd.giant)seeds.splice(i,1);break;}}
  }
  /* behind the leaves: the window eases open around him, and the canopy rustles */
  {let hid=false;
   const ccx=Math.floor((P.x+P.w/2)/T),ccy=Math.floor((P.y+P.h/2)/T);
   if(at(ccx,ccy)===14)hid=true;
   else if(!sp(theme)&&folFront&&folDense&&folDense.length===MAPW*MAPH)
     hid=!!(folDense[ccy*MAPW+ccx]||folDense[Math.floor(P.y/T)*MAPW+ccx]);
   if(hid){const kk=folHole.a<0.05?1:0.22;
     folHole.x+=((P.x+P.w/2)-folHole.x)*kk;folHole.y+=((P.y+P.h/2)-folHole.y)*kk;}
   folHole.a+=((hid?1:0)-folHole.a)*0.14;
   if(hid&&(Math.abs(P.vx)>0.4||Math.abs(P.vy)>0.5)&&mapT%3===0){
     const PLq=folPalOf();
     particles.push({x:P.x+1+Math.random()*8,y:P.y-2+Math.random()*6,
       vx:(Math.random()-.5)*0.8,vy:0.4+Math.random()*0.7,life:14,
       c:PLq[(mapT>>2)%2][1+((Math.random()*2)|0)]});}
  }
  hudRecent.forEach((v2,k2)=>{if(v2<=1)hudRecent.delete(k2);else hudRecent.set(k2,v2-1);});
  for(const[k2,v2]of crateFall){if(v2<=1)crateFall.delete(k2);else crateFall.set(k2,v2-1);}
  for(let i=doorFX.length-1;i>=0;i--){doorFX[i].t--;if(doorFX[i].t<=0)doorFX.splice(i,1);}
}
function updateAmbient(){
  // crates cannot float: one gravity step every few frames, so collapses read as falls
  if(++graviT%6===0){
    for(let y2=MAPH-3;y2>=1;y2--)for(let x2=1;x2<MAPW-1;x2++){
      if(at(x2,y2)!==15||at(x2,y2+1)!==0)continue;
      const dx0=x2*T,dy0=(y2+1)*T;
      if(P.x+P.w>dx0&&P.x<dx0+T&&P.y+P.h>dy0&&P.y<dy0+T){
        // the crate does not wait: Chip is shoved a tile clear, or it holds its breath
        const free9=nx9=>!hitsX(nx9,P.y);
        let sh9=0;
        if(P.x+P.w/2<=dx0+8&&free9(P.x-T))sh9=-T;
        else if(free9(P.x+T))sh9=T;
        else if(free9(P.x-T))sh9=-T;
        if(!sh9)continue;
        P.x+=sh9;P.vx=sh9>0?1.4:-1.4;P.iframes=Math.max(P.iframes,10);
        burst(P.x+4,P.y+8,'#d8c08a',5,1.3);SFX.land();
      }
      setT(x2,y2+1,15);setT(x2,y2,0);
      crateFall.set((y2+1)*MAPW+x2,6);
      if(at(x2,y2+2)!==0){burst(x2*T+8,(y2+1)*T+14,'#a07a4a',3,0.9);}
    }
  }
  for(let i=lasers.length-1;i>=0;i--){
    const L4=lasers[i];L4.life--;
    if(L4.life<=0){lasers.splice(i,1);continue;}
    if(L4.life<=16&&P.iframes<=0&&!P.dancing&&P.disco<=0){
      const pxc=P.x+P.w/2,pyc=P.y+P.h/2;
      const dx5=L4.x1-L4.x0,dy5=L4.y1-L4.y0,len2=dx5*dx5+dy5*dy5||1;
      let t5=((pxc-L4.x0)*dx5+(pyc-L4.y0)*dy5)/len2;t5=Math.max(0,Math.min(1,t5));
      const qx=L4.x0+dx5*t5,qy=L4.y0+dy5*t5;
      if((pxc-qx)*(pxc-qx)+(pyc-qy)*(pyc-qy)<42)hurt(Math.sign(pxc-L4.x0)||1,20);
    }
  }
  for(const d2 of drips){
    if((mapT+d2.ph)%90===0)particles.push({x:d2.x*T+8,y:d2.y*T+2,vx:0,vy:0.35,life:34,c:'#8ad8f0'});}
  for(const w2 of wfalls){
    if(mapT%5===0)particles.push({x:w2.x*T+3+Math.random()*10,y:w2.y1*T-4,
      vx:(Math.random()-.5)*1.2,vy:-0.9,life:14,c:'#cfeeff'});}
  for(const dc of decor){
    if(dc.k==='fire'&&mapT%22===(dc.sd%22))particles.push({x:dc.x+8+(Math.random()-.5)*3,
      y:dc.y-12,vx:(Math.random()-.5)*0.3,vy:-0.55,life:30,c:'#9aa4ac'});}
  if(fish){
    fish.t++;
    fish.vy=Math.min(fish.vy+G,5);fish.y+=fish.vy;
    const ffx=Math.floor((fish.x+6)/T),ffy=Math.floor((fish.y+14)/T),ft2=at(ffx,ffy);
    if(HARD(ft2)||ONEWAY(ft2)){fish.y=ffy*T-14;fish.vy=0;fish.gr=true;}else fish.gr=false;
    const ddx=P.x-fish.x,adx=Math.abs(ddx),ady=Math.abs(P.y-fish.y);
    const scared=adx<84&&ady<64;
    const poof=()=>{burst(fish.x+6,fish.y+7,'#ff9ad8',14,2.2);SFX.npc();
      const pick=fishSpots[(fish.t*31+7)%fishSpots.length];
      fish.x=pick[0]*T+2;fish.y=pick[1]*T+2;fish.vy=0;};
    if(adx<15&&ady<15){                              // nearly caught: never.
      dex('fish');
      if(!fish.seen){fish.seen=true;say('FISH','gone before your fingers close');}
      poof();
    }else{
      if(scared){fish.dir=(-Math.sign(ddx))||fish.dir;dex('fish');}
      const spd=scared?1.9:0.55;
      if(fish.gr){
        const axx=Math.floor((fish.x+(fish.dir>0?13:-1))/T);
        const wall=HARD(at(axx,Math.floor((fish.y+8)/T)));
        const ground=at(axx,ffy);
        if(wall||!(HARD(ground)||ONEWAY(ground))){
          if(scared)poof();                          // cornered: she is simply elsewhere
          else fish.dir*=-1;
        }else fish.x+=fish.dir*spd;
        if(scared&&fish.t%46===0)fish.vy=-3.2;       // panicked hops
      }
    }
  }
  // the skull blocks spit darts at whoever walks their corridor
  for(const b of dartBlocks){
    if(at(b.x,b.y)!==21)continue;
    b.t++;
    const bx2=b.x*T+8,by2=b.y*T+8;
    const pdx=P.x+P.w/2-bx2,pdy=P.y+P.h/2-by2;
    // the skull tracks its corridor first, and only then fires down it
    if(Math.abs(pdx)<=150&&Math.abs(pdy)<=150){
      if(Math.abs(pdy)<40){const dir2=Math.sign(pdx)||1;
        if(at(b.x+dir2,b.y)===0)b.aim=[dir2,0];}
      else if(Math.abs(pdx)<40){const dv=Math.sign(pdy)||1;
        if(at(b.x,b.y+dv)===0)b.aim=[0,dv];}
    }
    if(b.t%130!==0)continue;
    if(Math.abs(pdx)>150||Math.abs(pdy)>150)continue;
    if(Math.abs(pdy)<40){
      const dir2=Math.sign(pdx)||1;
      if(at(b.x+dir2,b.y)===0){darts.push({x:bx2+dir2*9,y:by2,vx:dir2*2.4,life:180});SFX.seed();continue;}}
    if(Math.abs(pdx)<40){
      const dv=Math.sign(pdy)||1;
      if(at(b.x,b.y+dv)===0){darts.push({x:bx2,y:by2+dv*9,vx:0,vy:dv*2.4,life:180});SFX.seed();}}
  }
  for(let i=darts.length-1;i>=0;i--){
    const d=darts[i];d.x+=d.vx;
    if(d.g)d.vy=(d.vy||0)+d.g;
    d.y+=(d.vy||0);
    d.life--;
    const tt2=at(Math.floor(d.x/T),Math.floor(d.y/T));
    if(d.life<=0||HARD(tt2)){burst(d.x,d.y,'#8a94a4',4,1.1);darts.splice(i,1);continue;}
    if(!P.dancing&&P.disco<=0&&P.iframes<=0&&
       d.x>P.x-2&&d.x<P.x+P.w+2&&d.y>P.y-2&&d.y<P.y+P.h+2){
      hurt(Math.sign(P.x-d.x)||1,20);darts.splice(i,1);}
  }
}
function stepFX(){
  for(let i=particles.length-1;i>=0;i--){const q=particles[i];
    q.x+=q.vx;q.y+=q.vy;q.vy+=0.11;q.life--;if(q.life<=0)particles.splice(i,1);}
  for(const s of swings)if(!s.rider){
    s.vel+=-(0.0016)*Math.sin(s.ang);s.ang+=s.vel;
    const E=0.5*s.vel*s.vel+0.0016*(1-Math.cos(s.ang));
    if(E<0.00042)s.vel+=0.00012*(s.vel>=0?1:-1);   // the canopy breeze keeps every rope moving
  }
  if(shake>0)shake-=0.5;
  P.anim+=Math.abs(P.vx)*0.16+(P.grounded?0.012:0.024);
}
let worldSlow=1;
function updateMach(){
  P.gmul=1;
  worldSlow+=(((box)?0.12:1)-worldSlow)*0.1;   // machines wind down mid-conversation
  const cxp=P.x+P.w/2,cyp=P.y+P.h/2;
  for(const m of mach){
    m.t+=(m.sp||0)*worldSlow;
    if(m.k==='piston'){
      if(Math.abs(cxp-(m.x+24))<70&&Math.abs(cyp-m.y)<70)dex('piston');
      if(m.ext===undefined)m.ext=(m.ay||m.ax||20);   /* generated pistons name it 'ay' */
      const e=(Math.sin(m.t)*0.5+0.5)*m.ext;
      if(m.axis==='x'){const nx2=m.x0+e*(m.sgn||1);m.dy=0;m.dx=nx2-m.x;m.x=nx2;}
      else{const ny2=m.y0+e;m.dx=0;m.dy=ny2-m.y;m.y=ny2;}
      if(sp(theme)&&P.iframes<=0&&P.disco<=0){       // the spiked face bites
        const hx2=m.axis==='x'?(m.sgn>0?m.x+m.w:m.x-4):m.x,hw2=m.axis==='x'?4:m.w;
        const hy2=m.axis==='x'?m.y:m.y+m.h,hh2=m.axis==='x'?m.h:4;
        const fy2=m.axis==='x'?m.y:(m.y+m.h);
        if(P.x+P.w>hx2&&P.x<hx2+hw2&&P.y+P.h>(m.axis==='x'?m.y:fy2)&&P.y<(m.axis==='x'?m.y+m.h:fy2+4))
          hurt(Math.sign(P.x+P.w/2-(m.x+m.w/2))||1,20);
      }
    }else if(m.k==='plat'){
      const nx2=m.x0+Math.sin(m.t)*(m.ax||0),ny2=m.y0+Math.sin(m.t)*(m.ay||0);
      m.dx=nx2-m.x;m.dy=ny2-m.y;m.x=nx2;m.y=ny2;
    }else if(m.k==='cog'){
      const dx=cxp-m.x,dy=cyp-m.y;
      if(dx*dx+dy*dy<(m.r+5)*(m.r+5)){dex('cog');hurt(Math.sign(dx)||1,20);}
    }else if(m.k==='grav'){
      if(cxp>m.x&&cxp<m.x+m.w&&cyp>m.y&&cyp<m.y+m.h){
        P.gmul=m.g;
        if(Math.random()<0.14)particles.push({x:m.x+Math.random()*m.w,y:m.y+m.h,
          vx:0,vy:m.g<1?-0.8:0.9,life:26,c:m.g<1?'#a8e8ff':'#ff9ad8'});
      }
    }
  }
}
function collideMach(){
  P.riding=null;
  for(const m of mach){
    if(m.k!=='piston'&&m.k!=='plat')continue;
    if(!Number.isFinite(m.x)||!Number.isFinite(m.y)||
       !Number.isFinite(m.w)||!Number.isFinite(m.h))continue;   /* never trust a broken mover */
    if(P.x+P.w<=m.x||P.x>=m.x+m.w||P.y+P.h<=m.y||P.y>=m.y+m.h)continue;
    const dT=(P.y+P.h)-m.y,dB=(m.y+m.h)-P.y,dL=(P.x+P.w)-m.x,dR=(m.x+m.w)-P.x;
    const mn=Math.min(dT,dB,dL,dR);
    if(mn===dT&&P.vy>=-0.5){P.y=m.y-P.h;P.vy=0;P.grounded=true;P.riding=m;P.noCut=false;}
    else if(mn===dB){P.y=m.y+m.h;if(P.vy<0)P.vy=0;}
    else if(mn===dL){P.x=m.x-P.w;P.vx=0;}
    else{P.x=m.x+m.w;P.vx=0;}
  }
}
let motes=[];
function mutTrail(e,MU){
  const C={ember:['#ff8a2a','#ffd24a'],pollen:['#ffe07a','#fff0c0'],dust:['#d8d0c0','#f0ece0'],
    sand:['#e8c060','#fff0b8'],shade:['#5a68a8','#aab8ff'],bubble:['#8ae8d0','#dff8f0'],
    leaf:['#8a5ad0','#c8a2ff']}[MU.trail]||['#ffffff','#dddddd'];
  particles.push({x:e.x+e.w/2+(Math.random()-0.5)*4,y:e.y+e.h-1,
    vx:(Math.random()-0.5)*0.4,vy:MU.trail==='bubble'?-0.5:0.25,life:12,

function buildCode(){
  const node=Math.min(29,PR.node|0);
  let hid=0;for(let k=0;k<4;k++)if(PR.hidden[20+k])hid|=1<<k;
  const p=node|(hid<<5);                        // 9 bits of truth
  const v=(p|(codeChk(p)<<9))>>>0;              // + 6 bits of suspicion = 5 fruits
  const d=[];for(let i=0;i<5;i++)d.push((v>>>(i*3))&7);
  return d;
}
function applyCode(d){
  let v=0;for(let i=0;i<5;i++)v|=(d[i]&7)<<(i*3);v=v>>>0;
  const p=v&511,chk=(v>>>9)&63;
  if(codeChk(p)!==chk)return false;
  const node=p&31;if(node>29)return false;
  const hid=(p>>>5)&15;
  PR.node=node;PR.cling=true;                   // cling is a birthright, code or no code
  for(let i=0;i<Math.min(node,NMAIN);i++){PR.cleared[i]=true;
    const g2=LEVELS[i].g;if(g2)PR[g2]=true;}    // the tree re-grants what you had earned
  PR.hidden={};for(let k=0;k<4;k++)if(hid&(1<<k))PR.hidden[20+k]=true;
  PR.sawShip=node>=10;
  if(PR.seed)PR.equip='seed';else if(PR.pound)PR.equip='pound';
  PR.money=Math.max(PR.money,20+node*6);        // a stipend for the road back
  if(node>0)PR.chart=true;                      // anyone this far has walked the floor
  return true;
}

function markRoom(rx,ry){
  if(!map||inVault())return;
  const RXN=Math.ceil(MAPW/RW);
  if(rx<0||ry<0||rx>=RXN||ry>=Math.ceil(MAPH/RH))return;
  const k=String(curLevel);
  if(!PR.seenRooms[k])PR.seenRooms[k]=[];
  const id=ry*RXN+rx;
  if(PR.seenRooms[k].indexOf(id)<0)PR.seenRooms[k].push(id);
}
const roomSeen=(rx,ry)=>{
  const l=PR.seenRooms[String(curLevel)];
  if(!l)return false;
  return l.indexOf(ry*Math.ceil(MAPW/RW)+rx)>=0;
};
/* is this room edge open? only ever asked about rooms already walked */
function roomLink(rx,ry,dx,dy){
  const x0=rx*RW,y0=ry*RH;
  if(dx){const x=dx>0?x0+RW-1:x0;
    for(let y=y0;y<y0+RH&&y<MAPH;y++){const t=at(x,y),u=at(x+dx,y);
      if(!HARD(t)&&!HARD(u))return true;}
    return false;}
  const y=dy>0?y0+RH-1:y0;
  for(let x=x0;x<x0+RW&&x<MAPW;x++){const t=at(x,y),u=at(x,y+dy);
    if(!HARD(t)&&!HARD(u))return true;}
  return false;
}

const openable=i=>
  i===ALTAR?!!PR.cleared[9]:
  (i>=NMAIN+4?!!PR.cleared[XSRC[i-NMAIN-4]]:
  (i>=NMAIN?!!PR.hidden[i]:(i===0?true:(i===10?PR.sawShip:PR.cleared[i-1]))));
/* once the altar has been touched the tree is behind him, and stays behind him */
const sealedOff=i=>!!PR.sealed&&TREESIDE(i);
const unlocked=i=>openable(i)&&!sealedOff(i);
function updateMap(){
  mapT++;if(mapCool>0)mapCool--;
  // lean sideways at a fork to hop across to a side room
  if(!mapCool&&IN.x&&mapSel<NMAIN&&mapSel!==ALTAR){
    let kid=-1;
    HIDSRC.forEach((s2,k2)=>{if(s2===mapSel)kid=NMAIN+k2;});
    XSRC.forEach((s2,k2)=>{if(s2===mapSel)kid=NMAIN+4+k2;});
    if(kid>=0&&unlocked(kid)&&Math.sign(NODES[kid][0]-NODES[mapSel][0])===Math.sign(IN.x)){
      mapSel=kid;mapCool=14;SFX.select();}
  }
  if(!mapCool&&mapSel>=NMAIN&&mapSel!==ALTAR&&(IN.x||IN.y)){  // any lean brings Chip back to the trunk
    const src2=mapSel>=NMAIN+4?XSRC[mapSel-NMAIN-4]:HIDSRC[mapSel-NMAIN];
    mapSel=src2;mapCool=14;SFX.select();}
  const tp=trunkPos(mapSel);
  if(!mapCool&&(IN.y<0||IN.x>0)&&tp>=0){if(tp<TRUNK.length-1){
    const j=TRUNK[tp+1];
    if(unlocked(j)){mapSel=j;SFX.select();}else SFX.seal();
    mapCool=14;}}
  if(!mapCool&&(IN.y>0||IN.x<0)&&tp>0){
    const j=TRUNK[tp-1];
    if(unlocked(j)){mapSel=j;SFX.select();}else SFX.seal();
    mapCool=14;}
  const n=NODES[mapSel];
  chipMX+=(n[0]-chipMX)*0.2;chipMY+=(n[1]-chipMY)*0.2;
  mapCam+=((chipMY-VH/2)-mapCam)*0.12;
  mapCam=Math.max(0,Math.min(MAPH_M-VH,mapCam));
  if((IN.jumpP||IN.starP)){if(unlocked(mapSel)){mode='play';loadLevel(mapSel);}else SFX.seal();}
  stepFX();
}

function thornOrient(tx2,ty2,x2,y2){
  const sol=t2=>HARD(t2)||ONEWAY(t2);
  const below=sol(at(tx2,ty2+1)),above=sol(at(tx2,ty2-1)),
        left=sol(at(tx2-1,ty2)),right=sol(at(tx2+1,ty2));
  if(below)return false;                          // grown from the floor: as drawn
  cx.save();cx.translate(x2+T/2,y2+T/2);
  if(above)cx.scale(1,-1);                        // hung from the ceiling: points down
  else if(left)cx.rotate(Math.PI/2);              // bolted to the left wall: points right
  else if(right)cx.rotate(-Math.PI/2);            // bolted to the right wall: points left
  else{cx.restore();return false;}                // free-floating: leave it be
  cx.translate(-(x2+T/2),-(y2+T/2));
  return true;
}

function chipBody(){
  const F='#c07c3e',S='#8a5426',L='#f2cf9e',D='#2a1608';
  const walk=P.grounded&&Math.abs(P.vx)>0.15;

    const b=Math.floor(P.dancing/7)%4, up=(b===1||b===3)?-1:0, tilt=(b<2?1:-1);
    px(-3,7,3,2,S);px(-5,4,2,3,S);
    px(1,9+up,3,3,S);px(5,9+up,3,3-up,S);
    px(1,5+up,7,5,F);px(2,6+up,4,3,L);
    px(7,2+up*2,3,3,F);px(-1,2+up*2,3,3,F);
    px(9,tilt<0?0:1,2,2,F);px(-2,tilt<0?1:0,2,2,F);
    px(0,up,9,6,F);px(-1,1+up,2,3,S);px(8,1+up,2,3,S);px(1,1+up,6,4,L);
    px(2,2+up,1,1,D);px(5,2+up,1,1,D);px(3,4+up,3,1,D);
    return;
  }
  if(P.sleeping){                                 // flat out, dreaming of fruit
    px(-2,10,14,4,F);px(0,11,10,2,L);              // body along the mattress
    px(9,8,6,6,F);px(10,9,4,4,L);                  // head on the pillow
    px(11,10,2,1,D);px(13,11,1,1,D);               // closed eyes, small smile
    px(-4,11,3,2,S);px(-5,9,2,2,S);                // tail trailing off the quilt
    return;
  }
  if(P.sitting){                                  // couch mode: legs out, perfectly content
    px(0,4,9,6,F);px(1,5,6,4,L);
    px(2,6,1,1,D);px(5,6,1,1,D);px(3,8,2,1,S);
    px(1,9,7,4,F);px(2,10,4,3,L);
    px(6,11,4,2,S);px(9,11,2,2,F);                // legs forward over the cushion
    px(-3,10,3,2,S);px(-4,8,2,2,S);               // tail curled beside him
    return;
  }
  if(P.climbing){const r2=Math.floor(P.anim*6)%2;  // hand over hand up the rungs
    px(0,1,9,6,F);px(1,2,6,4,L);px(2,3,1,1,D);px(5,3,1,1,D);
    px(1,6,7,6,F);px(2,7,4,4,L);
    px(-1,r2?0:4,3,3,F);px(7,r2?4:0,3,3,F);
    px(2,12,3,2,S);px(5,12,3,2,S);
    px(-3,8,3,2,S);px(-4,5,2,3,S);
    return;
  }
  if(P.pounding){const r=Math.floor(P.anim*7)%4;
    px(1,3,7,7,F);px(2,4,4,4,L);px(r<2?0:6,2,3,2,S);px(r<2?6:0,8,3,2,S);px(3,5,1,2,D);return;}
  if(P.squash>0){px(0,6,10,6,F);px(2,7,5,4,L);px(0,4,9,3,F);px(1,5,6,2,L);
    px(2,5,1,1,D);px(6,5,1,1,D);return;}
  if(P.onVine||P.swing){                          // the tail does the climbing now
    const s2=Math.sin(P.anim*2)*1.5,sw2=Math.sin(P.anim*1.4)*1;
    px(5,-6,3,2,S);px(7,-5,2,3,S);px(6,-2,2,3,S);  // tail hooked over the vine
    px(4,-4,2,2,S);
    px(0,1+sw2*0,9,6,F);px(-1,2,2,3,S);px(8,2,2,3,S);   // head hangs below the hook
    px(1,2,6,4,L);px(2,3,1,2,D);px(5,3,1,2,D);px(3,5,2,1,S);
    px(1,7,7,6,F);px(2,8,4,4,L);                   // body
    px(-2,7+sw2,3,3,F);px(8,8-sw2,3,3,F);          // arms free — he can aim from here
    px(1,13+s2,3,3,S);px(5,13-s2,3,3,S);           // legs dangling
    return;}
  const tw=Math.sin(P.anim*2.2)*2;
  px(-3,7+idle,3,2,S);px(-5,5+tw+idle,2,3,S);px(-6,3+tw+idle,2,2,S);
  if(PR.jet&&P.jetHere){px(-2,4,3,6,'#7f8fa8');px(-1,4,1,6,'#c8d8e8');px(-2,10,3,1,'#4a5a6a');}
  if(P.cling){px(1,9,3,3,S);px(5,8,3,3,S);}
  else if(air){px(1,9,3,2,S);px(5,8,3,3,S);}
  else{px(1,9+idle,3,3-Math.round(sw),S);px(5,9+idle,3,3+Math.round(sw),S);}
  px(1,5+idle,7,5,F);px(2,6+idle,4,3,L);
  if(P.gliding){px(-2,4,4,2,F);px(7,4,4,2,F);px(-3,3,2,2,S);px(10,3,2,2,S);}
  else if(P.jetting){px(7,3,3,3,F);px(-1,3,3,3,F);}
  else if(P.cling){px(7,2,3,3,F);px(7,6,3,3,F);}
  else if(air){px(7,2,3,3,F);px(-1,3,3,3,F);}
  else{px(7,6+Math.round(sw)+idle,2,3,F);px(-1,6-Math.round(sw)+idle,2,3,F);}
  px(0,idle,9,6,F);px(-1,1+idle,2,3,S);px(8,1+idle,2,3,S);px(1,1+idle,6,4,L);
  const blink=(Math.floor(P.anim*0.6)%14)===0;
  if(blink){px(2,3+idle,1,1,D);px(5,3+idle,1,1,D);}
  else{px(2,2+idle,1,2,D);px(5,2+idle,1,2,D);}
  px(3,4+idle,2,1,S);
  if(P.cling)px(6,2+idle,1,1,D);
}
/* Fish. Same monkey build as Chip -- same head, same little arms, same tail.

function mushD(tx5,ty5,t5){
  const sq=mush.get(ty5*MAPW+tx5)||0;if(!sq)return 0;
  const dmax=t5===6?4:3;
  return Math.round(sq>10?dmax*Math.min(1,(14-sq)/2):dmax*(sq/10));   // quick press, long ease out
}
function chipSink(){
  if(mode!=='play'||!P.grounded)return 0;
  const fx5=Math.floor((P.x+P.w/2)/T),fy5=Math.floor((P.y+P.h+1)/T);
  const t5=at(fx5,fy5);

  return 2+mushD(fx5,fy5,t5);                    // his feet ride the cap, not the air above it

  if(PR.shield&&!P.dancing){                       // little spikes of rind

    const wob=Math.sin(mapT*0.11)>0?1:0;
    px(sx2-2,sy2+2+wob,1,2,'#9ade4a');px(sx2+9,sy2+3-wob,1,2,'#9ade4a');
    px(sx2+1,sy2-2+wob,2,1,'#9ade4a');px(sx2+5,sy2-2-wob,2,1,'#c8f07a');
    px(sx2-2,sy2+8-wob,1,2,'#6a9a2a');px(sx2+9,sy2+8+wob,1,2,'#6a9a2a');
  }
  if(P.disco>0){                                 // dancing rainbow chip
    const dx4=Math.round(P.x-camX)-1,dy4=Math.round(P.y-camY)-2;
    const sv=P.dancing;
    if(P.grounded&&Math.abs(P.vx)<0.4)P.dancing=P.disco;   // borrow the dance pose
    cx.save();cx.translate(dx4,dy4);chipBody();cx.restore();
    P.dancing=sv;
    cx.globalAlpha=0.42;
    cx.fillStyle='hsl('+((mapT*10)%360)+',95%,60%)';
    cx.fillRect(dx4-2,dy4-2,13,17);
    cx.globalAlpha=1;
    if(P.disco<90&&(mapT>>2)%2)return;           // flicker as it fades
    return;
  }
  if(P.iframes>0&&Math.floor(P.iframes/4)%2)return;
  const bx=Math.round(P.x-camX),by=Math.round(P.y-camY);
  cx.save();
  if(P.face<0){cx.translate(bx+P.w,by);cx.scale(-1,1);}else cx.translate(bx,by);
  chipBody();
  if(sp(theme)&&!P.dancing){                 // trim bubble helmet, not a fishbowl
    let hx=-1,hy=-1;
    if(P.onVine||P.swing){hy=0;}
    else if(P.pounding){hx=0;hy=2;}
    else if(P.squash>0){hy=3;}
    else{hy=(!P.grounded||Math.abs(P.vx)>0.15)?-1:
      (Math.sin(P.anim*1.6)>0?0:-1);}
    cx.globalAlpha=.34;px(hx,hy,11,8,'#a8e8ff');cx.globalAlpha=1;
    px(hx,hy,11,1,'#dff4ff');px(hx,hy,1,8,'#dff4ff');
    px(hx+10,hy,1,8,'#6ea8c8');px(hx,hy+7,11,1,'#6ea8c8');
    px(hx+1,hy+1,3,1,'#ffffff');px(hx+8,hy+3,1,2,'#c8f0ff');
  }
  cx.restore();
}

/* =====================================================================
   PRODUCE -- every cut drawn as the thing it actually is.
   Sprites live in a 14x14 box centred on (x,y). c1 is flesh/skin,
   c2 is the mark that tells you which fruit you are holding.
   ===================================================================== */
function shDark(c){                       /* a cheap shade of any hex */
  if(c[0]!=='#'||c.length<7)return c;
  const r=parseInt(c.slice(1,3),16),g2=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  const f=v=>Math.max(0,Math.round(v*0.62)).toString(16).padStart(2,'0');
  return '#'+f(r)+f(g2)+f(b);
}
function shLite(c){
  if(c[0]!=='#'||c.length<7)return c;
  const r=parseInt(c.slice(1,3),16),g2=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  const f=v=>Math.min(255,Math.round(v+(255-v)*0.45)).toString(16).padStart(2,'0');
  return '#'+f(r)+f(g2)+f(b);
}

/* ---- HUD ---- */
function drawSyringe(){
  const X=5,Y=5,BW=PR.bar,BH=11;
  px(X-4,Y+3,4,5,'#b8c8d0');px(X-5,Y+2,2,7,'#8fa4ae');
  px(X,Y,BW,BH,'#0d1f18');
  if(P.hpDisp===undefined)P.hpDisp=P.hp;
  P.hpDisp+=(P.hp-P.hpDisp)*0.08;                  // the level falls, it does not jump-cut
  if(Math.abs(P.hpDisp-P.hp)<0.4)P.hpDisp=P.hp;
  if(P.hpJit>0)P.hpJit--;
  const fr=Math.max(0,Math.min(1,P.hpDisp/PR.maxHP)),fw=Math.round((BW-2)*fr),low=fr<0.3;
  const jit=P.hpJit>0;
  const nlen=P.nightv>0?Math.round((BW-2)*Math.min(1,P.nightv/1500)):0,nxs=X+1+((BW-2)-nlen);
  const plen=P.pepper>0?Math.round((BW-2)*Math.min(1,P.pepper/560)):0,pxs=X+1+((BW-2)-plen);
  const liq=jit?((mapT>>1)%2?'#ff4a5a':'#ff8a6a')
    :low?(Math.floor(mapT/6)%2?'#ff5a6a':'#e04050'):'#3ce0b8';
  const x0=X+1+(BW-2-fw);                          // squeezed toward the needle, on the right
  px(x0,Y+1,fw,BH-2,jit?'#4a0e18':(low?'#3a1420':'#0a3a34'));
  for(let i=0;i<fw;i++){
    const wob=jit?(Math.sin(i*2.7+mapT*0.9)*1.6*(P.hpJit/40)):0;
    const amp=3.0+(jit?Math.sin(mapT*0.7+i)*1.4:0);
    const ph=(i*0.42)-mapT*(jit?0.3:0.09);
    const a=Math.sin(ph)*amp+wob,b=Math.sin(ph+Math.PI)*amp-wob;
    const ya=Y+1+(BH-2)/2+a,yb=Y+1+(BH-2)/2+b;
    // only the helix inside each clock wears its colour: red for pepper, orange for carrot
    let sA=liq,sB=jit?'#ffd0b8':(low?'#ffb0b8':'#a8f8e0'),
        sBar=jit?'#a02030':(low?'#7a2030':'#177a68');
    if(!jit&&plen>0&&x0+i>=pxs){sA='#ff4a3a';sB='#ffc8a8';sBar='#a02018';}
    else if(!jit&&nlen>0&&x0+i>=nxs){sA='#ff9a3a';sB='#ffd9a0';sBar='#a85a18';}
    if(i%3===0){const t0=Math.min(ya,yb),t1=Math.max(ya,yb);
      px(x0+i,t0,1,Math.max(1,t1-t0),sBar);}
    px(x0+i,ya,1,2,sA);px(x0+i,yb,1,2,sB);
  }
  if(nlen>0){                                      // the carrot's clock, wound around the helix

function decorFront(){
  const S=sp(theme);
  const x0=Math.floor(camX/T)-1,x1=Math.ceil((camX+VW)/T);
  const y0=Math.floor(camY/T)-1,y1=Math.ceil((camY+VH)/T);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const t=at(x,y);
    if(t!==2&&t!==11&&t!==1)continue;
    if(at(x,y-1)!==0)continue;
    const r=H3(x,y,19);
    const dx2=x*T-camX,dy2=y*T-camY;
    if(S){
      if(r<0.18){px(dx2+3,dy2-3,3,3,'#3a4658');px(dx2+4,dy2-4,1,1,r<0.09?'#7fd8ff':'#ff6a4a');}

    }else{

        for(let i=0;i<5;i++){const gx=dx2+i*3+1,gh=2+((H3(x,y,i)*4)|0);
          px(gx,dy2-gh,1,gh,i%2?'#3fa85c':'#57c46a');}
      }
      if(r<0.13){                              // flower
        const fc=['#ff6a9a','#ffd93a','#c07aff','#ff9a3a'][(r*100|0)%4];
        px(dx2+9,dy2-6,3,3,fc);px(dx2+8,dy2-5,5,1,fc);px(dx2+10,dy2-5,1,1,'#fff');
        px(dx2+10,dy2-3,1,3,'#2f8f46');

        px(dx2+2,dy2+6,2,4,'#2f8f46');px(dx2+11,dy2+6,2,6,'#256b48');

/* reality gets unreliable the deeper into the ship you go */
function glitch(){

  const intensity=(curLevel-14)/6;
  if(Math.random()>0.03+intensity*0.05)return;
  const bands=1+((Math.random()*3)|0);
  for(let i=0;i<bands;i++){
    const y=(Math.random()*VH)|0,h=2+((Math.random()*10)|0),off=((Math.random()-0.5)*18)|0;
    if(cx.getImageData){
      try{cx.putImageData(cx.getImageData(0,y,VW,h),off,y);}catch(err){}
    }

      px(0,y,VW,h,Math.random()<0.5?'#ff2a6a':'#2affd8');cx.globalAlpha=1;}
  }
}

  decorFront();
  drawCover();
  cx.globalAlpha=1;cx.restore();
  {const tgt=levelDark?(P.nightv>0?0.14:0.62):0;    // ease between darkness and light
   darkA+=(tgt-darkA)*0.055;
   if(darkA>0.02){
    cx.fillStyle='rgba(3,8,14,'+darkA.toFixed(3)+')';cx.fillRect(0,0,VW,VH);
    const lf=Math.min(1,darkA/0.62);                // lights fade with the veil
    const glow=(gx3,gy3,r3,c3)=>{
      cx.globalCompositeOperation='lighter';
      cx.globalAlpha=.10*lf;px(gx3-r3,gy3-r3,r3*2,r3*2,c3);

    for(const gf of glowflies){

            gy3=gf.y+Math.sin(mapT*0.045+gf.ph*2)*5-camY;

    for(const s of seeds)if(s.fire)                  // and every fireball burns its own red hole
      glow(s.x-camX,s.y-camY,22,'#ff4a2a');
    for(const h of huts){                            // and every lit window does too
      const hx3=h.x+8-camX,hy3=h.y+4-camY;
      if(hx3>-40&&hx3<VW+40&&hy3>-40&&hy3<VH+40){

        px(h.x+3-camX,h.y+2-camY,4,4,'#ffefaa');px(h.x+10-camX,h.y+2-camY,4,4,'#ffefaa');}}
    if(P.pepper>0){glow(P.x+P.w/2-camX,P.y+P.h/2-camY,36,'#ff9a4a');  // ghost pepper burns
      drawChip();}                                   // ...and only then does he stand in the light
    else if(PR.wand){glow(P.x+P.w/2-camX,P.y+P.h/2-camY,30,'#c8a2ff');
      drawChip();}                                   // otherwise the dark takes him like everything else
   }}
  glitch();
  hud();
  drawFortuneCard();
  if(P.dead){cx.fillStyle='rgba(10,4,6,'+Math.min(.75,(60-P.dead)/40)+')';cx.fillRect(0,0,VW,VH);
    text(P.fainting?'chip blacks out':'serum depleted',VW/2,VH/2,'#ff5a7a','center');
    if(P.fainting&&P.dead<60)text('ground lost',VW/2,VH/2+12,'#a8607a','center');}
}
