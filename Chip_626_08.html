function renderMap(){
  const g=cx.createLinearGradient(0,0,0,VH);
  const deep=mapCam/(MAPH_M-VH);
  g.addColorStop(0,deep<0.5?'#06122e':'#3fb88a');
  g.addColorStop(1,deep<0.5?'#010208':'#05231a');
  cx.fillStyle=g;cx.fillRect(0,0,VW,VH);
  const C=y=>y-mapCam;
  // ship above, tree below, elevator between
  for(let i=0;i<50;i++){const sy2=(i*61)%MAPH_M;
    if(C(sy2)>-4&&C(sy2)<VH)px((i*97)%VW,C(sy2),1,1,'#9fb8d0');}
  px(58,C(0),60,C(300)-C(0),'#2a3a52');px(58,C(0),8,C(300)-C(0),'#46608a');
  px(110,C(0),8,C(300)-C(0),'#182436');
  for(let i=0;i<14;i++)px(66,C(20+i*20),44,3,'#101a2a');
  for(let i=0;i<6;i++)px(72+i*9,C(60),5,5,i%2?'#7fd8ff':'#2a4a6a');
  px(68,C(300),40,10,'#5a6a86');px(74,C(304),28,4,'#7fd8ff');   // elevator car
  {const sy4=C(292);                                            // and the saucer that owns it
   if(sy4>-24&&sy4<VH+24){
     const hov=Math.sin(mapT*0.05)*1.5;
     px(62,sy4+hov,52,6,'#8a94a8');px(66,sy4-3+hov,44,4,'#a8b4c8');
     px(78,sy4-8+hov,20,6,'#7fd8ff');px(82,sy4-7+hov,10,3,'#dff4ff');
     for(let li=0;li<5;li++)px(68+li*10,sy4+2+hov,3,2,(mapT>>3)%5===li?'#ffe07a':'#3a4a68');
     cx.globalAlpha=.18;px(70,sy4+6+hov,36,296-sy4,'#7fd8ff');cx.globalAlpha=1;}}
  /* ---- the Great Kapok. It fills out as Chip clears the boughs, and it
         goes grey and quiet once the altar has sent him up. ---- */
  const grown=Math.min(1,PR.cleared.slice(0,10).filter(Boolean).length/8);
  const gone=!!PR.sealed;
  if(gone)cx.globalAlpha=0.42;
  for(let yy=310;yy<680;yy+=4){                  // tapering trunk
    const f2=(yy-310)/370,hw=15+f2*17,cy2=C(yy);
    if(cy2<-6||cy2>VH+6)continue;
    px(88-hw,cy2,hw*2,4,gone?'#3a3630':'#4a2e14');
    px(88-hw,cy2,6,4,gone?'#4e4a42':'#6b4420');px(88+hw-8,cy2,4,4,gone?'#241f1a':'#2c1808');
    if((yy>>3)%5===0)px(88-hw+8+((yy*13)%12),cy2,3,4,gone?'#2a2620':'#301c0a');
    if(!gone&&grown>0.35&&(yy>>4)%7===0)px(88-hw+3,cy2,2,3,'#3a6a2a');
  }
  for(let i2=0;i2<5;i2++){                       // root flare
    const rx2=30+i2*26,ry2=C(648+(i2%2)*10);
    if(ry2>-10&&ry2<VH+10){px(rx2,ry2,22,8,'#4a2e14');px(rx2,ry2,22,2,'#6b4420');
      px(rx2+4,ry2+8,14,5,'#3a2410');}
  }
  for(let i2=0;i2<10;i2++){                      // giant branches out to the tree stages
    const n2=NODES[i2],by2=C(n2[1]+4);
    if(by2<-30||by2>VH+30)continue;
    const dir2=n2[0]<88?-1:1,x0=88+dir2*14,x1=n2[0]+dir2*16;
    const ln=Math.abs(x1-x0);
    for(let s2=0;s2<=ln;s2+=3){
      const f2=s2/Math.max(1,ln),bx2=x0+dir2*s2,byy=by2-Math.sin(f2*1.4)*5;
      px(bx2,byy,4,4-Math.round(f2*2),'#5e3616');
      if(s2%9===0)px(bx2,byy-1,3,1,'#7a4a20');
    }
    // the foliage is fuller on a bough whose stage is done
    const done2=PR.cleared[i2];
    const g1=gone?'#4a4e42':(done2?'#2f8f46':'#4a5e3a'),
          g2=gone?'#5a5e50':(done2?'#3fa855':'#5e7048'),
          g3=gone?'#6a6e5e':(done2?'#57c46a':'#6e8058');
    px(x1-3,by2-9,8,4,g1);px(x1-6,by2-7,7,4,g2);px(x1+1,by2-6,8,4,g3);
    if(done2&&!gone){px(x1-2,by2-12,6,3,'#6ade8a');
      if(grown>0.5)px(x1+2,by2-11,2,2,'#ffb0d8');            // blossom
      if(PR.fruit[i2])px(x1-5,by2-4,3,3,'#ffd93a');}         // and fruit, if it was found
    const vx2=x0+dir2*ln*0.55,vsw=gone?0:Math.sin(mapT*0.04+i2)*2;
    for(let v2=0;v2<10;v2++)px(vx2+vsw*(v2/10),by2+2+v2*2,1,2,v2%3?g1:g2);
    if(!gone&&(i2*7)%3===0)px(vx2+vsw,by2+22,2,2,'#ffd93a');
  }
  for(let i2=0;i2<11;i2++){                      // the crown, thickening with progress
    const lx2=14+((i2*47)%146),ly2=C(316+((i2*97)%84));
    if(ly2>-9&&ly2<VH+9){cx.globalAlpha=(gone?0.30:0.55+grown*0.35);
      px(lx2,ly2,12,5,gone?'#4a4e42':(grown>0.5?'#1f6b34':'#3c4a34'));
      px(lx2+2,ly2-3,9,4,gone?'#5a5e50':(grown>0.5?'#2f8f46':'#4a5a40'));
      px(lx2+4,ly2-5,5,3,gone?'#6a6e5e':(grown>0.5?'#57c46a':'#5e7048'));
      cx.globalAlpha=1;}
  }
  if(!gone&&grown>0.75)for(let i2=0;i2<6;i2++){  // birds, once it is truly alive
    const bxx=20+((i2*61)%140)+Math.sin(mapT*0.02+i2)*6,byy=C(302+((i2*53)%70));
    if(byy>-6&&byy<VH+6){px(bxx,byy,3,1,'#e8f4d8');px(bxx+3,byy-1,3,1,'#e8f4d8');}
  }
  cx.globalAlpha=1;
  /* ---- the altar shelf, sitting on the crown ---- */
  {const ay=C(NODES[ALTAR][1]);
   if(ay>-30&&ay<VH+30){
     px(60,ay+6,56,5,'#6e7268');px(60,ay+6,56,1,'#8f9388');
     for(let i2=0;i2<5;i2++){const sx3=64+i2*12;
       px(sx3,ay-4,4,10,'#7a7e74');px(sx3,ay-4,4,1,'#a2a69a');
       px(sx3,ay-7,4,3,'#83877c');}
     px(82,ay-10,12,6,'#83877c');px(83,ay-9,10,3,PR.altarDone?'#ffd93a':'#4a4e46');
     if(PR.altarDone){cx.globalAlpha=.35+.25*Math.sin(mapT*0.08);
       px(78,ay-16,20,10,'#ffd93a');cx.globalAlpha=1;}
   }}
  for(let i2=10;i2<20;i2++){                     // spars from the hull to the ship stages
    const n2=NODES[i2],sy3=C(n2[1]);
    if(sy3<-8||sy3>VH+8)continue;
    const dir2=n2[0]<88?-1:1,x0=88+dir2*26;
    px(Math.min(x0,n2[0]),sy3+2,Math.abs(n2[0]-x0),2,'#2e3a4e');
    px(Math.min(x0,n2[0]),sy3+2,Math.abs(n2[0]-x0),1,'#46608a');
  }
  /* the path draws itself in as each stage opens */
  for(let ti=0;ti<TRUNK.length-1;ti++){
    const i=TRUNK[ti],j=TRUNK[ti+1];
    if(!openable(j))continue;
    const a=NODES[i],b=NODES[j],open=PR.cleared[i];
    if(sealedOff(i)&&sealedOff(j))cx.globalAlpha=0.4;
    for(let s=1;s<9;s++){const t=s/9;
      const mx=a[0]+(b[0]-a[0])*t,my=C(a[1]+(b[1]-a[1])*t+Math.sin(t*3.14)*6);
      if(my>-4&&my<VH)px(mx-1,my-1,2,2,open?(i<9||i===ALTAR?'#8fe8a8':'#8fd8ff'):'#24493c');}
    cx.globalAlpha=1;
  }
  const sideLink=(src2,kid2)=>{
    if(!unlocked(kid2))return;
    const a=NODES[src2],b=NODES[kid2];
    for(let s=1;s<7;s++){const t=s/7;
      const mx=a[0]+(b[0]-a[0])*t,my=C(a[1]+(b[1]-a[1])*t-Math.sin(t*3.14)*4);
      if(my>-4&&my<VH)px(mx-1,my-1,2,2,kid2<NMAIN+4?'#e8c85a':'#c8a2ff');}
  };
  HIDSRC.forEach((src2,k2)=>sideLink(src2,NMAIN+k2));
  XSRC.forEach((src2,k2)=>sideLink(src2,NMAIN+4+k2));
  NODES.forEach((n,i)=>{
    const y=C(n[1]);if(y<-20||y>VH+20)return;
    const open=unlocked(i),done=PR.cleared[i],sel=i===mapSel,shut=sealedOff(i);

    mapDoodad(i,n[0],y);
    if(sel){const r=7+Math.sin(mapT*0.12)*1.5;cx.globalAlpha=.35;
      px(n[0]-r-3,y-r-3,r*2+6,r*2+6,'#ffd93a');cx.globalAlpha=1;}
    px(n[0]-6,y-6,12,12,done?(i<10?'#2f8f46':'#2a5a8a'):'#8a5426');
    px(n[0]-4,y-4,8,8,done?(i<10?'#6ade8a':'#7fd8ff'):'#c07c3e');

      n[0],y+3,done?'#0d3a20':'#f8e8c8','center');
    cx.globalAlpha=1;

  drawChipMap(chipMX,C(chipMY)-10);
  for(const q of particles){cx.globalAlpha=Math.min(1,q.life/14);px(q.x,q.y,2,2,q.c);}cx.globalAlpha=1;

  }

  else if(sc==='depart'){                            /* one pod, one monkey, one loop */

      for(let k2=0;k2<10;k2++){const a2=ang-k2*0.3;

      cx.globalAlpha=1;}
    px(bx-14,by,30,14,'#2a3a52');px(bx-14,by,30,3,'#6a8ab0');                   // the pod
    px(bx-2,by+3,10,8,'#0c1420');px(bx-1,by+4,8,6,'#7fd8ff');                   // the porthole
    px(bx+1,by+6,5,4,'#a86b3c');px(bx+2,by+6,3,2,'#c8a888');                    // and Chip in it
    px(bx+2,by+7,1,1,'#241a10');px(bx+4,by+7,1,1,'#241a10');
    const fl=(t>>1)%3;
    px(bx-20,by+5,5+fl,3,fl?'#ffd24a':'#ff7a3a');px(bx-23,by+6,3,1,'#ff7a3a');  // the sputter
  }

  else if(sc==='mirror'){                            /* a tube with a chip in it */

    cx.globalAlpha=flick;
    for(let y2=30;y2<VH-40;y2+=14)px(8,y2,VW-16,1,'#16202e');
    px(34,60,44,120,'#182a34');px(36,62,40,116,'#1e3844');                      // the tube
    px(38,64,3,112,'#3a5a68');px(30,52,52,8,'#2a3a48');px(30,180,52,8,'#2a3a48');
    const wave=t>170;
    cinChip(56,150,{pose:wave?'dance':'stand',flipX:true});                     // the copy
    cinChip(118,150,{pose:'stand'});                                            // the original
    if(wave&&(t>>3)%2)text('?',124,128,'#7fd8ff','center');
    for(let k2=0;k2<6;k2++){const by2=66+((t*0.6+k2*21)%110);                   // bubbles in the tank
      px(44+((k2*11)%28),by2,2,2,'#3a6a78');}

    if(t<110)cinChip(w1,VH-90,{pose:'walk'});                                   // he walks past
    else{cinChip(VW-40,VH-90,{pose:'stand',flipX:true});                        // and watches...
      if(t<210)cinChip(20+(t-110)*1.1,VH-90,{pose:'walk'});                     // ...himself walk past
      else cinChip(VW-64,VH-90,{pose:'stand'});}
    if(t>60&&t<250){                                                            // she is in the frame twice
      const fa=((t*2.2)%(VW+80))-40;

      cx.globalAlpha=.45;cinFish(fa-34,VH-52,t+9,1);cx.globalAlpha=1;}
    if(t>210){                                                                  // the noise opens one eye
      const op=Math.min(10,(t-210)*0.5);

  }

  else if(sc==='groove'){                            /* the conga forms itself */

    const lead=((t*1.3)%(VW+120))-60;
    const st=(t>>3)%2;                                                          // the boombox struts
    px(lead-8,VH-77,3,5+st,'#2a2e38');px(lead+5,VH-77,3,6-st,'#2a2e38');
    px(lead-12,VH-92,24,15,'#2a2e38');px(lead-12,VH-92,24,2,'#5a6272');
    px(lead-9,VH-89,7,7,'#12161c');px(lead+2,VH-89,7,7,'#12161c');
    px(lead-8,VH-88,5,5,st?'#ffd93a':'#e8a02a');px(lead+3,VH-88,5,5,st?'#e8a02a':'#ffd93a');
    cinFish(lead-24,VH-72-Math.abs(Math.sin(t*0.15))*5,t,1);                    // she leads it, of course
    for(let k2=0;k2<4;k2++){                                                    // the conga line

      px(kx,VH-80-hop,6,4,['#8ade4a','#e8d44a','#ffb04a','#ff8ac0'][k2]);
      px(kx+1,VH-79-hop,1,1,'#241a10');px(kx+4,VH-79-hop,1,1,'#241a10');}
    cinChip(lead-96,VH-92+Math.abs(Math.sin(t*0.15+4))*-4,{pose:'dance'});      // chip at the back
  }

  else{                                              /* fallback: a quiet jungle beat */
    const g=cx.createLinearGradient(0,0,0,VH);

  if(rdy)text('STAR',VW-14,VH-52,Math.sin(t*0.15)>0?'#fff':'#7aa892','right');

/* the longer reading, per entry; fruits write their own price tag */
const DEXMORE={
 bubble:'Bubble fruit (family Aerocarpaceae) is a translucent berry whose rind never fully hardens, leaving a pressurised pocket of sweet air at its heart. The skin reads as glass but gives like a soap film. Burst against the chest it grants one held jump; where a jetpack operates, the escaping air refuels it entirely. Wild stock grows on updrafts and nowhere else.',
 key:'The stage key is a cast brass single-ward key of no fixed maker. Its teeth re-cut themselves to the first locked door they meet, which consumes the key outright. Collectors note a faint fruit-press pattern on the bow, suggesting the canopy smiths cast them from old juicing plates. It does not carry to the next stage.',
 cling:'The rind shield is the intact husk of a studded jackfruit, cured until the studs set like rivets. Worn over the shoulders it absorbs exactly one blow before splitting along its seam. The interior smells faintly of banana no matter what fruit it came from. This is unexplained.',
 glide:'Glide wings are the paired bracts of the dragonfruit flower, dried on the stem until they hold their curl. Held overhead they argue with gravity; gravity concedes a little. The pink fades with use but the lift does not.',

 coco:'The stone shell is the densest fruit of its world, husk cured to a knuckled shell. Bowled flat along the ground, crates and bugs barely slow it; only honest stone stops it. Each disc grows its own: slag shells in the forge, drowned shells under Lyonesse. All of them are heavy in the best way.',
 cherry:'The twin cherry is a double drupe on one shared stem, a botanical rarity prized for sympathy magic: while it lasts, every loose fruit on the stage swells to double. The stem always forks at precisely 34 degrees. Nobody has measured why.',

 magnet:'The fruit magnet is a horseshoe of lodestone that has spent long enough buried in an orchard to confuse its poles. Fruit leans toward its carrier from a branch away. The attraction is broken the moment the carrier is hurt, out of what can only be called tact.',
 mint:'The frost drop is a wound sugar coin, its spiral arm laid in a single unbroken thread to the rim. Dissolved into the seed pouch it fires frozen rounds; a bug frozen solid slides when struck, and takes its neighbours with it. On the colder discs the spiral winds the other way.',
 wand:'The magic wand is a hazel core wrapped in seven windings of unnamed wire, one per world. Held, every weapon carried fires at once. It is lost the moment its keeper is hurt, returning to circulation by means nobody has observed and everybody has theories about.',
 fweddle:'The fweddle is not a flower; it is a promise the meadow made and intends to keep. Its five hundred wild seeds fly out and loop home like loyal boomerangs. The husk at the centre is warm to hold. Do not plant it. It plants itself.',
 disco:'The disco fruit is a mirrored berry that ripens only under artificial light. Eaten, the whole stage dances and enemies fall over their own feet. The rind is faceted in true squares, which fruit cannot do, and yet.',
 carrot:'The night carrot is a bioluminescent taproot cultivated in dark stages. Eaten, the dark politely steps back a while; the syringe keeps the clock in orange. The greens are mildly luminous for a day after harvest and make an irresponsible salad.',
 avocado:'The barrel avocado is an outsized cultivar whose stone displaces nearly half the fruit. Eaten, it enlarges the serum barrel by 25 and fills it to the brim, permanently. The wood of its parent tree is prized for syringe stocks, closing a neat circle.',
 pepper:'The ember pod is a ghost pepper left one season too long, until the burn became self-sustaining. Carried, fire pours out on its own until the burn runs off the red clock. Handle by the stem. There is no other advice.',
 chart:'The rolled chart is drawn on pressed leaf-vellum in an unknown surveying hand. Once carried, MAP sketches every room its keeper walks. The margins hold small pencil corrections that predate the stages they correct.',
 trink:'Trinkets are the loose currency of the canopy: washers, pearls, femurs of unremarked provenance, gems in honest cuts. The neighbours pay well for them, less for what they are than for the pleasure of sorting them.',
 quill:'The quill dart is a stiffened spine harvested from whatever the disc grows spines on -- thistle, urchin, basalt, thorn. Three leave the hand at once in a shallow fan and none of them stop at the first thing they meet. The pouch takes twenty-four and no more, which is a property of the fletching and not of the pouch.',
 sap:'The sap glob is drawn from a wounded trunk and kept warm. Thrown, it arcs badly and lands worse; whatever it lands on stops moving for about seven seconds. It does not freeze -- a rooted thing stays exactly where it was, and will not slide into its neighbours. This is the trade.',
 shard:'The glass shard is knapped from whatever the disc has instead of glass: obsidian, sea-glass, hive-glass, amber. It is the fastest thing in the pouch and it will argue with three walls before it settles, which makes it the only round that can be fired around a corner by somebody patient.',
 spore:'The puffball is picked just before it would have opened on its own. On impact it becomes a cloud that hangs where it was put and quietly ends anything that walks through. The cloud does not care which direction it was thrown. Neither, in the end, does the thrower.',
 bola:'The bola is two weights on a short cord, spun once and released. It wraps legs. It has enough left over for a second set of legs, and then it is finished. Some discs weight it with stone, one with cold iron, and Lyonesse with a knot of net that nobody will admit to tying.',
 prism:'The light prism is a cut stone that holds one lance of daylight and gives it back all at once. It travels in a straight line at a speed the eye reports as instant, and it does not stop for bugs, crates, or opinions. Three to a pouch. Nobody has explained the limit.',
 gourd:'The gourd bomb is a hollowed winter squash packed with whatever the disc considers volatile. It bounces -- twice, usually -- and then it does not. The blast opens crates two tiles out and settles arguments in a wide circle. The fuse is short and honest.',
 sdisk:'The eighth cabinet in the aft arcade is called FWEDDLE QUEST and nobody on the manifest will admit to loading it. Eight rooms, none of which appear on any deck plan, each one folded over on itself three and four times. Clear all eight and the machine gives up a disc: no label, no catalogue number, a sleeve that looks like oil on a puddle. Weird As Funk, the captain calls it, and she does not explain how she knows.',
 rooted:'A rooted thing is not frozen. Ice makes a bug into a sliding weight you can bowl at its neighbours; sap and cord make it into furniture. Rooting lasts a little under half as long as ice and cannot be used to clear a shelf. It can, however, be used to stand somewhere that was recently occupied.',
 plated:'Three of the seven discs armour their crawlers -- Elysiae in marble, Lyonesse in barnacle, and the world tree in bark. A plated shell takes the first stomp as a chip: the shell cracks, the monkey bounces, and the second stomp lands as normal. A ground pound skips the argument entirely.',
 mut0:'FJALAR STRAIN. Crusted in cooled slag with the seams still lit. They run half again as fast as anything else in the seven discs and leave embers behind them. Fire holds no terror for something that was assembled in a forge.',
 mut1:'WYNNLAND STRAIN. Burred, seed-headed, bleached by a sun that has not moved in living memory. They leap rather than walk, and the leap tightens when they notice you. The pollen they shed is harmless and gets everywhere.',
 mut2:'ELYSIAE STRAIN. Plated in quarried marble and veined like the halls they patrol. Slow, heavy, and proof against a single stomp. The chip mark left by the first blow is permanent; collectors of such things say no two crack alike.',
 mut3:'DUAT STRAIN. Gilt carapace, kohl-marked eyes, scarab wings. They notice a monkey at some distance and correct their heading without hurry. The fliers of this disc will drop on a target from directly overhead, which is thought to be a religious matter.',
 mut4:'DUAT II STRAIN. Half present. The shell holds caught starlight and the outline lags a frame behind the body, which makes them difficult to stomp and easy to miss entirely. They drift wider and slower than any other strain.',
 mut5:'LYONESSE STRAIN. Barnacled, weeded, and slick. The encrustation counts as armour. They hop in the manner of things that spent a long time not needing to walk, and they trail bubbles even where there is plainly no water.',
 mut6:'ELYSIAE II STRAIN. Bark-plated, thorned, with a lit heart visible through the seam. Armoured, fast, leaping, and they notice a monkey from further off than anything else alive. The last disc did not hold back. Neither should you.',
 rare:'The stage specimen is a fruit grown nowhere else: one per stage, its colour and cut unique to that ground. Collectors keep them uneaten. Chip eats them. Both are correct.'};
function updateDex(){
  mapT++;
  if(dexCool>0)dexCool--;
  if(dexDetail){                                   // the close reading: JUMP steps back
    if(IN.jumpP){dexDetail=0;SFX.select();}
    stepFX();return;
  }
  if(!dexCool&&IN.y){dexScroll=Math.max(0,dexScroll+IN.y*14);dexCool=4;}
  if(!dexCool&&IN.x){dexSel+=IN.x;dexCool=5;SFX.tick&&SFX.tick();}
  if(IN.starP){                                    // STAR reads deeper into what is known
    const en=dexEntryAt(dexSel);
    if(en&&PR.dex[en.id]){dexDetail=1;SFX.select();}
    else SFX.locked();
  }
  if(IN.jumpP){mode=dexBack;SFX.select();}
  stepFX();
}

function renderDex(){

  const sel=((dexSel%400)+400)%400;
  cx.save();
  DEX.forEach(sec=>{
    const got=sec.e.filter(en=>PR.dex[en.id]);

    if(y>-14&&y<VH)text(sec.g+'  '+got.length+'/'+sec.e.length,10,y,'#ffd93a');
    y+=12;
    sec.e.forEach((en,i)=>{
      const col=i%3,rowy=y+Math.floor(i/3)*30;

        if(en._gi===sel){px(cxp-16,rowy-12,32,26,'#2e2410');       // the reading finger
          px(cxp-16,rowy-12,32,1,'#ffd93a');px(cxp-16,rowy+13,32,1,'#ffd93a');
          px(cxp-16,rowy-12,1,26,'#ffd93a');px(cxp+15,rowy-12,1,26,'#ffd93a');}
        if(PR.dex[en.id]){en.draw(cxp,rowy-2);text(en.label.slice(0,9),cxp,rowy+11,'#c8b890','center');
          if(en._gi===sel)selEntry=en;}
        else{text('?',cxp,rowy+2,'#4a3a20','center');text('- - -',cxp,rowy+11,'#3a2e1a','center');
          if(en._gi===sel)selEntry={hidden:true};}
      }else if(en._gi===sel&&PR.dex[en.id])selEntry=en;
    });
    y+=Math.ceil(sec.e.length/3)*30+6;

  cx.fillStyle='rgba(14,10,5,.94)';cx.fillRect(0,VH-26,VW,26);
  px(0,VH-26,VW,1,'#4a3a20');
  if(selEntry&&selEntry.hidden)text('not yet found',VW/2,VH-15,'#4a3a20','center');
  else if(selEntry&&selEntry.d){
    const wd=selEntry.d.split(' ');let l1='',l2='';
    for(const w3 of wd){if((l1+' '+w3).trim().length<=30&&!l2)l1=(l1+' '+w3).trim();else l2=(l2+' '+w3).trim();}
    text(l1,VW/2,VH-18,'#c8b890','center');
    if(l2)text(l2.slice(0,32),VW/2,VH-9,'#c8b890','center');
  }else if(selEntry)text(selEntry.label,VW/2,VH-15,'#8a7a5a','center');
  const maxS=Math.max(0,y+dexScroll-VH+30);
  if(dexScroll>maxS)dexScroll=maxS;
  cx.fillStyle='rgba(14,10,5,.92)';cx.fillRect(0,0,VW,24);
  text('ALMANAC  '+found+'/'+total,VW/2,11,'#ffd93a','center');
  text('STAR reads deeper · JUMP closes',VW/2,20,'#8a7a5a','center');
  topButtons();
}

/* ---- the hollowed log: a long safe corridor, no bugs, no fruit, no hurry ---- */
let LOGW=440;
function enterLog(){
  LOGW=logDoor.vault?1240:440;          // the outlier run is long. that is the whole idea.
  const sd0=((logDoor.x|0)*17+(logDoor.y|0)*29+curLevel*7)>>>0;
  logRoom={save:{x:P.x,y:P.y,cx:camX,cy:camY},t:0,cam:0,
    fate:fateLog?{x:Math.floor(LOGW*0.62)}:null,
    wedding:(!logDoor.vault)&&sd0%7===0,wsaid:false,
    vault:!!logDoor.vault,hatch:LOGW-46,said:false,
    seed:sd0};
  P.x=20;P.y=VH-64-P.h;P.vx=0;P.vy=0;P.grounded=true;P.sitting=false;P.climbing=false;
  P.onVine=false;P.swing=null;P.pounding=false;box=null;
  mode='log';SFX.door();
  if(logRoom.vault)say('A LONG NARROW LOG','it does not end where a log should');
  else say('INSIDE THE LOG','nothing in here but quiet');
}
function exitLog(){
  fortuneShow=null;
  const sv=logRoom.save;
  P.x=sv.x;P.y=sv.y;P.vx=0;P.vy=0;P.iframes=30;
  camX=sv.cx;camY=sv.cy;logRoom=null;
  roomX=Math.floor(P.x/(RW*T));roomY=Math.floor(P.y/(RH*T));
  mode='play';SFX.door();
}
function updateLog(){
  mapT++;logRoom.t++;
  const FL=VH-64;
  if(logRoom.vault&&!logRoom.said&&P.x>LOGW*0.45){
    logRoom.said=true;SFX.npc();say('SOMETHING AHEAD','the grain runs the wrong way here');}
  const tg=IN.x*MAXSPD;
  if(IN.x){P.vx+=Math.sign(tg-P.vx)*ACC;P.face=IN.x;}else P.vx*=FRIC;
  if(Math.abs(P.vx)>MAXSPD)P.vx=Math.sign(P.vx)*MAXSPD;
  if(Math.abs(P.vx)<0.05)P.vx=0;
  P.x=Math.max(10,Math.min(LOGW-18,P.x+P.vx));
  P.vy=Math.min(P.vy+G,MAXFALL);P.y+=P.vy;
  if(P.y+P.h>=FL){P.y=FL-P.h;P.vy=0;P.grounded=true;}else P.grounded=false;
  if(IN.jumpP&&P.grounded){P.vy=JUMPV*0.85;P.grounded=false;SFX.jump();}
  logRoom.cam+=((P.x-VW/2)-logRoom.cam)*0.12;
  logRoom.cam=Math.max(0,Math.min(LOGW-VW,logRoom.cam));
  if(logRoom.wedding&&!logRoom.wsaid&&Math.abs(P.x-(LOGW*0.4))<46){
    logRoom.wsaid=true;SFX.npc();
    say('A MOUSE WEDDING','you were, apparently, invited');}
  if(IN.starP){
    if(fortuneShow){fortuneShow=null;SFX.select();}
    else if(logRoom.fate&&Math.abs(P.x+P.w/2-(logRoom.fate.x+7))<16){
      fortuneShow=buildCode();SFX.rare();dex('fortune');}
    else if(logRoom.vault&&Math.abs(P.x+P.w/2-logRoom.hatch)<18)enterVault();
    else if(P.x<28||(!logRoom.vault&&P.x>LOGW-34))exitLog();
  }
  P.anim+=Math.abs(P.vx)*0.16+(P.grounded?0.012:0.024);
  stepFX();
}

function startPachinko(){
  mode='pach';SFX.coin();
  const sd=(curLevel*73+29+((house&&house.seed)||0)*131)>>>0;
  const R2=n=>{const v=Math.sin(sd*12.9898+n*78.233)*43758.5453;return v-Math.floor(v);};
  const pegs=[];
  const rows=8+Math.floor(R2(1)*3);
  for(let r=0;r<rows;r++)for(let c=0;c<8;c++){
    if(R2(r*17+c*3)<0.16)continue;                   // gaps carve lanes
    const x=18+c*20+(r%2?10:0)+Math.floor(R2(r*7+c)*6-3),y=64+r*21;
    if(x>10&&x<VW-10)pegs.push({x,y});
  }
  const movers=[];                                    // sweeping paddles
  for(let k=0;k<2+(sd%2);k++)movers.push({
    x0:30+Math.floor(R2(50+k)*(VW-60)),y0:84+Math.floor(R2(60+k)*140),
    amp:14+Math.floor(R2(70+k)*16),sp:0.02+R2(80+k)*0.03,ph:R2(90+k)*6.28,
    vert:R2(95+k)<0.35,x:0,y:0});
  const rails=[];                                     // brass marble chutes
  for(let k=0;k<2;k++)rails.push({
    x:26+Math.floor(R2(100+k)*(VW-52)),
    y0:70+Math.floor(R2(110+k)*60),len:40+Math.floor(R2(120+k)*50)});
  const pockets=[];                                   // bonus pockets, if this cabinet has them
  const np2=(sd%3===0)?2:(sd%3===1?1:0);
  for(let k=0;k<np2;k++)pockets.push({
    x:24+Math.floor(R2(130+k)*(VW-48)),y:110+Math.floor(R2(140+k)*120),
    val:2*(6+Math.floor(R2(150+k)*10)),t:0});
  const bins=[1,3,8,2,15,2,8,3,1].map((v,i2)=>v+((sd>>i2)&1));
  pach={pegs,movers,rails,pockets,bins,balls:[],aim:VW/2,won:0,t:0,flash:0,spent:0,sd};
}
function updatePach(){
  mapT++;pach.t++;
  if(pach.flash>0)pach.flash--;
  for(const mv of pach.movers){                       // paddles sweep their arcs
    const o=Math.sin(pach.t*mv.sp+mv.ph)*mv.amp;
    mv.x=mv.x0+(mv.vert?0:o);mv.y=mv.y0+(mv.vert?o:0);
  }
  pach.aim+=IN.x*2.4;
  pach.aim=Math.max(14,Math.min(VW-14,pach.aim));
  if((IN.jumpP||IN.actP)){                            // spam away — each ball costs coin
    if(PR.money>=25){addF(-25);pach.spent+=25;
      pach.balls.push({x:pach.aim,y:50,vx:(Math.random()-.5)*0.6,vy:0});SFX.jump();}
    else SFX.locked();
  }
  if(IN.starP){mode='play';payout(pach.won);return;}
  for(let bi2=pach.balls.length-1;bi2>=0;bi2--){
    const b=pach.balls[bi2];
    b.vy=Math.min(b.vy+0.16,4.2);b.x+=b.vx;b.y+=b.vy;b.vx*=0.995;
    const hitPeg=(px2,py2,rr)=>{
      const dx=b.x-px2,dy=b.y-py2,d=Math.hypot(dx,dy);
      if(d<rr){
        const nx=dx/(d||1),ny=dy/(d||1);
        b.x=px2+nx*rr;b.y=py2+ny*rr;
        const dot=b.vx*nx+b.vy*ny;
        b.vx=(b.vx-2*dot*nx)*0.62+(Math.random()-.5)*0.5;
        b.vy=(b.vy-2*dot*ny)*0.62;
        SFX.select();return true;}
      return false;};
    for(const p of pach.pegs)hitPeg(p.x,p.y,6);
    for(const mv of pach.movers)if(hitPeg(mv.x,mv.y,7))b.vx+=Math.sin(pach.t*mv.sp+mv.ph+1.57)*mv.amp*mv.sp*1.4;
    for(const rl of pach.rails){                      // chute walls shepherd the marble
      if(b.y>rl.y0&&b.y<rl.y0+rl.len&&Math.abs(b.x-rl.x)<4){
        b.x=rl.x+(b.x<rl.x?-4:4);b.vx=(b.x<rl.x?-1:1)*Math.abs(b.vx)*0.7;SFX.select();}
    }
    let potted=false;
    for(const pk of pach.pockets){                    // bonus pockets swallow it whole
      if(Math.hypot(b.x-pk.x,b.y-pk.y)<7){
        pach.won+=pk.val;pk.t=24;pach.flash=24;SFX.rare();
        ring(pk.x,pk.y,'#ffd93a',12);potted=true;break;}
    }
    if(potted){pach.balls.splice(bi2,1);continue;}
    if(b.x<8){b.x=8;b.vx=Math.abs(b.vx)*0.7;}
    if(b.x>VW-8){b.x=VW-8;b.vx=-Math.abs(b.vx)*0.7;}
    if(b.y>VH-34){
      const c2=Math.max(0,Math.min(pach.bins.length-1,Math.floor((b.x-8)/((VW-16)/pach.bins.length))));
      pach.won+=pach.bins[c2];pach.flash=24;SFX.coin();
      ring(b.x,b.y,'#ffd93a',10);
      pach.balls.splice(bi2,1);
    }
  }
  for(const pk of pach.pockets)if(pk.t>0)pk.t--;
  stepFX();
}

function mkCard(rnd){
  const v=()=>1+((Math.random()*9)|0);
  return{n:v(),e:v(),s:v(),w:v(),o:0,f:(Math.random()*8)|0};
}
function startCards(){
  mode='cards';SFX.coin();
  cards={grid:new Array(9).fill(null),hand:[],ai:[],sel:0,cell:0,turn:0,t:0,over:0,msg:''};
  for(let i=0;i<5;i++){cards.hand.push(mkCard());cards.ai.push(mkCard());}
}
function place(idx,card,owner){
  cards.grid[idx]=card;card.o=owner;
  const r=Math.floor(idx/3),c=idx%3;
  const nb=[[-3,'n','s'],[3,'s','n'],[-1,'w','e'],[1,'e','w']];
  nb.forEach(([d,mine,theirs])=>{
    const j=idx+d;
    if(j<0||j>8)return;
    if(d===-1&&c===0)return;
    if(d===1&&c===2)return;
    const t=cards.grid[j];
    if(!t||t.o===owner)return;
    if(card[mine]>t[theirs]){t.o=owner;SFX.fruit();ring(0,0,'#ffd93a',1);}
  });
}
function updateCards(){
  mapT++;cards.t++;
  if(cards.over){if(IN.starP||IN.jumpP){mode='play';payout(cards.over===1?12:cards.over===2?4:0);}return;}
  if(cards.turn===0){
    if(IN.actP&&cards.hand.length)cards.sel=(cards.sel+1)%cards.hand.length;
    if(cards.t%9===0){
      if(IN.x>0)cards.cell=Math.min(8,cards.cell+1);
      if(IN.x<0)cards.cell=Math.max(0,cards.cell-1);
      if(IN.y>0)cards.cell=Math.min(8,cards.cell+3);
      if(IN.y<0)cards.cell=Math.max(0,cards.cell-3);
    }
    if(IN.jumpP&&!cards.grid[cards.cell]&&cards.hand.length){
      place(cards.cell,cards.hand.splice(cards.sel,1)[0],0);
      cards.sel=0;cards.turn=1;cards.t=0;SFX.select();
    }
  }else if(cards.t>34){
    const open=[];
    for(let i=0;i<9;i++)if(!cards.grid[i])open.push(i);
    if(open.length&&cards.ai.length){
      let best=null;
      for(const i of open)for(let h=0;h<cards.ai.length;h++){
        const before=cards.grid.filter(c=>c&&c.o===0).length;
        const copy=cards.grid.slice();
        const sc=(cards.ai[h].n+cards.ai[h].e+cards.ai[h].s+cards.ai[h].w)/40+Math.random()*0.5;
        if(!best||sc>best.sc)best={i,h,sc};
      }
      place(best.i,cards.ai.splice(best.h,1)[0],1);
      cards.turn=0;cards.t=0;
    }else cards.turn=0;

   FOLIAGE  --  leaves, the way the original Chip wore them.
   Nothing here is ever put in `map`. No leaf has ever stopped anybody.
   Two baked layers: one behind the wood, one in front of everything,
   so Chip walks *into* the canopy instead of on top of a sticker.

/* --- one leaf, rasterised once per direction+size, then reused --- */
function bakeLeafSprites(){
  const out=[];
  for(let d=0;d<8;d++){
    const ang=d*Math.PI/4,ca=Math.cos(ang),sa=Math.sin(ang);
    const bySize=[];
    for(let L=3;L<=9;L++){
      const cells=new Map();
      const steps=L*2;
      for(let i=0;i<=steps;i++){
        const f=i/steps;
        const w=Math.round(Math.sin(f*Math.PI)*L*0.40);
        const bx=ca*i*0.5,by=sa*i*0.5;
        for(let k=-w;k<=w;k++){
          const X=Math.round(bx-sa*k),Y=Math.round(by+ca*k),key=X+','+Y;
          if(k===0||!cells.has(key))cells.set(key,k===0?1:0);
        }
      }
      const rows=new Map();
      cells.forEach((v,key)=>{const c=key.indexOf(',');
        const a=+key.slice(0,c),b=+key.slice(c+1);
        if(!rows.has(b))rows.set(b,[]);rows.get(b).push([a,v]);});
      const rects=[];
      rows.forEach((arr,y)=>{
        arr.sort((p,q)=>p[0]-q[0]);
        let i=0;
        while(i<arr.length){
          let j=i;
          while(j+1<arr.length&&arr[j+1][0]===arr[j][0]+1&&arr[j+1][1]===arr[i][1])j++;
          rects.push([arr[i][0],y,arr[j][0]-arr[i][0]+1,arr[i][1]]);
          i=j+1;}
      });
      bySize.push(rects);
    }
    out.push(bySize);
  }
  return out;
}

function moveBoomboxToEnd(){
  if(!boombox||!map)return;
  const open=t=>!HARD(t)||t===12||t===5||t===15||t===21;
  const sx=Math.floor((P.x+4)/T),sy=Math.floor((P.y+6)/T);
  if(sx<0||sy<0||sx>=MAPW||sy>=MAPH)return;
  const dist=new Int32Array(MAPW*MAPH).fill(-1);
  let q=[sy*MAPW+sx];dist[sy*MAPW+sx]=0;
  const nb=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    const nx2=[];
    for(const k of q){
      const x=k%MAPW,y=(k/MAPW)|0;
      for(let i=0;i<4;i++){
        const a=x+nb[i][0],b=y+nb[i][1];
        if(a<1||b<1||a>=MAPW-1||b>=MAPH-1)continue;
        const kk=b*MAPW+a;
        if(dist[kk]>=0||!open(map[kk]))continue;
        dist[kk]=dist[k]+1;nx2.push(kk);
      }
    }
    q=nx2;
  }
  let best=null,bd=-1;
  for(let y=2;y<MAPH-1;y++)for(let x=1;x<MAPW-1;x++){
    const k=y*MAPW+x;
    if(dist[k]<0||map[k]!==0)continue;
    if(map[(y-1)*MAPW+x]!==0)continue;              // needs headroom for the dance
    if(x>1&&map[k-1]!==0)continue;
    if(x<MAPW-2&&map[k+1]!==0)continue;             // and elbow room either side
    const below=map[(y+1)*MAPW+x];
    if(!(HARD(below)||ONEWAY(below))||below===20||below===15||below===21)continue;
    let clash=false;
    for(const n2 of npcs)if(Math.abs(n2.x-x*T)<20&&Math.abs(n2.y-y*T)<20){clash=true;break;}
    if(clash)continue;
    if(dist[k]>bd){bd=dist[k];best=[x,y];}
  }
  if(best){boombox.x=best[0]*T+8;boombox.y=best[1]*T+8;boombox.t=0;}
}
function ensureKeys(){

  const NM=MAPW*MAPH,seenD=new Uint8Array(NM),groups=[];
  for(let k9=0;k9<NM;k9++){

    const g9=[],st9=[k9];seenD[k9]=1;
    while(st9.length){const c9=st9.pop();g9.push(c9);
      const cx9=c9%MAPW,cy9=(c9/MAPW)|0;
      const nb9=[[1,0],[-1,0],[0,1],[0,-1]];
      for(let i9=0;i9<4;i9++){
        const a9=cx9+nb9[i9][0],b9=cy9+nb9[i9][1];
        if(a9<0||b9<0||a9>=MAPW||b9>=MAPH)continue;
        const kk9=b9*MAPW+a9;

    groups.push(g9);}

  const opened=new Uint8Array(groups.length);
  const sx9=Math.floor((P.safeX+4)/T),sy9=Math.floor((P.safeY+6)/T);
  if(sx9<0||sy9<0||sx9>=MAPW||sy9>=MAPH)return;
  let guard=0;
  while(guard++<groups.length+6){
    const doorOf=new Int32Array(NM).fill(-1);
    groups.forEach((g9,i9)=>{if(!opened[i9])for(const c9 of g9)doorOf[c9]=i9;});
    const seen9=new Uint8Array(NM),st9=[sy9*MAPW+sx9];seen9[st9[0]]=1;
    while(st9.length){const k9=st9.pop(),x9=k9%MAPW,y9=(k9/MAPW)|0;
      const nb9=[[1,0],[-1,0],[0,1],[0,-1]];
      for(let i9=0;i9<4;i9++){
        const a9=x9+nb9[i9][0],b9=y9+nb9[i9][1];
        if(a9<0||b9<0||a9>=MAPW||b9>=MAPH)continue;
        const kk9=b9*MAPW+a9;
        if(seen9[kk9]||doorOf[kk9]>=0)continue;
        const t9=map[kk9];
        if(!(pass9(t9)||t9===12))continue;      // an opened door reads as floor
        seen9[kk9]=1;st9.push(kk9);}}
    const near9=k9=>{const x9=k9%MAPW,y9=(k9/MAPW)|0;
      return(x9>0&&seen9[k9-1])||(x9<MAPW-1&&seen9[k9+1])||
            (y9>0&&seen9[k9-MAPW])||(y9<MAPH-1&&seen9[k9+MAPW]);};
    let adj=-1;
    for(let g9=0;g9<groups.length;g9++)
      if(!opened[g9]&&groups[g9].some(near9)){adj=g9;break;}
    if(adj<0)break;                              // whatever is left was never ours to reach
    let kAvail=0;
    for(const p9 of pickups)if(p9.kind==='key'&&!p9.got){
      const kk9=Math.floor(p9.y/T)*MAPW+Math.floor(p9.x/T);
      if(seen9[kk9]||near9(kk9))kAvail++;}
    let oCount=0;for(let g9=0;g9<groups.length;g9++)if(opened[g9])oCount++;
    if(kAvail>oCount){opened[adj]=1;continue;}   // a spare key answers this door
    let spot=null;                               // otherwise the stage grows one
    for(let y9=1;y9<MAPH-1&&!spot;y9++)for(let x9=1;x9<MAPW-1&&!spot;x9++){
      const k9=y9*MAPW+x9;
      if(!seen9[k9]||map[k9]!==0)continue;
      const b9=map[(y9+1)*MAPW+x9];
      if(b9!==1&&b9!==3&&b9!==5)continue;
      if(Math.abs(x9*T-P.safeX)<48&&Math.abs(y9*T-P.safeY)<48)continue;
      let cl9=false;
      for(const p9 of pickups)if(!p9.got&&Math.abs(p9.x-(x9*T+8))<14&&Math.abs(p9.y-(y9*T+8))<14){cl9=true;break;}
      if(!cl9)spot=[x9,y9];}
    if(!spot)for(let y9=1;y9<MAPH-1&&!spot;y9++)for(let x9=1;x9<MAPW-1&&!spot;x9++){
      const k9=y9*MAPW+x9;
      if(seen9[k9]&&map[k9]===0)spot=[x9,y9];}

}
function mapReach(){
  /* Careful, this one. A rope strung through a one-tile wall is a corridor in
     this game, so plain tile-adjacency badly under-counts what Chip can get to.
     So: the ropes get counted, and we only ever curtain SMALL pockets. If a
     whole quarter of a stage comes back unreachable, that is this function
     being wrong rather than the stage being sealed, and we draw nothing. */
  sealedCells=null;secretCells=null;
  if(!map)return;
  const NM=MAPW*MAPH;
  // a door and a toll gate are prices, not walls
  const open=t=>!HARD(t)||t===12||t===20;
  const softT=t=>open(t)||t===5||t===15||t===21||t===23;
  const porous=new Uint8Array(NM);
  const mark=(wx,wy)=>{const x=Math.floor(wx/T),y=Math.floor(wy/T);
    if(x>=0&&y>=0&&x<MAPW&&y<MAPH)porous[y*MAPW+x]=1;};
  for(const v of vines){                          // a vine is a doorway wherever it hangs
    for(let i=0;i<v.pts.length;i++){
      const a=v.pts[i],b=v.pts[Math.min(v.pts.length-1,i+1)];
      for(let f=0;f<=1.001;f+=0.2)mark(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f);
    }
  }
  for(const sw of swings){                        // and a swinging one is a wide doorway
    for(let ang=-1.3;ang<=1.3;ang+=0.13)
      for(let f=0.2;f<=1.02;f+=0.08)
        mark(sw.ax+Math.sin(ang)*sw.len*f,sw.ay+Math.cos(ang)*sw.len*f);
  }
  const sx=Math.floor((P.x+4)/T),sy=Math.floor((P.y+6)/T);
  if(sx<0||sy<0||sx>=MAPW||sy>=MAPH)return;
  const flood=(pass)=>{
    const seen=new Uint8Array(NM),st=[sy*MAPW+sx];
    seen[sy*MAPW+sx]=1;
    while(st.length){
      const k=st.pop(),x=k%MAPW,y=(k/MAPW)|0;
      const nb=[[1,0],[-1,0],[0,1],[0,-1]];
      for(let i=0;i<4;i++){
        const nx=x+nb[i][0],ny=y+nb[i][1];
        if(nx<0||ny<0||nx>=MAPW||ny>=MAPH)continue;
        const kk=ny*MAPW+nx;
        if(seen[kk])continue;
        if(!pass(map[kk])&&!porous[kk])continue;
        seen[kk]=1;st.push(kk);
      }
    }
    return seen;
  };
  const walked=flood(open),digging=flood(softT);
  const comp=new Int32Array(NM).fill(-1);
  const size=[],soft=[];
  let n=0,airTotal=0,lost=0;
  for(let k=0;k<NM;k++)if(map[k]===0)airTotal++;
  for(let k=0;k<NM;k++){                          // pocket by pocket, not tile by tile
    if(map[k]!==0||walked[k]||comp[k]>=0)continue;
    const st=[k];comp[k]=n;let sz=0,isSoft=false;
    while(st.length){
      const c=st.pop();sz++;
      if(digging[c])isSoft=true;
      const x=c%MAPW,y=(c/MAPW)|0;
      const nb=[[1,0],[-1,0],[0,1],[0,-1]];
      for(let i=0;i<4;i++){
        const a=x+nb[i][0],b=y+nb[i][1];
        if(a<0||b<0||a>=MAPW||b>=MAPH)continue;
        const kk=b*MAPW+a;
        if(map[kk]!==0||walked[kk]||comp[kk]>=0)continue;
        comp[kk]=n;st.push(kk);
      }
    }
    size.push(sz);soft.push(isSoft);lost+=sz;n++;
  }
  if(!airTotal||lost>airTotal*0.30)return;        // we are the ones who are wrong. draw nothing.
  const MAXPOCKET=90;
  sealedCells=new Uint8Array(NM);
  secretCells=new Uint8Array(NM);
  for(let k=0;k<NM;k++){
    const c=comp[k];
    if(c<0||size[c]>MAXPOCKET)continue;
    if(soft[c])secretCells[k]=1;else sealedCells[k]=1;
  }
  /* a pocket with something in it is a secret, not a dead end */
  const flip=new Uint8Array(n);
  const bump=(wx,wy)=>{const x=Math.floor(wx/T),y=Math.floor(wy/T);
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MAPW||ny>=MAPH)continue;
      const k=ny*MAPW+nx;if(comp[k]>=0)flip[comp[k]]=1;}};
  for(const q of pickups)bump(q.x,q.y);
  if(goldbox)bump(goldbox.x,goldbox.y);
  if(boombox)bump(boombox.x,boombox.y);
  for(let k=0;k<NM;k++){
    const c=comp[k];
    if(c>=0&&flip[c]&&sealedCells[k]){sealedCells[k]=0;secretCells[k]=1;}
  }
}

/* ---------- bake ---------- */
function FD(x,y){if(folDense&&x>=0&&y>=0&&x<MAPW&&y<MAPH)folDense[y*MAPW+x]=1;}
/* an irregular leaf mass: no square ever grew on a tree */
function leafMass(g,X,Y,seed,c,pad){
  pad=pad||1;const HH=T+pad*2;
  for(let ry=-pad;ry<T+pad;ry++){
    const rr=(ry+pad)/(HH-1);
    const shrink=Math.round((1-Math.sin(rr*Math.PI))*3);
    const e1=((((seed*331)|0)+ry*57)&7)%3+shrink;
    const e2=((((seed*577)|0)+ry*91)&7)%3+shrink;
    const lx=-pad+e1,rx=T+pad-e2;
    if(rx>lx)fpx(g,X+lx,Y+ry,rx-lx,1,c);
  }
}
function bakeFoliage(){

  if(!LEAFSPR)LEAFSPR=bakeLeafSprites();
  const W=MAPW*T+folPad*2,H=MAPH*T+folPad*2;
  if(W*H>9000000)return;                       // absurd map: skip rather than stall
  const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;
    const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g];};
  const[cb,gb]=mk(),[cf,gf]=mk();

  for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++){
    const t=at(x,y);if(!wood(t))continue;
    const X=x*T+O,Y=y*T+O;

    const up=air(x,y-1),dn=air(x,y+1),lf=air(x-1,y),rt=air(x+1,y);

      }
    }
    /* --- B. boughs: a branch tile is a twig, and twigs carry leaves --- */
    if(t===2){
      const endL=!(at(x-1,y)===2),endR=!(at(x+1,y)===2);
      const heavy=endL||endR;
      if(r2<(heavy?0.95:0.5)){
        const side=endL?-1:(endR?1:(r<0.5?-1:1));
        const bx=X+(side<0?1:T-2),by=Y+2;
        leafClump(gb,bx,by-2,side<0?5:7,5+((r2*4)|0),r2+0.7,PL[0],3);
        leafClump(gf,bx+side*2,by+2,side<0?3:1,4+((r*3)|0),r+0.2,PL[1],2);
        FD(x,y);FD(x+side,y);
      }

        const hx=X+2+((r3*140)|0)%11;
        leafClump(gf,hx,Y+7,2,4+((r3*4)|0),r3,PL[0],4);
        if(r3<0.2)leafClump(gf,hx+3,Y+12,2,4,r3+0.4,PL[1],3);

    }
    /* --- C. trunk ferns: sprays off a vertical face --- */
    if((lf||rt)&&!up&&r3<0.30){
      const side=lf?-1:1;
      const bx=X+(side<0?0:T-1),by=Y+3+((r*9)|0);
      leafClump(gb,bx+side,by,side<0?4:0,4+((r2*3)|0),r3+0.55,PL[1],3);
    }
    /* --- D. curtains: a ceiling grows a trailing strand --- */
    if(dn&&t!==2&&r2>0.74){
      const hx=X+3+((r2*160)|0)%9;
      const len=2+((r*4)|0);
      for(let i=0;i<len;i++){
        fpx(gf,hx,Y+T+i*4,1,4,i%2?'#2f6b3a':'#245c38');
        leafClump(gf,hx-1+((i%2)?1:-1),Y+T+2+i*4,i%2?1:3,3+((r3*2)|0),r2+i*0.17,PL[0],0);

    const sealed=sealedCells[k],secret=secretCells[k];

      for(let i=0;i<4;i++)
        leafClump(gf,X+1+((r*103+i*31)|0)%13,Y+1+((r2*79+i*43)|0)%13,
          (i*2+((r2*8)|0))%8,4+((r*3)|0),r2+i*0.19,PL[1],0);
      // punch the gaps back out so the room behind winks through
      const hn=2+((r*3)|0);
      for(let i=0;i<hn;i++){
        const hx=X+3+((r2*137+i*53)|0)%10,hy=Y+3+((r*151+i*47)|0)%10;
        gf.clearRect(hx,hy,2+((r2*2)|0),2+((r*2)|0));
      }
      if(r<0.18){const hx=X+4+((r*61)|0)%8,hy=Y+4+((r2*67)|0)%8;

  }
  /* --- G. dense mats: whole patches where the wood disappears under leaf --- */
  for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++){
    const t=at(x,y);if(!wood(t))continue;
    if(!(air(x,y-1)||air(x,y+1)||air(x-1,y)||air(x+1,y)))continue;   /* buried wood grows nothing */
    if(H3(x>>2,y>>2,171)>=0.46||H3(x,y,173)>=0.74)continue;

    for(let i=0;i<5;i++)
      leafClump(gf,X+1+((r*89+i*31)|0)%13,Y+1+((r2*97+i*41)|0)%13,
        (i*3+((r*8)|0))%8,4+((r2*3)|0),r+i*0.29,i<3?PL[0]:PL[1],0);
  }
  /* --- H. big hanging strips: many trees leaning together, curtains of them --- */
  for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++){
    const t=at(x,y);if(!wood(t)||!air(x,y+1))continue;
    if(!(air(x,y-1)||air(x-1,y)||air(x+1,y)))continue;
    if(H3(x>>1,y,187)>=0.24)continue;

    for(let col=0;col<2;col++){
      const hx=X+3+col*8+((r2*60)|0)%3;
      for(let i=0;i<len;i++){
        if(air(x,y+1+((i*4/T)|0))===false&&i>0)break;
        fpx(gf,hx,Y+T+i*5,2,5,i%2?'#2f6b3a':'#245c38');
        leafClump(gf,hx-2+((i+col)%2)*3,Y+T+2+i*5,(i*3+col*2)%8,4+((r*3)|0),r+i*0.21+col*0.5,PL[col?1:0],0);
        leafClump(gf,hx+1,Y+T+4+i*5,(i*5+1)%8,3+((r2*3)|0),r2+i*0.17,PL[0],0);
      }
    }

  }

  {const FL=C6FLORA[theme]||C6FLORA.tree;
   for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++){
     const t=at(x,y);
     /* a bloom grows out of wood, or up from ground it is standing on --

     if(!onWood&&!onGround)continue;

   }}
  /* --- I. the border: past the level's edge it is simply more jungle --- */
  {const ring=(gx,gy,gw,gh)=>{fpx(gf,gx,gy,gw,gh,PL[0][0]);
    for(let yy=gy;yy<gy+gh;yy+=9)for(let xx=gx;xx<gx+gw;xx+=9){
      const rr=H3(xx,yy,197);
      leafClump(gf,xx+((rr*7)|0),yy+((rr*11)|0)%7,((rr*8)|0)%8,4+((rr*3)|0),rr,rr<0.5?PL[0]:PL[1],0);}};
   ring(0,0,W,O);ring(0,H-O,W,O);ring(0,O,O,H-O*2);ring(W-O,O,O,H-O*2);
   for(let xx=O;xx<W-O;xx+=7){const rr=H3(xx,1,199);
     leafClump(gf,xx,O+((rr*5)|0)-2,((rr*8)|0)%8,4+((rr*3)|0),rr,PL[0],0);
     leafClump(gf,xx+3,H-O-((rr*5)|0)+2,((rr*9)|0)%8,4+((rr*3)|0),rr+0.3,PL[1],0);}
   for(let yy=O;yy<H-O;yy+=7){const rr=H3(2,yy,199);
     leafClump(gf,O+((rr*5)|0)-2,yy,((rr*8)|0)%8,4+((rr*3)|0),rr+0.1,PL[0],0);
     leafClump(gf,W-O-((rr*5)|0)+2,yy+3,((rr*9)|0)%8,4+((rr*3)|0),rr+0.5,PL[1],0);}}
  /* --- J. campfires keep a clearing: no leaf may touch the flame --- */
  for(const dc of decor)if(dc.k==='fire'){
    const fx0=dc.x-16+O,fy0=dc.y-34+O;
    gb.clearRect(fx0,fy0,48,44);gf.clearRect(fx0,fy0,48,44);}

}
function drawFoliage(layer){
  const c=layer?folFront:folBack;
  if(!c)return;
  const sx=Math.round(camX)+folPad,sy=Math.round(camY)+folPad;
  const w=Math.min(VW,c.width-sx),h=Math.min(VH,c.height-sy);
  if(w<=0||h<=0||sx<0||sy<0)return;
  cx.globalAlpha=1;
  if(layer&&folHole.a>0.02){
    // an eased window in the exact shape of the monkey, a few pixels proud of him
    const hx=Math.round(folHole.x-camX),hy=Math.round(folHole.y-camY);
    cx.save();cx.beginPath();cx.rect(0,0,w,h);chipHolePath(hx,hy);cx.clip('evenodd');
    cx.drawImage(c,sx,sy,w,h,0,0,w,h);cx.restore();
    cx.save();cx.beginPath();chipHolePath(hx,hy);cx.clip();
    cx.globalAlpha=1-0.20*folHole.a;
    cx.drawImage(c,sx,sy,w,h,0,0,w,h);cx.restore();
  }else cx.drawImage(c,sx,sy,w,h,0,0,w,h);
  cx.globalAlpha=1;
  if(layer)wallEdges();
}
/* ---- the silhouette of anything Chip cannot walk through, put back on top
        of the leaf, so a stage never lies about where its walls are ---- */
function wallEdges(){
  const p=pal();
  const x0=Math.max(0,Math.floor(camX/T)),x1=Math.min(MAPW-1,Math.ceil((camX+VW)/T));
  const y0=Math.max(0,Math.floor(camY/T)),y1=Math.min(MAPH-1,Math.ceil((camY+VH)/T));
  const air=(x,y)=>{const t=at(x,y);return !HARD(t)&&!ONEWAY(t);};
  cx.globalAlpha=0.9;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(!HARD(at(x,y)))continue;
    const X=x*T-camX,Y=y*T-camY;
    if(air(x,y-1)){px(X,Y,T,1,p.bt);px(X,Y+1,T,1,p.bk);}
    if(air(x,y+1)){px(X,Y+T-1,T,1,p.bd);}
    if(air(x-1,y)){px(X,Y,1,T,p.bt);px(X+1,Y,1,T,p.bk);}
    if(air(x+1,y)){px(X+T-1,Y,1,T,p.bd);px(X+T-2,Y,1,T,p.bk);}
  }
  cx.globalAlpha=1;
}
/* his silhouette, in non-overlapping blocks so evenodd stays honest */
function chipHolePath(hx,hy){
  const f=P.face<0?-1:1;
  cx.rect(hx-6,hy-12,12,7);                        // head
  cx.rect(hx-9,hy-11,3,4);cx.rect(hx+6,hy-11,3,4); // ears
  cx.rect(hx-6,hy-5,12,10);                        // torso
  cx.rect(hx-9,hy-3,3,6);cx.rect(hx+6,hy-3,3,6);   // arms
  cx.rect(hx-6,hy+5,12,5);                         // legs
  if(f>0)cx.rect(hx-11,hy-1,2,6);else cx.rect(hx+9,hy-1,2,6);  // the tail trails behind
}


/* =====================================================================
   THE OUTLIER.  Nobody built it. It is a mouse's idea of a building:
   one long log in, then a warren of identical corridors that are not
   identical, a lion on the last gate, and the gold boombox behind him.

function buildWarren(seed){
  const rnd=(()=>{let z=(seed>>>0)||1;
    return()=>{z^=z<<13;z^=z>>>17;z^=z<<5;z>>>=0;return z/4294967296;};})();
  const W=VCOLS*VCW+1,H=VROWS*VCH+1;
  MAPW=W;MAPH=H;map=new Uint8Array(W*H).fill(1);
  const St=(x,y,v)=>{if(x>=0&&y>=0&&x<W&&y<H)map[y*W+x]=v;};
  const cellX=c=>c*VCW+1,cellY=r=>r*VCH+1;
  const carveCell=(c,r)=>{for(let y=0;y<VCH-1;y++)for(let x=0;x<VCW-1;x++)St(cellX(c)+x,cellY(r)+y,0);};
  // ---- recursive backtracker: the warren proper ----
  const vis=new Array(VCOLS*VROWS).fill(false);
  const link=[];
  const st=[[0,0]];vis[0]=true;
  while(st.length){
    const[c,r]=st[st.length-1];
    const nb=[];
    if(c>0&&!vis[r*VCOLS+c-1])nb.push([c-1,r]);
    if(c<VCOLS-1&&!vis[r*VCOLS+c+1])nb.push([c+1,r]);
    if(r>0&&!vis[(r-1)*VCOLS+c])nb.push([c,r-1]);
    if(r<VROWS-1&&!vis[(r+1)*VCOLS+c])nb.push([c,r+1]);
    if(!nb.length){st.pop();continue;}
    const n=nb[(rnd()*nb.length)|0];
    vis[n[1]*VCOLS+n[0]]=true;link.push([c,r,n[0],n[1]]);st.push(n);
  }
  for(let r=0;r<VROWS;r++)for(let c=0;c<VCOLS;c++)carveCell(c,r);
  // a handful of extra doors, so it is a warren and not a single thread
  for(let k=0;k<8;k++){
    const c=(rnd()*VCOLS)|0,r=(rnd()*VROWS)|0;
    if(c<VCOLS-1&&rnd()<0.5)link.push([c,r,c+1,r]);
    else if(r<VROWS-1)link.push([c,r,c,r+1]);
  }
  for(const[c,r,c2,r2]of link){
    if(r===r2){                                  // a doorway sideways, floor-level
      const x=Math.max(c,c2)*VCW+0,y0=cellY(r);
      for(let y=VCH-4;y<VCH-1;y++)St(x,y0+y,0);
    }else{                                       // a shaft up, two tiles wide
      const y=Math.max(r,r2)*VCH+0,x0=cellX(c);
      St(x0,y,0);St(x0+1,y,0);
      const lowR=Math.max(r,r2);
      St(x0,cellY(lowR)+VCH-2,6);                // a spring at the bottom of every shaft
      St(x0,cellY(lowR)-1,0);St(x0+1,cellY(lowR)-1,2);   // and a lip to catch him at the top
    }
  }
  return{W:W,H:H};
}

  buildWarren(seed);
  const W=MAPW,H=MAPH;

  huts=[];discoball=null;tollCells=[];danceCrew=null;logDoor=null;dartBlocks=[];darts=[];
  teles=[];zaps=[];lever=null;fences=[];doorFX=[];honeyRooms=new Set();
  lasers=[];decor=[];bridges=[];wfalls=[];drips=[];pools=[];fortune=null;fortuneShow=null;
  darkSet=new Set();glowflies=[];levelDark=false;darkA=0;fish=null;fishSpots=[];
  boombox=null;goldbox=null;motes=[];mush=new Map();cloudT=new Map();
  folBack=null;folFront=null;sealedCells=null;secretCells=null;

  const cx0=c=>c*VCW+1,cy0=r=>r*VCH+1;
  // ---- the way in, top-left ----
  P.x=cx0(0)*T+4;P.y=(cy0(0)+VCH-3)*T+4;P.vx=0;P.vy=0;
  P.safeX=P.x;P.safeY=P.y;P.iframes=40;
  vaultSave.entryX=P.x;vaultSave.entryY=P.y;

  // ---- the giant secret room: knock out the bottom-right quarter ----
  const gx0=(VCOLS-3)*VCW+1,gy0=(VROWS-3)*VCH+1;
  for(let y=gy0;y<H-1;y++)for(let x=gx0;x<W-1;x++)map[y*W+x]=0;
  for(let x=gx0;x<W-1;x++)map[(H-2)*W+x]=1;                 // its floor
  for(let x=gx0+2;x<W-3;x+=5)map[(gy0+5)*W+x]=2,map[(gy0+5)*W+x+1]=2;   // a few boughs to climb
  for(let x=gx0+4;x<W-5;x+=6)map[(gy0+10)*W+x]=2,map[(gy0+10)*W+x+1]=2;

  // ---- the lion's gate, floor to ceiling, in the corridor before it ----
  const gcol=gx0-1;
  for(let y=gy0;y<H-2;y++){map[y*W+gcol]=20;tollCells.push([gcol,y]);}
  for(let y=gy0;y<H-2;y++)map[y*W+gcol-1]=0;                // standing room on the near side
  map[(H-2)*W+gcol]=1;map[(H-2)*W+gcol-1]=1;
  const cost=30+((curLevel*7)%20),ac=3+((curLevel*5)%4);
  const perch=(col)=>{let ly=gy0;while(ly<H-2&&map[(ly+1)*W+col]!==1)ly++;return ly;};
  npcs.push({x:(gcol-2)*T-2,y:perch(gcol-2)*T+2,w:12,h:14,kind:9,t:0,cool:0,
    name:'Leo the Toll Lion',toll:true,deal:{k:'toll',cost:cost,ammo:ac},
    lines:['You found the long log. Well.','Not many do. Fewer come back.',
           'The box is behind me. It is heavy.',
           cost+FSYM+(ac?' and '+ac+' seeds':'')+' and the gate goes up.'],
    openLines:['Go on. It is only gold.','I never once opened it myself.',
               'Mind the mice on the way out.']});
  npcs.push({x:(gcol+2)*T+2,y:(H-3)*T+2,w:12,h:14,kind:9,t:3,cool:0,
    name:'Rory the Toll Lion',toll:true,deal:{k:'toll',cost:cost,ammo:ac},
    lines:['Rory. I keep the inside.','Leo keeps the outside. It is quieter here.',
           'Same toll: '+cost+FSYM+(ac?' and '+ac+' seeds':'')+'.',
           '(We have never discussed why.)'],
    openLines:['Through, then.','It has been behind me a long time.',
               'Tell Leo it was worth it. He worries.']});

  // ---- and the thing itself ----
  goldbox={x:(W-5)*T+8,y:(H-4)*T+8,t:0};

  // ---- mice. it is their warren, after all ----
  const spots=[];
  for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++)
    if(map[y*W+x]===0&&map[(y+1)*W+x]===1&&map[(y-1)*W+x]===0)spots.push([x,y]);
  const MLINE=[['squeek','We measured it once.','It came out different each time.'],
    ['nnk','There is a lion at the far end.','He is not the problem. The corners are.'],
    ['squeek','Left, left, up, left.','Or the other one. I forget which is which.'],
    ['nnk','Nobody built this.','It was simply always the shape it is.'],
    ['squeek','You are the tall one from the log.','We heard you coming for a while.']];
  for(let i=0;i<5&&spots.length;i++){
    const q=spots[((i*97+seed)>>>0)%spots.length];
    npcs.push({x:q[0]*T,y:q[1]*T+2,w:12,h:14,kind:11,t:i,cool:0,
      name:'a warren mouse',lines:MLINE[i%MLINE.length]});
  }
  for(let i=0;i<14&&spots.length;i++){
    const q=spots[((i*211+seed*3)>>>0)%spots.length];
    pickups.push({x:q[0]*T+8,y:q[1]*T+8,kind:'fruit',
      v:(q[0]*7+q[1]*13+curLevel*3)%FRUITS.length,got:false,bob:Math.random()*6.28});
  }
  for(let i=0;i<3&&spots.length;i++){
    const q=spots[((i*331+seed*7)>>>0)%spots.length];
    pickups.push({x:q[0]*T+8,y:q[1]*T+8,kind:'trink',
      tk:(i*3+curLevel)%TRINKETS.length,got:false,bob:Math.random()*6.28});
  }

  roomX=Math.floor(P.x/(RW*T));roomY=Math.floor(P.y/(RH*T));
  camX=roomX*RW*T-T;camY=roomY*RH*T-T;
  mapReach();bakeFoliage();
  P.hp=Math.max(P.hp,Math.floor(PR.maxHP*0.6));
  mode='play';SFX.door();
  say('THE OUTLIER','a warren, and something at the end of it');
  dex('warren');
}

/* (the Refix-era stepGame/draw pair lived here; 626 keeps a single loop below) */
function fit(){
  // crisp numbers: one game pixel must land on a whole number of device pixels.
  const st=document.getElementById('stage');
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const aw=st.clientWidth*dpr,ah=st.clientHeight*dpr;
  let s=Math.floor(Math.min(aw/VW,ah/VH));
  if(s<1)s=Math.min(aw/VW,ah/VH);          // tiny screens: fall back to fitting
  cv.style.width=(VW*s/dpr)+'px';cv.style.height=(VH*s/dpr)+'px';
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,250));
fit();

/* ---- neighbours speak plainly on every disc (no rune static) ---- */
function voiceLines(n,lns){
  if(n.sign)return lns;
  const h=(k)=>H3((n.x|0)+k,(n.y|0),577+k);
  const ONO={3:'...hmmm.',4:'Sssss.',5:'Hoo!',6:'Mrrow.',7:'SQUAWK!',9:'Hrrmph.',
             10:'...spore.',11:'Squeak!',1:'Ribbit.'};
  const o2=ONO[n.kind];
  if(o2&&lns.length)lns=lns.map((l,i)=>(i===lns.length-1||h(i)<0.22)?l+' '+o2:l);
  return lns;
}

function c6CDMotif(w,x,y,r){
  const q=r/13;                                   /* motif scale */
  const P2=(dx,dy,ww,hh,c)=>px(x+dx*q,y+dy*q,Math.max(1,ww*q),Math.max(1,hh*q),c);
  if(w===0){                                      /* Fjalar: a palm on the sand */
    P2(-1,-2,2,8,'#8a5a2a');
    P2(-6,-5,5,2,'#2f9a4e');P2(2,-5,5,2,'#2f9a4e');
    P2(-5,-8,4,2,'#3fc86a');P2(2,-8,4,2,'#3fc86a');P2(-1,-9,3,2,'#3fc86a');
    P2(-6,5,13,2,'#ffe8a0');
  }else if(w===1){                                /* Wynnland: a wheat sprig */
    P2(-1,-3,2,9,'#c8942a');
    for(let k=0;k<3;k++){P2(-4,-4+k*2,3,1,'#ffe07a');P2(2,-4+k*2,3,1,'#ffe07a');}
    P2(-1,-6,2,2,'#fff0a0');
  }else if(w===2){                                /* Elysiae: one falling leaf */
    P2(-4,-4,7,5,'#c8622a');P2(-2,-6,4,2,'#e88a3a');P2(1,0,3,3,'#8a4a1a');
    P2(3,3,2,2,'#c8622a');P2(-6,5,2,1,'#e88a3a');
  }else if(w===3){                                /* Duat: the pyramid at noon */
    for(let k=0;k<5;k++)P2(-k-1,3-k,(k+1)*2+1,1,'#e8cc7a');
    P2(-1,-3,2,1,'#ffffff');P2(5,-6,3,3,'#ffe86a');
  }else if(w===4){                                /* Duat II: the crescent */
    for(let k=0;k<7;k++){const a=k/6*3.14-1.57;
      P2(Math.cos(a)*5-1,Math.sin(a)*5,2,2,'#aab8ff');}
    P2(4,-5,1,1,'#7fd8ff');P2(-6,3,1,1,'#7fd8ff');
  }else if(w===5){                                /* Lyonesse: waves over a spire */
    P2(-1,-1,2,7,'#1a4a5e');P2(-2,-3,4,2,'#1a4a5e');
    for(let k=0;k<3;k++)P2(-6+k*4,-5,3,1,'#8ae8ff');
    for(let k=0;k<3;k++)P2(-4+k*4,-7,3,1,'#5ac8e8');
  }else if(w===6){                                /* Elysiae II: the lone tree */
    P2(-1,0,2,6,'#6a4a9a');
    P2(-4,-4,9,3,'#b06aff');P2(-2,-6,5,2,'#e8d0ff');
    P2(-5,-2,2,1,'#b06aff');P2(4,-2,2,1,'#b06aff');
  }
}
function c6DrawCD(x,y,r,w,t,locked,spinMul){
  const seg=14,rainbow=w<0;
  const CP=rainbow?null:[[ '#ff9a3a','#ffd24a','#3fc86a'],['#ffd24a','#e8a82a','#fff0a0'],
    ['#d8a83a','#c8622a','#8a5a2a'],['#ffe86a','#e8b02a','#c8a04a'],
    ['#3a4aae','#5a6aff','#141a3e'],['#2ad8a8','#1a6a8a','#8ae8ff'],
    ['#b06aff','#e8d0ff','#6a4a9a']][w];
  for(let a=0;a<seg;a++){
    const a0=a/seg*6.283+t*0.02*(spinMul||1),a1=(a+1)/seg*6.283+t*0.02*(spinMul||1);
    cx.beginPath();cx.moveTo(x,y);cx.arc(x,y,r,a0,a1);cx.closePath();
    cx.fillStyle=locked?((a%2)?'#3a3e46':'#2a2e36')
      :rainbow?'hsl('+((a*26+t*3)%360)+',92%,'+(56+(a%2)*14)+'%)'
      :CP[a%3];
    cx.fill();}
  if(!locked&&!rainbow&&r>=11)c6CDMotif(w,x,y,r);
  cx.beginPath();cx.arc(x,y,r,0,6.283);cx.strokeStyle=locked?'#54565e':'#f0f4ff';
  cx.lineWidth=1;cx.stroke();
  cx.beginPath();cx.arc(x,y,r*0.32,0,6.283);cx.fillStyle='#0a0e16';cx.fill();
  cx.beginPath();cx.arc(x,y,r*0.16,0,6.283);cx.fillStyle=locked?'#2a2e36':'#c8d0dc';cx.fill();
  if(locked){px(x-2,y-r-9,5,4,'#8a8c96');px(x-3,y-r-6,7,5,'#a8aab2');}
}

function c6TitleShip(i,t){
  const h=(k)=>{const v=Math.sin(i*127.1+k*311.7)*43758.5453;return v-Math.floor(v);};
  const sc=0.5+h(1)*0.7;
  const x=((h(2)*VW*1.6+t*(0.12+h(3)*0.35))%(VW+160))-80;

  cx.save();
  if(h(6)<0.5){cx.translate(x,0);cx.scale(-1,1);cx.translate(-x,0);}
  const kind=i%4;
  if(kind===0){                                   /* the station: grey modules on a gold-arrayed truss */
    S(-22,-1,44,2,'#8a9098');                                      /* the truss */
    for(const ax of[-20,-13,13,20]){                               /* solar wings */
      S(ax-2,-8,4,7,'#c8a020');S(ax-2,1,4,7,'#c8a020');
      S(ax-2,-8,4,1,'#ffe88a');S(ax-1,-8,1,16,'#7a5e10');}
    S(-8,-3,16,6,'#c6cad2');S(-8,-3,16,1,'#e8ecf4');               /* the long lab */
    S(-10,-2,2,4,'#a8adb6');S(8,-2,3,4,'#a8adb6');
    S(-3,-6,6,3,'#b0b4bc');S(-2,3,4,4,'#9aa0a8');                  /* stacked modules */

    for(let k=0;k<4;k++)S(-6+k*4,-1,2,2,(((t>>4)+k)%3)?'#1a2230':'#7fd8ff');
  }else if(kind===1){                             /* the dragon: purple, spined, three yellow eyes */
    S(-16,-2,32,9,'#8a3ab0');S(-15,-3,29,2,'#a05ad0');             /* the hull, nose high */
    S(14,3,6,4,'#8a3ab0');S(17,5,4,3,'#8a3ab0');                   /* the tail, drooping */
    for(let k=0;k<4;k++)S(-13+k*7,-6,3,4,'#6a2a90');               /* the spines */
    for(let k=0;k<3;k++){S(-10+k*7,0,4,5,'#ffd93a');S(-9+k*7,1,2,3,'#fff2a0');} /* windows */
    S(-19,-3,4,10,'#8a9098');S(-18,-2,2,8,'#6a7078');              /* the ring nose */
    for(let k=0;k<3;k++)S(-19,-2+k*3,1,1,(((t>>3)+k)%2)?'#ff3a4a':'#7a1020');
    S(11,-6,6,5,'#ffd93a');S(12,-5,4,3,'#e8344a');                 /* the cab and its machine */
    S(5,3,2,6,'#a8adb6');for(let k=0;k<3;k++)S(5,4+k*2,2,1,'#5a6068'); /* the ladder */
  }else if(kind===2){                             /* the terrarium: an island flying itself */
    S(-16,-3,32,10,'#2f8f46');                                     /* the green land */
    S(-16,-3,4,3,'#57c46a');S(-8,-5,6,3,'#57c46a');S(6,-4,5,3,'#57c46a');  /* the rough coast */
    S(-13,5,5,3,'#1c6b46');S(9,4,4,4,'#1c6b46');
    S(-4,-2,9,8,'#2a6ad8');S(-3,-1,7,6,'#3a8ae8');                 /* the water tank */
    for(let k=0;k<3;k++)S(-4,0+k*3,9,1,'#e8f4ff');                 /* the hatch bands */
    for(let k=0;k<3;k++)S(-2+k*3,1,1,1,'#dff4ff');                 /* fish? bubbles? yes */

      S(sx4,-2,3,3,'#ffd93a');S(sx4,1,3,2,'#1a1a1a');S(sx4,3,3,2,'#ffd93a');

   THE VESSEL -- hull, glass, and doors that behave like doors on a ship
   Backgrounds are painted BEFORE the tile pass (so shelves and platforms

   ===================================================================== */
const HULLPAL={

  bridge:['#2c3648','#212a39','#40506a','#587090'],

function hullPlate(x0,y0,x1,y1,pal,seed){
  const w=x1-x0,h=y1-y0;if(w<=0||h<=0)return;
  cx.fillStyle=pal[0];cx.fillRect(x0,y0,w,h);
  /* long plates, seams, and the odd rivet run */
  const gy=Math.floor((y0+camY)/24)*24-camY;
  for(let y=gy;y<y1+24;y+=24){
    if(y+1<y0||y>y1)continue;
    const a=Math.max(y0,y),b=Math.min(y1,y+1);
    if(b>a)px(x0,a,w,b-a,pal[1]);
    const a2=Math.max(y0,y+1),b2=Math.min(y1,y+2);
    if(b2>a2)px(x0,a2,w,b2-a2,pal[2]);}
  const gx=Math.floor((x0+camX)/40)*40-camX;
  for(let x=gx;x<x1+40;x+=40){
    if(x+1<x0||x>x1)continue;
    const a=Math.max(x0,x),b=Math.min(x1,x+1);
    if(b>a)px(a,y0,b-a,h,pal[1]);}
  for(let y=gy+6;y<y1+24;y+=24)for(let x=gx+5;x<x1+40;x+=10){
    if(x<x0||x>x1-1||y<y0||y>y1-1)continue;
    px(x,y,1,1,pal[3]);}
}
/* ---- glass: one routine, eight cuts ---- */
function winSpan(k,w,h,y){
  const u=h>1?y/(h-1):0;
  if(k==='port'||k==='oval'){
    const r=2*u-1,f=Math.sqrt(Math.max(0,1-r*r));
    const hw=(w/2)*f;if(hw<1)return null;return [w/2-hw,w/2+hw];}
  if(k==='hex'){
    const c=Math.min(w,h)*0.30;
    let ins=0;
    if(y<c)ins=(c-y)/c*(w*0.28);
    else if(y>h-1-c)ins=(y-(h-1-c))/c*(w*0.28);
    return [ins,w-ins];}
  if(k==='slit'){
    const r=Math.min(w/2,6);
    if(y<r){const dy=r-y,f=Math.sqrt(Math.max(0,1-(dy/r)*(dy/r)));
      return [w/2-(w/2)*f,w/2+(w/2)*f];}
    if(y>h-1-r){const dy=y-(h-1-r),f=Math.sqrt(Math.max(0,1-(dy/r)*(dy/r)));
      return [w/2-(w/2)*f,w/2+(w/2)*f];}
    return [0,w];}
  if(k==='tri'){const f=u;return [w/2-(w/2)*f,w/2+(w/2)*f];}
  if(k==='arch'){
    const r=w/2;
    if(y<r){const dy=r-y,f=Math.sqrt(Math.max(0,1-(dy/r)*(dy/r)));return [w/2-r*f,w/2+r*f];}
    return [0,w];}
  if(k==='bay'){const ins=u*(w*0.20);return [ins,w-ins];}
  /* pano: a wide rounded rectangle */
  const r=Math.min(w,h)*0.22;
  if(y<r){const dy=r-y,f=Math.sqrt(Math.max(0,1-(dy/r)*(dy/r)));return [r-r*f,w-r+r*f];}
  if(y>h-1-r){const dy=y-(h-1-r),f=Math.sqrt(Math.max(0,1-(dy/r)*(dy/r)));return [r-r*f,w-r+r*f];}
  return [0,w];
}
function drawWindow(o){
  const X=Math.round(o.x-camX),Y=Math.round(o.y-camY),W2=o.w,H2=o.h;
  if(X>VW+8||X+W2<-8||Y>VH+8||Y+H2<-8)return;
  const t=mapT;
  const deep=o.tint||'#04060f';
  /* 1. the bezel: two rings offset outward from the aperture */
  for(let y=-3;y<H2+3;y++){
    const sp=winSpan(o.k,W2,H2,Math.max(0,Math.min(H2-1,y)));
    if(!sp)continue;
    const gw=(y<0||y>=H2)?-2:0;
    px(X+sp[0]-3-gw,Y+y,3+gw,1,'#5a6580');
    px(X+sp[1]+gw,Y+y,3+gw,1,'#3e4759');}
  px(X-3,Y-3,W2+6,1,'#6d7a95');px(X-3,Y+H2+2,W2+6,1,'#2a3242');
  /* 2. the void */
  for(let y=0;y<H2;y++){
    const sp=winSpan(o.k,W2,H2,y);if(!sp)continue;
    const a=Math.round(sp[0]),b=Math.round(sp[1]);
    if(b<=a)continue;
    px(X+a,Y+y,b-a,1,deep);
  }
  /* 3. stars and slow drift, parallaxed against the hull */
  const px0=Math.round(camX*0.14),py0=Math.round(camY*0.10);
  for(let i=0;i<Math.max(6,(W2*H2)/70);i++){
    const hx=((i*7919+o.x*13)|0);
    let sx2=((hx%1000)/1000*W2+px0)%W2;if(sx2<0)sx2+=W2;
    let sy2=(((hx>>9)%1000)/1000*H2+py0*0.5)%H2;if(sy2<0)sy2+=H2;
    const sp=winSpan(o.k,W2,H2,Math.floor(sy2));if(!sp)continue;
    if(sx2<sp[0]+1||sx2>sp[1]-1)continue;
    const tw=0.35+0.65*Math.abs(Math.sin(t*0.03+i*1.7));
    cx.globalAlpha=tw;
    px(X+sx2,Y+sy2,1,1,(i%7)?'#cfe0ff':'#ffe6b0');cx.globalAlpha=1;}
  /* 4. a body out there, for the bigger cuts */
  if(W2>=44&&H2>=32){
    const ph=(o.x*7+o.y*3)|0;
    const bx=X+W2*0.24+Math.sin(t*0.002+ph)*W2*0.12;
    const by=Y+H2*0.62+Math.cos(t*0.0017+ph)*H2*0.10;
    const rr=Math.max(5,Math.min(W2,H2)*0.20);
    const hue=(ph*37)%360;
    for(let yy=-rr;yy<=rr;yy++){
      const f=Math.sqrt(Math.max(0,rr*rr-yy*yy));
      const ry=Math.round(by+yy-Y);
      if(ry<0||ry>=H2)continue;
      const sp=winSpan(o.k,W2,H2,ry);if(!sp)continue;
      let a=Math.round(bx-f-X),b=Math.round(bx+f-X);
      a=Math.max(a,Math.round(sp[0]));b=Math.min(b,Math.round(sp[1]));
      if(b<=a)continue;
      const sh=yy<-rr*0.2?55:(yy<rr*0.35?38:22);
      px(X+a,Y+ry,b-a,1,'hsl('+hue+',42%,'+sh+'%)');}
    for(let i=0;i<5;i++){                     /* a ring, because why not */
      const ry=Math.round(by-Y+rr*0.15+i*0.6);
      if(ry<0||ry>=H2)continue;
      const sp=winSpan(o.k,W2,H2,ry);if(!sp)continue;
      cx.globalAlpha=.4;
      px(X+Math.max(sp[0],bx-rr*1.7-X),Y+ry,Math.min(rr*3.4,sp[1]-sp[0]),1,'hsl('+((hue+40)%360)+',50%,62%)');
      cx.globalAlpha=1;}
  }
  /* 5. mullions on the wide glass */
  if(W2>=52){for(let mx=Math.round(W2/3);mx<W2-2;mx+=Math.round(W2/3)){
    for(let y=0;y<H2;y++){const sp=winSpan(o.k,W2,H2,y);
      if(sp&&mx>sp[0]&&mx<sp[1])px(X+mx,Y+y,2,1,'#48566e');}}}
  /* 6. the sheen */
  cx.globalAlpha=.16;
  for(let y=0;y<H2;y++){
    const sp=winSpan(o.k,W2,H2,y);if(!sp)continue;
    const off=Math.round(sp[0]+ (H2-y)*0.55);
    if(off+3<sp[1])px(X+off,Y+y,Math.min(4,sp[1]-off),1,'#dfe8ff');}
  cx.globalAlpha=1;
}

/* ---- background pass: hull and glass, behind every tile ---- */
function drawShipBack(){
  if(curLevel!==0)return;
  const t=mapT;
  const area=(a,kind)=>{
    if(!a)return;
    const x0=Math.max(0,(a.x0-1)*T-camX),y0=Math.max(0,(a.y0-1)*T-camY);
    const x1=Math.min(VW,(a.x1+2)*T-camX),y1=Math.min(VH,(a.y1+2)*T-camY);
    if(x1<=x0||y1<=y0)return;
    hullPlate(x0,y0,x1,y1,HULLPAL[kind]||HULLPAL.deck,0);
  };
  area(SHIP.cabin,'cabin');area(SHIP.bridge,'bridge');area(SHIP.deck,'deck');
  for(const R of SHIP.rooms)if(R.kind!=='deck'&&R.kind!=='bridge')area(R,R.kind);
  for(const o of SHIP.win)drawWindow(o);
  /* room-specific atmosphere, still behind the tiles */
  for(const R of SHIP.rooms){
    const rx0=R.x0*T-camX,ry0=R.y0*T-camY,rx1=(R.x1+1)*T-camX,ry1=(R.y1+1)*T-camY;
    if(rx1<-20||rx0>VW+20||ry1<-20||ry0>VH+20)continue;
    if(R.kind==='disco'){
      for(let i=0;i<7;i++){const lx=rx0+((i*67+t)%Math.max(1,(rx1-rx0)));
        cx.globalAlpha=.18;px(lx,ry0,4,ry1-ry0,'hsl('+((i*52+t*3)%360)+',95%,60%)');cx.globalAlpha=1;}
    }else if(R.kind==='garden'){
      /* glasshouse light: the beds are lit from the windows behind them */
      text('THE GARDEN',rx0+44,ry0+11,'#8fe8a8');
      for(let x=rx0;x<rx1;x+=6){cx.globalAlpha=.10+.05*Math.sin(t*0.02+x*0.1);
        px(x,ry0,3,ry1-ry0,'#8fe8a8');cx.globalAlpha=1;}
      px(rx0,ry1-2,rx1-rx0,2,'#2a4a2c');
      for(const b of shipGarden){
        const x=b.x-camX,y=b.y-camY;
        if(x<-40||x>VW+40)continue;
        px(x-2,y-2,3*T+4,4,'#5a4530');px(x-2,y-2,3*T+4,1,'#7a6244');   /* the planter */
        px(x-1,y+2,3*T+2,2,'#3a2c1c');
        text(b.n,x+T+8,y+4,'#7fae94','center');
        for(let k=0;k<5;k++)px(x+3+k*9,y-3,1,1,'#a8d8b0');}
      for(let i=0;i<9;i++){                       /* motes, drifting in the light */
        const mx=rx0+((i*97+t*0.4)%Math.max(1,rx1-rx0));
        px(mx,ry0+20+Math.sin(t*0.03+i)*14,1,1,'#dfffe8');}
    }else if(R.kind==='arcade'){
      /* carpet first: the loud kind, laid in the dark */
      for(let x=rx0;x<rx1;x+=8){
        const q=((x-rx0)>>3)%3;
        px(x,ry1-14,8,14,['#1a0e2e','#20123a','#160a26'][q]);
        px(x+1,ry1-11,3,3,['#ff2a8a','#2a8aff','#ffd24a'][(q+1)%3]);
        px(x+5,ry1-6,2,2,['#3fd86a','#ff6a2a','#c8a2ff'][q]);}
      cx.fillStyle='rgba(4,2,12,0.45)';cx.fillRect(rx0,ry0,rx1-rx0,ry1-ry0-14);
      /* neon: three tubes running the length of the room */
      for(let k=0;k<3;k++){
        const ny=ry0+6+k*7,hue=(t*2+k*120)%360;
        cx.globalAlpha=.22;px(rx0,ny-2,rx1-rx0,6,'hsl('+hue+',95%,60%)');cx.globalAlpha=1;
        px(rx0,ny,rx1-rx0,2,'hsl('+hue+',95%,72%)');}
      text('THE ARCADE',rx0+46,ry0+18,'#ff8ad0');
      for(const c of shipCabs)drawCabinet(c,t);
    }else if(R.kind==='mach'){
      cx.fillStyle='rgba(2,4,10,0.55)';cx.fillRect(rx0,ry0,rx1-rx0,ry1-ry0);
      for(let i=0;i<8;i++){const cxp=rx0+18+i*46;
        cx.globalAlpha=.10+.06*Math.sin(t*0.05+i);
        px(cxp,ry0,2,ry1-ry0,'#7fd8ff');cx.globalAlpha=1;}
    }else if(R.kind==='items'){
      cx.globalAlpha=.26;cx.fillStyle='#1a0e2a';cx.fillRect(rx0,ry0,rx1-rx0,ry1-ry0);cx.globalAlpha=1;
      for(let x=rx0;x<rx1;x+=15){px(x,ry0,11,7,'#3a1e5a');px(x+2,ry0+7,7,3,'#2a1444');}
    }else if(R.kind==='obs'){
      cx.globalAlpha=.20;cx.fillStyle='#08101c';cx.fillRect(rx0,ry0,rx1-rx0,ry1-ry0);cx.globalAlpha=1;
    }
  }
}

/* =====================================================================
   TILE SKINS -- each disc re-dresses the base block and the leaf shelf.
   ===================================================================== */
function c6SkinTile(w,t,x,y,tx,ty){
  const r=H3(tx,ty,5),r2=H3(tx,ty,9),r3=H3(tx,ty,13);
  const upA=at(tx,ty-1)===0;
  if(t===1){
    if(w===0){                                   /* Fjalar: half the wood gave way to beach */
      if(r3<0.30){                               /* sand */
        px(x,y,T,T,'#e8d8a8');px(x,y,T,3,upA?'#fff0c8':'#f0e0b8');
        px(x,y+11,T,5,'#d0bc88');
        for(let k=0;k<4;k++)px(x+((k*5+tx*3)%14)+1,y+3+((k*7+ty*5)%11),1,1,'#c0a468');
        return true;}
      if(r3<0.50){                               /* sandstone, in strata */
        px(x,y,T,T,'#e0c890');px(x,y,T,4,upA?'#f0e0b0':'#e8d4a0');
        px(x,y+5,T,1,'#c8ac70');px(x,y+9,T,4,'#d0b478');px(x,y+13,T,3,'#b09258');
        if(r2<0.3)px(x+3+((tx*7)%8),y+6,4,2,'#c0a060');
        return true;}
      return false;                              /* the other half stays wood */
    }
    if(w===1){                                   /* Wynnland: honey-gold weave and cream daub */
      if(r3<0.22){                               /* whitewashed wattle block */
        px(x,y,T,T,'#ece0c4');px(x,y,T,2,'#f8f0dc');px(x,y+13,T,3,'#c8b890');
        px(x,y+3,2,10,'#a8823a');px(x+14,y+3,2,10,'#a8823a');px(x,y+7,T,2,'#a8823a');
        return true;}
      px(x,y,T,T,'#d8ac4e');px(x,y,T,3,upA?'#f0d888':'#e0bc62');
      for(let k=0;k<3;k++){px(x,y+4+k*4,T,1,'#b88c34');
        px(x+((k*5+tx*3)%12)+2,y+3+k*4,3,1,'#e8cc80');}
      if(r<0.18)px(x+3+((tx*7)%9),y+2,2,2,'#a8b878');   /* a sage fleck */
      return true;}
    if(w===2){                                   /* Elysiae: marble with a patina */
      if(r3<0.25){                               /* terracotta course */
        px(x,y,T,T,'#c08a5e');px(x,y,T,3,'#d8a070');px(x,y+12,T,4,'#a06a44');

  if(!wi||wi.w!==0){_c6Leaf(g,X,Y,seed,c,pad);return;}
  pad=pad||1;const HH=T+pad*2;

    const rr=(ry+pad)/(HH-1);

};

/* ---- the loop, re-braided ---- */
function stepGame(){
  readInput();
  if(mode==='play'){updatePlay();mapT++;}
  else if(mode==='map')updateMap();
  else if(mode==='wmap')updateWMap();
  else if(mode==='lmap')updateLMap();
  else if(mode==='title')updateTitle();
  else if(mode==='pan')updatePan();
  else if(mode==='wfade')updateWFade();
  else if(mode==='finale')updateFinale();
  else if(mode==='code')updateCode();
  else if(mode==='dex')updateDex();
  else if(mode==='memory')updateMemory();
  else if(mode==='house')updateHouse();
  else if(mode==='log')updateLog();
  else if(mode==='pach')updatePach();
  else if(mode==='slot')updateSlot();
  else if(mode==='cards')updateCards();
  else if(mode==='cut'){cutT++;mapT++;
    if(cutT>60&&(IN.starP||IN.jumpP)){mode='play';SFX.select();}}
  else if(mode==='clear'){clearT++;mapT++;
    if(clearT>50&&IN.jumpP){
      if(isArc(curLevel)&&arcBack===-1){arcBack=0;mode='play';loadLevel(0);return;}
      if(isArc(curLevel)&&C6.arcDone&&curLevel-ARCOFF+1>=ARCN){
        mode='play';loadLevel(0);return;}
      if(isArc(curLevel)){
        const k=curLevel-ARCOFF;
        C6.arc=Math.max(C6.arc,k+1);
        if(k+1>=ARCN){
          C6.arcDone=true;C6.arc=ARCN;c6Save();
          mode='play';loadLevel(0);
          say('FWEDDLE QUEST COMPLETE','something rainbow is waiting at the cabinet');
        }else{c6Save();mode='play';loadLevel(ARCOFF+k+1);}
        return;}
      const wi=c6WorldOf(curLevel);
      if(!wi){mode='play';loadLevel(0);}
      else if(curLevel===wi.end){
        C6.wc[wi.w]=1;
        if(wi.w===6){C6.done=true;c6Save();mode='finale';finT=0;setTrack(5);}
        else{C6.unlocked=Math.max(C6.unlocked,Math.min(7,wi.w+2));c6Save();
          mode='wfade';fadeT=0;}
      }else{
        wmW=wi.w;wmSel=Math.min(C6CNT[wi.w]-1,curLevel-C6OFF[wi.w]+1);
        wmCool=10;wmIn=0;mode='wmap';setTrack(0);
      }
    }}
  pumpMusic();
}
