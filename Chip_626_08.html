function mkClone(l){return {r:l.r.slice(),vn:JSON.parse(JSON.stringify(l.vn||[])),
  mc:JSON.parse(JSON.stringify(l.mc||[])),np:JSON.parse(JSON.stringify(l.np||[])),
  dc:JSON.parse(JSON.stringify(l.dc||[])),ht:JSON.parse(JSON.stringify(l.ht||[])),
  lg:JSON.parse(JSON.stringify(l.lg||[])),sg:JSON.parse(JSON.stringify(l.sg||[])),
  pl:JSON.parse(JSON.stringify(l.pl||[]))};}
const MKF=['vn','mc','np','dc','ht','lg','sg','pl'];
function closeMaker(){
  if(!MK)return;
  const w=document.getElementById('mkwrap');if(w)w.remove();
  removeEventListener('resize',mkFit);
  MK=null;
  loadLevel(curLevel);                      /* the stage rebuilds from what was drawn */
}
function mkAct(id){
  if(id==='mkundo')return mkUndo();
  if(id==='mkredo')return mkRedo();
  if(id==='mkcheck')return mkRunCheck();
  if(id==='mkexport')return mkBuildExport();
  if(id==='mkquit'){if(mkAnyEdited()&&!confirm('Leave the maker? Your edits stay in this session.'))return;
    return closeMaker();}
  if(id==='mkstage'){mkStages();return mkSheet('mkstS',true);}
  if(id==='mkpal'){mkPalette();return mkSheet('mkpalS',true);}
  if(id==='mkobj'){mkObjects();return mkSheet('mkobjS',true);}
  if(id==='mkgrid'){MK.grid=!MK.grid;document.getElementById('mkgrid').classList.toggle('on',MK.grid);
    return mkPaint();}
  if(id==='mklayers'){const pn=document.getElementById('mklayP');
    const on=pn.style.display!=='block';pn.style.display=on?'block':'none';
    document.getElementById('mklayers').classList.toggle('on',on);
    if(on)mkLayerPanel();
    return;}
  if(id==='mkrevert'){if(!confirm('Throw away every edit on every stage?'))return;
    MK.base.forEach((b,i)=>{LEVELS[i].r=b.r.slice();MKF.forEach(k=>LEVELS[i][k]=JSON.parse(JSON.stringify(b[k])));});
    MK.undo.length=0;MK.redo.length=0;mkStages();mkTop();mkPaint();}
}
function mkSheet(id,on){const e=document.getElementById(id);if(e)e.classList.toggle('on',on);}
const mkL=()=>LEVELS[MK.cur];
const mkW=()=>mkL().r[0].length, mkH=()=>mkL().r.length;
const mkAt=(x,y)=>(x<0||y<0||x>=mkW()||y>=mkH())?'#':mkL().r[y][x];
function mkSet(x,y,c){const l=mkL();
  if(x<0||y<0||x>=mkW()||y>=mkH()||l.r[y][x]===c)return;
  l.r[y]=l.r[y].slice(0,x)+c+l.r[y].slice(x+1);}
function mkEdited(i){const a=MK.base[i],b=LEVELS[i];
  if(a.r.join('\n')!==b.r.join('\n'))return true;
  for(const k of MKF)if(JSON.stringify(a[k])!==JSON.stringify(b[k]||[]))return true;
  return false;}
function mkAnyEdited(){for(let i=0;i<LEVELS.length;i++)if(mkEdited(i))return true;return false;}
function mkGrab(){const o={i:MK.cur,r:mkL().r.slice()};
  MKF.forEach(k=>o[k]=JSON.stringify(mkL()[k]||[]));return o;}
function mkSnap(){MK.undo.push(mkGrab());if(MK.undo.length>60)MK.undo.shift();MK.redo.length=0;}
function mkApply(s){MK.cur=s.i;const l=mkL();l.r=s.r.slice();
  MKF.forEach(k=>l[k]=JSON.parse(s[k]));}
function mkUndo(){if(!MK.undo.length)return;MK.redo.push(mkGrab());mkApply(MK.undo.pop());
  MK.objSel=null;mkTop();mkPaint();mkWarn();}
function mkRedo(){if(!MK.redo.length)return;MK.undo.push(mkGrab());mkApply(MK.redo.pop());
  MK.objSel=null;mkTop();mkPaint();mkWarn();}

/* ---------------- the editor's own tile art ---------------- */
function mkDraw(g,ch,X,Y,S){
  const u=S/16,Q=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(X+a*u,Y+b*u,Math.max(1,w*u),Math.max(1,h*u));};
  const L=mkL(),PL=L.pal||{bk:'#6a5a4a',bt:'#a86a28',bd:'#4a2a0e',s1:'#3fc86a',ac:'#ffd24a'};
  switch(ch){
   case '.':return;
   case '#':Q(0,0,16,16,PL.bk);Q(0,0,16,3,PL.bt);Q(0,13,16,3,PL.bd);return;
   case 'x':Q(0,0,16,16,PL.bk);Q(0,0,16,3,PL.bt);Q(3,2,1,12,PL.bd);Q(9,1,1,7,PL.bd);
     Q(6,8,1,7,PL.bd);return;
   case '|':Q(3,0,10,16,PL.bk);Q(4,2,2,13,PL.bt);return;
   case '=':Q(0,4,16,6,PL.s1);Q(1,4,14,2,'#8fe8a8');Q(2,10,3,2,PL.bd);Q(11,10,3,2,PL.bd);return;
   case '-':Q(0,0,16,6,PL.bt);Q(0,0,16,2,'#d8a868');Q(0,5,16,1,PL.bd);return;
   case 'h':Q(0,3,16,8,'#e0a828');Q(1,4,14,2,'#ffd870');Q(3,6,4,4,'#a87818');Q(9,6,4,4,'#a87818');return;
   case 'j':Q(0,9,16,7,'#c8901a');Q(0,9,16,2,'#ffd870');return;
   case 't':Q(0,1,16,14,'#4a2e14');Q(2,3,12,10,'#180e04');Q(0,1,16,2,'#7a4a20');return;
   case 'F':g.globalAlpha=.55;Q(0,0,16,16,'#2f8f46');g.globalAlpha=1;
     Q(2,2,5,4,'#57c46a');Q(9,7,5,4,'#3fa855');return;
   case 'C':Q(1,1,14,14,'#8a6432');Q(2,2,12,12,'#6b4a24');Q(2,7,12,2,'#8a6432');
     Q(7,2,2,12,'#8a6432');return;
   case 'A':Q(1,0,14,16,'#5a4a2a');Q(2,1,12,14,'#8a7038');Q(10,7,3,3,'#ffe07a');return;
   case 'L':Q(0,0,16,16,'#0a0e18');for(let k=0;k<3;k++)Q(2+k*5,0,3,16,
     'hsl('+((k*120+mapT*3)%360)+',85%,52%)');return;
   case '^':Q(0,13,16,3,PL.bd);for(let k=0;k<4;k++){Q(k*4+1,7,2,7,'#c8ccd8');Q(k*4+2,4,1,4,'#eef2ff');}return;
   case '~':Q(6,4,4,11,'#4a6a2a');Q(3,6,4,2,'#6a8a3a');Q(9,9,4,2,'#6a8a3a');return;
   case ';':Q(5,6,6,9,'#5a3a2a');Q(2,8,4,2,'#7a5a3a');Q(10,11,4,2,'#7a5a3a');return;
   case '<':case '>':case 'n':{const d=ch==='<'?-1:ch==='>'?1:0;
     g.globalAlpha=.35;Q(0,0,16,16,'#dff4ff');g.globalAlpha=1;
     for(let k=0;k<3;k++){if(d===0)Q(4+k*3,10-k*2,2,4,'#a8e8ff');
       else Q(d>0?2+k*4:12-k*4,5+k*3,4,2,'#a8e8ff');}return;}
   case 'm':Q(1,6,14,7,'#e8344a');Q(2,5,12,2,'#ff6a7a');Q(4,8,2,2,'#fff');Q(10,8,2,2,'#fff');
     Q(6,13,4,3,'#f0e8d0');return;
   case 'X':Q(1,6,14,7,'#8a4ae8');Q(2,5,12,2,'#b06aff');Q(6,13,4,3,'#e8d8ff');return;
   case 'v':Q(7,0,3,16,'#2f8f46');Q(3,4,5,2,'#3fa855');Q(9,10,5,2,'#3fa855');return;
   case 'S':Q(2,2,12,12,'#123a22');Q(3,3,10,10,'#1c6b46');Q(5,5,2,3,'#8fe8a8');
     Q(9,5,2,3,'#8fe8a8');Q(5,10,6,2,'#8fe8a8');return;
   case 'B':Q(2,3,12,10,'#2a3448');Q(3,4,10,8,'#0c1220');
     for(let k=0;k<4;k++)Q(4+k*2,6+(k%3),2,2,['#ff5a6a','#ffd93a','#3fd86a','#7fd8ff'][k]);return;
   case 'Z':Q(2,2,12,12,'#2a1a3a');Q(4,4,8,8,'#8a5ad0');Q(6,6,4,4,'#e8d8ff');return;
   case 's':Q(6,7,3,9,'#6b4a24');Q(1,2,14,7,'#a8804a');Q(2,3,12,5,'#d8b070');return;
   case 'd':Q(7,0,2,4,'#8a94a8');Q(3,4,10,10,'#c8ccd8');Q(5,6,2,2,'#fff');Q(9,9,2,2,'#ff5a6a');return;
   case 'b':Q(4,4,8,8,'#ff8a2a');Q(5,5,5,5,'#ffd24a');Q(7,1,2,3,'#3fa855');return;
   case '*':g.globalAlpha=.3;Q(1,1,14,14,'#ffd93a');g.globalAlpha=1;
     Q(6,2,4,12,'#ffe83a');Q(2,6,12,4,'#ffe83a');Q(6,6,4,4,'#c8a010');return;
   case 'o':Q(3,3,10,10,'#5ec8f0');Q(5,5,5,5,'#ff8ab0');Q(4,4,2,2,'#fff');return;
   case 'Y':Q(3,6,5,5,'#e8142a');Q(8,7,5,5,'#c00a20');Q(7,1,1,4,'#4a7a2a');return;
   case 'V':Q(4,4,8,9,'#3a6b22');Q(5,5,6,6,'#8ac83a');Q(7,7,3,3,'#6b4420');return;
   case 'Q':g.globalAlpha=.25;Q(1,1,14,14,'#ffb46a');g.globalAlpha=1;
     Q(2,9,12,5,'#4a3e34');Q(4,3,8,6,'#c8842a');Q(5,4,6,2,'#ffd8a0');return;
   case 'K':Q(3,4,10,9,'#8a5a2a');Q(4,5,8,7,'#5a3a18');return;
   case 'y':Q(3,3,10,10,'#f8f4ec');Q(4,4,3,8,'#e83a4a');Q(9,4,3,8,'#e83a4a');return;
   case 'G':Q(5,3,6,10,'#c8142a');Q(6,4,3,7,'#ff4a5a');Q(7,0,2,3,'#3fa855');return;
   case 'f':Q(4,4,8,8,'#ff8ac0');Q(5,5,6,6,'#e8348a');Q(6,6,4,4,'#6b4420');return;
   case 'M':Q(3,10,10,3,'#8a5aa8');Q(10,4,4,4,'#e8d8ff');Q(12,2,2,2,'#fff');return;
   case 'k':Q(3,3,7,7,'#ffe07a');Q(5,5,3,3,'#8a6a10');Q(9,6,6,2,'#ffe07a');return;
   case 'i':Q(4,3,8,10,'#6a2ab0');Q(5,4,6,8,'#b06ae8');Q(6,5,2,3,'#fff');return;
   case 'J':Q(3,2,10,12,'#ffd93a');Q(4,4,3,3,'#a87a10');return;
   case 'U':Q(2,5,12,8,'#e8a52a');Q(3,6,10,4,'#ffd07a');Q(7,1,2,4,'#5a7a2a');return;
   case 'D':Q(5,3,6,10,'#ff3a86');Q(1,5,4,3,'#8ade4a');Q(11,8,4,3,'#8ade4a');return;
   case 'P':Q(3,2,10,11,'#8a9ab0');Q(4,3,3,9,'#d8e4f0');Q(9,3,3,9,'#d8e4f0');
     Q(5,13,2,3,'#ff8a3a');Q(9,13,2,3,'#ffd24a');return;
   case 'W':Q(1,8,14,4,'#1f6b34');Q(6,3,5,5,'#2f8f46');Q(7,4,3,3,'#ff5a6a');return;
   case 'a':Q(2,6,12,5,'#241f1c');Q(3,7,10,3,'#3e3830');Q(11,7,2,2,'#ff2a2a');return;
   case 'p':Q(1,7,14,4,'#3a2e28');for(let k=0;k<5;k++)Q(1+k*3,6,2,6,k%2?'#4a3a30':'#3a2e28');return;
   case 'q':Q(3,7,9,5,'#5e4a24');Q(1,2,3,3,'#c8342a');Q(11,8,4,2,'#7a6030');return;
   case 'e':Q(3,6,10,6,'#e8b02a');Q(5,7,2,4,'#2a2010');Q(9,7,2,4,'#2a2010');
     Q(2,3,5,3,'#dff4ff');Q(9,3,5,3,'#dff4ff');return;
   case 'w':Q(4,6,8,5,'#3a4458');Q(2,3,5,3,'#cfe3d4');Q(9,3,5,3,'#cfe3d4');return;
   default:Q(2,2,12,12,'#7a4a4a');return;
  }
}

/* ---------------- render ---------------- */
function mkFit(){
  if(!MK)return;
  const f=document.getElementById('mkfield').getBoundingClientRect();
  MK.cv.width=Math.floor(f.width);MK.cv.height=Math.floor(f.height);
  MK.cv.style.width=f.width+'px';MK.cv.style.height=f.height+'px';
  mkPaint();
}
function mkClamp(){
  const vw=MK.cv.width,vh=MK.cv.height,mw=mkW()*MK.zoom,mh=mkH()*MK.zoom;
  MK.px=mw<vw?(vw-mw)/2:Math.max(vw-mw-40,Math.min(40,MK.px));
  MK.py=mh<vh?(vh-mh)/2:Math.max(vh-mh-40,Math.min(40,MK.py));
}
function mkCoord(){
  if(!MK)return;
  const e=document.getElementById('mkcoord');if(!e)return;
  const m=MK.mouse;
  const fmt=(a,b)=>String(a).padStart(3)+','+String(b).padStart(3);
  let h='';
  /* what is under the pointer */
  if(m){
    const tx=Math.floor(m[0]),ty=Math.floor(m[1]);
    const inside=tx>=0&&ty>=0&&tx<mkW()&&ty<mkH();
    const ch=inside?mkAt(tx,ty):' ';
    let nm='';
    MKTILE.forEach(([,,list])=>list.forEach(([id,n])=>{if(id===ch)nm=n;}));
    h+='<span style="color:#5f8a72">mouse</span> '+fmt(tx,ty)+
       '  <span style="color:#5f8a72">px</span> '+fmt(Math.round(m[0]*16),Math.round(m[1]*16))+
       (inside?('  <span style="color:#cfe3d4">'+(ch==='.'?'air':(nm||('"'+ch+'"')))+'</span>'+
                ' <span style="color:#5f8a72">('+mkLayerOf(ch)+')</span>'):'  <span style="color:#7a4a4a">outside</span>')+
       '<br>';
  }else h+='<span style="color:#5f8a72">mouse</span>  --,--<br>';
  /* what is selected */
  if(MK.objSel){
    const o=mkList(MK.objSel.t)[MK.objSel.i];
    if(o){
      const p=(MK.objSel.t==='vn')?[o[0][0]/16,o[0][1]/16]
        :(MK.objSel.t==='pl')?[o[0],o[2]]
        :(MK.objSel.t==='door'||MK.objSel.t==='sg')?[o.x,o.y]
        :[o.x/16,o.y/16];
      const K=mkObjKinds().find(q=>q.t===MK.objSel.t);
      h+='<span style="color:#ffd24a">selected</span> '+(K?K.l:MK.objSel.t)+' #'+MK.objSel.i+
         '  at '+fmt(Math.floor(p[0]),Math.floor(p[1]))+
         ' <span style="color:#5f8a72">('+(MKOBJLAYER[MK.objSel.t]||'mid')+')</span>';}
  }else if(MK.sel){
    const a=Math.min(MK.sel.x0,MK.sel.x1),b=Math.min(MK.sel.y0,MK.sel.y1);
    const w2=Math.abs(MK.sel.x1-MK.sel.x0)+1,h2=Math.abs(MK.sel.y1-MK.sel.y0)+1;
    h+='<span style="color:#ffd24a">marquee</span> from '+fmt(a,b)+'  '+w2+'\u00d7'+h2+' tiles';
  }else{
    h+='<span style="color:#5f8a72">holding</span> '+
       (MK.mode==='obj'?((mkObjKinds().find(q=>q.t===MK.objBrush)||{}).l||MK.objBrush)
                       :('"'+MK.brush+'"'))+
       ' <span style="color:#5f8a72">on</span> '+MK.layer.toUpperCase();
  }
  e.innerHTML=h;
}
function mkPaint(){
  if(!MK)return;
  const g=MK.g,l=mkL();mkClamp();
  g.imageSmoothingEnabled=false;
  g.fillStyle='#05100c';g.fillRect(0,0,MK.cv.width,MK.cv.height);
  const PL=l.pal||{s1:'#2a8f5e',s2:'#07301f'};
  const gr=g.createLinearGradient(0,MK.py,0,MK.py+mkH()*MK.zoom);
  gr.addColorStop(0,PL.s1);gr.addColorStop(1,PL.s2);
  g.globalAlpha=.30;g.fillStyle=gr;g.fillRect(MK.px,MK.py,mkW()*MK.zoom,mkH()*MK.zoom);g.globalAlpha=1;
  const x0=Math.max(0,Math.floor(-MK.px/MK.zoom)),x1=Math.min(mkW()-1,Math.ceil((MK.cv.width-MK.px)/MK.zoom));
  const y0=Math.max(0,Math.floor(-MK.py/MK.zoom)),y1=Math.min(mkH()-1,Math.ceil((MK.cv.height-MK.py)/MK.zoom));
  /* back to front, so the depths read the way the game paints them */
  for(const LK of ['back','mid','fore']){
    const vis=MK.lay[LK];
    if(!vis)continue;
    g.globalAlpha=(vis===1)?0.28:(MK.layer===LK?1:0.82);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const c=l.r[y][x];
      if(c==='.'||mkLayerOf(c)!==LK)continue;
      mkDraw(g,c,MK.px+x*MK.zoom,MK.py+y*MK.zoom,MK.zoom);}
    g.globalAlpha=1;}
  if(MK.grid){
    g.globalAlpha=.30;g.strokeStyle='#3fd86a';g.lineWidth=1;g.beginPath();
    for(let x=0;x<=mkW();x+=RW){const X=Math.round(MK.px+x*MK.zoom)+.5;
      g.moveTo(X,MK.py);g.lineTo(X,MK.py+mkH()*MK.zoom);}
    for(let y=0;y<=mkH();y+=RH){const Y=Math.round(MK.py+y*MK.zoom)+.5;
      g.moveTo(MK.px,Y);g.lineTo(MK.px+mkW()*MK.zoom,Y);}
    g.stroke();g.globalAlpha=1;
    if(MK.zoom>=11){g.globalAlpha=.09;g.strokeStyle='#cfe3d4';g.beginPath();
      for(let x=x0;x<=x1+1;x++){const X=Math.round(MK.px+x*MK.zoom)+.5;
        g.moveTo(X,MK.py+y0*MK.zoom);g.lineTo(X,MK.py+(y1+1)*MK.zoom);}
      for(let y=y0;y<=y1+1;y++){const Y=Math.round(MK.py+y*MK.zoom)+.5;
        g.moveTo(MK.px+x0*MK.zoom,Y);g.lineTo(MK.px+(x1+1)*MK.zoom,Y);}
      g.stroke();g.globalAlpha=1;}
  }
  g.strokeStyle='#57c46a';g.lineWidth=2;
  g.strokeRect(MK.px-1,MK.py-1,mkW()*MK.zoom+2,mkH()*MK.zoom+2);
  mkPaintObjects();
  mkCoord();
  if(MK.sel){
    const a=Math.min(MK.sel.x0,MK.sel.x1),b=Math.min(MK.sel.y0,MK.sel.y1);
    const w2=Math.abs(MK.sel.x1-MK.sel.x0)+1,h2=Math.abs(MK.sel.y1-MK.sel.y0)+1;
    g.strokeStyle='#ffd24a';g.lineWidth=2;g.setLineDash([5,4]);
    g.strokeRect(MK.px+a*MK.zoom,MK.py+b*MK.zoom,w2*MK.zoom,h2*MK.zoom);g.setLineDash([]);}
  const wi=c6WorldOf(MK.cur);
  document.getElementById('mkinfo').innerHTML=
    (MK.cur===0?'THE SHIP':isArc(MK.cur)?'FWEDDLE QUEST':(wi?C6W[wi.w].nm:'STAGE'))+'<br>'+

function mkCell(cx2,cy2){const r=MK.cv.getBoundingClientRect();
  return [Math.floor((cx2-r.left-MK.px)/MK.zoom),Math.floor((cy2-r.top-MK.py)/MK.zoom)];}
function mkRaw(cx2,cy2){const r=MK.cv.getBoundingClientRect();
  return [(cx2-r.left-MK.px)/(MK.zoom/16),(cy2-r.top-MK.py)/(MK.zoom/16)];}
function mkObjAt(px2,py2){
  const R=14;
  const kinds=mkObjKinds().map(k=>k.t).reverse();
  for(const t of kinds){const list=mkList(t);
    for(let i=list.length-1;i>=0;i--){
      const p=mkPos(t,list[i]);
      if(Math.abs(p[0]-px2)<R&&Math.abs(p[1]-py2)<R)return {t:t,i:i};
      if(t==='win'){const o=list[i],S=MK.zoom/16;
        if(Math.abs(MK.px+(o.x+o.w)*S-px2)<R&&Math.abs(MK.py+(o.y+o.h)*S-py2)<R)return {t:t,i:i,rs:1};}
      if(t==='pl'){const o=list[i];
        if(Math.abs(MK.px+(o[1]+1)*MK.zoom-px2)<R&&Math.abs(MK.py+o[2]*MK.zoom-py2)<R)return {t:t,i:i,rs:1};}
    }}

}
function mkStamp(x,y){
  /* a piece is written on the layer it belongs to, and only when that layer
     is the one being worked on -- otherwise the tap is simply ignored */
  if(mkLayerOf(MK.brush)!==MK.layer&&MKONE.indexOf(MK.brush)<0)return;
  if(MKONE.indexOf(MK.brush)>=0){const l=mkL();
    for(let yy=0;yy<mkH();yy++){const k=l.r[yy].indexOf(MK.brush);if(k>=0)mkSet(k,yy,'.');}}
  mkSet(x,y,MK.brush);
}
function mkLine(x0,y0,x1,y1,fn){
  const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  let er=dx-dy,x=x0,y=y0;
  for(let n=0;n<5000;n++){fn(x,y);if(x===x1&&y===y1)break;
    const e2=2*er;if(e2>-dy){er-=dy;x+=sx;}if(e2<dx){er+=dx;y+=sy;}}
}
function mkFill(x,y,c){
  const from=mkAt(x,y);if(from===c)return;
  const q=[[x,y]],seen=new Set();
  while(q.length){const[a,b]=q.pop();
    if(a<0||b<0||a>=mkW()||b>=mkH())continue;
    const k=b*mkW()+a;if(seen.has(k))continue;seen.add(k);
    if(mkAt(a,b)!==from)continue;
    mkSet(a,b,c);q.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);
    if(seen.size>90000)break;}
}

/* ---- objects: add, list, edit ---- */
function mkCentre(){return [Math.round((MK.cv.width/2-MK.px)/MK.zoom),
                            Math.round((MK.cv.height/2-MK.py)/MK.zoom)];}
function mkObjAdd(t,atx,aty){
  const c0=mkCentre();
  const cx3=(atx===undefined?c0[0]:atx), cy3=(aty===undefined?c0[1]:aty);
  const px2=cx3*16+8,py2=cy3*16+8;
  mkSnap();
  if(t==='ene'){                       /* creatures live in the grid, not in a list */
    mkSet(cx3,cy3,MK.eneK||'a');
    MK.objSel=null;mkPaint();mkWarn();return;}
  if(t==='door'){
    /* A DOOR IS NEVER ALONE. Its partner is laid down with it and the two
       are pointed at each other before either exists on screen. */
    const i0=SHIP.doors.length;
    SHIP.doors.push({x:cx3,y:cy3,link:i0+1,lbl:'DOOR '+(i0/2+1|0)});
    SHIP.doors.push({x:Math.min(mkW()-2,cx3+6),y:cy3,link:i0,lbl:'RETURN'});
    MK.objSel={t:'door',i:i0};
    mkPaint();mkObjects();mkWarn();
    return;}
  const o=
    t==='np' ?{x:px2,y:py2,kind:(mkL().np||[]).length%12,tth:MK.cur===0?'space':'tree',
               name:'Somebody',lines:['They put me here on purpose.']}
   :t==='dc' ?{k:'bench',x:px2,y:py2,sd:(Math.random()*255)|0,tag:MK.cur===0}
   :t==='ht' ?{x:px2,y:py2,kind:(mkL().ht||[]).length%5}
   :t==='lg' ?{x:px2,y:py2,vault:false,name:'NEW LOG'}
   :t==='sg' ?{x:cx3,y:cy3,text:'THIS WAY, PROBABLY'}
   :t==='win'?{k:'port',x:cx3*16,y:cy3*16,w:48,h:48}
   :t==='mc' ?{k:'plat',x:cx3*16,y:cy3*16,w:26,h:6,ay:20,sp:0.022,ph:0}
   :t==='pl' ?[Math.max(1,cx3-3),Math.min(mkW()-2,cx3+3),Math.min(mkH()-1,cy3)]
   :t==='vn' ?(()=>{const a=[];for(let k=0;k<8;k++)a.push([cx3*16+8,(cy3+k)*16+8]);return a;})()
   :null;
  if(!o)return;
  mkList(t).push(o);MK.objSel={t:t,i:mkList(t).length-1};
  mkPaint();mkObjects();mkWarn();
}
function mkObjDel(t,i){
  mkSnap();
  if(t==='door'){
    /* removing one leaf takes its partner, and every later link is re-based
       so no door is left pointing at a stranger */
    const d=SHIP.doors[i],pair=d?d.link:-1;
    const drop=[i,pair].filter(k=>k>=0).sort((a,b)=>b-a);
    drop.forEach(k=>SHIP.doors.splice(k,1));
    SHIP.doors.forEach(q=>{let l=q.link;drop.forEach(k=>{if(l>k)l--;});q.link=l;});
    SHIP.doors.forEach((q,k)=>{if(q.link<0||q.link>=SHIP.doors.length)q.link=k;});
  }else mkList(t).splice(i,1);
  MK.objSel=null;mkPaint();mkObjects();mkWarn();
}

/* one place where a form field is turned back into a value */
function mkFormApply(el){
  const[t,i,k]=el.dataset.mkf.split(':');
  const o=mkList(t)[+i];if(!o)return;
  mkSnap();const v=el.value;
  if(t==='vn'&&k==='len'){const n=Math.max(2,Math.min(40,+v|0));
    const hx=o[0][0],hy=o[0][1];o.length=0;
    for(let q=0;q<n;q++)o.push([hx,hy+q*16]);}
  else if(t==='pl')o[k==='p0'?0:k==='p1'?1:2]=+v|0;
  else if(k==='lines')o.lines=v.split('\n').filter(q=>q.trim());
  else if(k==='vault')o.vault=(v==='yes');
  else if(['name','lbl','k','tth','text'].indexOf(k)>=0)o[k]=v;
  else o[k]=(k==='sp')?parseFloat(v):(+v|0);
  mkPaint();mkWarn();

       'Deleting one deletes its partner and re-bases every other link.</div>';}
  else if(t==='win'){h+=row('cut',sl('k',o.k,['port','oval','hex','slit','tri','arch','bay','pano']));
    h+=row('x,y px',num('x',o.x)+num('y',o.y));h+=row('w,h px',num('w',o.w)+num('h',o.h));}
  else if(t==='np'){h+=row('name',txt('name',o.name||''));
    h+=row('body 0-11',num('kind',o.kind|0));
    h+=row('look',sl('tth',o.tth||'space',['space','tree']));
    h+=row('x,y px',num('x',o.x)+num('y',o.y));
    h+='<textarea '+S+'lines" style="width:100%;height:64px;font-size:10px;background:#0c1a14;'+
       'border:1px solid #2c5344;color:#cfe3d4;white-space:pre">'+(o.lines||[]).join('\n')+'</textarea>';}
  else if(t==='dc'){h+=row('kind',sl('k',o.k,['bench','picnic','fire','shrub','fern','column','statue','rubble','cattail','lily']));
    h+=row('x,y px',num('x',o.x)+num('y',o.y));}
  else if(t==='mc'){h+=row('kind',sl('k',o.k,['plat','piston','grav','tele','lever']));
    h+=row('x,y px',num('x',o.x)+num('y',o.y));h+=row('travel',num('ay',o.ay|0));}
  else if(t==='vn'){h+=row('links',num('len',o.length));}
  else if(t==='pl'){h+=row('x from/to',num('p0',o[0])+num('p1',o[1]));h+=row('surface',num('p2',o[2]));}
  else if(t==='lg'){h+=row('name',txt('name',o.name||''));
    h+=row('x,y px',num('x',o.x)+num('y',o.y));h+=row('vault',sl('vault',o.vault?'yes':'no',['no','yes']));}
  else if(t==='ht'){h+=row('style',num('kind',o.kind|0));h+=row('x,y px',num('x',o.x)+num('y',o.y));}
  else if(t==='sg'){h+=row('tile x,y',num('x',o.x)+num('y',o.y));
    h+='<textarea '+S+'text" style="width:100%;height:40px;font-size:10px;background:#0c1a14;'+
       'border:1px solid #2c5344;color:#cfe3d4">'+(o.text||'')+'</textarea>';}
  return h+'</div>';
}

/* ---------------- the check: the game's own prover, run on demand ---------- */
function mkSettle(rows,W2,H2){
  const g=rows.map(r=>r.split(''));
  let moved=true,guard=0;
  while(moved&&guard++<H2){moved=false;
    for(let y=H2-3;y>=1;y--)for(let x=1;x<W2-1;x++){
      if(g[y][x]!=='C')continue;
      const bl=g[y+1][x];
      if(bl==='.'){g[y+1][x]='C';g[y][x]='.';moved=true;}
      else if('#=-CAm'.indexOf(bl)<0){g[y][x]='.';moved=true;}}}
  return g;
}
function mkReach(g,W2,H2,sx,sy,tx,ty){
  const stand=(x,y)=>x>0&&y>0&&x<W2-1&&y<H2&&MKPASS(g[y][x])&&(y===H2-1||MKSUPP(g[y+1][x]));
  const seen=new Uint8Array(W2*H2),q=[];
  const push=(x,y)=>{const k=y*W2+x;if(!seen[k]&&stand(x,y)){seen[k]=1;q.push([x,y]);}};
  const settle=(x,y)=>{let yy=y;
    while(yy<H2-1&&MKPASS(g[yy][x])&&!MKSUPP(g[yy+1][x]))yy++;
    if(MKPASS(g[yy][x]))push(x,yy);};
  settle(sx,sy);
  while(q.length){const[x,y]=q.pop();
    for(const dx of[-1,1]){const nx=x+dx;if(nx>0&&nx<W2-1&&MKPASS(g[y][nx]))settle(nx,y);}
    for(let h=1;h<=3;h++){const ay=y-h;if(ay<1)break;
      if('#ACx|'.indexOf(g[ay][x])>=0)break;
      for(let dx=-2;dx<=2;dx++){const nx=x+dx;if(nx<=0||nx>=W2-1)continue;
        let ok=true;
        for(let s2=1;s2<=Math.abs(dx);s2++){const mx=x+Math.sign(dx)*s2;
          if(!MKPASS(g[ay][mx])){ok=false;break;}}
        if(ok)settle(nx,ay);}}}
  return {seen:seen,hit:!!(seen[ty*W2+tx]||(ty<H2-1&&seen[(ty+1)*W2+tx]))};
}
function mkCheck(i){
  const l=LEVELS[i],rows=l.r,H2=rows.length,W2=rows[0].length;
  const out={err:[],warn:[],ok:[]};
  if(rows.some(r=>r.length!==W2))out.err.push('rows are not all the same width');
  let leak=0;
  for(let x=0;x<W2;x++){if(rows[0][x]!=='#')leak++;if(rows[H2-1][x]!=='#')leak++;}
  for(let y=0;y<H2;y++){if(rows[y][0]!=='#')leak++;if(rows[y][W2-1]!=='#')leak++;}
  if(leak)out.err.push(leak+' open border cell'+(leak>1?'s':'')+' \u2014 Chip falls out');
  let sx=-1,sy=-1,bx=-1,by=-1,nS=0,nB=0,nStar=0,nKey=0,nDoor=0;
  for(let y=0;y<H2;y++)for(let x=0;x<W2;x++){const c=rows[y][x];
    if(c==='S'){sx=x;sy=y;nS++;}else if(c==='B'){bx=x;by=y;nB++;}
    else if(c==='*')nStar++;else if(c==='k')nKey++;else if(c==='A')nDoor++;}
  if(i!==0){
    if(nS!==1)out.err.push(nS?'there are '+nS+' STARTs':'no START placed');
    if(nB!==1)out.err.push(nB?'there are '+nB+' GOALs':'no GOAL placed');
    if(!nStar)out.warn.push('no specimen (*) on this stage');
    if(nDoor&&!nKey)out.err.push('a locked door with no key anywhere');
    if(nS===1&&nB===1){
      const g=mkSettle(rows,W2,H2),R=mkReach(g,W2,H2,sx,sy,bx,by);
      if(R.hit)out.ok.push('the goal can be reached from the start');
      else out.err.push('the GOAL cannot be reached from the START');
      const nm={'*':'specimen','k':'key','P':'jetpack','W':'cannon','Q':'ammo cache','M':'wand'};
      const stray=[];
      for(let y=1;y<H2-1;y++)for(let x=1;x<W2-1;x++){
        const c=g[y][x];if(!nm[c])continue;const k=y*W2+x;
        if(!R.seen[k]&&!(y<H2-1&&R.seen[(y+1)*W2+x])&&!(y>0&&R.seen[(y-1)*W2+x]))
          stray.push(nm[c]+' '+x+','+y);}
      if(stray.length)out.warn.push('walled off: '+stray.slice(0,5).join('; ')+
        (stray.length>5?' (+'+(stray.length-5)+')':''));
      else out.ok.push('every pickup can be walked to');}
  }else{
    if(nS!==1)out.err.push('the ship needs exactly one START');
    /* the vessel's own rule: no compartment may see another */
    const g=rows.map(r=>r.split('')),lab=new Int32Array(W2*H2).fill(-1);let n=0;
    const air=(x,y)=>x>=0&&y>=0&&x<W2&&y<H2&&'#ACx|'.indexOf(g[y][x])<0;
    for(let y=0;y<H2;y++)for(let x=0;x<W2;x++){
      if(!air(x,y)||lab[y*W2+x]>=0)continue;
      const id=n++,st=[[x,y]];lab[y*W2+x]=id;
      while(st.length){const[a,b]=st.pop();
        for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
          const p=a+dx,q=b+dy;
          if(!air(p,q)||lab[q*W2+p]>=0)continue;
          lab[q*W2+p]=id;st.push([p,q]);}}}
    const rm=new Map();
    for(let y=0;y<H2;y++)for(let x=0;x<W2;x++){if(!air(x,y))continue;
      const k=Math.floor(y/RH)*1000+Math.floor(x/RW);
      if(!rm.has(k))rm.set(k,new Set());rm.get(k).add(lab[y*W2+x]);}
    let leaks=0;
    for(const[k,ids]of rm){
      const ry=Math.floor(k/1000),rx=k%1000,seen2=new Set();
      for(let y=ry*RH-1;y<=ry*RH+RH;y++)for(let x=rx*RW-1;x<=rx*RW+RW;x++)
        if(air(x,y))seen2.add(lab[y*W2+x]);
      if(seen2.size>1)leaks++;}
    if(leaks)out.warn.push(leaks+' room'+(leaks>1?'s':'')+' can see into another compartment');
    else out.ok.push('no compartment can be seen from another');
    const bad=SHIP.doors.filter((d,k)=>{const o=SHIP.doors[d.link];return !o||o.link!==k;});
    if(bad.length)out.err.push(bad.length+' door'+(bad.length>1?'s do':' does')+" not point back at its partner");
    else out.ok.push('every door pairs with the one it names');
  }
  let flo=0;
  for(let y=1;y<H2-1;y++)for(let x=1;x<W2-1;x++){
    if(rows[y][x]!=='-')continue;
    const so=c=>'#|xCAL'.indexOf(c)>=0;
    let an=false;
    for(const d of[-1,1]){let gx=x+d,gd=0;
      while(gx>0&&gx<W2-1&&rows[y][gx]==='-'&&gd++<40)gx+=d;
      if(so(rows[y][gx])){an=true;break;}}
    if(!an&&(so(rows[y-1][x])||so(rows[y+1][x])))an=true;
    if(!an)flo++;}
  if(flo)out.warn.push(flo+' branch tile'+(flo>1?'s':'')+' float free \u2014 the loader turns those into shelves');
  return out;
}
function mkWarn(){
  if(!MK)return;
  const o=mkCheck(MK.cur),e=document.getElementById('mkwarn');
  let h='';
  if(o.err.length)h+='<span class="mkbad">&#10007; '+o.err.length+' problem'+(o.err.length>1?'s':'')+'</span><br>';
  if(o.warn.length)h+='<span class="mkmid">! '+o.warn.length+' warning'+(o.warn.length>1?'s':'')+'</span>';
  if(!o.err.length&&!o.warn.length)h='<span class="mkgood">&#10003; clean</span>';
  e.innerHTML=h;
}
function mkRunCheck(){
  const o=mkCheck(MK.cur);
  let h='<div class="mknote"><b>'+LEVELS[MK.cur].n+'</b> &middot; '+mkW()+'&times;'+mkH()+'</div>';
  if(!o.err.length&&!o.warn.length)h+='<div class="mknote mkgood">Clean. Nothing to fix.</div>';
  o.err.forEach(x=>h+='<div class="mknote mkbad">&#10007; '+x+'</div>');
  o.warn.forEach(x=>h+='<div class="mknote mkmid">! '+x+'</div>');
  o.ok.forEach(x=>h+='<div class="mknote mkgood">&#10003; '+x+'</div>');
  let ne=0;h+='<div class="mkgrp">EVERY STAGE</div>';
  for(let i=0;i<LEVELS.length;i++){const c=mkCheck(i);
    if(c.err.length){ne++;h+='<div class="mknote mkbad">'+i+' '+LEVELS[i].n+' \u2014 '+c.err[0]+'</div>';}}
  h+='<div class="mknote">'+(LEVELS.length-ne)+' of '+LEVELS.length+' stages pass.</div>';
  document.getElementById('mkchkB').innerHTML=h;
  mkSheet('mkchkS',true);mkWarn();
}

/* =====================================================================
   EXPORT -- the game rewrites itself.
   The running page still holds its own source, so the build is made by
   dropping a data block into it at a marked line and handing the whole
   file back. No paste step, no second tool: what comes out is a game.
   ===================================================================== */
function mkPayload(){
  const st={};
  for(let i=0;i<LEVELS.length;i++){
    if(!mkEdited(i))continue;
    const l=LEVELS[i],e={r:l.r};
    MKF.forEach(k=>{if((l[k]||[]).length)e[k]=l[k];});
    st[i]=e;}
  const out={v:1,made:new Date().toISOString(),stages:st};
  if(JSON.stringify(SHIP.doors)!==JSON.stringify(MK.shipBase?MK.shipBase.doors:SHIP.doors)||
     JSON.stringify(SHIP.win)!==JSON.stringify(MK.shipBase?MK.shipBase.win:SHIP.win))
    out.ship={doors:SHIP.doors,win:SHIP.win};
  else out.ship={doors:SHIP.doors,win:SHIP.win};
  return out;
}
function mkRecompile(){
  const src=document.documentElement.outerHTML;
  const MARK='/*__CHIP_MAKER_PAYLOAD__*/';
  const i=src.indexOf(MARK);
  if(i<0)return null;
  const j=src.indexOf(MARK,i+MARK.length);
  const payload=MARK+'\nconst CHIP_MAKER_DATA='+JSON.stringify(mkPayload())+';\n'+MARK;
  const head=src.slice(0,i);
  const tail=j>i?src.slice(j+MARK.length):src.slice(i+MARK.length);
  return '<!DOCTYPE html>\n'+head+payload+tail;
}
function mkBuildExport(){
  const b=document.getElementById('mkexB');
  let n=0,ne=0;
  for(let i=0;i<LEVELS.length;i++)if(mkEdited(i)){n++;if(mkCheck(i).err.length)ne++;}
  b.innerHTML=
   '<div class="mknote"><b>'+n+'</b> stage'+(n===1?'':'s')+' changed.'+
   (ne?' <span class="mkbad">'+ne+' still has a problem \u2014 run CHECK.</span>':
       (n?' <span class="mkgood">They all pass the check.</span>':''))+'</div>'+
   '<div class="mknote">EXPORT writes a complete, playable copy of this game with your '+
   'stages baked in. It is not a patch and it is not a paste \u2014 open the file it gives '+
   'you and the ship is yours.</div>'+
   '<div class="mkrow" style="border:0;gap:6px">'+
     '<button class="mkb on" id="mkdl">BUILD &amp; DOWNLOAD</button>'+
     '<button class="mkb" id="mkjson">SAVE .json</button>'+
     '<button class="mkb" id="mkload">LOAD .json</button>'+
     '<input type="file" id="mkfile" accept=".json,.txt" style="display:none">'+
   '</div><div class="mknote" id="mkdlmsg"></div>'+
   '<div class="mkgrp">WHAT TRAVELS</div>'+
   '<div class="mknote">Tiles, vines, machines, pools, crew, furniture, huts, log mouths, '+
   'sign words \u2014 and, for the vessel, its doors and its glass. Names, palettes and which '+
   'disc a stage belongs to stay as they are.</div>';
  document.getElementById('mkdl').onclick=()=>{
    const msg=document.getElementById('mkdlmsg');
    msg.innerHTML='<span class="mkmid">building\u2026</span>';
    setTimeout(()=>{
      const html=mkRecompile();
      if(!html){msg.innerHTML='<span class="mkbad">could not find the payload marker in this build</span>';return;}
      try{
        const bl=new Blob([html],{type:'text/html'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(bl);
        a.download='Chip_626_08_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.html';
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),8000);
        msg.innerHTML='<span class="mkgood">built '+Math.round(html.length/1024)+' KB \u2014 check your downloads</span>';
      }catch(err){msg.innerHTML='<span class="mkbad">'+err.message+'</span>';}
    },40);
  };
  document.getElementById('mkjson').onclick=()=>{
    const bl=new Blob([JSON.stringify(mkPayload(),null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(bl);
    a.download='chip-stages.json';document.body.appendChild(a);a.click();a.remove();};
  document.getElementById('mkload').onclick=()=>document.getElementById('mkfile').click();
  document.getElementById('mkfile').onchange=ev=>{
    const f=ev.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{
      const d=JSON.parse(rd.result);mkAdopt(d);
      mkStages();mkTop();mkPaint();mkWarn();mkBuildExport();
      document.getElementById('mkdlmsg').innerHTML='<span class="mkgood">loaded</span>';
    }catch(err){alert('could not read that file: '+err.message);}};
    rd.readAsText(f);};
  mkSheet('mkexS',true);
}
function mkAdopt(d){
  const st=d.stages||d;
  for(const k in st){const i=+k,S=st[k];
    if(!LEVELS[i]||!S.r)continue;
    LEVELS[i].r=S.r.slice();
    MKF.forEach(q=>{if(S[q])LEVELS[i][q]=JSON.parse(JSON.stringify(S[q]));});}
  if(d.ship){
    if(d.ship.doors)SHIP.doors=JSON.parse(JSON.stringify(d.ship.doors));
    if(d.ship.win)SHIP.win=JSON.parse(JSON.stringify(d.ship.win));}
}
/* on boot, a build that came out of the maker adopts its own baked-in stages */
function c6AdoptMakerData(){
  if(typeof CHIP_MAKER_DATA==='undefined'||!CHIP_MAKER_DATA)return;
  try{mkAdopt(CHIP_MAKER_DATA);
    console.log('CHIP MAKER: '+Object.keys(CHIP_MAKER_DATA.stages||{}).length+' hand-built stage(s) loaded');
  }catch(e){console.warn('CHIP MAKER: could not adopt baked stages',e);}
}
