// The world: our own, forty-one years after the Hush. One night in 2038 every satellite stopped answering
// and a pale ring appeared around the Moon. Nothing exploded. The phones just went quiet. The roads remained.

 txor:{n:'Texas to Oregon',from:'Fort Worth, Texas',to:'Portland, Oregon',why:'Your sister Juniper wrote you a letter on real paper. She runs a lamp shop in Portland now. "Come west," it says. "There is room here. There is rain."',stops:[
  {n:'Fort Worth',mi:0,k:'town',r:'city',st:'TX',f:'The stockyards still run cattle down Exchange Avenue at noon. The neon cowboy over the old saloon blinks the same message it has blinked since the Hush. Nobody remembers what it means.'},
  {n:'Wichita Falls',mi:115,k:'town',r:'plains',st:'TX',f:'A little waterfall the city built by hand, because the real one washed away long before your grandparents. People still come to look at it. It is the only waterfall for a long way.'},
  {n:'Amarillo',mi:330,k:'town',r:'plains',st:'TX',f:'Helium town. The old tanks hum in the wind. Kids buy balloons at the Saturday market and let them go, to see if the Ring will catch them.'},
  {n:'Cadillac Ranch',mi:345,k:'mark',r:'plains',st:'TX',f:'Ten old cars buried nose-down in a wheat field. Since the Hush, travelers paint them with the names of people they are trying to find. The paint is a hundred layers thick.',sp:'cadillac'},
  {n:'Canadian River',mi:380,k:'river',r:'mesa',st:'TX',f:'A wide red river cutting through the breaks. The old bridge has a sign: CLOSED SINCE 2051. TRY YOUR LUCK.'},
  {n:'Liberal',mi:520,k:'town',r:'prairie',st:'KS',f:'The town keeps a little farmhouse painted like a storybook, with a yellow brick path. A woman in gingham gives tours for two chits. She says she has given 9,000 tours.'},
  {n:'Dodge City',mi:600,k:'town',r:'prairie',st:'KS',f:'Front Street has wooden sidewalks again. The sheriff rides a horse and carries a radio that only plays static. He says the static is company.'},
  {n:'Garden City',mi:650,k:'town',r:'prairie',st:'KS',f:'The Big Pool is still filled every June, half a city block of water under a giant sky. The zoo keeps the old animals and the new ones, the ones nobody has a name for yet.',sp:'pool'},
  {n:"Bent's Old Fort",mi:830,k:'mark',r:'prairie',st:'CO',f:'An adobe trading fort on the Arkansas River, rebuilt for the second time. Traders here still swap news by mouth. They keep a chalkboard of who has passed through, going which way.',sp:'fort'},
  {n:'Pueblo',mi:910,k:'town',r:'prairie',st:'CO',f:'Steel town, chile town. The mill makes horseshoes, bells and wagon springs now. Every evening at six the whole town smells like roasting peppers.'},
  {n:'Denver',mi:1020,k:'town',r:'mountains',st:'CO',f:'The gold dome still catches the morning light. The Mile High step on the capitol is worn into a bowl from everyone standing on it, just to say they did.',sp:'dome'},
  {n:'Cheyenne',mi:1120,k:'town',r:'prairie',st:'WY',f:'Wind town. They tie down everything, even the benches. The rodeo runs every July, and nobody has missed one in a hundred and fifty years.'},
  {n:'Independence Rock',mi:1330,k:'mark',r:'desert',st:'WY',f:'A huge granite dome covered in the names of pioneers from the 1840s. Below them are names from the 2040s. Below those, names from this year. You could add yours.',sp:'dome_rock'},
  {n:'South Pass',mi:1430,k:'pass',r:'mountains',st:'WY',f:'The gentle saddle over the Continental Divide. Wagons crossed here in 1843. On a clear night up here the Ring looks close enough to touch.'},
  {n:'Green River',mi:1520,k:'river',r:'desert',st:'WY',f:'Cold and fast, and greener than it has any right to be. There is a ferry run by two brothers who argue the whole way across.'},
  {n:'Fort Bridger',mi:1600,k:'town',r:'mountains',st:'WY',f:'An old trading post with a blacksmith, a schoolhouse and one working jukebox. The jukebox only plays songs from 1990.'},
  {n:'Soda Springs',mi:1730,k:'mark',r:'mountains',st:'ID',f:'The water fizzes right out of the ground. Pioneers called it Beer Springs. There is a geyser that goes off every hour on the hour, which is the most reliable clock left in Idaho.',sp:'geyser'},
  {n:'Fort Hall',mi:1790,k:'town',r:'desert',st:'ID',f:'The trail splits here, the way it always has. A sign points to Oregon. Another sign, hand-painted, points to SOMEWHERE ELSE. Nobody who follows that one writes back.'},
  {n:'Snake River',mi:1950,k:'river',r:'desert',st:'ID',f:'A deep canyon river. The old ferry crossing at Three Island is still the best place to try. The water is the color of old glass.'},
  {n:'Boise',mi:2050,k:'town',r:'forest',st:'ID',f:'The City of Trees, and they mean it. The capitol is heated by hot springs. The library stays open all night, for anyone who cannot sleep.'},
  {n:'Blue Mountains',mi:2220,k:'pass',r:'mountains',st:'OR',f:'Steep and dark with fir trees. Wagons had to be lowered on ropes here. Your van has better brakes, mostly.'},
  {n:'The Dalles',mi:2310,k:'town',r:'gorge',st:'OR',f:'Cherry orchards on the hills over the Columbia. The end of the overland road. From here you can take the river, or the long way around Mt. Hood.'},
  {n:'Columbia River',mi:2360,k:'river',r:'gorge',st:'OR',f:'The great river through the Gorge, between cliffs and waterfalls. You can float the van on a raft down to the valley, or take the Barlow Road around the mountain.'},
  {n:'Portland',mi:2450,k:'end',r:'forest',st:'OR',f:'Rain. Bridges. Lamps in every window. Somewhere on the east side is a lamp shop with your name on a note taped to the door.',sp:'portland'}]},
 nypo:{n:'New York to Portland',from:'New York City',to:'Portland, Oregon',why:'Your grandfather drove this road in 2037, the year before the Hush. He left you his map, his van and one instruction: "Finish it." Portland is three thousand miles west.',stops:[
  {n:'New York City',mi:0,k:'town',r:'city',st:'NY',f:'The towers are green now. Gardens on every roof, ivy down every wall. The subway still runs on one line, and everyone rides it just to hear the sound.',sp:'nyc'},
  {n:'Delaware River',mi:60,k:'river',r:'forest',st:'NJ',f:'Where Washington crossed, a long time ago. The bridge is fine, but the toll collector is a goat. You have to pay the goat.'},
  {n:'Philadelphia',mi:95,k:'town',r:'city',st:'PA',f:'The Liberty Bell is still cracked. Every New Year someone tries to ring it anyway. The pretzels are the best on the whole road.'},
  {n:'Allegheny Mountains',mi:290,k:'pass',r:'forest',st:'PA',f:'Long ridges like folded blankets. The old turnpike tunnels drip and echo. Honk in the middle and the echo comes back late, like somebody else is honking.'},
  {n:'Pittsburgh',mi:370,k:'town',r:'city',st:'PA',f:'Three rivers, four hundred bridges, and inclines that still haul people up the cliffs for a chit. The whole city is yellow and black.'},
  {n:'Columbus',mi:555,k:'town',r:'plains',st:'OH',f:'A big quiet city of porches. Everyone here waves. If you do not wave back, they wave harder.'},
  {n:'Indianapolis',mi:730,k:'town',r:'plains',st:'IN',f:'The old speedway is a farm now. They race horses on the oval every May, and the crowd is still enormous.'},
  {n:'Chicago',mi:910,k:'town',r:'city',st:'IL',f:'The lake looks like an ocean. The silver bean in the park still reflects the sky, and on Ring nights it reflects the Ring.',sp:'chicago'},
  {n:'Mississippi River',mi:1080,k:'river',r:'plains',st:'IA',f:'The big one. Barges still move down it, slow as clouds. A paddlewheel ferry crosses at the Quad Cities, when the captain feels like it.'},
  {n:'Des Moines',mi:1250,k:'town',r:'plains',st:'IA',f:'Corn as far as the eye can see, and taller than you remember corn being. Locals say the corn got taller after the Hush. Locals say a lot of things.'},
  {n:'Missouri River',mi:1375,k:'river',r:'prairie',st:'NE',f:'Muddy and wide. Lewis and Clark came up this river. So did everyone else, eventually.'},
  {n:'Omaha',mi:1385,k:'town',r:'prairie',st:'NE',f:'Where the old trails jumped off. The outfitters still sell wagon gear, even though almost nobody has a wagon. They sell van gear too, if you ask nicely.'},
  {n:'Fort Kearny',mi:1580,k:'mark',r:'prairie',st:'NE',f:'Every spring, half a million sandhill cranes land on the Platte River nearby. The sound is like the whole sky talking at once.',sp:'fort'},
  {n:'Chimney Rock',mi:1780,k:'mark',r:'prairie',st:'NE',f:'A thin spire of clay and ash, the most famous landmark on the Oregon Trail. It is shorter than it was in 1843. It is shorter than it was last year.',sp:'chimney'},
  {n:'Fort Laramie',mi:1880,k:'town',r:'prairie',st:'WY',f:'A white army fort turned into a trading post turned into a town. The bugle still plays at sunrise. A kid named Wes plays it, badly, every morning.'},
  {n:'Independence Rock',mi:2030,k:'mark',r:'desert',st:'WY',f:'A granite dome covered in pioneer names. Get here by the Fourth of July, they used to say, or the snow catches you in the mountains.',sp:'dome_rock'},
  {n:'South Pass',mi:2130,k:'pass',r:'mountains',st:'WY',f:'The gentle saddle over the Continental Divide. On one side the rain runs to the Atlantic. On the other, to the Pacific.'},
  {n:'Green River',mi:2220,k:'river',r:'desert',st:'WY',f:'Cold and fast. Two brothers run a ferry here and argue the whole way across.'},
  {n:'Fort Bridger',mi:2300,k:'town',r:'mountains',st:'WY',f:'A blacksmith, a schoolhouse and one working jukebox that only plays songs from 1990.'},
  {n:'Soda Springs',mi:2430,k:'mark',r:'mountains',st:'ID',f:'The water fizzes out of the ground, and a geyser goes off every hour on the hour.',sp:'geyser'},
  {n:'Fort Hall',mi:2490,k:'town',r:'desert',st:'ID',f:'The trail splits here. A hand-painted sign points to SOMEWHERE ELSE.'},
  {n:'Snake River',mi:2640,k:'river',r:'desert',st:'ID',f:'A deep canyon river the color of old glass.'},
  {n:'Boise',mi:2740,k:'town',r:'forest',st:'ID',f:'The City of Trees. The library stays open all night for anyone who cannot sleep.'},
  {n:'Blue Mountains',mi:2910,k:'pass',r:'mountains',st:'OR',f:'Steep and dark with fir trees. Wagons were lowered on ropes here.'},
  {n:'The Dalles',mi:3000,k:'town',r:'gorge',st:'OR',f:'Cherry orchards over the Columbia, and the end of the overland road.'},
  {n:'Columbia River',mi:3050,k:'river',r:'gorge',st:'OR',f:'Float the van down the Gorge on a raft, or take the Barlow Road around Mt. Hood.'},
  {n:'Portland',mi:3140,k:'end',r:'forest',st:'OR',f:'Rain, bridges, lamps in every window. Your grandfather\'s map ends here, with a little star drawn on a street called Hawthorne.',sp:'portland'}]},
 txks:{n:'Texas to Kansas',from:'Austin, Texas',to:'Garden City, Kansas',why:'Your best friend Moss moved to Garden City to work at the zoo with the animals nobody has names for. She sent you a postcard of the Big Pool. On the back it says: "Bring a towel."',stops:[
  {n:'Austin',mi:0,k:'town',r:'city',st:'TX',f:'Bats still pour out from under the Congress Avenue bridge every summer evening, a million at a time. People bring blankets and watch like it is fireworks.'},
  {n:'Waco',mi:100,k:'town',r:'plains',st:'TX',f:'An old suspension bridge over the Brazos, and a soda fountain that has been serving the same drink since 1885.'},
  {n:'Fort Worth',mi:200,k:'town',r:'city',st:'TX',f:'The stockyards still run cattle at noon. The neon cowboy blinks a message nobody remembers.'},
  {n:'Wichita Falls',mi:315,k:'town',r:'plains',st:'TX',f:'A little waterfall the city built by hand. It is the only waterfall for a long way.'},
  {n:'Red River',mi:330,k:'river',r:'plains',st:'OK',f:'The river is red because the dirt is red. The border between Texas and Oklahoma, and the two sides still argue about where exactly the middle is.'},
  {n:'Wichita Mountains',mi:380,k:'mark',r:'mesa',st:'OK',f:'Old pink granite hills with bison and longhorns roaming free. Elk bugle in the fall. The oldest mountains on this road.',sp:'granite'},
  {n:'Oklahoma City',mi:470,k:'town',r:'plains',st:'OK',f:'Red dirt and wide streets. A field of empty chairs downtown remembers people from long ago. Somebody leaves fresh flowers every morning.'},
  {n:'Gloss Mountains',mi:610,k:'mark',r:'mesa',st:'OK',f:'Red mesas that sparkle in the sun because of the selenite crystals in the rock. Since the Hush, they sparkle at night too.',sp:'mesa'},
  {n:'Cimarron River',mi:690,k:'river',r:'prairie',st:'KS',f:'A shallow, sandy, sneaky river. Pioneers feared it more than the deep ones. The sand moves under you.'},
  {n:'Dodge City',mi:760,k:'town',r:'prairie',st:'KS',f:'Wooden sidewalks on Front Street. The sheriff\'s radio only plays static. He says the static is company.'},
  {n:'Garden City',mi:810,k:'end',r:'prairie',st:'KS',f:'The Big Pool under the biggest sky. Moss is waiting at the gate of the zoo, holding a towel.',sp:'pool'}]},
 r66:{n:'Route 66',from:'Chicago, Illinois',to:'Santa Monica, California',why:'You wrote a letter to Marigold, the night voice of KHUSH 105.9, and she read it on the air. A week later a postcard came back: "I broadcast from the end of the Santa Monica pier. Come see the ocean. Bring tapes." Old Route 66 runs the whole way.',stops:[
  {n:'Chicago',mi:0,k:'town',r:'city',st:'IL',f:'A brown sign on Adams Street still says BEGIN ROUTE 66. People touch it for luck before they leave. The corner of the sign is worn shiny.',sp:'chicago'},
  {n:'Pontiac',mi:100,k:'town',r:'plains',st:'IL',f:'Every wall in town has a mural, and since the Hush they keep painting new ones over the old. The newest one is a van that looks a lot like yours.'},
  {n:'Springfield',mi:200,k:'town',r:'plains',st:'IL',f:'A drive-up stand still sells corn dogs on a stick, the same way it has for a hundred and thirty years. The line is long. The line is always long.'},
  {n:'Mississippi River',mi:300,k:'river',r:'plains',st:'MO',f:'The old Chain of Rocks bridge has a bend in the middle, like it changed its mind halfway across. The river is wide and brown and in no hurry.'},
  {n:'St. Louis',mi:315,k:'town',r:'city',st:'MO',f:'The great silver arch still stands over the river. On Ring nights it lines up with the Ring exactly, and the whole city comes out to watch the two arches meet.',sp:'arch'},
  {n:'Meramec Caverns',mi:375,k:'mark',r:'forest',st:'MO',f:'Caves under the Ozarks, with stone curtains and underground rivers. Outlaws hid here once. Now people come down just to hear what real quiet sounds like.',sp:'cave'},
  {n:'Springfield, Missouri',mi:530,k:'town',r:'forest',st:'MO',f:'The other Springfield. A bait shop the size of a cathedral, and a diner that serves anyone who walks in, day or night.'},
  {n:'Tulsa',mi:710,k:'town',r:'plains',st:'OK',f:'A giant fiberglass man in a space helmet stands by the road holding a rocket. He has been waiting to take off for a long, long time.'},
  {n:'Oklahoma City',mi:815,k:'town',r:'plains',st:'OK',f:'A soda shop with a glowing sixty-foot bottle out front sells six hundred kinds of pop. Kids argue about which one is best. Nobody ever wins.'},
  {n:'Amarillo',mi:1070,k:'town',r:'plains',st:'TX',f:'Helium town. The old tanks hum in the wind. Kids let balloons go to see if the Ring will catch them.'},
  {n:'Cadillac Ranch',mi:1080,k:'mark',r:'plains',st:'TX',f:'Ten old cars buried nose-down in a field, painted a hundred layers thick with the names of people travelers are trying to find.',sp:'cadillac'},
  {n:'Tucumcari',mi:1190,k:'town',r:'mesa',st:'NM',f:'A whole street of motels with neon signs, and every one still lit. TONITE, VACANCY, WELCOME, buzzing pink and blue under a flat-topped mountain.'},
  {n:'Pecos River',mi:1260,k:'river',r:'mesa',st:'NM',f:'A thin green river in a red land. Cottonwoods lean over it like they are trying to get a drink.'},
  {n:'Albuquerque',mi:1340,k:'town',r:'mesa',st:'NM',f:'Balloon town. Every October hundreds of hot air balloons go up at dawn. People say they go a little higher every year, trying to reach the Ring.'},
  {n:'Continental Divide',mi:1460,k:'pass',r:'desert',st:'NM',f:'A trading post marks the spot. Rain on the east side of its roof runs to the Atlantic, rain on the west side to the Pacific. The owner stands in the middle when it rains.'},
  {n:'Gallup',mi:1480,k:'town',r:'desert',st:'NM',f:'Red cliffs, turquoise, and an old hotel where movie stars used to stay. The guest book has signatures from 1937 and from last Tuesday.'},
  {n:'Petrified Forest',mi:1550,k:'mark',r:'desert',st:'AZ',f:'Whole trees turned to stone, lying in the desert like they just fell asleep. Inside, the logs are striped red, purple and gold. It is bad luck to take a piece. Everyone knows someone who did.',sp:'petrified'},
  {n:'Meteor Crater',mi:1640,k:'mark',r:'desert',st:'AZ',f:'A hole in the desert almost a mile wide, made by a falling star fifty thousand years ago. Some folks camp on the rim every night, in case another one is coming.',sp:'crater'},
  {n:'Flagstaff',mi:1680,k:'town',r:'forest',st:'AZ',f:'Pine trees, cold nights, and the old observatory on the hill. The astronomers there never stopped watching the Ring. Their logbook is open to anyone.'},
  {n:'Kingman',mi:1830,k:'town',r:'desert',st:'AZ',f:'The last big town before the Mojave. Fill everything you have with water. The man at the pump will tell you that, twice.'},
  {n:'Colorado River',mi:1880,k:'river',r:'desert',st:'CA',f:'A blue-green river at the bottom of a hot canyon, the line between Arizona and California. The water is cold enough to make you yell.'},
  {n:'Mojave Desert',mi:1980,k:'mark',r:'desert',st:'CA',f:'A ghost town: one café, one sign, and nothing else for fifty miles. The café sign still lights up every night, with nobody around to read it.',sp:'amboy'},
  {n:'Cajon Pass',mi:2110,k:'pass',r:'mountains',st:'CA',f:'The road squeezes between two mountain ranges and drops toward the sea. On a clear day you can smell the ocean from the top.'},
  {n:'San Bernardino',mi:2150,k:'town',r:'city',st:'CA',f:'Orange groves, and a motel where every room is a tall white cone. You can sleep in one for three chits.'},
  {n:'Santa Monica',mi:2230,k:'end',r:'city',st:'CA',f:'The road runs out of land. A sign on the pier says END OF THE TRAIL. Past the Ferris wheel, a little radio shack sits at the very end of the pier, with an antenna and a light on.',sp:'pier'}]}};

const TALK={city:['An old man on a stoop tells you the city used to be so loud you could not hear yourself think. "Now I can hear myself think," he says. "It is mostly about lunch."','Kids are playing a game on the sidewalk with chalk squares. They say it is called PHONE. One kid pretends to call another kid, and they both pretend they cannot hear.','A woman sells hand-drawn maps. "The old ones show roads that are gone," she says. "Mine show roads that are here."','A mail carrier with a bag bigger than he is says he has walked letters from here to Ohio and back. "People write more now. They say more, too."'],
 plains:['A farmer leans on a fence. "Wind took my barn roof in \'71. Wind gave me a new one in \'73. Somebody else\'s. Never found out whose."','A girl selling lemonade charges one chit or one story. You tell her a story. She says it was a good one.','A trucker with a horse trailer full of radios says he is collecting them. "Someday one of them is going to say something," he says.'],
 prairie:['A woman watches the sky. "When the clouds go green, you get underground. When the Ring goes red, you stay underground."','An old couple has driven this road every year for forty years. "We started out looking for our son," she says. "Now we just like the drive."','A boy shows you a jar of fireflies. Some of them blink blue. "Those are new," he says. "Nobody knows what they are."'],
 desert:['A woman runs a gas station that has not had gas in years. She sells water, jerky and good advice. "Drink before you are thirsty," she says. "Drive before you are tired."','A rock collector shows you a stone with a perfect ring around it. "They are all like that now, out here," he says. "Every rock."'],
 mesa:['A sheep rancher tells you the coyotes started singing in harmony a few years back. "Prettiest thing you ever heard. Still steal my sheep, though."','Two sisters run a roadside stand of turquoise and spare tires. Mostly spare tires.'],
 mountains:['A ranger with a cassette player clipped to her belt says she plays the same tape to the elk every morning. "They like the second song best."','A man fixing a fence says the snow came in July last year. "And it was warm snow. Do not ask me how."'],
 forest:['A woman picking mushrooms knows every single kind. "Except that one," she says, pointing at a blue one. "That one is new. That one knows *me*."','A kid in a treehouse asks if you are a traveler. You say yes. He says he wants to be one when he grows up. You tell him to bring a spare tire.'],
 gorge:['A fisherman says the salmon came back thicker than ever after the Hush. "Ocean got quiet," he says. "Fish like quiet."','The wind here is so strong a man is flying a kite made of a bedsheet. He has been flying it for six hours.']};
const ROADSIDE=['You pass a drive-in theater playing the same movie it has played for forty years. A few cars are parked. Everyone knows the words.','A mail rider on horseback passes you going the other way, waving a bundle of letters.','Wind turbines on a ridge turn slowly backwards. Nobody has fixed them because they still make power.','A town bell rings at noon so everyone can set their clocks. You set yours too.','A field of old satellite dishes, all pointed up, all slightly rusted, all listening.','Somebody painted WELCOME HOME on a water tower. It is not clear who it is for.','A billboard is hand-painted over with a list of names and the words HAVE YOU SEEN.','You pass a payphone in the middle of nowhere. It is ringing. By the time you stop, it stops.','A kid on a bike races the van for a mile. The kid wins.','Two old men are playing chess on a card table beside the highway. One says: "Your move, since 2061."','A herd of horses runs alongside the road for a while, then peels away into the grass.','You see a house where every window has a lamp in it, all lit, in the middle of the day.','The radio picks up a station playing nothing but rain sounds. It is very nice.','You pass a long line of power poles with no wires on them, standing in a row like they are waiting for a bus.'];
const BROADCASTS=['KHUSH 105.9. This is Marigold, with the night show. A listener asks: what was the Hush, really? Well. On October 9th, 2038, at 2:14 in the morning, every satellite stopped answering at once. No explosions. No falling stars. They just... stopped. Like somebody had asked them a question.',
 'KHUSH 105.9. Marigold again. The next night, everyone saw it: a thin pale ring around the Moon. The scientists said it was dust. Then they said it was ice. Then they stopped saying. Most of them took up gardening.',
 'KHUSH 105.9. People ask me why the phones never came back. The towers work. The wires work. But every long call fills up with a hum, and the hum gets louder the longer you talk. So we stopped talking long distance. We started writing letters. Honestly? Better letters.',
 'KHUSH 105.9. The cities got quiet, and a lot of folks moved back to little towns. Roads got rough. The trucks stopped. But people kept driving, just slower. Turns out you can do almost anything slower.',
 'KHUSH 105.9. Some nights the Ring glows. My grandma said it glows when it is listening. She said the satellites did not break. She said they turned around. Away from us. Toward something else. Maybe toward the Ring.',
 'KHUSH 105.9. Last thing tonight. If you are out on the road, and you are tired, and you are thinking of turning back: do not. Somebody at the end of your road is still waiting up for you, with the porch light on. That is all I know for sure. Goodnight.'];

// ---- THE LONG ROAD · pixel screen: a 320×180 framebuffer drawn by hand ----
const PW=320,PH=180,HZ=104;// horizon line
let CTX=null,IMG=null,BUF=null;
function pixInit(cv){CTX=cv.getContext('2d');IMG=CTX.createImageData(PW,PH);BUF=new Uint32Array(IMG.data.buffer)}
const hex=h=>{h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const pk=(r,g,b)=>(255<<24)|((b&255)<<16)|((g&255)<<8)|(r&255);
const CC={};function col(h){return CC[h]||(CC[h]=pk(...hex(h)))}
const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const shade=(c,k)=>c.map(v=>Math.max(0,Math.min(255,v*k)));
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
function px(x,y,c){x|=0;y|=0;if(x<0||y<0||x>=PW||y>=PH)return;BUF[y*PW+x]=c}
function rect(x,y,w,h,c){x|=0;y|=0;w|=0;h|=0;const x0=Math.max(0,x),y0=Math.max(0,y),x1=Math.min(PW,x+w),y1=Math.min(PH,y+h);for(let j=y0;j<y1;j++){const o=j*PW;for(let i=x0;i<x1;i++)BUF[o+i]=c}}
// a dithered blend of two colors: the classic way to fake more colors than you have
function drect(x,y,w,h,a,b,t){x|=0;y|=0;const x0=Math.max(0,x),y0=Math.max(0,y),x1=Math.min(PW,x+w),y1=Math.min(PH,y+h);for(let j=y0;j<y1;j++){const o=j*PW;for(let i=x0;i<x1;i++)BUF[o+i]=BAYER[(j&3)*4+(i&3)]<t?b:a}}
function line(x0,y0,x1,y1,c){x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let n=0;n<2000;n++){px(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function circ(cx,cy,r,c){for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));rect(cx-w,cy+y,w*2+1,1,c)}}
function text(s,x,y,c,sc){sc=sc||1;s=String(s).toUpperCase();let cx=x;for(const ch of s){const g=FONT[ch]||FONT['?'];for(let i=0;i<15;i++)if(g[i]==='1')rect(cx+(i%3)*sc,y+Math.floor(i/3)*sc,sc,sc,c);cx+=4*sc}return cx}
const textW=(s,sc)=>String(s).length*4*(sc||1);
function blit(){CTX.putImageData(IMG,0,0)}
// smooth value noise for hills and mountains
function hsh(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}
function vn(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hsh(i+s*57)*(1-u)+hsh(i+1+s*57)*u}
function ridge(x,s){return vn(x,s)*.6+vn(x*2.3,s+7)*.28+vn(x*5.1,s+13)*.12}
// ---- palettes for each kind of land, by day ----

 desert:{far:'#b8a8a4',mid:'#b89a78',g1:'#d0b48a',g2:'#b89a70',road:'#706660'},mesa:{far:'#c08a70',mid:'#b0704e',g1:'#c89a6a',g2:'#a87a52',road:'#6e5e58'},mountains:{far:'#8a98b0',mid:'#5a7a68',g1:'#7a9a5a',g2:'#5a7a46',road:'#5e5e64'},
 forest:{far:'#6a8898',mid:'#2e5a44',g1:'#4a7a3e',g2:'#365e30',road:'#545458'},gorge:{far:'#7a8aa0',mid:'#4a6a58',g1:'#5a8448',g2:'#40683a',road:'#58585c'}};
// sky colors through the day: [top, horizon]
function skyAt(t,wx){// t: 0..1 through the day, 0.5 noon
  const K=[[0,'#0a0c22','#1a1c3a'],[.2,'#141a3e','#3a2a4a'],[.26,'#3a4a8a','#f0a070'],[.32,'#5a90d0','#c8dcf0'],[.5,'#4a88d8','#c0dcf4'],[.68,'#5a8ad0','#d8d0c0'],[.74,'#4a4a8a','#f08a5a'],[.8,'#1a1c46','#5a3a5a'],[1,'#0a0c22','#1a1c3a']];
  let i=0;while(i<K.length-2&&t>K[i+1][0])i++;const a=K[i],b=K[i+1],u=(t-a[0])/(b[0]-a[0]);let top=mix3(hex(a[1]),hex(b[1]),u),hor=mix3(hex(a[2]),hex(b[2]),u);
  if(wx==='storm'||wx==='rain'){top=mix3(top,[70,74,84],.6);hor=mix3(hor,[110,112,120],.6)}else if(wx==='dust'){top=mix3(top,[170,130,90],.55);hor=mix3(hor,[210,170,120],.7)}else if(wx==='snow'||wx==='fog'){top=mix3(top,[180,188,200],.6);hor=mix3(hor,[220,224,230],.7)}else if(wx==='signal'){top=mix3(top,[40,20,70],.5);hor=mix3(hor,[90,40,110],.4)}
  return [top,hor]}
function daylight(t){return Math.max(.28,Math.min(1,Math.sin((t-.22)/.56*Math.PI)*1.25))}
// ---- the scene ----

const STARS=[];for(let i=0;i<90;i++)STARS.push([hsh(i*3.1)*PW,hsh(i*7.7)*HZ*.9,hsh(i*1.3)]);
const PARTS=[];
function drawScene(V,T){const L=LAND[V.land]||LAND.plains;const dl=daylight(V.t);const night=1-dl;const dim=c=>pk(...shade(hex(c),.35+dl*.65));
  // sky with dithered bands
  const [top,hor]=skyAt(V.t,V.wx);const bands=14;for(let i=0;i<bands;i++){const u=i/bands;const c1=mix3(top,hor,u),c2=mix3(top,hor,(i+1)/bands);const y0=Math.floor(u*HZ),y1=Math.floor((i+1)/bands*HZ);drect(0,y0,PW,y1-y0,pk(...c1),pk(...c2),.5)}
  if(night>.35){for(const [x,y,b] of STARS){if(b<night-.2)px(x,y,b>.8?col('#ffffff'):col('#a8b0d0'))}}

  circ(mx,my,6,col(night>.4?'#f4f0e0':'#e8ecf4'));circ(mx+2,my-1,1,col('#c8c8c0'));
  for(let a=0;a<6.283;a+=.012){const x=mx+Math.cos(a)*58,y=my+Math.sin(a)*7-Math.cos(a)*9;if(Math.sin(a)<-.15&&Math.hypot(x-mx,y-my)<8)continue;if(hsh(Math.floor(a*80))<.18)continue;px(x,y,ringC);if(night>.5&&hsh(a*999)<.3)px(x,y+1,ringC)}
  if(V.wx==='signal'||(night>.6&&V.aurora)){for(let x=0;x<PW;x+=1){const h=18+Math.sin(x*.05+T*1.3)*8+Math.sin(x*.13-T)*5;for(let y=10;y<10+h;y+=2)if(BAYER[(y&3)*4+(x&3)]<.35)px(x,y+Math.sin(x*.03+T)*6,col(x%40<20?'#7affc8':'#c87aff'))}}
  // sun
  if(dl>.3){const sx=PW*(V.t-.2)/.6,sy=HZ-Math.sin((V.t-.2)/.6*Math.PI)*80;if(V.wx==='clear'||V.wx==='hot')circ(sx,sy,8,col(V.t<.3||V.t>.7?'#ffb070':'#fff4c8'))}
  // far range
  const far=dim(L.far),mid=dim(L.mid);const s=V.scroll;const seed=V.seed||1;
  const famp={mountains:46,mesa:24,gorge:40,forest:20,desert:22,city:8,plains:6,prairie:4}[V.land]||10;
  for(let x=0;x<PW;x++){const w=(x+s*1.5)/70;let h=ridge(w,seed)*famp+4;if(V.land==='mesa')h=Math.round(ridge(w,seed)*3)*famp/3+2;const y=HZ-h;rect(x,y,1,h,far);
    if(V.land==='mountains'&&h>famp*.62)rect(x,y,1,Math.min(5,h-famp*.62),col(night>.5?'#a8b0c0':'#f4f8ff'))}
  if(V.land==='city'){for(let i=0;i<26;i++){const bx=((i*29+hsh(i)*13-s*3)%380+380)%380-30;const bh=10+hsh(i*5)*40;const c=dim(i%2?'#7a8696':'#8a96a6');rect(bx,HZ-bh,14+hsh(i)*10,bh,c);
      for(let wy=HZ-bh+3;wy<HZ-3;wy+=4)for(let wx=bx+2;wx<bx+12;wx+=4)if(hsh(wx*7+wy)<(night>.5?.4:.15))rect(wx,wy,2,2,night>.5?col('#ffd890'):col('#a8c0d8'));
      if(hsh(i*9)<.5)rect(bx,HZ-bh-2,10,2,dim('#4a8a4a'))}}

  // trees by land

  for(let i=-2;i<24;i++){const wx=Math.floor(s*14/16)+i;const seedT=hsh(wx*1.7+seed);if(seedT>treeK)continue;const x=(wx*16-s*14)+hsh(wx)*10;const y=HZ+6+hsh(wx*3)*10;
    if(V.land==='desert'||V.land==='mesa'){rect(x,y-6,2,6,dim('#5a7a4a'));rect(x-2,y-4,2,2,dim('#5a7a4a'));rect(x+2,y-5,2,2,dim('#5a7a4a'))}
    else if(V.land==='forest'||V.land==='mountains'||V.land==='gorge'){const h=10+hsh(wx*5)*14;for(let k=0;k<h;k++){const w=Math.floor((h-k)/3);rect(x-w,y-k,w*2+1,1,dim(k%3?'#2a5a3a':'#356a44'))}rect(x,y,1,2,dim('#5a3a2a'))}

    const words=V.bill.split(' ');let ln='',ly=HZ-21;const lines=[];for(const w of words){if(textW(ln+' '+w)>72){lines.push(ln);ln=w}else ln=ln?ln+' '+w:w}lines.push(ln);for(const l of lines.slice(0,3)){text(l,bx+38-textW(l)/2,ly,dim('#3a2a2a'));ly+=6}}

function drawVan(x,y,V,dim,night,T){const body=dim(V.vanCol||'#d8c070'),dark=dim('#3a3a44'),glass=dim(night>.5?'#ffe0a0':'#a8d0e8');

function drawStop(k,x,dim,night,T){const g=HZ+2;

function die(p,why){p.hp=0;TRAVEL=null;S.deaths.push({n:p.n,why,mi:S.mi,day:S.day});say(`${p.n} has died of ${why}.`,'bad');thump();S.morale=clamp(S.morale-25,0,100);addLog(`${p.n} died of ${why}.`);

// one marker prompt at a time, even if two people are lost on the same day

// ---- traveling ----
function go(){if(S.phase!=='road')return;if(alive().length===0)return;if(TRAVEL)return say('You are already driving. Type STOP to pull over.','dim');
  const st=stopHere();if(st&&st.k==='river'&&!S.crossed)return river();if(st&&st.k==='end')return finish();
  if(S.day===0&&S.inv.food<50)say('You are leaving with very little food. Type STORE first, unless you like adventure.','dim');
  S.at=null;S.crossed=false;TRAVEL={t:0};say(`You pull onto the road. ${nextStop().n} is ${Math.ceil(nextStop().mi-S.mi)} miles ahead.`,'dim');setChips(['STOP','STATUS','PACE SLOW','PACE FAST']);beep(110,.3,'sawtooth',.03)}
function stopTravel(why){if(!TRAVEL)return;TRAVEL=null;S.t=.66;if(why)say(why,'dim');setChips();save()}
function travelDay(){// called once per animated day
  const pwx=S.wx;S.wx=rnd()<.6?S.wx:wxFor();if(S.wx!==pwx)S.aurora=false;if(S.wx==='hot'&&!['desert','mesa','plains','prairie'].includes(regionNow()))S.wx='clear';
  let mpd={slow:42,steady:62,fast:88}[S.pace];const ns=nextStop();const r=ns.r;
  if(ns.k==='pass'&&ns.mi-S.mi<160)mpd*=.6;if(S.wx==='snow')mpd*=.5;if(S.wx==='dust'||S.wx==='fog')mpd*=.7;if(S.wx==='storm')mpd*=.8;mpd*=.55+S.van/220;mpd*=.85+partyHealth()/700;
  let walking=false;const mpg={slow:15,steady:13,fast:10}[S.pace];let fuelNeed=mpd/mpg;if(S.inv.fuel<fuelNeed){mpd=S.inv.fuel*mpg+(S.inv.fuel*mpg<10?8:0);walking=S.inv.fuel*mpg<10;S.inv.fuel=0}else S.inv.fuel-=fuelNeed;
  if(S.wx==='clear'||S.wx==='hot')S.inv.fuel=Math.min(40,S.inv.fuel+.6);// the solar roof trickles in

  if(rnd()<.06)say(pick(ROADSIDE),'');

function arrive(){TRAVEL=null;S.t=.7;S.at=S.next;S.next++;const st=stopHere();S.inv.water=Math.min(80,S.inv.water+(st.k==='town'||st.k==='river'?80:0));
  say(' ');say(`${st.k==='end'?'You made it. ':'You have reached '}${st.n}${st.st?', '+st.st:''}.`,'big');beep(523,.12);setTimeout(()=>beep(659,.12),130);setTimeout(()=>beep(784,.2),260);say(st.f);addLog(`Reached ${st.n}${st.st?', '+st.st:''}.`);
  if(st.k==='town'){say('You refill your water at the town pump. STORE, TALK, WORK, REST or GO.','dim');S.worked=0;if(S.job==='courier'){const pay=ri(30,70);S.chits+=pay;say(`You deliver a bundle of letters to the post office. ${pay} chits.`,'good')}}if(st.k==='river')say('Type GO to look at the crossing.','dim');if(st.k==='pass')say('The road climbs. Watch your brakes and your blankets.','dim');

function finish(){S.phase='done';const a=alive();const j=JOBS.find(j=>j.id===S.job);let sc=a.length*600+Math.floor(S.chits/5)+Math.floor(S.inv.food/10)+S.inv.parts*20+S.inv.tires*20+Math.round(S.van*2)+(S.morale>60?200:0)+(S.dog?150:0);sc*=j.mult;
  say(' ');const R=ROUTES[S.route];const ends={txor:`Juniper's lamp shop is on a corner on the east side, every window lit. She is waiting on the step with an umbrella that is not big enough for everyone. It does not matter. You all stand in the rain anyway.`,nypo:`The little star on your grandfather's map is a house on Hawthorne with a porch light on. There is a note on the door in handwriting you know from the map: "Knew you would finish it." The key is under the mat. The tea is still warm.`,txks:`Moss is waiting at the gate of the zoo, holding a towel for each of you. The Big Pool is lit up under the biggest sky you have ever seen. Somewhere in the zoo, an animal nobody has named yet calls out, like it is saying hello.`,r66:`At the very end of the pier, the radio shack door is open. Marigold is smaller than her voice, with silver hair and headphones around her neck. "There you are," she says, like you are only a little late. That night she puts all of you on the air, and you say hello to everyone still out on the road.`};
  say(ends[S.route],'big');if(S.dog)say(`${S.dog} runs ahead of everyone, tail going like a windshield wiper, like this was the plan all along.`,'good');addLog(`Made it to ${R.to}.`);say(' ');say(`${a.length} of ${S.party.length} made it, in ${S.day} days. ${S.deaths.length?'You remember '+S.deaths.map(d=>d.n).join(' and ')+'.':''}`);say(`Score: ${sc} (${j.n} bonus ×${j.mult}). Secrets found: ${Object.keys(sec()).length}/${Object.keys(SECRETS).length}.`,'q');
  if(OPT.onFinish)OPT.onFinish(sc);const hs=ls.get('longroad-best',{});if(!hs[S.route]||sc>hs[S.route]){hs[S.route]=sc;ls.set('longroad-best',hs);say('A new best for this road!','sec')}ls.set(SAVEK,null);say('Type START to take another road, or JOURNAL to read back over this one.','dim');setChips(['START','JOURNAL','SECRETS'])}
// ---- rivers and passes ----
function river(){const st=stopHere();const m=S.m;const depth=+(1.5+rnd()*4+(m>=3&&m<=5?2:0)).toFixed(1),width=ri(200,900);S.rv={depth,width};
  say(`${st.n}: the water is about ${width} feet across and ${depth} feet deep. The current is ${depth>5?'strong':depth>3?'steady':'slow'}.`,'q');say('FORD it (drive through), FLOAT it (seal the van and float), take the FERRY ('+Math.round(20+S.next*3)+' chits), or WAIT a day for the water to change.','');
  ask(null,c=>{const a=c[0];if(a==='FORD')cross('ford');else if(a==='FLOAT'||a==='CAULK')cross('float');else if(a==='FERRY')cross('ferry');else if(a==='WAIT'){advanceDate(1);dailyNeeds(true);say('You wait a day by the water.','dim');Q=null;river()}else if(a==='LOOK'){say(st.f);return false}else{say('FORD, FLOAT, FERRY or WAIT?','dim');return false}return true},['FORD','FLOAT','FERRY','WAIT'])}
function cross(how){Q=null;const {depth}=S.rv;let bad=0;if(how==='ford')bad=depth<2.5?.03:depth<3.5?.3:.65;if(how==='float')bad=depth<2.5?.25:depth>5?.3:.12;if(how==='ferry'){const fee=Math.round(20+S.next*3);if(S.chits<fee){say('You cannot afford the ferry.','dim');return river()}S.chits-=fee;bad=.03;const w=ri(0,2);if(w){advanceDate(w);say(`You wait ${w} day${w>1?'s':''} for your turn on the ferry.`,'dim')}}
  beep(200,.3,'sine',.1);if(rnd()<bad){const lose=pick(['food','fuel','parts','tapes','meds']);const n=Math.ceil(S.inv[lose]*(.2+rnd()*.4));S.inv[lose]-=n;S.van=clamp(S.van-ri(5,20),0,100);say(`The current tips the van sideways! You lose ${n} ${ITEMS[lose].n}${n===1?'':''}, and the engine takes on water.`,'bad');
    if(rnd()<.15){const p=pick(alive());if(rnd()<.35&&p.hp<50)die(p,'the river');else{p.hp-=25;say(`${p.n} was swept off their feet and nearly lost. They are cold and bruised.`,'warn')}}}
  else say(how==='ferry'?'The ferry brothers argue the whole way across, but you make it safely.':how==='float'?'You seal the doors with tarps and float across. Slowly, wetly, safely.':'You ease the Wagon into the water. It churns, coughs, and climbs out the other side.','');
  S.crossed=true;addLog(`Crossed the ${stopHere().n} (${how}).`);if(!(Q&&Q.marker))setChips(['GO','STATUS']);save()}
// ---- trouble on the road ----
function rollEvent(){const r=regionNow(),m=S.m;const E=[];

  add(.02,()=>{say('A road crew of volunteers waves you around a collapsed bridge. The detour adds miles.','warn');S.mi=Math.max(0,S.mi-ri(15,40))});

  add(.018,()=>{S.wx='signal';say('Signal weather. The Ring hums, the radio sings by itself, and the compass spins. You drive in circles half the day.','warn');S.mi=Math.max(0,S.mi-ri(10,30));if(isNight()||rnd()<.3)S.aurora=true});

function flat(){if(S.inv.tires>0){S.inv.tires--;say('A tire blows out on the cracked road. You put on a spare. Half a day lost.','warn');return}

// ---- resting, foraging, healing ----
function rest(n){n=clamp(parseInt(n)||1,1,9);if(TRAVEL)stopTravel();for(let i=0;i<n;i++){advanceDate(1);S.wx=wxFor();S.aurora=false;if(S.wx==='clear'||S.wx==='hot')S.inv.fuel=Math.min(40,S.inv.fuel+1.6);const m=dailyNeeds(true);for(const x of m)say(x,'warn');if(checkEnd())return}
  S.morale=clamp(S.morale+4*n,0,100);S.t=.88;say(`You rest for ${n} day${n>1?'s':''}. Everyone feels better. The solar roof trickles some fuel back into the tank (${S.inv.fuel.toFixed(0)} gal).`,'');if(isNight()||n>1)say('At night, around the fire, someone suggests you SING.','dim');save()}

function mazeOf(n,seed){let s=seed;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};const W=[];for(let i=0;i<n*n;i++)W.push(15);const seen=new Set([0]);const st=[0];const D=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]];

  ROOT.addEventListener('click',e=>{if(e.target===OUT||e.target.closest('.lr-out'))INP.focus()});

  if(MODE!=='trail'){MODE='trail'}title();pumpPrint();RAF=requestAnimationFrame(frame);setTimeout(()=>INP.focus(),50);
