const SKY=new PX.Sky(W,H,HZ+20);const LIGHT=new PX.Light(W,H);const FX=new PX.Particles(900);const FX2=new PX.Particles(300);

function drawBackdrop(c,V,yoff){yoff=yoff||0;const seg=V.seg;const camX=V.u*V.dir;const bkA=biomeAt(seg,V.u-V.dir*300),bkB=biomeAt(seg,V.u+V.dir*600);
  const glow=V.ringGlow||0;SKY.draw(c,V.t,V.wx,{time:V.time,dt:V.dt,ringGlow:glow});

  for(const id of [seg.a,seg.b]){if(id!=='clover')continue;const su=id===seg.a?0:seg.len;const x=HEADX+(su-V.u)*V.dir*.12-V.cam*.1-120;if(x<-300||x>W+300)continue;for(let i=0;i<5;i++){const iv=islandSprite(i);c.drawImage(iv,Math.round(x+i*58-(i%2)*20),Math.round(40+(i%3)*24+Math.sin(V.time*.6+i)*3+yoff))}}

// ---------------------------------------------------------------- side view
function renderSide(c,V){V.lights=[];const seg=V.seg;const feats=segFeatures(seg);const camX=V.u*V.dir;
  drawBackdrop(c,V);if(V.extraBack)V.extraBack(c);

  c.fillStyle=PX.css(gc[0]);c.fillRect(0,HZ+60,W,H-HZ-60);
  const tex=(cv,f,y)=>{const ox=-((camX*f+V.cam*(f-1)*0)%STRIPW+STRIPW)%STRIPW;for(let x=Math.round(ox);x<W;x+=STRIPW)c.drawImage(cv,x,y)};

function inTunnel(V){for(const F of segFeatures(V.seg))if(F.k==='tunnel'){const a=sx(V,V.dir>0?F.u0:F.u1),b=sx(V,V.dir>0?F.u1:F.u0);const head=HEADX-V.cam;if(head>a+20&&head-100<b)return {a,b}}return null}
function drawItem(c,V,it){const x=sx(V,it.x);if(x<-120||x>W+120)return;let cv;
  if(it.k==='tree'){const season=V.season==='fall'?'fall':V.season==='winter'?'winter':'';cv=treeSprite(it.t,it.v,['fir','spruce','cedar','pine','juniper','cactus','sage','fern'].includes(it.t)?(season==='winter'?'winter':''):season)}

function newState(name){return {v:1,name:name||'Conductor',coins:600,day:0,t:.34,loco:0,livery:'#2e7a4a',cars:['coach','cargo','caboose'],pets:[],food:40,fuel:160,cargo:[],pas:[],at:'clover',seg:null,dir:1,u:0,plan:[],target:null,speed:0,state:'station',visited:{clover:1},secrets:{},seen:{},stats:{},claimed:{},ts:1,pov:'side',dress:0,wx:'clear',wxT:0,autoGo:false,dwell:0,heard:0,lastListen:-1,lookups:0,intro:0,uid:Math.random().toString(36).slice(2,10)}}
function save(){if(S){S.t=CLOCK.t;S.day=CLOCK.day;PX.store.set(SAVE,S)}}
function load(){const s=PX.store.get(SAVE,null);if(!s||s.v!==1)return null;const n=Object.assign(newState(),s);return n}
// ---- dates ----
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MDAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
function dateOf(day){let d=day+90,y=YEAR0;while(d>=365){d-=365;y++}let m=0;while(d>=MDAYS[m]){d-=MDAYS[m];m++}return {y,m,d:d+1}}
function dateLabel(){const D=dateOf(CLOCK.day);const sfx=n=>n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th';return `${MON[D.m]} ${D.d}${sfx(D.d)}, ${D.y}`}
function seasonNow(){return SEASONS[dateOf(CLOCK.day).m]}
// ---- train capacity ----
const locoDef=()=>LOCOS[S.loco];
function seats(){return S.cars.reduce((n,c)=>n+(CARS[c].seats||0),0)}
function crates(){return S.cars.reduce((n,c)=>n+(CARS[c].crates||0),0)}
function hasCar(k){return S.cars.includes(k)}
function carOfPassenger(i){let k=0;for(let ci=0;ci<S.cars.length;ci++){const n=CARS[S.cars[ci]].seats||0;if(i<k+n)return [ci,i-k];k+=n}return [-1,-1]}
// passengers arranged by car and window for drawing
function passengersByCar(){const out=S.cars.map(()=>[]);S.pas.forEach((p,i)=>{const [ci,k]=carOfPassenger(i);if(ci>=0)out[ci][k]=p.look});return out}
// ---- the line ahead ----
function stationNow(){return S.state==='station'?S.at:null}
function nextId(){return S.seg?(S.dir>0?S.seg.b:S.seg.a):null}
function prevId(){return S.seg?(S.dir>0?S.seg.a:S.seg.b):S.at}
function remainingKm(){if(!S.seg)return 0;const end=S.dir>0?S.seg.len:0;return Math.abs(end-S.u)/PXKM}
function setTarget(id){if(id===S.at&&S.state==='station')return false;const from=S.state==='station'?S.at:nextId();const r=route(from,id);if(!r)return false;S.target=id;S.plan=r.path.slice(1);if(S.state!=='station'&&from!==S.at)S.plan=r.path.slice(1);return true}
function depart(){if(S.state!=='station')return;if(!S.plan.length){if(!S.target||S.target===S.at){toast('Pick a destination on the map first.');openPanel('map');return}setTarget(S.target)}
  const nx=S.plan[0];if(!nx)return;if(S.fuel<=0)toast('Out of clover coal! The solar roof will crawl you along slowly.','warn');
  const seg=getSeg(S.at,nx);S.seg={a:seg.a,b:seg.b,len:seg.len};S.dir=seg.a===S.at?1:-1;S.u=S.dir>0?0:seg.len;S.state='moving';S.at=null;S.dwell=0;PLATFORM=[];PX.Sound.whistle();daisyMaybe('depart');save()}
function arrive(id){S.state='station';S.at=id;S.speed=0;S.plan.shift();const first=!S.visited[id];S.visited[id]=1;S.dwell=0;
  if(S.target===id){S.target=null;S.plan=[]}
  PX.Sound.chime();showArrival(id,first);
  // passengers getting off
  let paid=0,count=0;S.pas=S.pas.filter(p=>{if(p.to!==id)return true;const fare=Math.round(p.fare*(.8+p.mood/250));paid+=fare;count++;if(p.vip)S.stats.vips=(S.stats.vips||0)+1;return false});
  if(count){S.coins+=paid;S.stats.delivered=(S.stats.delivered||0)+count;floatText(`+${paid} fares from ${count} passenger${count>1?'s':''}`,'#ffe070');PX.Sound.coin()}
  PLATFORM=waitingAt(id);checkNotebook();save()}
// ---- people waiting on the platform ----
let PLATFORM=[];
function waitingAt(id){const St=ST[id];const r=PX.rng(PX.hash(CLOCK.day*31+id.length*7+(St.lon*100|0))*1e9);const n=[1,3,6][St.z]+Math.floor(r()*(St.z+2));const ids=Object.keys(ST).filter(k=>k!==id);const out=[];
  for(let i=0;i<n;i++){let to=pick2(ids,r());const near=route(id,to);if(!near||near.km>1600&&r()<.6){const nb=(ADJ[id]||[]).map(e=>e.to);to=pick2(nb,r())}const rt=route(id,to);const look=personLook(Math.floor(r()*1e9));
   out.push({id:id+CLOCK.day+'-'+i,look,name:pick2(FIRST,r())+' '+pick2(LAST,r()),job:pick2(JOBS,r()),from:id,to,fare:Math.round(30+rt.km*.32),mood:60,km:rt.km})}
  // sometimes somebody famous is waiting
  const vr=PX.hash(CLOCK.day*7+id.length);if(vr<.18){const V=VIPS[Math.floor(PX.hash(CLOCK.day+id.length*3)*VIPS.length)];if(!S.pas.some(p=>p.vip===V.id)){let to=pick2(ids,r());const rt=route(id,to);out.unshift({id:id+'vip'+CLOCK.day,vip:V.id,look:{seed:V.id,animal:V.sp||null,skin:'#f4d0b0',hair:V.hum?'#5a3020':'#ffffff',hs:1,shirt:V.col,pants:'#3a3a4a'},name:V.n,job:V.job,from:id,to,fare:Math.round(80+rt.km*.5),mood:80,km:rt.km})}}
  return out}
function board(p){if(S.pas.length>=seats()){toast('No free seats. Buy another coach or sleeper car.');return false}S.pas.push(Object.assign({},p));PLATFORM=PLATFORM.filter(q=>q!==p);PX.Sound.click();
  if(p.vip){const V=VIPS.find(v=>v.id===p.vip);say({...V,id:V.id,n:V.n,col:V.col,sp:V.sp,skin:'#f4d0b0',hair:V.hum?'#5a3020':'#c8c8c8',shirt:V.col,headphones:V.id==='marigold',wings:V.fairy,long:V.fairy||V.id==='juniper'},[pick(V.lines)])}
  return true}
// ---- money, supplies and trade ----
function priceOf(g,id){const base=GOODS[g][2];const St=ST[id];let k=1;if(St.make===g)k=.6;else if(St.want===g)k=1.7;return Math.round(base*k*(.92+PX.hash(CLOCK.day+g.length+id.length)*.16))}
function buyGood(g){const id=S.at;if(S.cargo.length>=crates())return toast(crates()?'The cargo car is full.':'You need a cargo car.');const p=priceOf(g,id);if(S.coins<p)return toast('Not enough coins.');S.coins-=p;S.cargo.push({g,paid:p,from:id});PX.Sound.coin()}
function sellGood(i){const c=S.cargo[i];const p=priceOf(c.g,S.at);S.coins+=p;S.cargo.splice(i,1);if(p>c.paid){S.stats.trades=(S.stats.trades||0)+1;floatText(`+${p-c.paid} profit!`,'#7aff9a')}PX.Sound.coin();checkNotebook()}
// ---- weather follows the land and the season ----
function rollWeather(){const bk=S.seg?biomeAt(getSeg(S.seg.a,S.seg.b),S.u):ST[S.at].b;const m=dateOf(CLOCK.day).m;const r=Math.random();const cold=m<=1||m===11,warm=m>=4&&m<=7;
  if(r<.03&&CLOCK.daylight<.3)return 'signal';
  if(['prairie','plains','texas'].includes(bk)){if(warm&&r<.22)return 'storm';if(r<.3)return 'rain';if(m<=4&&r<.36)return 'dust';if(cold&&r<.5)return 'snow';return 'clear'}
  if(['rain','gorge','coast'].includes(bk)){if(r<.12)return 'storm';if(r<.45)return 'rain';if(r<.6)return 'fog';if(cold&&r<.75)return 'snow';return 'clear'}
  if(['mountain','alpine'].includes(bk)){if((cold||m<=3||m>=9)&&r<.5)return 'snow';if(r<.25)return 'rain';if(r<.35)return 'fog';return 'clear'}
  if(['basin','salt','mesa'].includes(bk)){if(r<.12)return 'dust';if(r<.18)return 'storm';return 'clear'}
  if(r<.15)return 'rain';if(r<.22)return 'fog';if(cold&&r<.35)return 'snow';if(warm&&r<.3)return 'storm';return 'clear'}
// ---- tornado on the plains (seen far off) ----
let TORN=null;
function maybeTornado(){if(TORN||S.wx!=='storm'||!S.seg)return;const bk=biomeAt(getSeg(S.seg.a,S.seg.b),S.u);if(!['prairie','plains','texas'].includes(bk))return;if(Math.random()<.004){TORN={x:W+80,life:40,t:0};toast('🌪️ A tornado on the horizon! Daisy grabs your arm.','warn');PX.Sound.thunder();const ks=['prairie','plains'].includes(bk);if(ST[nextId()].s==='KS'||ST[prevId()].s==='KS'){S.seen.tornadoKS=1;checkNotebook()}setTimeout(()=>say(DAISY,['A tornado! In Kansas they see these from miles away. Compare that to Portland, where they almost never happen.']),1500)}}
// ---- the main update ----
let TIPS=[],LIGHTNING=0,NEXTTHUNDER=0,DAISYT=60,RADIOT=0;
function simUpdate(dt){if(!S)return;const ts=S.ts;const d=dt*ts;CLOCK.tick(d);S.t=CLOCK.t;S.day=CLOCK.day;
  // weather changes every few game hours
  S.wxT-=d;if(S.wxT<=0){S.wxT=40+Math.random()*80;const old=S.wx;S.wx=rollWeather();if(S.wx!==old&&S.wx==='storm'){const bk=S.seg?biomeAt(getSeg(S.seg.a,S.seg.b),S.u):'';if(['rain','gorge','coast'].includes(bk)&&(ST[prevId()]||{}).s==='OR'){S.seen.stormOR=1;checkNotebook()}}}
  if(S.wx==='storm'){NEXTTHUNDER-=dt;if(NEXTTHUNDER<=0){NEXTTHUNDER=4+Math.random()*10;LIGHTNING=.7;setTimeout(()=>PX.Sound.thunder(),300+Math.random()*900)}}LIGHTNING=Math.max(0,LIGHTNING-dt*3);
  maybeTornado();if(TORN){TORN.t+=dt;TORN.x-=dt*14;if(TORN.t>TORN.life)TORN=null}
  if(S.state==='moving'){const L=locoDef();let want=L.spd;if(S.fuel<=0)want=18;if(S.wx==='snow')want*=.75;if(BISON>0){want=0;BISON-=d}
    const endU=S.dir>0?S.seg.len:0;const left=Math.abs(endU-S.u);const stopDist=(S.speed*S.speed)/(2*30)*PXKM*.05+40;if(left<stopDist+20)want=Math.min(want,Math.max(6,left/PXKM*120));
    S.speed+=PX.clamp(want-S.speed,-30*d,12*d);const kmh=S.speed;const kmMoved=kmh*(CLOCK.speed*24)*d;let du=kmMoved*PXKM;if(du>left)du=left;S.u+=du*S.dir;
    S.fuel=Math.max(0,S.fuel-kmMoved*.45*(1+S.cars.length*.08));S.stats.km=(S.stats.km||0)+kmMoved;WHEELA+=du/9;
    if(left-du<.5&&S.speed<10)arrive(nextId());
    // smoke from the stack
    if(Math.random()<dt*(8+kmh/10))FX.add({x:HEADX-V0cam()-120+94,y:RAIL-55+2,vx:-kmh*.6-10,vy:-18-Math.random()*10,ax:0,ay:-2,life:2.4,size:3,grow:5,color:'rgba(230,230,236,.8)',alpha:.7});
    if(Math.random()<dt*kmh/40)PX.Sound.chug(kmh);
    // bison on the line out on the plains
    if(BISON<=0&&Math.random()<dt*.0025*ts){const bk=biomeAt(getSeg(S.seg.a,S.seg.b),S.u);if(['plains','prairie'].includes(bk)&&left>3000){BISON=12;toast('A herd of bison is crossing the tracks. The train waits.','warn')}}
    // passengers: tips and moods
    for(const p of S.pas){let m=55;if(hasCar('dining')&&S.food>0)m+=15;if(hasCar('arcade'))m+=8;if(S.pets.length&&hasCar('pets'))m+=8+S.pets.length*2;if(hasCar('sleeper')&&CLOCK.daylight<.3)m+=8;if(hasCar('dome')&&CLOCK.daylight>.5)m+=6;if(S.wx==='storm')m-=5;p.mood+=(m-p.mood)*d*.02}
    if(hasCar('dining')&&S.pas.length)S.food=Math.max(0,S.food-d*.02*S.pas.length);if(hasCar('garden'))S.food=Math.min(200,S.food+d*.03);
    if(S.pas.length&&Math.random()<dt*.05*S.pas.length*ts*.5){const i=Math.floor(Math.random()*S.pas.length);const p=S.pas[i];if(p.mood>45){const [ci]=carOfPassenger(i);TIPS.push({ci,amt:Math.round(2+p.mood/12*(p.vip?3:1)),t:0,y:0,heart:Math.random()<.4})}}
    if(S.pets.length&&hasCar('pets')&&Math.random()<dt*.02*S.pets.length)TIPS.push({ci:S.cars.indexOf('pets'),amt:4+S.pets.length,t:0,y:0,pet:1});
    // the radio car picks up KHUSH at night
    if(hasCar('radio')&&CLOCK.daylight<.2){RADIOT-=dt;if(RADIOT<=0){RADIOT=50;if(S.lastListen!==CLOCK.day&&S.heard<BROADCASTS.length){S.lastListen=CLOCK.day;tele(BROADCASTS[S.heard],'radio');toast('📻 KHUSH 105.9 is on the radio car. Open the telegraph to read it.');S.heard++;if(S.heard>=BROADCASTS.length)found('khush')}}}
    DAISYT-=dt;if(DAISYT<=0){DAISYT=120+Math.random()*120;daisyMaybe('ride')}}
  else if(S.state==='station'){S.speed=0;S.dwell+=dt;if(S.autoGo&&S.dwell>18&&S.plan.length&&!PANEL&&!DLG)depart()}
  for(let i=TIPS.length-1;i>=0;i--){const tp=TIPS[i];tp.t+=dt;if(tp.t>9)TIPS.splice(i,1)}}
let BISON=0,WHEELA=0;
function V0cam(){return VIEW.cam||0}
// ---- Daisy rides with you ----
const DAISYSAYS={depart:['All aboard! I love this part.','Next stop! Did you remember the snacks?','Choo choo! Sorry. I had to.'],
 ride:['It is fun that this game is both of our ideas.','Look at the light on the hills right now. I want to remember this.','Do you think the Ring can see the train from up there?','If we pass another train, wave! Maybe they will share their view with us.','I want a unicorn in the pet car. And a dragon. And a whale. Is a whale too big?','Somebody should write a paragraph on the telegraph. It is good luck.','Portland has rain and Kansas has tornadoes. I love that we get both.'],
 arrive:['We made it!','I could live here.','Let us see who wants a ride.']};
function daisyMaybe(k){if(DLG||PANEL||Math.random()<.35)return;say(DAISY,[pick(DAISYSAYS[k])])}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
// ---- notebook ----
function checkNotebook(){for(const N of NOTEBOOK){if(S.claimed[N.id]||S.ready&&S.ready[N.id])continue;try{if(N.test(S)){S.ready=S.ready||{};S.ready[N.id]=1;toast('📓 Daisy\'s notebook: "'+N.t+'" done! Claim it in the notebook.','good')}}catch(e){}}}
function found(id){if(S.secrets[id])return false;S.secrets[id]=Date.now();toast(`★ Secret found: ${SECRETS[id]} (${Object.keys(S.secrets).length}/${Object.keys(SECRETS).length})`,'sec');PX.Sound.chime();checkNotebook();save();return true}

// ---- CLOVER LINE · interface: HUD, dialogs, panels, all drawn in pixels ----
const UI={toasts:[],floats:[],arrival:null};let PANEL=null,PANELP={},DLG=null,VIEW={cam:0};
const COL={ink:'#3a2414',paper:'#fbecd8',wood:'#5a3a24',gold:'#ffd860',green:'#4cbf6a',dim:'#8a7060'};
function toast(msg,kind){UI.toasts.push({msg,kind:kind||'',t:0});if(UI.toasts.length>3)UI.toasts.shift()}
function floatText(msg,col){UI.floats.push({msg,col:col||'#ffffff',t:0})}
function showArrival(id,first){UI.arrival={id,t:0,first};if(first)setTimeout(()=>{if(!DLG)say(DAISY,[pick(DAISYSAYS.arrive)+' '+ST[id].f])},2600)}
// ---------------- dialog boxes ----------------
// say(who, ["line", "line"], [["Choice", fn], ...])
function say(who,lines,choices){DLG={who,lines:lines.slice(),i:0,shown:0,choices:choices||null,t:0}}
function dlgNext(){if(!DLG)return;const L=DLG.lines[DLG.i];if(DLG.shown<L.length){DLG.shown=L.length;return}if(DLG.i<DLG.lines.length-1){DLG.i++;DLG.shown=0;return}if(!DLG.choices)DLG=null}
function drawDialog(c,inp){const D=DLG;if(!D)return;D.t+=1/60;const L=D.lines[D.i];D.shown=Math.min(L.length,D.shown+1.4);if(Math.floor(D.shown)%5===1)PX.Sound.click&&0;
  const x=90,y=28,w=460,h=104;PX.panel(c,x,y,w,h,{fill:'#fbecd8',border:'#6a3e22',inner:'#b98a5e'});c.drawImage(portrait(D.who),x+10,y+(h-56)/2-2,64,64);c.fillStyle='#6a3e22';c.fillRect(x+9,y+(h-56)/2-3,66,1);
  PX.text(c,D.who.n||'',x+w/2+34,y+10,{scale:2,align:'center',color:'#5a2e14'});const lines=PX.wrap(L.slice(0,Math.floor(D.shown)),350,'small');lines.slice(0,6).forEach((ln,i)=>PX.text(c,ln,x+86,y+30+i*10,{color:'#3a2414'}));
  if(D.shown>=L.length&&!(D.i===D.lines.length-1&&D.choices)){if(Math.floor(D.t*2)%2)PX.text(c,'▼'.replace('▼','v'),x+w-14,y+h-14,{color:'#8a5a3a'})}
  inp.zone(0,0,W,H,()=>dlgNext());
  if(D.i===D.lines.length-1&&D.shown>=L.length&&D.choices){let bx=x+86;D.choices.forEach(([lab,fn])=>{const bw=PX.textWidth(lab)+16;PX.button(c,bx,y+h-24,bw,16,lab,{color:'#6ac46a',dark:'#2e6a34'});inp.zone(bx,y+h-24,bw,16,()=>{DLG=null;PX.Sound.click();fn&&fn()});bx+=bw+6})}}
// ---------------- the heads-up display ----------------
const ICON={};function icon(k){return ICON[k]||(ICON[k]=PX.sprite('ic'+k,16,16,s=>{const g=(x,y,w,h,c)=>s.rect(x,y,w,h,c);
  switch(k){case 'map':g(2,3,12,10,'#f4e8c8');g(2,3,12,1,'#a88a5a');s.line(3,10,7,6,'#c84a3a');s.line(7,6,10,9,'#c84a3a');s.line(10,9,13,4,'#c84a3a');break;
   case 'train':g(2,6,9,6,'#2e7a4a');g(10,4,4,8,'#2e7a4a');g(11,1,2,3,'#3a3a40');s.circle(5,13,2,'#3a3a40');s.circle(11,13,2,'#3a3a40');g(4,7,3,2,'#bfe0f0');break;
   case 'book':g(3,2,10,12,'#c84a7a');g(4,3,8,10,'#ffd0e0');g(5,5,6,1,'#c84a7a');g(5,8,6,1,'#c84a7a');s.px(8,11,'#4cbf6a');break;
   case 'friends':s.circle(5,6,3,'#ffd0a0');s.circle(11,6,3,'#c8a080');g(2,10,6,5,'#4a8ad8');g(8,10,6,5,'#e86a8a');break;
   case 'eye':s.ellipse(8,8,6,4,'#ffffff');s.circle(8,8,3,'#3a6aa8');s.circle(8,8,1,'#1a1a1a');break;
   case 'tele':g(2,4,12,9,'#3a3a44');g(3,5,10,6,'#0e2014');g(4,7,4,1,'#7aff9a');g(4,9,6,1,'#7aff9a');g(6,13,4,2,'#3a3a44');break;
   case 'fast':s.line(3,3,8,8,'#ffffff');s.line(8,8,3,13,'#ffffff');s.line(8,3,13,8,'#ffffff');s.line(13,8,8,13,'#ffffff');break;
   case 'sound':g(2,6,4,4,'#ffffff');s.line(6,6,10,2,'#ffffff');s.line(6,10,10,14,'#ffffff');g(10,2,1,12,'#ffffff');break;
   case 'coin':s.circle(8,8,6,'#e8a820');s.circle(8,8,5,'#ffd860');g(7,4,2,8,'#e8a820');break;
   case 'coal':s.blob(8,9,6,5,'#4a4a52','#1a1a20',3,.3);s.px(6,7,'#8a8a96');break;
   case 'food':s.ellipse(8,10,6,3,'#e8e0d0');s.blob(8,8,4,3,'#e8803a','#a8481a',2,.3);break;
   case 'crate':g(2,3,12,11,'#a87a4a');g(2,3,12,1,'#c89a6a');s.line(2,3,13,13,'#7a5a3a');s.line(13,3,2,13,'#7a5a3a');break;
   case 'heart':g(3,4,4,4,'#ff5a7a');g(9,4,4,4,'#ff5a7a');g(2,6,12,3,'#ff5a7a');g(4,9,8,2,'#ff5a7a');g(6,11,4,2,'#ff5a7a');break}}))}
function drawHUD(c,inp,V){
  // top: where from, where to, how fast, what day
  const from=V.fromName,to=V.toName;const cx=W/2;
  PX.text(c,from,cx-112,8,{scale:1,align:'right',color:'#ffffff',outline:'#2a1a12'});if(to){PX.text(c,to,cx+110,8,{align:'left',color:'#ffffff',outline:'#2a1a12'});PX.text(c,`in ${V.kmLeft} km`,cx+110,18,{font:'tiny',color:'#ffffff',outline:'#2a1a12'})}
  if(to||S.state!=='station'){c.fillStyle='#2a1a12';c.fillRect(cx-104,13,208,3);c.fillStyle='#ffffff';c.fillRect(cx-103,14,206,1);const prog=V.prog||0;c.drawImage(icon('train'),Math.round(cx-104+prog*200-8),4)}

function validateWildSave(n){
  const finite=(v,lo,hi)=>typeof v==='number'&&Number.isFinite(v)&&v>=lo&&v<=hi;
  if(!n||n.v!==1||!['station','moving'].includes(n.state)||!Array.isArray(n.cars)||n.cars.length>20||n.cars.some(k=>!CARS[k]))throw Error('This is not a Cloverline save.');
  if(!finite(n.loco,0,LOCOS.length-1)||!Number.isInteger(n.loco)||!finite(n.coins,0,1e12)||!finite(n.t,0,1)||!finite(n.day,0,1e7)||!Number.isInteger(n.day)||!finite(n.food,0,200)||!finite(n.fuel,0,10000))throw Error('Invalid journey values.');
  if(![1,2,4].includes(n.ts)||typeof n.name!=='string'||typeof n.uid!=='string'||!['side','cab','window','friend'].includes(n.pov)||n.target&&!ST[n.target])throw Error('Invalid conductor or destination.');
  const record=o=>o&&typeof o==='object'&&!Array.isArray(o);
  if(['stats','visited','secrets','seen','claimed'].some(k=>!record(n[k])))throw Error('Invalid journey records.');
  if(n.wild&&(!record(n.wild)||!record(n.wild.found)||!record(n.wild.restored)||Object.values(n.wild.restored).some(r=>!record(r))))throw Error('Invalid field companion.');
  if(n.state==='station'&&!ST[n.at])throw Error('The station is missing.');
  if(n.state==='moving'&&(!n.seg||!ST[n.seg.a]||!ST[n.seg.b]||!ADJ[n.seg.a].some(e=>e.to===n.seg.b)||![1,-1].includes(n.dir)||!finite(n.u,0,getSeg(n.seg.a,n.seg.b).len)||n.seg.len!==getSeg(n.seg.a,n.seg.b).len))throw Error('The railway segment is invalid.');
  if(!Array.isArray(n.plan)||n.plan.some(k=>!ST[k])||!Array.isArray(n.pets)||n.pets.some(k=>!PETS[k])||!Array.isArray(n.pas)||n.pas.some(p=>!ST[p.to]||!p.look||!(finite(p.look.seed,0,1e12)||typeof p.look.seed==='string'&&VIPS.some(v=>v.id===p.look.seed))||!finite(p.fare,0,1e9)||!finite(p.mood,0,200))||!Array.isArray(n.cargo)||n.cargo.some(c=>!GOODS[c.g]))throw Error('The manifest is invalid.');
  if(n.wild?.photos&&(!Array.isArray(n.wild.photos)||n.wild.photos.length>6||n.wild.photos.some(p=>typeof p.data!=='string'||!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p.data))))throw Error('Invalid postcards.');
}

   HDRI environments and PBR texture sets. Ask for one of those and the compiler says so.

  if(S.materials!=null){
    if(typeof S.materials!=='object'||Array.isArray(S.materials))fail('materials','expected an object of name → material');
    for(const [name,def] of Object.entries(S.materials)){if(matIdx.has(name))mats[matIdx.get(name)][1]=def;else{matIdx.set(name,mats.length);mats.push([name,def]);}}
  }
  const matOf=(name,path)=>{if(!matIdx.has(name))fail(path,`unknown material "${name}" (have: ${[...matIdx.keys()].join(', ')})`);return matIdx.get(name);};
  const leaf=(n,path,dist,defMat=0)=>{const r=tmp('d');lines.push(`vec2 ${r}=vec2(${dist},${n.mat!=null?matOf(n.mat,path+'.mat'):defMat}.0);`);return r;};
  const wingKey=(w,path)=>{if(typeof w!=='string'||!ATLAS_KEYS.includes(w))fail(path,`unknown wing "${w}" (try: ${ATLAS_KEYS.slice(0,12).join(', ')}, …)`);return w;};
  const kids=(n,path)=>{const c=n.children??(n.child?[n.child]:null);if(!Array.isArray(c)||!c.length)fail(path,'needs "children": [ ... ]');return c;};
  const one=(n,path)=>{if(n.child)return n.child;if(Array.isArray(n.children)&&n.children.length)return n.children.length===1?n.children[0]:{type:'union',children:n.children};fail(path,'needs "child": { ... }');};

  function node(n,p,path){
    if(!n||typeof n!=='object'||Array.isArray(n))fail(path,'expected a node object {"type": ...}');
    if(typeof n.type!=='string')fail(path,'missing "type"');
    nodes++;
    let q=p,s=null;
    if(n.pos!=null){const t=tmp('p');lines.push(`vec3 ${t}=${q}-${v3(n.pos,path+'.pos')};`);q=t;}
    if(n.rot!=null){const g=hoist('mat3',`rotInv(${v3(n.rot,path+'.rot')})`),t=tmp('p');lines.push(`vec3 ${t}=${g}*${q};`);q=t;}
    if(n.scale!=null){s=expr(n.scale,path+'.scale');const t=tmp('p');lines.push(`vec3 ${t}=${q}/${s};`);q=t;}
    const r=build(n,q,path);
    if(s)lines.push(`${r}.x*=${s};`);
    if(n.mat!=null&&!LEAVES.has(n.type))lines.push(`${r}.y=${matOf(n.mat,path+'.mat')}.0;`);
    return r;
  }

  function build(n,q,path){
    const E=(key,def)=>expr(n[key],path+'.'+key,def), V=(key,def)=>v3(n[key],path+'.'+key,def), I=(key,def,lo,hi)=>int(n[key],path+'.'+key,def,lo,hi);
    const wrapP=(code)=>{const t=tmp('p');lines.push(`vec3 ${t}=${code};`);return t;};
    switch(n.type){
      case 'sphere':return leaf(n,path,`length(${q})-${E('r',1)}`);
      case 'box':return leaf(n,path,`sdRoundBox(${q},${V('size',[1,1,1])},${E('round',0)})`);
      case 'torus':return leaf(n,path,`sdTorus(${q},vec2(${E('R',1)},${E('r',0.3)}))`);
      case 'plane':return leaf(n,path,`${q}.y-${E('h',0)}`);
      case 'capsule':return leaf(n,path,`sdCapsule(${q},${V('a',[0,0,0])},${V('b',[0,1,0])},${E('r',0.2)})`);
      case 'cylinder':return leaf(n,path,`sdCylinder(${q},${E('h',1)},${E('r',0.5)})`);
      case 'octahedron':return leaf(n,path,`sdOctahedron(${q},${E('s',1)})`);
      case 'gyroid':return leaf(n,path,`sdGyroid(${q},${E('freq',4)},${E('thickness',0.05)})`);
      case 'schwarzP':return leaf(n,path,`sdSchwarzP(${q},${E('freq',4)},${E('thickness',0.1)})`);
      case 'mandelbulb':return leaf(n,path,`sdMandelbulb(${q},${E('power',8)},${I('iterations',8,1,32)})`);
      case 'julia':return leaf(n,path,`sdJulia(${q},${v4(n.c,path+'.c',[-0.2,0.6,0.2,0.2])},${I('iterations',11,1,32)})`);
      case 'menger':return leaf(n,path,`sdMenger(${q},${I('iterations',4,0,8)})`);
      case 'sierpinski':return leaf(n,path,`sdSierpinski(${q},${I('iterations',8,1,16)})`);
      case 'mandelbox':return leaf(n,path,`sdMandelbox(${q},${E('factor',-1.8)},${I('iterations',12,1,30)})`);
      case 'apollonian':return leaf(n,path,`sdApollonian(${q},${E('factor',1.2)},${I('iterations',8,1,16)})`);
      case 'tesseract':{
        const g=tmp('g');globals.push(`vec3 ${g}[16];`);
        inits.push(`tessVerts(${g},${rot4(n.rot4,path+'.rot4')},${E('size',1)},${E('persp',3)});`);
        return leaf(n,path,`sdTessWire(${q},${g},${E('thickness',0.03)},${E('vertex',0.06)})`);
      }
      case 'hypercube':case 'clifford':case 'duocylinder':{
        const g=hoist('mat4',`transpose(${rot4(n.rot4,path+'.rot4')})`),q4=tmp('p');
        lines.push(`vec4 ${q4}=${g}*vec4(${q},${E('w',0)});`);
        if(n.type==='hypercube')return leaf(n,path,`sdBox4(${q4},${E('size',1)})`);
        if(n.type==='clifford')return leaf(n,path,`sdClifford(${q4},${E('r1',0.7)},${E('r2',0.7)},${E('thickness',0.04)})`);
        return leaf(n,path,`sdDuocyl(${q4},${E('r1',0.8)},${E('r2',0.8)})`);
      }
      case 'atlas':{
        let wing=n.wing,index=n.index;
        if(typeof n.address==='string'){const m=n.address.match(/^(\w+)[:·](\d+)$/);if(!m)fail(path+'.address','use "wing:index", e.g. "cry_fau:7"');wing=m[1];index=+m[2];}
        wing=wingKey(wing??'catalog',path+'.wing');
        if(index==null)index=0;if(typeof index!=='number'||!(index>=0)||index%1)fail(path+'.index','must be a whole number ≥ 0');
        if(atlas.statics.length>=MAX_STATIC)fail(path,`at most ${MAX_STATIC} atlas nodes per scene (use atlasField for more)`);
        const k=atlas.statics.length;atlas.statics.push({key:wing+':'+index,wing,index});
        return leaf(n,path,`sdAtlas(${q},uStaticSlot[${k}],${E('size',1.6)},__WC__)`,1);
      }
      case 'world':{
        // exact triangles, ray traced through a BVH outside map(); only its own pos/rot/scale apply
        if(world.v)fail(path,'only one world per scene');
        let name=n.name;
        if(n.generate!=null){if(!WORLD_GEN[n.generate])fail(path+'.generate',`unknown generator "${n.generate}" (have: ${Object.keys(WORLD_GEN).join(', ')})`);name=`gen:${n.generate}:${Math.round(+(n.seed??1))||0}`;}
        if(typeof name!=='string'||!worldSource(name,true))fail(path+'.name',WORLDS.size||MESHES.size?`no world "${name}" (have: ${[...WORLDS.keys(),...MESHES.keys()].slice(0,8).join(', ')})`:'no world loaded: drop a DS ROM (.nds), a Minecraft region (.mca) or a mesh on the page, or use "generate"');
        const nums=(v,d,p)=>{v=v??d;if(!Array.isArray(v)||v.length!==3||!v.every(x=>typeof x==='number'&&isFinite(x)))fail(p,'plain numbers [x,y,z]');return v;};
        const size=n.size??40;if(typeof size!=='number'||!(size>0))fail(path+'.size','a plain number > 0');
        world.v={name,pos:nums(n.pos,[0,0,0],path+'.pos'),rot:nums(n.rot,[0,0,0],path+'.rot'),size,rough:typeof n.rough==='number'?n.rough:0.85,ao:typeof n.ao==='number'?n.ao:1};
        return leaf(n,path,'1e9');
      }
      case 'mesh':{
        if(typeof n.name==='string'&&!MESHES.has(n.name)&&WORLDS.has(n.name))MESHES.set(n.name,worldToMesh(WORLDS.get(n.name)));   // a model, baked on demand
        if(typeof n.name!=='string'||!MESHES.has(n.name))fail(path+'.name',MESHES.size?`no imported mesh "${n.name}" (have: ${[...MESHES.keys()].slice(0,8).join(', ')})`:`no meshes imported yet: drop a .nif or .obj on the page, or use "Import mesh"`);
        if(atlas.statics.length>=MAX_STATIC)fail(path,`at most ${MAX_STATIC} atlas + mesh nodes per scene`);
        const k=atlas.statics.length;atlas.statics.push({key:'mesh:'+n.name});
        return leaf(n,path,`sdAtlas(${q},uStaticSlot[${k}],${E('size',1.6)},__WC__)`,1);
      }
      case 'atlasField':{
        if(atlas.field)fail(path,'only one atlasField per scene');
        let w=n.wings??'*';if(typeof w==='string'&&w!=='*')w=[w];
        if(w!=='*'){if(!Array.isArray(w)||!w.length)fail(path+'.wings','use "*", one wing key, or a list of keys');w.forEach((x,i)=>wingKey(x,`${path}.wings[${i}]`));}
        const per=n.period??3,pv=Array.isArray(per)?per:[per,per];
        if(pv.length!==2||!pv.every(x=>typeof x==='number'&&x>0))fail(path+'.period','a plain number > 0 or [x, z]');
        const win=Math.max(1,Math.min(MAX_WIN,Math.round(+(n.window??5))||5));
        const off=Array.isArray(n.pos)&&n.pos.every(x=>typeof x==='number')?[n.pos[0],n.pos[2]]:[0,0];
        atlas.field={wings:w,seed:Math.round(+(n.seed??0))||0,period:pv,window:win,offset:off};
        return leaf(n,path,`sdAtlasField(${q},vec2(${num(pv[0])},${num(pv[1])}),${E('size',1.6)},__WC__)`,1);
      }
      case 'union':case 'intersect':case 'subtract':{
        const ch=kids(n,path),kk=n.k!=null?expr(n.k,path+'.k'):null;
        const fn={union:kk?'opSU':'opU',intersect:kk?'opSI':'opI',subtract:kk?'opSS':'opS'}[n.type];
        let acc=node(ch[0],q,path+'.children[0]');
        for(let i=1;i<ch.length;i++){const b=node(ch[i],q,`${path}.children[${i}]`),r=tmp('d');lines.push(`vec2 ${r}=${fn}(${acc},${b}${kk?','+kk:''});`);acc=r;}
        return acc;
      }
      case 'repeat':{
        const per=n.period??[2,0,2],lim=n.limit;
        if(!Array.isArray(per)||per.length!==3)fail(path+'.period','expected [x,y,z] (0 = no repeat on that axis)');
        if(lim!=null&&(!Array.isArray(lim)||lim.length!==3))fail(path+'.limit','expected [x,y,z]');
        const t=wrapP(q);
        ['x','y','z'].forEach((ax,i)=>{
          if(per[i]===0||per[i]==null)return;
          const P=expr(per[i],`${path}.period[${i}]`);
          if(lim&&lim[i]){const L=expr(lim[i],`${path}.limit[${i}]`);lines.push(`${t}.${ax}=${q}.${ax}-${P}*clamp(round(${q}.${ax}/${P}),-${L},${L});`);}
          else lines.push(`${t}.${ax}=${q}.${ax}-${P}*round(${q}.${ax}/${P});`);
        });
        return node(one(n,path),t,path+'.child');
      }
      case 'mirror':{
        const ax=Array.isArray(n.axes)?n.axes.join(''):String(n.axes??'x');
        if(!/^[xyz]+$/.test(ax))fail(path+'.axes','use letters x, y, z, e.g. "xz"');
        const t=wrapP(q);for(const c of new Set(ax))lines.push(`${t}.${c}=abs(${t}.${c});`);
        return node(one(n,path),t,path+'.child');
      }
      case 'kaleido':return node(one(n,path),wrapP(`opKaleido(${q},${E('n',6)})`),path+'.child');
      case 'twist':case 'bend':{
        const t=wrapP(`${n.type==='twist'?'opTwist':'opBend'}(${q},${E('k',1)})`),r=node(one(n,path),t,path+'.child');
        lines.push(`${r}.x*=${E('lip',0.6)};`);return r;
      }
      case 'displace':{const r=node(one(n,path),q,path+'.child');lines.push(`${r}.x=(${r}.x+${E('amp',0.05)}*(fbm(${q}*${E('freq',4)})*2.-1.))*.7;`);return r;}
      case 'onion':{const r=node(one(n,path),q,path+'.child');lines.push(`${r}.x=abs(${r}.x)-${E('thickness',0.05)};`);return r;}
      case 'round':{const r=node(one(n,path),q,path+'.child');lines.push(`${r}.x-=${E('r',0.05)};`);return r;}
      case 'invert':{
        const R=E('r',1),t=wrapP(`${q}*(${R}*${R}/max(dot(${q},${q}),1e-8))`),r=node(one(n,path),t,path+'.child');
        lines.push(`${r}.x=opInvertDist(${r}.x,length(${t}),${R});`);return r;
      }
      default:fail(path,`unknown type "${n.type}"`);
    }
  }

  function pattern(pt,path){
    const o=typeof pt==='string'?{type:pt}:pt;
    if(!o||typeof o!=='object')fail(path,'expected {"type": ...}');
    const E=(key,def)=>expr(o[key],path+'.'+key,def), V=(key,def)=>v3(o[key],path+'.'+key,def);
    switch(o.type){
      case 'checker':return `{vec3 c=floor((p-n*.01)*${E('scale',1)});if(mod(c.x+c.y+c.z,2.)>.5)m.col=${V('color2',[0.1,0.1,0.1])};}`;
      case 'stripes':return `{if(fract(dot(p-n*.01,normalize(${V('axis',[0,1,0])}))*${E('scale',4)})>.5)m.col=${V('color2',[0.1,0.1,0.1])};}`;
      case 'noise':return `m.col=mix(m.col,${V('color2',[0.1,0.1,0.1])},smoothstep(.3,.7,fbm(p*${E('scale',2)})));`;
      case 'height':return `m.col=mix(m.col,${V('color2',[1,1,1])},smoothstep(${E('lo',0)},${E('hi',2)},p.y));`;
      case 'radial':return `m.col=mix(m.col,${V('color2',[1,1,1])},smoothstep(${E('lo',0)},${E('hi',2)},length(p-${V('center',[0,0,0])})));`;
      case 'normal':return `m.col=mix(m.col,.5+.5*n,${E('amount',1)});`;
      case 'poincare':{
        const P=+(o.p??7),Q=+(o.q??3);
        if(!(P>=3&&Q>=3&&1/P+1/Q<0.5))fail(path,'poincare needs integers p,q ≥ 3 with 1/p+1/q < 1/2 (try 7,3)');
        return `{vec3 h=poincare(p.xz/${E('scale',5)},${num(P)},${num(Q)});if(h.z>.5){if(h.x>.5)m.col=${V('color2',[0.1,0.15,0.3])};m.col=mix(${V('edge',[0.9,0.7,0.3])},m.col,smoothstep(0.,${E('width',0.015)},h.y));}}`;
      }
      default:fail(path,`unknown pattern "${o.type}"`);
    }
  }

  const root=node(S.scene,'p','scene');
  const matCode=mats.map(([name,def],i)=>{
    const P='materials.'+name;
    if(!def||typeof def!=='object'||Array.isArray(def))fail(P,'expected an object');
    const L=[`m.col=${v3(def.color,P+'.color',[0.8,0.8,0.8])};`,`m.rough=clamp(${expr(def.rough,P+'.rough',0.5)},.03,1.);`,`m.metal=clamp(${expr(def.metal,P+'.metal',0)},0.,1.);`,`m.emit=${v3(def.emit,P+'.emit',0)};`,`m.film=${expr(def.film,P+'.film',0)};`,`m.atlas=${def.atlasColor?'1.0':'0.0'};`];
    if(def.pattern!=null)L.push(pattern(def.pattern,P+'.pattern'));
    if(def.texture!=null){
      const set=TEXSETS.get(def.texture);
      if(!set)fail(P+'.texture',`unknown texture set "${def.texture}"`+(TEXSETS.size?` (loaded: ${visibleSets().slice(0,40).join(', ')})`:' (none loaded: import a .zip or image first)'));
      const ly=k=>set.maps[k]?TEXARR.layer(def.texture,k).toFixed(1):'-1.';
      L.push(`texMat(m,p,n,${ly('color')},${ly('normal')},${ly('rough')},${expr(def.texScale,P+'.texScale',0.5)},${expr(def.normal,P+'.normal',1)});`);
    }
    return `  if(i==${i}){${L.join('')}}`;
  }).join('\n');

  const env=S.env??{};
  if(typeof env!=='object'||Array.isArray(env))fail('env','expected an object');
  const ev=(key,def)=>expr(env[key],'env.'+key,def), ec=(key,def)=>v3(env[key],'env.'+key,def);
  let envSpec=null;
  if(env.hdri!=null){
    if(!HDRIS.has(env.hdri))fail('env.hdri',`unknown HDRI "${env.hdri}"`+(HDRIS.size?` (loaded: ${[...HDRIS.keys()].join(', ')})`:' (none loaded: import a .hdr or a .zip containing one)'));
    const num=(k,d)=>{const v=env[k]??d;if(typeof v!=='number')fail('env.'+k,'expected a number');return v;};
    envSpec={name:env.hdri,intensity:num('hdriIntensity',1),yaw:num('hdriRotation',0)*Math.PI/180};
  }
  const defines=[
    `#define SKY_TOP ${ec('skyTop','#3d6ea8')}`,`#define SKY_HOR ${ec('horizon','#c9d6e3')}`,`#define GROUND_COL ${ec('ground','#3a3530')}`,
    envSpec&&env.sun==null?'#define SUN_DIR uSunDir':`#define SUN_DIR normalize(${ec('sun',[0.5,0.7,0.3])})`,`#define SUN_COL ${ec('sunColor',[3,2.8,2.5])}`,`#define SUN_SOFT ${ev('sunSoft',0.03)}`,
    `#define FOG ${ev('fog',0.01)}`,`#define EXPOSURE ${ev('exposure',1)}`,`#define AMBIENT ${ev('ambient',0.6)}`,
    `#define STEP ${ev('step',0.9)}`,`#define MAX_DIST ${ev('maxDist',80)}`,`#define SHADOW_K ${ev('shadowK',12)}`
  ].join('\n');

  const c=S.camera??{};
  const arr=(v,d,path)=>{v=v??d;if(!Array.isArray(v)||v.length!==3||!v.every(x=>typeof x==='number'&&isFinite(x)))fail(path,'camera values must be plain numbers [x,y,z]');return v;};
  const cnum=(v,d,path)=>{v=v??d;if(typeof v!=='number'||!isFinite(v))fail(path,'camera values must be plain numbers');return v;};
  const cam={pos:arr(c.pos,[4,2.5,5],'camera.pos'),target:arr(c.target,[0,1,0],'camera.target'),fov:cnum(c.fov,45,'camera.fov'),aperture:cnum(c.aperture,0,'camera.aperture'),focus:c.focus==null?null:cnum(c.focus,0,'camera.focus'),spin:cnum(c.spin,0,'camera.spin')};

  const body=lines.join('\n  '),hasAtlas=atlas.statics.length>0||!!atlas.field;
  // mapC repeats map with colour capture switched on, so an atlas hit can read its own palette.
  const mapC=hasAtlas?`void mapC(vec3 p){\n  ${body.replace(/__WC__/g,'true')}\n}`:'void mapC(vec3 p){}';
  const sceneCode=`${defines}\n${globals.join('\n')}\nvoid initGlobals(){\n  ${inits.join('\n  ')}\n}\nvec2 map(vec3 p){\n  ${body.replace(/__WC__/g,'false')}\n  return opPlayer(${root},p);\n}\n${mapC}\nMat getMat(float id,vec3 p,inout vec3 n){\n  Mat m=Mat(vec3(.8),.5,0.,vec3(0.),0.,0.);int i=int(id+.5);\n${matCode}\n  if(i==900)playerMat(m,p);\n  return m;\n}\n`;
  return {sceneCode,usesTime,cam,atlas,world:world.v,envSpec,stats:`${nodes} nodes · ${mats.length} materials${usesTime?' · animated':''}${hasAtlas?` · atlas ${atlas.statics.length}${atlas.field?' + field':''}`:''}${world.v?' · world':''}`};
}

/* ───────────────────────── GLSL library ───────────────────────── */
const LIB=`
#define PI 3.14159265359
struct Mat{vec3 col;float rough;float metal;vec3 emit;float film;float atlas;};
mat3 rotInv(vec3 a){a*=PI/180.;float cx=cos(a.x),sx=sin(a.x),cy=cos(a.y),sy=sin(a.y),cz=cos(a.z),sz=sin(a.z);
  mat3 rx=mat3(1,0,0,0,cx,sx,0,-sx,cx),ry=mat3(cy,0,-sy,0,1,0,sy,0,cy),rz=mat3(cz,sz,0,-sz,cz,0,0,0,1);return transpose(rz*ry*rx);}
mat4 prot(int i,int j,float a){mat4 m=mat4(1.);float c=cos(a),s=sin(a);m[i][i]=c;m[j][j]=c;m[i][j]=s;m[j][i]=-s;return m;}
mat4 rot4(vec3 aw,vec3 a3){aw*=PI/180.;a3*=PI/180.;return prot(0,3,aw.x)*prot(1,3,aw.y)*prot(2,3,aw.z)*prot(0,1,a3.x)*prot(0,2,a3.y)*prot(1,2,a3.z);}
float hash3(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*noise3(p);p*=2.03;a*=.5;}return s;}
vec2 opU(vec2 a,vec2 b){return a.x<b.x?a:b;}
vec2 opI(vec2 a,vec2 b){return a.x>b.x?a:b;}
vec2 opS(vec2 a,vec2 b){return a.x>-b.x?a:vec2(-b.x,a.y);}
vec2 opSU(vec2 a,vec2 b,float k){float h=clamp(.5+.5*(b.x-a.x)/k,0.,1.);return vec2(mix(b.x,a.x,h)-k*h*(1.-h),h>.5?a.y:b.y);}
vec2 opSI(vec2 a,vec2 b,float k){float h=clamp(.5-.5*(b.x-a.x)/k,0.,1.);return vec2(mix(b.x,a.x,h)+k*h*(1.-h),h>.5?a.y:b.y);}
vec2 opSS(vec2 a,vec2 b,float k){float h=clamp(.5-.5*(b.x+a.x)/k,0.,1.);return vec2(mix(a.x,-b.x,h)+k*h*(1.-h),a.y);}

  radial {lo, hi, center, color2} | normal {amount}
  poincare {p, q, scale, color2, edge, width}  hyperbolic {p,q} tiling of the Poincaré disk on the XZ plane (radius = scale). Needs 1/p+1/q < 1/2: e.g. 7,3  5,4  8,3  4,5.

"mat" on a combinator/operator node recolors its whole subtree.

    c.fillStyle='#c9a35a';c.fillRect(0,0,W,2);c.fillRect(0,H-2,W,2);c.fillRect(0,0,2,H);c.fillRect(W-2,0,2,H);
    // crosshair ticks
    c.fillStyle='rgba(255,230,180,.45)';c.fillRect(W/2-1,8,2,10);c.fillRect(W/2-1,H-18,2,10);c.fillRect(8,H/2-1,10,2);c.fillRect(W-18,H/2-1,10,2)},
  tele(c,rest){const sub=(c[1]||'').toUpperCase();
    if(!sub){tele('OMNIGON · the observatory eyepiece. Scenes: '+this.list().map(k=>k.toUpperCase()).join(' · '),'q');tele('OMNIGON <scene> · OMNIGON PRESETS · OMNIGON <preset name> · OMNIGON SPEC · OMNIGON {json} · OMNIGON STILL/LIVE · OMNIGON QUALITY LOW/NORMAL/HIGH','q');
      const seen=S.obs&&S.obs.seen||{};tele('Seen: '+this.list().map(k=>(seen[k]?'★ ':'· ')+this.SCENES[k].title).join('  '),'dim');return}
    if(sub==='SPEC'){if(!window.OMNIGON)return tele('The Omnigon core is not loaded.','warn');OMNIGON.SPEC.split('\n').slice(0,60).forEach(l=>tele(l,'dim'));tele('(spec shortened; the full text is in omnigon-core.js)','dim');return}
    if(sub==='PRESETS'){tele('Omnigon presets: '+this.presets().join(' · '),'q');return}
    if(sub==='STILL'||sub==='LIVE'){this.init();if(this.O){this.O.setQuality({animate:sub==='LIVE'});tele(sub==='LIVE'?'The scene moves again.':'Held still, so the picture can settle.','good')}return}
    if(sub==='QUALITY'){this.init();if(!this.O)return tele('No lens.','dim');const q=(c[2]||'').toUpperCase();const Qs={LOW:{steps:64,bounces:0,cap:16},NORMAL:{steps:96,bounces:1,cap:48},HIGH:{steps:160,bounces:2,cap:128}}[q];if(!Qs)return tele('OMNIGON QUALITY LOW, NORMAL or HIGH.','dim');this.O.setQuality(Qs);this.quality=q.toLowerCase();tele('Quality: '+q.toLowerCase(),'good');return}
    if(sub==='DOWN'||sub==='CLOSE'){this.leave();tele('You climb down from the eyepiece.','dim');return}
    // a scene, a preset, or JSON
    if(!this.can())return tele('The telescope lives in the Star observatory car, or up at the Continental Divide.','dim');
    const what=rest.trim();this.lastErr='';const ok=this.look(what);
    if(!ok){if(this.err)return tele(this.err,'warn');if(this.lastErr)return tele(this.lastErr,'warn');return tele('No such scene. Try OMNIGON RING, OMNIGON PRESETS, or paste Omnigon JSON after OMNIGON.','dim')}
    this.enter();tele(`The glass turns. ${this.title}. (${this.O.compiled.stats}, compiled in ${this.compileMs} ms)`,'good')}
};

 {id:'scopeall',t:'See every secret place through the Omnigon eyepiece',r:1200,test:S=>!!(S.secrets&&S.secrets.omnigon)});

{const obsValidate=validateWildSave;validateWildSave=function(n){const was=n&&n.pov;if(was===OBS.pov)n.pov='side';obsValidate(n);if(was===OBS.pov)n.pov=OBS.pov;

{const obsDraw=draw;draw=function(c,dt){

PANELS.pov=function(c,inp){const R=panelFrame(c,inp,'Point of View','How do you want to watch the world go by?');

  opts.forEach(([k,n,d],i)=>{const y=R.y+i*44;PX.panel(c,R.x,y,R.w,40,{fill:S.pov===k?'#fff0c8':'#fff8ee',flat:1,shadow:false});PX.text(c,n,R.x+10,y+8,{scale:2,color:'#3a2414'});PX.text(c,d,R.x+10,y+26,{font:'tiny',color:'#8a6a50'});
    inp.zone(R.x,y,R.w,40,()=>{if(k==='friend'){const p=NET.peers()[0];if(!p)return toast('Nobody else is online right now. When a friend joins, you can watch from their window.');watchFriend({id:p.id});closePanel();return}
      if(k===OBS.pov){if(OBS.enter())closePanel();return}
      S.pov=k;if(k==='window')VIEW.windowIdx=Math.max(0,S.cars.findIndex(t=>t==='dome'||t==='coach'||t==='pets'));closePanel()})})};
// ---- telegraph: OMNIGON, OBSERVE, and POV OBSERVATORY
{const obsTele=teleCmd;teleCmd=function(raw){raw=String(raw);const c=raw.trim().toUpperCase().split(/\s+/);const v=c[0];
  if(MODE==='play'&&(v==='OMNIGON'||v==='OBSERVE'||v==='SCOPE'||v==='TELESCOPE')){tele('> '+raw,'you');TELE.hist.unshift(raw);TELE.hi=-1;PX.Sound.click();OBS.tele(c,raw.trim().split(/\s+/).slice(1).join(' '));return}
  if(MODE==='play'&&(v==='POV'||v==='VIEW')&&['OBSERVATORY','SCOPE','TELESCOPE','OMNIGON'].includes(c[1]||'')){tele('> '+raw,'you');TELE.hist.unshift(raw);TELE.hi=-1;PX.Sound.click();if(OBS.enter())tele('You climb up to the eyepiece.','good');return}
  const r=obsTele(raw);
  if(MODE==='play'&&(v==='HELP'||v==='?'))tele('OMNIGON <scene> · POV OBSERVATORY · OMNIGON {json} — the observatory eyepiece','q');
  return r}}

<script>
/* CLOVERLINE 6 · HOUSE STYLE
   An additive expansion. Earlier layers are untouched. This one makes the game feel like one
   object: one type system and one paper-and-brass palette across the canvas panels, the
   HTML books, the telegraph and the tool buttons; a camera that stays where you put it, with
   a tappable train strip; a Consist panel for rearranging cars; a Point of View menu that
   greys out what you have not unlocked and says why; three new points of view (the caboose
   platform, the roof deck and the dispatcher's drone); coins and hearts in every car that has
   passengers, with hearts that actually cheer a car up; a distinct interior for every car;
   fullscreen and small-screen handling. */
const HOUSE={
  CSS:`
:root{--paper:#fbecd8;--paper2:#fff8ee;--ink:#3a2414;--ink2:#8a6a50;--line:#6a3e22;--inner:#c9a07a;--green:#6ac46a;--green2:#2e6a34;--brass:#c9a35a;--mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#cl-root canvas{touch-action:none}
#wild-loading{font-family:var(--mono)!important;background:#142d25!important}

#wild-tools button:hover{background:var(--paper2)!important}
/* the books (Field companion, Railway book): same paper, same rules, same type */

.wild-book{background:var(--paper)!important;border:3px solid var(--line)!important;border-radius:3px!important;box-shadow:0 0 0 1px var(--inner) inset,0 6px 0 #2a1a10,0 24px 60px #000a!important;max-height:calc(100dvh - 24px)!important}
.wild-book header{background:var(--paper)!important;border-bottom:2px solid var(--inner);padding:18px 24px 12px!important}
.wild-kicker{font:10px var(--mono)!important;letter-spacing:3px!important;color:var(--ink2)!important;text-transform:uppercase}
.wild-book h1,.wild-book h2,.wild-book h3{font-family:var(--mono)!important;letter-spacing:.5px!important;color:#5a2e14!important;text-transform:uppercase}
.wild-book h1{font-size:22px!important;line-height:1.2!important;margin:8px 28px 4px 0!important}.wild-book h2{font-size:15px!important}.wild-book h3{font-size:13px!important}
.wild-book p{color:var(--ink2)!important}.wild-book small{font-family:var(--mono)!important;color:var(--ink2)!important}
.wild-book nav{background:var(--paper)!important;border-bottom:2px solid var(--inner)!important;padding:0 20px!important;gap:2px!important}
.wild-book nav button{border:0!important;border-radius:0!important;background:transparent!important;color:var(--ink2)!important;box-shadow:none!important;text-transform:uppercase;letter-spacing:1px;font-size:11px!important;min-height:34px!important}
.wild-book nav button[aria-current=page]{color:#5a2e14!important;border-bottom:3px solid var(--green)!important;font-weight:700}
.wild-book button:not(.wild-close):not(nav button),.wild-file{font:12px/1 var(--mono)!important;text-transform:uppercase;letter-spacing:.5px;background:var(--green)!important;color:#0e2a14!important;border:0!important;border-bottom:3px solid var(--green2)!important;border-radius:2px!important;min-height:30px!important;padding:7px 11px!important;box-shadow:inset 0 1px 0 #ffffff60!important}
.wild-book button:disabled{background:#d8c8a8!important;border-bottom-color:#8a6a50!important;color:#8a6a50!important;opacity:1!important}
.wild-close{color:#5a2e14!important;font-family:var(--mono)!important}
.wild-content{padding:18px 24px 22px!important;background:var(--paper)!important}
.wild-entry,.rail-catalog article,.rail-pets article,.rail-summary,.wild-callout{background:var(--paper2)!important;border:2px solid var(--inner)!important;border-radius:2px!important;color:var(--ink)!important}
.wild-entry.recorded{background:#eef8e0!important;border-color:var(--green2)!important}
.wild-progress{background:#e8d8c0!important;border:1px solid var(--inner)}.wild-progress i{background:var(--green)!important}
.wild-stamp{border:2px solid var(--brass)!important;color:#8a6a2a!important;font-family:var(--mono)!important;font-size:16px!important}
.wild-book footer{background:var(--paper)!important;border-top:2px solid var(--inner)!important;color:var(--ink2)!important;font:10px var(--mono)!important;letter-spacing:2px;text-transform:uppercase}
.wild-book input,.wild-book select,.wild-book textarea{font:13px var(--mono)!important;background:#fff!important;color:var(--ink)!important;border:2px solid var(--inner)!important;border-radius:2px!important}

.rail-owned>div{border-bottom:1px solid var(--inner)!important}
/* the telegraph keeps its green glass but takes the same type and rule */
#tele{font-family:var(--mono)!important;border-top:3px solid var(--line)!important;background:rgba(8,14,10,.95)!important}

  LOOK_PRICE:{steam_classic:0,steam_express:2,steam_mallet:3,steam_saddle:2,diesel_hood:3,diesel_cab:3,diesel_streamliner:4,electric_aerodynamic:5,bullet_train:6,maglev:8,crystal_express:10,cosmic_express:12},

  can(n){return (S.clv||0)>=n},
  pay(n,what){this.st();if(!this.can(n)){toast(`That needs ${n} clover token${n===1?'':'s'}. You have ${S.clv}. Earn them from secrets, Daisy's notebook, or the Bank in the menu.`,'warn');return false}S.clv-=n;floatText('-'+n+' 🍀','#8ae08a');PX.Sound.coin();if(what)toast(what,'good');return true},
  earn(n,why){this.st();S.clv+=n;S.stats.clvEarned=(S.stats.clvEarned||0)+n;toast(`🍀 +${n} clover token${n===1?'':'s'}: ${why}`,'good');PX.Sound.chime()},
  ownsLook(cls){const t=this.st();return this.LOOK_PRICE[cls]===0||t.ownedLooks.includes(cls)||TRW.LOCO_DEF.slice(0,(S.loco|0)+1).includes(cls)},
  ownsVar(cls,v){return v===0||!!(this.st().ownedVar[cls]||{})[v]},
  ownsCarVar(k,v){return v===0||!!(this.st().ownedCarVar[k]||{})[v]},
  buyLook(cls){const p=this.LOOK_PRICE[cls]||0;if(this.ownsLook(cls))return true;const t=this.st();say(DAISY,[`The ${TRW.LOCO_NAMES[cls]} look costs ${p} clover tokens. You have ${S.clv}.`],[['Buy it',()=>{if(this.pay(p,'The paint shop gets to work.')){t.ownedLooks.push(cls);t.loco=cls;t.lv=0}}],['Not now',null]]);return false},

    PX.button(c,R.x,y0+3*44+28,120,16,'Back to default',{color:'#d8c8a8',dark:'#6a4a20'});inp.zone(R.x,y0+3*44+28,120,16,()=>{t.loco=null;t.lv=0})}
  else if(P.tab==='cars'){const per=8;const page=P.page||0;const list=S.cars;const pages=Math.max(1,Math.ceil(list.length/per));
    list.slice(page*per,page*per+per).forEach((k,i)=>{const col=i%2,row=Math.floor(i/2);const x=R.x+col*268,y=y0+row*44;PX.panel(c,x,y,262,40,{fill:'#fff8ee',flat:1,shadow:false});const cv=TRW.carSprite(k);if(cv)c.drawImage(cv,x+4,y+2,72,36);const v=(t.cars[k]|0);PX.text(c,CARS[k].n,x+80,y+6,{color:'#3a2414'});const nv=(v+1)%vmax;PX.text(c,`colorway ${v+1}/${vmax} - tap for next${HUB.ownsCarVar(k,nv)?'':' (1 token)'}`,x+80,y+22,{font:'tiny',color:'#8a6a50'});
      inp.zone(x,y,262,40,()=>{if(HUB.ownsCarVar(k,nv)){t.cars[k]=nv;PX.Sound.click()}else HUB.buyVar(k,nv,true)})});
    if(pages>1){PX.text(c,`page ${page+1}/${pages}`,R.x,y0+4*44+4,{font:'tiny',color:'#8a6a50'});PX.button(c,R.x+90,y0+4*44,40,14,'<',{color:'#d8c8a8',dark:'#6a4a20'});inp.zone(R.x+90,y0+4*44,40,14,()=>{P.page=(page+pages-1)%pages});PX.button(c,R.x+134,y0+4*44,40,14,'>',{color:'#d8c8a8',dark:'#6a4a20'});inp.zone(R.x+134,y0+4*44,40,14,()=>{P.page=(page+1)%pages})}}
  else{const rows=[['Tiny Rail Worlds sprites',t.on!==false,()=>{t.on=t.on===false;PX.forget('stn');PX.forget('wild-station:')},0],['Brass art-deco frames'+(t.brassOwned?'':' ('+HUB.BRASS_PRICE+' tokens)'),!!t.brass,()=>{if(!t.brassOwned){if(!HUB.pay(HUB.BRASS_PRICE,'Brass frames are yours.'))return;t.brassOwned=1}t.brass=!t.brass},1]];
    rows.forEach(([n,on,fn],i)=>{const y=y0+i*30;PX.panel(c,R.x,y,R.w,26,{fill:'#fff8ee',flat:1,shadow:false});PX.text(c,n,R.x+10,y+8,{color:'#3a2414'});PX.button(c,R.x+R.w-70,y+5,60,16,on?'ON':'OFF',{color:on?'#6ac46a':'#c86a5a',dark:'#2e4a34'});inp.zone(R.x,y,R.w,26,()=>{fn();PX.Sound.click()})});
    PX.text(c,'Sprites: Tiny Rail Worlds, Quadruple Edition. Frames after the Golden Game UI set.',R.x,y0+70,{font:'tiny',color:'#8a6a50'})}};
// ---- sprites honour ownership (a loaded save cannot wear what it has not bought)
{const ls=TRW.locoSprite.bind(TRW);TRW.locoSprite=function(level){const t=HUB.st();if(t.loco&&!HUB.ownsLook(t.loco)){t.loco=null;t.lv=0}if(t.lv&&!HUB.ownsVar(TRW.locoCls(level),t.lv))t.lv=0;return ls(level)};
 const cs=TRW.carSprite.bind(TRW);TRW.carSprite=function(key){const t=HUB.st();if(t.cars[key]&&!HUB.ownsCarVar(key,t.cars[key]))t.cars[key]=0;return cs(key)}}
// ---- earning: secrets, notebook claims, daily ride
{const hf=found;found=function(id){const r=hf(id);if(r!==false&&S.secrets[id]&&!(S.clvSec||{})[id]){S.clvSec=S.clvSec||{};S.clvSec[id]=1;HUB.earn(HUB.SECRET,'a secret found')}return r}}
{const hu=update;let claimed=-1;update=function(dt){hu(dt);if(!S||TITLE)return;HUB.st();const n=Object.keys(S.claimed||{}).length;if(claimed>=0&&n>claimed)HUB.earn(HUB.GOAL*(n-claimed),'a notebook goal');claimed=n;if(!S.clvDay)HUB.daily()}}
// ---- HUD column + Esc opens the hub
{const hh=drawHUD;drawHUD=function(c,inp,V){hh(c,inp,V);if(S&&!TITLE&&MODE==='play'&&!(window.WILD&&WILD.photoMode)&&!PANEL)HUB.column(c,inp,V)}}
{const hf=frame;frame=function(dt){const inp=GAME.input;const esc=!!inp.pressed.Escape;const openHub=esc&&S&&!TITLE&&MODE==='play'&&!PANEL&&!DLG&&S.pov==='side'&&!(window.WILD&&WILD.modal);hf(dt);if(openHub&&!PANEL)openPanel('menu')}}
// ---- save validation
{const hv=validateWildSave;validateWildSave=function(n){hv(n);if(n.clv!=null&&!(typeof n.clv==='number'&&Number.isFinite(n.clv)&&n.clv>=0&&n.clv<=99999))n.clv=0}}
// ---- the left column shrinks to Menu (+ pause), phones get their quick row
{const st=document.createElement('style');st.textContent=`#wild-tools button:not([data-pause]):not(.cl-keep){display:none}#wild-tools .cl-keep{display:inline-block}#wild-tools .cl-keep.cl-phone-only{display:none}.cl-phone #wild-tools .cl-keep.cl-phone-only,.cl-portrait #wild-tools .cl-keep.cl-phone-only{display:inline-block}`;document.head.appendChild(st);
 const hm=WILD.mount;WILD.mount=function(){const r=hm.apply(this,arguments);try{[...this.tools.querySelectorAll('.cl-phone-only')].forEach(b=>b.remove());
  const mk=(t,fn,cls)=>{const b=document.createElement('button');b.className=cls||'cl-keep';b.textContent=t;b.onclick=fn;return b};
  this.tools.insertBefore(mk('☰ Menu',()=>{if(!S||TITLE)return;PANEL==='menu'?closePanel():openPanel('menu')}),this.tools.firstChild);
  for(const [t,fn] of [['⌨ Telegraph',()=>openTele()],['👁 View',()=>{if(S&&!TITLE)openPanel('pov')}],['🗺 Map',()=>{if(S&&!TITLE)openPanel('map')}]])this.tools.appendChild(mk(t,fn,'cl-keep cl-phone-only'))}catch(e){}return r}}
// ---- telegraph
{const ht=teleCmd;teleCmd=function(raw){raw=String(raw);const c=raw.trim().toUpperCase().split(/\s+/);const v=c[0];const echo=()=>{tele('> '+raw,'you');TELE.hist.unshift(raw);TELE.hi=-1;PX.Sound.click()};
  if(MODE==='play'&&S){if(v==='MENU'||v==='HUB'){echo();closeTele();openPanel('menu');return}if(v==='TOKENS'||v==='CLOVERS'){echo();tele(`You have ${S.clv|0} clover tokens (earned ${S.stats.clvEarned||0} so far). Secrets +${HUB.SECRET}, notebook goals +${HUB.GOAL}, daily ride +${HUB.DAILY}, Bank ${HUB.BANK_RATE} coins each.`,'q');return}if(v==='BANK'){echo();closeTele();HUB.bank();return}}
  const r=ht(raw);if(MODE==='play'&&(v==='HELP'||v==='?'))tele('MENU · TOKENS · BANK — clover tokens and the hub','q');return r}}
