// ---- CLOVER LINE · the simulation: the train, the clock, passengers, money, weather ----
const SAVE='cloverline-v1';
const CLOCK=new PX.Clock(.34,1/480);// one game day = 8 real minutes
let S=null;
function newState(name){return {v:1,name:name||'Conductor',coins:600,day:0,t:.34,loco:0,livery:'#2e7a4a',cars:['coach','cargo','caboose'],pets:[],food:40,fuel:160,cargo:[],pas:[],at:'clover',seg:null,dir:1,u:0,plan:[],target:null,speed:0,state:'station',visited:{clover:1},secrets:{},seen:{},stats:{},claimed:{},ts:1,pov:'side',dress:0,wx:'clear',wxT:0,autoGo:false,dwell:0,heard:0,lastListen:-1,lookups:0,intro:0,uid:Math.random().toString(36).slice(2,10)}}
function save(){if(S){S.t=CLOCK.t;S.day=CLOCK.day;PX.store.set(SAVE,S)}}
function load(){const s=PX.store.get(SAVE,null);if(!s||s.v!==1)return null;const n=Object.assign(newState(),s);return n}
// ---- dates ----
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MDAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
function dateOf(day){let d=day+90,y=YEAR0;while(d>=365){d-=365;y++}let m=0;while(d>=MDAYS[m]){d-=MDAYS[m];m++}return {y,m,d:d+1}}
function dateLabel(){const D=dateOf(CLOCK.day);const sfx=n=>n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th';return `${MON[D.m]} ${D.d}${sfx(D.d)}, ${D.y}`}
function seasonNow(){return SEASONS[dateOf(CLOCK.day).m]}
// ---- train capacity ----
const locoDef=()=>LOCOS[S.loco];
function seats(){return S.cars.reduce((n,c)=>n+(CARS[c].seats||0),0)}
function crates(){return S.cars.reduce((n,c)=>n+(CARS[c].crates||0),0)}
function hasCar(k){return S.cars.includes(k)}
function carOfPassenger(i){let k=0;for(let ci=0;ci<S.cars.length;ci++){const n=CARS[S.cars[ci]].seats||0;if(i<k+n)return [ci,i-k];k+=n}return [-1,-1]}
// passengers arranged by car and window for drawing
function passengersByCar(){const out=S.cars.map(()=>[]);S.pas.forEach((p,i)=>{const [ci,k]=carOfPassenger(i);if(ci>=0)out[ci][k]=p.look});return out}
// ---- the line ahead ----
function stationNow(){return S.state==='station'?S.at:null}
function nextId(){return S.seg?(S.dir>0?S.seg.b:S.seg.a):null}
function prevId(){return S.seg?(S.dir>0?S.seg.a:S.seg.b):S.at}
function remainingKm(){if(!S.seg)return 0;const end=S.dir>0?S.seg.len:0;return Math.abs(end-S.u)/PXKM}
function setTarget(id){if(id===S.at&&S.state==='station')return false;const from=S.state==='station'?S.at:nextId();const r=route(from,id);if(!r)return false;S.target=id;S.plan=r.path.slice(1);if(S.state!=='station'&&from!==S.at)S.plan=r.path.slice(1);return true}
function depart(){if(S.state!=='station')return;if(!S.plan.length){if(!S.target||S.target===S.at){toast('Pick a destination on the map first.');openPanel('map');return}setTarget(S.target)}
  const nx=S.plan[0];if(!nx)return;if(S.fuel<=0)toast('Out of clover coal! The solar roof will crawl you along slowly.','warn');
  const seg=getSeg(S.at,nx);S.seg={a:seg.a,b:seg.b,len:seg.len};S.dir=seg.a===S.at?1:-1;S.u=S.dir>0?0:seg.len;S.state='moving';S.at=null;S.dwell=0;PLATFORM=[];PX.Sound.whistle();daisyMaybe('depart');save()}
function arrive(id){S.state='station';S.at=id;S.speed=0;S.plan.shift();const first=!S.visited[id];S.visited[id]=1;S.dwell=0;
  if(S.target===id){S.target=null;S.plan=[]}
  PX.Sound.chime();showArrival(id,first);
  // passengers getting off
  let paid=0,count=0;S.pas=S.pas.filter(p=>{if(p.to!==id)return true;const fare=Math.round(p.fare*(.8+p.mood/250));paid+=fare;count++;if(p.vip)S.stats.vips=(S.stats.vips||0)+1;return false});
  if(count){S.coins+=paid;S.stats.delivered=(S.stats.delivered||0)+count;floatText(`+${paid} fares from ${count} passenger${count>1?'s':''}`,'#ffe070');PX.Sound.coin()}
  PLATFORM=waitingAt(id);checkNotebook();save()}
// ---- people waiting on the platform ----
let PLATFORM=[];
function waitingAt(id){const St=ST[id];const r=PX.rng(PX.hash(CLOCK.day*31+id.length*7+(St.lon*100|0))*1e9);const n=[1,3,6][St.z]+Math.floor(r()*(St.z+2));const ids=Object.keys(ST).filter(k=>k!==id);const out=[];
  for(let i=0;i<n;i++){let to=pick2(ids,r());const near=route(id,to);if(!near||near.km>1600&&r()<.6){const nb=(ADJ[id]||[]).map(e=>e.to);to=pick2(nb,r())}const rt=route(id,to);const look=personLook(Math.floor(r()*1e9));
   out.push({id:id+CLOCK.day+'-'+i,look,name:pick2(FIRST,r())+' '+pick2(LAST,r()),job:pick2(JOBS,r()),from:id,to,fare:Math.round(30+rt.km*.32),mood:60,km:rt.km})}
  // sometimes somebody famous is waiting
  const vr=PX.hash(CLOCK.day*7+id.length);if(vr<.18){const V=VIPS[Math.floor(PX.hash(CLOCK.day+id.length*3)*VIPS.length)];if(!S.pas.some(p=>p.vip===V.id)){let to=pick2(ids,r());const rt=route(id,to);out.unshift({id:id+'vip'+CLOCK.day,vip:V.id,look:{seed:V.id,animal:V.sp||null,skin:'#f4d0b0',hair:V.hum?'#5a3020':'#ffffff',hs:1,shirt:V.col,pants:'#3a3a4a'},name:V.n,job:V.job,from:id,to,fare:Math.round(80+rt.km*.5),mood:80,km:rt.km})}}
  return out}
function board(p){if(S.pas.length>=seats()){toast('No free seats. Buy another coach or sleeper car.');return false}S.pas.push(Object.assign({},p));PLATFORM=PLATFORM.filter(q=>q!==p);PX.Sound.click();
  if(p.vip){const V=VIPS.find(v=>v.id===p.vip);say({...V,id:V.id,n:V.n,col:V.col,sp:V.sp,skin:'#f4d0b0',hair:V.hum?'#5a3020':'#c8c8c8',shirt:V.col,headphones:V.id==='marigold',wings:V.fairy,long:V.fairy||V.id==='juniper'},[pick(V.lines)])}
  return true}
// ---- money, supplies and trade ----
function priceOf(g,id){const base=GOODS[g][2];const St=ST[id];let k=1;if(St.make===g)k=.6;else if(St.want===g)k=1.7;return Math.round(base*k*(.92+PX.hash(CLOCK.day+g.length+id.length)*.16))}
function buyGood(g){const id=S.at;if(S.cargo.length>=crates())return toast(crates()?'The cargo car is full.':'You need a cargo car.');const p=priceOf(g,id);if(S.coins<p)return toast('Not enough coins.');S.coins-=p;S.cargo.push({g,paid:p,from:id});PX.Sound.coin()}
function sellGood(i){const c=S.cargo[i];const p=priceOf(c.g,S.at);S.coins+=p;S.cargo.splice(i,1);if(p>c.paid){S.stats.trades=(S.stats.trades||0)+1;floatText(`+${p-c.paid} profit!`,'#7aff9a')}PX.Sound.coin();checkNotebook()}
// ---- weather follows the land and the season ----
function rollWeather(){const bk=S.seg?biomeAt(getSeg(S.seg.a,S.seg.b),S.u):ST[S.at].b;const m=dateOf(CLOCK.day).m;const r=Math.random();const cold=m<=1||m===11,warm=m>=4&&m<=7;
  if(r<.03&&CLOCK.daylight<.3)return 'signal';
  if(['prairie','plains','texas'].includes(bk)){if(warm&&r<.22)return 'storm';if(r<.3)return 'rain';if(m<=4&&r<.36)return 'dust';if(cold&&r<.5)return 'snow';return 'clear'}
  if(['rain','gorge','coast'].includes(bk)){if(r<.12)return 'storm';if(r<.45)return 'rain';if(r<.6)return 'fog';if(cold&&r<.75)return 'snow';return 'clear'}
  if(['mountain','alpine'].includes(bk)){if((cold||m<=3||m>=9)&&r<.5)return 'snow';if(r<.25)return 'rain';if(r<.35)return 'fog';return 'clear'}
  if(['basin','salt','mesa'].includes(bk)){if(r<.12)return 'dust';if(r<.18)return 'storm';return 'clear'}
  if(r<.15)return 'rain';if(r<.22)return 'fog';if(cold&&r<.35)return 'snow';if(warm&&r<.3)return 'storm';return 'clear'}
// ---- tornado on the plains (seen far off) ----
let TORN=null;
function maybeTornado(){if(TORN||S.wx!=='storm'||!S.seg)return;const bk=biomeAt(getSeg(S.seg.a,S.seg.b),S.u);if(!['prairie','plains','texas'].includes(bk))return;if(Math.random()<.004){TORN={x:W+80,life:40,t:0};toast('🌪️ A tornado on the horizon! Daisy grabs your arm.','warn');PX.Sound.thunder();const ks=['prairie','plains'].includes(bk);if(ST[nextId()].s==='KS'||ST[prevId()].s==='KS'){S.seen.tornadoKS=1;checkNotebook()}setTimeout(()=>say(DAISY,['A tornado! In Kansas they see these from miles away. Compare that to Portland, where they almost never happen.']),1500)}}
// ---- the main update ----
let TIPS=[],LIGHTNING=0,NEXTTHUNDER=0,DAISYT=60,RADIOT=0;
function simUpdate(dt){if(!S)return;const ts=S.ts;const d=dt*ts;CLOCK.tick(d);S.t=CLOCK.t;S.day=CLOCK.day;
  // weather changes every few game hours
  S.wxT-=d;if(S.wxT<=0){S.wxT=40+Math.random()*80;const old=S.wx;S.wx=rollWeather();if(S.wx!==old&&S.wx==='storm'){const bk=S.seg?biomeAt(getSeg(S.seg.a,S.seg.b),S.u):'';if(['rain','gorge','coast'].includes(bk)&&(ST[prevId()]||{}).s==='OR'){S.seen.stormOR=1;checkNotebook()}}}
  if(S.wx==='storm'){NEXTTHUNDER-=dt;if(NEXTTHUNDER<=0){NEXTTHUNDER=4+Math.random()*10;LIGHTNING=.7;setTimeout(()=>PX.Sound.thunder(),300+Math.random()*900)}}LIGHTNING=Math.max(0,LIGHTNING-dt*3);
  maybeTornado();if(TORN){TORN.t+=dt;TORN.x-=dt*14;if(TORN.t>TORN.life)TORN=null}
  if(S.state==='moving'){const L=locoDef();let want=L.spd;if(S.fuel<=0)want=18;if(S.wx==='snow')want*=.75;if(BISON>0){want=0;BISON-=d}
    const endU=S.dir>0?S.seg.len:0;const left=Math.abs(endU-S.u);const stopDist=(S.speed*S.speed)/(2*30)*PXKM*.05+40;if(left<stopDist+20)want=Math.min(want,Math.max(6,left/PXKM*120));
    S.speed+=PX.clamp(want-S.speed,-30*d,12*d);const kmh=S.speed;const kmMoved=kmh*(CLOCK.speed*24)*d;let du=kmMoved*PXKM;if(du>left)du=left;S.u+=du*S.dir;
    S.fuel=Math.max(0,S.fuel-kmMoved*.45*(1+S.cars.length*.08));S.stats.km=(S.stats.km||0)+kmMoved;WHEELA+=du/9;
    if(left-du<.5&&S.speed<10)arrive(nextId());
    // smoke from the stack
    if(Math.random()<dt*(8+kmh/10))FX.add({x:HEADX-V0cam()-120+94,y:RAIL-55+2,vx:-kmh*.6-10,vy:-18-Math.random()*10,ax:0,ay:-2,life:2.4,size:3,grow:5,color:'rgba(230,230,236,.8)',alpha:.7});
    if(Math.random()<dt*kmh/40)PX.Sound.chug(kmh);
    // bison on the line out on the plains
    if(BISON<=0&&Math.random()<dt*.0025*ts){const bk=biomeAt(getSeg(S.seg.a,S.seg.b),S.u);if(['plains','prairie'].includes(bk)&&left>3000){BISON=12;toast('A herd of bison is crossing the tracks. The train waits.','warn')}}
    // passengers: tips and moods
    for(const p of S.pas){let m=55;if(hasCar('dining')&&S.food>0)m+=15;if(hasCar('arcade'))m+=8;if(S.pets.length&&hasCar('pets'))m+=8+S.pets.length*2;if(hasCar('sleeper')&&CLOCK.daylight<.3)m+=8;if(hasCar('dome')&&CLOCK.daylight>.5)m+=6;if(S.wx==='storm')m-=5;p.mood+=(m-p.mood)*d*.02}
    if(hasCar('dining')&&S.pas.length)S.food=Math.max(0,S.food-d*.02*S.pas.length);if(hasCar('garden'))S.food=Math.min(200,S.food+d*.03);
    if(S.pas.length&&Math.random()<dt*.05*S.pas.length*ts*.5){const i=Math.floor(Math.random()*S.pas.length);const p=S.pas[i];if(p.mood>45){const [ci]=carOfPassenger(i);TIPS.push({ci,amt:Math.round(2+p.mood/12*(p.vip?3:1)),t:0,y:0,heart:Math.random()<.4})}}
    if(S.pets.length&&hasCar('pets')&&Math.random()<dt*.02*S.pets.length)TIPS.push({ci:S.cars.indexOf('pets'),amt:4+S.pets.length,t:0,y:0,pet:1});
    // the radio car picks up KHUSH at night
    if(hasCar('radio')&&CLOCK.daylight<.2){RADIOT-=dt;if(RADIOT<=0){RADIOT=50;if(S.lastListen!==CLOCK.day&&S.heard<BROADCASTS.length){S.lastListen=CLOCK.day;tele(BROADCASTS[S.heard],'radio');toast('📻 KHUSH 105.9 is on the radio car. Open the telegraph to read it.');S.heard++;if(S.heard>=BROADCASTS.length)found('khush')}}}
    DAISYT-=dt;if(DAISYT<=0){DAISYT=120+Math.random()*120;daisyMaybe('ride')}}
  else if(S.state==='station'){S.speed=0;S.dwell+=dt;if(S.autoGo&&S.dwell>18&&S.plan.length&&!PANEL&&!DLG)depart()}
  for(let i=TIPS.length-1;i>=0;i--){const tp=TIPS[i];tp.t+=dt;if(tp.t>9)TIPS.splice(i,1)}}
let BISON=0,WHEELA=0;
function V0cam(){return VIEW.cam||0}
// ---- Daisy rides with you ----
const DAISYSAYS={depart:['All aboard! I love this part.','Next stop! Did you remember the snacks?','Choo choo! Sorry. I had to.'],
 ride:['It is fun that this game is both of our ideas.','Look at the light on the hills right now. I want to remember this.','Do you think the Ring can see the train from up there?','If we pass another train, wave! Maybe they will share their view with us.','I want a unicorn in the pet car. And a dragon. And a whale. Is a whale too big?','Somebody should write a paragraph on the telegraph. It is good luck.','Portland has rain and Kansas has tornadoes. I love that we get both.'],
 arrive:['We made it!','I could live here.','Let us see who wants a ride.']};
function daisyMaybe(k){if(DLG||PANEL||Math.random()<.35)return;say(DAISY,[pick(DAISYSAYS[k])])}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
// ---- notebook ----
function checkNotebook(){for(const N of NOTEBOOK){if(S.claimed[N.id]||S.ready&&S.ready[N.id])continue;try{if(N.test(S)){S.ready=S.ready||{};S.ready[N.id]=1;toast('📓 Daisy\'s notebook: "'+N.t+'" done! Claim it in the notebook.','good')}}catch(e){}}}
function found(id){if(S.secrets[id])return false;S.secrets[id]=Date.now();toast(`★ Secret found: ${SECRETS[id]} (${Object.keys(S.secrets).length}/${Object.keys(SECRETS).length})`,'sec');PX.Sound.chime();checkNotebook();save();return true}

// ---------------- THE UNDER-ROAD: a wireframe dungeon on a little green screen ----------------
let MODE='play',DG=null,AR=null;const RS=new PX.Surface(320,180);
function mazeOf(n,seed){let s=seed;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};const Wl=[];for(let i=0;i<n*n;i++)Wl.push(15);const seen=new Set([0]);const st=[0];const D=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]];
  while(st.length){const c=st[st.length-1];const x=c%n,y=(c/n)|0;const o=D.filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<n&&ny<n&&!seen.has(ny*n+nx)});if(!o.length){st.pop();continue}const [dx,dy,b,ob]=o[Math.floor(r()*o.length)];const nc=(y+dy)*n+x+dx;Wl[c]&=~b;Wl[nc]&=~ob;seen.add(nc);st.push(nc)}
  for(let i=0;i<n*2;i++){const c=Math.floor(r()*n*n),k=Math.floor(r()*4);const [dx,dy,b,ob]=D[k];const x=c%n+dx,y=((c/n)|0)+dy;if(x>=0&&y>=0&&x<n&&y<n){Wl[c]&=~b;Wl[y*n+x]&=~ob}}return Wl}
const DDX=[0,1,0,-1],DDY=[-1,0,1,0],DBIT=[1,2,4,8];
function dungeonStart(){MODE='dungeon';found('underroad');DG={lv:1,hp:100,x:0,y:0,d:1,n:8,gold:0,mob:[],chest:[],ladder:0};dgLevel(1);tele('THE UNDER-ROAD. MOVE (M), BACK, TURN LEFT/RIGHT/AROUND (TL TR TA), ATTACK (A), LOOK, GET, CLIMB, QUIT. Arrow keys work. Listen to your heart.','q');openTele()}
function dgLevel(lv){const D=DG;D.lv=lv;D.W=mazeOf(D.n,(S.uid.charCodeAt(0)||7)*31+lv*977);D.x=0;D.y=0;D.d=1;D.mob=[];D.chest=[];const cells=[];for(let i=1;i<D.n*D.n;i++)cells.push(i);cells.sort(()=>Math.random()-.5);D.ladder=cells.pop();
  for(let i=0;i<3+lv*2;i++)D.mob.push({c:cells.pop(),k:pick(lv===1?['spider','blob']:lv===2?['blob','knight','bat']:['knight','wraith','bat']),hp:lv*12+5+Math.floor(Math.random()*8)});for(let i=0;i<3;i++)D.chest.push(cells.pop());if(lv===3)D.mob.push({c:D.ladder,k:'listener',hp:90});tele(lv===3?'LEVEL 3. The air hums. Something very large is listening.':'LEVEL '+lv+'.','q')}
const dgCell=(x,y)=>y*DG.n+x,dgOpen=(c,d)=>!(DG.W[c]&DBIT[d]);
function dgFront(){const D=DG;const cc=dgCell(D.x,D.y);if(!dgOpen(cc,D.d))return null;return dgCell(D.x+DDX[D.d],D.y+DDY[D.d])}
function dungeonCmd(c){const D=DG;const v=c[0]||'';let moved=false;
  if(v==='QUIT'||v==='EXIT')return dungeonEnd(false);
  if(['TURN','TL','TR','TA','LEFT','RIGHT','AROUND'].includes(v)){const w=v==='TL'||v==='LEFT'||c[1]==='LEFT'?3:v==='TR'||v==='RIGHT'||c[1]==='RIGHT'?1:2;D.d=(D.d+w)%4}
  else if(['MOVE','M','F','FORWARD','BACK','B'].includes(v)){const back=v==='BACK'||v==='B';const d=back?(D.d+2)%4:D.d;const cc=dgCell(D.x,D.y);if(!dgOpen(cc,d))tele('A wall.','dim');else{const nx=D.x+DDX[d],ny=D.y+DDY[d];if(D.mob.some(m=>m.c===dgCell(nx,ny)))tele('Something is in the way.','warn');else{D.x=nx;D.y=ny;moved=true}}}
  else if(['ATTACK','A','HIT'].includes(v)){const fc=dgFront();const m=fc!=null&&D.mob.find(m=>m.c===fc);if(!m)tele('You swing at the dark.','dim');else{m.hp-=8+Math.floor(Math.random()*11);PX.Sound.tone(150,.08,{type:'sawtooth'});if(m.hp<=0){D.mob=D.mob.filter(x=>x!==m);const g=(10+Math.floor(Math.random()*20))*D.lv;D.gold+=g;tele(m.k==='listener'?'The Listener folds up like a paper lantern. Behind it, a ladder of light.':`The ${m.k} crumbles into green dust. ${g} coins.`,m.k==='listener'?'sec':'good');if(m.k==='listener'){found('listener');D.won=1}}else tele(`You hit the ${m.k}.`)}}
  else if(v==='LOOK'||v==='L'){const fc=dgFront();const m=fc!=null&&D.mob.find(m=>m.c===fc);tele(m?`A ${m.k} blocks the corridor.`:dgCell(D.x,D.y)===D.ladder?'A ladder.':D.chest.includes(dgCell(D.x,D.y))?'An old crate.':'Green stone walls.')}
  else if(v==='GET'||v==='OPEN'){const cc=dgCell(D.x,D.y);if(D.chest.includes(cc)){D.chest=D.chest.filter(x=>x!==cc);const g=40*D.lv;D.gold+=g;tele(`Inside the crate: ${g} old coins.`,'good')}else tele('Nothing here.','dim')}
  else if(v==='CLIMB'||v==='C'){if(D.lv===1&&D.x===0&&D.y===0)return dungeonEnd(false);if(dgCell(D.x,D.y)!==D.ladder)return tele('No ladder here.','dim');if(D.lv<3)dgLevel(D.lv+1);else if(D.won)return dungeonEnd(true);else return tele('The Listener is in the way.','warn')}
  else return tele('MOVE, TURN LEFT, ATTACK, CLIMB, QUIT.','dim');
  if(moved){const cc=dgCell(D.x,D.y);if(D.chest.includes(cc))tele('There is a crate here. GET it.','dim');if(cc===D.ladder)tele('There is a ladder here. CLIMB it.','dim')}
  for(const m of D.mob){const mx=m.c%D.n,my=(m.c/D.n)|0;const dist=Math.abs(mx-D.x)+Math.abs(my-D.y);if(dist===1){D.hp-=3+Math.floor(Math.random()*6)*(m.k==='listener'?2:1)+D.lv;PX.Sound.tone(60,.12,{type:'sine',vol:.3});tele(`The ${m.k} ${pick(['bites','claws','slams into'])} you.`,'warn')}else if(dist<5&&Math.random()<.5&&m.k!=='listener'){for(let d=0;d<4;d++){if(!dgOpen(m.c,d))continue;const nx=mx+DDX[d],ny=my+DDY[d];if(Math.abs(nx-D.x)+Math.abs(ny-D.y)<dist&&!(nx===D.x&&ny===D.y)&&!D.mob.some(o=>o.c===dgCell(nx,ny))){m.c=dgCell(nx,ny);break}}}}
  if(D.hp<=0){tele('Your heart pounds, then stops. You wake with a gasp in your seat. The tape has ended.','warn');dungeonEnd(false)}}
function dungeonEnd(won){const D=DG;MODE='play';if(won){S.coins+=D.gold+500;tele(`You climb the ladder of light and come out through the roof of the train under a sky full of stars. ${D.gold+500} coins came back with you.`,'sec')}else{S.coins+=D.gold;tele(`You climb out. The tape clicks off. ${D.gold} coins came back with you.`)}DG=null;save()}
function drawDungeon(c,T){const D=DG;const s=RS;s.begin(true);s.rect(0,0,320,180,'#000000');const g=PX.Surface.pack('#3aff6a'),g2=PX.Surface.pack('#1a8a3a');const cx=160,cy=82;const sz=k=>[[150,80],[96,52],[60,32],[38,20],[24,12]][k];let cc=dgCell(D.x,D.y);
  for(let k=0;k<4;k++){const [w0,h0]=sz(k),[w1,h1]=sz(k+1);const x=cc%D.n,y=(cc/D.n)|0;const L=(D.d+3)%4,R=(D.d+1)%4;
   if(!dgOpen(cc,L)){s.line(cx-w0,cy-h0,cx-w1,cy-h1,g);s.line(cx-w0,cy+h0,cx-w1,cy+h1,g)}else{s.line(cx-w0,cy-h1,cx-w1,cy-h1,g2);s.line(cx-w0,cy+h1,cx-w1,cy+h1,g2);s.line(cx-w0,cy-h1,cx-w0,cy+h1,g2)}
   if(!dgOpen(cc,R)){s.line(cx+w0,cy-h0,cx+w1,cy-h1,g);s.line(cx+w0,cy+h0,cx+w1,cy+h1,g)}else{s.line(cx+w0,cy-h1,cx+w1,cy-h1,g2);s.line(cx+w0,cy+h1,cx+w1,cy+h1,g2);s.line(cx+w0,cy-h1,cx+w0,cy+h1,g2)}
   s.line(cx-w1,cy-h1,cx-w1,cy+h1,g);s.line(cx+w1,cy-h1,cx+w1,cy+h1,g);
   const m=k>0?D.mob.find(m=>m.c===cc):null;if(m){const col=PX.Surface.pack(m.k==='listener'?'#ff8ad8':'#ff4a4a');const sc=w0/150;if(m.k==='listener'){for(let i=0;i<5;i++)for(let a=0;a<6.28;a+=.06)s.px(cx+Math.cos(a)*(20+i*12)*sc,cy+Math.sin(a)*(20+i*12)*sc*.3,col)}else{s.rect(cx-12*sc,cy-h0*.5,24*sc,h0*1.2,col);s.rect(cx-6*sc,cy-h0*.7,12*sc,14*sc,col)}}
   if(k>0&&cc===D.ladder){s.line(cx-w0*.2,cy-h0,cx-w0*.2,cy+h0,g);s.line(cx+w0*.2,cy-h0,cx+w0*.2,cy+h0,g);for(let r=-h0;r<h0;r+=h0/4)s.line(cx-w0*.2,cy+r,cx+w0*.2,cy+r,g)}
   if(!dgOpen(cc,D.d)){s.rect(cx-w1,cy-h1,w1*2,1,g);s.rect(cx-w1,cy+h1,w1*2,1,g);break}cc=dgCell(x+DDX[D.d],y+DDY[D.d])}
  const rate=1.2-(100-D.hp)/120;const b=(T%rate)/rate;s.circle(14,168,b<.12?6:4,'#ff3a4a');s.end();
  c.fillStyle='#0a0a0a';c.fillRect(0,0,W,H);c.drawImage(RS.cv,0,0,W,H);PX.text(c,`LEVEL ${D.lv}   HEART ${Math.max(0,D.hp)}   COINS ${D.gold}   FACING ${'NESW'[D.d]}`,30,8,{color:'#3aff6a'});scanlines(c);
  [['<','TL'],['^','M'],['>','TR'],['v','BACK'],['Hit','A'],['Get','GET'],['Climb','CLIMB'],['Quit','QUIT']].forEach(([l,cmd],i)=>{const x=W-8-(8-i)*50,y=H-24;PX.button(c,x,y,46,18,l,{color:'#1a5a2a',dark:'#0a2a12',text:'#7aff9a'});GAME.input.zone(x,y,46,18,()=>{tele('> '+cmd,'you');dungeonCmd([cmd])})})}
function scanlines(c){c.fillStyle='rgba(0,0,0,.25)';for(let y=0;y<H;y+=2)c.fillRect(0,y,W,1)}
// ---------------- GLASS BREAKER ----------------
function arcadeStart(){closeTele();MODE='arcade';found('arcade');AR={px:160,bx:160,by:140,vx:70,vy:-90,lives:3,score:0,bricks:[],lv:1,stuck:1};arLevel();toast('GLASS BREAKER: arrows or drag to move, tap or Space to launch, Esc to quit.')}
function arLevel(){AR.bricks=[];const cs=['#ff5a8a','#ffa04a','#ffd84a','#6ae87a','#4ac8ff','#a87aff'];for(let j=0;j<6;j++)for(let i=0;i<14;i++)AR.bricks.push({x:12+i*21,y:24+j*9,c:cs[j],hp:j===0&&AR.lv>1?2:1});AR.stuck=1}
function arcadeTick(dt,inp){const A=AR;if(inp.down('ArrowLeft'))A.px-=220*dt;if(inp.down('ArrowRight'))A.px+=220*dt;if(inp.ptr.down)A.px=inp.ptr.x/2;A.px=PX.clamp(A.px,20,300);if(A.stuck){A.bx=A.px;A.by=150;return}
  A.bx+=A.vx*dt;A.by+=A.vy*dt;if(A.bx<3||A.bx>317){A.vx*=-1;A.bx=PX.clamp(A.bx,3,317)}if(A.by<12)A.vy=Math.abs(A.vy);if(A.by>152&&A.by<158&&Math.abs(A.bx-A.px)<20&&A.vy>0){A.vy=-Math.abs(A.vy)*1.02;A.vx=(A.bx-A.px)*5;PX.Sound.tone(300,.03)}
  if(A.by>180){A.lives--;A.stuck=1;A.vx=70;A.vy=-90;if(A.lives<=0)arcadeEnd()}for(const b of A.bricks)if(b.hp>0&&A.bx>b.x&&A.bx<b.x+19&&A.by>b.y&&A.by<b.y+7){b.hp--;A.vy*=-1;A.score+=10*A.lv;PX.Sound.tone(800+b.y*4,.03);break}if(A.bricks.every(b=>b.hp<=0)){A.lv++;A.vx*=1.1;A.vy*=1.1;arLevel()}}
function drawArcade(c){const A=AR;const s=RS;s.begin(true);s.rect(0,0,320,180,'#0a0a1a');for(const b of A.bricks)if(b.hp>0){s.rect(b.x,b.y,19,7,b.c);s.rect(b.x,b.y,19,1,'#ffffff')}s.rect(A.px-18,154,36,4,'#e8e8ff');s.circle(A.bx|0,A.by|0,2,'#ffffff');s.end();c.drawImage(RS.cv,0,0,W,H);PX.text(c,`SCORE ${A.score}   LIVES ${A.lives}   LEVEL ${A.lv}`,12,8,{color:'#ffffff'});if(A.stuck)PX.text(c,'TAP OR PRESS SPACE',W/2,230,{align:'center',color:'#ffd84a'});scanlines(c);PX.button(c,W-64,6,56,16,'Quit',{color:'#e86a5a',dark:'#8a2a2a'});GAME.input.zone(W-64,6,56,16,()=>arcadeEnd())}
function arcadeEnd(){const A=AR;MODE='play';const coins=Math.floor(A.score/20);S.coins+=coins;toast(`GAME OVER. Score ${A.score}. +${coins} coins in tickets.`);AR=null;save()}

// ---- CLOVER LINE · playing together: trains on the same rails, waves, messages, and swapping views ----
let NET={mode:'offline',peers:()=>[],emit(){},presence(){},on(){}};let FRIEND=null;const PASSED={};
async function netInit(){try{NET=await PX.Net.connect({channel:'cloverline',topics:['chat','wave','spray'],rate:500});}catch(e){console.warn(e)}
  NET.on('chat',m=>{const d=m.data||{};const t=String(d.t||'').slice(0,140);if(!t)return;toast('💬 '+String(d.n||'Someone').slice(0,16)+': '+t);tele((d.n||'Someone')+': '+t,'good')});
  NET.on('wave',m=>{const d=m.data||{};if(d.to&&d.to!==NET.me.id)return;toast('👋 '+String(d.n||'Someone').slice(0,16)+' waved at you!','good');PX.Sound.chime();S.seen.waved=1;checkNotebook()});
  NET.on('spray',m=>{const d=m.data||{};if(!d.n)return;const L=PX.store.get('cloverline-names',[]);L.push(String(d.n).slice(0,16).toUpperCase());PX.store.set('cloverline-names',L.slice(-40))});
  NET.onPeers&&NET.onPeers(ps=>{for(const p of ps){if(!PASSED['j'+p.id]){PASSED['j'+p.id]=1;const n=(p.state&&p.state.n)||'A friend';toast('🌐 '+n+' is on the rails! Their train shows on the map.','good')}}});
  if(NET.mode!=='offline')toast(NET.mode==='room'?'🌐 Online: everyone with this page open shares the rails.':'🌐 Linked with other tabs on this device.','good')}
function myPresence(){const seg=S.seg?[S.seg.a,S.seg.b]:null;return {n:S.name,seg,u:Math.round(S.u),dir:S.dir,at:S.state==='station'?S.at:null,spd:Math.round(S.speed),ts:S.ts,t:+CLOCK.t.toFixed(4),day:CLOCK.day,wx:S.wx,cars:S.cars,loco:S.loco,liv:S.livery,pets:S.pets,pas:passengersByCar().map(a=>a.map(l=>l?l.seed:0)),stamp:Date.now()}}
let PRT=0;function netTick(dt){PRT-=dt;if(PRT<=0&&NET.mode!=='offline'){PRT=.5;NET.presence(myPresence())}}
// estimate where a peer is now (they report every half second)
function peerNow(st){if(!st)return null;const age=Math.min(3,(Date.now()-(st.stamp||Date.now()))/1000);const du=(st.spd||0)*(CLOCK.speed*24)*PXKM*age*(st.ts||1);const len=st.seg?segKm(st.seg[0],st.seg[1])*PXKM:0;return Object.assign({},st,{u:st.seg?PX.clamp(st.u+du*st.dir,0,len):0})}
// other trains on my stretch of track
function peersOnMySeg(){if(!S.seg)return[];const out=[];for(const p of NET.peers()){const st=peerNow(p.state);if(!st||!st.seg)continue;if(segKey(st.seg[0],st.seg[1])!==segKey(S.seg.a,S.seg.b))continue;out.push({id:p.id,name:st.n||'Player',seg:st.seg,u:st.u,dir:st.dir,cars:st.cars,liv:st.liv,loco:st.loco});
   // passing each other
   const d=(st.u-S.u)*S.dir;const k='p'+p.id;const side=d>0?1:-1;if(PASSED[k]!=null&&PASSED[k]!==side&&Math.abs(d)<400){toast(`🚂 You passed ${st.n||'a friend'}'s train! Tap it, or open View > A friend's window.`,'good');PX.Sound.whistle();S.seen.waved=1}PASSED[k]=side}return out}
function watchFriend(P){const p=NET.peers().find(q=>q.id===P.id);if(!p)return toast('They just left the line.');FRIEND=p.id;S.pov='friend';S.seen.friendPov=1;found('povswap');checkNotebook();toast('Now watching '+((p.state&&p.state.n)||'a friend')+"'s window.")}
// a view built from a friend's presence, drawn with the same renderer
function friendView(dt){const p=NET.peers().find(q=>q.id===FRIEND);if(!p){S.pov='side';FRIEND=null;toast('Your friend left the line.');return null}const st=peerNow(p.state);
  if(!st.seg){// they are standing at a station
   const id=st.at||'clover';const e=(ADJ[id]||[])[0];const seg=getSeg(id,e.to);st.seg=[seg.a,seg.b];st.u=seg.a===id?0:seg.len;st.dir=seg.a===id?1:-1}
  const seg=getSeg(st.seg[0],st.seg[1]);const pas=(st.pas||[]).map(a=>a.map(sd=>sd?personLook(sd):null));
  return {seg,u:st.u,dir:st.dir||1,t:st.t||CLOCK.t,wx:st.wx||'clear',season:seasonOf(dateOf(st.day||CLOCK.day).m),cars:st.cars||['coach'],loco:st.loco||0,livery:st.liv||'#2e7a4a',pets:st.pets||[],pas,time:TIME,dt,cam:0,night:1-PX.dayk(st.t||CLOCK.t),wheelA:TIME*((st.spd||0)/12),speed:st.spd,friend:1,friendName:st.n||'Friend',station:st.at,peers:[]}}

// ---- CLOVER LINE · boot and main loop ----
let GAME=null,TIME=0,RINGGLOW=0,TITLE=true;
function stateView(dt){let seg,u=S.u,dir=S.dir;if(S.seg){seg=getSeg(S.seg.a,S.seg.b)}else{const to=S.plan[0]||(ADJ[S.at][0]||{}).to;seg=getSeg(S.at,to);dir=seg.a===S.at?1:-1;u=seg.a===S.at?0:seg.len;S.u=u;S.dir=dir}
  const V={seg,u,dir,t:CLOCK.t,wx:S.wx,season:seasonNow(),cars:S.cars,loco:S.loco,livery:S.livery,pets:S.pets,pas:passengersByCar(),time:TIME,dt,cam:VIEW.cam||0,night:1-CLOCK.daylight,wheelA:WHEELA,speed:S.speed,station:S.state==='station'?S.at:null,platform:S.state==='station'?PLATFORM:null,platformHit:S.state==='station',peers:peersOnMySeg(),ringGlow:RINGGLOW>0?1:0,flash:LIGHTNING,windowCar:S.cars[VIEW.windowIdx||0],windowIdx:VIEW.windowIdx||0};
  V.extraBack=c=>{if(TORN){const tx=Math.round(TORN.x),base=HZ+56;c.globalAlpha=Math.min(1,TORN.t/4,(TORN.life-TORN.t)/4);c.fillStyle='#5a5e6a';for(let y=0;y<150;y++){const w=3+Math.pow(y/150,2)*30;c.fillRect(Math.round(tx-w/2+Math.sin(y*.08+TIME*3)*6),base-y,Math.round(w),1)}c.globalAlpha=1}};
  return V}
function hudLabels(V){if(S.state==='station'){V.fromName=ST[S.at].n;V.toName=S.plan.length?ST[S.plan[0]].n:'';V.kmLeft=S.plan.length?segKm(S.at,S.plan[0]):0;V.prog=0}else{V.fromName=ST[prevId()].n;V.toName=ST[nextId()].n;V.kmLeft=Math.ceil(remainingKm());V.prog=1-remainingKm()/(S.seg.len/PXKM)}V.speedLabel=Math.round(S.speed)+' km/h'}
function frame(dt){const inp=GAME.input;const r=inp.frame();
  // keyboard
  const P=r.pressed;if(MODE==='play'&&!TITLE){if(P[' ']||P.Enter){if(DLG)dlgNext();else if(S.state==='station'&&!PANEL)S.plan.length?depart():openPanel('map')}if(P.Escape){if(PANEL)closePanel();else if(DLG&&!DLG.choices)DLG=null;else if(S.pov!=='side')S.pov='side'}if(P.m||P.M)PANEL==='map'?closePanel():openPanel('map');if(P.t||P.T)openTele();if(P.v||P.V){const k=['side','cab','window'];S.pov=k[(k.indexOf(S.pov)+1)%3];if(S.pov==='window')VIEW.windowIdx=0}if(P['1'])S.ts=1;if(P['2'])S.ts=2;if(P['4'])S.ts=4}
  if(MODE==='dungeon'&&!(TELE.inp.value)){const m={ArrowUp:'M',ArrowDown:'BACK',ArrowLeft:'TL',ArrowRight:'TR'};for(const k in m)if(P[k]){tele('> '+m[k],'you');dungeonCmd([m[k]])}}
  if(MODE==='arcade'){if(P[' ']||r.tap)AR&&(AR.stuck=0);if(P.Escape)arcadeEnd()}
  if(TITLE&&(r.tap||P[' ']||P.Enter))startGame();
  // drag to look along the train
  if(inp.ptr.down&&inp.ptr.drag&&!PANEL&&!DLG&&S&&S.pov==='side'){VIEW.cam=PX.clamp((VIEW.cam||0)+(inp.ptr.lx!=null?inp.ptr.x-inp.ptr.lx:0),-60,Math.max(0,S.cars.length*102-200))}inp.ptr.lx=inp.ptr.down?inp.ptr.x:null;
  if(!inp.ptr.down&&!PANEL&&S&&S.pov==='side'&&S.state==='moving')VIEW.cam*=Math.pow(.2,dt)}
function update(dt){TIME+=dt;if(!S)return;if(RINGGLOW>0)RINGGLOW-=dt;if(MODE==='arcade'&&AR)arcadeTick(dt,GAME.input);if(TITLE){CLOCK.tick(dt*.6);return}simUpdate(dt);FX.update(dt);FX2.update(dt);netTick(dt);
  // fireflies on summer nights, leaves in the fall
  if(CLOCK.daylight<.3&&seasonNow()==='summer'&&Math.random()<dt*3)FX2.add({x:Math.random()*W,y:HZ+40+Math.random()*90,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*6,life:3,size:1,color:'#d8ff7a'});
  if(seasonNow()==='fall'&&S.state==='moving'&&Math.random()<dt*2)FX2.add({x:W+4,y:HZ+Math.random()*120,vx:-60-S.speed,vy:10,ay:6,life:6,size:2,color:pick(['#e8803a','#c8501e','#f0c040']),fade:false});
  if(S.wx==='signal'){RINGGLOW=1}SAVET+=dt;if(SAVET>10){SAVET=0;save()}}
let SAVET=0;
function draw(c,dt){const inp=GAME.input;c.imageSmoothingEnabled=false;
  if(MODE==='dungeon'&&DG){drawDungeon(c,TIME);return}if(MODE==='arcade'&&AR){drawArcade(c);return}
  if(!S){c.fillStyle='#0b0d26';c.fillRect(0,0,W,H);return}
  let V;if(S.pov==='friend'&&FRIEND){V=friendView(dt);if(!V)V=stateView(dt)}else V=stateView(dt);hudLabels(V);VIEW.last=V;
  if(TITLE){V.cam=0;V.cars=['coach','dining','caboose'];renderSide(c,V);drawTitle(c);return}
  if(S.pov==='cab')renderCab(c,V);else if(S.pov==='window')renderWindow(c,V);else renderSide(c,V);
  if(!V.friend&&S.pov==='friend')S.pov='side';
  drawHUD(c,inp,V);drawPanel(c,inp);drawDialog(c,inp)}
function drawTitle(c){const t=TIME;c.fillStyle='rgba(10,12,30,.25)';c.fillRect(0,0,W,H);PX.text(c,'CLOVER LINE',W/2,70,{scale:5,align:'center',color:'#ffffff',outline:'#1e3a26'});PX.text(c,'a little railway across a quiet America',W/2,112,{scale:1,align:'center',color:'#e8ffe8',outline:'#1e3a26'});
  PX.text(c,"from Daisy's ideas and Felix's long road",W/2,126,{font:'tiny',align:'center',color:'#ffe8a0',outline:'#1e3a26'});if(Math.floor(t*2)%2)PX.text(c,PX.store.get(SAVE,null)?'TAP TO CONTINUE':'TAP TO START',W/2,H-60,{scale:2,align:'center',color:'#ffd860',outline:'#2a1a12'});PX.text(c,'FWEDDLE.COM',W/2,H-16,{font:'tiny',align:'center',color:'#ffffff',outline:'#1e1a12'})}
function startGame(){TITLE=false;PX.Sound.unlock();const had=PX.store.get(SAVE,null);S=load()||newState();CLOCK.t=S.t;CLOCK.day=S.day;if(S.state==='station'&&!PLATFORM.length)PLATFORM=waitingAt(S.at);netInit();
  if(!S.intro){S.intro=1;S.state='station';say(CLEM,['Oh! You made it! Welcome to Clover Bay, sweet pea. I\'m Clementine, the mayor.','Forty-one years ago the satellites went quiet and a ring came around the Moon. The trucks stopped, the forests grew back, and people started riding trains again.','The Clover Line is yours now: an engine, a coach, a cargo car and a little red caboose. The rails go all the way to Garden City, Kansas, and beyond.'],null);
    setTimeout(()=>{const q=()=>{if(DLG){setTimeout(q,400);return}say(DAISY,['Hi! I\'m Daisy, your co-conductor!','This whole game is both of our ideas. My pets ride in a pet car, my fairies want new dresses, we trade goods like boats at a harbor, and we get to see a Kansas tornado AND an Oregon thunderstorm.','And Felix put in his long road, a telegraph you type into, and secret words that open secret worlds.','If we pass another train, wave! We can even look out of their window. What should I call you?'],[['Tell her your name',()=>openName()],['Just call me Conductor',()=>{S.name='Conductor';tutorial()}]])};q()},400)}
  else toast('Welcome back, '+S.name+'. '+(S.state==='station'?'You are at '+ST[S.at].n+'.':'The train kept its place on the rails.'),'good')}
function tutorial(){say(DAISY,['Okay, '+S.name+'! Tap Board to pick up passengers. Their fares get paid when they reach their stop.','Then tap Map, pick a town, and press Depart. Coins pop up over the cars while we ride. Tap them!','Tap any car to see who is inside. The eye button changes how you watch the world: side view, the engine cab, or a window seat.'])}
// a small name box (HTML, so phones get a keyboard)
function openName(){const d=document.createElement('div');d.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);z-index:30';d.innerHTML=`<form style="background:#fbecd8;border:4px solid #6a3e22;border-radius:8px;padding:16px;font:16px ui-monospace,monospace;color:#3a2414;display:flex;gap:8px;align-items:center"><label>Your name <input maxlength="16" style="font:inherit;padding:6px;border:2px solid #6a3e22;border-radius:4px;width:150px" value="${S.name==='Conductor'?'':S.name}"></label><button style="font:inherit;padding:6px 12px;background:#6ac46a;border:2px solid #2e6a34;border-radius:4px;color:#fff">OK</button></form>`;GAME.wrap.appendChild(d);const inp=d.querySelector('input');setTimeout(()=>inp.focus(),30);inp.addEventListener('keydown',e=>e.stopPropagation());
  d.querySelector('form').onsubmit=e=>{e.preventDefault();S.name=(inp.value.trim()||'Conductor').slice(0,16);d.remove();save();if(!S.toldTut){S.toldTut=1;tutorial()}else toast('Hello, '+S.name+'!')}}
function boot(){const root=document.getElementById('cl-root');GAME=PX.create({parent:root,width:W,height:H,background:'#0b0d14',integer:false});teleInit(GAME.wrap);
  S=load()||newState();CLOCK.t=S.t||.72;CLOCK.day=S.day||0;if(!load()){CLOCK.t=.74}
  // phones held upright get a gentle hint
  const hint=document.createElement('div');hint.style.cssText='position:absolute;left:8px;right:8px;top:8px;padding:8px 10px;background:rgba(251,236,216,.95);border:3px solid #6a3e22;border-radius:8px;font:13px ui-monospace,monospace;color:#3a2414;z-index:25;text-align:center';hint.textContent='Turn your phone sideways for the full view. (Tap to hide)';hint.onclick=()=>hint.remove();const chk=()=>{hint.style.display=innerHeight>innerWidth*1.1?'block':'none'};chk();addEventListener('resize',chk);GAME.wrap.appendChild(hint);
  addEventListener('pagehide',()=>save());document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  PX.run(GAME,{frame,update,draw,error:e=>toast('Something went wrong: '+e.message,'warn')})}
boot();
