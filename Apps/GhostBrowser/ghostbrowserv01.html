<style>
:root{
  /* FELIX — the theme Meridian wears out of the box, so the file stands on its own; the OS overrides these when it hosts us */
  --sky:#05060f; --ink:#0a0714; --ink2:#150e27; --ink3:#1c1336; --line:#4a3a85; --edge:#6e5b9a; --pop-bg:#150e27f0;
  --fg:#ece8f6; --fg2:#bfb6dc; --fg3:#8f87ad; --accent:#ffd93d; --lime:#9fe6c0; --rose:#ff6bd6; --cyan:#7cf5ff; --particle:#ffffff;
  --btn-bg:#1c1336; --btn-hi:#4a3a85; --btn-fg:#ece8f6; --inp-bg:#0a0714; --inp-edge:#4a3a85; --inp-fg:#ece8f6;
  --toast-fg:#0b0912; --toast-bg:#ffd93d; --b-bg:#000; --panel-h:0px; --sat:0px; --r:2px; --scale:1; --ls:0; --fwt:400; --fit:normal;
  --font-px:'Px Pixeloid Sans','Px Gamedev 16px',monospace; --font-tt:'Px Pixeloid Mono','Px Gamedev 16px',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--fg);
  font-family:var(--font-px);font-size:calc(11px * var(--scale));line-height:1.5;letter-spacing:var(--ls);font-weight:var(--fwt);font-style:var(--fit);
  -webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;touch-action:none;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas.px,img.px{image-rendering:pixelated;image-rendering:crisp-edges}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{-webkit-user-select:text;user-select:text;touch-action:manipulation;-webkit-touch-callout:default}
button{cursor:pointer;background:none;border:0;padding:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--ink)}
::-webkit-scrollbar-track{background:var(--ink)}
.bevel{background:var(--pop-bg);border:1px solid var(--edge);border-radius:var(--r);
  box-shadow:inset 1px 1px 0 var(--line), inset -1px -1px 0 #000, 0 0 0 1px var(--ink3), 4px 4px 0 rgba(0,0,0,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;min-height:26px;border-radius:var(--r);
  background:var(--btn-bg);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--btn-hi),inset -1px -1px 0 #000;
  color:var(--btn-fg);font-family:var(--font-px);font-size:.9em;white-space:nowrap}
.btn:active,.btn.on{box-shadow:inset -1px -1px 0 var(--line),inset 1px 1px 0 #000;background:var(--ink3)}
.btn.acc{color:var(--sky);background:var(--accent);box-shadow:inset 1px 1px 0 #fff8,inset -1px -1px 0 #0006}
.btn[disabled]{opacity:.4;cursor:default}
.inp{background:var(--inp-bg);border:1px solid var(--inp-edge);box-shadow:inset 1px 1px 0 #000;color:var(--inp-fg);border-radius:var(--r);
  padding:6px 8px;font-family:var(--font-tt);font-size:15px;outline:0;min-height:28px;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--accent)}
.bbar .btn.on{color:var(--accent);border-color:var(--accent)}
.bbar .sh{position:relative}
.bbar .sh i{position:absolute;right:-3px;top:-3px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--rose);color:#000;font-size:9px;font-style:normal;display:grid;place-items:center}
.bbar select.inp{font-size:13px;padding:3px 4px;min-height:26px;max-width:120px}
#toast{position:fixed;left:50%;top:calc(var(--panel-h) + var(--sat) + 10px);transform:translateX(-50%);z-index:2000;padding:8px 14px;font-size:.9em;color:var(--toast-fg);background:var(--toast-bg);border:1px solid #000;box-shadow:3px 3px 0 #000;display:none;border-radius:var(--r);max-width:min(92vw,520px)}
.bbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-bottom:1px solid #000;box-shadow:0 1px 0 var(--line);flex:none;align-items:center}
.bbar .inp{flex:1;min-width:120px}
#app{display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative}
[hidden]{display:none!important}
#app>*{min-height:0}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#ctx{position:fixed;z-index:1500;min-width:180px;max-width:min(320px,calc(100vw - 16px));display:none;flex-direction:column;padding:4px;font-size:.9em;max-height:70vh;overflow:auto}
#ctx.open{display:flex}
#ctx .it{display:flex;align-items:center;gap:8px;padding:7px 10px;color:var(--fg);border-radius:var(--r);cursor:pointer}
#ctx .it:hover{background:var(--ink3);color:var(--accent)}
#ctx .it small{display:block;color:var(--fg3);font-size:.8em}
#ctx .ic{width:14px;text-align:center;color:var(--fg2)}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* ── the big switch: ONLINE ⇄ OFFLINE ── */
.power{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 4px;border-radius:14px;border:1px solid #000;background:var(--ink2);box-shadow:inset 1px 1px 0 var(--line);cursor:pointer;font-size:.85em;letter-spacing:1px}
.power .sw{width:34px;height:18px;border-radius:9px;background:var(--ink3);border:1px solid #000;position:relative;transition:background .25s;flex:none}
.power .sw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .2s,background .2s}
.power.online .sw{background:linear-gradient(90deg,#3ddc84,#9fe6c0);box-shadow:0 0 10px #9fe6c088}
.power.online .sw::after{left:18px;background:#073}
.power.offline .sw{background:linear-gradient(90deg,#6e5b9a,#ff6bd6);box-shadow:0 0 12px #ff6bd688}
.power.offline .sw::after{left:2px;background:#fff}
.power b{font-weight:400;color:var(--fg)}
.power.offline b{color:var(--rose)}
.power.online b{color:var(--lime)}
.mini{width:30px;height:16px;border-radius:8px;background:var(--ink3);border:1px solid #000;position:relative;cursor:pointer;flex:none;display:inline-block;vertical-align:middle}
.mini::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:left .15s}
.mini.on{background:var(--accent)}
.mini.on::after{left:16px}
.lbl{display:inline-flex;align-items:center;gap:5px;font-size:.8em;color:var(--fg2);white-space:nowrap}

/* ── ghost bar: the second line that only exists offline ── */
.gbar{display:flex;gap:5px;align-items:center;padding:4px 6px;border-bottom:1px solid var(--line);font-size:.8em;color:var(--fg2);background:color-mix(in srgb,var(--rose) 9%,transparent);flex-wrap:wrap;flex:none}
.gbar canvas{height:18px;width:70px;border:1px solid var(--line);background:#000;flex:none}
.gbar code{font-family:var(--font-tt);font-size:13px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:80px;cursor:pointer}
.gbar .tag{padding:1px 6px;border:1px solid var(--line);color:var(--fg2);letter-spacing:1px;font-size:.9em;white-space:nowrap}
.gbar .tag.syn{color:var(--accent);border-color:#7a6a1f}
.gbar .tag.meas{color:var(--lime);border-color:#2a6a44}
.gbar .ch{font-size:13px;padding:2px 6px;min-height:22px;width:84px}
.gbar input[type=range]{width:120px;accent-color:var(--rose)} .gbar input.depth{width:60px;accent-color:var(--cyan)} .gbar input.shuttle{width:110px;background:linear-gradient(90deg,transparent 48.5%,var(--fg2) 48.5% 51.5%,transparent 51.5%) no-repeat;background-size:100% 60%;background-position:0 50%} .gbar .era-step{padding:2px 6px;min-height:20px;font-size:.8em}
.gbar .era{min-width:46px;text-align:center;color:var(--fg)}
.fxbar{display:flex;gap:6px;align-items:center;padding:4px 6px;border-bottom:1px solid var(--line);font-size:.8em;color:var(--fg2);background:color-mix(in srgb,var(--accent) 8%,transparent);flex:none}
.fxbar canvas{height:18px;width:90px;border:1px solid var(--line);background:#000}
.fxbar code{font-family:var(--font-tt);font-size:13px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

/* ── the stage: static underneath, page on top ── */
.stage{flex:1;position:relative;background:#000;min-height:0;perspective:1100px;perspective-origin:50% 45%;overflow:hidden}
.bfr{transform-origin:50% 50%;backface-visibility:hidden}
.bfr.in-flip{animation:gw-in-flip .75s cubic-bezier(.2,.7,.2,1) both} .bfr.out-flip{animation:gw-out-flip .55s ease-in both;pointer-events:none}
.bfr.in-tunnel{animation:gw-in-tunnel .8s cubic-bezier(.2,.8,.2,1) both} .bfr.out-tunnel{animation:gw-out-tunnel .6s ease-in both;pointer-events:none}
.bfr.in-cube{animation:gw-in-cube .75s cubic-bezier(.2,.7,.2,1) both} .bfr.out-cube{animation:gw-out-cube .6s ease-in both;pointer-events:none}
.bfr.in-zoom{animation:gw-in-zoom .6s ease-out both} .bfr.out-zoom{animation:gw-out-zoom .45s ease-in both;pointer-events:none}
.bfr.in-tilt{animation:gw-in-tilt .7s cubic-bezier(.2,.7,.2,1) both} .bfr.out-tilt{animation:gw-out-tilt .5s ease-in both;pointer-events:none}
.bfr.in-fall{animation:gw-in-fall .7s cubic-bezier(.2,.7,.2,1) both} .bfr.out-fall{animation:gw-out-fall .55s ease-in both;pointer-events:none}
.bfr.in-fade{animation:gw-in-fade .4s both} .bfr.out-fade{animation:gw-out-fade .3s both;pointer-events:none}
@keyframes gw-in-flip{from{transform:rotateY(80deg) translateZ(-120px);opacity:0}to{transform:none;opacity:1}} @keyframes gw-out-flip{to{transform:rotateY(-85deg) translateZ(-200px);opacity:0}}
@keyframes gw-in-tunnel{from{transform:translateZ(-1400px) rotateZ(-6deg);opacity:0}60%{opacity:1}to{transform:none;opacity:1}} @keyframes gw-out-tunnel{to{transform:translateZ(700px) rotateZ(4deg);opacity:0}}
@keyframes gw-in-cube{from{transform:rotateX(-80deg) translateY(-40%) translateZ(-200px);opacity:0}to{transform:none;opacity:1}} @keyframes gw-out-cube{to{transform:rotateX(80deg) translateY(45%) translateZ(-200px);opacity:0}}
@keyframes gw-in-zoom{from{transform:scale(1.35);opacity:0}to{transform:none;opacity:1}} @keyframes gw-out-zoom{to{transform:scale(.6) rotate(-3deg);opacity:0}}
@keyframes gw-in-tilt{from{transform:rotateX(28deg) translateY(90px) translateZ(-160px);opacity:0}to{transform:none;opacity:1}} @keyframes gw-out-tilt{to{transform:rotateX(-20deg) translateY(-60px) translateZ(-200px);opacity:0}}
@keyframes gw-in-fall{from{transform:translateY(-45%) rotateX(24deg);opacity:0}to{transform:none;opacity:1}} @keyframes gw-out-fall{to{transform:translateY(100%) rotateX(-30deg);opacity:0}}
@keyframes gw-in-fade{from{opacity:0}to{opacity:1}} @keyframes gw-out-fade{to{opacity:0}}
.stage canvas.static{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:1}
.stage .nocarrier{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;text-align:center;color:#fff;text-shadow:0 0 8px #000,2px 2px 0 #000;font-size:1.1em;letter-spacing:3px;opacity:0;transition:opacity .4s}
.stage .nocarrier.on{opacity:1}
.stage .nocarrier small{display:block;letter-spacing:1px;color:var(--fg2);font-size:.75em;margin-top:6px}
.bfr{position:absolute;inset:0;border:0;background:var(--b-bg);width:100%;height:100%;z-index:3;transition:opacity .35s}
.bfr.tuning{opacity:0}
.stage .crt{position:absolute;inset:0;z-index:4;pointer-events:none;display:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 0%,#ffffff06,transparent 60%)}
.stage.crt .crt{display:block}
.bhome{position:absolute;inset:0;z-index:3;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;color:var(--fg2);overflow:auto;background:var(--sky)}
.bhome .links{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.bhome h1{font-weight:400;font-size:1.6em;letter-spacing:4px;margin:0;color:var(--fg)}
.bhome h1 em{font-style:normal;color:var(--rose)}
.bhome .hsearch{display:flex;gap:6px;width:min(100%,520px)}
.bhome .hsearch .inp{flex:1}
.bhome .recent{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px}
.bhome .recent .btn{font-size:.8em}
.bhome .recent .btn img{width:12px;height:12px;image-rendering:pixelated}
.bhome small{color:var(--fg3);max-width:460px;line-height:1.7}
.bhome .hcanvas{width:min(100%,520px);height:64px;border:1px solid var(--line);image-rendering:pixelated;background:#000}

/* ── popovers: æther, shields, export, chest ── */
.pop{position:absolute;right:6px;top:36px;width:300px;max-width:calc(100% - 12px);z-index:30;padding:10px 12px;display:none;flex-direction:column;gap:8px;font-size:.85em;color:var(--fg2);max-height:calc(100% - 48px);overflow:auto}
.pop.open{display:flex;animation:pin .18s}
@keyframes pin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.pop h6{margin:6px 0 0;font-weight:400;font-size:.75em;letter-spacing:2px;color:var(--fg3)}
.pop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dotted var(--line)}
.pop .row select{max-width:130px}
.pop .big{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.pop .sw{width:64px;height:32px;border-radius:16px;background:var(--ink3);border:1px solid #000;position:relative;cursor:pointer;transition:background .2s}
.pop .sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.pop .sw.on{background:linear-gradient(90deg,#ff5c7a,#ff9f43);box-shadow:0 0 12px #ff9f4388}
.pop .sw.on::after{left:35px}
.pop .stat{display:flex;gap:8px;align-items:center;padding:8px;background:var(--ink2);border:1px solid #000}
.pop .stat b{font-size:1.8em;font-weight:400;color:var(--fg)}
.pop small{color:var(--fg3);line-height:1.6}
.pop .meas{font-family:var(--font-tt);font-size:12px;color:var(--lime);display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.pop .meas b{font-weight:400;color:var(--fg3);letter-spacing:1px;font-family:var(--font-px);font-size:9px}
.nets{display:flex;flex-direction:column;gap:3px}
.net{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;padding:5px 6px;border:1px solid transparent;cursor:pointer;color:var(--fg)}
.net:hover{border-color:var(--line);background:var(--ink2)}
.net.on{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 14%,transparent)}
.net .bars{display:inline-flex;gap:1px;align-items:flex-end;height:12px}
.net .bars i{display:block;width:3px;background:var(--fg3)}
.net .bars i.lit{background:var(--lime)}
.net small{display:block;color:var(--fg3);font-size:.8em}
.net .lock{color:var(--accent)}
.pop .scanline{height:4px;background:linear-gradient(90deg,transparent,var(--rose),transparent);background-size:40% 100%;animation:scan 1.2s linear infinite;opacity:0;transition:opacity .3s}
.pop .scanline.on{opacity:1}
@keyframes scan{from{background-position:-40% 0}to{background-position:140% 0}}
.chestlist{display:flex;flex-direction:column;gap:4px}
.chestlist .it{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border:1px solid var(--line);background:var(--ink2);color:var(--fg)}
.chestlist .it img{width:16px;height:16px;image-rendering:pixelated}
.chestlist .it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.chestlist .it small{display:block;color:var(--fg3);font-size:.8em}
.chestlist .it button{color:var(--fg3)}
.chestlist .it button:hover{color:var(--rose)}
.about{padding:16px;overflow:auto;flex:1;color:var(--fg2);font-size:10px;line-height:1.8}
.about b{color:var(--accent);font-weight:400}
kbd{font-family:var(--font-px);font-size:9px;background:var(--ink2);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--line);padding:1px 5px}
@media (max-width:640px){ .gbar input[type=range]{width:80px} .pop{right:3px;width:calc(100% - 6px)} .bbar .lbl span.t{display:none} }
</style>

<body>
<div id="app" class="body"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MERIDIAN NATIVE APP RUNTIME — the thin floor a Meridian app stands on when
   it lives in its own file. The OS frames the file (same origin, srcdoc), sends
   one OPEN message with what the app needs (the argument it was opened with,
   a snapshot of the virtual disk, the portal list, the downloads, the theme)
   and the app talks back over postMessage: save this photo, write this file,
   open that tile, I'm recording. Storage is shared (same IndexedDB, same
   localStorage) so nothing here is copied — only mirrored.
   ═══════════════════════════════════════════════════════════════════════════ */
'use strict';
const APP_ID='ghostbrowser';
let M_VERSION='2.0.0', HOME='/home/felix', USER={uname:'felix',host:'meridian',name:'Felix'}, SITE='https://www.fweddle.com/';
const HOSTED=window.parent!==window;

/* ── the bridge ── */
const M=(()=>{ const q={}; let seq=0; const handlers={};
  const post=(action,data,transfer)=>{ if(!HOSTED)return; try{ parent.postMessage(Object.assign({meridian:true,native:true,app:APP_ID,action},data||{}),'*',transfer||[]); }catch(e){ console.warn('bridge',e); } };
  const call=(action,data,transfer)=>new Promise((res,rej)=>{ if(!HOSTED)return rej(new Error('not inside Meridian')); const rid=++seq; q[rid]={res,rej}; post(action,Object.assign({rid},data||{}),transfer); setTimeout(()=>{ if(q[rid]){ q[rid].rej(new Error('Meridian did not answer: '+action)); delete q[rid]; } },30000); });
  addEventListener('message',e=>{ const d=e.data; if(!d||!d.meridian)return;
    if(d.reply!==undefined){ const p=q[d.rid]; if(p){ delete q[d.rid]; d.error?p.rej(new Error(d.error)):p.res(d.result); } return; }
    if(d.theme){ applyTheme(d.theme); return; }
    (handlers[d.action]||[]).forEach(f=>{ try{ f(d); }catch(err){ console.error(err); } }); });
  const on=(a,f)=>{ (handlers[a]=handlers[a]||[]).push(f); };
  return {post,call,on,launch:(app,arg)=>post('launch',{app,payload:arg}),title:t=>post('title',{title:t}),toast:m=>post('toast',{msg:m}),close:()=>post('close'),split:()=>post('split')};
})();

/* ── theme: the OS pushes its palette; the same variable names the OS uses ── */
function applyTheme(t){ if(!t||!t.vars)return; const R=document.documentElement.style; Object.entries(t.vars).forEach(([k,v])=>{ if(v)R.setProperty('--'+k,v); });
  if(t.vars.fg2&&!t.vars.fg3)R.setProperty('--fg3',`color-mix(in srgb,${t.vars.fg2} 60%,${t.vars.sky||'#000'})`);
  if(t.vars.accent&&!t.vars.lime)R.setProperty('--lime',t.vars.accent); if(t.vars.accent&&!t.vars.particle)R.setProperty('--particle',t.vars.accent);
  if(t.font)R.setProperty('--font-px',t.font); }
const cssVar=(n)=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ── the little things every tile leans on ── */
const toast=(m)=>{ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); } t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2200); };
const notify=(title,body)=>toast(body?title+' · '+body:title);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const Audio=(()=>{ let ctx; return { blip(f,d){ try{ if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(),g=ctx.createGain(); o.type='square'; o.frequency.value=f||660; g.gain.value=.05; o.connect(g); g.connect(ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(d||.1)); o.stop(ctx.currentTime+(d||.1)+.02); }catch(e){} }, get vol(){ return .4; }, set(){} }; })();
const SFX={on:false,ui(){},set(){}};
const pickFile=(accept)=>new Promise(res=>{ let f=document.getElementById('filePick'); if(!f){ f=document.createElement('input'); f.type='file'; f.id='filePick'; f.hidden=true; document.body.appendChild(f); } f.accept=accept||''; f.value=''; f.onchange=()=>res(f.files[0]||null); f.click(); });
const Build={ dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); } };
const Resources={ fmt(n){ n=+n||0; return n>1073741824?(n/1073741824).toFixed(2)+' GB':n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024|0)+' KB':n+' B'; } };
const renderAll=()=>{}; const world=document.body;
/* IndexedDB blob store — the same database the OS uses (same origin) */
const Store=(()=>{ let dbp; const db=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('meridian',1);r.onupgradeneeded=()=>r.result.createObjectStore('apps');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=async(mode,fn)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('apps',mode);const rq=fn(t.objectStore('apps'));rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});};
  return {get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k)),keys:()=>tx('readonly',s=>s.getAllKeys())}; })();

/* ── the virtual disk, mirrored: reads come from the snapshot, writes go home ── */
const FS=(()=>{ let root={}; let meta={};
  const isDir=n=>!!n&&typeof n==='object';
  const norm=(cwd,p)=>{ if(!p)p='.'; if(p[0]==='~')p=HOME+p.slice(1); const parts=(p[0]==='/'?p:cwd+'/'+p).split('/'); const out=[]; for(const s of parts){ if(!s||s==='.')continue; if(s==='..')out.pop(); else out.push(s);} return '/'+out.join('/'); };
  const get=(path)=>{ let n=root; for(const s of String(path||'').split('/').filter(Boolean)){ if(n&&typeof n==='object'&&s in n)n=n[s]; else return undefined; } return n; };
  const parent=(path)=>{ const parts=path.split('/').filter(Boolean); const name=parts.pop(); return [get('/'+parts.join('/')),name]; };
  const bytes=n=>isDir(n)?Object.values(n).reduce((a,c)=>a+bytes(c),0):new TextEncoder().encode(String(n)).length;
  const home=()=>M.post('fs',{op:'sync'});
  return {norm,get,isDir,bytes, _load(r,m){ root=r||{}; meta=m||{}; },
    write(path,text){ const [p,n]=parent(path); if(!p||typeof p!=='object')return false; p[n]=String(text); meta[path]=Date.now(); M.post('fs',{op:'write',args:[path,String(text)]}); return true; },
    mtime(path){ return meta[path]||0; },
    put(path,node){ const [p,n]=parent(path); if(!p||typeof p!=='object')return false; p[n]=node; M.post('fs',{op:'put',args:[path,node]}); return true; },
    mkdir(path){ const [p,n]=parent(path); if(!p||typeof p!=='object'||n in p)return false; p[n]={}; M.post('fs',{op:'mkdir',args:[path]}); return true; },
    mkdirp(path){ const parts=path.split('/').filter(Boolean); let cur=''; for(const s of parts){ cur+='/'+s; const n=get(cur); if(n===undefined){ const [q,nm]=parent(cur); q[nm]={}; } else if(!isDir(n))return false; } M.post('fs',{op:'mkdirp',args:[path]}); return true; },
    rm(path){ const [p,n]=parent(path); if(!p||!(n in p))return false; delete p[n]; M.post('fs',{op:'rm',args:[path]}); return true; },
    rename(path,name){ const [p,n]=parent(path); if(!p||!(n in p)||!name||name.includes('/')||name in p)return false; p[name]=p[n]; delete p[n]; M.post('fs',{op:'rename',args:[path,name]}); return true; },
    unique(path){ const i=path.lastIndexOf('/'); const dir=path.slice(0,i),name=path.slice(i+1); const m=name.match(/^(.*?)(?: \((\d+)\))?(\.[^.]*)?$/); let k=(+m[2]||1)+1,c; do{ c=dir+'/'+m[1]+' ('+k+')'+(m[3]||''); k++; }while(get(c)!==undefined); return c; } };
})();

/* ── the portals' media, mirrored the same way ── */
let _images=[],_sounds=[],_downloads=[],_portals=[];
const Images={ all:()=>_images, async add(file,kind){ const it=await M.call('images-add',{file,kind}); if(it){ _images.push(it); } return it; }, get:id=>M.call('images-get',{id}), async remove(id){ await M.call('images-remove',{id}); _images=_images.filter(i=>i.id!==id); } };
const Videos={ async add(blob,meta){ const it=await M.call('videos-add',{blob,meta}); if(it)_images.push(it); return it; }, async url(id){ const b=await Store.get('vid:'+id); return b?URL.createObjectURL(b):null; }, remove:id=>M.call('videos-remove',{id}), addFile:f=>M.call('videos-addfile',{file:f}) };
const Sounds={ all:()=>_sounds, byId:id=>_sounds.find(x=>x.id===id), async addBlob(blob,name,sub,o){ const it=await M.call('sounds-add',{blob,name,sub,o:o||{}}); if(it)_sounds.push(it); return it; }, addFile:(f,sub)=>M.call('sounds-addfile',{file:f,sub}) };
const Downloads={ all:()=>_downloads, byId:id=>_downloads.find(x=>x.id===id), files:dir=>_downloads.filter(x=>(x.path||'')===(dir||'')), ext:n=>(String(n).split('.').pop()||'').toLowerCase(), async add(blob,name,dir,o){ const it=await M.call('downloads-add',{blob,name,dir:dir||'',o:o||{}}); if(it)_downloads.push(it); return it; }, async url(id){ const b=await Store.get('dl:'+id); return b?URL.createObjectURL(b):null; } };
const Portals={ all:()=>_portals, byId:id=>_portals.find(p=>p.id===id), dir:p=>p&&p.dir };

/* ── tiles: opening another app means asking the OS to ── */

/* ═══════════════════════════════════════════════════════════════════════════
   SEED — one seed grows everything (ꟻXplore lineage: goatpad's mulberry32 and
   FNV-1a, and Equation Lab's counting rng: every choice adds log10(options) to
   R.bits, so a page can say honestly how many pages it could have been).
   ═══════════════════════════════════════════════════════════════════════════ */
const SEED=(()=>{

  /* two FNV lanes with different salts → 16 hex: enough for a payload id that never collides in one lifetime of browsing */
  const hash16=s=>hex8(hashSeed(s))+hex8(hashSeed('\u0001'+s+'\u0002'));
  const CT=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();

    int(lo,hi){ const n=hi-lo+1; R.bits+=Math.log10(Math.max(1,n)); return lo+Math.floor(r()*n); },
    float(lo,hi,step){ step=step||.01; const n=Math.max(1,Math.round((hi-lo)/step)); R.bits+=Math.log10(n+1); return +(lo+Math.floor(r()*(n+1))*step).toFixed(Math.max(0,Math.ceil(-Math.log10(step)-1e-9))); },

  const FWZ='fwZ:';

/* ═══════════════════════════════════════════════════════════════════════════
   NEARBY — ⧉ MEASURED. The things a browser can actually reach without joining
   anything: the gateway that answers on the LAN, the printer and the NAS that
   speak HTTP, the dev server and the local mind on this machine, a Bluetooth
   device that is advertising its name, the room's own sound. None of it is a
   Wi-Fi scan (a browser has no radio); all of it is real, timed, and kept apart
   from the dreamt list. Each source is a lens: pick one and its measurement
   seeds the channel, so pages are tuned THROUGH it.
   ═══════════════════════════════════════════════════════════════════════════ */
const NEARBY=(()=>{
  const GATEWAYS=['192.168.0.1','192.168.1.1','192.168.1.254','192.168.0.254','192.168.2.1','192.168.4.1','192.168.8.1','192.168.10.1','192.168.50.1','192.168.100.1','192.168.178.1','10.0.0.1','10.0.0.138','10.1.1.1','172.16.0.1','10.0.1.1'];

  const LOCAL=[3000,5000,5173,8000,8080,8123,8096,8188,8888,9000,11434,1234,7860,32400,4200,631,1883,8443,9090,3001,8081,1337,2375,4000,5500,8765];
  const KIND={631:'printer',9100:'printer',32400:'mediaserver',8096:'mediaserver',8123:'homehub',1883:'homehub',5000:'nas',5001:'nas',11434:'localmind',1234:'localmind',7860:'localmind',8188:'localmind',8888:'notebook',9090:'metrics',2375:'docker',3000:'devserver',3001:'devserver',5173:'devserver',8000:'devserver',8080:'devserver',8081:'devserver',4200:'devserver',4000:'devserver',5500:'devserver',8765:'devserver',1337:'devserver',8443:'router'};
  const NAMEKIND=[[/printer|brother|hp\.|octopi/,'printer'],[/homeassistant|pi\.hole|unifi/,'homehub'],[/nas|synology/,'nas'],[/plex|jellyfin/,'mediaserver'],[/ghost|meridian/,'fweddle'],[/.*/,'router']];
  let list=[],cur=null,scanning=false,progress=0,note='',listeners=[]; const key='gb.nearby';
  try{ const saved=JSON.parse(localStorage.getItem(key)||'[]'); saved.forEach(s=>{ if(s.kind==='bluetooth'||s.kind==='ear')list.push(s); }); }catch(e){}
  const emit=()=>listeners.forEach(f=>{ try{ f(); }catch(e){} });
  const save=()=>{ try{ localStorage.setItem(key,JSON.stringify(list.filter(s=>s.kind==='bluetooth'||s.kind==='ear').slice(0,20))); }catch(e){} };
  function add(src){ src.seed=src.seed||SEED.hashSeed(src.id); src.ts=Date.now(); list=list.filter(s=>s.id!==src.id); list.push(src); save(); emit(); return src; }
  function kindOf(host,port){ if(KIND[port])return KIND[port]; for(const [re,k] of NAMEKIND)if(re.test(host))return k; return 'router'; }
  /* one probe: resolved opaque = something spoke HTTP there; a slow refusal = a host answered the door; an abort = nobody */
  async function probe(url,timeout){ const t0=performance.now(); const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),timeout); try{ await fetch(url,{mode:'no-cors',cache:'no-store',credentials:'omit',signal:ctl.signal}); return {state:'service',ms:Math.round(performance.now()-t0)}; }catch(e){ const dt=performance.now()-t0; if(e&&e.name==='AbortError')return {state:'none',ms:Math.round(dt)}; return {state:dt<8?'blocked':dt<700?'alive':'none',ms:Math.round(dt)}; } finally{ clearTimeout(tm); } }
  async function pool(tasks,n){ let i=0; const out=[]; await Promise.all(Array.from({length:n},async()=>{ while(i<tasks.length){ const k=i++; out[k]=await tasks[k](); progress=out.filter(Boolean).length/tasks.length; emit(); } })); return out; }
  async function scan(){ if(scanning)return list; scanning=true; progress=0; note=''; emit(); list=list.filter(s=>s.kind==='bluetooth'||s.kind==='ear');
    /* calibration: a dead address must take its time. if it is refused instantly, this origin cannot reach private networks at all */
    const cal=await probe('http://192.0.2.1/',1500); const lanBlocked=cal.state==='blocked'; const proxied=cal.state==='service'||cal.state==='alive';
    const targets=[]; if(!lanBlocked&&!proxied){ GATEWAYS.forEach(h=>targets.push({host:h,port:80,url:'http://'+h+'/'})); NAMES.forEach(h=>targets.push({host:h,port:80,url:'http://'+h+'/'})); } LOCAL.forEach(p=>targets.push({host:'localhost',port:p,url:'http://localhost:'+p+'/'}));

    const alive=res.filter(r=>r.state==='service'||(r.state==='alive'&&r.host!=='localhost'));
