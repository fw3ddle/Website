<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--fg);
  font-family:var(--font-px);font-size:calc(11px * var(--scale));line-height:1.5;letter-spacing:var(--ls);font-weight:var(--fwt);font-style:var(--fit);
  -webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;touch-action:none;

button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{-webkit-user-select:text;user-select:text;touch-action:manipulation;-webkit-touch-callout:default}
button{cursor:pointer;background:none;border:0;padding:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--ink)}
::-webkit-scrollbar-track{background:var(--ink)}
.bevel{background:var(--pop-bg);border:1px solid var(--edge);border-radius:var(--r);
  box-shadow:inset 1px 1px 0 var(--line), inset -1px -1px 0 #000, 0 0 0 1px var(--ink3), 4px 4px 0 rgba(0,0,0,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;min-height:26px;border-radius:var(--r);
  background:var(--btn-bg);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--btn-hi),inset -1px -1px 0 #000;
  color:var(--btn-fg);font-family:var(--font-px);font-size:.9em}
.btn:active,.btn.on{box-shadow:inset -1px -1px 0 var(--line),inset 1px 1px 0 #000;background:var(--ink3)}
.btn.acc{color:var(--sky);background:var(--accent);box-shadow:inset 1px 1px 0 #fff8,inset -1px -1px 0 #0006}
.inp{background:var(--inp-bg);border:1px solid var(--inp-edge);box-shadow:inset 1px 1px 0 #000;color:var(--inp-fg);border-radius:var(--r);
  padding:6px 8px;font-family:var(--font-tt);font-size:17px;outline:0;min-height:28px;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--accent)}

.viewer video{max-width:100%;max-height:calc(100% - 40px);background:#000}
.viewer .vbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:6px 10px;background:#000c;color:#ccc;font-size:.8em}

.viewer{position:relative}

.viewer.player canvas.big{width:min(100%,640px);height:160px;image-rendering:pixelated;border:1px solid var(--line)}

.bbar .inp{flex:1;min-width:0}

.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

#ctx{position:fixed;z-index:1500;min-width:180px;max-width:min(320px,calc(100vw - 16px));display:none;flex-direction:column;padding:4px;font-size:.9em;max-height:70vh;overflow:auto}
#ctx.open{display:flex}
#ctx .it{display:flex;align-items:center;gap:8px;padding:7px 10px;color:var(--fg);border-radius:var(--r);cursor:pointer}
#ctx .it:hover{background:var(--ink3);color:var(--accent)}
#ctx .it small{display:block;color:var(--fg3);font-size:.8em}
#ctx .ic{width:14px;text-align:center;color:var(--fg2)}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.dict{flex:1;display:flex;flex-direction:column}

<body>
<div id="app" class="body"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MERIDIAN NATIVE APP RUNTIME — the thin floor a Meridian app stands on when
   it lives in its own file. The OS frames the file (same origin, srcdoc), sends
   one OPEN message with what the app needs (the argument it was opened with,
   a snapshot of the virtual disk, the portal list, the downloads, the theme)
   and the app talks back over postMessage: save this photo, write this file,
   open that tile, I'm recording. Storage is shared (same IndexedDB, same
   localStorage) so nothing here is copied — only mirrored.
   ═══════════════════════════════════════════════════════════════════════════ */
'use strict';
const APP_ID='fweddler';
let M_VERSION='1.7.2', HOME='/home/felix', USER={uname:'felix',host:'meridian',name:'Felix'}, SITE='https://www.fweddle.com/';
const HOSTED=window.parent!==window;

/* ── the bridge ── */
const M=(()=>{ const q={}; let seq=0; const handlers={};
  const post=(action,data,transfer)=>{ if(!HOSTED)return; try{ parent.postMessage(Object.assign({meridian:true,native:true,app:APP_ID,action},data||{}),'*',transfer||[]); }catch(e){ console.warn('bridge',e); } };
  const call=(action,data,transfer)=>new Promise((res,rej)=>{ if(!HOSTED)return rej(new Error('not inside Meridian')); const rid=++seq; q[rid]={res,rej}; post(action,Object.assign({rid},data||{}),transfer); setTimeout(()=>{ if(q[rid]){ q[rid].rej(new Error('Meridian did not answer: '+action)); delete q[rid]; } },30000); });
  addEventListener('message',e=>{ const d=e.data; if(!d||!d.meridian)return;
    if(d.reply!==undefined){ const p=q[d.rid]; if(p){ delete q[d.rid]; d.error?p.rej(new Error(d.error)):p.res(d.result); } return; }
    if(d.theme){ applyTheme(d.theme); return; }
    (handlers[d.action]||[]).forEach(f=>{ try{ f(d); }catch(err){ console.error(err); } }); });
  const on=(a,f)=>{ (handlers[a]=handlers[a]||[]).push(f); };
  return {post,call,on,launch:(app,arg)=>post('launch',{app,payload:arg}),title:t=>post('title',{title:t}),toast:m=>post('toast',{msg:m}),close:()=>post('close'),split:()=>post('split')};
})();

/* ── theme: the OS pushes its palette; the same variable names the OS uses ── */
function applyTheme(t){ if(!t||!t.vars)return; const R=document.documentElement.style; Object.entries(t.vars).forEach(([k,v])=>{ if(v)R.setProperty('--'+k,v); });
  if(t.vars.fg2&&!t.vars.fg3)R.setProperty('--fg3',`color-mix(in srgb,${t.vars.fg2} 60%,${t.vars.sky||'#000'})`);
  if(t.vars.accent&&!t.vars.lime)R.setProperty('--lime',t.vars.accent); if(t.vars.accent&&!t.vars.particle)R.setProperty('--particle',t.vars.accent);
  if(t.font)R.setProperty('--font-px',t.font); }
const cssVar=(n)=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ── the little things every tile leans on ── */
const toast=(m)=>{ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); } t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2200); };
const notify=(title,body)=>toast(body?title+' · '+body:title);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const Audio=(()=>{ let ctx; return { blip(f,d){ try{ if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(),g=ctx.createGain(); o.type='square'; o.frequency.value=f||660; g.gain.value=.05; o.connect(g); g.connect(ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(d||.1)); o.stop(ctx.currentTime+(d||.1)+.02); }catch(e){} }, get vol(){ return .4; }, set(){} }; })();
const SFX={on:false,ui(){},set(){}};
const pickFile=(accept)=>new Promise(res=>{ let f=document.getElementById('filePick'); if(!f){ f=document.createElement('input'); f.type='file'; f.id='filePick'; f.hidden=true; document.body.appendChild(f); } f.accept=accept||''; f.value=''; f.onchange=()=>res(f.files[0]||null); f.click(); });
const Build={ dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); } };
const Resources={ fmt(n){ n=+n||0; return n>1073741824?(n/1073741824).toFixed(2)+' GB':n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024|0)+' KB':n+' B'; } };
const renderAll=()=>{}; const world=document.body;
/* IndexedDB blob store — the same database the OS uses (same origin) */
const Store=(()=>{ let dbp; const db=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('meridian',1);r.onupgradeneeded=()=>r.result.createObjectStore('apps');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=async(mode,fn)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('apps',mode);const rq=fn(t.objectStore('apps'));rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});};
  return {get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k)),keys:()=>tx('readonly',s=>s.getAllKeys())}; })();

/* ── the virtual disk, mirrored: reads come from the snapshot, writes go home ── */
const FS=(()=>{ let root={}; let meta={};
  const isDir=n=>!!n&&typeof n==='object';
  const norm=(cwd,p)=>{ if(!p)p='.'; if(p[0]==='~')p=HOME+p.slice(1); const parts=(p[0]==='/'?p:cwd+'/'+p).split('/'); const out=[]; for(const s of parts){ if(!s||s==='.')continue; if(s==='..')out.pop(); else out.push(s);} return '/'+out.join('/'); };
  const get=(path)=>{ let n=root; for(const s of String(path||'').split('/').filter(Boolean)){ if(n&&typeof n==='object'&&s in n)n=n[s]; else return undefined; } return n; };
  const parent=(path)=>{ const parts=path.split('/').filter(Boolean); const name=parts.pop(); return [get('/'+parts.join('/')),name]; };
  const bytes=n=>isDir(n)?Object.values(n).reduce((a,c)=>a+bytes(c),0):new TextEncoder().encode(String(n)).length;
  const home=()=>M.post('fs',{op:'sync'});
  return {norm,get,isDir,bytes, _load(r,m){ root=r||{}; meta=m||{}; },
    write(path,text){ const [p,n]=parent(path); if(!p||typeof p!=='object')return false; p[n]=String(text); meta[path]=Date.now(); M.post('fs',{op:'write',args:[path,String(text)]}); return true; },
    mtime(path){ return meta[path]||0; },
    put(path,node){ const [p,n]=parent(path); if(!p||typeof p!=='object')return false; p[n]=node; M.post('fs',{op:'put',args:[path,node]}); return true; },
    mkdir(path){ const [p,n]=parent(path); if(!p||typeof p!=='object'||n in p)return false; p[n]={}; M.post('fs',{op:'mkdir',args:[path]}); return true; },
    mkdirp(path){ const parts=path.split('/').filter(Boolean); let cur=''; for(const s of parts){ cur+='/'+s; const n=get(cur); if(n===undefined){ const [q,nm]=parent(cur); q[nm]={}; } else if(!isDir(n))return false; } M.post('fs',{op:'mkdirp',args:[path]}); return true; },
    rm(path){ const [p,n]=parent(path); if(!p||!(n in p))return false; delete p[n]; M.post('fs',{op:'rm',args:[path]}); return true; },
    rename(path,name){ const [p,n]=parent(path); if(!p||!(n in p)||!name||name.includes('/')||name in p)return false; p[name]=p[n]; delete p[n]; M.post('fs',{op:'rename',args:[path,name]}); return true; },
    unique(path){ const i=path.lastIndexOf('/'); const dir=path.slice(0,i),name=path.slice(i+1); const m=name.match(/^(.*?)(?: \((\d+)\))?(\.[^.]*)?$/); let k=(+m[2]||1)+1,c; do{ c=dir+'/'+m[1]+' ('+k+')'+(m[3]||''); k++; }while(get(c)!==undefined); return c; } };
})();

/* ── the portals' media, mirrored the same way ── */
let _images=[],_sounds=[],_downloads=[],_portals=[];
const Images={ all:()=>_images, async add(file,kind){ const it=await M.call('images-add',{file,kind}); if(it){ _images.push(it); } return it; }, get:id=>M.call('images-get',{id}), async remove(id){ await M.call('images-remove',{id}); _images=_images.filter(i=>i.id!==id); } };
const Videos={ async add(blob,meta){ const it=await M.call('videos-add',{blob,meta}); if(it)_images.push(it); return it; }, async url(id){ const b=await Store.get('vid:'+id); return b?URL.createObjectURL(b):null; }, remove:id=>M.call('videos-remove',{id}), addFile:f=>M.call('videos-addfile',{file:f}) };
const Sounds={ all:()=>_sounds, byId:id=>_sounds.find(x=>x.id===id), async addBlob(blob,name,sub,o){ const it=await M.call('sounds-add',{blob,name,sub,o:o||{}}); if(it)_sounds.push(it); return it; }, addFile:(f,sub)=>M.call('sounds-addfile',{file:f,sub}) };
const Downloads={ all:()=>_downloads, byId:id=>_downloads.find(x=>x.id===id), files:dir=>_downloads.filter(x=>(x.path||'')===(dir||'')), ext:n=>(String(n).split('.').pop()||'').toLowerCase(), async add(blob,name,dir,o){ const it=await M.call('downloads-add',{blob,name,dir:dir||'',o:o||{}}); if(it)_downloads.push(it); return it; }, async url(id){ const b=await Store.get('dl:'+id); return b?URL.createObjectURL(b):null; } };
const Portals={ all:()=>_portals, byId:id=>_portals.find(p=>p.id===id), dir:p=>p&&p.dir };

/* ── tiles: opening another app means asking the OS to ── */
const APPS=new Proxy({},{get:(t,k)=>typeof k==='string'?{id:k,name:k}:undefined,has:()=>true});
const deskStub={ open:(app,arg)=>M.launch(app&&app.id||String(app),arg), get grid(){ return document.body; } };
const WM={ open:(app,arg)=>M.launch(app&&app.id||String(app),arg), setTitle:(w,t)=>{ w.title=t; M.title(t); }, get active(){ return deskStub; }, allWins:()=>[window.__W].filter(Boolean), split:()=>M.split(), desks:[deskStub] };
const Nav={ go:()=>M.post('home') };
/* a context menu of our own — the OS's lives above us, we can't reach it */
function showCtx(x,y,items){ let m=document.getElementById('ctx'); if(!m){ m=document.createElement('div'); m.id='ctx'; m.className='bevel'; document.body.appendChild(m); document.addEventListener('pointerdown',e=>{ if(!m.contains(e.target))m.classList.remove('open'); },true); }
  m.innerHTML=''; items.forEach(it=>{ if(it==='-'){ const h=document.createElement('hr'); m.appendChild(h); return; } const d=document.createElement('div'); d.className='it'; d.innerHTML=`<span class="ic">${it.ico||''}</span><span>${esc(it.label||'')}${it.small?'<small>'+esc(it.small)+'</small>':''}</span>`; d.onclick=()=>{ m.classList.remove('open'); it.run&&it.run(); }; m.appendChild(d); });
  m.classList.add('open'); m.style.left=Math.max(4,Math.min(x,innerWidth-m.offsetWidth-4))+'px'; m.style.top=Math.max(4,Math.min(y,innerHeight-m.offsetHeight-4))+'px'; }
const closeOverlays=()=>{ const m=document.getElementById('ctx'); if(m)m.classList.remove('open'); };
const iconURL=()=>'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const appIcon=iconURL;

/* ── registration: the app file declares itself exactly as it did inside the OS ── */
const reg=a=>{ window.__APP=a; };

/* ── boot: say ready, wait for OPEN, mount ── */
(function(){
  let mounted=false;
  function mount(pay){ pay=pay||{}; if(pay.version)M_VERSION=pay.version; if(pay.home)HOME=pay.home; if(pay.user)USER=pay.user; if(pay.site)SITE=pay.site;
    FS._load(pay.fs,pay.fsmeta); _images=pay.images||[]; _sounds=pay.sounds||[]; _downloads=pay.downloads||[]; _portals=pay.portals||[]; if(pay.theme)applyTheme(pay.theme);
    const app=window.__APP; if(!app){ toast('this file registers no app'); return; }
    const w=window.__W={id:'w1',app,el:document.body,body:document.getElementById('app')||document.body,desk:deskStub,arg:pay.arg,title:app.name,close:()=>M.close(),clone:()=>M.split(),src:'local',get bar(){ return null; }};
    if(mounted){ if(app.reopen){ w.arg=pay.arg; app.reopen(w,pay.arg); } else { w.body.innerHTML=''; app.mount(w); } return; }
    mounted=true; document.title=app.name+' · Meridian'; app.mount(w); }
  M.on('open',d=>{ window.__PAY=d.payload; mount(d.payload); });
  M.on('reopen',d=>mount(Object.assign({},window.__PAY||{},{arg:d.payload&&d.payload.arg})));
  M.on('closing',()=>{ const w=window.__W; if(w&&w.app&&w.app.onClose)try{ w.app.onClose(w); }catch(e){} });
  window.addEventListener('DOMContentLoaded',()=>{ if(HOSTED){ M.post('ready'); setTimeout(()=>{ if(!mounted)mount({}); },4000); } else mount({}); });
})();

</script>
<script>
/* ═══════════════════════════════════════════════════════════════
   3b · CAPSULE (.fweddle) — FWD1 | u8 method | u32le crc | u32le rawlen | payload
        same codec as XFORGE / Clover / GoatPad, so capsules travel between them
   ═══════════════════════════════════════════════════════════════ */
const Capsule=(()=>{
  const T=(()=>{const t=new Int32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}return t;})();
  const crc32=u8=>{let c=-1;for(let i=0;i<u8.length;i++)c=T[(c^u8[i])&255]^(c>>>8);return(c^-1)>>>0;};
  const hdr=(m,crc,len)=>{const h=new Uint8Array(13);h.set([70,87,68,49,m]);const dv=new DataView(h.buffer);dv.setUint32(5,crc,true);dv.setUint32(9,len,true);return h;};
  async function make(obj){ const raw=new TextEncoder().encode(JSON.stringify(obj)),crc=crc32(raw); const pack=(m,p)=>{const o=new Uint8Array(13+p.length);o.set(hdr(m,crc,raw.length));o.set(p,13);return o;};
    if(typeof CompressionStream==='undefined')return pack(0,raw); try{ const b=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return pack(8,new Uint8Array(b)); }catch(e){return pack(0,raw);} }
  async function parse(u8){ if(u8.length<13||u8[0]!==70||u8[1]!==87||u8[2]!==68||u8[3]!==49)throw new Error('not a FWD1 capsule'); const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength); const m=u8[4],crc=dv.getUint32(5,true),len=dv.getUint32(9,true); let raw=u8.subarray(13);
    if(m===8)raw=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); if(raw.length!==len)throw new Error('capsule length mismatch'); if(crc32(raw)!==crc)throw new Error('capsule CRC32 failed'); return JSON.parse(new TextDecoder().decode(raw)); }
  /* FWD2 — binary capsule: 'FWD2' | u8 method | u32le crc32(raw) | u32le rawlen | u32le metalen | raw = [meta JSON][body bytes], compressed whole.
     Made for foreign binaries (.deb .exe .app .apk …) that Meridian keeps as applications: the file stays byte-exact, its type and every fact we could read ride in meta. */
  const hdr2=(m,crc,len,ml)=>{const h=new Uint8Array(17);h.set([70,87,68,50,m]);const dv=new DataView(h.buffer);dv.setUint32(5,crc,true);dv.setUint32(9,len,true);dv.setUint32(13,ml,true);return h;};
  async function makeBin(meta,body){ const mj=new TextEncoder().encode(JSON.stringify(meta)); const raw=new Uint8Array(mj.length+body.length); raw.set(mj,0); raw.set(body,mj.length); const crc=crc32(raw); const pack=(m,p)=>{const o=new Uint8Array(17+p.length);o.set(hdr2(m,crc,raw.length,mj.length));o.set(p,17);return o;};
    if(typeof CompressionStream==='undefined'||raw.length>64e6)return pack(0,raw); try{ const b=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return b.byteLength<raw.length?pack(8,new Uint8Array(b)):pack(0,raw); }catch(e){return pack(0,raw);} }
  async function parseBin(u8){ if(u8.length<17||u8[0]!==70||u8[1]!==87||u8[2]!==68||u8[3]!==50)throw new Error('not a FWD2 capsule'); const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength); const m=u8[4],crc=dv.getUint32(5,true),len=dv.getUint32(9,true),ml=dv.getUint32(13,true); let raw=u8.subarray(17);
    if(m===8)raw=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); if(raw.length!==len)throw new Error('capsule length mismatch'); if(crc32(raw)!==crc)throw new Error('capsule CRC32 failed'); return {meta:JSON.parse(new TextDecoder().decode(raw.subarray(0,ml))),body:raw.subarray(ml)}; }
  const kind=u8=>u8&&u8.length>4&&u8[0]===70&&u8[1]===87&&u8[2]===68?({49:'FWD1',50:'FWD2',51:'FWD3'}[u8[3]]||null):null;
  const download=(u8,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u8],{type:'application/octet-stream'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);};
  return {make,parse,makeBin,parseBin,kind,download,crc32};
})();
/* ═══════════════════════════════════════════════════════════════
   3c · THE FWEDDLE CODEX — the catch-all.
        A capsule (FWD3) that can wrap ANY file byte-exact, and a reader that knows
        what a file is from its own bytes rather than its name. Anything Meridian
        cannot open natively ends up here: it is identified, taken apart, shown, and
        — where a browser honestly can — run.
   ═══════════════════════════════════════════════════════════════ */
/* ── FWD3 · 'FWD3' | u8 method | u32le crc32(raw) | u32le rawlen | u32le metalen | raw = [meta JSON][part…]
      Parts are laid end to end after the meta; meta.parts gives each one's length and role. A FWD2
      capsule reads as a one-part FWD3, so nothing sealed before this still opens. ── */
const Codex=(()=>{
  const td=new TextDecoder(), te=new TextEncoder();
  const hdr3=(m,crc,len,ml)=>{const h=new Uint8Array(17);h.set([70,87,68,51,m]);const dv=new DataView(h.buffer);dv.setUint32(5,crc,true);dv.setUint32(9,len,true);dv.setUint32(13,ml,true);return h;};
  async function seal(meta,parts){ /* parts: [{name,role,mime,bytes}] */
    meta=Object.assign({kind:'fweddle.codex',v:3,made:Date.now(),by:'MeridianOS'},meta);
    meta.parts=parts.map(p=>({name:p.name,role:p.role||'payload',mime:p.mime||'application/octet-stream',len:p.bytes.length}));
    const mj=te.encode(JSON.stringify(meta)); const total=parts.reduce((a,p)=>a+p.bytes.length,0);
    const raw=new Uint8Array(mj.length+total); raw.set(mj,0); let o=mj.length; parts.forEach(p=>{raw.set(p.bytes,o);o+=p.bytes.length;});
    const crc=Capsule.crc32(raw); const pack=(m,p)=>{const out=new Uint8Array(17+p.length);out.set(hdr3(m,crc,raw.length,mj.length));out.set(p,17);return out;};
    if(typeof CompressionStream==='undefined'||raw.length>96e6)return pack(0,raw);
    try{ const b=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return b.byteLength<raw.length?pack(8,new Uint8Array(b)):pack(0,raw); }catch(e){ return pack(0,raw); } }
  async function unseal(u8){
    const k=Capsule.kind(u8);
    if(k==='FWD2'){ const {meta,body}=await Capsule.parseBin(u8); return {meta:Object.assign({v:2,parts:[{name:meta.file,role:'payload',mime:'application/octet-stream',len:body.length}]},meta),parts:[{name:meta.file,role:'payload',bytes:body}],legacy:'FWD2'}; }
    if(k!=='FWD3')throw new Error('not a Codex capsule');
    const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength); const m=u8[4],crc=dv.getUint32(5,true),len=dv.getUint32(9,true),ml=dv.getUint32(13,true);
    let raw=u8.subarray(17);
    if(m===8)raw=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    if(raw.length!==len)throw new Error('capsule length mismatch'); if(Capsule.crc32(raw)!==crc)throw new Error('capsule CRC32 failed');
    const meta=JSON.parse(td.decode(raw.subarray(0,ml))); const parts=[]; let o=ml;
    (meta.parts||[]).forEach(p=>{ parts.push(Object.assign({},p,{bytes:raw.subarray(o,o+p.len)})); o+=p.len; });
    return {meta,parts}; }
  const sha=async u8=>{ try{ const h=await crypto.subtle.digest('SHA-256',u8); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }catch(e){ return ''; } };

  /* ═══ the sniffer — what a file IS, from its own first bytes ═══ */
  const A=(u8,...b)=>b.every((v,i)=>u8[i]===v);

function roundRect(g,x,y,w,h,r){ if(!r){ g.rect(x,y,w,h); return; }

        if(!at('}'))eat(','); skipNL(); }
      expect('}'); return {k:'ObjectPat',props}; }
    const id=next(); return {k:'Ident',name:id.v}; }

  function params(){ expect('('); const out=[]; skipNL();
    while(!at(')')){ if(eat('...')){ out.push({k:'Rest',arg:bindTarget()}); }
      else { const tgt=bindTarget(); let def=null; if(eat('='))def=assign(); out.push({k:'Param',target:tgt,def}); }
      if(!at(')'))expect(','); skipNL(); }
    expect(')'); return out; }

  function funcBody(){ expect('{'); const body=[]; skipNL();
    while(!at('}')&&peek().t!=='eof'){ body.push(statement()); skipNL(); }
    expect('}'); return {k:'Block',body}; }

  function funcDecl(isAsync){ const gen=eat('*'); const name=peek().t==='name'?next().v:null;
    const ps=params(); const body=funcBody();
    return {k:'FuncDecl',name,params:ps,body,isAsync,gen}; }

  function classDecl(){ const name=peek().t==='name'&&!at('extends')&&!at('{')?next().v:null;
    let sup=null; if(eat('extends'))sup=unary();
    expect('{'); const members=[]; skipNL();
    while(!at('}')&&peek().t!=='eof'){
      if(eat(';')){ skipNL(); continue; }
      let stat=false,kind='method',isAsync=false;
      if(at('static')&&!(peek(1).t==='p'&&(peek(1).v==='('||peek(1).v==='='))){ next(); stat=true; }
      if(at('async')&&!(peek(1).t==='p'&&(peek(1).v==='('||peek(1).v==='='))){ next(); isAsync=true; }
      if((at('get')||at('set'))&&!(peek(1).t==='p'&&(peek(1).v==='('||peek(1).v==='='||peek(1).v===';'||peek(1).v==='}'))){ kind=next().v; }
      eat('*');
      let key,computed=false;
      if(eat('[')){ computed=true; key=assign(); expect(']'); }
      else { const kt=next(); key={k:'Lit',v:kt.v}; }
      if(at('(')){ const ps=params(); const body=funcBody();
        members.push({kind:kind==='method'?(key.v==='constructor'?'ctor':'method'):kind,stat,key,computed,fn:{k:'FuncDecl',name:String(key.v),params:ps,body,isAsync}}); }
      else { let init=null; if(eat('='))init=assign(); semi(); members.push({kind:'field',stat,key,computed,init}); }
      skipNL(); }
    expect('}'); return {k:'Class',name,sup,members}; }

  function forStatement(){ next(); expect('(');
    let init=null;
    if(at(';')){ next(); }
    else {
      let kind=null;
      if(at('var')||at('let')||at('const')){ kind=next().v; }
      if(kind){ const tgt=bindTarget();
        if(at('of')||at('in')){ const type=next().v; const right=type==='of'?assign():expression(); expect(')'); const body=statement();
          return {k:type==='of'?'ForOf':'ForIn',left:{k:'VarDecl',kind,decls:[{id:tgt,init:null}]},right,body}; }
        let first=null; if(eat('='))first=assign();
        const decls=[{id:tgt,init:first}];
        while(eat(',')){ const id2=bindTarget(); let i2=null; if(eat('='))i2=assign(); decls.push({id:id2,init:i2}); }
        init={k:'VarDecl',kind,decls}; expect(';'); }
      else { const e=expression();
        if(at('of')||at('in')){ const type=next().v; const right=type==='of'?assign():expression(); expect(')'); const body=statement();
          return {k:type==='of'?'ForOf':'ForIn',left:e,right,body}; }
        init={k:'ExprStatement',expr:e}; expect(';'); } }
    let test=null; if(!at(';'))test=expression(); expect(';');
    let update=null; if(!at(')'))update=expression(); expect(')');
    const body=statement(); return {k:'For',init,test,update,body}; }

  /* expressions */
  function expression(){ let e=assign(); if(at(',')){ const list=[e]; while(eat(','))list.push(assign()); return {k:'Seq',list}; } return e; }

  function isArrow(){
    /* look ahead from '(' for a matching ')' followed by '=>' */
    let i=p; while(T[i]&&T[i].t==='nl')i++;
    if(!(T[i]&&T[i].t==='p'&&T[i].v==='('))return false;
    let d=0;
    for(;i<T.length;i++){ const t=T[i];
      if(t.t==='p'&&(t.v==='('||t.v==='['||t.v==='{'))d++;
      else if(t.t==='p'&&(t.v===')'||t.v===']'||t.v==='}')){ d--; if(d===0){ let j=i+1; while(T[j]&&T[j].t==='nl')j++; return !!(T[j]&&T[j].t==='p'&&T[j].v==='=>'); } } }
    return false; }

  function assign(){
    skipNL();
    /* arrow functions */
    const t=peek();
    if(t.t==='name'&&t.v==='async'){ const n1=peek(1);
      if(n1&&n1.t==='name'&&!KEY.has(n1.v)&&peek(2)&&peek(2).t==='p'&&peek(2).v==='=>'){ next(); const a=next().v; next();
        return arrowBody([{k:'Param',target:{k:'Ident',name:a},def:null}],true); }
      if(n1&&n1.t==='p'&&n1.v==='('){ const save=p; next(); if(isArrow()){ const ps=params(); expect('=>'); return arrowBody(ps,true); } p=save; } }
    if(t.t==='name'&&!KEY.has(t.v)&&peek(1)&&peek(1).t==='p'&&peek(1).v==='=>'){ const a=next().v; next();
      return arrowBody([{k:'Param',target:{k:'Ident',name:a},def:null}],false); }
    if(t.t==='p'&&t.v==='('&&isArrow()){ const ps=params(); expect('=>'); return arrowBody(ps,false); }
    if(t.t==='name'&&t.v==='yield'){ next(); const dele=eat('*'); let arg=null;
      if(!at(')')&&!at(']')&&!at('}')&&!at(',')&&!at(';')&&peek().t!=='eof'&&T[p]&&T[p].t!=='nl')arg=assign();
      return {k:'Yield',arg,dele}; }

    const left=conditional();
    const nt=peek();
    if(nt.t==='p'&&ASSIGN.has(nt.v)){ const op=next().v; const right=assign(); return {k:'Assign',op,left,right}; }
    return left; }

  function arrowBody(ps,isAsync){
    skipNL();
    if(at('{')){ const body=funcBody(); return {k:'Arrow',params:ps,body,isAsync,expr:false}; }
    const e=assign(); return {k:'Arrow',params:ps,body:e,isAsync,expr:true}; }

  function conditional(){ const test=binary(0);
    if(at('?')&&!(peek().v==='?.')){ next(); const cons=assign(); expect(':'); const alt=assign(); return {k:'Cond',test,cons,alt}; }
    return test; }

  function binary(min){
    let left=unary();
    for(;;){ const t=peek();
      let op=null;
      if(t.t==='p'&&BIN[t.v]!==undefined)op=t.v;
      else if(t.t==='name'&&(t.v==='instanceof'||t.v==='in')&&BIN[t.v]!==undefined)op=t.v;
      if(!op)break;
      const prec=BIN[op]; if(prec<=min&&!(op==='**'&&prec===min))break;
      next();
      const right=op==='**'?binary(prec-1):binary(prec);
      left=(op==='&&'||op==='||'||op==='??')?{k:'Logical',op,left,right}:{k:'Bin',op,left,right}; }
    return left; }

  function unary(){
    skipNL(); const t=peek();
    if(t.t==='p'&&(t.v==='!'||t.v==='-'||t.v==='+'||t.v==='~')){ next(); return {k:'Unary',op:t.v,arg:unary()}; }
    if(t.t==='name'&&(t.v==='typeof'||t.v==='void'||t.v==='delete')){ next(); return {k:'Unary',op:t.v,arg:unary()}; }
    if(t.t==='name'&&t.v==='await'){ next(); return {k:'Await',arg:unary()}; }
    if(t.t==='p'&&(t.v==='++'||t.v==='--')){ next(); return {k:'Update',op:t.v,prefix:true,arg:unary()}; }
    let e=postfix();
    const nt=T[p];
    if(nt&&nt.t==='p'&&(nt.v==='++'||nt.v==='--')){ next(); e={k:'Update',op:nt.v,prefix:false,arg:e}; }
    return e; }

  function postfix(){ let e=primary(); return callTail(e,true); }

  function callTail(e,allowCall){
    for(;;){ const t=peek();
      if(t.t==='p'&&t.v==='.'){ next(); const nm=next(); e={k:'Member',obj:e,prop:{k:'Lit',v:nm.v},computed:false}; continue; }
      if(t.t==='p'&&t.v==='?.'){ next();
        if(at('(')){ const args=argList(); e={k:'Call',callee:e,args,optional:true}; continue; }
        if(eat('[')){ const pr=expression(); expect(']'); e={k:'Member',obj:e,prop:pr,computed:true,optional:true}; continue; }
        const nm=next(); e={k:'Member',obj:e,prop:{k:'Lit',v:nm.v},computed:false,optional:true}; continue; }
      if(t.t==='p'&&t.v==='['){ next(); const pr=expression(); expect(']'); e={k:'Member',obj:e,prop:pr,computed:true}; continue; }
      if(allowCall&&t.t==='p'&&t.v==='('){ const args=argList(); e={k:'Call',callee:e,args}; continue; }
      if(t.t==='tpl'){ const tt=next(); e={k:'TaggedTpl',tag:e,tpl:tt}; continue; }
      break; }
    return e; }

  function argList(){ expect('('); const out=[]; skipNL();
    while(!at(')')){ if(eat('...'))out.push({k:'Spread',arg:assign()}); else out.push(assign());
      if(!at(')'))expect(','); skipNL(); }
    expect(')'); return out; }

  function primary(){
    skipNL(); const t=next();
    if(t.t==='num')return {k:'Lit',v:t.v};
    if(t.t==='str')return {k:'Lit',v:t.v};
    if(t.t==='regex')return {k:'Regex',body:t.body,flags:t.flags};
    if(t.t==='tpl')return {k:'Tpl',parts:t.parts,exprs:t.exprs.map(s=>parse(s).body[0]&&parse(s).body[0].expr!==undefined?parse(s).body[0].expr:{k:'Lit',v:''})};
    if(t.t==='p'){
      if(t.v==='('){ const e=expression(); expect(')'); return e; }
      if(t.v==='['){ const els=[]; skipNL();
        while(!at(']')){ if(at(',')){ next(); els.push(null); continue; }
          if(eat('...'))els.push({k:'Spread',arg:assign()}); else els.push(assign());
          if(!at(']'))eat(','); skipNL(); }
        expect(']'); return {k:'Array',els}; }
      if(t.v==='{'){ const props=[]; skipNL();
        while(!at('}')){
          if(eat('...')){ props.push({k:'Spread',arg:assign()}); if(!at('}'))eat(','); skipNL(); continue; }
          let kind='init',isAsync=false;
          if(at('async')&&!(peek(1).t==='p'&&(peek(1).v===':'||peek(1).v==='('||peek(1).v===','||peek(1).v==='}'))){ next(); isAsync=true; }
          if((at('get')||at('set'))&&!(peek(1).t==='p'&&(peek(1).v===':'||peek(1).v==='('||peek(1).v===','||peek(1).v==='}'))){ kind=next().v; }
          eat('*');
          let key,computed=false;
          if(eat('[')){ computed=true; key=assign(); expect(']'); }
          else { const kt=next(); key={k:'Lit',v:kt.v}; }
          if(at('(')){ const ps=params(); const body=funcBody();
            props.push({k:'Prop',key,computed,kind:kind==='init'?'init':kind,value:{k:'FuncDecl',name:String(key.v),params:ps,body,isAsync}}); }
          else if(eat(':')){ props.push({k:'Prop',key,computed,kind:'init',value:assign()}); }
          else { let v={k:'Ident',name:key.v}; if(eat('='))v={k:'Assign',op:'=',left:{k:'Ident',name:key.v},right:assign()};
            props.push({k:'Prop',key,computed,kind:'init',value:v}); }
          if(!at('}'))eat(','); skipNL(); }
        expect('}'); return {k:'Object',props}; } }
    if(t.t==='name'){
      switch(t.v){
        case 'true': return {k:'Lit',v:true};
        case 'false': return {k:'Lit',v:false};
        case 'null': return {k:'Lit',v:null};
        case 'undefined': return {k:'Lit',v:undefined};
        case 'this': return {k:'This'};
        case 'super': return {k:'Super'};
        case 'function': return funcDecl(false);
        case 'class': return classDecl();
        case 'async': if(at('function')){ next(); return funcDecl(true); } break;
        case 'new': {
          if(at('.')){ next(); next(); return {k:'Lit',v:undefined}; }
          const callee=callTail(primary(),false);
          const args=at('(')?argList():[];
          return callTail({k:'New',callee,args},true); }
      }
      return {k:'Ident',name:t.v}; }
    if(t.t==='eof')throw new SyntaxError('unexpected end of script');
    return {k:'Lit',v:undefined}; }

  return program(); }

/* ── SCOPES ─────────────────────────────────────────────────────────────── */
function Scope(parent,kind){ this.vars=new Map(); this.parent=parent; this.kind=kind||'block'; }
Scope.prototype.lookup=function(n){ let s=this; while(s){ if(s.vars.has(n))return s; s=s.parent; } return null; };
Scope.prototype.get=function(n){ const s=this.lookup(n); if(!s)throw new ReferenceError(n+' is not defined'); return s.vars.get(n); };
Scope.prototype.has=function(n){ return !!this.lookup(n); };
Scope.prototype.set=function(n,v){ const s=this.lookup(n); if(s)s.vars.set(n,v); else { let g=this; while(g.parent)g=g.parent; g.vars.set(n,v); } };
Scope.prototype.declare=function(n,v,kind){
  if(kind==='var'){ let s=this; while(s.kind!=='fn'&&s.parent)s=s.parent; if(!s.vars.has(n)||v!==undefined)s.vars.set(n,s.vars.has(n)&&v===undefined?s.vars.get(n):v); }
  else this.vars.set(n,v); };

/* control-flow signals */
const BREAK={sig:'break'}, CONT={sig:'continue'};
function Ret(v){ this.v=v; } function Brk(l){ this.label=l; } function Cnt(l){ this.label=l; }

/* ── INTERPRETER ────────────────────────────────────────────────────────── */
function Interp(globals,opts){
  opts=opts||{};
  const G=new Scope(null,'fn');
  for(const k in globals)G.vars.set(k,globals[k]);
  let steps=0; const LIMIT=opts.limit||9000000;
  let deadline=0;
  const onError=opts.onError||function(){};
  const tick=()=>{ if(++steps>LIMIT)throw new Error('the script ran too long and was stopped ('+LIMIT+' steps)');
    if((steps&1023)===0&&deadline&&Date.now()>deadline)throw new Error('the script took too long and was stopped'); };

  function truthy(v){ return !!v; }

  /* destructuring */
  function bind(pat,val,scope,kind){
    switch(pat.k){
      case 'Ident': if(kind)scope.declare(pat.name,val,kind); else scope.set(pat.name,val); return;
      case 'ArrayPat': {
        const arr=val==null?[]:(typeof val[Symbol.iterator]==='function'?Array.from(val):[]);
        for(let i=0;i<pat.els.length;i++){ const e=pat.els[i]; if(!e)continue;
          if(e.k==='Rest'){ bind(e.arg,arr.slice(i),scope,kind); break; }
          let v=arr[i]; if(v===undefined&&e.def)v=ev(e.def,scope);
          bind(e.target,v,scope,kind); }
        return; }
      case 'ObjectPat': {
        const o=val==null?{}:val; const taken=[];
        for(const pr of pat.props){
          if(pr.k==='Rest'){ const rest={}; for(const q in o)if(taken.indexOf(q)<0)rest[q]=o[q]; bind(pr.arg,rest,scope,kind); continue; }
          const key=pr.computed?String(ev(pr.key,scope)):String(pr.key.v);
          taken.push(key);
          let v=o[key]; if(v===undefined&&pr.def)v=ev(pr.def,scope);
          bind(pr.target,v,scope,kind); }
        return; }
      default: { /* an assignment target that is a member expression */
        if(pat.k==='Member'){ const {obj,key}=memberRef(pat,scope); obj[key]=val; return; }
        throw new SyntaxError('cannot bind to '+pat.k); } } }

  function memberRef(node,scope){
    const obj=ev(node.obj,scope);
    if(obj==null){ if(node.optional)return {obj:undefined,key:undefined,skip:true};
      throw new TypeError('cannot read "'+(node.computed?String(ev(node.prop,scope)):node.prop.v)+'" of '+(obj===null?'null':'undefined')); }
    const key=node.computed?ev(node.prop,scope):node.prop.v;
    return {obj,key}; }

  function hoist(body,scope){
    for(const st of body){
      if(!st)continue;
      if(st.k==='FuncDecl'&&st.name)scope.declare(st.name,makeFunc(st,scope),'var');
      else if(st.k==='VarDecl'&&st.kind==='var')st.decls.forEach(d=>{ collectNames(d.id).forEach(n=>{ if(!scope.vars.has(n))scope.declare(n,undefined,'var'); }); });
      else if(st.k==='If'){ if(st.cons)hoist([st.cons],scope); if(st.alt)hoist([st.alt],scope); }
      else if(st.k==='Block')hoist(st.body,scope);
      else if(st.k==='For'||st.k==='While'||st.k==='DoWhile'||st.k==='ForIn'||st.k==='ForOf'||st.k==='Labeled')if(st.body)hoist([st.body],scope);
      else if(st.k==='Try'){ if(st.block)hoist([st.block],scope); if(st.handler)hoist([st.handler],scope); if(st.fin)hoist([st.fin],scope); } } }
  function collectNames(pat,out){ out=out||[];
    if(!pat)return out;
    if(pat.k==='Ident')out.push(pat.name);
    else if(pat.k==='ArrayPat')pat.els.forEach(e=>e&&collectNames(e.k==='Rest'?e.arg:e.target,out));
    else if(pat.k==='ObjectPat')pat.props.forEach(pr=>collectNames(pr.k==='Rest'?pr.arg:pr.target,out));
    return out; }

  function runBody(body,scope){
    hoist(body,scope);
    let last;
    for(let i=0;i<body.length;i++)last=exec(body[i],scope);
    return last; }

  function exec(node,scope){
    if(!node)return; tick();
    switch(node.k){
      case 'Program': return runBody(node.body,scope);
      case 'Block': { const s=new Scope(scope,'block'); return runBody(node.body,s); }
      case 'Empty': return;
      case 'ExprStatement': return ev(node.expr,scope);
      case 'VarDecl': node.decls.forEach(d=>{ const v=d.init?ev(d.init,scope):undefined; bind(d.id,v,scope,node.kind); }); return;
      case 'FuncDecl': if(node.name)scope.declare(node.name,makeFunc(node,scope),'var'); return;
      case 'Class': { const c=makeClass(node,scope); if(node.name)scope.declare(node.name,c,'let'); return c; }
      case 'If': if(truthy(ev(node.test,scope)))return exec(node.cons,scope); else if(node.alt)return exec(node.alt,scope); return;
      case 'While': { while(truthy(ev(node.test,scope))){ tick();
          try{ exec(node.body,scope); }catch(e){ if(e instanceof Brk){ if(e.label)throw e; break; } if(e instanceof Cnt){ if(e.label)throw e; continue; } throw e; } } return; }
      case 'DoWhile': { do{ tick();
          try{ exec(node.body,scope); }catch(e){ if(e instanceof Brk){ if(e.label)throw e; break; } if(e instanceof Cnt){ if(e.label)throw e; continue; } throw e; } }while(truthy(ev(node.test,scope))); return; }
      case 'For': { const s=new Scope(scope,'block');
        if(node.init)exec(node.init,s);
        for(;;){ tick(); if(node.test&&!truthy(ev(node.test,s)))break;
          const inner=new Scope(s,'block');
          if(node.init&&node.init.k==='VarDecl'&&node.init.kind!=='var')node.init.decls.forEach(d=>collectNames(d.id).forEach(n=>inner.vars.set(n,s.get(n))));
          try{ exec(node.body,inner); }catch(e){ if(e instanceof Brk){ if(e.label)throw e; break; } else if(e instanceof Cnt){ if(e.label)throw e; } else throw e; }
          if(node.init&&node.init.k==='VarDecl'&&node.init.kind!=='var')node.init.decls.forEach(d=>collectNames(d.id).forEach(n=>s.vars.set(n,inner.get(n))));
          if(node.update)ev(node.update,s); }
        return; }
      case 'ForIn': { const obj=ev(node.right,scope); if(obj==null)return;
        for(const key in obj){ tick(); const s=new Scope(scope,'block');
          assignLoopVar(node.left,key,s);
          try{ exec(node.body,s); }catch(e){ if(e instanceof Brk){ if(e.label)throw e; break; } else if(e instanceof Cnt){ if(e.label)throw e; } else throw e; } }
        return; }
      case 'ForOf': { const it=ev(node.right,scope);
        if(it==null)throw new TypeError('cannot iterate over '+(it===null?'null':'undefined'));
        const seq=typeof it[Symbol.iterator]==='function'?it:Object.keys(it).map(k=>it[k]);
        for(const val of seq){ tick(); const s=new Scope(scope,'block');
          assignLoopVar(node.left,val,s);
          try{ exec(node.body,s); }catch(e){ if(e instanceof Brk){ if(e.label)throw e; break; } else if(e instanceof Cnt){ if(e.label)throw e; } else throw e; } }
        return; }
      case 'Return': throw new Ret(node.arg?ev(node.arg,scope):undefined);
      case 'Break': throw new Brk(node.label);
      case 'Continue': throw new Cnt(node.label);
      case 'Throw': throw ev(node.arg,scope);
      case 'Try': {
        try{ exec(node.block,scope); }
        catch(e){ if(e instanceof Ret||e instanceof Brk||e instanceof Cnt){ if(node.fin)exec(node.fin,scope); throw e; }
          if(node.handler){ const s=new Scope(scope,'block'); if(node.param)bind(node.param,e,s,'let');
            try{ exec(node.handler,s); }catch(e2){ if(node.fin)exec(node.fin,scope); throw e2; } }
          else { if(node.fin)exec(node.fin,scope); throw e; } }
        if(node.fin)exec(node.fin,scope); return; }
      case 'Switch': { const d=ev(node.disc,scope); const s=new Scope(scope,'block');
        let started=false;
        try{
          for(const c of node.cases){ if(!started&&c.test!==null&&ev(c.test,s)===d)started=true;
            if(started)runBody(c.body,s); }
          if(!started){ let go=false;
            for(const c of node.cases){ if(c.test===null)go=true; if(go)runBody(c.body,s); } }
        }catch(e){ if(e instanceof Brk&&!e.label)return; throw e; }
        return; }
      case 'Labeled': { try{ exec(node.body,scope); }
        catch(e){ if((e instanceof Brk||e instanceof Cnt)&&e.label===node.label)return; throw e; } return; }
      default: return ev(node,scope); } }

  function assignLoopVar(left,val,s){
    if(left.k==='VarDecl')bind(left.decls[0].id,val,s,left.kind);
    else if(left.k==='Ident')s.set(left.name,val);
    else if(left.k==='Member'){ const r=memberRef(left,s); r.obj[r.key]=val; }
    else bind(left,val,s,null); }

  /* functions */
  function makeFunc(node,defScope,thisVal,isMethod){
    const fn=function(){
      const s=new Scope(defScope,'fn');
      s.vars.set('arguments',arguments);
      if(!node.arrow)s.vars.set('this',isMethod?this:(thisVal!==undefined?thisVal:this));
      const args=arguments;
      let ai=0;
      for(const pm of node.params){
        if(pm.k==='Rest'){ bind(pm.arg,Array.prototype.slice.call(args,ai),s,'let'); break; }

    Object.keys(modeBtns).forEach(k=>modeBtns[k].classList.toggle('on',k===m2));

    treePane.hidden=m2!=='tree'; capsPane.hidden=!(m2==='capsule');
    if(m2==='source')renderSource(); if(m2==='console')renderConsole(); if(m2==='tree')renderTree();
    if(m2==='page'){ dirty=true; kick(); } }

  /* ── loading ─────────────────────────────────────────────────────────── */
  async function load(input){
    stopRun();
    logs.length=0; errCount=0; scroll=0; pdf=null; pdfCache=null; capsule=null; doc=null; layoutRoot=null;
    for(const k in images)delete images[k]; for(const k in canvases)delete canvases[k];
    name=input.name||name||'untitled';
    bytes=input.bytes||null; src=input.text!=null?input.text:'';
    if(input.path){ const v=FS.get(input.path);
      if(v===undefined){ fail('that file is gone'); return; }
      name=input.path.split('/').pop();
      if(/^data:/.test(String(v))){ const m=/^data:([^;,]*)(;base64)?,(.*)$/s.exec(String(v));
        if(m){ bytes=m[2]?b64ToU8(m[3]):new TextEncoder().encode(decodeURIComponent(m[3])); src=''; } }
      else { src=String(v); bytes=null; }
      pathEl.textContent=input.path; }
    else if(input.dl){ const x=Downloads.byId(input.dl); if(!x){ fail('that download is gone'); return; }
      name=x.name; const b=await Store.get('dl:'+x.id); if(!b){ fail('its bytes are missing'); return; }
      bytes=new Uint8Array(await b.arrayBuffer()); src=''; pathEl.textContent='DOWNLOADS/'+(x.path?x.path+'/':'')+x.name; }
    else if(input.file){ const f=input.file; name=f.name; bytes=new Uint8Array(await f.arrayBuffer()); src=''; pathEl.textContent=f.name; }
    else pathEl.textContent=name;

    if(bytes&&!src){
      if(looksPDF(bytes))return openPDF();
      if(looksFWD(bytes))return openCapsule();
      src=dec(bytes); }
    if(/^%PDF-/.test(src.slice(0,8))){ bytes=new TextEncoder().encode(src); return openPDF(); }
    const e=EXT(name);
    if(e==='pdf'&&bytes)return openPDF();
    if(e==='fweddle'&&bytes)return openCapsule();
    if(/^(png|jpg|jpeg|gif|webp|bmp|ico|avif)$/.test(e)&&bytes)return openImage();
    return openHTML(src); }

  function fail(msg){ kind='none'; emptyBox.hidden=false; emptyBox.innerHTML='';
    const p=document.createElement('div'); p.innerHTML='<b style="color:var(--rose)">'+esc(msg)+'</b>'; emptyBox.appendChild(p);
    paintStatus(); }

  function openHTML(text){
    kind='html'; src=String(text||''); emptyBox.hidden=true;
    const t0=performance.now();
    doc=FwCore.parseHTML(src);
    /* make sure there is an html/body to hang things on */
    if(!FwCore.find(doc,n=>n.type===1&&n.tag==='body')){
      const body=FwCore.mkEl('body'); doc.kids.slice().forEach(k=>{ k.parent=body; body.kids.push(k); });
      doc.kids=[body]; body.parent=doc; }
    collectSheets();
    restyle();
    /* the pictures the page asks for */
    FwCore.findAll(doc,n=>n.type===1&&n.tag==='img').forEach(n=>needImage(n.attrs.src));
    FwCore.walk(doc,n=>{ if(n.type!==1)return; const bg=(n.cs&&(n.cs['background-image']||n.cs['background-shorthand']))||'';
      const m=/url\(\s*['"]?([^'")]+)['"]?\s*\)/.exec(String(bg)); if(m)needImage(m[1]); });
    startRun();
    ms=Math.round(performance.now()-t0);
    setMode('page'); dirty=true; kick(); paintStatus(); }

  function collectSheets(){
    sheets=[]; let order=0;
    FwCore.findAll(doc,n=>n.type===1&&n.tag==='style').forEach(n=>{
      try{ sheets.push(FwCore.parseCSS(FwCore.textOf(n),order)); order+=1000; }catch(e){ log('warn',['a stylesheet would not parse: '+e.message]); } }); }
  function restyle(){ try{ FwCore.computeStyles(doc,sheets,dom?dom.hoverCtx():{vw:stageW()}); }catch(e){ log('error',['the cascade stumbled: '+e.message]); } }

  function needImage(srcAttr){ if(!srcAttr||images[srcAttr]!==undefined)return;
    let url=String(srcAttr);
    if(/^(data:|blob:)/.test(url)){ }
    else if(/^https?:\/\//.test(url)){ /* a page kept offline: only what came with it */ images[url]=null; return; }
    else { const p=resolveLocal(url); if(p==null){ images[url]=null; return; } url=p; }
    const im=new Image(); images[srcAttr]=im;
    im.onload=()=>{ dirty=true; kick(); paintStatus(); };
    im.onerror=()=>{ images[srcAttr]=null; dirty=true; kick(); };
    im.src=url; }
  function resolveLocal(rel){
    /* a relative path resolves inside the directory the file came from */
    const base=(pathEl.textContent||'').replace(/[^/]*$/,'');
    const tries=[base+rel,rel,HOME+'/'+rel];
    for(const t of tries){ const v=FS.get(t.replace(/\/+/g,'/')); if(typeof v==='string'&&/^data:/.test(v))return v; }
    const x=Downloads.all&&Downloads.all().find?Downloads.all().find(d=>d.name===rel.split('/').pop()):null;
    return null; }

  async function openPDF(){
    kind='pdf'; emptyBox.hidden=true; pdfPage=0; zoom=1;
    const t0=performance.now();
    try{ pdf=FwPDF.open(bytes); }
    catch(e){ fail('that PDF would not open: '+e.message); return; }
    if(!pdf.pages.length){ fail('no pages found in that PDF'); return; }
    ms=Math.round(performance.now()-t0);
    if(pdf.encrypted)log('warn',['this PDF says it is encrypted — what can be read is shown']);
    log('log',['PDF '+pdf.version+' · '+pdf.pages.length+' page'+(pdf.pages.length>1?'s':'')+(pdf.meta.Title?' · '+pdf.meta.Title:'')]);
    setMode('page'); dirty=true; kick(); paintStatus(); }

  async function openCapsule(){
    kind='capsule'; emptyBox.hidden=true;
    try{
      const k=Capsule.kind(bytes);
      if(k==='FWD1'){ const o=await Capsule.parse(bytes); capsule={type:'FWD1',meta:o,parts:[]}; }
      else if(k==='FWD2'){ const o=await Capsule.parseBin(bytes); capsule={type:'FWD2',meta:o.meta,parts:[{name:o.meta.file||name,role:'body',bytes:o.body}]}; }
      else if(k==='FWD3'&&typeof Codex!=='undefined'&&Codex.unseal){ const o=await Codex.unseal(bytes); capsule={type:'FWD3',meta:o.meta,parts:o.parts||[]}; }
      else { fail('that is not a capsule Meridian knows'); return; }
    }catch(e){ fail('the capsule would not open: '+e.message); return; }
    renderCapsule(); setMode('capsule'); paintStatus(); }

  function openImage(){
    kind='image'; emptyBox.hidden=true;
    const blob=new Blob([bytes]); const url=URL.createObjectURL(blob);
    src='<!doctype html><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;height:100%">'
      +'<img src="'+url+'" style="max-width:100%"></body>';
    images[url]=null; openHTML(src); needImage(url); }

  /* ── the capsule pane ────────────────────────────────────────────────── */
  function renderCapsule(){
    const m=capsule.meta||{};
    const rows=Object.keys(m).filter(k=>typeof m[k]!=='object').slice(0,24)
      .map(k=>'<div class="rw"><b>'+esc(k)+'</b><span>'+esc(String(m[k]).slice(0,180))+'</span><span></span></div>').join('');
    capsPane.innerHTML='<h5>'+capsule.type+' CAPSULE</h5><div class="rw"><b>NAME</b><span>'+esc(name)+'</span><span>'+(bytes?Resources.fmt(bytes.length):'')+'</span></div>'+rows
      +(capsule.parts.length?'<h5>PARTS</h5>':'<h5>PAYLOAD</h5><div class="rw"><b>—</b><span>this capsule carries settings, not a file</span><span></span></div>');
    capsule.parts.forEach((p,i)=>{ const row=document.createElement('div'); row.className='rw';
      row.innerHTML='<b>'+esc(p.name||('part '+(i+1)))+'</b><span>'+esc(p.role||p.mime||'')+' · '+Resources.fmt((p.bytes||[]).length)+'</span>';
      const b=document.createElement('button'); b.className='btn'; b.textContent='OPEN'; b.onclick=()=>{ bytes=p.bytes; src=''; name=p.name||name; load({bytes:p.bytes,name:p.name||name}); };
      row.appendChild(b); capsPane.appendChild(row); });
    if(capsule.type==='FWD1'){ const b=document.createElement('button'); b.className='btn'; b.style.alignSelf='flex-start';
      b.textContent='SHOW IT AS JSON'; b.onclick=()=>{ src=JSON.stringify(capsule.meta,null,2); kind='text'; setMode('source'); };
      capsPane.appendChild(b); } }

  /* ── the interpreter ─────────────────────────────────────────────────── */
  function startRun(){
    dom=FwDOM.create({doc,images,canvases,
      log,dirty:()=>{ dirty=true; kick(); },
      restyle:()=>{ restyle(); },
      needImage,
      width:()=>Math.round(stageW()/zoom), height:()=>Math.round(stage.clientHeight/zoom),
      scroll:()=>scroll, scrollTo:y=>{ scroll=Math.max(0,Math.min(y,Math.max(0,contentH-stage.clientHeight))); dirty=true; kick(); },
      title:t=>{ WM.setTitle(w,'Fweddler · '+t); },
      url:'fweddler:'+name, path:'/'+name,
      dialog:(t,m,d)=>ask(t,m,d),
      open:u=>{ log('log',['the page asked to go to '+u]); toast('the Fweddler keeps a page where it is'); },
      reload:()=>load({bytes,text:src,name}),
      /* an onclick="" attribute, compiled the same way a script is */
      compile:(code)=>{ const ast=FwJS.parse(code);
        return function(e){ const sc=interp.scope();
          sc.vars.set('this',this); sc.vars.set('event',e); sc.vars.set('$event',e);
          interp.runIn(ast,sc); }; } });
    interp=FwJS.Interp(dom.globals,{budget:4000,limit:12000000,onError:e=>log('error',[e.message])});
    runScripts(); }

  function runScripts(){
    const scripts=FwCore.findAll(doc,n=>n.type===1&&n.tag==='script');
    let ran=0;
    scripts.forEach(n=>{
      const type=(n.attrs.type||'').toLowerCase();
      if(type&&!/javascript|module|^text\/js$|^$/.test(type))return;
      if(n.attrs.src){ log('warn',['<script src="'+n.attrs.src+'"> was left alone — the Fweddler keeps a page offline']); return; }
      const code=FwCore.textOf(n); if(!code.trim())return;
      const t0=performance.now();
      try{ interp.run(code); ran++; }
      catch(e){ if(e&&e.__fwAwait)log('warn',[e.message]);
        else log('error',[(e&&e.name?e.name+': ':'')+((e&&e.message)||String(e))]); }
      const dt=performance.now()-t0; if(dt>400)log('warn',['a script took '+Math.round(dt)+' ms']); });
    /* the load events a page waits for */
    setTimeout(()=>{ if(!alive)return;
      try{ dom.fire(FwCore.find(doc,x=>x.type===1&&x.tag==='body')||doc,'DOMContentLoaded',{bubbles:false}); }catch(e){}
      (dom.winListeners['DOMContentLoaded']||[]).forEach(l=>{ try{ l.f(dom.mkEvent('DOMContentLoaded',{},null)); }catch(e){ log('error',[e.message]); } });
      (dom.winListeners['load']||[]).forEach(l=>{ try{ l.f(dom.mkEvent('load',{},null)); }catch(e){ log('error',[e.message]); } });
      const b=FwCore.find(doc,x=>x.type===1&&x.tag==='body');
      if(b&&b.attrs.onload){ try{ dom.fire(b,'load',{bubbles:false}); }catch(e){} }
      dirty=true; kick(); },0);
    if(ran)log('log',[ran+' script'+(ran>1?'s':'')+' run on the Fweddler engine']); }

  function stopRun(){ if(dom)dom.dispose(); dom=null; interp=null; }

  /* ── layout + paint ──────────────────────────────────────────────────── */
  const stageW=()=>Math.max(80,stage.clientWidth-10);
  function relayout(force){ if(force)dirty=true; kick(); }

  function frame(ts){
    raf=null; if(!alive)return;
    let work=false;
    if(dom){ work=dom.pumpTimers(Date.now())||work; work=dom.pumpFrames(ts||performance.now())||work; }
    if(kind==='html'&&(dirty||work)){ doLayout(); doPaint(); dirty=false; }
    else if(kind==='pdf'&&dirty){ doPDF(); dirty=false; }
    if(alive&&(dom&&dom.pending||dirty||anyLiveCanvas()))kick(); }
  function anyLiveCanvas(){ return false; }
  function kick(){ if(!raf&&alive)raf=requestAnimationFrame(frame); }

  function doLayout(){
    if(!doc)return;
    const W=Math.round(stageW()/zoom);
    const t0=performance.now();
    try{ layoutRoot=FwLayout.layout(doc,{width:W,height:Math.round(stage.clientHeight/zoom),images,canvases}); }
    catch(e){ log('error',['layout: '+e.message]); return; }
    contentH=Math.max(0,(layoutRoot.__height||layoutRoot.h)*zoom);
    ms=Math.round(performance.now()-t0); }

  function doPaint(){
    const W=stage.clientWidth, H=stage.clientHeight;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
    cv.style.width=W+'px'; cv.style.height=H+'px';
    g.setTransform(dpr*zoom,0,0,dpr*zoom,0,0);
    try{ FwLayout.paint(g,layoutRoot,{width:Math.round(W/zoom),height:Math.round(H/zoom),scroll:scroll/zoom,images,canvases,paper:'#ffffff'}); }
    catch(e){ log('error',['paint: '+e.message]); }
    g.setTransform(1,0,0,1,0,0);
    scrollbar(); paintStatus(); }

  function doPDF(){
    if(!pdf)return; const W=stage.clientWidth, H=stage.clientHeight;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const nat=pdf.size(pdfPage,1);
    const fit=Math.min((W-16)/nat.w,(H-16)/nat.h);
    const s=Math.max(.1,fit*zoom);
    if(!pdfCache||pdfCache.page!==pdfPage||Math.abs(pdfCache.s-s)>0.001){
      const off=document.createElement('canvas');
      off.width=Math.max(1,Math.round(nat.w*s*dpr)); off.height=Math.max(1,Math.round(nat.h*s*dpr));
      const og=off.getContext('2d');
      const t0=performance.now();
      try{ pdf.render(pdfPage,og,{scale:s*dpr,onError:e=>log('warn',['page '+(pdfPage+1)+': '+e.message]),onAsset:()=>{ pdfCache=null; dirty=true; kick(); }}); }
      catch(e){ log('error',['page '+(pdfPage+1)+' would not draw: '+e.message]); }
      ms=Math.round(performance.now()-t0);
      pdfCache={page:pdfPage,s,cv:off}; }
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
    cv.style.width=W+'px'; cv.style.height=H+'px';
    g.setTransform(1,0,0,1,0,0);
    g.fillStyle='#2a2f3d'; g.fillRect(0,0,cv.width,cv.height);
    const c=pdfCache.cv;
    contentH=c.height/dpr;
    const x=Math.max(0,(cv.width-c.width)/2);
    g.drawImage(c,x,-scroll*dpr);
    scrollbar(); paintStatus(); }

  function scrollbar(){ const H=stage.clientHeight;
    if(contentH<=H+1){ sb.style.display='none'; return; }
    sb.style.display='block';
    const th=Math.max(18,H*H/contentH);
    const y=(scroll/(contentH-H))*(H-th);
    sb.firstChild.style.top=Math.round(y)+'px'; sb.firstChild.style.height=Math.round(th)+'px'; }

  function paintStatus(){
    const bits=[];
    if(kind==='html'&&doc){ let els=0,txt=0; FwCore.walk(doc,n=>{ if(n.type===1)els++; else if(n.type===3)txt++; });
      const rules=sheets.reduce((a,s)=>a+s.filter(r=>r.sel).length,0);
      bits.push('<b>'+els+'</b> elements','<b>'+rules+'</b> rules','<b>'+ms+'</b> ms');
      if(dom&&dom.pending)bits.push('<b>'+dom.pending+'</b> pending');
      if(zoom!==1)bits.push('<b>'+Math.round(zoom*100)+'%</b>'); }
    else if(kind==='pdf'&&pdf){ bits.push('page <b>'+(pdfPage+1)+'</b> of <b>'+pdf.pages.length+'</b>','PDF '+pdf.version,'<b>'+ms+'</b> ms','<b>'+Math.round(zoom*100)+'%</b>');
      if(pdf.meta.Title)bits.push(esc(pdf.meta.Title).slice(0,50)); }
    else if(kind==='capsule'&&capsule)bits.push(capsule.type,'<b>'+capsule.parts.length+'</b> parts');
    else bits.push('nothing open');
    if(errCount)bits.push('<span class="bad">'+errCount+' error'+(errCount>1?'s':'')+'</span>');
    stat.innerHTML=bits.join(' · ');
    prevBtn.hidden=nextBtn.hidden=kind!=='pdf';
    modeBtns.tree.hidden=kind!=='html'; }

  function renderSource(){ if(kind==='pdf'&&pdf){ textPane.textContent=pdf.text(pdfPage)||'(no text layer on this page)'; return; }
    textPane.textContent=src||'(nothing)'; }
  function renderConsole(){ textPane.innerHTML=logs.length
    ? logs.map(l=>'<span class="'+(l.k==='error'?'e':l.k==='warn'?'w':'d')+'">'+(l.k==='error'?'✖ ':l.k==='warn'?'▲ ':'· ')+esc(l.s)+'</span>').join('\n')
    : '<span class="d">the page has not said anything.</span>'; }
  function renderTree(){ if(!doc){ treePane.textContent='(nothing parsed)'; return; }
    const out=[]; let count=0;
    (function go(n,d){ if(count++>2500)return;
      const pad='  '.repeat(d);
      if(n.type===3){ const t=n.text.replace(/\s+/g,' ').trim(); if(t)out.push(pad+'<span class="x">"'+esc(t.slice(0,70))+'"</span>'); return; }
      if(n.type===8)return;
      if(n.type===1){ const at=Object.keys(n.attrs).slice(0,4).map(k=>' <span class="a">'+esc(k)+'</span>="'+esc(String(n.attrs[k]).slice(0,26))+'"').join('');
        out.push(pad+'<span class="t">&lt;'+n.tag+'</span>'+at+'<span class="t">&gt;</span>'); }
      (n.kids||[]).forEach(k=>go(k,d+1)); })(doc,0);
    treePane.innerHTML='<pre style="margin:0;white-space:pre-wrap">'+out.join('\n')+'</pre>'; }

  /* ── input ───────────────────────────────────────────────────────────── */
  stage.addEventListener('wheel',e=>{ if(contentH<=stage.clientHeight)return; e.preventDefault();
    scroll=Math.max(0,Math.min(contentH-stage.clientHeight,scroll+e.deltaY)); dirty=true;
    if(kind==='pdf')doPDF(); else { doPaint(); } },{passive:false});
  let tdrag=null;
  stage.addEventListener('pointerdown',e=>{ if(e.button!==0)return;
    tdrag={y:e.clientY,s:scroll,moved:false,x:e.clientX};
    stage.setPointerCapture&&stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove',e=>{
    if(tdrag){ const dy=e.clientY-tdrag.y;
      if(Math.abs(dy)>4){ tdrag.moved=true; scroll=Math.max(0,Math.min(Math.max(0,contentH-stage.clientHeight),tdrag.s-dy));
        dirty=true; if(kind==='pdf')doPDF(); else doPaint(); } return; }
    if(kind!=='html'||!layoutRoot||!dom)return;
    const r=stage.getBoundingClientRect();
    const hb=FwLayout.hit(layoutRoot,(e.clientX-r.left)/zoom,(e.clientY-r.top+scroll)/zoom);
    const node=hb&&hb.node;
    if(node!==dom.hover){ dom.hover=node; restyle(); dirty=true; kick();
      cv.style.cursor=node&&node.cs&&(node.cs.cursor==='pointer'||node.tag==='a'||node.tag==='button')?'pointer':'default'; }
    if(node)dom.fire(node,'mousemove',{clientX:(e.clientX-r.left)/zoom,clientY:(e.clientY-r.top+scroll)/zoom,
      offsetX:(e.clientX-r.left)/zoom-(hb.x||0),offsetY:(e.clientY-r.top+scroll)/zoom-(hb.y||0),buttons:e.buttons,bubbles:true});
  });
  ['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,e=>{
    const wasDrag=tdrag&&tdrag.moved; tdrag=null;
    if(wasDrag||kind!=='html'||!layoutRoot||!dom)return;
    const r=stage.getBoundingClientRect();
    const X=(e.clientX-r.left)/zoom, Y=(e.clientY-r.top+scroll)/zoom;
    const hb=FwLayout.hit(layoutRoot,X,Y); if(!hb||!hb.node)return;
    const n=hb.node;
    const ev={clientX:X,clientY:Y,pageX:X,pageY:Y,offsetX:X-(hb.x||0),offsetY:Y-(hb.y||0),button:0,buttons:0,bubbles:true};
    /* a form control answers first */
    if(n.tag==='input'){ const ty=(n.attrs.type||'text').toLowerCase();
      if(ty==='checkbox'){ n.checked=!(n.checked!==undefined?n.checked:n.attrs.checked!==undefined); dom.fire(n,'change',ev); }
      else if(ty==='radio'){ FwCore.findAll(doc,x=>x.type===1&&x.tag==='input'&&x.attrs.name===n.attrs.name).forEach(x=>x.checked=false);
        n.checked=true; dom.fire(n,'change',ev); }
      else if(ty==='range'){ const b=n.__box; if(b){ const p=Math.max(0,Math.min(1,(X-b.x)/Math.max(1,b.w))); n.value=String(Math.round(p*100)); dom.fire(n,'input',ev); dom.fire(n,'change',ev); } }
      else { dom.focus=n; ask('prompt',n.attrs.placeholder||('value for '+(n.attrs.name||'this field')),n.value||n.attrs.value||'')
        .then(v=>{ if(v!=null){ n.value=v; dom.fire(n,'input',ev); dom.fire(n,'change',ev); } }); } }
    else if(n.tag==='textarea'){ ask('prompt','text',n.value!==undefined?n.value:FwCore.textOf(n))
      .then(v=>{ if(v!=null){ n.value=v; dom.fire(n,'input',ev); dom.fire(n,'change',ev); } }); }
    else if(n.tag==='select'){ const opts=FwCore.findAll(n,o=>o.type===1&&o.tag==='option');
      n.__sel=((n.__sel||0)+1)%Math.max(1,opts.length); n.value=opts[n.__sel]?(opts[n.__sel].attrs.value||FwCore.textOf(opts[n.__sel]).trim()):''; dom.fire(n,'change',ev); }
    dom.fire(n,'mousedown',ev); dom.fire(n,'pointerdown',ev);
    dom.fire(n,'mouseup',ev); dom.fire(n,'pointerup',ev);
    dom.fire(n,'click',ev);
    /* links inside the same document */
    let a=n; while(a&&a.type===1&&a.tag!=='a')a=a.parent;
    if(a&&a.type===1&&a.attrs.href){ const h=String(a.attrs.href);
      if(h[0]==='#'){ const t=FwCore.find(doc,x=>x.type===1&&(x.attrs.id===h.slice(1)||x.attrs.name===h.slice(1)));
        if(t&&t.__box){ scroll=Math.max(0,t.__box.y*zoom-10); dirty=true; kick(); } }
      else if(/^https?:/.test(h))toast('the Fweddler keeps a page offline — '+h.slice(0,50));
      else { const p=(pathEl.textContent||'').replace(/[^/]*$/,'')+h;
        if(FS.get(p.replace(/\/+/g,'/'))!==undefined)load({path:p.replace(/\/+/g,'/')});
        else toast('nothing here called '+h); } }
    const f=n.tag==='button'||(n.tag==='input'&&/submit/i.test(n.attrs.type||''))?closestTag(n,'form'):null;
    if(f)dom.fire(f,'submit',Object.assign({},ev));
  }));
  function closestTag(n,tag){ let x=n; while(x&&x.type===1){ if(x.tag===tag)return x; x=x.parent; } return null; }

  const keyHandler=e=>{ if(!alive||!dom||kind!=='html')return;
    if(!w.el.contains(document.activeElement)&&document.activeElement!==document.body)return;
    if(!w.el.classList.contains('shown')&&w.desk.current!==w)return;
    const t=document.activeElement;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
    const ev={key:e.key,code:e.code,keyCode:e.keyCode,which:e.keyCode,shiftKey:e.shiftKey,ctrlKey:e.ctrlKey,altKey:e.altKey,metaKey:e.metaKey,repeat:e.repeat,bubbles:true};
    const target=dom.focus||FwCore.find(doc,x=>x.type===1&&x.tag==='body')||doc;
    dom.fire(target,e.type,ev);
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)&&(dom.winListeners.keydown||[]).length)e.preventDefault(); };
  addEventListener('keydown',keyHandler); addEventListener('keyup',keyHandler);

  stage.addEventListener('dragover',e=>{ e.preventDefault(); stage.classList.add('hot'); });
  stage.addEventListener('dragleave',()=>stage.classList.remove('hot'));
  stage.addEventListener('drop',async e=>{ e.preventDefault(); stage.classList.remove('hot');
    const f=(e.dataTransfer.files||[])[0]; if(f)load({file:f}); });

  /* ── a modal that matches the desktop ────────────────────────────────── */
  function ask(type,message,def){
    return new Promise(res=>{
      const box=document.createElement('div'); box.className='pop bevel fwask open';
      box.innerHTML='<h6>'+esc(type.toUpperCase())+'</h6><small style="color:var(--fg2)">'+esc(String(message).slice(0,300))+'</small>'
        +(type==='prompt'?'<input class="inp" value="'+esc(def||'')+'">':'')
        +'<div class="row">'+(type==='alert'?'<button class="btn" data-a="ok">OK</button>':'<button class="btn acc" data-a="ok">OK</button><button class="btn" data-a="no">CANCEL</button>')+'</div>';
      stage.appendChild(box);
      const inp=box.querySelector('input'); if(inp)setTimeout(()=>{ inp.focus(); inp.select(); },30);
      const done=v=>{ box.remove(); res(v); };
      box.querySelector('[data-a=ok]').onclick=()=>done(type==='prompt'?(inp?inp.value:''):true);
      const no=box.querySelector('[data-a=no]'); if(no)no.onclick=()=>done(type==='prompt'?null:false);
      if(inp)inp.onkeydown=e=>{ if(e.key==='Enter')done(inp.value); if(e.key==='Escape')done(null); }; }); }

  /* ── open / save ─────────────────────────────────────────────────────── */
  function picker(){
    const items=[];
    items.push({label:'A file from the disk',ico:'⌘',small:'FILES',run:()=>pickFS()});
    items.push({label:'Something in DOWNLOADS',ico:'⇩',run:()=>pickDL()});
    items.push({label:'A file from your device',ico:'⇧',run:async()=>{ const f=await pickFile(''); if(f)load({file:f}); }});
    items.push('-');
    items.push({label:'Paste some HTML',ico:'✎',run:async()=>{ const t=await ask('prompt','paste a page and it will be read',''); if(t)load({text:t,name:'pasted.html'}); }});
    items.push({label:'The example page',ico:'◈',small:'what the engine can do',run:()=>load({text:SAMPLE,name:'hello.html'})});
    const r=openBtn.getBoundingClientRect(); showCtx(r.left,r.bottom,items); }
  function pickFS(){
    const found=[]; (function go(dir){ const n=FS.get(dir); if(!FS.isDir(n))return;
      Object.keys(n).forEach(k=>{ const p=dir+'/'+k;
        if(FS.isDir(n[k])){ if(found.length<200)go(p); return; }
        const e=EXT(k); const v=String(n[k]);
        if(['html','htm','pdf','fweddle','svg','xhtml','md','txt','json','css','js'].indexOf(e)>=0||/^data:(application\/pdf|image\/)/.test(v))found.push(p); }); })(HOME);
    Portals.all().forEach(p=>{ const d=Portals.dir(p); const n=FS.get(d); if(!FS.isDir(n))return;
      Object.keys(n).forEach(k=>{ if(!FS.isDir(n[k]))found.push(d+'/'+k); }); });
    if(!found.length)return toast('no readable files on the disk yet');
    const r=openBtn.getBoundingClientRect();
    showCtx(r.left,r.bottom,found.slice(0,24).map(p=>({label:p.split('/').pop(),ico:'▸',small:p.replace(HOME,'~'),run:()=>load({path:p})}))); }
  function pickDL(){
    const all=Downloads.all().filter(x=>/^(html|htm|pdf|fweddle|svg|txt|md|json|xhtml)$/.test(EXT(x.name)));
    if(!all.length)return toast('nothing in DOWNLOADS the Fweddler reads');
    const r=openBtn.getBoundingClientRect();
    showCtx(r.left,r.bottom,all.slice(0,24).map(x=>({label:x.name,ico:'▸',small:Resources.fmt(x.size),run:()=>load({dl:x.id})}))); }
  async function save(){
    if(!bytes&&!src)return toast('nothing open');
    const blob=bytes?new Blob([bytes]):new Blob([src],{type:'text/html'});
    await Downloads.add(blob,name||'page.html','',{src:'the Fweddler'});
    toast(name+' → DOWNLOADS'); }

  /* ── the empty state ─────────────────────────────────────────────────── */
  emptyBox.innerHTML='';
  const eh=document.createElement('div'); eh.innerHTML='<b style="color:var(--accent);font-size:1.2em">THE FWEDDLER</b>';
  const ep=document.createElement('small'); ep.innerHTML='Meridian reads the file itself: it parses the markup, resolves the cascade, lays out every box and runs the page’s own JavaScript on an engine written into this file. It reads <b>.html</b>, <b>.pdf</b> and <b>.fweddle</b>.';
  const er=document.createElement('div'); er.className='row';
  const b1=document.createElement('button'); b1.className='btn acc'; b1.textContent='OPEN A FILE'; b1.onclick=()=>picker();
  const b2=document.createElement('button'); b2.className='btn'; b2.textContent='◈ THE EXAMPLE PAGE'; b2.onclick=()=>load({text:SAMPLE,name:'hello.html'});
  er.appendChild(b1); er.appendChild(b2);
  emptyBox.appendChild(eh); emptyBox.appendChild(ep); emptyBox.appendChild(er);

  setMode('page'); paintStatus();
  const ro=new ResizeObserver(()=>{ dirty=true; kick(); }); ro.observe(stage);

  w.app.onClose=()=>{ alive=false; stopRun(); ro.disconnect();
    removeEventListener('keydown',keyHandler); removeEventListener('keyup',keyHandler); };

  /* what we were opened with */
  const arg=w.arg;
  if(arg){ if(typeof arg==='string')load({path:arg});
    else if(arg.path)load({path:arg.path});
    else if(arg.dl)load({dl:arg.dl});
    else if(arg.text!==undefined)load({text:arg.text,name:arg.name});
    else if(arg.bytes)load({bytes:arg.bytes,name:arg.name}); }
},
reopen(w,arg){ /* a second open into the same tile */ }
});
})();
</script>
</body>
</html>
