    const KINDS=['village','city','research station','farm','port','forest settlement','vertical community','underground town','reclaimed district','solarpunk metropolis','frontier outpost','floating community'];
    for(let i=0;i<N;i++){ const lv=Math.round(5+994*Math.pow(i/(N-1),1.35)); const kind=i===0?'village':pick(r,KINDS); const size=kind==='village'||kind==='frontier outpost'?'tiny':kind==='city'||kind==='solarpunk metropolis'?'huge':pick(r,['small','medium','large']); nodes.push({id:'S'+i,type:'settlement',name:cities[i],kind,size,lv,keeper:null,x:Math.cos(i*.31)*(20+i*.9),y:Math.sin(i*.31)*(20+i*.9)}); }
    /* primary routes: each joins two settlements; the first 199 make a tree so everything is reachable, the rest cross-link the web */
    for(let i=0;i<N;i++){ const a=i===0?0:Math.max(0,i-1-Math.floor(r()*Math.min(i,4))); const b=i===0?1:i; if(a===b)continue; const rn={id:'R'+i,type:'route',name:biomes[i%biomes.length],family:biomeFamily(biomes[i%biomes.length]),lv:Math.round((nodes[a].lv+nodes[b].lv)/2),size:pick(r,['short','medium','long','wilderness']),layout:pick(r,['open','ring','canyon','islands','river'])}; nodes.push(rn); E('S'+a,rn.id,'road'); E(rn.id,'S'+b,'road'); }
    for(let k=0;k<60;k++){ const a=Math.floor(r()*N), b=Math.floor(r()*N); if(a===b||Math.abs(nodes[a].lv-nodes[b].lv)>260)continue; const rn={id:'R'+(N+k),type:'route',name:biomes[(N+k)%biomes.length],family:biomeFamily(biomes[(N+k)%biomes.length]),lv:Math.round((nodes[a].lv+nodes[b].lv)/2),size:pick(r,['medium','long']),layout:pick(r,['open','ring','canyon','islands'])}; nodes.push(rn); E('S'+a,rn.id,'road'); E(rn.id,'S'+b,'road'); }
    /* subroutes: caves, ruins, lakes, research stations, deep entrances, portal sites — some rejoin, some end in a secret */
    const SUB=['cave','abandoned structure','lake','island','research station','ruins','hidden settlement','rare habitat','portal site','landmark','deep entrance','shortcut','optional boss','isolated NPC','environmental puzzle']; const routes=nodes.filter(n=>n.type==='route'); let si=0;
    routes.forEach(rt=>{ const n=r()<.5?1:r()<.6?2:3; for(let j=0;j<n;j++){ const kind=pick(r,SUB); const sn={id:'B'+(si++),type:'subroute',kind,name:kind+' off '+rt.name,lv:rt.lv+Math.floor((r()-.3)*40),family:rt.family}; nodes.push(sn); E(rt.id,sn.id,kind==='cave'?'cave':'subroute'); if(kind==='shortcut'||r()<.25){ const other=pick(r,routes); if(other!==rt)E(sn.id,other.id,kind==='shortcut'?'shortcut':'subroute',{oneWay:r()<.3}); } } });
    /* blockages: a road that makes sense to be closed, always with another way round (the tree guarantees it); repairable with a material or a licence found earlier on the spiral */
    edges.forEach((e,i)=>{ if(e.kind==='road'&&i>=400&&r()<.4){ e.blocked=pick(r,BLOCKS); e.repair=r()<.5?'material':'licence:0'; } });
    /* broken portals: pairs of far settlements, needing a licence level that rises with distance; a secret few connect regions that share nothing */
    for(let k=0;k<36;k++){ const a=Math.floor(r()*N), b=Math.floor(r()*N); if(Math.abs(a-b)<20)continue; const lic=Math.min(3,Math.floor(Math.abs(nodes[a].lv-nodes[b].lv)/280)); E('S'+a,'S'+b,r()<.2?'secret portal':'portal',{broken:pick(r,['half a ring','broken wiring','missing components','inactive platform','ancient foundations','overgrown machinery']),repair:'licence:'+lic}); }
    /* licences are earned along the spiral — each is available by a level well below the first portal that needs it */
    const licAt=[40,180,420,700];
    /* 200 Keepers, one per settlement, each with a pin nobody else has */
    const seen=new Set(); nodes.filter(n=>n.type==='settlement').forEach((s,i)=>{ const kr=rngOf('keeper:'+seed+':'+i); const type=i%17===16?null:Math.floor(kr()*16); let pin; do{ pin={shape:pick(kr,PIN_SHAPES),sym:pick(kr,PIN_SYMBOLS),border:pick(kr,PIN_BORDERS),mat:pick(kr,PIN_MATS),hue:Math.floor(kr()*360),hue2:Math.floor(kr()*360),pattern:Math.floor(kr()*5)}; }while(seen.has(JSON.stringify(pin))&&kr()); seen.add(JSON.stringify(pin));
      s.keeper={n:i+1,name:'Keeper '+pick(kr,['Hiss','Stutter','Petal','Thorn','Ripple','Pulse','Glint','Hush','Halo','Corona','Braid','Loom','Cog','Tick','Facet','Splinter','Ember','Frost','Vane','Quill','Tallow','Kestrel','Cairn','Moray','Umber','Yarrow','Zither','Bellows','Dynamo','Ingot','Lumen','Oriole','Rivet','Sorrel','Trellis','Willow','Xenon','Zephyr'])+(i>=38?' '+['II','III','IV','V','VI'][Math.floor(i/38)-1]:''),type,lv:s.lv,specialty:type==null?'every band at once':TYPES[type].name+' '+pick(kr,['stall','rush','swarm','wall','glass cannon','status']),bonus:pick(kr,['capture +4%','mixer discount','shop discount','fruit effects +10%','gym training +10%','rare encounter tips','portal repair +1 rank','scan range +1','map fill','research bonus','storage +1','crafting speed','cosmetic','fast travel node','deep exploration +1','area maker brush','rare recipe','utility']),pin}; });

  /* the validator: reachable from S0 with nothing repaired? with each licence? no repair that needs itself? no dead ends? */

    const withLic=lv=>reach(e=>!e.broken?!e.blocked||e.repair==='material'||(e.repair.startsWith('licence:')&&+e.repair.slice(8)<=lv):(e.repair&&+e.repair.slice(8)<=lv)); const lic0=withLic(0), lic3=withLic(3);

    return {settlements:settlements.length,routes:routes.length,subroutes:subs.length,edges:w.edges.length,keepers:settlements.filter(s=>s.keeper).length,uniquePins:pins.size,reachableUnrepaired:base.size,reachableWithLicence0:lic0.size,reachableWithAllLicences:lic3.size,nodes:w.nodes.length,settlementsUnreachableUnrepaired:settlements.filter(s=>!base.has(s.id)).length,blocked:w.edges.filter(e=>e.blocked).length,brokenPortals:w.edges.filter(e=>e.broken).length,secretPortals:w.edges.filter(e=>e.kind==='secret portal').length,shortcuts:w.edges.filter(e=>e.kind==='shortcut').length,avgDegree:+(degree.reduce((s,d)=>s+d,0)/degree.length).toFixed(2),maxDegree:Math.max(...degree),licenceLoops:loops,levelBands:[5,50,100,200,300,400,500,600,700,800,900,950,999].map(b=>settlements.filter(s=>Math.abs(s.lv-b)<=25).length),biomesUsed:new Set(routes.map(r=>r.name)).size,citiesUsed:new Set(settlements.map(s=>s.name)).size,keeperGates:kg,areasChecked:checked,progression:'WG'}; }

function keeperOf(n){ const s=Land.node('S'+(n-1)); return s?s.keeper:null; }
/* what a pin is worth: most are flavour, a few change the numbers */

  const chosen=await new Promise(res=>{ const p=panel('Doors from the Lamp',{onBack:()=>{ p.close(); res(null); }}); const L=h('div',{class:'menu-list'}); list.forEach(a=>{ const pc=portalOf(a.seed||a.id); pc.draw(1); const c=canvasOf(pc.c); c.style.cssText='width:28px;height:28px;border:1px solid #000'; const b=h('button',{class:'btn','data-nav':'',onclick:()=>{ p.close(); res(a); }}); b.append(c,h('span',{},a.name),h('i',{},`Lv ${a.lv[0]}–${a.lv[1]} · ${(a.table||[]).length} kinds`)); L.append(b); }); p.body.append(L); });
  if(!chosen)return; const [sx,sy]=chosen.spawn||[1,1]; await World.travel(chosen.id,sx,sy,'down'); }

/* ── the START menu ── */
function openBattleMenu(){ const p=panel('Battle'); const L=h('div',{class:'menu-list'}); const item=(l,s,f)=>L.append(h('button',{class:'btn','data-nav':'',onclick:()=>{ Snd.blip(); f(); }},l,h('i',{},s))); item('Auto',Auto.on?'on':'off',()=>{ Auto.toggle(); p.close(); }); item('Entity Atlas','read-only mid-fight',()=>openAtlas()); item('Node Logs','the codex',()=>openCodex()); item('Achievements','',()=>openAchievements()); item('Options','',()=>openOptions()); p.body.append(L); }
function onQuick(q){ if(scene==='battle'){ const cmd=$('#cmd'); const top=UI.top(); if(q==='bag'||q==='party'){ if(!cmd||!top||top.el!==cmd)return toast('wait for your move','pink'); const b=cmd.querySelectorAll('.btn').find(x=>x.textContent===(q==='bag'?'Bag':'Party')); if(b)b.click(); } else if(q==='atlas'){ if(top&&top.el!==cmd)return; openAtlas(); } else if(q==='menu'){ if(top&&top.el!==cmd&&top.el.id!=='textbox')return; openBattleMenu(); } return; } if(scene!=='world'||World.busy||UI.top())return; if(q==='atlas')openAtlas(); else if(q==='party')openParty(); else if(q==='bag')openBag(); else if(q==='menu')openMenu(); }
addEventListener('keydown',e=>{ if((e.key==='t'||e.key==='T')&&scene==='world'&&!UI.top()&&!World.busy&&Net.on){ const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return; e.preventDefault(); openChat(); } });
Input.on(k=>{ if(scene!=='world'||UI.top())return false; if(World.busy)return true; if(k==='a'){ World.interact(); return true; } if(k==='start'){ openMenu(); return true; } if(k==='select'){ openAtlas(); return true; } return false; });
function openMenu(){ Snd.blip(); const p=panel(Play.test?'Playtest':'Menu'); const c=Atlas.counts(); const L=h('div',{class:'menu-list'});
  const item=(label,sub,fn)=>L.append(h('button',{class:'btn','data-nav':'',onclick:fn},label,h('i',{},sub)));
  const mixes=Object.keys(G.atlas).filter(isHybrid).length; item('Entity Atlas',`${c.caught} caught · ${c.seen} met${mixes?' · '+mixes+' mixed':''}`,()=>{ openAtlas(); });
  if(G.bag.license)item('Entity License',`${Object.keys(G.pins||{}).length}/200 pins · ${LIC_NAMES[licRank()-1]||'no licence'}`,()=>openLicense());
  item('Party',`${G.party.length}/${MAXPARTY}`,()=>openParty()); item('Bag',`${G.bag.capsule} capsules · ${G.shards|0} ◆`,()=>openBag());
  if(!Play.test)item('Save',World.a.name,()=>{ saveGame(); p.close(); });
  item('I\'m stuck','step out to the nearest open ground',()=>{ p.close(); const W=World; const P=W.P; const free=(xx,yy)=>W.inb(xx,yy)&&walkable(W.tiles[yy*W.w+xx])&&!W.solidAt(xx,yy); const seen=new Set([P.x+','+P.y]); const q=[[P.x,P.y]]; let found=null; while(q.length&&!found){ const [cx,cy]=q.shift(); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=cx+dx,ny=cy+dy,k=nx+','+ny; if(seen.has(k)||nx<0||ny<0||nx>=W.w||ny>=W.h)continue; seen.add(k); if(free(nx,ny)){ found=[nx,ny]; break; } q.push([nx,ny]); } } if(found){ Object.assign(P,{x:found[0],y:found[1],fx:found[0],fy:found[1],t:1,moving:false}); G.x=P.x; G.y=P.y; Snd.door(); toast('stepped out','lime'); saveGame(true); } else World.travel('shed',null,null,'down'); }); 
  if(!World.a.builtin)item('Return to Portal Plaza','leave this area',async()=>{ p.close(); await World.travel('plaza',9,10,'down'); });
  item('Auto',Auto.on?'on · playing itself':'off',()=>{ Auto.toggle(); p.close(); }); item('Node Logs',`${Object.keys(G.logs||{}).length}/21`,()=>openCodex());
  item('Keeper Pins',`${Object.keys(G.pins||{}).length}/200`,()=>openPins()); item('Save capsule','export · load',()=>capsuleMenu());
  item('Achievements',`${Object.keys(G.ach||{}).length}/${ACH.length}`,()=>openAchievements()); if(G.bag.map)item('World Map','where you have been',()=>openMap()); if(G.bag.fawagatchi)item('Fawagatchi','teleport · sheds · block list',()=>openFawagatchi()); if(G.flags.fruitAtlas)item('Fruit Atlas',`${Object.keys(G.fruitSeen||{}).length}/${FRUIT_N}`,()=>openFruitAtlas());
  item('Online',Net.on?`on · ${Object.keys(Net.ST.here).length} nearby`:'off',()=>openOnline()); item('Chat','T · talk to whoever is linked',()=>openChat());
  item('Options','text, sound, save file',()=>openOptions());
  if(!G.flags.starter||G.flags.testSave)item('MIXING_UNLOCKED_TEST','a save for the mixer',()=>{ mixingTestSave(); p.close(); startGame(false); });
  if(Play.test)item('End playtest','back to the Area Maker',()=>{ UI.clear(); endPlaytest(); }); else item('Title screen','saves first',()=>{ saveGame(true); UI.clear(); toTitle(); });
  p.body.append(h('p',{class:'dim',style:'margin:0 0 8px'},`${World.a.name} · ${fmtTime(G.time)} played`),L); }
const fmtTime=ms=>{ const m=Math.floor(ms/60000); return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`; };

/* party — tap for details; in battle it doubles as the switch picker */
function openParty(opts={}){ const p=panel(opts.title||'Party',{onBack:opts.onBack}); const draw=()=>{ p.body.innerHTML=''; if(opts.note)p.body.append(h('p',{class:'dim',style:'margin:0 0 6px'},opts.note)); const cards=h('div',{class:'cards'});
    G.party.forEach((m,i)=>cards.append(monCard(m,{sel:opts.sel===i,onclick:()=>{ Snd.blip(); if(opts.pick){ opts.pick(i,p); return; } monDetail(m,i,draw); }}))); p.body.append(cards); UI.refocus(); }; draw(); return p; }
function monDetail(m,i,redraw){ const sp=species(m.key); const p=panel(monName(m)); const big=cv(sp.grid.n*6,sp.grid.n*6); ctx2(big).drawImage(entImg(m.key,6),0,0); big.style.cssText='width:120px;height:120px;background:#000;border:1px solid var(--line);flex:none';
  const next=xpAt(m.lv+1)-m.xp; const top=h('div',{style:'display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap'}); top.append(big,h('div',{style:'flex:1;min-width:150px',html:`<div style="font-family:var(--font-big);font-size:22px">${esc(monName(m))}</div><div>Lv ${m.lv} ${tchip(sp.type)}</div><div class="dim" style="font-size:11px;margin:4px 0">${next} xp to Lv ${m.lv+1}${sp.evoLv&&m.lv<sp.evoLv?` · grows at Lv ${sp.evoLv}`:''}</div>
    <div class="statgrid"><span>HP</span>${hpBar(m)}<b>${m.hp}/${stat(m,'hp')}</b>${['atk','def','spd'].map(k=>`<span>${k.toUpperCase()}</span><div class="bar"><i style="width:${Math.min(100,stat(m,k)/(m.lv*1.6+20)*100)}%"></i></div><b>${stat(m,k)}</b>`).join('')}</div>`}));
  const mv=h('div',{class:'movelist',style:'margin-top:10px'}); m.moves.forEach(id=>{ const M=MOVES[id]; const b=h('button',{class:'btn','data-nav':'',style:'grid-column:1/-1;justify-content:flex-start;white-space:normal;text-align:left;gap:8px',onclick:()=>previewMove(m,id)}); b.insertAdjacentHTML('beforeend',`${tchip(M.t)}<span style="flex:1"><b style="font-weight:400">${M.name}</b><br><small class="dim">${esc(moveFlavor(id))} · ${moveDesc(id)}</small></span><span>${M.pow||'—'}</span>`); mv.append(b); });
  const nxt=species(m.key).learn.filter(([l])=>l>m.lv).slice(0,2); if(nxt.length)mv.append(h('div',{class:'dim',style:'grid-column:1/-1;font-size:11px;margin-top:4px'},'Next: '+nxt.map(([l,id])=>MOVES[id].name+' at Lv '+l).join(' · ')));
  const acts=h('div',{class:'row',style:'display:flex;gap:6px;flex-wrap:wrap;margin-top:10px'});
  if(i>0)acts.append(h('button',{class:'btn','data-nav':'',onclick:()=>{ G.party.splice(i,1); G.party.unshift(m); p.close(); redraw&&redraw(); toast(monName(m)+' leads now'); }},'Make lead'));
  acts.append(h('button',{class:'btn','data-nav':'',onclick:async()=>{ const n=prompt('Nickname (leave empty for the species name)',m.nick||''); if(n===null)return; m.nick=n.trim().slice(0,12)||undefined; p.close(); redraw&&redraw(); }},'Nickname'));
  acts.append(h('button',{class:'btn','data-nav':'',onclick:()=>{ Snd.cry(m.key); }},'Cry'));
  acts.append(h('button',{class:'btn','data-nav':'',onclick:()=>{ p.close(); openEntry(m.key); }},'Atlas page'));
  p.body.append(top,h('p',{class:'dim',style:'margin:8px 0 0;font-size:11px'},'Tap a move to preview it.'),mv,acts); }
/* a move, played on a practice dummy */
function previewMove(m,id){ const M=MOVES[id]; const p=panel(M.name); const c=cv(120,64); c.style.cssText='width:100%;max-width:360px;background:#000;border:1px solid var(--line);display:block;margin:0 auto;image-rendering:pixelated'; p.body.append(c,h('div',{style:'text-align:center;margin:6px 0',html:`${tchip(M.t)} · ${moveDesc(id)}`}),h('p',{class:'dim',style:'font-size:11px;text-align:center'},M.t===PLAIN?'PLAIN moves hit every type evenly.':`${TYPES[M.t].name} moves are strong against ${[3,4,5,6].map(d=>TYPES[(M.t+d)%NT].name).join(', ')}${M.t===PLAIN?'':' — and weak against '+[10,11,12,13].map(d=>TYPES[(M.t+d)%NT].name).join(', ')}.`));
  const fx=portalOf('fx:'+M.t,{fam:TYPES[M.t].fx,clear:true}); const me=entImg(m.key,2,'back'); const dummy=entImg('practice dummy',2,'sil'); let t0=performance.now(),raf=0; const loop=now=>{ if(!c.isConnected)return; const t=(now-t0)/1000%2.4; const g2=ctx2(c); g2.fillStyle='#05060f'; g2.fillRect(0,0,120,64); Stars.draw(g2,120,64,now/1000); g2.drawImage(me,Math.round(22+(t<.3?t*30:t<.6?(0.6-t)*30:0)),Math.round(40-me.height/2)); const hit=t>.5&&t<1.3; g2.globalAlpha=hit&&((now/60|0)%2)?0:1; g2.drawImage(dummy,Math.round(88-dummy.width/2+(hit?Math.sin(now/22)*2:0)),Math.round(30-dummy.height/2)); g2.globalAlpha=1; if(t>.35&&t<1.1){ const pc=fx.draw(now/1000*3); const k=(t-.35)/.75; const sz=Math.round(30+k*26); g2.globalAlpha=Math.sin(k*Math.PI); g2.drawImage(pc,0,0,32,32,88-sz/2,30-sz/2,sz,sz); g2.globalAlpha=1; } if(hit&&M.pow){ g2.fillStyle=TYPES[M.t].col; g2.font='10px "Px Pixeloid Sans"'; g2.fillText('-'+(M.pow||'?'),98,14); } raf=requestAnimationFrame(loop); }; raf=requestAnimationFrame(loop); Snd.hit(M.pow?1:0); }

/* bag */
function openBag(opts={}){ const p=panel('Bag',{onBack:opts.onBack}); const draw=()=>{ p.body.innerHTML=''; const L=h('div',{class:'menu-list'}); L.append(h('div',{class:'dim',style:'font-size:11px'},`${G.shards|0} shards`));
  for(const k of [...CAP_IDS,'tonic','big','reboot','candy']){ const n=G.bag[k]||0; if(!n&&!['capsule','tonic'].includes(k))continue; const ic=isCapsule(k)?capIcon(k,16,1):null; const b=h('button',{class:'btn','data-nav':'',disabled:n<=0,onclick:()=>use(k)}); if(ic){ ic.style.cssText='width:24px;height:24px'; b.append(ic); } else b.append(h('span',{style:`display:inline-block;width:14px;height:18px;background:${k==='big'?'var(--accent2)':k==='reboot'?'var(--accent)':k==='candy'?'var(--sun)':'var(--lime)'};border:1px solid #000;box-shadow:inset 0 -6px 0 #0004`})); b.append(h('span',{},ITEMS[k].name),h('i',{},'×'+n)); L.append(b); }
  const eat=(k,F,list)=>openParty({title:'Who eats it?',pick:async(i,pp)=>{ pp.close(); const m=G.party[i]; for(const f of list)await eatFruit(f,m); G.bag[k]--; if(G.bag[k]<=0){ delete G.bag[k]; if(k.startsWith('sm:'))delete G.smoothies[k]; } toast(monName(m)+' ate the '+F.name,'lime'); saveGame(true); draw(); }});
  const fr=Object.keys(G.bag).filter(k=>(k.startsWith('fr:')||k.startsWith('sm:'))&&G.bag[k]>0); if(fr.length){ L.append(h('div',{class:'dim',style:'font-size:11px;margin-top:6px'},'Fruit & smoothies')); fr.forEach(k=>{ const sm=k.startsWith('sm:')?smoothieOf(k):null; const F=sm||fruitOf(+k.slice(3)); const list=sm?sm.fx.concat([{fx:sm.tonic==='big'?'full':'heal',n:30}]):[F]; const b=h('button',{class:'btn','data-nav':'',onclick:()=>eat(k,F,list)}); b.append(h('span',{style:`display:inline-block;width:12px;height:${sm?18:12}px;background:${sm?'linear-gradient(#ff7ce8,#7cf5ff)':F.col};border:1px solid #000;border-radius:${sm?2:50}%`}),h('span',{},F.name),h('i',{style:'white-space:normal;text-align:right;max-width:55%'},'×'+G.bag[k]+' · '+(sm?sm.fx.map(x=>x.desc).join(', '):F.desc))); L.append(b); }); }
  const keys=Object.keys(ITEMS).filter(k=>ITEMS[k].key&&G.bag[k]); if(keys.length){ L.append(h('div',{class:'dim',style:'font-size:11px;margin-top:6px'},'Key items')); keys.forEach(k=>{ const T=ITEMS[k]; const on=k==='share'?G.share!==false:null; const b=h('button',{class:'btn'+(on?' on':''),'data-nav':'',onclick:()=>{ Snd.blip(); if(T.toggle){ G.share=!(G.share!==false); toast('XP Share '+(G.share?'on':'off'),G.share?'lime':'pink'); saveGame(true); draw(); } else if(k==='map')openMap(); else if(k==='fawagatchi')openFawagatchi(); else if(k==='blender')openBlender(); else toast(T.name); }}); b.append(h('span',{style:`display:inline-block;width:14px;height:14px;background:${k==='banana'?'var(--sun)':k==='share'?'var(--accent)':'var(--violet)'};border:1px solid #000;box-shadow:inset 1px 1px 0 #fff8`}),h('span',{},T.name+(on!=null?(on?' · ON':' · OFF'):'')),h('i',{style:'white-space:normal;text-align:right;max-width:55%'},T.desc)); L.append(b); }); }
  p.body.append(L,h('p',{class:'dim',style:'margin:10px 0 0;font-size:12px'},'Capsules are thrown from the battle menu. Tonics work anywhere. 3D printers turn shards into anything you have a blueprint for.')); UI.refocus(); };
  const use=k=>{ if(isCapsule(k)){ if(opts.battle){ p.close(); opts.onUse(k); } else toast('throw capsules in battle'); return; }
    if(k==='candy'&&opts.battle){ toast('not in battle'); return; }
    openParty({title:'Use '+ITEMS[k].name+' on…',pick:(i,pp)=>{ const m=G.party[i]; const mx=stat(m,'hp'); if(k==='reboot'){ if(m.hp>0)return toast('it hasn\'t fainted'); m.hp=Math.floor(mx/2); m.st=null; } else if(k==='candy'){ if(m.lv>=MAXLV)return toast('already at the cap'); m.lv++; m.xp=Math.max(m.xp,xpAt(m.lv)); m.hp=Math.min(stat(m,'hp'),m.hp+(stat(m,'hp')-mx)); Snd.level(); } else { if(m.hp<=0)return toast('it needs a Reboot or a Relay Node','pink'); if(m.hp>=mx&&!m.st)return toast('already healthy'); } const before=m.hp; if(k==='tonic')m.hp=Math.min(mx,m.hp+30); if(k==='big'){ m.hp=mx; m.st=null; } G.bag[k]--; Snd.buff(true); pp.close(); if(opts.battle){ p.close(); opts.onUse(k,m,m.hp-before); } else { toast(k==='candy'?`${monName(m)} is level ${m.lv}`:`${monName(m)} +${m.hp-before} hp`,'lime'); draw(); } }}); };
  draw(); return p; }



/* ═══ the last page. twenty gems light the ring and something is standing in it, wearing your cap ═══ */
async function selfBattle(o){ if(!G.party.some(m=>m.hp>0)){ toast('your party is out cold','pink'); return; }
  if(!G.flags.selfIntro){ await Text.lines(['It has your cap on backwards. It has the shirt.','It does not say anything. It points at the capsules on your belt, then at itself.'],{who:'?'}); G.flags.selfIntro=1; }
  const lv=Math.min(999,Math.max(60,Math.max(...G.party.map(m=>m.lv))+20)); const boss=makeMon(BOSS_KEY,lv);
  World.busy=true; const res=await Battle.run({wild:boss,boss:true}); World.busy=false;
  if(res==='caught'){ G.flags.self=1; World.objs=World.objs.filter(q=>!q.self); saveGame(true); await Text.lines(['The capsule stops rocking.','You caught yourself. Page 1,000,000 is filled in, and it is you.','Nobody else could have done that. Nobody else was allowed to.'],{who:'Ring Operator'}); }
  else await Text.say('It straightens its cap and walks back to the far side of the ring. It can wait.',{who:'?'}); }

      const wear=()=>{ applyFit(); saveGame(true); draw(); };
      if(mode==='salon'){ if(slot==='skin'||slot==='hairCol'){ const row=h('div',{style:'display:flex;flex-wrap:wrap;gap:5px;justify-content:center'}); SALON[slot].forEach(col=>row.append(SWATCH(col,G.fit[slot]===col,()=>{ G.fit[slot]=col; Snd.blip(); wear(); }))); p.body.append(row);
          const any=h('div',{style:'display:flex;gap:6px;align-items:center;justify-content:center;margin-top:8px'}); const inp=h('input',{type:'color',value:/^#[0-9a-f]{6}$/i.test(G.fit[slot]||'')?G.fit[slot]:'#f2a47c',style:'width:44px;height:30px;padding:0;border:1px solid var(--line);background:none'}); inp.oninput=()=>{ G.fit[slot]=inp.value; applyFit(); prev.querySelectorAll('canvas').forEach((c,i)=>{ const d=['down','left','up'][i]; const x=ctx2(c); x.clearRect(0,0,16,20); x.drawImage(HERO[d][0],0,0); }); }; inp.onchange=()=>{ G.fit[slot]=inp.value; Snd.blip(); wear(); }; any.append(h('span',{class:'dim',style:'font-size:11px'},'or any colour at all:'),inp); p.body.append(any); }
        else { const L=h('div',{class:'menu-list'}); SALON[slot].forEach(([id,name])=>{ const on=(G.fit[slot]??FIT_DEFAULT[slot])===id; const b=h('button',{class:'btn'+(on?' on':''),'data-nav':'',onclick:()=>{ G.fit[slot]=id; Snd.blip(); wear(); }}); b.append(h('span',{},name),h('i',{},on?'now':'')); L.append(b); }); p.body.append(L); }
        p.body.append(h('p',{class:'dim',style:'font-size:11px;margin:8px 0 0'},'Free. Change it as often as you like.')); }
      else { const L=h('div',{class:'menu-list'}); WARDROBE[slot].forEach(([id,name,cost])=>{ const owned=cost===0||!!G.wardrobe[slot+':'+id]; const worn=(G.fit[slot]||FIT_DEFAULT[slot])===id; const b=h('button',{class:'btn'+(worn?' on':''),'data-nav':'',disabled:!owned&&(G.shards|0)<cost,onclick:()=>{ if(!owned){ G.shards-=cost; G.wardrobe[slot+':'+id]=1; Snd.caught(); toast('bought '+name,'lime'); } else Snd.blip(); G.fit[slot]=id; wear(); }}); b.append(h('span',{},name),h('i',{},worn?'wearing':owned?'owned':cost+' ◆')); L.append(b); });

    if(e==='def-')await stage(os,'def',-(secondary?1:n)); else if(e==='atk-')await stage(os,'atk',-(secondary?1:n)); else if(e==='spd-')await stage(os,'spd',-(secondary?1:n));
    else if(e==='atk+')await stage(side,'atk',n); else if(e==='def+')await stage(side,'def',n); else if(e==='spd+')await stage(side,'spd',n);
    else if(e==='atkspd+'){ await stage(side,'atk',1); await stage(side,'spd',1); }
    else if(e==='heal')await heal(side,M.n||.5); else if(e==='cure')await heal(side,M.n||.4,true);
    else if(STATUS[e])await setStatus(os,e);
    else if(e==='clearstages'){ S.stg.me={atk:0,def:0,spd:0}; S.stg.foe={atk:0,def:0,spd:0}; Snd.buff(false); await quick('All stat changes were wiped.'); }
    else if(e==='slow')await stage(os,'spd',-1); else if(e==='flinch'){ S.flinch[os]=1; await quick(`${Label(os)} flinched!`); }
    else if(e==='trap'){ if(!S.trap[os]){ S.trap[os]=1; await quick(`${Label(os)} can't get away now!`); } }
    else if(e==='guard'){ S.guard[side]=2; Snd.buff(true); Fx.shield(side,'#7cf5ff',layout()); await quick(`${Label(side)} braced itself.`); }
    else if(e==='swap'){ const g2=S.stg[side]; [g2.atk,g2.def]=[g2.def,g2.atk]; Snd.buff(true); await quick(`${Label(side)} swapped its attack and defence!`); } }

  async function useMove(side,id){ const A=mon(side), D=mon(other(side)), os=other(side); let M=MOVES[id]||MOVES.bump;
    if(A.sts&&A.sts.length){ for(const s of A.sts.slice()){ const ST=STATUS[s.id]; if(ST&&ST.turns){ s.t--; if(s.t<=0){ A.sts.splice(A.sts.indexOf(s),1); syncSt(A); hud(); await quick(`${Label(side)} shook off ${ST.name.toLowerCase()}.`); } } } for(const s of A.sts){ const ST=STATUS[s.id]; if(ST&&ST.skip&&Math.random()<ST.skip){ Snd.bump(); anim('shake',{who:side,until:performance.now()+300}); await quick(`${Label(side)} ${ST.say} and can't move!`); return; } } }
    if(A.st==='loop'&&S.last[side]&&S.last[side]!==M){ M=S.last[side]; id=Object.keys(MOVES).find(k=>MOVES[k]===M); await quick(`${Label(side)} is looping…`); }
    if(S.flinch[side]){ S.flinch[side]=0; await quick(`${Label(side)} flinched and couldn't move!`); return; }
    if(A.st==='glitch'&&Math.random()<STATUS.glitch.self){ const d=Math.max(1,Math.floor(A.lv/2)+5); A.hp=Math.max(0,A.hp-d); Snd.hit(1); anim('shake',{who:side,until:performance.now()+260}); hud(); await quick(`${Label(side)} glitched and hit itself (−${d})!`); return; }
    if(A.charge&&S.cd[side]<=0){ A.charge=0; await useActive(side); if(!alive(A)||!alive(D))return; hud(); } A.charge=0;
    if(side==='me')S.lastMyMove=M.name; if(!S.spreadQuiet)await quick(`${Label(side)} used ${M.name}!${S.spread?' (everyone)':''}`); Fx.cast(side,M,layout()); anim('atk',{who:side,until:performance.now()+460,dur:460}); await wait(220);
    const selfMove=!M.pow&&['atk+','def+','spd+','atkspd+','heal','cure','guard','swap'].includes(M.e);
    if(!selfMove&&S.dodge[os]>0){ S.dodge[os]--; Snd.miss(); await quick(`${Label(os)} isn't there. (${abilityName(D,'active')})`); return; }
    if(!selfMove&&Math.random()>M.acc*(hasSt(A,'blind')?STATUS.blind.acc:1)*(passiveOf(A).id==='focus'?1+passiveOf(A).p/100:1)){ Snd.miss(); await quick(`…but it missed.`); if(M.e==='crash'){ const d=Math.max(1,Math.floor(stat(A,'hp')/4)); A.hp=Math.max(0,A.hp-d); hud(); Snd.hit(1); await quick(`${Label(side)} crashed and took ${d} damage!`); } return; }
    if(M.pow&&S.guard[os]>0){ S.guard[os]=0; Snd.bump(); anim('shake',{who:os,until:performance.now()+200}); Fx.shield(os,'#7cf5ff',layout()); camShake(2,200); await quick(`${Label(os)} blocked it!`); return; }
    const echoed=M.e==='echo'&&S.last[side]===M; S.last[side]=M; const wildPow=M.e==='wild'?10+Math.floor(Math.random()*141):0;
    if(M.pow||wildPow){ const hits=M.e==='multi'?2+Math.floor(Math.random()*((M.n||3)-1)):1; let total=0,last=null,n=0;
      if(wildPow)await quick(`Power ${wildPow}!`); if(echoed)await quick('It echoes — double power!');
      { const pa=passiveOf(A); if(hits===1&&pa.id==='echo'&&Math.random()<pa.p/100){ hits=2; await quick(`${Label(side)} echoes. (${abilityName(A,'passive')})`); } }
      for(let i=0;i<hits&&D.hp>0;i++){ if(i>0){ anim('atk',{who:side,until:performance.now()+300,dur:300}); await wait(140); } const r=damage(side,M,(wildPow||M.pow)*(echoed?2:1)); last=r; n++; const big=(wildPow||M.pow)>=90||r.crit||r.e>1; Fx.impact(os,M,big,layout()); if(r.e>1||r.crit)anim('flash',{until:performance.now()+120,dur:120,col:r.crit?'#fff':TYPES[M.t].col}); await wait(70); total+=Math.min(D.hp,r.d); D.hp=Math.max(0,D.hp-r.d); Snd.hit(r.e); anim('hurt',{who:os,until:performance.now()+420,dur:420}); hud(); await wait(hits>1?320:520); if(r.crit)await quick('A lucky hit!'); }
      if(total>0&&A.hp>0){ const pd=passiveOf(D), pa=passiveOf(A); if(pd.id==='spines'){ const d=Math.max(1,Math.floor(stat(A,'hp')*pd.p/100)); A.hp=Math.max(0,A.hp-d); anim('shake',{who:side,until:performance.now()+220}); hud(); await quick(`${Label(side)} is pricked (−${d}). (${abilityName(D,'passive')})`); } if(pd.id==='venom'&&Math.random()<pd.p/100&&D.hp>0&&A.hp>0)await setStatus(side,'poison'); if(pd.id==='static'&&Math.random()<pd.p/100&&D.hp>0&&A.hp>0)await setStatus(side,'static'); if(pa.id==='drain'&&A.hp>0&&A.hp<stat(A,'hp')){ const add=Math.max(1,Math.floor(total*pa.p/100)); A.hp=Math.min(stat(A,'hp'),A.hp+add); Fx.sparkle(side,'#b6ff5c',layout()); hud(); await quick(`${Label(side)} siphons ${add}. (${abilityName(A,'passive')})`); } }
      if(last&&last.e>1)await quick('It\'s super effective!'); else if(last&&last.e<1)await quick('It\'s not very effective…');
      if(hits>1)await quick(`Hit ${n} time${n>1?'s':''}!`);
      if(M.e==='recoil'&&total>0&&A.hp>0){ const d=Math.max(1,Math.floor(total/4)); A.hp=Math.max(0,A.hp-d); hud(); Snd.hit(1); await quick(`${Label(side)} is hurt by the recoil (−${d}).`); }
      if((M.e==='drain'||M.e==='leech')&&total>0&&A.hp>0){ const add=Math.min(stat(A,'hp')-A.hp,Math.ceil(total/2)); if(add>0){ A.hp+=add; hud(); Snd.buff(true); await quick(`${Label(side)} drank back ${add} health.`); } }
      if(M.c&&M.e&&D.hp>0&&Math.random()<M.c)await effect(side,M,true);
    } else { if(!selfMove){ Fx.impact(os,M,false,layout()); await wait(120); } await effect(side,M,false); } }

  /* ── the other side's brain ── */
  function foeChoose(){ const F=S.foe, T=S.me; if(S.mode!=='tamer'&&Math.random()<.3)return pick(Math.random,F.moves);
    const sc=F.moves.map(id=>{ const M=MOVES[id]; let s; if(M.pow){ s=M.pow*M.acc*eff(M.t,species(T.key).type)*(M.t===species(F.key).type?1.25:1); if(M.e==='multi')s*=2.2; if(M.e==='drain'&&F.hp<stat(F,'hp')*.6)s*=1.3; }
      else if(M.e==='heal'||M.e==='cure')s=F.hp<stat(F,'hp')*.4?140:(M.e==='cure'&&F.st?90:2); else if(M.e==='fray'||M.e==='lock'||M.e==='glitch')s=T.st?2:48; else if(M.e==='guard')s=22; else if(M.e==='wild')s=60; else if(M.e==='trap'||M.e==='swap')s=18; else if(M.e.endsWith('+'))s=S.stg.foe[M.e.slice(0,3)]>=2?2:36; else s=34; return [id,s*(.65+Math.random()*.7)]; });
    sc.sort((a,b)=>b[1]-a[1]); return sc[0][0]; }

  /* ── XP, levels, new moves ── */
  async function learn(m,id){ if(m.moves.includes(id))return; const M=MOVES[id]; if(m.moves.length<MAXMOVES){ m.moves.push(id); Snd.level(); await msg(`${monName(m)} learned ${M.name}!`); return; }
    const c=await learnBox(m,id);
    if(c>=0&&c<m.moves.length){ const old=MOVES[m.moves[c]].name; m.moves[c]=id; Snd.level(); await msg(`1, 2, and… poof! ${monName(m)} forgot ${old} and learned ${M.name}!`); } else await msg(`${monName(m)} did not learn ${M.name}.`); }
  /* xp lands silently and is reported in one brick; level-ups and the moves they bring come after, in order */
  function applyXP(m,n){ if(!alive(m)||m.lv>=MAXLV)return null; const from=m.lv; m.xp+=n; const toLearn=[]; while(m.lv<MAXLV&&m.xp>=xpAt(m.lv+1)){ const oldMax=stat(m,'hp'); m.lv++; m.hp+=stat(m,'hp')-oldMax; for(const [l,id] of species(m.key).learn)if(l===m.lv)toLearn.push(id); const sp=species(m.key); if(sp.evoLv&&m.lv>=sp.evoLv)m.evo=1; } return {m,n,from,to:m.lv,toLearn}; }
  async function gainXPAll(list){ const rows=list.map(([m,n])=>applyXP(m,n)).filter(Boolean); if(!rows.length)return; hud(); if(rows.some(r=>r.to>r.from))Snd.level(); await msg(rows.map(r=>`${monName(r.m)} +${r.n} xp${r.to>r.from?` → Lv ${r.to}!`:''}`).join('\n'),{auto:1400+rows.length*300}); for(const r of rows)for(const id of r.toLearn)await learn(r.m,id); }
  async function gainXP(m,n){ await gainXPAll([[m,n]]); }

  /* ── faints and replacements ── */
  async function faintAnim(side){ Snd.faint(); const m=mon(side); const s=spot(side,layout()); for(let i=0;i<12;i++)Fx.dust(s.x,s.y,m); camShake(2,300); await tween(640,p=>{ S.anim.faint[m.id]=p; }); }
  /* sending out: the thrower lobs the capsule (whatever hardware the Entity was caught on), it pops with a flash, and the Entity springs out of it */
  function leaveThrower(side){ S.tOut=S.tOut||{}; S.tOut[side]=performance.now(); if(side==='me')S.showM='mon'; else S.showF='mon'; }
  async function sendOut(side,m,first,slot,stay){ const arr=fieldOf(side); for(let i=0;i<arr.length;i++){ if(arr[i]===m||(arr[i]&&arr[i].id===m.id)){ if(slot==null||i!==slot){ arr[i]=null; if(HUDS[side][i]){ HUDS[side][i].remove(); HUDS[side][i]=null; } } } } S.tIn=S.tIn||{}; if((side==='me'?S.showM:S.showF)!==(side==='me'?'hero':'tamer'))S.tIn[side]=performance.now(); if(S.tOut)S.tOut[side]=0; if(slot==null){ slot=arr.findIndex(x=>!x||S.gone.has(x.id)); if(slot<0)slot=arr.length; } const kind=m.cap||(side==='foe'&&S.tamer&&S.tamer.cap)||'capsule'; m.bs={}; m.slot=slot; m.charge=0;
    if(side==='me'){ S.used.add(m); S.showM='hero'; } else { const n=Atlas.battle(m.key); S.pieces[m.key]=(S.pieces[m.key]||0)+n; if(!S.foes.some(up))S.bg=portalOf(species(m.key).base); S.showF='tamer'; } hud();
    anim('throw',{who:side,kind,slot,key:m.key,until:performance.now()+(S.n>1?700:900),dur:S.n>1?700:900}); Snd.throw(); await wait(S.n>1?300:380); Snd.hit(1); await wait(S.n>1?120:180); Snd.pop();
    arr[slot]=m; S.gone.delete(m.id); S.anim.faint[m.id]=0; bindPair(side==='me'?m:(S.mes.find(up)||S.mes[0]||null),side==='foe'?m:(S.foes.find(up)||S.foes[0]||null)); for(const k of PER)S[k][side]=dflt(k);
    const s=spotM(m,layout()); Fx.implode(s.x,s.y,TYPES[species(m.key).type].col); anim('flash',{until:performance.now()+120,dur:120,col:TYPES[species(m.key).type].col});
    anim('spawn',{who:side,m:m.id,until:performance.now()+520,dur:520}); if(!stay)leaveThrower(side); if(!HUDS[side][slot])HUDS[side][slot]=mkHud(side,slot); hud(); Snd.cry(m.key); await quick(side==='me'?`Go, ${monName(m)}!`:`${S.tamer.name} sent out ${monName(m)}!`); }
  async function forcedSwitch(){ return new Promise(res=>{ const p=openParty({title:'Who goes next?',note:'Pick an Entity that can still battle.',onBack:()=>{},pick:(i,pp)=>{ const m=G.party[i]; if(m.hp<=0)return toast('that one has no health left','pink'); if(S.roster&&!S.roster.includes(m))return toast('not in this bout','pink'); if(onField(m)&&up(m))return toast(monName(m)+' is already out','pink'); pp.close(); res(m); }}); const b=p.hd.querySelector('.btn'); b&&b.remove(); }); }
  async function pickRoster(N){ const out=[]; for(let i=0;i<N;i++){ const m=await new Promise(res=>{ const p=openParty({title:`Pick #${i+1} of ${N}`,note:out.length?'Picked: '+out.map(monName).join(', '):'Who fights first?',onBack:()=>{},pick:(j,pp)=>{ const mm=G.party[j]; if(mm.hp<=0)return toast('that one has no health left','pink'); if(out.includes(mm))return toast('already picked','pink'); pp.close(); res(mm); }}); const b=p.hd.querySelector('.btn'); b&&b.remove(); }); out.push(m); } return out; }
  async function checkFaints(){ let swapped=false;
    for(const m of [...S.mes,...S.foes]){ if(!m||m.hp>0||S.gone.has(m.id)||passiveOf(m).id!=='sturdy'||bsOf(m,'sturdyUsed'))continue; const so=slotOf(m); bindPair(so[0]==='me'?m:(alivePick('me')||S.mes[0]),so[0]==='foe'?m:(alivePick('foe')||S.foes[0])); S.sturdyUsed[so[0]]=1; m.hp=1; hud(); anim('flash',{until:performance.now()+140,dur:140,col:'#fff'}); await quick(`${Label(so[0])} holds on with 1 ESP! (${abilityName(m,'passive')})`); }
    if(S.boss&&S.foe&&S.foe.hp<=0){ S.foe.hp=1; hud(); anim('flash',{until:performance.now()+220,dur:220,col:'#fff'}); camShake(4,300); await quick('It goes down. It gets up.'); await msg('"Not like that," it says, and straightens its cap. "Catch me."'); return null; }
    for(let i=0;i<S.foes.length;i++){ const f=S.foes[i]; if(!f||f.hp>0||S.gone.has(f.id))continue; bindPair(alivePick('me')||S.mes[0],f); await faintAnim('foe'); await msg(`${Label('foe')} faded out!`); S.gone.add(f.id); hud(); const sp=species(f.key); const base=Math.max(1,Math.floor(sp.xp*f.lv/6*(S.mode==='tamer'?1.4:1)*(G.bag.banana?1.5:1)));
      const part=[...S.used].filter(m=>alive(m)&&G.party.includes(m)); const gains=part.map(m=>[m,onField(m)?base:Math.max(1,Math.floor(base/2))]); if(G.bag.share&&G.share!==false){ const rest=G.party.filter(m=>alive(m)&&!part.includes(m)); rest.forEach(m=>gains.push([m,Math.max(1,Math.floor(base/2))])); } await gainXPAll(gains); hud();
      if(S.mode==='tamer'){ const next=S.foeParty.find(m=>alive(m)&&!onField(m)); if(next){ S.used=new Set(S.mes.filter(up)); await sendOut('foe',next,false,i); swapped=true; } } }
    if(!S.foes.some(up))return 'win';
    for(let i=0;i<S.mes.length;i++){ const p=S.mes[i]; if(!p||p.hp>0||S.gone.has(p.id))continue; bindPair(p,alivePick('foe')||S.foes[0]); await faintAnim('me'); await msg(`${monName(p)} faded out!`); S.gone.add(p.id); hud();
      const pool=(S.roster||G.party).filter(m=>alive(m)&&!onField(m)); if(!S.mes.some(up)&&!pool.length)return 'lose'; if(pool.length){ const m=S.n>1?pool[0]:await forcedSwitch(); await sendOut('me',m,false,i); swapped=true; } }
    return swapped?'swap':null; }

  /* ── the capsule ── */
  async function throwCapsule(kind='capsule'){ if(S.mode==='tamer'){ Snd.bump(); await msg(`${S.tamer.name} knocks the capsule away! You can't capsule someone else's Entity.`); return false; }
    if((G.bag[kind]|0)<=0){ await msg('You\'re out of '+ITEMS[kind].name+'s.'); return 'nothing'; }
    G.bag[kind]--; const L=layout(); Snd.throw(); await quick(`You threw a ${ITEMS[kind].name}!`);
    S.cap={phase:'fly',kind,t0:performance.now(),x0:L.mx+10,y0:L.my-L.ms*10,x1:L.fx,y1:L.fy-Math.max(4,Math.round(L.fs*2))-2}; const trail=setInterval(()=>{ const C=S&&S.cap; if(!C||C.phase!=='fly')return clearInterval(trail); const p=Math.min(1,(performance.now()-C.t0)/520); Fx.spawn({x:C.x0+(C.x1-C.x0)*p,y:C.y0+(C.y1-C.y0)*p-Math.sin(p*Math.PI)*L.A*.35,vx:-20+Math.random()*40,vy:20+Math.random()*30,life:340,col:Math.random()<.5?'#fff':'#b6ff5c',size:2,shrink:1}); },24); await wait(540); clearInterval(trail); { const s=spot('foe',L); Fx.implode(s.x,s.y,'#e8ffff'); camShake(3,220); }
    Snd.pop(); anim('flash',{until:performance.now()+260,dur:260,col:'#e8ffff'}); S.foeHidden=true; hud(); S.cap.phase='sit'; await wait(450);
    const sp=species(S.foe.key), mx=stat(S.foe,'hp'); let p=sp.rate*(1-.72*S.foe.hp/mx)*(S.foe.st?1.35:1)*(S.shadow?1.15:1)*(S.foe.lv>20?.85:1)*((CAPSULES[kind]||{}).mult||1)*((G.buff&&G.buff.luck)||1); if(G.buff)G.buff.luck=1; p=clamp(p,.03,.985); const per=Math.pow(p,1/3);
    let w=0; for(;w<3;w++){ S.cap.phase='wob'; S.cap.wt0=performance.now(); Snd.wobble(); for(let i=0;i<5;i++)Fx.spawn({x:S.cap.x1-8+Math.random()*16,y:L.fy,vx:Math.random()*40-20,vy:-10-Math.random()*20,ay:60,life:420,col:'#9aa3d1',size:2,shrink:1}); Fx.spawn({x:S.cap.x1,y:S.cap.y1,kind:'ring',size:22,life:360,col:'#fff'}); await wait(760); if(Math.random()>per)break; }
    if(w===3){ S.cap.phase='caught'; S.foe.cap=kind; Snd.caught(); Fx.pop(S.cap.x1,S.cap.y1,'#b6ff5c'); for(let i=0;i<30;i++)Fx.spawn({x:S.cap.x1,y:S.cap.y1,vx:Math.random()*160-80,vy:-60-Math.random()*120,ay:200,life:900,col:HOLO[i%6],size:i%3?2:3,kind:i%4?'px':'tri',rot:Math.random()*6,spin:6,shrink:1,t0:performance.now()+Math.random()*150}); for(let i=0;i<3;i++)Fx.spawn({x:S.cap.x1,y:S.cap.y1,kind:'ring',size:60,life:520,col:i?'#b6ff5c':'#fff',t0:performance.now()+i*120}); anim('flash',{until:performance.now()+220,dur:220,col:'#b6ff5c'}); camShake(4,400); await wait(700); return true; }
    S.cap=null; S.foeHidden=false; Snd.pop(); anim('flash',{until:performance.now()+200,dur:200,col:'#ff7ce8'}); hud(); await msg(['Oh no! It popped right out!','Argh! Almost had it!','So close! The clover flickered out.'][w]); return false; }

  /* ── one turn ── */
  function order(myId,foeId){ let pm=MOVES[myId].e==='prio'?1:0, pf=MOVES[foeId].e==='prio'?1:0; if(S.turnN===1){ if(passiveOf(S.me).id==='quick')pm+=2; if(passiveOf(S.foe).id==='quick')pf+=2; } if(pm!==pf)return pm>pf?['me','foe']:['foe','me'];

/* ═══════════════════════════════════════════════════════════════
   9 · THE ENTITY ATLAS — sixteen pieces a page. Battles hand you a
       couple at a time; a capsule hands you the whole page.
   ═══════════════════════════════════════════════════════════════ */
const Jig=(()=>{
  const N=64, P=16; const owners={}; const comps={};
  /* which piece owns each pixel — square cells with round knobs, knob directions seeded by the species */
  function ownerMap(key){ if(owners[key])return owners[key]; const r=rngOf('jig:'+key); const hz=[],vt=[]; for(let i=0;i<12;i++){ hz.push(r()<.5?1:-1); vt.push(r()<.5?1:-1); }
    const o=new Int8Array(N*N); const knob=(px,py,cx,cy)=>{ const dx=px+.5-cx,dy=py+.5-cy; return dx*dx+dy*dy<=10.5; };
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){ let cx=x>>4,cy=y>>4; let own=cy*4+cx;
      /* vertical edges: between column c and c+1 */
      for(let c=0;c<3;c++){ const ex=(c+1)*P; for(let rr=0;rr<4;rr++){ const d=hz[rr*3+c]; const kx=ex+d*2.6, ky=rr*P+8; if(knob(x,y,kx,ky)){ own=rr*4+(d>0?c:c+1); } } }
      for(let rr=0;rr<3;rr++){ const ey=(rr+1)*P; for(let c=0;c<4;c++){ const d=vt[rr*4+c]; const ky=ey+d*2.6, kx=c*P+8; if(knob(x,y,kx,ky)){ own=(d>0?rr:rr+1)*4+c; } } }
      o[y*N+x]=own; }
    return owners[key]=o; }

  function composite(key,t,still){ const ck=key+(still?'@s':''); let C=comps[ck]; if(!C){ C=comps[ck]={c:cv(N,N),p:portalOf(species(key).base),last:-1}; C.c.getContext('2d',{willReadFrequently:true}); }
    if(still&&C.last>=0)return C.c; const q=Math.floor(t*12); if(q===C.last)return C.c; C.last=q; const x=ctx2(C.c); x.drawImage(C.p.draw(still?1:t),0,0,32,32,0,0,N,N); x.fillStyle='rgba(5,6,15,.18)'; x.fillRect(0,0,N,N);
    const sp=species(key), n=sp.grid.n, sc=Math.max(1,Math.floor(54/n)); const im=entImg(key,sc); const ox=(N-im.width)>>1, oy=(N-im.height)>>1; x.fillStyle='rgba(0,0,0,.5)'; x.fillRect(ox+3,oy+im.height-1,im.width-6,2); x.drawImage(im,ox,oy); return C.c; }

  function paint(out,key,mask,t,{caught=false,still=false,glow=-1}={}){ const src=composite(key,t,still).getContext('2d',{willReadFrequently:true}).getImageData(0,0,N,N).data; const g2=out.getContext('2d',{willReadFrequently:true}); const im=g2.createImageData(N,N); const d=im.data; const o=ownerMap(key);

      if(on){ r=src[j]; gg=src[j+1]; b=src[j+2]; if(edge&&!caught){ const nOn=(mask>>(rt!==w?rt:dn))&1; if(nOn){ r*=.72; gg*=.72; b*=.72; } else { r=0; gg=0; b=0; } } if(w===glow){ r=Math.min(255,r+70); gg=Math.min(255,gg+70); b=Math.min(255,b+90); } }
      else { const chk=((w&1)^((w>>2)&1)); r=chk?11:18; gg=chk?13:21; b=chk?26:42; if(((x+y)&7)===0){ r+=12; gg+=14; b+=30; } if(edge){ const nOn=(mask>>(rt!==w?rt:dn))&1; if(nOn){ r=0; gg=0; b=0; } else { r=42; gg=47; b=85; } } }
      d[j]=r; d[j+1]=gg; d[j+2]=b; d[j+3]=255; }
    g2.putImageData(im,0,0); return out; }

})();

const pad3=n=>String(n).padStart(3,'0');
/* every known key gets a number: deep-band pages 1..999,999 and the reserved last page; everything else is X (uncatalogued forms, area-maker seeds) or M (mixes) */
const fmtNo=n=>n==null?'':n<=999?pad3(n):n===DEEP.LAST?'1,000,000':String(n);
function knownList(){ const L=[], ex=[]; let xi=0,mi=0; Object.keys(G.atlas).forEach(k=>{ const n=DEEP.no(k); if(n!=null)L.push({k,no:fmtNo(n),n}); else ex.push(k); }); L.sort((a,b)=>a.n-b.n); ex.sort((a,b)=>(G.atlas[a].o||0)-(G.atlas[b].o||0)).forEach(k=>L.push(isHybrid(k)?{k,no:'M'+String(++mi).padStart(2,'0'),mix:1}:{k,no:'X'+String(++xi).padStart(2,'0')})); return L; }

let atlasFilter='all', atlasPage=0; const APAGE=100;
function openAtlas(){ Snd.blip(); const p=panel('Entity Atlas'); const draw=()=>{ p.body.innerHTML=''; const c=Atlas.counts(); let pieces=0; for(const k in G.atlas)pieces+=Atlas.pieces(k);

    const ns=h('input',{class:'inp',placeholder:'any word, number, phrase',maxlength:40,style:'flex:1;min-width:0'}); const pv=h('div',{class:'hint'},'Every seed is a species. Try your name.'); ns.oninput=()=>{ const s=ns.value.trim(); if(!s){ pv.textContent='Every seed is a species. Try your name.'; return; } const sp=species(s); pv.innerHTML=`«${esc(s)}» → <b style="font-weight:400;color:var(--fg)">${esc(sp.name)}</b>, ${TYPES[sp.type].name}${sp.next?', grows at Lv '+sp.evoLv:''}`; };
    const add=()=>{ const s=ns.value.trim(); if(!s)return toast('type a seed','pink'); a.table=a.table||[]; if(a.table.length>=8)return toast('eight kinds is the limit','pink'); if(a.table.map(String).includes(s))return toast('already here'); a.table.push(s); dirty=true; Snd.cry(s); drawSide(); };
    ns.onkeydown=e=>{ if(e.key==='Enter')add(); };
    sideEl.append(h('div',{style:'font-size:12px'},'Entities in the grass (first = most common)'),chips,row(ns,h('button',{class:'btn',onclick:()=>{ ns.value=randSeed(); ns.oninput(); }},'🎲'),h('button',{class:'btn acc',onclick:add},'Add')),pv);
    sideEl.append(h('h4',{},'File'),row(h('button',{class:'btn acc',onclick:()=>save()},'Save'),h('button',{class:'btn',onclick:exportArea},'Export .fweddle'),h('button',{class:'btn',onclick:importArea},'Import')),
      row(h('button',{class:'btn',onclick:()=>{ const b=cloneArea(a,a.name+' copy'); load(b); dirty=true; toast('duplicated — save to keep it'); }},'Duplicate'),h('button',{class:'btn pink',onclick:delArea},'Delete')),
      h('p',{class:'hint'},'Saved areas open from the Lamp in Portal Plaza. Exported .fweddle files are FWD1 capsules — the same container MeridianOS, XFORGE and Clover Paint read.'));
    status(); }
  function resize(nw,nh){ if(nw===a.w&&nh===a.h)return; pushUndo(); const t=[]; for(let y=0;y<nh;y++)for(let x=0;x<nw;x++)t.push(x<a.w&&y<a.h?tAt(x,y):(x===0||y===0||x===nw-1||y===nh-1?'T':'.')); a.w=nw; a.h=nh; a.tiles=t.join(''); a.objs=a.objs.filter(o=>o.x<nw&&o.y<nh); if(a.spawn&&(a.spawn[0]>=nw||a.spawn[1]>=nh))a.spawn=[1,1]; dirty=true; fitView(); drawSide(); }

  /* ── files ── */
  function sanitize(o){ const w=clamp(o.w|0,6,64),hh=clamp(o.h|0,6,64); let t=String(o.tiles||''); t=[...t.padEnd(w*hh,'.').slice(0,w*hh)].map(c=>TILE_INFO[c]?c:'.').join('');
    const objs=(Array.isArray(o.objs)?o.objs:[]).filter(q=>q&&['sign','npc','item','heal','warp','mixer','altar','printer'].includes(q.k)&&(q.x|0)<w&&(q.y|0)<hh).map(q=>{ const r={}; for(const k of ['k','x','y','text','name','spr','seed','face','after','item','n','to','tx','ty','hidden','gate','need','needText','guard','boss','hint','wander','lines','dyn','node','trade','stockFrom','lv','keeper','afterFlag']){ if(q[k]!=null)r[k]=typeof q[k]==='string'?q[k].slice(0,400):q[k]; } if(Array.isArray(q.battle))r.battle=q.battle.slice(0,3).map(([k,l])=>[String(k).slice(0,40),clamp(l|0,1,60)]); if(r.spr&&!['tamer','person','frog','crow','robofrog','lamp','shadow'].includes(r.spr)&&!NPC_TYPES[r.spr])r.spr='frog'; return r; });
    return {id:String(o.id||'').replace(/[^\w-]/g,'').slice(0,40)||'a'+Date.now().toString(36),name:String(o.name||'Imported area').slice(0,28),w,h:hh,tiles:t,objs,seed:String(o.seed||'x').slice(0,40),lv:[clamp((o.lv||[3])[0]|0,1,60),clamp((o.lv||[3,8])[1]|0,1,60)],rate:clamp(+o.rate||0,0,.3),table:(o.table||[]).slice(0,8).map(k=>String(k).slice(0,40)),shadows:clamp(o.shadows|0,0,8),spawn:Array.isArray(o.spawn)?[clamp(o.spawn[0]|0,0,w-1),clamp(o.spawn[1]|0,0,hh-1)]:[1,1],outdoor:!!o.outdoor,made:o.made||Date.now()}; }
  function save(quiet){ a.name=nameInp.value.trim()||a.name||'Untitled'; if(Custom.put(JSON.parse(JSON.stringify(a)))){ dirty=false; Store.set('lastArea',a.id); if(!quiet){ Snd.piece(); toast('saved «'+a.name+'»','lime'); } status(); return true; } return false; }
  async function exportArea(){ const u8=await Capsule.make({kind:'entities.area',v:1,app:'ENTITIES',area:a}); Capsule.download(u8,(a.name||'area').replace(/[^\w-]+/g,'-').toLowerCase()+'.fweddle'); toast('exported'); }
  async function importArea(){ const f=await pickFile('.fweddle,application/octet-stream,*/*'); if(!f)return; try{ const o=await Capsule.parse(new Uint8Array(await f.arrayBuffer())); if(o.kind!=='entities.area'||!o.area)throw new Error('that capsule is not an ENTITIES area'); const b=sanitize(o.area); if(getArea(b.id)&&!Custom.get(b.id))b.id='a'+Date.now().toString(36); load(b); dirty=true; toast('imported «'+b.name+'» — save to keep it','lime'); }catch(e){ toast(e.message||'could not read that file','pink'); } }
  async function delArea(){ const c=await ask('Delete area','Delete «'+a.name+'»? Warps from other areas that point here will stop working.',['Cancel','Delete']); if(c!==1)return; Custom.del(a.id); toast('deleted'); const l=Custom.list(); load(l.length?l[l.length-1]:blankArea('New area')); }
  async function openPicker(){ if(dirty){ const c=await ask('Unsaved changes','Save «'+a.name+'» first?',['Save','Discard','Cancel']); if(c===2||c===null)return; if(c===0)save(true); }
    const pick2=await modal('Open an area',(box,close)=>{ const L=h('div',{class:'menu-list'}); L.append(h('button',{class:'btn acc',onclick:()=>close({blank:1})},'＋ New blank area')); const cl=Custom.list(); if(cl.length)L.append(h('div',{class:'hint'},'Your areas'));
      cl.forEach(x=>L.append(h('button',{class:'btn',onclick:()=>close({id:x.id})},x.name,h('i',{},`${x.w}×${x.h} · ${(x.table||[]).length} kinds`)))); L.append(h('div',{class:'hint'},'Remix a built-in area (makes a copy)')); Object.values(BUILTIN).forEach(x=>L.append(h('button',{class:'btn',onclick:()=>close({remix:x.id})},x.name,h('i',{},'remix'))));
      L.append(h('button',{class:'btn',onclick:()=>close({imp:1})},'Import a .fweddle capsule…')); box.append(L,row(h('button',{class:'btn',onclick:()=>close(null)},'Cancel'))); });
    if(!pick2)return; if(pick2.blank){ load(blankArea('New area')); dirty=true; } else if(pick2.id)load(Custom.get(pick2.id)); else if(pick2.remix){ load(cloneArea(BUILTIN[pick2.remix])); dirty=true; } else if(pick2.imp)importArea(); }
  async function exit(){ if(dirty){ const c=await ask('Unsaved changes','Save «'+a.name+'» before leaving?',['Save','Discard','Cancel']); if(c===2||c===null)return; if(c===0)save(true); } hide(); toTitle(); }
  function test(){ a.name=nameInp.value.trim()||a.name; if(!a.spawn||!walkable(tAt(a.spawn[0],a.spawn[1])))toast('the spawn point is not walkable','pink'); if(dirty&&Custom.get(a.id))save(true); playtest(JSON.parse(JSON.stringify(a))); }

  function load(b){ a=JSON.parse(JSON.stringify(b)); a.objs=a.objs||[]; a.table=a.table||[]; a.lv=a.lv||[3,8]; if(a.rate==null)a.rate=.1; undoS=[]; redoS=[]; dirty=false; nameInp.value=a.name||''; areaPortal=portalOf(a.seed||a.id); requestAnimationFrame(()=>{ sizeStage(); fitView(); }); drawSide(); status(); }
  function show(b){ if(!built)build(); scene='editor'; root.classList.remove('hid'); Snd.music('maker:'+Date.now()%3,'title'); drawTools(); drawPal();
    if(b)load(b); else if(!a){ const last=Custom.get(Store.get('lastArea',''))||Custom.list().slice(-1)[0]; load(last||blankArea('My first area')); if(!last)dirty=true; }
    requestAnimationFrame(()=>{ sizeStage(); if(!b&&a)fitView(); drawSide(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); }); }
  function hide(){ root.classList.add('hid'); cancelAnimationFrame(raf); }
  /* keep the side's portal preview alive */
  setInterval(()=>{ if(portalPrev&&portalPrev.isConnected&&a&&!root.classList.contains('hid')){ const src=areaPortal.draw(performance.now()/1000); const x=ctx2(portalPrev); x.clearRect(0,0,32,32); x.drawImage(src,0,0); } },90);
  return {show,hide,get area(){ return a; },get dirty(){ return dirty; },sanitize};
})();

/* ═══════════════════════════════════════════════════════════════
   11 · TITLE, PLAYTEST, THE LOOP
   ═══════════════════════════════════════════════════════════════ */
const Title={ orbit:null, portal:portalOf('fweddle entities',{fam:'rings'}),
  show(){ scene='title'; UI.clear(); Snd.music('title','title');
    if(!this.orbit){ const r=rngOf('title'); this.orbit=shuffle(r,REGION).slice(0,7).map((k,i)=>({k,a:i/7*6.283,s:.25+r()*.2,rr:.8+r()*.35})); }
    const el=h('div',{id:'title'}); const logo=h('div',{style:'position:absolute;top:8px;left:0;right:0;text-align:center;pointer-events:none'}); logo.innerHTML=`<div style="font-family:var(--font-big);font-size:clamp(28px,8vw,46px);letter-spacing:3px;line-height:1;color:var(--fg);text-shadow:3px 3px 0 #000,0 0 18px rgba(124,245,255,.45)">ꟻ ENTITRICITIES</div><div style="font-size:11px;color:var(--accent2);letter-spacing:1px;margin-top:4px;text-shadow:1px 1px 0 #000">v.12a · portals grow them · capsules keep them · 1,000,000 pages</div>`;
    const L=h('div',{class:'menu-list'}); const item=(label,sub,fn,cls='')=>L.append(h('button',{class:'btn '+cls,'data-nav':'',onclick:()=>{ Snd.wake(); Snd.blip(); fn(); }},label,sub?h('i',{},sub):null));
    const sv=Store.get('save',null);
    if(sv){ const n=Object.values(sv.atlas||{}).filter(e=>e.c).length; item('Continue',`${(getArea(sv.area)||{}).name||''} · ${n} caught`,()=>startGame(false),'acc'); }
    item('New game',sv?'starts over':'',async()=>{ if(sv){ const c=await Text.say('Start a new game? Your saved game will be replaced the next time you save.',{choices:['Start over','Keep my save'],cancel:1}); if(c!==0)return; } startGame(true); },sv?'':'acc');
    item('Import .fweddle','save or area capsule',()=>importCapsule());
    item('Options','',()=>openOptions());
    el.append(logo,L,h('span',{class:'ver'},'1.4.7 · the forest'));
    UI.push(el,{onBack:()=>{}}); },
  draw(t){ const {W,H,s}=View; g.fillStyle='#05060f'; g.fillRect(0,0,W,H); Stars.draw(g,W,H,t);
    const menuH=(Math.min(5,UI.root.querySelectorAll('#title .btn').length)*44+30)/s, logoH=64/s; const avail=H-menuH-logoH; const sc=Math.max(1,Math.floor(Math.min(avail*.95,W*.8)/64)); const cx=W/2|0, cy=Math.round(logoH+avail/2);
    const pc=this.portal.draw(t); const ps=Math.max(64,Math.round(64*sc*1.25/32)*32); g.globalAlpha=.3; g.drawImage(pc,0,0,32,32,cx-ps/2|0,cy-ps/2|0,ps,ps); g.globalAlpha=1;
    const R=64*sc*.62; for(const o of this.orbit){ const a=o.a+t*o.s; const x=cx+Math.cos(a)*R*o.rr, y=cy+Math.sin(a)*R*o.rr*.45; if(Math.sin(a)<0){ const im=entImg(o.k,Math.max(1,sc-1),'sil'); g.globalAlpha=.45; g.drawImage(im,Math.round(x-im.width/2),Math.round(y-im.height/2)); g.globalAlpha=1; } }
    const pt=drawPortrait(t); g.drawImage(pt,0,0,64,64,cx-32*sc,cy-32*sc+Math.round(Math.sin(t*1.6)*sc),64*sc,64*sc);
    for(const o of this.orbit){ const a=o.a+t*o.s; const x=cx+Math.cos(a)*R*o.rr, y=cy+Math.sin(a)*R*o.rr*.45; if(Math.sin(a)>=0){ const im=entImg(o.k,Math.max(1,sc)); g.drawImage(im,Math.round(x-im.width/2),Math.round(y-im.height/2)); } } } };

/* ═══ old saves: the isle was a line, the world is a web. gems become pins, chain areas become graph nodes,
   and nothing anyone earned is thrown away. ═══ */
function migrateSave(fresh){ if(!G)return; G.worldSeed=G.worldSeed||'meridian'; G.pins=G.pins||{}; G.repaired=G.repaired||{}; G.lic=G.lic|0; G.bp=G.bp||{}; G.shards=G.shards|0; G.visited=G.visited||{};
  if(!G.bag.share&&G.flags.starter){ G.bag.share=1; G.share=true; } if(G.flags.starter&&!G.bag.license)G.bag.license=1;
  if(G.bag.bigcap){ G.bag.usb=(G.bag.usb|0)+G.bag.bigcap; delete G.bag.bigcap; }
  if(G.gems){ for(const k in G.gems)G.pins[k]=1; delete G.gems; }
  for(let n=1;n<=20;n++)if(G.flags['beat:keeper'+n])G.pins[n]=1;
  /* the old twenty towns map onto the first stretch of the graph */
  const mapId=id=>{ if(!id)return null; const t=/^t(\d+)$/.exec(id); if(t)return 'S'+Math.min(199,+t[1]*3); const r=/^r(\d+)/.exec(id); if(r)return 'S'+Math.min(199,+r[1]*3); return null; };
  const fix=id=>{ if(!id)return id; if(BUILTIN[id]||/^[SRB]\d+$/.test(id))return id; return mapId(id)||'S0'; };
  const old=G.visited; G.visited={}; for(const id in old){ const n=fix(id); if(n)G.visited[n]=1; }
  if(G.area&&!BUILTIN[G.area]&&!/^[SRB]\d+$/.test(G.area)&&!Custom.get(G.area)){ const to=fix(G.area); G.area=to; G.x=null; G.y=null; }
  if(G.heal&&G.heal.area&&!BUILTIN[G.heal.area]&&!/^[SRB]\d+$/.test(G.heal.area))G.heal={area:'shed',x:BUILTIN.shed.spawn[0],y:BUILTIN.shed.spawn[1]};
  const pins=Object.keys(G.pins).length; if(pins&&!G.lic)G.lic=Math.min(4,Math.floor(pins/5));
  rebuildPinBonuses();
  if(!fresh&&!G.flags.v12wg){ G.flags.v12wg=1; setTimeout(()=>toast('the isle opened out: 200 settlements, no locked roads','lime'),1400); } }
async function startGame(fresh){ UI.clear(); Play.test=false; Play.area=null; if(!Net.ST.id)Net.init(); if(fresh)newGame(); else if(!loadGame()){ toast('that save could not be read','pink'); return Title.show(); }
  migrateSave(fresh);
  await fadeTo(1,260); scene='world'; World.load(G.area,G.x,G.y,G.dir); await fadeTo(0,320);
  if(fresh){ World.busy=true; await Text.lines(['Morning. The roof leaked on the good side again.','MeridianOS is still running on the phone by the mug. Portals all night, it says. Things walking out of them.',`${Land.nameOf('S0')} is up the path — through the swirling portal at the edge of the yard.`.replace('`','')+'  Prof. Ribbit-9 said to come by the lab if the portals ever did that.']); World.busy=false; saveGame(true); } }
async function toTitle(){ await fadeTo(1,220); Play.test=false; Play.area=null; Title.show(); await fadeTo(0,260); }

/* the Area Maker is on the title screen — the main screen */
async function openMaker(){ await fadeTo(1,180); UI.clear(); Editor.show(); Fade.a=0; }
let RealG=null;
async function playtest(area){ RealG=G; Play.test=true; Play.area=area; const base=RealG||Store.get('save',null);
  newGame(); if(base&&base.party&&base.party.length){ G.party=JSON.parse(JSON.stringify(base.party)); G.atlas=JSON.parse(JSON.stringify(base.atlas||{})); } else { const lv=clamp(area.lv[1]||5,5,MAXLV); G.party=STARTERS.map(k=>makeMon(k,lv)); G.party.forEach(m=>Atlas.own(m.key)); }
  G.party.forEach(m=>{ m.hp=stat(m,'hp'); m.st=null; m.sts=[]; }); G.bag={capsule:20,usb:5,tonic:5,big:2}; G.flags.starter=1; const [sx,sy]=area.spawn||[1,1]; G.heal={area:area.id,x:sx,y:sy};
  Editor.hide(); Fade.a=1; scene='world'; UI.clear(); World.load(area.id,sx,sy,'down'); await fadeTo(0,260); toast('playtest · START › End playtest to go back','pink'); }
async function endPlaytest(){ await fadeTo(1,200); Play.test=false; Play.area=null; G=RealG; RealG=null; UI.clear(); Snd.stopMusic(); Editor.show(); Fade.a=0; }

async function importCapsule(){ const f=await pickFile('.fweddle,application/octet-stream,*/*'); if(!f)return; let o; try{ o=await Capsule.parse(new Uint8Array(await f.arrayBuffer())); }catch(e){ toast(e.message||'not a capsule','pink'); return; }
  if(o.kind==='entities.save'&&o.save&&o.save.party){ const c=await Text.say('Load this save file? It replaces the one on this device.',{choices:['Load it','Cancel'],cancel:1}); if(c!==0)return; Store.set('save',o.save); toast('save imported','lime'); Title.show(); }
  else if(o.kind==='entities.area'&&o.area){ const b=Editor.sanitize(o.area); if(BUILTIN[b.id])b.id='a'+Date.now().toString(36); Custom.put(b); toast('added «'+b.name+'» — the Lamp in Portal Plaza opens it','lime'); }
  else toast('that capsule isn\'t from ENTITIES','pink'); }

/* ── the loop ── */
let _last=performance.now();
function frame(now){ const dt=Math.min(50,now-_last); _last=now; const t=now/1000;
  if(scene!=='editor'){ if(scene==='world'&&World.a){ World.update(dt); World.draw(t); } else if(scene==='battle')Battle.draw(t); else if(scene==='evo')Battle.drawEvo(t); else if(scene==='title')Title.draw(t);
    if(Fade.a>0.001){ g.globalAlpha=Math.min(1,Fade.a); g.fillStyle=Fade.col; g.fillRect(0,0,View.W,View.H); g.globalAlpha=1; } }
  requestAnimationFrame(frame); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ Input.clear(); if(G&&scene==='world'&&!Play.test)saveGame(true); } });
addEventListener('pagehide',()=>{ if(G&&scene==='world'&&!Play.test)saveGame(true); });
document.addEventListener('gesturestart',e=>e.preventDefault());
fit(); Title.show(); requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fit());
