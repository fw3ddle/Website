<style>
/* ─────────────────────────────────────────────────────────────
   ꟻ ENTITIES 1.0 · a Meridian field game
   portals grow the world · capsules keep what walks out of them
   ───────────────────────────────────────────────────────────── */
:root{
  --sky:#05060f; --ink:#0b0d1a; --ink2:#12152a; --ink3:#1b1f3a;
  --line:#2a2f55; --fg:#e8ecff; --fg2:#9aa3d1; --fg3:#5a6396;
  --accent:#7cf5ff; --accent2:#ff7ce8; --lime:#b6ff5c; --sun:#ffd166; --rose:#ff5c7a; --violet:#b48cff;
  --font-ui:'Px Pixeloid Sans',ui-monospace,monospace; --font-big:'Px Gamedev 16px','Px Pixeloid Sans',monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--fg);font-family:var(--font-ui);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:none;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{-webkit-user-select:text;user-select:text;touch-action:manipulation}
button{cursor:pointer;background:none;border:0;padding:0}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--ink)}::-webkit-scrollbar-track{background:var(--ink)}
.hid{display:none!important}

/* Meridian's bevel vocabulary */
.bevel{background:color-mix(in srgb,var(--ink) 94%,transparent);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--line),inset -1px -1px 0 #000,0 0 0 1px var(--ink3),3px 3px 0 rgba(0,0,0,.55)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 10px;min-height:30px;background:var(--ink2);border:1px solid #000;
  box-shadow:inset 1px 1px 0 var(--line),inset -1px -1px 0 #000;color:var(--fg);font-size:13px;white-space:nowrap}
.btn:active,.btn.on{box-shadow:inset -1px -1px 0 var(--line),inset 1px 1px 0 #000;background:var(--ink3)}
.btn.acc{color:var(--sky);background:var(--accent);box-shadow:inset 1px 1px 0 #fff8,inset -1px -1px 0 #0006}
.btn.pink{color:var(--sky);background:var(--accent2);box-shadow:inset 1px 1px 0 #fff8,inset -1px -1px 0 #0006}
.btn:disabled{opacity:.4}
.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
.inp{background:#000;border:1px solid var(--line);box-shadow:inset 1px 1px 0 #000;color:var(--fg);padding:5px 7px;outline:0;min-height:30px;font-size:16px}
.inp:focus{border-color:var(--accent)}
small,.dim{color:var(--fg2)}

/* ── the console: top screen + pad (portrait = DS, landscape = GBA) ── */
#app{position:fixed;inset:0;display:grid;padding:calc(var(--sat) + 6px) calc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px);gap:8px;
  grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"screen" "pad"}
#screen{grid-area:screen;position:relative;min-height:0;background:#000;border:1px solid #000;box-shadow:0 0 0 1px var(--line),0 0 0 3px #000,inset 0 0 0 1px var(--ink3);overflow:hidden;display:grid;place-items:center}
#cv{position:absolute}
#pad{grid-area:pad;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:center;gap:8px 10px;padding:6px 8px 2px;height:clamp(200px,34vh,270px)}
#pad .quick{grid-column:1/-1;display:flex;gap:6px;justify-content:center}
#pad .quick .btn{min-height:28px;padding:3px 9px;font-size:12px}
.dpad{position:relative;width:138px;height:138px;touch-action:none}
.dpad b{position:absolute;width:46px;height:46px;background:var(--ink2);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--line),inset -1px -1px 0 #000;display:grid;place-items:center;color:var(--fg3);font-size:14px}
.dpad b.on{background:var(--ink3);box-shadow:inset -1px -1px 0 var(--line),inset 1px 1px 0 #000;color:var(--accent)}
.dpad .u{left:46px;top:0}.dpad .d{left:46px;bottom:0}.dpad .l{left:0;top:46px}.dpad .r{right:0;top:46px}
.dpad .c{left:46px;top:46px;background:var(--ink);box-shadow:none}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;align-self:end;padding-bottom:6px}
.mid .row{display:flex;flex-direction:column;gap:8px}
.pill{min-width:54px;height:20px;border-radius:10px;background:var(--ink2);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--line);font-size:10px;color:var(--fg2);letter-spacing:.5px}
.pill.on{background:var(--ink3)}
.ab{position:relative;width:132px;height:120px;touch-action:none}
.ab button{position:absolute;width:58px;height:58px;border-radius:50%;border:1px solid #000;font-family:var(--font-big);font-size:22px;color:var(--sky)}
.ab .a{right:0;top:8px;background:var(--accent2);box-shadow:inset 2px 2px 0 #fff8,inset -2px -2px 0 #0007,0 0 0 2px var(--ink)}
.ab .b{left:0;top:52px;background:var(--accent);box-shadow:inset 2px 2px 0 #fff8,inset -2px -2px 0 #0007,0 0 0 2px var(--ink)}
.ab button.on{filter:brightness(.7);transform:translateY(1px)}
.ab small{position:absolute;font-size:9px;color:var(--fg3)}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  #app{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);grid-template-areas:"lp screen rp"}
  #pad{display:contents}
  #pad .dpadwrap{grid-area:lp;align-self:center;display:flex;flex-direction:column;gap:14px;align-items:center}
  #pad .abwrap{grid-area:rp;align-self:center;display:flex;flex-direction:column;gap:14px;align-items:center}
  #pad .quick{grid-area:lp;align-self:start;display:grid;grid-template-columns:1fr 1fr;gap:5px;width:140px;margin-top:4px;position:relative;z-index:2}
  #pad .quick .btn{padding:3px 4px}
  #pad .mid{display:none}
}
@media (orientation:landscape) and (min-aspect-ratio:5/4) and (max-height:520px){ .dpad{transform:scale(.85)} .ab{transform:scale(.85)} }
body.kbd #pad .dpad,body.kbd #pad .ab{opacity:.35}

/* ── overlays that live inside the top screen ── */
.layer{position:absolute;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
#textbox{position:absolute;left:6px;right:6px;bottom:6px;min-height:64px;padding:9px 12px 10px;font-size:15px;line-height:1.45;border:2px solid #000;
  background:color-mix(in srgb,var(--ink) 96%,transparent);box-shadow:inset 0 0 0 1px var(--line),inset 0 0 0 3px #000,inset 0 0 0 4px var(--ink3)}
#textbox .who{position:absolute;top:-13px;left:10px;background:var(--ink);border:1px solid var(--line);padding:0 6px;font-size:11px;color:var(--accent);line-height:18px}
#textbox .more{position:absolute;right:10px;bottom:5px;color:var(--accent2);animation:blink 1s steps(2) infinite}
#textbox .choices{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@keyframes blink{50%{opacity:0}}
.panel{position:absolute;inset:6px;display:flex;flex-direction:column;overflow:hidden}
.panel>header{display:flex;align-items:center;gap:8px;padding:6px 8px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,var(--ink)),var(--ink));border-bottom:1px solid #000}
.panel>header h2{margin:0;font-family:var(--font-big);font-weight:400;font-size:20px;flex:1;color:var(--fg);letter-spacing:.5px}
.panel>.body{flex:1;overflow:auto;padding:8px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list .btn{justify-content:flex-start;min-height:38px;font-size:14px}
.menu-list .btn i{font-style:normal;color:var(--fg3);margin-left:auto;font-size:12px}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--accent);color:var(--sky);padding:3px 10px;font-size:12px;border:1px solid #000;box-shadow:2px 2px 0 #000;z-index:50;white-space:nowrap;pointer-events:none}
.toast.pink{background:var(--accent2)}.toast.lime{background:var(--lime)}

/* title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 10px 14px;gap:6px}
#title .menu-list{width:min(260px,80%)}
#title .ver{position:absolute;right:8px;bottom:4px;font-size:10px;color:var(--fg3)}

/* battle HUD */
.hud{position:absolute;padding:5px 8px 6px;min-width:0;width:min(58%,230px);font-size:12px}
.hud .nm{display:flex;align-items:baseline;gap:6px;font-family:var(--font-big);font-size:18px;line-height:1}
.hud .nm span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .nm em{font-style:normal;font-size:14px;color:var(--fg2)}
.hud .nm .st{font-family:var(--font-ui);font-size:9px;padding:0 3px;background:var(--rose);color:#000}
.hud .nm .st.lock{background:var(--violet)}
.hud .hp{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:10px;color:var(--sun)}
.bar{flex:1;height:9px;background:repeating-linear-gradient(112deg,#1c2436 0 5px,#0b0d1a 5px 7px);border:1px solid #06070f;border-radius:2px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 #ffffff10}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffd166 0,#e8ff5c 22%,#7dff5c 45%,#3ddc5a 100%);-webkit-mask:repeating-linear-gradient(112deg,#000 0 5px,transparent 5px 7px);mask:repeating-linear-gradient(112deg,#000 0 5px,transparent 5px 7px);transition:width .45s steps(18);filter:drop-shadow(0 0 2px #7dff5c88)}
.bar.mid i{background:linear-gradient(90deg,#ff8c2a,#ffd166 60%,#e8ff5c);filter:drop-shadow(0 0 2px #ffd16688)}.bar.low i{background:linear-gradient(90deg,#ff3b30,#ff5c7a);filter:drop-shadow(0 0 3px #ff3b30aa)}
.bar.xp{height:5px;margin-top:3px}.bar.xp i{background:linear-gradient(90deg,#7cf5ff,#c2a8ff);filter:none}
.hud .num{text-align:right;font-family:var(--font-big);font-size:14px;line-height:1;margin-top:2px}
.hud.foe{left:6px;top:6px}.hud.me{right:6px;bottom:84px}
.tchip{display:inline-block;font-size:9px;line-height:14px;padding:0 4px;border:1px solid #000;color:#000;font-family:var(--font-ui);vertical-align:middle}
#cmd{position:absolute;left:6px;right:6px;bottom:6px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
#cmd .btn{min-height:36px;font-size:14px;justify-content:flex-start}
#cmd .btn .tchip{margin-left:auto}
#cmd .btn small{margin-left:auto;font-size:10px}
#cmd.moves .btn{flex-direction:row}
#cmd .back{grid-column:1/-1;min-height:28px;justify-content:center}

/* party / cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.card{display:flex;gap:7px;align-items:center;padding:6px;text-align:left;background:var(--ink2);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--line),inset -1px -1px 0 #000}
.card.sel{box-shadow:inset 0 0 0 2px var(--accent2)}
.card.fainted{opacity:.55}
.card canvas{width:40px;height:40px;flex:none;background:#000;border:1px solid var(--line)}
.card .info{flex:1;min-width:0}
.card .info b{display:block;font-family:var(--font-big);font-weight:400;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .info small{font-size:10px}
.statgrid{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:12px}
.statgrid .bar{height:7px}.statgrid .bar i{background:linear-gradient(90deg,#7cf5ff,#c2a8ff);filter:none}

/* the Atlas */
.atlas-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.atlas-top .count{margin-left:auto;font-family:var(--font-big);font-size:15px;color:var(--fg2)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:5px}
.acell{position:relative;aspect-ratio:1;background:#000;border:1px solid var(--line);display:grid;place-items:center;padding:0}
.acell canvas{width:78%;height:78%}
.acell .no{position:absolute;left:3px;top:1px;font-family:var(--font-big);font-size:12px;color:var(--fg3)}
.acell .pc{position:absolute;right:3px;bottom:1px;font-size:9px;color:var(--fg2)}
.acell.caught{border-color:var(--accent)}
.acell.caught::after{content:"";position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:conic-gradient(#ff9ad5,#c2a8ff,#8ef4ff,#9dffd3,#fff3a0,#ff9ad5);box-shadow:0 0 0 1px #000}
.entry{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:640px){.entry{grid-template-columns:minmax(0,300px) minmax(0,1fr)}}
.jig{position:relative;width:100%;max-width:300px;aspect-ratio:1;margin:0 auto}
.jig canvas{width:100%;height:100%}
.entry h3{margin:0;font-family:var(--font-big);font-weight:400;font-size:26px;letter-spacing:2px;line-height:1}
.entry .facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;align-items:center}
.entry .facts dt{color:var(--fg3)}.entry .facts dd{margin:0}
.sealed{border:1px dashed var(--line);padding:8px;color:var(--fg3);font-size:12px}
.lore{font-size:13px;line-height:1.6;color:var(--fg)}
.lore p{margin:0 0 6px}
.movelist{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;font-size:12px}

/* area maker */
#editor{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--sky);z-index:100;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#editor .etop{display:flex;gap:5px;align-items:center;padding:5px 6px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent2) 20%,var(--ink)),var(--ink));border-bottom:1px solid #000;flex-wrap:wrap}
#editor .etop .inp{min-width:0;width:140px;min-height:28px;padding:3px 6px}
#editor .etop select.inp{width:auto;max-width:160px}
#editor .etop .sp{flex:1}
#editor .emain{flex:1;min-height:0;display:flex;position:relative}
#editor .stage{flex:1;min-width:0;position:relative;overflow:hidden;background:#02030a;touch-action:none}
#editor .stage canvas{position:absolute;left:0;top:0}
#editor .ebot{border-top:1px solid #000;background:var(--ink)}
#editor .tools{display:flex;gap:4px;padding:5px 6px;overflow-x:auto;align-items:center}
#editor .tools .btn{min-height:32px;padding:3px 8px;font-size:12px}
#editor .tools .div{width:1px;height:24px;background:var(--line);flex:none;margin:0 2px}
#editor .pal{display:flex;gap:4px;padding:0 6px 6px;overflow-x:auto;touch-action:pan-x}
#editor .pal button{flex:none;width:44px;height:52px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;background:var(--ink2);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--line)}
#editor .pal button.on{box-shadow:inset 0 0 0 2px var(--accent2);background:var(--ink3)}
#editor .pal canvas{width:32px;height:32px}
#editor .pal small{font-size:8px;line-height:1;color:var(--fg2)}
#editor .side{width:300px;max-width:88vw;border-left:1px solid #000;background:var(--ink);overflow:auto;padding:8px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
@media (max-width:760px){#editor .side{position:absolute;right:0;top:0;bottom:0;z-index:5;box-shadow:-4px 0 0 #0008}}
#editor .side h4{margin:4px 0 0;font-weight:400;font-family:var(--font-big);font-size:17px;color:var(--accent)}
#editor .side label{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:center;font-size:12px}
#editor .side .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;background:var(--ink2);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--line);width:66px;position:relative}
.chip canvas{width:40px;height:40px}
.chip small{font-size:9px;line-height:1.1;text-align:center;word-break:break-all}
.chip .x{position:absolute;right:1px;top:0;color:var(--rose);font-size:13px;width:16px}
#editor .hint{font-size:11px;color:var(--fg3);line-height:1.5}
#editor .status{font-size:11px;color:var(--fg2);padding:0 6px}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:200;padding:14px}
.modal .box{width:min(420px,100%);max-height:88vh;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.modal h4{margin:0;font-family:var(--font-big);font-weight:400;font-size:19px;color:var(--accent)}
.modal label{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;font-size:12px}
.modal textarea.inp{min-height:70px;resize:vertical;font-size:15px}
.modal .row{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app">
  <div id="screen">
    <canvas id="cv"></canvas>
    <div id="ui" class="layer"></div>
  </div>
  <div id="pad">
    <div class="quick" id="quick">
      <button class="btn" data-q="atlas">Atlas</button>
      <button class="btn" data-q="party">Party</button>
      <button class="btn" data-q="bag">Bag</button>
      <button class="btn" data-q="menu">Menu</button>
    </div>
    <div class="dpadwrap"><div class="dpad" id="dpad"><b class="u" data-d="up">▲</b><b class="l" data-d="left">◀</b><b class="c"></b><b class="r" data-d="right">▶</b><b class="d" data-d="down">▼</b></div></div>
    <div class="mid"><div class="row"><button class="pill" data-k="select">SELECT</button><button class="pill" data-k="start">START</button></div></div>
    <div class="abwrap"><div class="ab"><button class="b" data-k="b" aria-label="B">B</button><button class="a" data-k="a" aria-label="A">A</button></div></div>
  </div>
</div>
<div id="editor" class="hid"></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   1 · CORE — little helpers, the FWD1 capsule codec (same bytes as
       MeridianOS / XFORGE / Clover), sound, input, the UI stack
   ═══════════════════════════════════════════════════════════════ */
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const nextFrame=()=>new Promise(r=>requestAnimationFrame(r));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function h(tag,attrs={},...kids){ const e=document.createElement(tag); for(const k in attrs){ const v=attrs[k]; if(k==='class')e.className=v; else if(k==='html')e.innerHTML=v; else if(k.startsWith('on'))e[k]=v; else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v); } kids.flat().forEach(c=>c!=null&&e.append(c.nodeType?c:document.createTextNode(c))); return e; }
/* the same FNV hash + mulberry stream Meridian's forges use, so a seed means the same thing in both */
const hashSeed=s=>{ let h=2166136261>>>0; for(const ch of String(s)){ h^=ch.codePointAt(0); h=Math.imul(h,16777619)>>>0; } return h; };
const mul=a=>()=>{ a|=0; a=(a+0x6D2B79F5)|0; let x=Math.imul(a^(a>>>15),1|a); x=(x+Math.imul(x^(x>>>7),61|x))^x; return ((x^(x>>>14))>>>0)/4294967296; };
const rngOf=s=>mul(hashSeed(s));
const pick=(r,a)=>a[Math.floor(r()*a.length)%a.length];
const shuffle=(r,a)=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const cv=(w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
const ctx2=c=>{ const g=c.getContext('2d'); g.imageSmoothingEnabled=false; return g; };

/* FWD1: 'FWD1' | u8 method | u32le crc32(raw) | u32le rawlen | payload (deflate-raw or stored) */
const Capsule=(()=>{
  const T=(()=>{const t=new Int32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}return t;})();
  const crc32=u8=>{let c=-1;for(let i=0;i<u8.length;i++)c=T[(c^u8[i])&255]^(c>>>8);return(c^-1)>>>0;};
  const hdr=(m,crc,len)=>{const h=new Uint8Array(13);h.set([70,87,68,49,m]);const dv=new DataView(h.buffer);dv.setUint32(5,crc,true);dv.setUint32(9,len,true);return h;};
  async function make(obj){ const raw=new TextEncoder().encode(JSON.stringify(obj)),crc=crc32(raw); const pack=(m,p)=>{const o=new Uint8Array(13+p.length);o.set(hdr(m,crc,raw.length));o.set(p,13);return o;};
    if(typeof CompressionStream==='undefined')return pack(0,raw); try{ const b=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return pack(8,new Uint8Array(b)); }catch(e){ return pack(0,raw); } }
  async function parse(u8){ if(u8.length<13||u8[0]!==70||u8[1]!==87||u8[2]!==68||u8[3]!==49)throw new Error('not a FWD1 capsule'); const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength); const m=u8[4],crc=dv.getUint32(5,true),len=dv.getUint32(9,true); let raw=u8.subarray(13);
    if(m===8)raw=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); if(raw.length!==len)throw new Error('capsule length mismatch'); if(crc32(raw)!==crc)throw new Error('capsule CRC32 failed'); return JSON.parse(new TextDecoder().decode(raw)); }
  const download=(u8,name)=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([u8],{type:'application/octet-stream'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); };
  return {make,parse,download,crc32};
})();
function pickFile(accept){ return new Promise(res=>{ const i=h('input',{type:'file',accept}); i.onchange=()=>res(i.files[0]||null); i.click(); }); }

/* ── storage: one namespace, quiet failure (private mode / full quota) ── */
const Store={ get(k,d){ try{ const v=localStorage.getItem('fent.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('fent.'+k,JSON.stringify(v)); return true; }catch(e){ toast('storage is full — could not save','pink'); return false; } },
  del(k){ try{ localStorage.removeItem('fent.'+k); }catch(e){} } };
const Settings=Object.assign({music:true,sfx:true,text:2},Store.get('settings',{}));
const saveSettings=()=>Store.set('settings',Settings);

/* ═══ sound — everything synthesised, nothing fetched ═══ */
const Snd=(()=>{
  let ac=null,master=null,musicBus=null,sfxBus=null,seqTimer=null,seqState=null;
  function init(){ if(ac)return ac; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.55; master.connect(ac.destination); musicBus=ac.createGain(); musicBus.gain.value=Settings.music?.16:0; musicBus.connect(master); sfxBus=ac.createGain(); sfxBus.gain.value=Settings.sfx?.5:0; sfxBus.connect(master); }catch(e){ ac=null; } return ac; }
  const wake=()=>{ init(); if(ac&&ac.state==='suspended')ac.resume(); };
  function tone(f,d,type='square',vol=.3,slide=0,at=0,bus){ if(!ac)return; const t=ac.currentTime+at; const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+d); o.connect(g); g.connect(bus||sfxBus); o.start(t); o.stop(t+d+.02); }
  function noise(d,vol=.3,at=0,hp=800,bus){ if(!ac)return; const t=ac.currentTime+at; const n=ac.createBufferSource(); const b=ac.createBuffer(1,Math.max(1,ac.sampleRate*d|0),ac.sampleRate); const ch=b.getChannelData(0); for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1; n.buffer=b; const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=ac.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d); n.connect(f); f.connect(g); g.connect(bus||sfxBus); n.start(t); }
  const S={
    blip(){ tone(880,.05,'square',.12); }, move(){ tone(660,.035,'square',.07); }, back(){ tone(440,.06,'square',.1,.7); },
    bump(){ tone(110,.08,'square',.15,.6); },
    rustle(){ noise(.12,.12,0,2500); },
    door(){ tone(300,.12,'triangle',.25,1.8); tone(600,.12,'triangle',.18,1.5,.08); },
    encounter(){ for(let i=0;i<6;i++)tone(220*Math.pow(1.26,i),.07,'square',.16,1,i*.05); noise(.35,.12,.3,1200); },
    hit(eff=1){ noise(.14,.35,0,eff>1?300:900); tone(eff>1?160:eff<1?90:120,.12,'square',.2,.5); if(eff>1)tone(90,.2,'sawtooth',.2,.5,.05); },
    miss(){ tone(500,.12,'triangle',.15,.5); },
    buff(up=true){ for(let i=0;i<4;i++)tone(up?400+i*120:700-i*110,.06,'triangle',.18,1,i*.05); },
    faint(){ tone(600,.6,'square',.2,.12); },
    throw(){ tone(300,.35,'triangle',.25,3); noise(.3,.08,0,3000); },
    wobble(){ tone(180,.06,'square',.2,.8); noise(.05,.15,.02,1500); },
    pop(){ tone(900,.08,'square',.2,.4); noise(.2,.2,0,600); },

/* ═══ input — keyboard, the pad, and one router ═══ */
const Input=(()=>{
  const held={up:0,down:0,left:0,right:0,a:0,b:0};
  let order=[]; /* most recent direction wins */
  const KEYS={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyZ:'a',Space:'a',Enter:'a',KeyX:'b',ShiftLeft:'b',ShiftRight:'b',Backspace:'b',Escape:'start',KeyM:'start',KeyP:'start',Tab:'select',KeyQ:'select'};
  const subs=[];
  function press(k){ Snd.wake(); if(['up','down','left','right'].includes(k)){ order=order.filter(x=>x!==k); order.push(k); } held[k]=1; for(let i=subs.length-1;i>=0;i--){ if(subs[i](k)===true)break; } }
  function release(k){ held[k]=0; order=order.filter(x=>x!==k); }
  addEventListener('keydown',e=>{ const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return; const k=KEYS[e.code]; if(!k)return; if(!$('#editor').classList.contains('hid'))return; document.body.classList.add('kbd'); e.preventDefault(); if(e.repeat&&!['up','down','left','right'].includes(k))return; if(!e.repeat)press(k); });
  addEventListener('keyup',e=>{ const k=KEYS[e.code]; if(k)release(k); });
  addEventListener('blur',()=>{ for(const k in held)held[k]=0; order=[]; });
  /* the pad — a d-pad you can slide your thumb around, and two round buttons */
  const dp=$('#dpad'); let dpId=null,dpDir=null;
  function dpAt(e){ const r=dp.getBoundingClientRect(); const x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2; if(Math.hypot(x,y)<12)return null; return Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up'); }
  function dpSet(d){ if(d===dpDir)return; if(dpDir)release(dpDir); dpDir=d; $$('b',dp).forEach(b=>b.classList.toggle('on',b.dataset.d===d)); if(d)press(d); }
  dp.addEventListener('pointerdown',e=>{ document.body.classList.remove('kbd'); dpId=e.pointerId; dp.setPointerCapture(e.pointerId); dpSet(dpAt(e)); e.preventDefault(); });
  dp.addEventListener('pointermove',e=>{ if(e.pointerId===dpId)dpSet(dpAt(e)); });
  const dpEnd=e=>{ if(e.pointerId===dpId){ dpId=null; dpSet(null); } }; dp.addEventListener('pointerup',dpEnd); dp.addEventListener('pointercancel',dpEnd);
  $$('#pad [data-k]').forEach(b=>{ const k=b.dataset.k; b.addEventListener('pointerdown',e=>{ document.body.classList.remove('kbd'); e.preventDefault(); b.classList.add('on'); press(k); }); const up=()=>{ b.classList.remove('on'); release(k); }; b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up); });
  $$('#quick [data-q]').forEach(b=>b.addEventListener('click',()=>{ Snd.wake(); typeof onQuick==='function'&&onQuick(b.dataset.q); }));
  return { held, dir:()=>order[order.length-1]||null, on(fn){ subs.push(fn); return ()=>{ const i=subs.indexOf(fn); if(i>=0)subs.splice(i,1); }; }, press, release, clear(){ for(const k in held)held[k]=0; order=[]; dpSet(null); } };
})();

/* ═══ the UI stack — overlays in the top screen; the top one owns the pad ═══ */
const UI=(()=>{
  const root=$('#ui'); const stack=[];
  function navItems(el){ return $$('[data-nav]',el).filter(x=>x.offsetParent!==null&&!x.disabled); }
  function focusFirst(L){ const it=navItems(L.el); const pref=it.find(x=>x.classList.contains('on')&&!x.classList.contains('pclose'))||it.find(x=>!x.classList.contains('pclose'))||it[0]; if(pref)pref.focus({preventScroll:false}); }
  function spatial(el,dir){ const it=navItems(el); if(!it.length)return; const cur=document.activeElement; if(!it.includes(cur)){ it[0].focus(); return; } const a=cur.getBoundingClientRect(); const ax=a.left+a.width/2,ay=a.top+a.height/2; let best=null,bd=1e9;
    it.forEach(b=>{ if(b===cur)return; const r=b.getBoundingClientRect(); const bx=r.left+r.width/2,by=r.top+r.height/2; const dx=bx-ax,dy=by-ay; const ok=dir==='up'?dy<-4:dir==='down'?dy>4:dir==='left'?dx<-4:dx>4; if(!ok)return; const primary=dir==='up'||dir==='down'?Math.abs(dy):Math.abs(dx), sec=dir==='up'||dir==='down'?Math.abs(dx):Math.abs(dy); const d=primary+sec*2.2; if(d<bd){bd=d;best=b;} });
    if(!best){ const i=it.indexOf(cur); best=(dir==='down'||dir==='right')?it[(i+1)%it.length]:it[(i-1+it.length)%it.length]; } best.focus(); best.scrollIntoView({block:'nearest'}); Snd.move(); }
  Input.on(k=>{ const L=stack[stack.length-1]; if(!L)return false; if(L.onKey&&L.onKey(k)===true)return true;
    if(['up','down','left','right'].includes(k)){ if(L.nav!==false)spatial(L.el,k); return true; }
    if(k==='a'){ const c=document.activeElement; if(c&&L.el.contains(c)&&c.matches('[data-nav]')){ c.click(); } else focusFirst(L); return true; }
    if(k==='b'||k==='start'){ if(L.onBack){ Snd.back(); L.onBack(); } return true; }
    return true; });
  return {
    root, stack,
    push(el,opts={}){ const L=Object.assign({el},opts); root.appendChild(el); stack.push(L); requestAnimationFrame(()=>{ if(stack.includes(L)&&opts.autofocus!==false)focusFirst(L); }); return L; },
    pop(L){ const i=L?stack.indexOf(L):stack.length-1; if(i<0)return; const [x]=stack.splice(i,1); x.el.remove(); x.onClose&&x.onClose(); const T=stack[stack.length-1]; if(T&&T.autofocus!==false&&!T.el.contains(document.activeElement))requestAnimationFrame(()=>{ if(stack[stack.length-1]===T&&!T.el.contains(document.activeElement))focusFirst(T); }); },
    top:()=>stack[stack.length-1], clear(){ while(stack.length)UI.pop(); }, refocus(){ const L=stack[stack.length-1]; L&&focusFirst(L); }, focusFirst,
  };
})();
function toast(msg,cls=''){ const t=h('div',{class:'toast '+cls},msg); $('#screen').appendChild(t); setTimeout(()=>t.remove(),1800); }

/* dialogue — typewriter text; A (or a tap) skips, then advances */
const Text=(()=>{
  function speed(){ const v=[0,28,16,6][Settings.text]; return v==null?16:v; }
  /* say(text, {who, choices:[...], keep}) → resolves when dismissed (or with the chosen index) */
  function say(text,opts={}){ return new Promise(res=>{
    const box=h('div',{id:'textbox'}); if(opts.who)box.append(h('div',{class:'who'},opts.who)); const p=h('div'); box.append(p); const more=h('span',{class:'more'},'▼');
    let i=0,done=false,timer=null; const full=String(text);
    const finish=()=>{ clearInterval(timer); p.textContent=full; done=true; if(opts.choices){ const ch=h('div',{class:'choices'}); opts.choices.forEach((c,n)=>ch.append(h('button',{class:'btn'+(n===0?' acc':''),'data-nav':'',onclick:()=>{ Snd.blip(); UI.pop(L); res(n); }},c))); box.append(ch); UI.focusFirst(L); } else { box.append(more); if(opts.auto)setTimeout(()=>{ if(UI.stack.includes(L)){ UI.pop(L); res(0); } },opts.auto); } };
    const L=UI.push(box,{nav:true,autofocus:false,onKey(k){ if(!done&&(k==='a'||k==='b')){ finish(); return true; } if(done&&!opts.choices&&(k==='a'||k==='b')){ Snd.blip(); UI.pop(L); res(0); return true; } if(opts.choices&&k==='b'&&opts.cancel!=null){ UI.pop(L); res(opts.cancel); return true; } return false; }});
    box.addEventListener('pointerdown',e=>{ if(e.target.closest('button'))return; e.preventDefault(); if(!done)finish(); else if(!opts.choices){ Snd.blip(); UI.pop(L); res(0); } });
    const sp=speed(); if(!sp)finish(); else timer=setInterval(()=>{ i+=1; p.textContent=full.slice(0,i); if(i>=full.length)finish(); },sp);
  }); }
  async function lines(arr,opts){ for(const t of arr)await say(t,opts); }
  return {say,lines};
})();

/* ═══════════════════════════════════════════════════════════════
   2 · THE FORGES — MeridianOS's Portal Forge (GenAnim) and Icon Forge

       out when both forges are fed the same seed: the icon is its body,
       the portal is where it lives.

      case 'clifford':{ const a=-2+P.a*4,b=-2+P.b*4,cc=-2+P.c*4,d=-2+P.d*4; let x=.1,y=.1; st.pts=st.pts||[]; for(let i=0;i<40;i++){ const nx=Math.sin(a*y)+cc*Math.cos(a*x),ny=Math.sin(b*x)+d*Math.cos(b*y); x=nx;y=ny; st.pts.push([x,y]); } if(st.pts.length>900)st.pts.splice(0,st.pts.length-900); const sc=16/(1+Math.abs(cc)+Math.abs(d))*1.4; st.pts.forEach((p,i)=>{ g.fillStyle=i%2?c1:c2; g.fillRect((16+p[0]*sc*.45)|0,(16+p[1]*sc*.45)|0,1,1); }); break; }

/* eyes turn an emblem into a creature: find a symmetric pair of filled cells high on the body */
function giveEyes(G){ const n=G.n, g=G.g.map(r=>r.slice()); const big=n>=16; let best=null,bs=1e9;

  if(!best){ best=[Math.round(n*.3),Math.round(n*.4)]; const [x,y]=best; for(const [xx,yy] of [[x,y],[x,y+1],[x-1,y],[x-1,y+1],[x+1,y],[x,y-1]]){ if(g[yy]&&xx>=0&&xx<n){ g[yy][xx]=Math.max(2,g[yy][xx]); g[yy][n-1-xx]=g[yy][xx]; } } for(let yy=0;yy<n;yy++)for(let xx=0;xx<n;xx++){ if(g[yy][xx])continue; if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>g[yy+dy]&&g[yy+dy][xx+dx]>1))g[yy][xx]=1; } }
  const [x,y]=best; const E=[]; if(big){ E.push([x-1,y,5],[x,y,5],[x-1,y+1,5],[x,y+1,6]); } else { E.push([x,y,5],[x,y+1,6]); }
  const eyes=[]; E.forEach(([xx,yy,v])=>{ eyes.push([xx,yy,v],[n-1-xx,yy,v]); });

const SPR={};

function drawPortrait(t){ const W=64,H=64; const c=cv(W,H); const g=ctx2(c); const put=(x,y,col)=>{ g.fillStyle=col; g.fillRect(x,y,1,1); };
  const ell=(cx,cy,rx,ry,col,test)=>{ for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){ const d=((x-cx)/rx)**2+((y-cy)/ry)**2; if(d<=1&&(!test||test(x,y)))put(x,y,col); } };
  const rect=(x,y,w,hh,col)=>{ g.fillStyle=col; g.fillRect(x,y,w,hh); };
  /* shirt — navy and cream bands */
  for(let y=40;y<64;y++){ const half=13+Math.min(9,(y-40)*.9); for(let x=Math.floor(32-half);x<32+half;x++){ const band=Math.floor((y-41)/4)%2; put(x,y,band?'#f3efc4':'#1c2a78'); } }
  rect(26,39,12,3,'#f3efc4'); rect(28,38,8,2,'#e0a07c');
  /* arms raised to the shoulders, forearms up */
  const arm=(x0,dir)=>{ for(let i=0;i<14;i++){ rect(x0+dir*Math.floor(i*.35),52-i,5,1,'#f2a47c'); } rect(x0-1+dir*5,36,7,5,'#f2a47c'); };
  arm(10,-0); arm(49,0);

  ell(32,26,10,12,'#f2a47c'); ell(32,31,8,6,'#e8946c',(x,y)=>y>31);
  for(let x=25;x<=39;x++)for(let y=33;y<=38;y++){ if(((x-32)/8)**2+((y-29)/9)**2<=1&&(x*7+y*3)%5===0)put(x,y,'#9a5a44'); }
  rect(29,34,6,1,'#9a4a3a'); rect(30,35,4,1,'#c06a50');
  /* hair poking out */
  rect(21,20,3,8,'#5a3420'); rect(40,20,3,8,'#5a3420'); rect(22,19,20,3,'#5a3420');
  /* the cap — backwards: crown and the snapback gap */
  ell(32,17,12,8,'#0a0a12',(x,y)=>y<=19); ell(32,16,10,6,'#262640',(x,y)=>y<=16); rect(20,18,24,2,'#0a0a12'); rect(28,18,8,2,'#5a3420'); rect(27,17,1,3,'#0a0a12'); rect(36,17,1,3,'#0a0a12');
  /* shield shades — green over cyan, one long glint */
  rect(20,24,24,7,'#0a0a12'); for(let x=21;x<43;x++){ for(let y=25;y<30;y++){ const k=(y-25)/4; put(x,y,k<.45?'#3dff7a':k<.75?'#3de8b0':'#5ff4ff'); } } for(let i=0;i<6;i++)put(24+i*2+Math.floor(t*6)%2,26,'#ffffff'); rect(36,26,4,1,'#eaffff'); rect(31,31,2,2,'#c9785a');
  /* the capsules — one in each hand */
  const sp=t*1.6; drawDisc(g,9,34,8,sp,2); drawDisc(g,55,34,8,-sp,2); clover(g,5,28,'#2ec47a'); clover(g,53,37,'#2ec47a');
  for(const [fx,fy] of [[4,40],[13,40],[51,40],[60,40]])rect(fx,fy-2,3,4,'#f2a47c');
  /* outline pass — every lit pixel next to empty gets a black rim */
  const id=g.getImageData(0,0,W,H); const d=id.data; const out=[]; for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const o=(y*W+x)*4; if(d[o+3])continue; if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{ const xx=x+dx,yy=y+dy; return xx>=0&&yy>=0&&xx<W&&yy<H&&d[(yy*W+xx)*4+3]; }))out.push([x,y]); } g.fillStyle='#000'; out.forEach(([x,y])=>g.fillRect(x,y,1,1));
  return c; }

/* the hundred: roles, looks, and what they say — the deeper lines come out on later visits */
const NPC_TYPES=(()=>{ const T={}; const P=(id,name,look,lines,extra={})=>{ T[id]=Object.assign({id,name,kind:'person',look,lines},extra); }; const C=(id,name,crit,lines,extra={})=>{ T[id]=Object.assign({id,name,kind:'critter',crit,lines},extra); };
  /* people of the towns */
  P('baker','Baker',{hat:'beanie',hatCol:'#f4f4f4',pat:'plain',top:'#f4e8d8',top2:'#c9a26b'},['Fresh out of the oven. I bake by the node\'s clock; it has kept perfect time since the last day of 1999.','The node hums a four-on-the-floor while the bread proves. Chip\'s protocol, they call it.','Between you and me: the loaves rise faster when a Bloom Entity sleeps in the shop.']);
  P('librarian','Librarian',{hair:'bun',glasses:'#12121e',pat:'coat',top:'#6a3aa0',top2:'#c2a8ff'},['Every book in here is generated from a seed. You could spend your life reading this one shelf.','There is a library, they say, that holds every possible page. Most of it is noise. The trick is knowing the seed.','Click the first link on any page in the Archive and keep clicking. Every path ends at "Philosophy". Every one.']);
  P('dj','DJ',{hat:'headphones',hatCol:'#ff5c7a',pat:'stripes',top:'#1e1e2e',top2:'#ff7ce8'},['I play the nodes. Each one has a different swing.','You know the link that always lands on the same song, no matter what it claims to be? A node did that first.','The 808 in every node is the same 808. One drum machine, sampled across the whole band.']);
  P('gazette','Gazette Editor',{hat:'cap',hatCol:'#2a2f55',glasses:'#12121e',pat:'vest',top:'#e8ecff',top2:'#2a2f55'},['CANOPY GAZETTE. Wasp traffic heavy near the fork. Fruit futures up two seeds.','We print whatever the node buffer says. Some mornings it is a headline. Some mornings it is coordinates.','Back issues are in the office. Some of them describe a Séance that hasn\'t happened yet.']);
  P('mailbot','Postie',{hat:'cap',hatCol:'#2a5fd6',pat:'coat',top:'#2a5fd6',top2:'#e8ecff'},['Mail for you? No. Mail from your mum: eat something that is not fruit.','I deliver to addresses that don\'t exist yet. The nodes tell me where they will be.','Once, every letter on the band was the same letter, repeated. A858, the stamp said. Nobody has decoded it.']);
  P('scientist','Researcher',{hair:'short',glasses:'#12121e',pat:'coat',top:'#f4f4ff',top2:'#7cf5ff'},['I measured an Entity once. It came out different each time.','Two of them standing close will hum in phase. That is not metaphor. I have the plots.','We keep a catalogue of anomalies. Numbered. Contained. Most are just very shy Entities.']);
  P('coder','Coder',{hat:'headphones',hatCol:'#1e1e2e',pat:'plain',top:'#12152a',top2:'#7cf5ff'},['It\'s all one file. The whole world. One HTML file.','On the last night of 1999 everyone thought the clocks would break. The nodes just started counting.','I once found a video of a red rectangle and a blue rectangle, uploaded every few minutes, for years. Nobody made it. I think it was a node calibrating.']);
  P('streamer','Streamer',{hat:'headphones',hatCol:'#ff7ce8',pat:'stripes',top:'#3a2a5a',top2:'#ff7ce8'},['Chat says hi. Chat says throw the capsule NOW.','I streamed an empty room for six hours once. Highest numbers I ever did.','Somewhere there is a website that does nothing. You can do anything there. The infinite is possible.']);
  P('skater','Skater',{hat:'capback',hatCol:'#1e1e2e',pat:'stripes',top:'#1c2a78',top2:'#f3efc4'},['The purple path is faster than the grass. Trust me.','Did you know the whole first web page is still up? Just text. Still there.']);
  P('cyclist','Courier',{hat:'helmet',hatCol:'#ffd166',pat:'coat',top:'#ff5c7a',top2:'#1e1e2e'},['Ten deliveries an hour. The nodes keep the roads open.','Someone paid ten thousand coins for two pizzas once. Best delivery I ever made.']);
  P('farmer','Farmer',{hat:'straw',pat:'overalls',top:'#f3efc4',top2:'#2a5fd6'},['Chard, chard, chard. It grows back overnight if a Bloom sleeps in the row.','The crows keep their distance from the tall stuff. They know.']);
  P('beekeeper','Beekeeper',{hat:'hood',hatCol:'#f4f4ff',pat:'coat',top:'#f4f4ff',top2:'#ffd166'},['Bees get lost trying to count a Bloom\'s edges.','The hive hums at the node\'s frequency. Every hive on the band, same note.']);
  P('gardener','Gardener',{hat:'flower',pat:'overalls',top:'#3dcf9a',top2:'#2a4a2a'},['I planted a seed word once. A whole Entity grew. Try your own name in the Area Maker.','Flowers face the nearest node. Not the sun. The node.']);
  P('chef','Chef',{hat:'beanie',hatCol:'#f4f4f4',hatCol2:'#f4f4f4',pat:'plain',top:'#f4f4ff',top2:'#c9c9e0'},['Today\'s special: fruit futures. Up two seeds.','I cooked for a Séance once. It ate the plates.']);
  P('barista','Barista',{hat:'bandana',hatCol:'#c04a2a',pat:'vest',top:'#3a2414',top2:'#ffd166'},['Coffee? We only serve Tonic. Same thing, ask anyone.','The regulars swear the node steams the milk better than the machine.']);
  P('florist','Florist',{hair:'long',hat:'flower',pat:'dress',top:'#ff7ce8',top2:'#3dcf9a'},['A petal for every formula solved. That\'s what the Bloom-types say.','Some flowers here only bloom when the Wi-Fi drops.']);
  P('tailor','Tailor',{hair:'bob',glasses:'#12121e',pat:'vest',top:'#6a3aa0',top2:'#e8ecff'},['Striped, obviously. Everyone knows the shirt.','Is the shirt blue and black or white and gold? Do not start this in my shop.']);
  P('smith','Smith',{hat:'goggles',beard:1,pat:'overalls',top:'#8a2a3a',top2:'#3a3a4e'},['I forged the first capsule clover. It held.','KNOT-types tie themselves up when nervous. I make the tools to undo them.']);
  P('brewer','Brewer',{beard:1,hat:'cap',hatCol:'#3a2414',pat:'vest',top:'#c9a26b',top2:'#3a2414'},['Tonic, big tonic. Both brewed here. Both taste of static.','The old recipe called for one hiss from a STATIC-type. We use a recording now.']);
  P('nurse','Medic',{hair:'bun',pat:'coat',top:'#f4f4ff',top2:'#ff5c7a'},['Your Entities are rested. The node handles the rest.','Fray heals with a night\'s sleep. Lock needs a shake. Both need you to stop battling for a minute.']);
  P('ranger','Ranger',{hat:'cap',hatCol:'#2a4a2a',pat:'coat',top:'#2a4a2a',top2:'#c9a26b'},['Sixty percent of the people out on the routes want a battle. I counted.','The shadows in the woods aren\'t hiding. They just haven\'t decided to be seen.']);
  P('sailor','Sailor',{hat:'beanie',hatCol:'#1c2a78',pat:'stripes',top:'#f4f4ff',top2:'#1c2a78'},['Do not skip capsules across the water. The pond remembers.','I sailed to the edge of the void once. There was a node there too.']);
  P('fisher','Angler',{hat:'straw',pat:'vest',top:'#2a5fd6',top2:'#c9a26b'},['Caught a WAVE-type on a line once. It hummed all the way in.','The fish in the pond glow when the node syncs. Every hour, on the hour.']);
  P('miner','Miner',{hat:'helmet',hatCol:'#ffd166',visor:'#fff3a0',pat:'overalls',top:'#c9a26b',top2:'#3a3a4e'},['GEM-types are heavier than they look and colder than they look.','There\'s a cavern under every node. I\'ve never found the bottom.']);
  P('monk','Monk',{hat:'hood',hatCol:'#c04a2a',pat:'dress',top:'#c04a2a',top2:'#8a2a3a'},['The Séance said someone would come. It says that every day.','Every seed is a species. Every name is a seed. Sit with that.']);
  P('wizard','Wizard',{hat:'cone',hatCol:'#6a3aa0',hatCol2:'#ffd166',beard:1,pat:'dress',top:'#6a3aa0',top2:'#3a2a5a'},['Type wheel: sixteen spokes. Three to six ahead of you is weak to you. That far behind is strong.','There is a code. Up, up, down, down. The nodes answer to it. I have never dared.']);
  P('knight','Knight',{hat:'helmet',hatCol:'#9aa3d1',pat:'plain',top:'#9aa3d1',top2:'#5a6396'},['I guard nothing. There is nothing here to guard. I stay anyway.','Kilroy was here. Whoever he was. He was here before all of us.']);
  P('punk','Punk',{hair:'mohawk',hairCol:'#ff5c7a',pat:'vest',top:'#1e1e2e',top2:'#ff5c7a'},['All your base. You know the rest.','The nodes are cops. Friendly cops. Still cops.']);
  P('grandma','Grandma',{hair:'bun',hairCol:'#f4f4f4',glasses:'#12121e',pat:'dress',top:'#c2a8ff',top2:'#6a3aa0'},['In my day the portals were smaller and you had to wait for them to load.','My mother said the world was one file. My mother was right about most things.']);
  P('grandpa','Grandpa',{hair:'bald',beard:1,hairCol:'#f4f4f4',pat:'vest',top:'#c9a26b',top2:'#3a2414'},['Back when the clocks nearly stopped, I was the one who reset the node. Nobody thanked me.','Something under construction. A little animated digger. Every site had one. Nothing was ever finished.']);
  P('kid','Kid',{hair:'spiky',pat:'stripes',top:'#ffd166',top2:'#ff5c7a'},['I have a hundred capsules! (I have two.)','There\'s a dancing baby in the node buffer. My brother says it\'s older than the band.']);
  P('kid2','Kid',{hair:'bob',hairCol:'#e8c070',pat:'dress',top:'#7cf5ff',top2:'#2a5fd6'},['My Entity is a frog. Well. It\'s a frog-ish.','A hamster danced once and the whole web watched. The node still has the loop.']);
  P('twin','Twin',{hair:'short',hairCol:'#c04a2a',pat:'plain',top:'#3dcf9a'},['We\'re twins. The other one is in the other town.','We say the same things. That\'s how you know the seed is the same.']);
  P('painter','Painter',{hat:'beanie',hatCol:'#c04a2a',pat:'overalls',top:'#f4f4ff',top2:'#ff7ce8'},['I paint in Clover. Every canvas is a capsule.','Nobody has painted the Séance. It doesn\'t hold still.']);
  P('poet','Poet',{hair:'long',hairCol:'#1a1a1a',pat:'coat',top:'#3a2a5a',top2:'#c2a8ff'},['Fourteen syllables per Entity. That is the rule. I made it up.','There is a text that bleeds. Letters stack on letters until the page drowns. Do not read it at the node.']);
  P('archivist','Archivist',{hat:'hood',hatCol:'#2a2f55',glasses:'#12121e',pat:'coat',top:'#2a2f55',top2:'#7cf5ff'},['We catalogue lost media. Broadcasts that aired once. Songs nobody can find twice.','Item 0: a game cabinet that made people forget. Item 1: a puzzle that recruited from a bus stop. Item 2: you.']);
  P('cartographer','Cartographer',{hat:'cap',hatCol:'#c9a26b',pat:'vest',top:'#e8ecff',top2:'#c9a26b'},['Every room out here is a shape the tetromino gods dropped. I map them anyway.','The Area Maker draws the same tiles I do. We are colleagues.']);
  P('tinkerer','Tinkerer',{hat:'goggles',pat:'overalls',top:'#5a5a80',top2:'#ffd166'},['I opened a node once. It is 808s all the way down.','The ꟻX MACHINE was mine before it was Chip\'s. Don\'t tell Chip.']);
  P('priestess','Priestess',{hat:'hood',hatCol:'#f4f4ff',hair:'long',pat:'dress',top:'#f4f4ff',top2:'#ffd166'},['The altar answers. Something up there is listening.','We pray to the universal RNG. It is fair. That is all we ask.']);
  P('thief','Pickpocket',{hat:'bandana',hatCol:'#1e1e2e',mask:'#1e1e2e',pat:'plain',top:'#3a3a4e'},['I didn\'t take anything. Check your capsules. …Fine, check again.','There\'s a ghost ship on the band that only appears in search results. No one has ever sailed on it.']);
  P('detective','Detective',{hat:'tophat',hatCol:'#3a2414',glasses:'#12121e',pat:'coat',top:'#3a2414',top2:'#c9a26b'},['A man appears in dreams all over the band. Same face. Nobody knows him.','Semicircle. Unfavorable. That\'s all the case file says. Then the channel went dark.']);
  P('magician','Magician',{hat:'tophat',hatCol:'#1e1e2e',hatCol2:'#ff5c7a',pat:'coat',top:'#1e1e2e',top2:'#ff5c7a'},['Pick a card. Any seed. …That\'s the one I generated.','A cabinet that made you forget. Men in black picked up the scores. Or so the arcade says.']);
  P('astronaut','Astronaut',{hat:'helmet',hatCol:'#f4f4ff',visor:'#ffd166',pat:'plain',top:'#f4f4ff',top2:'#ff5c7a'},['I heard a signal once. Seventy-two seconds. Then nothing, ever again. Wow.','The void is just a room with no walls. The nodes still find it.']);
  P('lifeguard','Lifeguard',{hat:'cap',hatCol:'#ff3b30',pat:'plain',top:'#ff3b30',top2:'#f4f4ff'},['No running on the bridge. No capsules in the water.','WAVE-types are good swimmers. STATIC-types sink and don\'t mind.']);
  P('busker','Busker',{hat:'beanie',hatCol:'#ffd166',pat:'stripes',top:'#3a2414',top2:'#ffd166'},['Spare capsule? A song for a capsule?','I know a tune with no ending. A cat flies across the sky and trails a rainbow. Loop it.']);
  P('pilot','Pilot',{hat:'goggles',pat:'coat',top:'#3a2414',top2:'#c9a26b'},['I fly between clusters. The station dispatches me. I have never seen the dispatcher blink.','Numbers on the radio. A woman reading digits. Every night. No one knows to whom.']);
  P('dispatcher2','Operator',{hat:'headphones',hatCol:'#7cf5ff',pat:'coat',top:'#12152a',top2:'#7cf5ff'},['Ten bands, ten doors. I open them in order. Mostly.','The station was built around one node. The oldest one. It predates the plaza.']);
  P('janitor','Janitor',{hat:'cap',hatCol:'#3a3a4e',pat:'overalls',top:'#9aa3d1',top2:'#3a3a4e'},['Someone keeps writing "was here" on the node. I clean it. It comes back.','There is an image on the band of a very tall man in a very long coat. I do not look at it.']);
  P('teacher','Teacher',{hair:'bob',glasses:'#12121e',pat:'coat',top:'#2a5fd6',top2:'#e8ecff'},['Type is readable from silhouette. That is today\'s whole lesson.','Homework: find the Philosophy page. Bring a route.']);

/* a room is a few rectangles dropped on each other — I, L, T, S, Z, O, J, and worse */
function tetroMask(w,h,r){ const M=new Uint8Array(w*h); const rects=[]; const n=2+Math.floor(r()*3); const shape=pick(r,['I','L','T','S','O','J','Z','plus','U']);
  const add=(x,y,ww,hh)=>{ x=clamp(x,1,w-2); y=clamp(y,1,h-2); ww=clamp(ww,5,w-1-x); hh=clamp(hh,5,h-1-y); rects.push([x,y,ww,hh]); for(let yy=y;yy<y+hh;yy++)for(let xx=x;xx<x+ww;xx++)M[yy*w+xx]=1; };
  const cw=Math.floor(w*.45),ch=Math.floor(h*.45);
  if(shape==='I'){ if(r()<.5)add(1,Math.floor(h*.3),w-2,Math.floor(h*.45)); else add(Math.floor(w*.3),1,Math.floor(w*.45),h-2); }
  else if(shape==='L'){ add(1,1,cw,h-2); add(1,h-1-ch,w-2,ch); }
  else if(shape==='J'){ add(w-1-cw,1,cw,h-2); add(1,h-1-ch,w-2,ch); }
  else if(shape==='T'){ add(1,1,w-2,ch); add(Math.floor(w/2-cw/2),1,cw,h-2); }
  else if(shape==='S'){ add(1,h-1-ch,Math.floor(w*.6),ch); add(w-1-Math.floor(w*.6),1,Math.floor(w*.6),ch+1); }
  else if(shape==='Z'){ add(1,1,Math.floor(w*.6),ch+1); add(w-1-Math.floor(w*.6),h-1-ch,Math.floor(w*.6),ch); }
  else if(shape==='plus'){ add(Math.floor(w/2-cw/2),1,cw,h-2); add(1,Math.floor(h/2-ch/2),w-2,ch); }
  else if(shape==='U'){ add(1,1,cw,h-2); add(w-1-cw,1,cw,h-2); add(1,h-1-ch,w-2,ch); }
  else { add(Math.floor(w*.15),Math.floor(h*.15),Math.floor(w*.7),Math.floor(h*.7)); }
  for(let i=rects.length;i<n;i++)add(1+Math.floor(r()*(w-8)),1+Math.floor(r()*(h-8)),6+Math.floor(r()*Math.floor(w*.5)),5+Math.floor(r()*Math.floor(h*.5)));
  /* keep the biggest connected blob */ const seen=new Uint8Array(w*h); let best=null; for(let i=0;i<w*h;i++){ if(!M[i]||seen[i])continue; const q=[i]; seen[i]=1; const cells=[]; while(q.length){ const c=q.pop(); cells.push(c); const x=c%w,y=(c/w)|0; [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{ const xx=x+dx,yy=y+dy; if(xx<0||yy<0||xx>=w||yy>=h)return; const j=yy*w+xx; if(M[j]&&!seen[j]){ seen[j]=1; q.push(j); } }); } if(!best||cells.length>best.length)best=cells; }
  const out=new Uint8Array(w*h); (best||[]).forEach(c=>out[c]=1); return out; }

  words.forEach(push); let guard=0; while(total<999&&guard++<20000){ const a=pick(r,words),b=pick(r,words); push(r()<.6?a+' '+b:a+(r()<.5?'-'+b:' '+Math.floor(r()*99+1))); }

      else { const s=npcSprite(o.spr,o.dir)||NPC_SPR.frog; const hop=o.spr==='crow'&&Math.sin(t*2.2+o.x*3)>.92?-2:o.spr==='lamp'?Math.round(Math.sin(t*1.5)):0; if(o.spr==='lamp')g.globalAlpha=.9+Math.sin(t*6)*.1; g.drawImage(s,x,y-4+hop); g.globalAlpha=1; }
      if(o.bubble){ g.fillStyle='#000'; g.fillRect(x+4,y-15,8,10); g.fillStyle='#fff'; g.fillRect(x+5,y-14,6,8); g.fillStyle='#ff5c7a'; g.fillRect(x+7,y-13,2,4); g.fillRect(x+7,y-8,2,1); } }
    else if(o.k==='sign'){ g.drawImage(NPC_SPR.sign,x,y-4); }
    else if(o.k==='printer'){ g.drawImage(SPRINT,x,y-8); const k=(t*3|0)%3; g.fillStyle='#7cf5ff'; g.fillRect(x+4+k*3,y+2,2,1); }
    else if(o.k==='mixer'){ g.drawImage(SMIX,x-8,y-12); const k=(t*6|0)%8; g.fillStyle=HOLO[k%6]; g.fillRect(x-6+k*3,y-1,2,1); if(Math.sin(t*2)>0){ g.fillStyle='#fff'; g.fillRect(x+2,y-9,1,1); } }
    else if(o.k==='altar'){ g.drawImage(TileArt.get('a',0),x,y); if(!G.flags[o.give&&o.give.flag]){ const b=Math.round(Math.sin(t*3)*1); g.fillStyle='#ffd166'; g.fillRect(x+6,y-3+b,4,2); g.fillRect(x+9,y-4+b,2,2); g.fillStyle='#fff3a0'; g.fillRect(x+7,y-3+b,1,1); } }
    else if(o.k==='heal'){ g.drawImage(SNODE,x,y-10); const k=(t*4|0)%4; g.fillStyle=['#b6ff5c','#ffd166','#ff5c7a','#7cf5ff'][k]; g.fillRect(x+5,y+5+k*2,1,1); if(Math.sin(t*2)>.9){ g.fillStyle='#8ef4ff'; g.fillRect(x+6,y-10,4,1); g.fillRect(x+5,y-11,6,1); } }
    else if(o.k==='item'){ const b=Math.round(Math.sin(t*3+o.x)*1); g.fillStyle='#0006'; g.fillRect(x+4,y+13,8,2); drawDisc(g,x+8,y+9+b,4,t,1); if(Math.sin(t*4+o.y)>.8){ g.fillStyle='#fff'; g.fillRect(x+11,y+4+b,1,3); g.fillRect(x+10,y+5+b,3,1); } } },
};

async function tamerApproach(o,dist){ o.bubble=1; Snd.encounter(); await wait(650); o.bubble=0; const P=World.P; for(let i=1;i<dist;i++){ const [dx,dy]=DIRV[o.dir]; o.px=o.x; o.py=o.y; o.x+=dx; o.y+=dy; o.walkT=0; await wait(200); }
  P.dir=OPP[o.dir]; await Text.say(o.text||'Battle!',{who:o.name}); await tamerBattle(o); }
async function tamerBattle(o){ const party=o.battle.map(([k,lv])=>makeMon(k,lv)); const res=await Battle.run({tamer:{name:o.name||'Tamer',party,frames:o.frames}}); if(res==='win'){ G.flags['beat:'+o.id]=1; if(o.afterFlag)G.flags[o.afterFlag]=1; saveGame(true); if(o.after)await Text.say(o.after,{who:o.name}); if(o.boss){ Snd.door(); await Text.say(`${o.name} packs up and leaves. The way ahead is open.`); World.objs=World.objs.filter(q=>q!==o&&!(q.k==='sign'&&q.guard===o.id)); } } }

function canvasOf(src,cls){ const c=cv(src.width,src.height); ctx2(c).drawImage(src,0,0); if(cls)c.className=cls; return c; }
function monThumb(key,mode){ const sp=species(key); const n=sp.grid.n; const c=cv(n+4,n+4); const x=ctx2(c); x.drawImage(entImg(key,1,mode||'front'),2,2); return c; }
function panel(title,opts={}){ const el=h('div',{class:'panel bevel'}); const hd=h('header',{},h('h2',{},title)); const body=h('div',{class:'body'}); el.append(hd,body); let L;
  const back=()=>{ opts.onBack?opts.onBack():UI.pop(L); }; hd.append(h('button',{class:'btn pclose','data-nav':'',onclick:()=>{ Snd.back(); back(); }},opts.closeLabel||'Close'));
  L=UI.push(el,{onBack:back,onClose:opts.onClose,onKey:opts.onKey}); return {el,body,L,hd,close:()=>UI.pop(L)}; }
function hpBar(m){ const mx=stat(m,'hp'); const p=m.hp/mx; return `<div class="bar ${p<.2?'low':p<.5?'mid':''}"><i style="width:${Math.max(0,p*100)}%"></i></div>`; }
function monCard(m,opts={}){ const sp=species(m.key); const c=monThumb(m.key); const b=h('button',{class:'card'+(m.hp<=0?' fainted':'')+(opts.sel?' sel':''),'data-nav':'',onclick:opts.onclick});
  b.append(c,h('div',{class:'info',html:`<b>${esc(monName(m))}</b><small>Lv ${m.lv} ${tchip(sp.type)}${m.st?` <span class="tchip" style="background:${m.st==='fray'?'var(--rose)':'var(--violet)'}">${m.st.toUpperCase()}</span>`:''}</small><div class="hp" style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--fg2)">${hpBar(m)}<span>${m.hp}/${stat(m,'hp')}</span></div>`})); return b; }

function talkKey(o){ return (World.a?World.a.id:'')+':'+o.x+','+o.y; }
function nextLine(o){ const T=NPC_TYPES[o.spr]; const lines=o.lines||(T&&!o.text?T.lines:null); if(!lines)return o.text; G.talk=G.talk||{}; const k=talkKey(o); const n=G.talk[k]||0; G.talk[k]=n+1; const deep=lines.length>1&&n>=lines.length&&!(G.bag&&G.bag.mixtape)?lines.length-2:Math.min(n,lines.length-1); return lines[deep]; }
async function talkTo(o){ const P=World.P; if(o.k==='npc'&&o.spr!=='lamp'&&o.spr!=='shadow')o.dir=OPP[P.dir];
  if(o.dyn==='gazette'){ await Text.say(nextLine(o)||'Read all about it.',{who:o.name}); await Text.lines(gazetteHeadlines().map((x,i)=>i?'· '+x:x.toUpperCase()),{who:'Gazette'}); return; }
  if(o.k==='sign'){ await Text.say(o.text||'…'); return; }
  if(o.k==='heal'){ await station(o); return; }
  if(o.k==='mixer'){ await mixerScene(o); return; }
  if(o.k==='altar'){ if(o.need&&!G.flags[o.need]){ await Text.say(o.needText||'The altar is silent.'); return; } if(o.give&&!G.flags[o.give.flag]){ await Text.lines(o.lines||['The altar answers.']); G.bag[o.give.item]=(G.bag[o.give.item]||0)+o.give.n; G.flags[o.give.flag]=1; Snd.caught(); await Text.say(`You received the ${ITEMS[o.give.item].name}!`); if(o.after)await Text.say(o.after); saveGame(true); } else await Text.say(o.after||'The altar has nothing more to say.'); return; }
  if(o.k==='item'){ const it=ITEMS[o.item]||ITEMS.capsule; const n=o.n||1; G.bag[o.item]=(G.bag[o.item]||0)+n; G.flags['item:'+o.id]=1; World.objs=World.objs.filter(q=>q!==o); Snd.piece(); await Text.say(`You found ${n>1?n+'× ':''}${it.name}${n>1&&!it.name.endsWith('s')?'s':''}!`); if(learnBlueprint(o.item))await Text.say(`Blueprint learned: ${it.name}. Any 3D printer can make more, for shards.`); saveGame(true); return; }
  if(o.k==='printer'){ await printerScene(o); return; }
  if(o.hint){ G.flags['heard:'+o.hint]=1; }
  if(o.spr==='shadow'){ await Text.say(o.text||'The shadow flickers and is gone.'); return; }
  if(o.starter&&!G.flags.starter){ await starterScene(o); return; }
  if(o.gate){ await gateScene(o); return; }
  if(o.battle&&o.battle.length&&!G.flags['beat:'+o.id]){ if(!G.party.some(m=>m.hp>0)){ await Text.say('You don\'t have an Entity that can battle.',{who:o.name}); return; } await Text.say(o.text||'Battle!',{who:o.name}); await tamerBattle(o); return; }
  if(o.give&&!G.flags[o.give.flag]){ if(o.need&&!G.flags[o.need]){ await Text.say(o.needText||o.text,{who:o.name}); return; } await Text.say(o.text,{who:o.name}); G.bag[o.give.item]=(G.bag[o.give.item]||0)+o.give.n; G.flags[o.give.flag]=1; Snd.piece(); await Text.say(`You got ${o.give.n}× ${ITEMS[o.give.item].name}.`); if(learnBlueprint(o.give.item))await Text.say(`Blueprint learned: ${ITEMS[o.give.item].name}.`); saveGame(true); return; }
  await Text.say((o.battle&&G.flags['beat:'+o.id]&&o.after)||(o.give&&o.after)||nextLine(o)||'…',{who:o.name}); }

/* the professor's three capsules, and the XP Share */
async function starterScene(o){ const who=o.name;
  await Text.lines(['Ah! The kid from the shed. You\'re up early.','The portals opened again last night. Things walked out — Entities. Each one is grown from a seed, the same way its portal is.','You\'ll want one before you go into the grass. I have three capsules here.'],{who});
  while(true){ const pickI=await new Promise(res=>{ const p=panel('Choose an Entity',{onBack:()=>{}}); p.hd.querySelector('.btn').remove(); const cards=h('div',{class:'cards'});
      STARTERS.forEach((k,i)=>{ const sp=species(k); const nx=species(STARTERS[(i+1)%3]); const pv=species(STARTERS[(i+2)%3]); const c=cv(sp.grid.n*4,sp.grid.n*4); ctx2(c).drawImage(entImg(k,4),0,0); c.style.cssText='width:64px;height:64px;background:#000;border:1px solid var(--line)';
        const b=h('button',{class:'card','data-nav':'',onclick:()=>{ Snd.cry(k); p.close(); res(i); }}); b.append(c,h('div',{class:'info',html:`<b>${sp.name}</b><small>${tchip(sp.type)}</small><small style="display:block;margin-top:3px">Strong against ${TYPES[nx.type].name}, weak to ${TYPES[pv.type].name}.</small>`})); cards.append(b); });
      p.body.append(h('p',{class:'dim',style:'margin:0 0 8px'},'Each one is strong against the next. Seeds: '+STARTERS.map(k=>'«'+k+'»').join(', ')+'.'),cards); });
    const k=STARTERS[pickI], sp=species(k); const ok=await Text.say(`${sp.name}, the ${TYPES[sp.type].name} Entity. Take this one?`,{who,choices:['Yes','Let me look again']}); if(ok!==0)continue;
    const m=makeMon(k,5); G.party.push(m); Atlas.own(k); G.bag.capsule=(G.bag.capsule|0)+10; G.bag.share=1; G.share=true; G.flags.starter=1; Snd.caught();
    await Text.say(`You received ${sp.name}! And ten Fweddle Capsules.`); await Text.lines(['And this: an XP Share. Every battle\'s xp gets split with the whole party. Switch it off in the bag if you want.','Its whole Atlas page is open — that happens when an Entity is in one of your capsules. Anything you only battle, you learn piece by piece.','The road east needs a Keeper\'s say-so at every town. Eight of them, then the plaza ring, then… well. Go and see.'],{who}); saveGame(true); return; } }

/* the 808 — heal, box, save */
async function station(o){ const NL=nodeLog((o&&o.node)||World.a.id); const c=await Text.say(`Relay Node ${NL.hex}. The LEDs walk. Something inside is keeping four-four time.`,{who:'Relay Node',choices:['Heal party','Capsule box','Read the log','Leave'],cancel:3});
  if(c===2){ G.talk=G.talk||{}; const k='node:'+NL.hex; const n=G.talk[k]||0; G.talk[k]=n+1; const depth=Math.min(n,G.bag.mixtape?2:1); const lines=[`NODE ${NL.hex} · cluster ${NL.cluster} · uptime since 1999-12-31 23:59:59 · last sync :${String(NL.sync).padStart(2,'0')}`]; for(let i=0;i<=depth;i++)lines.push(NL.lines[i]); if(n>=1&&!G.bag.mixtape)lines.push('(A deeper sector is locked. It wants a cassette.)'); if(depth===2)lines.push('END OF BUFFER. The node hums the handshake once and goes quiet.'); await Text.lines(lines,{who:'Relay Node'}); return; }
  if(c===0){ Snd.heal(); G.party.forEach(m=>{ m.hp=stat(m,'hp'); m.st=null; }); for(let i=0;i<6;i++){ Fade.col=['#ff3b30','#ff8c2a','#ffd166'][i%3]; Fade.a=.25; await wait(140); Fade.a=0; await wait(140); } Fade.col='#000'; G.heal={area:World.a.id,x:World.P.x,y:World.P.y}; saveGame(true); await Text.say('The node plays the handshake — kick, kick, hat, clap — and your Entities are back to full health. (Saved.)',{who:'Relay Node'}); if((G.bag.capsule|0)<3&&G.flags.starter){ G.bag.capsule=(G.bag.capsule|0)+5; Snd.piece(); await Text.say('The LEDs spell a pattern and the node prints five fresh Fweddle Capsules. It does that when you run low.',{who:'Relay Node'}); saveGame(true); } }
  else if(c===1)openBox(); }
function openBox(){ const p=panel('Capsule box'); const draw=()=>{ p.body.innerHTML=''; p.body.append(h('p',{class:'dim',style:'margin:0 0 6px'},`Party ${G.party.length}/6 · tap to move between party and box.`),h('h3',{style:'margin:4px 0;font-weight:400;color:var(--accent)'},'Party'));
  const a=h('div',{class:'cards'}); G.party.forEach((m,i)=>a.append(monCard(m,{onclick:()=>{ if(G.party.length<=1)return toast('keep at least one in your party','pink'); G.box.push(G.party.splice(i,1)[0]); Snd.blip(); draw(); }}))); p.body.append(a,h('h3',{style:'margin:10px 0 4px;font-weight:400;color:var(--accent)'},`Box · ${G.box.length}`));
  const b=h('div',{class:'cards'}); if(!G.box.length)b.append(h('p',{class:'dim'},'Nothing in the box. Entities you catch with a full party land here.')); G.box.forEach((m,i)=>b.append(monCard(m,{onclick:()=>{ if(G.party.length>=6)return toast('party is full','pink'); G.party.push(G.box.splice(i,1)[0]); Snd.blip(); draw(); }}))); p.body.append(b); UI.refocus(); }; draw(); }

/* the lamp — doors to areas built in the Area Maker */
async function gateScene(o){ const list=Custom.list(); await Text.say(o.text,{who:o.name}); if(!list.length){ await Text.say('No one has built anything yet. Areas made in the Area Maker (on the title screen) appear here.',{who:o.name}); return; }
  const chosen=await new Promise(res=>{ const p=panel('Doors from the Lamp',{onBack:()=>{ p.close(); res(null); }}); const L=h('div',{class:'menu-list'}); list.forEach(a=>{ const pc=portalOf(a.seed||a.id); pc.draw(1); const c=canvasOf(pc.c); c.style.cssText='width:28px;height:28px;border:1px solid #000'; const b=h('button',{class:'btn','data-nav':'',onclick:()=>{ p.close(); res(a); }}); b.append(c,h('span',{},a.name),h('i',{},`Lv ${a.lv[0]}–${a.lv[1]} · ${(a.table||[]).length} kinds`)); L.append(b); }); p.body.append(L); });

/* party — tap for details; in battle it doubles as the switch picker */

function monDetail(m,i,redraw){ const sp=species(m.key); const p=panel(monName(m)); const big=cv(sp.grid.n*6,sp.grid.n*6); ctx2(big).drawImage(entImg(m.key,6),0,0); big.style.cssText='width:120px;height:120px;background:#000;border:1px solid var(--line);flex:none';

  const mv=h('div',{class:'movelist',style:'margin-top:10px'}); m.moves.forEach(id=>{ const M=MOVES[id]; const b=h('button',{class:'btn','data-nav':'',style:'grid-column:1/-1;justify-content:flex-start;white-space:normal;text-align:left;gap:8px',onclick:()=>previewMove(m,id)}); b.insertAdjacentHTML('beforeend',`${tchip(M.t)}<span style="flex:1"><b style="font-weight:400">${M.name}</b><br><small class="dim">${moveDesc(id)}</small></span><span>${M.pow||'—'}</span>`); mv.append(b); });

  acts.append(h('button',{class:'btn','data-nav':'',onclick:async()=>{ const n=prompt('Nickname (leave empty for the species name)',m.nick||''); if(n===null)return; m.nick=n.trim().slice(0,12)||undefined; p.close(); redraw&&redraw(); }},'Nickname'));

/* a move, played on a practice dummy */
function previewMove(m,id){ const M=MOVES[id]; const p=panel(M.name); const c=cv(120,64); c.style.cssText='width:100%;max-width:360px;background:#000;border:1px solid var(--line);display:block;margin:0 auto;image-rendering:pixelated'; p.body.append(c,h('div',{style:'text-align:center;margin:6px 0',html:`${tchip(M.t)} · ${moveDesc(id)}`}),h('p',{class:'dim',style:'font-size:11px;text-align:center'},M.t===PLAIN?'PLAIN moves hit every type evenly.':`${TYPES[M.t].name} moves are strong against ${[3,4,5,6].map(d=>TYPES[(M.t+d)%NT].name).join(', ')}${M.t===PLAIN?'':' — and weak against '+[10,11,12,13].map(d=>TYPES[(M.t+d)%NT].name).join(', ')}.`));
  const fx=portalOf('fx:'+M.t,{fam:TYPES[M.t].fx,clear:true}); const me=entImg(m.key,2,'back'); const dummy=entImg('practice dummy',2,'sil'); let t0=performance.now(),raf=0; const loop=now=>{ if(!c.isConnected)return; const t=(now-t0)/1000%2.4; const g2=ctx2(c); g2.fillStyle='#05060f'; g2.fillRect(0,0,120,64); Stars.draw(g2,120,64,now/1000); g2.drawImage(me,Math.round(22+(t<.3?t*30:t<.6?(0.6-t)*30:0)),Math.round(40-me.height/2)); const hit=t>.5&&t<1.3; g2.globalAlpha=hit&&((now/60|0)%2)?0:1; g2.drawImage(dummy,Math.round(88-dummy.width/2+(hit?Math.sin(now/22)*2:0)),Math.round(30-dummy.height/2)); g2.globalAlpha=1; if(t>.35&&t<1.1){ const pc=fx.draw(now/1000*3); const k=(t-.35)/.75; const sz=Math.round(30+k*26); g2.globalAlpha=Math.sin(k*Math.PI); g2.drawImage(pc,0,0,32,32,88-sz/2,30-sz/2,sz,sz); g2.globalAlpha=1; } if(hit&&M.pow){ g2.fillStyle=TYPES[M.t].col; g2.font='10px "Px Pixeloid Sans"'; g2.fillText('-'+(M.pow||'?'),98,14); } raf=requestAnimationFrame(loop); }; raf=requestAnimationFrame(loop); Snd.hit(M.pow?1:0); }

/* bag */
function openBag(opts={}){ const p=panel('Bag',{onBack:opts.onBack}); const draw=()=>{ p.body.innerHTML=''; const L=h('div',{class:'menu-list'}); L.append(h('div',{class:'dim',style:'font-size:11px'},`${G.shards|0} shards`));
  for(const k of ['capsule','bigcap','tonic','big','reboot','candy']){ const n=G.bag[k]||0; if(!n&&!['capsule','tonic'].includes(k))continue; const ic=(k==='capsule'||k==='bigcap')?discIcon(16,1):null; const b=h('button',{class:'btn','data-nav':'',disabled:n<=0,onclick:()=>use(k)}); if(ic){ ic.style.cssText='width:24px;height:24px'; b.append(ic); } else b.append(h('span',{style:`display:inline-block;width:14px;height:18px;background:${k==='big'?'var(--accent2)':k==='reboot'?'var(--accent)':k==='candy'?'var(--sun)':'var(--lime)'};border:1px solid #000;box-shadow:inset 0 -6px 0 #0004`})); b.append(h('span',{},ITEMS[k].name),h('i',{},'×'+n)); L.append(b); }
  const keys=Object.keys(ITEMS).filter(k=>ITEMS[k].key&&G.bag[k]); if(keys.length){ L.append(h('div',{class:'dim',style:'font-size:11px;margin-top:6px'},'Key items')); keys.forEach(k=>{ const T=ITEMS[k]; const on=k==='share'?G.share!==false:null; const b=h('button',{class:'btn'+(on?' on':''),'data-nav':'',onclick:()=>{ Snd.blip(); if(T.toggle){ G.share=!(G.share!==false); toast('XP Share '+(G.share?'on':'off'),G.share?'lime':'pink'); saveGame(true); draw(); } else toast(T.name); }}); b.append(h('span',{style:`display:inline-block;width:14px;height:14px;background:${k==='banana'?'var(--sun)':k==='share'?'var(--accent)':'var(--violet)'};border:1px solid #000;box-shadow:inset 1px 1px 0 #fff8`}),h('span',{},T.name+(on!=null?(on?' · ON':' · OFF'):'')),h('i',{style:'white-space:normal;text-align:right;max-width:55%'},T.desc)); L.append(b); }); }
  p.body.append(L,h('p',{class:'dim',style:'margin:10px 0 0;font-size:12px'},'Capsules are thrown from the battle menu. Tonics work anywhere. 3D printers turn shards into anything you have a blueprint for.')); UI.refocus(); };
  const use=k=>{ if(k==='capsule'||k==='bigcap'){ if(opts.battle){ p.close(); opts.onUse(k); } else toast('throw capsules in battle'); return; }
    if(k==='candy'&&opts.battle){ toast('not in battle'); return; }
    openParty({title:'Use '+ITEMS[k].name+' on…',pick:(i,pp)=>{ const m=G.party[i]; const mx=stat(m,'hp'); if(k==='reboot'){ if(m.hp>0)return toast('it hasn\'t fainted'); m.hp=Math.floor(mx/2); m.st=null; } else if(k==='candy'){ if(m.lv>=MAXLV)return toast('already at the cap'); m.lv++; m.xp=Math.max(m.xp,xpAt(m.lv)); m.hp=Math.min(stat(m,'hp'),m.hp+(stat(m,'hp')-mx)); Snd.level(); } else { if(m.hp<=0)return toast('it needs a Reboot or a Relay Node','pink'); if(m.hp>=mx&&!m.st)return toast('already healthy'); } const before=m.hp; if(k==='tonic')m.hp=Math.min(mx,m.hp+30); if(k==='big'){ m.hp=mx; m.st=null; } G.bag[k]--; Snd.buff(true); pp.close(); if(opts.battle){ p.close(); opts.onUse(k,m,m.hp-before); } else { toast(k==='candy'?`${monName(m)} is level ${m.lv}`:`${monName(m)} +${m.hp-before} hp`,'lime'); draw(); } }}); };
  draw(); return p; }

/* the 3D printer */
async function printerScene(o){ if(!G.flags.printerIntro){ await Text.lines(['A 3D printer, humming. A slot for shards on the side, a tray at the bottom.','It prints from blueprints. It learns a blueprint from anything you pick up or get given. To start with it knows nothing.'],{who:'3D Printer'}); G.flags.printerIntro=1; }
  const bps=Object.keys(PRINT_COST).filter(k=>G.bp&&G.bp[k]); if(!bps.length){ await Text.say('No blueprints in your bag. Pick something up, anything, and come back.',{who:'3D Printer'}); return; }
  await new Promise(res=>{ const p=panel('3D Printer',{onClose:res}); const draw=()=>{ p.body.innerHTML=''; p.body.append(h('p',{class:'dim',style:'margin:0 0 6px'},`${G.shards|0} shards. Tamers pay shards; wild Entities drop a few.`)); const L=h('div',{class:'menu-list'});
      bps.forEach(k=>{ const cost=PRINT_COST[k]; const b=h('button',{class:'btn','data-nav':'',disabled:(G.shards|0)<cost,onclick:()=>{ G.shards-=cost; G.bag[k]=(G.bag[k]|0)+1; Snd.piece(); toast('printed '+ITEMS[k].name,'lime'); saveGame(true); draw(); }}); b.append(h('span',{},ITEMS[k].name),h('small',{class:'dim',style:'margin-left:6px'},'have '+(G.bag[k]|0)),h('i',{},cost+' ◆')); L.append(b); });
      const locked=Object.keys(PRINT_COST).filter(k=>!bps.includes(k)); if(locked.length)L.append(h('div',{class:'dim',style:'font-size:11px;margin-top:6px'},'No blueprint yet: '+locked.map(k=>ITEMS[k].name).join(', ')));
      p.body.append(L); UI.refocus(); }; draw(); }); }

function openOptions(){ const p=panel('Options'); const draw=()=>{ p.body.innerHTML=''; const L=h('div',{class:'menu-list'}); const row=(label,val,fn)=>L.append(h('button',{class:'btn','data-nav':'',onclick:()=>{ fn(); saveSettings(); Snd.apply(); Snd.blip(); draw(); }},label,h('i',{},val)));

  row('Music',Settings.music?'on':'off',()=>{ Settings.music=!Settings.music; });
