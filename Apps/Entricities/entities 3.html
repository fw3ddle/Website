  p.body.append(L,h('p',{class:'dim',style:'font-size:11px;margin-top:10px'},'Saves export as FWD1 capsules, the same format MeridianOS uses. Import one from the title screen.')); UI.refocus(); }; draw(); }

/* ═══════════════════════════════════════════════════════════════
   8 · BATTLE — each Entity fights in front of the portal it came from
   ═══════════════════════════════════════════════════════════════ */
const Battle=(()=>{
  let S=null, hudF=null, hudM=null;
  const stageMul=s=>s>=0?(2+s)/2:2/(2-s);
  const other=s=>s==='me'?'foe':'me';
  const mon=s=>s==='me'?S.me:S.foe;
  const label=s=>s==='me'?monName(S.me):(S.mode==='tamer'?S.tamer.name+'\'s '+monName(S.foe):(S.mode==='wild'?'the wild ':'')+monName(S.foe));
  const Label=s=>{ const t=label(s); return t[0].toUpperCase()+t.slice(1); };
  const msg=(t,o)=>Text.say(t,o);
  const quick=t=>Text.say(t,{auto:Settings.text===0?350:800});
  const alive=m=>m&&m.hp>0;

  /* ── layout, in canvas pixels; the bottom of the screen belongs to the command menu ── */
  function layout(){ const {W,H,s}=View; const A=H-(S.reserve||92)/s; const fn=species(S.foe.key).grid.n, mn=species(S.me?S.me.key:S.foe.key).grid.n;
    const fs=clamp(Math.round(A*.3/fn),2,5), ms=clamp(Math.min(Math.round(A*.4/mn),Math.floor(W*.42/mn)),2,6);
    return {fx:Math.round(W*.72),fy:Math.round(A*.5),mx:Math.round(W*.23),my:Math.round(A*.98),fs,ms,A}; }
  function ellipse(g,cx,cy,rx,ry,col){ g.fillStyle=col; for(let y=-ry;y<=ry;y++){ const w=Math.round(rx*Math.sqrt(1-(y*y)/(ry*ry))); g.fillRect(cx-w,cy+y,w*2,1); } }

  function draw(t){ if(!S)return; const {W,H}=View; const L=layout(); const now=performance.now();
    /* backdrop: the foe's own portal, blown up to fill the sky */
    g.fillStyle='#05060f'; g.fillRect(0,0,W,H); const pc=S.bg.draw(t); const sz=Math.ceil(Math.max(W,H*1.2)/32)*32; g.globalAlpha=.4; g.drawImage(pc,0,0,32,32,Math.round((W-sz)/2),Math.round(L.A*.42-sz/2),sz,sz); g.globalAlpha=1;
    const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'rgba(5,6,15,.2)'); gr.addColorStop(.55,'rgba(5,6,15,.55)'); gr.addColorStop(1,'rgba(5,6,15,.95)'); g.fillStyle=gr; g.fillRect(0,0,W,H);
    Stars.draw(g,W,H,t*.3);
    /* ground bands */
    g.fillStyle='rgba(124,245,255,.08)'; for(let y=Math.round(L.A*.62);y<H;y+=4)g.fillRect(0,y,W,1);
    const k=S.intro; const slideF=Math.round((1-k)*(W*.7)), slideM=Math.round((1-k)*(W*.7));
    const fH=Math.round(L.fs*species(S.foe.key).grid.n*.18)+3, mH=Math.round(L.ms*12*.16)+3;
    ellipse(g,L.fx-slideF,L.fy,Math.round(fH*3.2),fH,'#12152a'); ellipse(g,L.fx-slideF,L.fy-1,Math.round(fH*3.2)-2,fH-2,'#1b1f3a'); g.fillStyle=TYPES[species(S.foe.key).type].col; g.globalAlpha=.35; g.fillRect(L.fx-slideF-Math.round(fH*2.4),L.fy+fH-1,Math.round(fH*4.8),1); g.globalAlpha=1;
    ellipse(g,L.mx+slideM,L.my,Math.round(mH*3.6),mH,'#12152a'); ellipse(g,L.mx+slideM,L.my-1,Math.round(mH*3.6)-2,mH-2,'#1b1f3a');
    /* the foe */
    const A=S.anim;
    const drawMon=(side,img,cx,cy,scale)=>{ let ox=0,oy=0; if(A.shake&&A.shake.who===side&&now<A.shake.until)ox=Math.round(Math.sin(now/22)*3);
      if(A.lunge&&A.lunge.who===side&&now<A.lunge.until){ const p=1-(A.lunge.until-now)/180; const d=Math.sin(p*Math.PI)*8; ox+=side==='me'?d:-d; oy+=side==='me'?-d*.4:d*.4; }
      if(A.hit&&A.hit.who===side&&now<A.hit.until&&((now/60|0)%2))return;
      const fk=A.faint[side]||0; const iw=img.width, ih=img.height; const bob=fk?0:Math.round(Math.sin(t*2.4+(side==='me'?1:0))*1);
      const x=Math.round(cx-iw/2+ox), y=Math.round(cy-ih+oy+bob);
      if(fk){ const cut=Math.round(ih*(1-fk)); if(cut<=0)return; g.drawImage(img,0,0,iw,cut,x,y+ih-cut,iw,cut); return; }
      g.fillStyle='#0007'; g.fillRect(Math.round(cx-iw*.32),Math.round(cy-2),Math.round(iw*.64),3);
      g.drawImage(img,x,y); };
    if(S.showF==='tamer'&&S.tamer){ const im=S.tamer.frames?S.tamer.frames.down[0]:HERO.down[0]; const sc=Math.max(2,L.fs); g.drawImage(im,0,0,16,20,L.fx-slideF-8*sc,L.fy-20*sc+2,16*sc,20*sc); }
    else if(S.showF==='mon'&&!S.foeHidden){ const blink=(t*1000%3100)<120; const mode=S.sil>0?'sil':'front'; let img=blink&&!S.sil?entBlink(S.foe.key,L.fs):entImg(S.foe.key,L.fs,mode); drawMon('foe',img,L.fx-slideF,L.fy+2,L.fs);
      if(S.sil>0&&S.sil<1){ g.globalAlpha=S.sil; g.drawImage(entImg(S.foe.key,L.fs,'sil'),Math.round(L.fx-img.width/2),Math.round(L.fy+2-img.height)); g.globalAlpha=1; } }
    if(S.showM==='hero'){ const sc=Math.max(2,L.ms-1); g.drawImage(HERO.up[0],0,0,16,20,L.mx+slideM-8*sc,L.my-20*sc+2,16*sc,20*sc); }
    else if(S.showM==='mon'&&S.me){ drawMon('me',entImg(S.me.key,L.ms,'back'),L.mx+slideM,L.my+2,L.ms); }
    /* move effects: the attacker's type family, drawn as a portal over the target */
    if(A.fx&&now<A.fx.until){ const p=1-(A.fx.until-now)/A.fx.dur; const pc2=A.fx.p.draw(t*3); const tx=A.fx.who==='foe'?L.fx:L.mx, ty=(A.fx.who==='foe'?L.fy:L.my)-(A.fx.who==='foe'?L.fs:L.ms)*7; const s2=Math.round(32*(A.fx.who==='foe'?1.4:1.9)*(.6+p*.6)); g.globalAlpha=Math.sin(p*Math.PI); g.drawImage(pc2,0,0,32,32,Math.round(tx-s2/2),Math.round(ty-s2/2),s2,s2); g.globalAlpha=1; }
    if(A.stat&&now<A.stat.until){ const up=A.stat.up; const tx=A.stat.who==='foe'?L.fx:L.mx, by=A.stat.who==='foe'?L.fy:L.my; g.fillStyle=up?'#b6ff5c':'#ff5c7a'; for(let i=0;i<6;i++){ const ph=((now/400)+i/6)%1; const yy=up?by-ph*40:by-40+ph*40; g.fillRect(tx-14+i*6,Math.round(yy),2,4); } }
    /* the capsule */
    const C=S.cap; if(C){ let x,y; if(C.phase==='fly'){ const p=Math.min(1,(now-C.t0)/520); x=C.x0+(C.x1-C.x0)*p; y=C.y0+(C.y1-C.y0)*p-Math.sin(p*Math.PI)*L.A*.35; } else { x=C.x1; y=C.y1; if(C.phase==='wob'){ const p=(now-C.wt0)/700; if(p<.5)x+=Math.round(Math.sin(p*Math.PI*6)*2); } }
      const r=Math.max(4,Math.round(L.fs*2)); g.fillStyle='#0008'; g.fillRect(Math.round(x-r),Math.round(C.phase==='fly'?y+r+2:L.fy+1),r*2,2); drawDisc(g,Math.round(x),Math.round(y),r,t*(C.phase==='fly'?6:1),Math.max(1.5,r*.28));
      clover(g,Math.round(x)-3,Math.round(y)-3,C.phase==='caught'?'#b6ff5c':(C.phase==='wob'&&(now/90|0)%2?'#9dffd3':'#2ec47a'));
      if(C.phase==='caught'){ for(let i=0;i<8;i++){ const a=i/8*6.283+t; const d=r+4+Math.sin(t*6+i)*3; g.fillStyle=HOLO[i%6]; g.fillRect(Math.round(x+Math.cos(a)*d),Math.round(y+Math.sin(a)*d),2,2); } } }
    if(A.flash&&now<A.flash.until){ g.globalAlpha=(A.flash.until-now)/A.flash.dur*.8; g.fillStyle=A.flash.col||'#fff'; g.fillRect(0,0,W,H); g.globalAlpha=1; } }

  /* ── the HUD (DOM, so the pixel fonts stay crisp) ── */
  function mkHud(side){ const el=h('div',{class:'hud bevel '+side}); el.innerHTML=`<div class="nm"><span></span><em></em></div><div class="hp">HP<div class="bar"><i></i></div></div>`+(side==='me'?`<div class="num"></div><div class="bar xp"><i></i></div>`:''); UI.root.appendChild(el); return el; }
  function miniJig(key){ const e=Atlas.entry(key); const c=cv(9,9); const x=ctx2(c); x.fillStyle='#000'; x.fillRect(0,0,9,9); for(let i=0;i<16;i++){ x.fillStyle=e&&(e.m>>i&1)?(e.c?'#7cf5ff':'#ff7ce8'):'#1b1f3a'; x.fillRect(1+(i%4)*2,1+(i>>2)*2,1,1); } c.style.cssText='width:18px;height:18px;flex:none;align-self:center'; c.title='Atlas pieces'; return c; }
  function hud(){ if(!S)return; for(const [el,m,side] of [[hudF,S.foe,'foe'],[hudM,S.me,'me']]){ if(!el)continue; const show=side==='foe'?S.showF==='mon'&&!S.foeHidden:S.showM==='mon'; el.style.visibility=show&&m?'':'hidden'; if(!m)continue;
      const nm=el.querySelector('.nm'); nm.querySelector('span').textContent=monName(m); nm.querySelector('em').textContent='Lv'+m.lv; nm.querySelectorAll('.st,canvas,.own').forEach(x=>x.remove());
      if(m.st)nm.insertBefore(h('b',{class:'st'+(m.st==='lock'?' lock':'')},m.st.toUpperCase()),nm.querySelector('em'));
      if(side==='foe'){ if(S.mode!=='tamer'&&Atlas.caught(m.key))nm.insertBefore(h('i',{class:'own',title:'already caught',style:'width:8px;height:8px;border-radius:50%;flex:none;align-self:center;background:conic-gradient(#ff9ad5,#c2a8ff,#8ef4ff,#9dffd3,#fff3a0,#ff9ad5);box-shadow:0 0 0 1px #000'}),nm.firstChild); nm.appendChild(miniJig(m.key)); }
      const mx=stat(m,'hp'), p=Math.max(0,m.hp/mx); const bar=el.querySelector('.hp .bar'); bar.className='bar'+(p<.2?' low':p<.5?' mid':''); bar.firstChild.style.width=(p*100)+'%';
      if(side==='me'){ el.querySelector('.num').textContent=`${m.hp}/${mx}`; const a=xpAt(m.lv),b=xpAt(m.lv+1); el.querySelector('.bar.xp i').style.width=clamp((m.xp-a)/(b-a),0,1)*100+'%'; } } }

  /* ── the command menu ── */
  function chooseAction(){ return new Promise(res=>{ let L=null; const el=h('div',{id:'cmd'}); const done=a=>{ UI.pop(L); S.reserve=92; res(a); };
    const root=()=>{ el.innerHTML=''; el.style.gridTemplateColumns='repeat(3,1fr)'; const n=G.bag.capsule|0;
      const fight=h('button',{class:'btn acc','data-nav':'',onclick:()=>{ Snd.blip(); moves(); }},'Fight'); fight.style.gridColumn='span 2';
      const cap=h('button',{class:'btn','data-nav':'',onclick:()=>done({k:'capsule'})}); const ic=discIcon(16,performance.now()/1000); ic.style.cssText='width:18px;height:18px'; cap.append(ic,'Capsule',h('small',{},'×'+n));
      el.append(fight,cap,h('button',{class:'btn','data-nav':'',onclick:()=>{ Snd.blip(); openBag({battle:true,onUse:(k,m,amt)=>done({k:(k==='capsule'||k==='bigcap')?'capsule':'item',item:k,m,amt})}); }},'Bag'),
        h('button',{class:'btn','data-nav':'',onclick:()=>{ Snd.blip(); openParty({title:'Switch to…',note:'Switching uses your turn.',sel:G.party.indexOf(S.me),pick:(i,p)=>{ const m=G.party[i]; if(m===S.me)return toast(monName(m)+' is already out'); if(m.hp<=0)return toast(monName(m)+' has no health left','pink'); p.close(); done({k:'switch',i}); }}); }},'Party'),
        h('button',{class:'btn','data-nav':'',onclick:()=>done({k:'run'})},S.mode==='tamer'?'Run':'Run')); fit2(); };
    const moves=()=>{ el.innerHTML=''; el.style.gridTemplateColumns='1fr 1fr'; S.me.moves.forEach(id=>{ const M=MOVES[id]; const e=M.pow?eff(M.t,species(S.foe.key).type):1; const b=h('button',{class:'btn','data-nav':'',title:moveDesc(id),onclick:()=>done({k:'move',id})},M.name); b.insertAdjacentHTML('beforeend',tchip(M.t)); if(e!==1&&Atlas.pieces(S.foe.key)>=4)b.append(h('small',{style:`margin-left:3px;color:${e>1?'var(--lime)':'var(--rose)'}`},e>1?'▲':'▼')); el.append(b); });
      el.append(h('button',{class:'btn back','data-nav':'',onclick:()=>{ Snd.back(); root(); }},'◀ Back')); fit2(); };
    const fit2=()=>{ requestAnimationFrame(()=>{ if(!el.isConnected)return; const r=el.getBoundingClientRect(); hudM.style.bottom=(r.height+12)+'px'; S.reserve=r.height+18; UI.focusFirst(L); }); };
    L=UI.push(el,{onBack:()=>{ if(el.querySelector('.back'))root(); }}); root(); }); }

  /* ── sprites & effects helpers ── */
  const fxP={}; const fxOf=t=>fxP[t]||(fxP[t]=portalOf('fx:'+t,{fam:TYPES[t].fx,clear:true,h:hueOfType(t)}));
  function hueOfType(t){ const m=/#(..)(..)(..)/.exec(TYPES[t].col); const [r,g2,b]=[1,2,3].map(i=>parseInt(m[i],16)/255); const mx=Math.max(r,g2,b),mn=Math.min(r,g2,b); let hh=0; if(mx!==mn){ const d=mx-mn; hh=mx===r?((g2-b)/d)%6:mx===g2?(b-r)/d+2:(r-g2)/d+4; } return (hh*60+360)%360; }
  const anim=(k,v)=>{ S.anim[k]=v; };
  async function tween(ms,fn){ const t0=performance.now(); while(true){ const p=Math.min(1,(performance.now()-t0)/ms); fn(p); if(p>=1)break; await nextFrame(); } }

  /* ── damage ── */
  function damage(side,M,powOv){ const A=mon(side),D=mon(other(side)); const at=stat(A,'atk')*stageMul(S.stg[side].atk), df=stat(D,'def')*stageMul(S.stg[other(side)].def);
    const e=eff(M.t,species(D.key).type), stab=M.t===species(A.key).type?1.25:1, crit=Math.random()<(M.e==='highcrit'?1/4:1/16); const pow=powOv||M.pow;
    let d=((2*A.lv/5+2)*pow*at/df)/50+2; d*=stab*e*(crit?1.5:1)*(.85+Math.random()*.15); return {d:Math.max(1,Math.floor(d)),e,crit}; }
  const STATN={atk:'attack',def:'defence',spd:'speed'};
  async function stage(side,k,n){ const s=S.stg[side]; const before=s[k]; s[k]=clamp(s[k]+n,-4,4); const who=Label(side);
    if(s[k]===before){ await quick(`${who}'s ${STATN[k]} won't go any ${n>0?'higher':'lower'}.`); return; } Snd.buff(n>0); anim('stat',{who:side,up:n>0,until:performance.now()+700}); await wait(300);
    await quick(`${who}'s ${STATN[k]} ${n>0?'rose':'fell'}${Math.abs(n)>1?' sharply':''}!`); }
  async function setStatus(side,st){ const m=mon(side); if(m.hp<=0)return; if(m.st){ await quick(`${Label(side)} is already ${m.st==='fray'?'frayed':m.st==='lock'?'locked':'glitched'}.`); return; } m.st=st; if(st==='lock')m.lockT=2+Math.floor(Math.random()*3); if(st==='glitch')m.glT=2+Math.floor(Math.random()*3); Snd.buff(false); hud(); await quick(st==='fray'?`${Label(side)} is fraying at the edges!`:st==='lock'?`${Label(side)} is locked up!`:`${Label(side)} is glitching!`); }
  async function heal(side,frac,cure){ const m=mon(side); const mx=stat(m,'hp'); const add=Math.min(mx-m.hp,Math.ceil(mx*frac)); if(cure&&m.st){ m.st=null; m.lockT=0; } if(add<=0&&!cure){ await quick(`${Label(side)} is already at full health.`); return; } m.hp+=add; Snd.buff(true); anim('stat',{who:side,up:true,until:performance.now()+700}); hud(); await quick(`${Label(side)} ${cure?'straightened itself out and ':''}got ${add} health back.`); }
  async function effect(side,M,secondary){ const e=M.e, n=M.n||1, os=other(side);
    if(e==='def-')await stage(os,'def',-(secondary?1:n)); else if(e==='atk-')await stage(os,'atk',-(secondary?1:n)); else if(e==='spd-')await stage(os,'spd',-(secondary?1:n));
    else if(e==='atk+')await stage(side,'atk',n); else if(e==='def+')await stage(side,'def',n); else if(e==='spd+')await stage(side,'spd',n);
    else if(e==='atkspd+'){ await stage(side,'atk',1); await stage(side,'spd',1); }
    else if(e==='heal')await heal(side,M.n||.5); else if(e==='cure')await heal(side,M.n||.4,true);
    else if(e==='fray'||e==='lock'||e==='glitch')await setStatus(os,e);
    else if(e==='slow')await stage(os,'spd',-1); else if(e==='flinch'){ S.flinch[os]=1; await quick(`${Label(os)} flinched!`); }
    else if(e==='trap'){ if(!S.trap[os]){ S.trap[os]=1; await quick(`${Label(os)} can't get away now!`); } }
    else if(e==='guard'){ S.guard[side]=2; Snd.buff(true); await quick(`${Label(side)} braced itself.`); }
    else if(e==='swap'){ const g2=S.stg[side]; [g2.atk,g2.def]=[g2.def,g2.atk]; Snd.buff(true); await quick(`${Label(side)} swapped its attack and defence!`); } }

  async function useMove(side,id){ const A=mon(side), D=mon(other(side)), os=other(side); const M=MOVES[id]||MOVES.bump;
    if(A.st==='lock'){ A.lockT=(A.lockT||1)-1; if(A.lockT<=0){ A.st=null; hud(); await quick(`${Label(side)} shook itself loose!`); } else if(Math.random()<.5){ Snd.bump(); anim('shake',{who:side,until:performance.now()+300}); await quick(`${Label(side)} is locked up and can't move!`); return; } }
    if(S.flinch[side]){ S.flinch[side]=0; await quick(`${Label(side)} flinched and couldn't move!`); return; }
    if(A.st==='glitch'&&Math.random()<.33){ const d=Math.max(1,Math.floor(A.lv/2)+5); A.hp=Math.max(0,A.hp-d); Snd.hit(1); anim('shake',{who:side,until:performance.now()+260}); hud(); await quick(`${Label(side)} glitched and hit itself (−${d})!`); return; }
    await quick(`${Label(side)} used ${M.name}!`); anim('lunge',{who:side,until:performance.now()+180}); await wait(160);
    const selfMove=!M.pow&&['atk+','def+','spd+','atkspd+','heal','cure','guard','swap'].includes(M.e);
    if(!selfMove&&Math.random()>M.acc){ Snd.miss(); await quick(`…but it missed.`); if(M.e==='crash'){ const d=Math.max(1,Math.floor(stat(A,'hp')/4)); A.hp=Math.max(0,A.hp-d); hud(); Snd.hit(1); await quick(`${Label(side)} crashed and took ${d} damage!`); } return; }
    if(M.pow&&S.guard[os]>0){ S.guard[os]=0; Snd.bump(); anim('shake',{who:os,until:performance.now()+200}); await quick(`${Label(os)} blocked it!`); return; }
    const echoed=M.e==='echo'&&S.last[side]===M; S.last[side]=M; const wildPow=M.e==='wild'?10+Math.floor(Math.random()*141):0;
    if(M.pow||wildPow){ const hits=M.e==='multi'?2+Math.floor(Math.random()*((M.n||3)-1)):1; let total=0,last=null,n=0;
      if(wildPow)await quick(`Power ${wildPow}!`); if(echoed)await quick('It echoes — double power!');
      for(let i=0;i<hits&&D.hp>0;i++){ anim('fx',{who:os,p:fxOf(M.t),until:performance.now()+380,dur:380}); await wait(200); const r=damage(side,M,(wildPow||M.pow)*(echoed?2:1)); last=r; n++; total+=Math.min(D.hp,r.d); D.hp=Math.max(0,D.hp-r.d); Snd.hit(r.e); anim('hit',{who:os,until:performance.now()+360}); anim('shake',{who:os,until:performance.now()+260}); hud(); await wait(hits>1?300:480); if(r.crit)await quick('A clean hit!'); }
      if(last&&last.e>1)await quick('It\'s super effective!'); else if(last&&last.e<1)await quick('It\'s not very effective…');
      if(hits>1)await quick(`Hit ${n} time${n>1?'s':''}!`);

      if(M.c&&M.e&&D.hp>0&&Math.random()<M.c)await effect(side,M,true);
    } else await effect(side,M,false); }

  /* ── the other side's brain ── */
  function foeChoose(){ const F=S.foe, T=S.me; if(S.mode!=='tamer'&&Math.random()<.3)return pick(Math.random,F.moves);
    const sc=F.moves.map(id=>{ const M=MOVES[id]; let s; if(M.pow){ s=M.pow*M.acc*eff(M.t,species(T.key).type)*(M.t===species(F.key).type?1.25:1); if(M.e==='multi')s*=2.2; if(M.e==='drain'&&F.hp<stat(F,'hp')*.6)s*=1.3; }
      else if(M.e==='heal'||M.e==='cure')s=F.hp<stat(F,'hp')*.4?140:(M.e==='cure'&&F.st?90:2); else if(M.e==='fray'||M.e==='lock'||M.e==='glitch')s=T.st?2:48; else if(M.e==='guard')s=22; else if(M.e==='wild')s=60; else if(M.e==='trap'||M.e==='swap')s=18; else if(M.e.endsWith('+'))s=S.stg.foe[M.e.slice(0,3)]>=2?2:36; else s=34; return [id,s*(.65+Math.random()*.7)]; });
    sc.sort((a,b)=>b[1]-a[1]); return sc[0][0]; }

  /* ── XP, levels, new moves ── */
  async function learn(m,id){ if(m.moves.includes(id))return; const M=MOVES[id]; if(m.moves.length<4){ m.moves.push(id); Snd.level(); await msg(`${monName(m)} learned ${M.name}!`); return; }
    const c=await msg(`${monName(m)} wants to learn ${M.name} (${TYPES[M.t].name}${M.pow?', power '+M.pow:''}). Forget a move to make room?`,{choices:[...m.moves.map(x=>MOVES[x].name),'Don\'t learn it'],cancel:4});
    if(c>=0&&c<4){ const old=MOVES[m.moves[c]].name; m.moves[c]=id; Snd.level(); await msg(`1, 2, and… poof! ${monName(m)} forgot ${old} and learned ${M.name}!`); } else await msg(`${monName(m)} did not learn ${M.name}.`); }

    while(m.lv<MAXLV&&m.xp>=xpAt(m.lv+1)){ const oldMax=stat(m,'hp'); m.lv++; m.hp+=stat(m,'hp')-oldMax; hud(); Snd.level(); await msg(`${monName(m)} grew to level ${m.lv}!`);

  /* ── faints and replacements ── */
  async function faintAnim(side){ Snd.faint(); await tween(420,p=>{ S.anim.faint[side]=p; }); }
  async function sendOut(side,m,first){ S.guard[side]=0; S.trap[side]=0; S.last[side]=null; if(side==='me'){ S.me=m; S.stg.me={atk:0,def:0,spd:0}; S.used.add(m); if(!first){ S.showM='none'; hud(); } S.anim.faint.me=0; S.showM='mon'; hud(); Snd.cry(m.key); await quick(`Go, ${monName(m)}!`); }
    else { S.foe=m; S.stg.foe={atk:0,def:0,spd:0}; S.anim.faint.foe=0; S.bg=portalOf(species(m.key).base); const n=Atlas.battle(m.key); S.pieces[m.key]=(S.pieces[m.key]||0)+n; S.showF='mon'; hud(); Snd.cry(m.key); await quick(`${S.tamer.name} sent out ${monName(m)}!`); } }
  async function forcedSwitch(){ return new Promise(res=>{ const p=openParty({title:'Who goes next?',note:'Pick an Entity that can still battle.',onBack:()=>{},pick:(i,pp)=>{ const m=G.party[i]; if(m.hp<=0)return toast('that one has no health left','pink'); pp.close(); res(m); }}); const b=p.hd.querySelector('.btn'); b&&b.remove(); }); }
  async function checkFaints(){ let swapped=false;

      const part=[...S.used].filter(m=>alive(m)&&G.party.includes(m)); for(const m of part)await gainXP(m,m===S.me?base:Math.max(1,Math.floor(base/2)));
      if(G.bag.share&&G.share!==false){ const rest=G.party.filter(m=>alive(m)&&!part.includes(m)); if(rest.length){ Snd.piece(); await msg('The XP Share splits it with the rest of the party.',{auto:800}); for(const m of rest)await gainXP(m,Math.max(1,Math.floor(base/2))); } }

  /* ── the capsule ── */
  async function throwCapsule(kind='capsule'){ if(S.mode==='tamer'){ Snd.bump(); await msg(`${S.tamer.name} knocks the capsule away! You can't capsule someone else's Entity.`); return false; }

    G.bag[kind]--; const L=layout(); Snd.throw(); await quick(`You threw a ${ITEMS[kind].name}!`);

    const sp=species(S.foe.key), mx=stat(S.foe,'hp'); let p=sp.rate*(1-.72*S.foe.hp/mx)*(S.foe.st?1.35:1)*(S.shadow?1.15:1)*(S.foe.lv>20?.85:1)*(kind==='bigcap'?1.6:1); p=clamp(p,.03,.97); const per=Math.pow(p,1/3);

    if(w===3){ S.cap.phase='caught'; Snd.caught(); await wait(500); return true; }
    S.cap=null; S.foeHidden=false; Snd.pop(); anim('flash',{until:performance.now()+200,dur:200,col:'#ff7ce8'}); hud(); await msg(['Oh no! It popped right out!','Argh! Almost had it!','So close! The clover flickered out.'][w]); return false; }

  /* ── one turn ── */
  function order(myId,foeId){ const pm=MOVES[myId].e==='prio'?1:0, pf=MOVES[foeId].e==='prio'?1:0; if(pm!==pf)return pm>pf?['me','foe']:['foe','me'];
    const sm=stat(S.me,'spd')*stageMul(S.stg.me.spd), sf=stat(S.foe,'spd')*stageMul(S.stg.foe.spd); if(sm!==sf)return sm>sf?['me','foe']:['foe','me']; return Math.random()<.5?['me','foe']:['foe','me']; }
  async function endOfTurn(){ S.flinch.me=S.flinch.foe=0; for(const side of ['me','foe']){ if(S.guard[side]>0)S.guard[side]--; const m=mon(side); if(m.hp>0&&m.st==='glitch'){ m.glT=(m.glT||1)-1; if(m.glT<=0){ m.st=null; hud(); await quick(`${Label(side)} stopped glitching.`); } } if(m.hp>0&&m.st==='fray'){ const d=Math.max(1,Math.floor(stat(m,'hp')/10)); m.hp=Math.max(0,m.hp-d); Snd.hit(1); anim('shake',{who:side,until:performance.now()+220}); hud(); await quick(`${Label(side)} frays a little (−${d}).`); } } }
  async function turn(act){
    if((act.k==='run'||act.k==='switch')&&S.trap.me){ await msg(`${monName(S.me)} is trapped and can't ${act.k==='run'?'run':'switch out'}!`); return null; }
    if(act.k==='run'){ if(S.mode==='tamer'){ await msg('You can\'t run from a tamer battle!'); return null; } S.runs++; const sm=stat(S.me,'spd'), sf=stat(S.foe,'spd'); if(sm>=sf||Math.random()<.4+.25*S.runs){ Snd.door(); await msg('You got away safely.'); return 'run'; } await msg('Couldn\'t get away!'); }
    else if(act.k==='capsule'){ const r=await throwCapsule(act.item||'capsule'); if(r===true)return 'caught'; if(r==='nothing')return null; }
    else if(act.k==='item'){ hud(); await msg(`You used a ${ITEMS[act.item].name}. ${monName(act.m)} got ${act.amt} health back.`); }

  async function evolve(m){ const from=species(m.key), to=species(from.next); scene='evo'; const E={t0:performance.now(),a:from.key,b:to.key,p:0}; Battle._evo=E; Snd.music('evo:'+to.key,'title');

  /* ── the whole fight ── */
  async function run(opt){ try{ return await run2(opt); }catch(e){ console.error('battle error',e); toast('the battle glitched out','pink'); return 'run'; } finally{ if(hudF)hudF.remove(); if(hudM)hudM.remove(); hudF=hudM=null; UI.root.querySelectorAll('.hud').forEach(x=>x.remove()); S=null; Battle._evo=null; if(scene==='battle'||scene==='evo')scene='world'; Fade.a=0; World.busy=false; Input.clear(); } }
  async function run2(opt){ Input.clear(); World.busy=true; const tamer=opt.tamer||null;
    S={mode:tamer?'tamer':'wild',tamer,shadow:!!opt.shadow,foeParty:tamer?tamer.party:[opt.wild],foe:tamer?tamer.party[0]:opt.wild,me:null,stg:{me:{atk:0,def:0,spd:0},foe:{atk:0,def:0,spd:0}},anim:{faint:{}},flinch:{},guard:{},trap:{},last:{},intro:0,showF:tamer?'tamer':'mon',showM:'hero',sil:opt.shadow?1:0,foeHidden:false,cap:null,used:new Set(),pieces:{},runs:0,reserve:92};
    S.bg=portalOf(species(S.foe.key).base);
    /* the swirl in */
    Snd.encounter(); Snd.music(tamer?'tamer:'+tamer.name:'wild:'+S.foe.key,'battle'); for(let i=0;i<3;i++){ Fade.col='#fff'; Fade.a=.85; await wait(70); Fade.a=0; await wait(80); } Fade.col='#000'; await fadeTo(1,260);
    scene='battle'; UI.clear(); hudF=mkHud('foe'); hudM=mkHud('me'); hud(); await fadeTo(0,160); await tween(650,p=>{ S.intro=1-Math.pow(1-p,3); });
    const first=G.party.find(alive);
    if(tamer){ await msg(`${tamer.name} wants to battle!`); S.showF='none'; await sendOut('foe',S.foe); }
    else { const n=Atlas.battle(S.foe.key); S.pieces[S.foe.key]=n; hud(); Snd.cry(S.foe.key);
      if(opt.shadow){ await msg('A shadow stepped out in front of you!'); await tween(700,p=>{ S.sil=1-p; }); S.sil=0; await quick(`It was ${monName(S.foe)}!`); } else await msg(`A wild ${monName(S.foe)} walked out of the grass!`); }
    S.showM='none'; await sendOut('me',first,true);
    let result=null; while(!result){ const act=await chooseAction(); result=await turn(act); }
    /* after */
    const keepS=S; let caughtFresh=false, prevMask=0;
    if(result==='caught'){ const m=S.foe; m.st=m.st==='lock'?null:m.st; m.lockT=0; const wasCaught=Atlas.caught(m.key); prevMask=(Atlas.entry(m.key)||{}).m||0; Atlas.own(m.key); caughtFresh=!wasCaught; m.met=World.a?World.a.name:''; await msg(`Gotcha! ${monName(m)} is in the capsule!`);
      if(G.party.length<6)G.party.push(m); else { G.box.push(m); await msg(`Your party is full, so ${monName(m)} went to the capsule box. (Visit a Relay Node.)`); }
      Snd.piece(); await msg(wasCaught?`You already had its Atlas page. Now you have another one.`:`The ${species(m.key).name} page of your Entity Atlas is complete — lore, stats, seed and all.`); }

/* ═══════════════════════════════════════════════════════════════

const Jig=(()=>{
  const N=64, P=16; const owners={}; const comps={};
  /* which piece owns each pixel — square cells with round knobs, knob directions seeded by the species */
  function ownerMap(key){ if(owners[key])return owners[key]; const r=rngOf('jig:'+key); const hz=[],vt=[]; for(let i=0;i<12;i++){ hz.push(r()<.5?1:-1); vt.push(r()<.5?1:-1); }
    const o=new Int8Array(N*N); const knob=(px,py,cx,cy)=>{ const dx=px+.5-cx,dy=py+.5-cy; return dx*dx+dy*dy<=10.5; };
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){ let cx=x>>4,cy=y>>4; let own=cy*4+cx;
      /* vertical edges: between column c and c+1 */
      for(let c=0;c<3;c++){ const ex=(c+1)*P; for(let rr=0;rr<4;rr++){ const d=hz[rr*3+c]; const kx=ex+d*2.6, ky=rr*P+8; if(knob(x,y,kx,ky)){ own=rr*4+(d>0?c:c+1); } } }
      for(let rr=0;rr<3;rr++){ const ey=(rr+1)*P; for(let c=0;c<4;c++){ const d=vt[rr*4+c]; const ky=ey+d*2.6, kx=c*P+8; if(knob(x,y,kx,ky)){ own=(d>0?rr:rr+1)*4+c; } } }
      o[y*N+x]=own; }
    return owners[key]=o; }
  /* the picture under the pieces: its portal behind, the Entity in front */
  function composite(key,t,still){ const ck=key+(still?'@s':''); let C=comps[ck]; if(!C){ C=comps[ck]={c:cv(N,N),p:portalOf(species(key).base),last:-1}; C.c.getContext('2d',{willReadFrequently:true}); }
    if(still&&C.last>=0)return C.c; const q=Math.floor(t*12); if(q===C.last)return C.c; C.last=q; const x=ctx2(C.c); x.drawImage(C.p.draw(still?1:t),0,0,32,32,0,0,N,N); x.fillStyle='rgba(5,6,15,.18)'; x.fillRect(0,0,N,N);
    const sp=species(key), n=sp.grid.n, sc=Math.max(1,Math.floor(54/n)); const im=entImg(key,sc); const ox=(N-im.width)>>1, oy=(N-im.height)>>1; x.fillStyle='rgba(0,0,0,.5)'; x.fillRect(ox+3,oy+im.height-1,im.width-6,2); x.drawImage(im,ox,oy); return C.c; }

  function paint(out,key,mask,t,{caught=false,still=false,glow=-1}={}){ const src=composite(key,t,still).getContext('2d',{willReadFrequently:true}).getImageData(0,0,N,N).data; const g2=out.getContext('2d',{willReadFrequently:true}); const im=g2.createImageData(N,N); const d=im.data; const o=ownerMap(key);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){ const i=y*N+x, j=i*4, w=o[i], on=mask>>w&1; const rt=x<N-1?o[i+1]:w, dn=y<N-1?o[i+N]:w; const edge=rt!==w||dn!==w; let r,gg,b;
      if(on){ r=src[j]; gg=src[j+1]; b=src[j+2]; if(edge&&!caught){ const nOn=(mask>>(rt!==w?rt:dn))&1; if(nOn){ r*=.72; gg*=.72; b*=.72; } else { r=0; gg=0; b=0; } } if(w===glow){ r=Math.min(255,r+70); gg=Math.min(255,gg+70); b=Math.min(255,b+90); } }
      else { const chk=((w&1)^((w>>2)&1)); r=chk?11:18; gg=chk?13:21; b=chk?26:42; if(((x+y)&7)===0){ r+=12; gg+=14; b+=30; } if(edge){ const nOn=(mask>>(rt!==w?rt:dn))&1; if(nOn){ r=0; gg=0; b=0; } else { r=42; gg=47; b=85; } } }
      d[j]=r; d[j+1]=gg; d[j+2]=b; d[j+3]=255; }
    g2.putImageData(im,0,0); return out; }

})();

  show(){ scene='title'; UI.clear(); Snd.music('title','title');
    if(!this.orbit){ const r=rngOf('title'); this.orbit=shuffle(r,REGION).slice(0,7).map((k,i)=>({k,a:i/7*6.283,s:.25+r()*.2,rr:.8+r()*.35})); }
    const el=h('div',{id:'title'}); const logo=h('div',{style:'position:absolute;top:8px;left:0;right:0;text-align:center;pointer-events:none'}); logo.innerHTML=`<div style="font-family:var(--font-big);font-size:clamp(28px,8vw,46px);letter-spacing:3px;line-height:1;color:var(--fg);text-shadow:3px 3px 0 #000,0 0 18px rgba(124,245,255,.45)">ꟻ ENTITIES</div><div style="font-size:11px;color:var(--accent2);letter-spacing:1px;margin-top:4px;text-shadow:1px 1px 0 #000">portals grow them · capsules keep them</div>`;
    const L=h('div',{class:'menu-list'}); const item=(label,sub,fn,cls='')=>L.append(h('button',{class:'btn '+cls,'data-nav':'',onclick:()=>{ Snd.wake(); Snd.blip(); fn(); }},label,sub?h('i',{},sub):null));
    const sv=Store.get('save',null);
    if(sv){ const n=Object.values(sv.atlas||{}).filter(e=>e.c).length; item('Continue',`${(getArea(sv.area)||{}).name||''} · ${n} caught`,()=>startGame(false),'acc'); }
    item('New game',sv?'starts over':'',async()=>{ if(sv){ const c=await Text.say('Start a new game? Your saved game will be replaced the next time you save.',{choices:['Start over','Keep my save'],cancel:1}); if(c!==0)return; } startGame(true); },sv?'':'acc');
    item('Area Maker','paint places, fill them with seeds',()=>openMaker(),'pink');
    item('Import .fweddle','save or area capsule',()=>importCapsule());
    item('Options','',()=>openOptions());
    el.append(logo,L,h('span',{class:'ver'},'1.3 · Meridian Isle · sixteen bands · 999'));
    UI.push(el,{onBack:()=>{}}); },
  draw(t){ const {W,H,s}=View; g.fillStyle='#05060f'; g.fillRect(0,0,W,H); Stars.draw(g,W,H,t);
    const menuH=(Math.min(5,UI.root.querySelectorAll('#title .btn').length)*44+30)/s, logoH=64/s; const avail=H-menuH-logoH; const sc=Math.max(1,Math.floor(Math.min(avail*.95,W*.8)/64)); const cx=W/2|0, cy=Math.round(logoH+avail/2);
    const pc=this.portal.draw(t); const ps=Math.max(64,Math.round(64*sc*1.25/32)*32); g.globalAlpha=.3; g.drawImage(pc,0,0,32,32,cx-ps/2|0,cy-ps/2|0,ps,ps); g.globalAlpha=1;
    const R=64*sc*.62; for(const o of this.orbit){ const a=o.a+t*o.s; const x=cx+Math.cos(a)*R*o.rr, y=cy+Math.sin(a)*R*o.rr*.45; if(Math.sin(a)<0){ const im=entImg(o.k,Math.max(1,sc-1),'sil'); g.globalAlpha=.45; g.drawImage(im,Math.round(x-im.width/2),Math.round(y-im.height/2)); g.globalAlpha=1; } }
    const pt=drawPortrait(t); g.drawImage(pt,0,0,64,64,cx-32*sc,cy-32*sc+Math.round(Math.sin(t*1.6)*sc),64*sc,64*sc);
    for(const o of this.orbit){ const a=o.a+t*o.s; const x=cx+Math.cos(a)*R*o.rr, y=cy+Math.sin(a)*R*o.rr*.45; if(Math.sin(a)>=0){ const im=entImg(o.k,Math.max(1,sc)); g.drawImage(im,Math.round(x-im.width/2),Math.round(y-im.height/2)); } } } };

async function startGame(fresh){ UI.clear(); Play.test=false; Play.area=null; if(fresh)newGame(); else if(!loadGame()){ toast('that save could not be read','pink'); return Title.show(); }
  await fadeTo(1,260); scene='world'; World.load(G.area,G.x,G.y,G.dir); await fadeTo(0,320);
  if(!fresh&&!G.flags.v13){ G.flags.v13=1; if(!G.bag.share){ G.bag.share=1; G.share=true; } G.bp=G.bp||{}; G.shards=G.shards|0; setTimeout(()=>toast('1.3: the isle is new. Start fresh for the full road.','lime'),1200); }
  if(fresh){ World.busy=true; await Text.lines(['Morning. The roof leaked on the good side again.','MeridianOS is still running on the phone by the mug. Portals all night, it says. Things walking out of them.','Fweddle Hollow is up the path. Prof. Ribbit-9 said to come by the lab if the portals ever did that.']); World.busy=false; saveGame(true); } }
async function toTitle(){ await fadeTo(1,220); Play.test=false; Play.area=null; Title.show(); await fadeTo(0,260); }

/* the Area Maker is on the title screen — the main screen */
async function openMaker(){ await fadeTo(1,180); UI.clear(); Editor.show(); Fade.a=0; }
let RealG=null;
async function playtest(area){ RealG=G; Play.test=true; Play.area=area; const base=RealG||Store.get('save',null);
  newGame(); if(base&&base.party&&base.party.length){ G.party=JSON.parse(JSON.stringify(base.party)); G.atlas=JSON.parse(JSON.stringify(base.atlas||{})); } else { const lv=clamp(area.lv[1]||5,5,MAXLV); G.party=STARTERS.map(k=>makeMon(k,lv)); G.party.forEach(m=>Atlas.own(m.key)); }
  G.party.forEach(m=>{ m.hp=stat(m,'hp'); m.st=null; }); G.bag={capsule:20,tonic:5,big:2}; G.flags.starter=1; const [sx,sy]=area.spawn||[1,1]; G.heal={area:area.id,x:sx,y:sy};
  Editor.hide(); Fade.a=1; scene='world'; UI.clear(); World.load(area.id,sx,sy,'down'); await fadeTo(0,260); toast('playtest · START › End playtest to go back','pink'); }
async function endPlaytest(){ await fadeTo(1,200); Play.test=false; Play.area=null; G=RealG; RealG=null; UI.clear(); Snd.stopMusic(); Editor.show(); Fade.a=0; }

async function importCapsule(){ const f=await pickFile('.fweddle,application/octet-stream,*/*'); if(!f)return; let o; try{ o=await Capsule.parse(new Uint8Array(await f.arrayBuffer())); }catch(e){ toast(e.message||'not a capsule','pink'); return; }
  if(o.kind==='entities.save'&&o.save&&o.save.party){ const c=await Text.say('Load this save file? It replaces the one on this device.',{choices:['Load it','Cancel'],cancel:1}); if(c!==0)return; Store.set('save',o.save); toast('save imported','lime'); Title.show(); }
  else if(o.kind==='entities.area'&&o.area){ const b=Editor.sanitize(o.area); if(BUILTIN[b.id])b.id='a'+Date.now().toString(36); Custom.put(b); toast('added «'+b.name+'» — the Lamp in Portal Plaza opens it','lime'); }
  else toast('that capsule isn\'t from ENTITIES','pink'); }

/* ── the loop ── */
let _last=performance.now();
function frame(now){ const dt=Math.min(50,now-_last); _last=now; const t=now/1000;
  if(scene!=='editor'){ if(scene==='world'&&World.a){ World.update(dt); World.draw(t); } else if(scene==='battle')Battle.draw(t); else if(scene==='evo')Battle.drawEvo(t); else if(scene==='title')Title.draw(t);
    if(Fade.a>0.001){ g.globalAlpha=Math.min(1,Fade.a); g.fillStyle=Fade.col; g.fillRect(0,0,View.W,View.H); g.globalAlpha=1; } }
  requestAnimationFrame(frame); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ Input.clear(); if(G&&scene==='world'&&!Play.test)saveGame(true); } });
addEventListener('pagehide',()=>{ if(G&&scene==='world'&&!Play.test)saveGame(true); });
document.addEventListener('gesturestart',e=>e.preventDefault());
fit(); Title.show(); requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fit());

</script>
</body>
