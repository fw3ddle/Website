<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book1 - cellbread</title>
<style>
  /* ꟻ cellbread — single-file HTML5 spreadsheet. Lineage: goatpad (chrome, themes, tune), Shape Atlas (math), LibreOffice Calc (function set, conventions). */
  :root{
    --uiFont: Tahoma, "Segoe UI", Verdana, sans-serif;
    --cellFont: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
    --chrome:#f1f1f1; --chrome2:#e3e3e3; --chromeText:#1e1e1e;
    --accent:#217346; --accentText:#ffffff;
    --title1:#2f8a55; --title2:#0f3d22; --titleText:#ffffff;
    --win:#ffffff; --border:#a0a0a0; --light:#ffffff; --dark:#6a6a6a;
    --sheetBg:#ffffff; --grid:#d6d6d6; --hdr:#ececec; --hdrText:#333333; --hdrSel:#cfe8d7; --hdrSelText:#0b3d1e;
    --cellText:#000000; --selBorder:#217346; --winText:#000000;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    font:11px/1.3 var(--uiFont); color:var(--chromeText); background:var(--chrome);
    display:flex; flex-direction:column; user-select:none;
    -webkit-font-smoothing:none; font-smooth:never;
  }
  button,input,select,textarea{ font:inherit; color:inherit; }
  button{ background:none; border:0; cursor:default; }
  u{ text-decoration:underline; }

  /* ---------- title bar ---------- */
  .titlebar{ height:24px; flex:none; display:flex; align-items:center; gap:6px; padding:0 6px;
    background:linear-gradient(90deg,var(--title1),var(--title2)); color:var(--titleText); font-weight:bold; }
  .titlebar .tico{ width:16px; height:16px; image-rendering:pixelated; flex:none; }
  .titlebar .ttext{ flex:1; text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .qat{ display:flex; gap:2px; }
  .qat button{ width:22px; height:18px; color:inherit; border:1px solid transparent; font-size:12px; line-height:1; }
  .qat button:hover{ border-color:rgba(255,255,255,.6); background:rgba(255,255,255,.15); }
  .qat button:disabled{ opacity:.4; }

  /* ---------- ribbon ---------- */
  .ribbon{ flex:none; background:var(--chrome); border-bottom:1px solid var(--border); }
  .rtabs{ display:flex; align-items:flex-end; height:23px; padding:0 4px; gap:1px; background:var(--chrome2); }
  .rtab{ padding:3px 10px 4px; border:1px solid transparent; border-bottom:0; white-space:nowrap; }
  .rtab.file{ background:var(--accent); color:var(--accentText); font-weight:bold; }
  .rtab.on{ background:var(--chrome); border-color:var(--border); margin-bottom:-1px; padding-bottom:5px; }
  .rtab:hover:not(.on):not(.file){ background:var(--chrome); }
  .rpanel{ display:none; height:94px; padding:4px 4px 2px; gap:2px; overflow-x:auto; overflow-y:hidden; }
  .rpanel.on{ display:flex; }
  .ribbon.collapsed .rpanel.on{ display:none; }
  .rgroup{ display:flex; flex-direction:column; border-right:1px solid var(--border); padding:0 4px; flex:none; }
  .rgroup .ritems{ flex:1; display:flex; align-items:flex-start; gap:3px; }
  .rgroup .rname{ text-align:center; color:var(--chromeText); opacity:.6; font-size:10px; padding-top:2px; white-space:nowrap; }
  .rcol{ display:flex; flex-direction:column; gap:1px; }
  .rrow{ display:flex; gap:1px; align-items:center; }
  .rb{ display:flex; align-items:center; gap:4px; padding:1px 5px; border:1px solid transparent; white-space:nowrap; height:21px; color:inherit; }
  .rb:hover{ border-color:var(--border); background:var(--win); }
  .rb.on{ background:var(--hdrSel); border-color:var(--selBorder); }
  .rb.big{ flex-direction:column; justify-content:center; height:66px; min-width:46px; padding:2px 4px; line-height:1.1; text-align:center; gap:3px; }
  .rb .ico{ font-size:13px; width:16px; text-align:center; display:inline-block; line-height:1; }
  .rb.big .ico{ font-size:22px; width:auto; }
  .rb .arrow{ font-size:8px; opacity:.8; }
  .rb.ic{ width:24px; padding:1px; justify-content:center; }
  .rb.ic .ico{ width:auto; }
  .rsel{ height:21px; border:1px solid var(--border); background:var(--win); color:var(--winText); padding:0 2px; max-width:150px; }
  .rsel.sm{ width:46px; }
  .cbar{ display:block; height:3px; width:14px; margin-top:-2px; border:1px solid rgba(0,0,0,.4); }

  /* ---------- formula bar ---------- */
  .fbar{ height:25px; flex:none; display:flex; align-items:stretch; gap:3px; padding:2px 4px; background:var(--chrome); border-bottom:1px solid var(--border); }
  .fbar.tall{ height:94px; }
  .namebox{ width:120px; border:1px solid var(--border); background:var(--win); color:var(--winText); padding:0 4px; }
  .fxbtn{ width:24px; border:1px solid var(--border); background:var(--win); color:var(--winText); font-style:italic; font-family:Georgia,serif; }
  #fin{ flex:1; border:1px solid var(--border); background:var(--win); color:var(--cellText); padding:2px 4px; resize:none;
    font-family:var(--cellFont); font-size:12px; line-height:15px; white-space:pre; overflow:hidden; }
  .fbar.tall #fin{ white-space:pre-wrap; overflow:auto; }
  .fexp{ width:18px; border:1px solid var(--border); background:var(--win); color:var(--winText); }

  /* ---------- grid ---------- */
  .gridwrap{ flex:1; position:relative; overflow:hidden; background:var(--sheetBg); min-height:60px; }
  .scroller{ position:absolute; inset:0; overflow:auto; outline:none; }
  .spacer{ position:absolute; left:0; top:0; width:1px; height:1px; }
  #gc{ position:absolute; left:0; top:0; pointer-events:none; image-rendering:pixelated; image-rendering:crisp-edges; }
  #gc.crisp{ image-rendering:auto; }
  #ed{ position:absolute; display:none; z-index:6; border:2px solid var(--selBorder); background:var(--sheetBg); color:var(--cellText);
    outline:none; resize:none; overflow:hidden; padding:1px 3px; white-space:pre; line-height:normal; }
  #kb{ position:absolute; left:0; top:0; width:2px; height:2px; opacity:0; z-index:0; resize:none; border:0; }
  .popup{ position:absolute; z-index:50; background:var(--win); color:var(--winText); border:1px solid var(--border); box-shadow:2px 2px 0 rgba(0,0,0,.35); font-size:11px; }
  .ac .it{ padding:2px 8px; white-space:nowrap; } .ac .it.on{ background:var(--accent); color:var(--accentText); }
  .ac .it small{ opacity:.65; margin-left:8px; }
  .sig{ padding:2px 6px; background:#ffffe0; border:1px solid #999; color:#000; white-space:nowrap; }
  .sig b{ color:#a0002a; }
  .tip{ position:absolute; z-index:60; background:#ffffe0; color:#000; border:1px solid #888; padding:3px 6px; max-width:280px; white-space:pre-wrap; font-size:11px; pointer-events:none; }
  .ftr{ position:absolute; z-index:55; width:210px; background:var(--win); border:1px solid var(--border); box-shadow:2px 2px 0 rgba(0,0,0,.35); color:var(--winText); display:flex; flex-direction:column; }
  .ftr .frow{ padding:3px 6px; }
  .ftr .frow:hover{ background:var(--hdrSel); }
  .ftr .vals{ height:150px; overflow:auto; border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:2px 0; }
  .ftr .vals label{ display:block; padding:1px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ftr input[type=text]{ margin:3px 6px; border:1px solid var(--border); padding:1px 3px; background:var(--win); color:var(--winText); }
  .ftr .fbtns{ display:flex; justify-content:flex-end; gap:4px; padding:4px 6px; }
  .dvbtn{ position:absolute; z-index:5; width:16px; background:var(--chrome); border:1px solid var(--border); font-size:9px; display:none; color:var(--chromeText); }

  /* ---------- sheet tabs ---------- */
  .tabsbar{ height:22px; flex:none; display:flex; align-items:stretch; background:var(--chrome2); border-top:1px solid var(--border); }
  .tabnav{ display:flex; }
  .tabnav button,.addtab{ width:20px; color:inherit; }
  .tabnav button:hover,.addtab:hover{ background:var(--chrome); }
  .tabs{ display:flex; overflow:hidden; gap:1px; padding:0 2px; }
  .stab{ padding:2px 10px 0; border:1px solid var(--border); border-top:0; background:var(--chrome); white-space:nowrap; position:relative; display:flex; align-items:center; }
  .stab.on{ background:var(--win); color:var(--winText); font-weight:bold; border-bottom:2px solid var(--accent); }
  .stab .clr{ position:absolute; left:0; right:0; bottom:0; height:3px; }
  .stab input{ width:80px; border:1px solid var(--accent); padding:0 2px; }

  /* ---------- status bar ---------- */
  .statusbar{ height:22px; flex:none; display:flex; align-items:center; gap:10px; padding:0 6px; background:var(--chrome2); border-top:1px solid var(--border); }
  .statusbar .crumbs{ flex:1; overflow:hidden; white-space:nowrap; letter-spacing:1px; color:var(--accent); cursor:copy; user-select:text; }
  .statusbar .stats{ white-space:nowrap; }
  .zoomctl{ display:flex; align-items:center; gap:4px; }
  .zoomctl input{ width:90px; }
  .zoomctl button{ width:16px; color:inherit; }
  .zoomctl .pct{ width:38px; text-align:right; cursor:pointer; }

  /* ---------- menus, dialogs ---------- */
  .menu{ position:fixed; z-index:200; min-width:170px; background:var(--win); color:var(--winText); border:1px solid var(--border); box-shadow:2px 2px 0 rgba(0,0,0,.35); padding:2px; max-height:80vh; overflow:auto; }
  .mi{ padding:3px 20px 3px 24px; white-space:nowrap; position:relative; display:flex; justify-content:space-between; gap:20px; align-items:center; }
  .mi:hover{ background:var(--accent); color:var(--accentText); }
  .mi.dis{ color:#999; } .mi.dis:hover{ background:none; color:#999; }
  .mi .k{ opacity:.7; font-size:10px; }
  .mi.chk::before{ content:"\2713"; position:absolute; left:7px; }
  .mi .sw{ display:inline-block; width:12px; height:12px; border:1px solid #000; vertical-align:middle; margin-right:5px; }
  .mi .mico{ position:absolute; left:5px; width:16px; text-align:center; }
  .mhead{ padding:3px 8px; font-weight:bold; opacity:.7; font-size:10px; }
  .msep{ height:1px; background:var(--border); margin:3px 2px; }
  .pal{ display:grid; grid-template-columns:repeat(10,16px); gap:2px; padding:4px 6px; }
  .pal span{ width:16px; height:16px; border:1px solid #666; display:block; }
  .pal span:hover{ outline:2px solid #000; }
  .ov{ position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:300; display:flex; align-items:center; justify-content:center; }
  .dlg{ background:var(--chrome); color:var(--chromeText); border:1px solid var(--border); box-shadow:3px 3px 0 rgba(0,0,0,.4);
    min-width:320px; max-width:94vw; max-height:92vh; display:flex; flex-direction:column; }
  .dlg .dt{ background:linear-gradient(90deg,var(--title1),var(--title2)); color:var(--titleText); padding:3px 6px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
  .dlg .dt button{ color:inherit; width:18px; }
  .dlg .db{ padding:10px; overflow:auto; display:flex; flex-direction:column; gap:8px; }
  .dlg .df{ padding:6px 10px; display:flex; justify-content:flex-end; gap:6px; border-top:1px solid var(--border); }
  .btn{ min-width:72px; padding:3px 10px; background:var(--chrome); color:var(--chromeText); border:1px solid; border-color:var(--light) var(--dark) var(--dark) var(--light); box-shadow:0 0 0 1px var(--border); }
  .btn:active{ border-color:var(--dark) var(--light) var(--light) var(--dark); }
  .btn.pri{ font-weight:bold; }
  .btn.sm{ min-width:0; padding:1px 6px; }
  .row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .row label{ min-width:96px; }
  .dlg input[type=text],.dlg input[type=number],.dlg select{ border:1px solid var(--border); background:var(--win); color:var(--winText); padding:2px 4px; }
  .dlg input[type=text],.dlg input[type=number]{ min-width:60px; }
  .dlg textarea{ border:1px solid var(--border); background:var(--win); color:var(--winText); padding:3px; font-family:Consolas,"Courier New",monospace; font-size:11px; min-height:140px; resize:vertical; }
  .dlg .wide{ width:100%; }
  .dtabs{ display:flex; gap:2px; border-bottom:1px solid var(--border); }
  .dtab{ padding:3px 10px; border:1px solid var(--border); border-bottom:0; background:var(--chrome2); }
  .dtab.on{ background:var(--chrome); margin-bottom:-1px; padding-bottom:4px; font-weight:bold; }
  .dpane{ display:none; } .dpane.on{ display:flex; flex-direction:column; gap:6px; }
  .lst{ height:170px; overflow:auto; border:1px solid var(--border); background:var(--win); color:var(--winText); }
  .lst div{ padding:2px 6px; white-space:nowrap; } .lst div.on{ background:var(--accent); color:var(--accentText); }
  .lst.short{ height:110px; }
  .sample{ padding:4px 6px; border:1px solid var(--border); background:var(--win); color:var(--winText); min-height:22px; font-family:var(--cellFont); }
  .swatch{ display:inline-block; width:18px; height:14px; border:1px solid #000; vertical-align:middle; }
  .hint{ font-size:10px; opacity:.7; }
  table.tbl{ border-collapse:collapse; } table.tbl td,table.tbl th{ border:1px solid var(--border); padding:2px 6px; text-align:left; }
  .toast{ position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:5px 12px; z-index:400; border:1px solid #888; }
  .bpane{ display:flex; gap:14px; }
  .bpane .bl{ display:flex; flex-direction:column; gap:2px; min-width:160px; }
  .bpane .bl button{ text-align:left; padding:5px 8px; border:1px solid transparent; color:inherit; }
  .bpane .bl button:hover{ background:var(--hdrSel); border-color:var(--border); }
  .bpane .bl h4{ margin:6px 0 2px; font-size:10px; opacity:.7; }
  .kbd{ display:inline-block; border:1px solid #888; border-bottom-width:2px; padding:0 4px; background:#fff; color:#000; font-size:10px; margin-right:4px; }
  .cfrule{ display:flex; gap:6px; align-items:center; padding:3px; border:1px solid var(--border); background:var(--win); color:var(--winText); }
  @media print{ body{ display:none; } }
</style>
</head>
<body>

<div class="titlebar" id="titlebar">
  <svg class="tico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="12" fill="#fff" stroke="#000"/><rect x="1" y="2" width="14" height="3" fill="#217346"/><path d="M1 8h14M1 11h14M5 5v9M10 5v9" stroke="#217346" stroke-width="1"/><rect x="5" y="8" width="5" height="3" fill="#9fe6c0"/></svg>
  <span class="qat"><button id="qSave" title="Save (Ctrl+S)">&#128190;</button><button id="qUndo" title="Undo (Ctrl+Z)">&#8630;</button><button id="qRedo" title="Redo (Ctrl+Y)">&#8631;</button></span>
  <span class="ttext" id="ttext" title="Click to rename the workbook">Book1 - cellbread</span>
  <span class="qat"><button id="qHelp" title="Keyboard shortcuts (F1)">?</button><button id="qCollapse" title="Collapse the ribbon (Ctrl+F1)">&#9652;</button></span>
</div>

<div class="ribbon" id="ribbon">
  <div class="rtabs" id="rtabs"></div>
  <div id="rpanels"></div>
</div>

<div class="fbar" id="fbar">
  <input class="namebox" id="namebox" title="Name box — type an address or a name and press Enter" spellcheck="false">
  <button class="fxbtn" id="fxbtn" title="Insert function (Shift+F3)">fx</button>
  <textarea id="fin" rows="1" spellcheck="false" aria-label="Formula bar"></textarea>
  <button class="fexp" id="fexp" title="Expand formula bar (Ctrl+Shift+U)">&#8964;</button>
</div>

<div class="gridwrap" id="gridwrap">
  <div class="scroller" id="scroller" tabindex="-1"><div class="spacer" id="spacer"></div></div>
  <canvas id="gc"></canvas>
  <textarea id="ed" spellcheck="false" aria-label="Cell editor"></textarea>
  <button class="dvbtn" id="dvbtn" title="Pick from list">&#9660;</button>
  <textarea id="kb" aria-label="Spreadsheet grid" spellcheck="false"></textarea>
</div>

<div class="tabsbar">
  <span class="tabnav"><button id="tabPrev" title="Previous sheet (Ctrl+PgUp)">&#9666;</button><button id="tabNext" title="Next sheet (Ctrl+PgDn)">&#9656;</button></span>
  <div class="tabs" id="tabs"></div>
  <button class="addtab" id="addTab" title="New sheet (Shift+F11)">+</button>
  <span style="flex:1"></span>
</div>

<div class="statusbar">
  <span id="stMode" style="min-width:36px">Ready</span>
  <span id="stMsg"></span>
  <span class="crumbs" id="crumbs" title="crumbs — the workbook's tune; click to copy"></span>
  <span class="stats" id="stStats"></span>
  <span class="zoomctl"><button id="zoomOut" title="Zoom out">&minus;</button><input type="range" id="zoomSl" min="25" max="400" value="100"><button id="zoomIn" title="Zoom in">+</button><span class="pct" id="zoomPct" title="Click for 100%">100%</span></span>
</div>

<div id="tip" class="tip" style="display:none"></div>
<input type="file" id="filePick" style="display:none" accept=".cellbread,.json,.csv,.tsv,.txt,.xlsx,.fweddle,.html,.htm">
<input type="file" id="imgPick" style="display:none" accept="image/*">
<input type="file" id="fontPick" style="display:none" accept=".ttf,.otf,.woff,.woff2,.fweddle">

<script>
(function(){
'use strict';
/* =====================================================================
   0. constants & tiny helpers
   ===================================================================== */
const APP = 'cellbread', VER = '1.0.0';
const MAXR = 1048576, MAXC = 16384, DEF_CW = 64, DEF_RH = 20, HDR_H = 20;
const K = (r,c) => r*MAXC + c, KR = k => Math.floor(k/MAXC), KC = k => k % MAXC;
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a ? a : v>b ? b : v;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid = () => Math.random().toString(36).slice(2,9);
function colName(c){ let s=''; c = c+1; while(c>0){ const m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26); } return s; }
function colIndex(s){ let n=0; s=s.toUpperCase(); for(let i=0;i<s.length;i++) n=n*26+(s.charCodeAt(i)-64); return n-1; }
function addr(r,c,ar,ac){ return (ac?'$':'')+colName(c)+(ar?'$':'')+(r+1); }
function rangeAddr(r1,c1,r2,c2){ return (r1===r2&&c1===c2) ? addr(r1,c1) : addr(r1,c1)+':'+addr(r2,c2); }
function quoteSheet(n){ return /^[A-Za-z_][\w.]*$/.test(n) ? n : "'"+n.replace(/'/g,"''")+"'"; }
function norm(s){ return { r1:Math.min(s.r1,s.r2), c1:Math.min(s.c1,s.c2), r2:Math.max(s.r1,s.r2), c2:Math.max(s.c1,s.c2) }; }
function inRange(R,r,c){ return r>=R.r1&&r<=R.r2&&c>=R.c1&&c<=R.c2; }
function hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(x=>x+x).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join(''); }
function mixHex(a,b,t){ const x=hexToRgb(a), y=hexToRgb(b); return rgbToHex(x[0]+(y[0]-x[0])*t, x[1]+(y[1]-x[1])*t, x[2]+(y[2]-x[2])*t); }
function isDark(h){ const c=hexToRgb(h); return (c[0]*299+c[1]*587+c[2]*114)/1000 < 120; }
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

/* reference text → parts.  Accepts A1, $A$1, A1:B2, A:A, 1:1, Sheet1!A1, 'My Sheet'!A1:B2 */
const REF_RE = /^\s*(?:(?:'((?:[^']|'')+)'|([A-Za-z_][\w.]*))!)?(?:(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?::(\$?)([A-Za-z]{1,3})(\$?)(\d+))?|(\$?)([A-Za-z]{1,3}):(\$?)([A-Za-z]{1,3})|(\$?)(\d+):(\$?)(\d+))\s*$/;
function parseRef(s){
  const m = REF_RE.exec(s); if(!m) return null;
  const sheet = m[1] ? m[1].replace(/''/g,"'") : (m[2]||null);
  let p;
  if(m[4]){
    const c1=colIndex(m[4]), r1=+m[6]-1;
    if(c1>=MAXC||r1>=MAXR||r1<0) return null;
    p = { sheet, ac1:!!m[3], c1, ar1:!!m[5], r1, ac2:!!m[3], c2:c1, ar2:!!m[5], r2:r1, wc:false, wr:false };
    if(m[8]){ const c2=colIndex(m[8]), r2=+m[10]-1; if(c2>=MAXC||r2>=MAXR||r2<0) return null; p.ac2=!!m[7]; p.c2=c2; p.ar2=!!m[9]; p.r2=r2; }
  } else if(m[12]){
    const c1=colIndex(m[12]), c2=colIndex(m[14]); if(c1>=MAXC||c2>=MAXC) return null;
    p = { sheet, ac1:!!m[11], c1, ar1:true, r1:0, ac2:!!m[13], c2, ar2:true, r2:MAXR-1, wc:true, wr:false };
  } else {
    const r1=+m[16]-1, r2=+m[18]-1; if(r1>=MAXR||r2>=MAXR||r1<0||r2<0) return null;

A('RANK','RANK(number, ref, [order])','Rank of a number in a list.',args=>{ const x=snum(args[0]); const a=nums([args[1]]); const asc=args[2]==null?false:sbool(args[2]); if(!a.includes(x)) throw E.NA; return 1+a.filter(v=>asc? v<x : v>x).length; });

A('PERCENTRANK','PERCENTRANK(array, x, [significance])','Percent rank of a value.',args=>{ const s=sortVals(nums([args[0]])), x=snum(args[1]); if(!s.length) throw E.NA; let below=s.filter(v=>v<x).length; if(s.includes(x)) return below/(s.length-1); const lo=s[below-1], hi=s[below]; if(lo===undefined||hi===undefined) throw E.NA; return (below-1+(x-lo)/(hi-lo))/(s.length-1); });

A('SLOPE','SLOPE(known_y, known_x)','Slope of the regression line.',args=>{ const [x,y]=pairNums(args[1],args[0]); const d=covar(x,x); if(d===0) throw E.DIV0; return covar(x,y)/d; });
A('INTERCEPT','INTERCEPT(known_y, known_x)','Intercept of the regression line.',args=>{ const [x,y]=pairNums(args[1],args[0]); const d=covar(x,x); if(d===0) throw E.DIV0; return mean(y)-covar(x,y)/d*mean(x); });
A('FORECAST','FORECAST(x, known_y, known_x)','Linear forecast.',args=>{ const [x,y]=pairNums(args[2],args[1]); const d=covar(x,x); if(d===0) throw E.DIV0; const b=covar(x,y)/d; return mean(y)-b*mean(x)+b*snum(args[0]); });

A('TREND','TREND(known_y, [known_x], [new_x])','Values along a linear trend.',args=>{ const ys=nums([args[0]]); const xs=args[1]==null? ys.map((_,i)=>i+1) : nums([args[1]]); const nx=args[2]==null? xs : nums([args[2]]); if(xs.length!==ys.length||xs.length<2) throw E.VALUE; const d=covar(xs,xs); if(d===0) throw E.DIV0; const b=covar(xs,ys)/d, a=mean(ys)-b*mean(xs); return nx.map(x=>[a+b*x]); });
A('GROWTH','GROWTH(known_y, [known_x], [new_x])','Values along an exponential trend.',args=>{ const ys=nums([args[0]]).map(v=>{ if(v<=0) throw E.NUM; return Math.log(v); }); const xs=args[1]==null? ys.map((_,i)=>i+1) : nums([args[1]]); const nx=args[2]==null? xs : nums([args[2]]); if(xs.length!==ys.length||xs.length<2) throw E.VALUE; const d=covar(xs,xs); if(d===0) throw E.DIV0; const b=covar(xs,ys)/d, a=mean(ys)-b*mean(xs); return nx.map(x=>[Math.exp(a+b*x)]); });
A('GEOMEAN','GEOMEAN(number1, ...)','Geometric mean.',args=>{ const a=nums(args); if(!a.length||a.some(v=>v<=0)) throw E.NUM; return Math.exp(a.reduce((s,v)=>s+Math.log(v),0)/a.length); });
A('HARMEAN','HARMEAN(number1, ...)','Harmonic mean.',args=>{ const a=nums(args); if(!a.length||a.some(v=>v<=0)) throw E.NUM; return a.length/a.reduce((s,v)=>s+1/v,0); });

A('DEVSQ','DEVSQ(number1, ...)','Sum of squared deviations.',args=>{ const a=nums(args); if(!a.length) throw E.NUM; const m=mean(a); return a.reduce((s,v)=>s+(v-m)*(v-m),0); });

S('NORM.DIST','NORM.DIST(x, mean, standard_dev, cumulative)','Normal distribution.',(x,m,s,c)=>{ x=num(x); m=num(m); s=num(s); if(s<=0) throw E.NUM; const z=(x-m)/s; return bool(c)? normCdf(z) : normPdf(z)/s; });

S('BINOM.DIST','BINOM.DIST(number_s, trials, probability_s, cumulative)','Binomial distribution.',(k,n,p,c)=>{ k=Math.floor(num(k)); n=Math.floor(num(n)); p=num(p); if(k<0||k>n||p<0||p>1) throw E.NUM; const pmf=i=>{ let r=1; for(let t=1;t<=i;t++) r=r*(n-i+t)/t; return r*Math.pow(p,i)*Math.pow(1-p,n-i); }; if(!bool(c)) return pmf(k); let s=0; for(let i=0;i<=k;i++) s+=pmf(i); return s; });

S('POISSON.DIST','POISSON.DIST(x, mean, cumulative)','Poisson distribution.',(x,m,c)=>{ x=Math.floor(num(x)); m=num(m); if(x<0||m<0) throw E.NUM; const pmf=i=>Math.exp(-m)*Math.pow(m,i)/fact(i); if(!bool(c)) return pmf(x); let s=0; for(let i=0;i<=x;i++) s+=pmf(i); return s; });

A('FREQUENCY','FREQUENCY(data_array, bins_array)','Frequency distribution as a vertical array.',args=>{ const d=nums([args[0]]); const b=sortVals(nums([args[1]])); const out=b.map(()=>0); out.push(0); for(const v of d){ let i=b.findIndex(x=>v<=x); if(i<0) i=b.length; out[i]++; } return out.map(x=>[x]); });

/* ---- Logical ---- */
CAT='Logical';
A('TRUE','TRUE()','The logical value TRUE.',()=>true);
A('FALSE','FALSE()','The logical value FALSE.',()=>false);
S('NOT','NOT(logical)','Reverse a logical value.',x=>!bool(x));
function logicVals(args){ const out=[]; for(const a of args){ if(a===undefined) continue; if(a instanceof Ref){ for(const [v] of iterRef(a)){ if(isErr(v)) throw v; if(typeof v==='boolean'||typeof v==='number') out.push(!!v); } } else if(isMat(a)){ for(const row of a) for(const v of row){ if(isErr(v)) throw v; if(typeof v==='boolean'||typeof v==='number') out.push(!!v); } } else if(a!==null) out.push(bool(a)); } if(!out.length) throw E.VALUE; return out; }
A('AND','AND(logical1, ...)','TRUE if all arguments are TRUE.',args=>logicVals(args).every(x=>x));
A('OR','OR(logical1, ...)','TRUE if any argument is TRUE.',args=>logicVals(args).some(x=>x));
A('XOR','XOR(logical1, ...)','Logical exclusive OR.',args=>logicVals(args).filter(x=>x).length%2===1);
L('IF','IF(logical_test, [value_if_true], [value_if_false])','Return one value if a condition is true and another if false.',(a,ctx)=>{ const t=evSafe(a[0],ctx); const go=(node,def)=>node===undefined? def : node.t==='empty'? 0 : evalNode(node,ctx); const one=c=>{ if(isErr(c)) throw c; return bool(c)? go(a[1],true) : go(a[2],false); }; const tm=mat(t); if(isMat(tm)) return tm.map(row=>row.map(c=>safe(()=>finalize(one(c))))); return one(tm); });
L('IFS','IFS(logical_test1, value_if_true1, ...)','Return the value for the first true condition.',(a,ctx)=>{ for(let i=0;i+1<a.length;i+=2){ const t=evSafe(a[i],ctx); if(isErr(t)) throw t; if(sbool(t)) return evalNode(a[i+1],ctx); } throw E.NA; });
L('IFERROR','IFERROR(value, value_if_error)','Return a fallback if the value is an error.',(a,ctx)=>{ const v=evSafe(a[0],ctx); const f=v instanceof Ref? mat(v):v; if(isMat(f)) return f.map(row=>row.map(x=>isErr(x)? safe(()=>finalize(evalNode(a[1],ctx))) : x)); return isErr(f)? evalNode(a[1],ctx) : v; });
L('IFNA','IFNA(value, value_if_na)','Return a fallback if the value is #N/A.',(a,ctx)=>{ const v=evSafe(a[0],ctx); const f=sv(v); return (isErr(f)&&f.code==='#N/A')? evalNode(a[1],ctx) : v; });
L('SWITCH','SWITCH(expression, value1, result1, ..., [default])','Match an expression against values.',(a,ctx)=>{ const x=sv(evSafe(a[0],ctx)); if(isErr(x)) throw x; let i=1; for(;i+1<a.length;i+=2){ const v=sv(evSafe(a[i],ctx)); if(!isErr(v)&&cmp(x,v)===0) return evalNode(a[i+1],ctx); } if(i<a.length) return evalNode(a[i],ctx); throw E.NA; });
L('CHOOSE','CHOOSE(index_num, value1, ...)','Pick a value from a list by index.',(a,ctx)=>{ const i=Math.floor(snum(evSafe(a[0],ctx))); if(i<1||i>=a.length) throw E.VALUE; return evalNode(a[i],ctx); });
L('LET','LET(name1, value1, ..., calculation)','Bind names to values inside a formula.',(a,ctx)=>{ const locals=Object.assign({},ctx.locals||{}); const c2=Object.assign({},ctx,{locals}); for(let i=0;i+1<a.length-1;i+=2){ if(a[i].t!=='name') throw E.VALUE; locals[a[i].v.toUpperCase()]=finalize(evSafe(a[i+1],c2)); } return evalNode(a[a.length-1],c2); });

A('CONCAT','CONCAT(text1, ...)','Join text from values and ranges.',args=>{ let s=''; for(const a of args){ if(a===undefined) continue; if(a instanceof Ref||isMat(a)){ const m=rangeMat(a); for(const row of m) for(const v of row){ if(isErr(v)) throw v; s+=str(v); } } else s+=str(a); } return s; });

S('NUMBERVALUE','NUMBERVALUE(text, [decimal_separator], [group_separator])','Text to number with custom separators.',(t,d,g)=>{ let s=str(t).trim(); if(g!==undefined) s=s.split(str(g)).join(''); if(d!==undefined) s=s.split(str(d)).join('.'); const v=parseNumLoose(s); if(v==null) throw E.VALUE; return v; });

S('REPLACE','REPLACE(old_text, start_num, num_chars, new_text)','Replace part of text by position.',(o,s,n,nw)=>{ o=str(o); s=Math.floor(num(s)); n=Math.floor(num(n)); if(s<1||n<0) throw E.VALUE; return o.slice(0,s-1)+str(nw)+o.slice(s-1+n); });
S('REPT','REPT(text, number_times)','Repeat text.',(t,n)=>{ n=Math.floor(num(n)); if(n<0||n>32767) throw E.VALUE; return str(t).repeat(n); });

S('SEARCH','SEARCH(find_text, within_text, [start_num])','Position of text (case-insensitive, wildcards).',(f,w,s)=>{ s=s===undefined?1:Math.floor(num(s)); if(s<1) throw E.VALUE; f=str(f); w=str(w); let re=''; for(let i=0;i<f.length;i++){ const ch=f[i]; if(ch==='~'&&i+1<f.length){ re+=f[++i].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); } else if(ch==='*') re+='.*'; else if(ch==='?') re+='.'; else re+=ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); } const m=new RegExp(re,'i').exec(w.slice(s-1)); if(!m) throw E.VALUE; return m.index+s; });
S('SUBSTITUTE','SUBSTITUTE(text, old_text, new_text, [instance_num])','Replace text by content.',(t,o,n,k)=>{ t=str(t); o=str(o); n=str(n); if(!o) return t; if(k===undefined) return t.split(o).join(n); k=Math.floor(num(k)); if(k<1) throw E.VALUE; let idx=-1; for(let i=0;i<k;i++){ idx=t.indexOf(o,idx+1); if(idx<0) return t; } return t.slice(0,idx)+n+t.slice(idx+o.length); });

A('TEXTSPLIT','TEXTSPLIT(text, col_delimiter, [row_delimiter], [ignore_empty])','Split text into an array.',args=>{ const t=sstr(args[0]); const cd=args[1]==null?null:sstr(args[1]); const rd=args[2]==null?null:sstr(args[2]); const ig=args[3]==null?false:sbool(args[3]); let rows=rd? t.split(rd) : [t]; let m=rows.map(r=>cd? r.split(cd) : [r]); if(ig) m=m.map(r=>r.filter(x=>x!=='')).filter(r=>r.length); if(!m.length) throw E.CALC; const w=Math.max.apply(null,m.map(r=>r.length)); return m.map(r=>{ while(r.length<w) r.push(E.NA); return r.map(x=>{ const n=parseNumLoose(x); return n!=null&&/^\s*-?[\d.,]+\s*$/.test(x)?n:x; }); }); });

S('DATEDIF','DATEDIF(start_date, end_date, unit)','Difference between dates in Y, M, D, MD, YM or YD.',(a,b,u)=>{ const s=Math.floor(dnum(a)), e=Math.floor(dnum(b)); if(e<s) throw E.NUM; const A=parts(s), B=parts(e); u=str(u).toUpperCase(); let months=(B.y-A.y)*12+(B.m-A.m); if(B.d<A.d) months--; switch(u){ case 'D': return e-s; case 'M': return months; case 'Y': return Math.floor(months/12); case 'YM': return months%12; case 'MD': { let d=B.d-A.d; if(d<0){ const pm=new Date(Date.UTC(B.y,B.m-1,0)).getUTCDate(); d+=pm; } return d; } case 'YD': { const anniv=ymd(A.y+Math.floor(months/12),A.m,A.d); return e-anniv; } } throw E.NUM; });
S('YEARFRAC','YEARFRAC(start_date, end_date, [basis])','Fraction of a year between dates.',(a,b,basis)=>{ let s=Math.floor(dnum(a)), e=Math.floor(dnum(b)); if(e<s){ const t=s; s=e; e=t; } basis=basis===undefined?0:Math.floor(num(basis)); const A=parts(s), B=parts(e); if(basis===0||basis===4){ let d1=A.d,d2=B.d; if(basis===4){ if(d1===31) d1=30; if(d2===31) d2=30; } else { if(d1===31) d1=30; if(d2===31&&d1===30) d2=30; } return ((B.y-A.y)*360+(B.m-A.m)*30+(d2-d1))/360; } if(basis===2) return (e-s)/360; if(basis===3) return (e-s)/365; let days=0,years=0; for(let y=A.y;y<=B.y;y++){ days+= (new Date(Date.UTC(y,11,31))-new Date(Date.UTC(y,0,1)))/86400000+1; years++; } return (e-s)/(days/years); });

A('EXPAND','EXPAND(array, rows, [cols], [pad_with])','Pad an array to a size.',args=>{ const m=rangeMat(args[0]); const R=args[1]==null?m.length:Math.floor(snum(args[1])), C=args[2]==null?m[0].length:Math.floor(snum(args[2])); const pad=args[3]===undefined?E.NA:sv(args[3]); if(R<m.length||C<m[0].length) throw E.VALUE; const out=[]; for(let i=0;i<R;i++){ const row=[]; for(let j=0;j<C;j++) row.push(i<m.length&&j<m[0].length? m[i][j] : pad); out.push(row); } return out; });

function xmatchIdx(lv,vec,mode,smode){ lv=sv(lv); if(smode===-1){ const rev=vec.slice().reverse(); const i=xmatchIdx(lv,rev,mode,1); return i<0?-1:vec.length-1-i; } if(mode===0) return matchIn(lv,vec,0,false); if(mode===2) return matchIn(lv,vec,0,true); let best=-1, bestV=null; for(let i=0;i<vec.length;i++){ const v=vec[i]; if(v==null||rank(v)!==rank(lv)) continue; const c=cmp(v,lv); if(c===0) return i; if(mode===-1&&c<0&&(bestV===null||cmp(v,bestV)>0)){ best=i; bestV=v; } if(mode===1&&c>0&&(bestV===null||cmp(v,bestV)<0)){ best=i; bestV=v; } } return best; }

class Workbook{

        for(const cell of sh.cells.values()){ cell._st=0; cell.link=undefined; }

function getVal(sh,r,c){
  const k=K(r,c); const cell=sh.cells.get(k);

    if(cell.v!==undefined && cell.v!==null) return cell.v;
  }
  if(sh.spillVal.has(k)) return sh.spillVal.get(k);
  const o=sh.prevSpill.get(k);
  if(o!==undefined && !sh.spillOrigin.has(k)){ const oc=sh.cells.get(o); if(oc && oc.f!==undefined && oc._st!==1){ evalCell(sh,oc,KR(o),KC(o)); if(sh.spillVal.has(k)) return sh.spillVal.get(k); } }

function evalCell(sh,cell,r,c){

  let v;

  catch(e){ v = isErr(e) ? e : E.VALUE; if(!isErr(e)) console.warn('formula error', cell.f, e); }

function spill(sh,r,c,m){

  const ok=K(r,c);
  for(let i=0;i<R;i++) for(let j=0;j<C;j++){
    if(i===0&&j===0) continue;
    const k=K(r+i,c+j); const cell=sh.cells.get(k);
    if(cell && (cell.f!==undefined || (cell.v!=null && cell.v!==''))) return E.SPILL;
    const so=sh.spillOrigin.get(k); if(so!==undefined && so!==ok) return E.SPILL;

/* ---- crumbs: the workbook's tune (goatpad lineage) ---- */
function makeCrumbs(seed){
  const rnd=mulberry((seed>>>0)*2654435761+7);
  const BREAD=['\u{1F35E}','\u{1F956}','\u{1F950}','\u{1F968}','\u{1F96F}','\u{1F9C8}','\u{1F33E}'], GRID=['\u25A6','\u25A4','\u25A5','\u25A3','\u25A2','\u25AA','\u2550','\u2551','\u256C'],
    OPS=['\u03A3','\u00D7','\u00F7','=','+','%','\u221A','\u222B'], NOTE=['\u266A','\u266B','\u{1F340}'];
  let out='\uA7FB';
  const len=34+Math.floor(rnd()*26);
  for(let i=0;i<len;i++){ const r=rnd(); if(r<.16) out+=BREAD[Math.floor(rnd()*BREAD.length)]; else if(r<.52) out+=GRID[Math.floor(rnd()*GRID.length)]; else if(r<.84) out+=OPS[Math.floor(rnd()*OPS.length)]; else out+=NOTE[Math.floor(rnd()*NOTE.length)]; }
  return out;
}

function flashFill(){
  const sh=cur(); if(sh.protected){ toast('Sheet is protected'); return; } const r=sh.sel.ar, c=sh.sel.ac;
  const reg=currentRegion(sh,r,c); let exR=-1; for(let rr=reg.r1;rr<=reg.r2;rr++){ const v=getVal(sh,rr,c); if(typeof v==='string'&&v!==''){ exR=rr; break; } }
  if(exR<0||c===0){ toast('Type an example in this column first (with source data to the left)'); return; }
  const example=getVal(sh,exR,c); const srcCols=[]; for(let cc=reg.c1;cc<c;cc++) srcCols.push(cc);
  if(!srcCols.length){ toast('Flash fill needs data in the columns to the left'); return; }
  const srcs=srcCols.map(cc=>cellText(sh,exR,cc));
  const variants=(s)=>{ const out=[]; const push=(t,fn)=>{ if(t) out.push({t,fn}); }; push(s,x=>x); push(s.toUpperCase(),x=>x.toUpperCase()); push(s.toLowerCase(),x=>x.toLowerCase()); push(s? s[0].toUpperCase()+s.slice(1).toLowerCase():'',x=>x? x[0].toUpperCase()+x.slice(1).toLowerCase():''); push(s[0]||'',x=>x[0]||''); push((s[0]||'').toUpperCase(),x=>(x[0]||'').toUpperCase()); const words=s.split(/\s+/); words.forEach((w,i)=>{ if(words.length>1){ push(w,x=>(x.split(/\s+/)[i]||'')); push(w[0]||'',x=>((x.split(/\s+/)[i]||'')[0]||'')); } }); const at=s.indexOf('@'); if(at>0){ push(s.slice(0,at),x=>x.split('@')[0]); push(s.slice(at+1),x=>x.split('@')[1]||''); } const dot=s.lastIndexOf('.'); if(dot>0){ push(s.slice(0,dot),x=>x.slice(0,x.lastIndexOf('.')>0?x.lastIndexOf('.'):x.length)); push(s.slice(dot+1),x=>x.slice(x.lastIndexOf('.')+1)); } const digits=s.replace(/\D/g,''); if(digits&&digits!==s) push(digits,x=>x.replace(/\D/g,'')); return out; };
  const cands=[]; srcs.forEach((s,i)=>variants(s).forEach(v=>cands.push({i,t:v.t,fn:v.fn}))); cands.sort((a,b)=>b.t.length-a.t.length);
  const tpl=[]; let pos=0, lit=''; let used=0;
  while(pos<example.length){ let hit_=null; for(const cd of cands){ if(cd.t.length>=1&&example.startsWith(cd.t,pos)){ hit_=cd; break; } } if(hit_&&(hit_.t.length>1||/^[A-Za-z0-9]$/.test(hit_.t))){ if(lit){ tpl.push({lit}); lit=''; } tpl.push({i:hit_.i,fn:hit_.fn}); pos+=hit_.t.length; used+=hit_.t.length; } else { lit+=example[pos]; pos++; } }
  if(lit) tpl.push({lit});
  if(used<Math.max(1,example.length*0.4)){ toast('Could not find a pattern for "'+example+'"'); return; }
  pushUndo(); let n=0;
  for(let rr=reg.r1;rr<=reg.r2;rr++){ if(rr===exR) continue; if(!isEmptyCell(sh,rr,c)) continue; if(srcCols.every(cc=>isEmptyCell(sh,rr,cc))) continue; const row=srcCols.map(cc=>cellText(sh,rr,cc)); const out=tpl.map(t=> t.lit!==undefined? t.lit : t.fn(row[t.i])).join(''); setCellInput(sh,rr,c,out); n++; }
  recalcAll(); afterSelChange(); toast('Flash fill: '+n+' cells filled');
}

    let started = step>0; for(const [r,c] of list){ const k=K(r,c); if(!started){ if(sh===sh0&&((dir>0&&k>k0)||(dir<0&&k<k0))) started=true; else continue; } if(matchText(sh,r,c,o)!==null){ if(sh!==cur()) switchSheet(si); setSel(r,c,r,c); ensureVisible(r,c); return true; } }
    if(step===sheets.length){ /* wrapped fully: check cells before the start on the first sheet */ const l2=[...scanCells(sh0,o)]; if(dir<0) l2.reverse(); for(const [r,c] of l2){ const k=K(r,c); if((dir>0&&k>k0)||(dir<0&&k<k0)) break; if(matchText(sh0,r,c,o)!==null){ if(sh0!==cur()) switchSheet(WB.sheets.indexOf(sh0)); setSel(r,c,r,c); ensureVisible(r,c); return true; } } }
  }

function findAll(o,cap){ const out=[]; if(!o.t) return out; const sheets=o.wb?WB.sheets:[cur()]; for(const sh of sheets){ for(const [r,c] of scanCells(sh,o)){ const t=matchText(sh,r,c,o); if(t!==null){ out.push({sheet:sh.name,r,c,text:t}); if(out.length>=cap) return out; } } } return out; }

function replaceOne(o){ const sh=cur(); if(sh.protected){ toast('Sheet is protected'); return; } const r=sh.sel.ar,c=sh.sel.ac; const t=matchText(sh,r,c,o); if(t!==null){ pushUndo(); if(o.look==='n'){ sh.ensure(r,c).note=replaceIn(t,o); } else setCellInput(sh,r,c,replaceIn(t,o)); recalcAll(); } findNext(o,1); }

async function errorCheck(){

  if(!found.length){ info('No errors found on this sheet.','Error Checking'); return; }
  const v=await dialog({title:'Error Checking — '+found.length+' issue'+(found.length===1?'':'s'),width:'600px',html:'<table class="tbl" style="width:100%"><tr><th></th><th>Cell</th><th>Problem</th><th>Contents</th></tr>'+found.slice(0,500).map((x,i)=>'<tr><td><input type="radio" name="ecSel" value="'+i+'"'+(i===0?' checked':'')+'></td><td>'+addr(x.r,x.c)+'</td><td>'+esc(x.kind)+'</td><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis">'+esc(x.detail)+'</td></tr>').join('')+'</table><div class="hint" id="ecHelp">'+esc(found[0].help)+'</div>',

function scriptApi(log){
  const wrap=sh=>({ get name(){ return sh.name; },
    get(a){ const p=parseRef(a); if(!p) throw new Error('bad address '+a); if(p.r1===p.r2&&p.c1===p.c2){ const v=getVal(sh,p.r1,p.c1); return isErr(v)?v.code:v; } const out=[]; for(let r=p.r1;r<=Math.min(p.r2,p.r1+100000);r++){ const row=[]; for(let c=p.c1;c<=Math.min(p.c2,p.c1+1000);c++){ const v=getVal(sh,r,c); row.push(isErr(v)?v.code:v); } out.push(row); } return out; },
    set(a,v){ const p=parseRef(a); if(!p) throw new Error('bad address '+a); if(Array.isArray(v)){ v.forEach((row,i)=>{ (Array.isArray(row)?row:[row]).forEach((x,j)=>{ if(p.r1+i<MAXR&&p.c1+j<MAXC) setCellInput(sh,p.r1+i,p.c1+j,x==null?'':String(x)); }); }); } else { for(let r=p.r1;r<=Math.min(p.r2,p.r1+100000);r++) for(let c=p.c1;c<=Math.min(p.c2,p.c1+1000);c++) setCellInput(sh,r,c,v==null?'':String(v)); } },
    formula(a){ const p=parseRef(a); return p? cellInputText(sh,p.r1,p.c1) : ''; },
    text(a){ const p=parseRef(a); return p? cellText(sh,p.r1,p.c1) : ''; },
    style(a,st){ const p=parseRef(a); if(!p) return; for(let r=p.r1;r<=Math.min(p.r2,p.r1+100000);r++) for(let c=p.c1;c<=Math.min(p.c2,p.c1+1000);c++) patchStyle(sh,r,c,st); if((st.fs||st.wrap)&&sh===cur()) autofitRows(range(p.r1,Math.min(p.r2,p.r1+500))); sh.layoutDirty(); },
    clear(a){ const p=parseRef(a); if(!p) return; for(let r=p.r1;r<=Math.min(p.r2,p.r1+100000);r++) for(let c=p.c1;c<=Math.min(p.c2,p.c1+1000);c++) sh.cells.delete(K(r,c)); sh.touch(); },
    used(){ const u=sh.used(true); return u.r<0? null : {rows:u.r+1,cols:u.c+1,address:'A1:'+addr(u.r,u.c)}; },
    note(a,t){ const p=parseRef(a); if(!p) return; if(t===undefined){ const cell=sh.cell(p.r1,p.c1); return cell&&cell.note||''; } const cell=sh.ensure(p.r1,p.c1); if(t) cell.note=String(t); else delete cell.note; },
    colWidth(c,w){ const ci=typeof c==='number'?c:colIndex(String(c)); if(w===undefined) return colW(sh,ci); sh.colW[ci]=w; sh.layoutDirty(); },
    rowHeight(r,h){ if(h===undefined) return rowH(sh,r-1); sh.rowH[r-1]=h; sh.layoutDirty(); },
    freeze(rows,cols){ sh.freeze={r:rows|0,c:cols|0}; },
    merge(a){ const p=parseRef(a); if(!p) return; sh.merges.push({r1:p.r1,c1:p.c1,r2:p.r2,c2:p.c2}); sh.mergesDirty(); },
    get raw(){ return sh; } });
  const api={
    get active(){ return wrap(cur()); }, sheet(n){ const sh=WB.sheet(n); if(!sh) throw new Error('no sheet '+n); return wrap(sh); }, sheets(){ return WB.sheets.map(s=>s.name); },
    addSheet(n){ const sh=WB.add(n); return wrap(sh); }, get title(){ return WB.title; }, set title(t){ WB.title=String(t); },
    get selection(){ const s=norm(cur().sel); return {r1:s.r1+1,c1:s.c1+1,r2:s.r2+1,c2:s.c2+1,address:rangeAddr(s.r1,s.c1,s.r2,s.c2)}; }, select(a){ gotoText(a); },
    define(name,fn){ if(typeof fn!=='function') throw new Error('define(name, fn)'); USERFN[String(name).toUpperCase()]=fn; log('defined function '+String(name).toUpperCase()); },
    undefine(name){ delete USERFN[String(name).toUpperCase()]; },
    name(n,f){ if(f===undefined) return WB.names[n.toUpperCase()]&&WB.names[n.toUpperCase()].f; WB.names[n.toUpperCase()]={name:n,f:f[0]==='='?f:'='+f}; },
    eval(formula){ const ast=parseFormula(formula[0]==='='?formula:'='+formula); if(ast.t==='bad') throw new Error('bad formula'); let v; try{ v=finalize(evalNode(ast,{sh:cur(),r:0,c:0,wb:WB})); }catch(e){ if(isErr(e)) v=e; else throw e; } return isErr(v)?v.code:v; },
    recalc(){ WB.recalc(); }, log, toast, alert:(m)=>info(String(m),'Script'), prompt:(l,d)=>ask('Script',l,d), confirm:(m)=>confirmBox(String(m),'Script'),
    util:{ colName, colIndex, addr:(r,c)=>addr(r-1,c-1), serialToDate, dateToSerial, format:(v,code)=>formatValue(v,code).text, parse:(t)=>{ const p=parseInput(String(t)); return p?p.v:t; }, crumbs:makeCrumbs },
    fetchText:async(url)=>{ const r=await fetch(url); return r.text(); }, fetchJSON:async(url)=>{ const r=await fetch(url); return r.json(); },
    version:VER
  };
  return api;
}
async function runScript(code,log){
  const api=scriptApi(log||(()=>{}));
  pushUndo(true);
  try{ const fn=new Function('cb','cellbread','"use strict";\n'+code); const r=await fn(api,api); for(const sh of WB.sheets){ sh.touch(); sh.layoutDirty(); sh.mergesDirty(); } afterStructure(); return {ok:true,r}; }
  catch(e){ for(const sh of WB.sheets){ sh.touch(); sh.layoutDirty(); } afterStructure(); return {ok:false,err:e}; }
}
const SCRIPT_EXAMPLES=`// cellbread script — plain JavaScript with a small API named cb.
// Run: executes once. Custom functions defined with cb.define() stay available
// for formulas until the page reloads (save the script in the workbook to keep it).

// 1) a custom worksheet function: =DOUBLE(A1)
cb.define('DOUBLE', x => x * 2);

// 2) a function over a range: =RANGESUMSQ(A1:B9)  (ranges arrive as 2D arrays)
cb.define('RANGESUMSQ', m => (Array.isArray(m)? m.flat() : [m]).reduce((a,v)=> a + (typeof v==='number'? v*v : 0), 0));

// 3) read & write cells
const s = cb.active;                 // the current sheet (or cb.sheet('Sheet2'))
s.set('A1', 'Hello');                // text, numbers, or formulas as strings
s.set('A2:A4', '=ROW()*10');         // one value/formula to a whole range
s.set('C1', [[1,2,3],[4,5,6]]);      // 2D array → block
cb.log('B2 =', s.get('B2'), ' used range:', s.used());

// 4) style
s.style('A1', { b:true, bg:'#9fe6c0', fc:'#a34e0e' });

// cb.sheets(), cb.addSheet('Data'), cb.selection, cb.select('B3'), cb.eval('=SUM(1,2,3)'),
// cb.name('TaxRate','=0.2'), cb.alert(), cb.prompt(), cb.toast(), cb.util.format(45000,'d-mmm-yyyy')
`;

function applyVars(vars,link){
  const root=document.documentElement.style; for(const k in vars) root.setProperty(k,vars[k]);

  Object.assign(theme,{ sheetBg:vars['--sheetBg']||theme.sheetBg, grid:vars['--grid']||theme.grid, hdr:vars['--hdr']||theme.hdr, hdrText:vars['--hdrText']||theme.hdrText, hdrSel:vars['--hdrSel']||theme.hdrSel, hdrSelText:vars['--hdrSelText']||theme.hdrSelText, text:vars['--cellText']||theme.text, accent:acc, selFill:'rgba('+r+','+g+','+b+',.13)', border:vars['--border']||theme.border, win:vars['--win']||theme.win, link:link||theme.link });
