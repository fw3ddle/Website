<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--fg);
  font-family:var(--font-px);font-size:calc(11px * var(--scale));line-height:1.5;letter-spacing:var(--ls);font-weight:var(--fwt);font-style:var(--fit);
  -webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;touch-action:none;

button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{-webkit-user-select:text;user-select:text;touch-action:manipulation;-webkit-touch-callout:default}
button{cursor:pointer;background:none;border:0;padding:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--ink)}
::-webkit-scrollbar-track{background:var(--ink)}
.bevel{background:var(--pop-bg);border:1px solid var(--edge);border-radius:var(--r);
  box-shadow:inset 1px 1px 0 var(--line), inset -1px -1px 0 #000, 0 0 0 1px var(--ink3), 4px 4px 0 rgba(0,0,0,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;min-height:26px;border-radius:var(--r);
  background:var(--btn-bg);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--btn-hi),inset -1px -1px 0 #000;
  color:var(--btn-fg);font-family:var(--font-px);font-size:.9em}
.btn:active,.btn.on{box-shadow:inset -1px -1px 0 var(--line),inset 1px 1px 0 #000;background:var(--ink3)}
.btn.acc{color:var(--sky);background:var(--accent);box-shadow:inset 1px 1px 0 #fff8,inset -1px -1px 0 #0006}
.inp{background:var(--inp-bg);border:1px solid var(--inp-edge);box-shadow:inset 1px 1px 0 #000;color:var(--inp-fg);border-radius:var(--r);
  padding:6px 8px;font-family:var(--font-tt);font-size:17px;outline:0;min-height:28px;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--accent)}

.viewer video{max-width:100%;max-height:calc(100% - 40px);background:#000}
.viewer .vbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:6px 10px;background:#000c;color:#ccc;font-size:.8em}

.viewer{position:relative}

.viewer.player canvas.big{width:min(100%,640px);height:160px;image-rendering:pixelated;border:1px solid var(--line)}

.bbar .inp{flex:1;min-width:0}

#ctx{position:fixed;z-index:1500;min-width:180px;max-width:min(320px,calc(100vw - 16px));display:none;flex-direction:column;padding:4px;font-size:.9em;max-height:70vh;overflow:auto}
#ctx.open{display:flex}
#ctx .it{display:flex;align-items:center;gap:8px;padding:7px 10px;color:var(--fg);border-radius:var(--r);cursor:pointer}

.dict{flex:1;display:flex;flex-direction:column}

/* camera · dictate · fonts */

.cam2 .gridov{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent calc(33.3% - .5px),#fff5 calc(33.3% - .5px) calc(33.3% + .5px),transparent calc(33.3% + .5px) calc(66.6% - .5px),#fff5 calc(66.6% - .5px) calc(66.6% + .5px),transparent 0),linear-gradient(180deg,transparent calc(33.3% - .5px),#fff5 calc(33.3% - .5px) calc(33.3% + .5px),transparent calc(33.3% + .5px) calc(66.6% - .5px),#fff5 calc(66.6% - .5px) calc(66.6% + .5px),transparent 0)}

.cam2 .audiobox{position:absolute;right:6px;top:6px;width:min(230px,70%);background:#0b1220ee;border:1px solid #445;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;font-size:.8em}

.cam2 .zb{background:#222;border:0;color:#ccc;border-radius:50%;width:30px;height:30px;font-size:11px;cursor:pointer}

.cam2 .cammodes{flex:none;display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding:6px 40%;background:#000;justify-content:flex-start}

.cam2 .mb{background:transparent;border:0;color:#bbb;font-size:11px;letter-spacing:1px;white-space:nowrap;cursor:pointer;flex:none}

.cam2 .camshutter{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;padding:8px 30px calc(8px + var(--sab));background:#000}

.cam2 .thumb b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-shadow:0 0 4px #000}
.cam2 .shutter{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid #000;box-shadow:0 0 0 3px #fff;cursor:pointer;display:grid;place-items:center;padding:0}

.cam2 .lenses{position:absolute;left:0;right:0;bottom:6px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:0 6px;align-items:center}
.cam2 .lenses .btn{padding:2px 8px;min-height:22px;font-size:.75em;background:#000c;color:#fff;border-color:#555}
.cam2 .lenses .btn.on{border-color:var(--sun);color:var(--sun);box-shadow:0 0 9px -3px var(--sun)}
.cam2 .lenses .lhint{flex-basis:100%;text-align:center;color:#9ab;font-size:.7em;line-height:1.4;text-shadow:0 1px 2px #000}

.cam2 .camgear{position:absolute;right:6px;top:6px;bottom:6px;width:min(272px,86%);overflow:auto;background:#0b1220f2;border:1px solid #445;border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:6px;font-size:.8em;scrollbar-width:thin}
.cam2 .camgear h6{margin:4px 0 0;font-weight:400;font-size:.72em;letter-spacing:2px;color:#9ab}
.cam2 .camgear .btn{justify-content:center;padding:3px 6px;min-height:26px;font-size:.88em;background:#0000;color:#fff;border-color:#334}
.cam2 .camgear .btn.on{border-color:var(--sun);color:var(--sun)}
.cam2 .camgear .btn:disabled{opacity:.36;cursor:not-allowed}
.cam2 .camgear .fmts{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.cam2 .camgear .fmt{display:flex;flex-direction:column;gap:1px;line-height:1.15;padding:3px 4px}
.cam2 .camgear .fmt b{font-weight:400}
.cam2 .camgear .bdg{font-style:normal;font-size:.62em;letter-spacing:1px;color:#8aa}
.cam2 .camgear .b-native{color:#7fe3a0}
.cam2 .camgear .b-matroska{color:#7cf5ff}
.cam2 .camgear .b-wrapped{color:#ffd27c}

.cam2 .camgear .b-not{color:#e07a7a}
.cam2 .camgear .row3{display:flex;gap:4px}
.cam2 .camgear .row3>*{flex:1;min-width:0}
.cam2 .camgear .fmtnote{color:#9ab;font-size:.82em;line-height:1.35}
.cam2 .camgear .note{color:#7d8ea3;font-size:.78em;line-height:1.45;border-top:1px solid #243046;padding-top:6px;margin-top:2px}
.cam2 .camgear .tog{display:flex;gap:6px;align-items:center;color:#ddd}
.cam2 .tog.locked{opacity:.55}
.cam2 .camgear .num{background:#0b1220;color:#fff;border:1px solid #334;border-radius:6px;padding:3px 6px;width:100%;min-height:26px;font-size:.9em;font-family:var(--font-tt)}

<body>
<div id="app" class="body"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MERIDIAN NATIVE APP RUNTIME — the thin floor a Meridian app stands on when
   it lives in its own file. The OS frames the file (same origin, srcdoc), sends
   one OPEN message with what the app needs (the argument it was opened with,
   a snapshot of the virtual disk, the portal list, the downloads, the theme)
   and the app talks back over postMessage: save this photo, write this file,
   open that tile, I'm recording. Storage is shared (same IndexedDB, same
   localStorage) so nothing here is copied — only mirrored.
   ═══════════════════════════════════════════════════════════════════════════ */
'use strict';
const APP_ID='camera';
let M_VERSION='1.7.2', HOME='/home/felix', USER={uname:'felix',host:'meridian',name:'Felix'}, SITE='https://www.fweddle.com/';
const HOSTED=window.parent!==window;

/* ── the bridge ── */
const M=(()=>{ const q={}; let seq=0; const handlers={};
  const post=(action,data,transfer)=>{ if(!HOSTED)return; try{ parent.postMessage(Object.assign({meridian:true,native:true,app:APP_ID,action},data||{}),'*',transfer||[]); }catch(e){ console.warn('bridge',e); } };
  const call=(action,data,transfer)=>new Promise((res,rej)=>{ if(!HOSTED)return rej(new Error('not inside Meridian')); const rid=++seq; q[rid]={res,rej}; post(action,Object.assign({rid},data||{}),transfer); setTimeout(()=>{ if(q[rid]){ q[rid].rej(new Error('Meridian did not answer: '+action)); delete q[rid]; } },30000); });
  addEventListener('message',e=>{ const d=e.data; if(!d||!d.meridian)return;
    if(d.reply!==undefined){ const p=q[d.rid]; if(p){ delete q[d.rid]; d.error?p.rej(new Error(d.error)):p.res(d.result); } return; }
    if(d.theme){ applyTheme(d.theme); return; }
    (handlers[d.action]||[]).forEach(f=>{ try{ f(d); }catch(err){ console.error(err); } }); });
  const on=(a,f)=>{ (handlers[a]=handlers[a]||[]).push(f); };
  return {post,call,on,launch:(app,arg)=>post('launch',{app,payload:arg}),title:t=>post('title',{title:t}),toast:m=>post('toast',{msg:m}),close:()=>post('close'),split:()=>post('split')};
})();

/* ── theme: the OS pushes its palette; the same variable names the OS uses ── */
function applyTheme(t){ if(!t||!t.vars)return; const R=document.documentElement.style; Object.entries(t.vars).forEach(([k,v])=>{ if(v)R.setProperty('--'+k,v); });
  if(t.vars.fg2&&!t.vars.fg3)R.setProperty('--fg3',`color-mix(in srgb,${t.vars.fg2} 60%,${t.vars.sky||'#000'})`);
  if(t.vars.accent&&!t.vars.lime)R.setProperty('--lime',t.vars.accent); if(t.vars.accent&&!t.vars.particle)R.setProperty('--particle',t.vars.accent);
  if(t.font)R.setProperty('--font-px',t.font); }
const cssVar=(n)=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ── the little things every tile leans on ── */
const toast=(m)=>{ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); } t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2200); };
const notify=(title,body)=>toast(body?title+' · '+body:title);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const Audio=(()=>{ let ctx; return { blip(f,d){ try{ if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(),g=ctx.createGain(); o.type='square'; o.frequency.value=f||660; g.gain.value=.05; o.connect(g); g.connect(ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(d||.1)); o.stop(ctx.currentTime+(d||.1)+.02); }catch(e){} }, get vol(){ return .4; }, set(){} }; })();
const SFX={on:false,ui(){},set(){}};
const pickFile=(accept)=>new Promise(res=>{ let f=document.getElementById('filePick'); if(!f){ f=document.createElement('input'); f.type='file'; f.id='filePick'; f.hidden=true; document.body.appendChild(f); } f.accept=accept||''; f.value=''; f.onchange=()=>res(f.files[0]||null); f.click(); });
const Build={ dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); } };
const Resources={ fmt(n){ n=+n||0; return n>1073741824?(n/1073741824).toFixed(2)+' GB':n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024|0)+' KB':n+' B'; } };
const renderAll=()=>{}; const world=document.body;
/* IndexedDB blob store — the same database the OS uses (same origin) */
const Store=(()=>{ let dbp; const db=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('meridian',1);r.onupgradeneeded=()=>r.result.createObjectStore('apps');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=async(mode,fn)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('apps',mode);const rq=fn(t.objectStore('apps'));rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});};
  return {get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k)),keys:()=>tx('readonly',s=>s.getAllKeys())}; })();

/* ── the virtual disk, mirrored: reads come from the snapshot, writes go home ── */
const FS=(()=>{ let root={}; let meta={};
  const isDir=n=>!!n&&typeof n==='object';
  const norm=(cwd,p)=>{ if(!p)p='.'; if(p[0]==='~')p=HOME+p.slice(1); const parts=(p[0]==='/'?p:cwd+'/'+p).split('/'); const out=[]; for(const s of parts){ if(!s||s==='.')continue; if(s==='..')out.pop(); else out.push(s);} return '/'+out.join('/'); };
  const get=(path)=>{ let n=root; for(const s of String(path||'').split('/').filter(Boolean)){ if(n&&typeof n==='object'&&s in n)n=n[s]; else return undefined; } return n; };
  const parent=(path)=>{ const parts=path.split('/').filter(Boolean); const name=parts.pop(); return [get('/'+parts.join('/')),name]; };
  const bytes=n=>isDir(n)?Object.values(n).reduce((a,c)=>a+bytes(c),0):new TextEncoder().encode(String(n)).length;
  const home=()=>M.post('fs',{op:'sync'});
  return {norm,get,isDir,bytes, _load(r,m){ root=r||{}; meta=m||{}; },
    write(path,text){ const [p,n]=parent(path); if(!p||typeof p!=='object')return false; p[n]=String(text); meta[path]=Date.now(); M.post('fs',{op:'write',args:[path,String(text)]}); return true; },
    mtime(path){ return meta[path]||0; },
    put(path,node){ const [p,n]=parent(path); if(!p||typeof p!=='object')return false; p[n]=node; M.post('fs',{op:'put',args:[path,node]}); return true; },
    mkdir(path){ const [p,n]=parent(path); if(!p||typeof p!=='object'||n in p)return false; p[n]={}; M.post('fs',{op:'mkdir',args:[path]}); return true; },
    mkdirp(path){ const parts=path.split('/').filter(Boolean); let cur=''; for(const s of parts){ cur+='/'+s; const n=get(cur); if(n===undefined){ const [q,nm]=parent(cur); q[nm]={}; } else if(!isDir(n))return false; } M.post('fs',{op:'mkdirp',args:[path]}); return true; },
    rm(path){ const [p,n]=parent(path); if(!p||!(n in p))return false; delete p[n]; M.post('fs',{op:'rm',args:[path]}); return true; },
    rename(path,name){ const [p,n]=parent(path); if(!p||!(n in p)||!name||name.includes('/')||name in p)return false; p[name]=p[n]; delete p[n]; M.post('fs',{op:'rename',args:[path,name]}); return true; },
    unique(path){ const i=path.lastIndexOf('/'); const dir=path.slice(0,i),name=path.slice(i+1); const m=name.match(/^(.*?)(?: \((\d+)\))?(\.[^.]*)?$/); let k=(+m[2]||1)+1,c; do{ c=dir+'/'+m[1]+' ('+k+')'+(m[3]||''); k++; }while(get(c)!==undefined); return c; } };
})();

/* ── the portals' media, mirrored the same way ── */
let _images=[],_sounds=[],_downloads=[],_portals=[];
const Images={ all:()=>_images, async add(file,kind){ const it=await M.call('images-add',{file,kind}); if(it){ _images.push(it); } return it; }, get:id=>M.call('images-get',{id}), async remove(id){ await M.call('images-remove',{id}); _images=_images.filter(i=>i.id!==id); } };
const Videos={ async add(blob,meta){ const it=await M.call('videos-add',{blob,meta}); if(it)_images.push(it); return it; }, async url(id){ const b=await Store.get('vid:'+id); return b?URL.createObjectURL(b):null; }, remove:id=>M.call('videos-remove',{id}), addFile:f=>M.call('videos-addfile',{file:f}) };
const Sounds={ all:()=>_sounds, byId:id=>_sounds.find(x=>x.id===id), async addBlob(blob,name,sub,o){ const it=await M.call('sounds-add',{blob,name,sub,o:o||{}}); if(it)_sounds.push(it); return it; }, addFile:(f,sub)=>M.call('sounds-addfile',{file:f,sub}) };
const Downloads={ all:()=>_downloads, byId:id=>_downloads.find(x=>x.id===id), files:dir=>_downloads.filter(x=>(x.path||'')===(dir||'')), ext:n=>(String(n).split('.').pop()||'').toLowerCase(), async add(blob,name,dir,o){ const it=await M.call('downloads-add',{blob,name,dir:dir||'',o:o||{}}); if(it)_downloads.push(it); return it; }, async url(id){ const b=await Store.get('dl:'+id); return b?URL.createObjectURL(b):null; } };
const Portals={ all:()=>_portals, byId:id=>_portals.find(p=>p.id===id), dir:p=>p&&p.dir };

/* ── tiles: opening another app means asking the OS to ── */
const APPS=new Proxy({},{get:(t,k)=>typeof k==='string'?{id:k,name:k}:undefined,has:()=>true});
const deskStub={ open:(app,arg)=>M.launch(app&&app.id||String(app),arg), get grid(){ return document.body; } };
const WM={ open:(app,arg)=>M.launch(app&&app.id||String(app),arg), setTitle:(w,t)=>{ w.title=t; M.title(t); }, get active(){ return deskStub; }, allWins:()=>[window.__W].filter(Boolean), split:()=>M.split(), desks:[deskStub] };
const Nav={ go:()=>M.post('home') };
/* a context menu of our own — the OS's lives above us, we can't reach it */
function showCtx(x,y,items){ let m=document.getElementById('ctx'); if(!m){ m=document.createElement('div'); m.id='ctx'; m.className='bevel'; document.body.appendChild(m); document.addEventListener('pointerdown',e=>{ if(!m.contains(e.target))m.classList.remove('open'); },true); }
  m.innerHTML=''; items.forEach(it=>{ if(it==='-'){ const h=document.createElement('hr'); m.appendChild(h); return; } const d=document.createElement('div'); d.className='it'; d.innerHTML=`<span class="ic">${it.ico||''}</span><span>${esc(it.label||'')}${it.small?'<small>'+esc(it.small)+'</small>':''}</span>`; d.onclick=()=>{ m.classList.remove('open'); it.run&&it.run(); }; m.appendChild(d); });
  m.classList.add('open'); m.style.left=Math.max(4,Math.min(x,innerWidth-m.offsetWidth-4))+'px'; m.style.top=Math.max(4,Math.min(y,innerHeight-m.offsetHeight-4))+'px'; }
const closeOverlays=()=>{ const m=document.getElementById('ctx'); if(m)m.classList.remove('open'); };
const iconURL=()=>'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const appIcon=iconURL;

/* ── registration: the app file declares itself exactly as it did inside the OS ── */
const reg=a=>{ window.__APP=a; };

/* ── boot: say ready, wait for OPEN, mount ── */
(function(){
  let mounted=false;
  function mount(pay){ pay=pay||{}; if(pay.version)M_VERSION=pay.version; if(pay.home)HOME=pay.home; if(pay.user)USER=pay.user; if(pay.site)SITE=pay.site;
    FS._load(pay.fs,pay.fsmeta); _images=pay.images||[]; _sounds=pay.sounds||[]; _downloads=pay.downloads||[]; _portals=pay.portals||[]; if(pay.theme)applyTheme(pay.theme);
    const app=window.__APP; if(!app){ toast('this file registers no app'); return; }
    const w=window.__W={id:'w1',app,el:document.body,body:document.getElementById('app')||document.body,desk:deskStub,arg:pay.arg,title:app.name,close:()=>M.close(),clone:()=>M.split(),src:'local',get bar(){ return null; }};
    if(mounted){ if(app.reopen){ w.arg=pay.arg; app.reopen(w,pay.arg); } else { w.body.innerHTML=''; app.mount(w); } return; }
    mounted=true; document.title=app.name+' · Meridian'; app.mount(w); }
  M.on('open',d=>{ window.__PAY=d.payload; mount(d.payload); });
  M.on('reopen',d=>mount(Object.assign({},window.__PAY||{},{arg:d.payload&&d.payload.arg})));
  M.on('closing',()=>{ const w=window.__W; if(w&&w.app&&w.app.onClose)try{ w.app.onClose(w); }catch(e){} });
  window.addEventListener('DOMContentLoaded',()=>{ if(HOSTED){ M.post('ready'); setTimeout(()=>{ if(!mounted)mount({}); },4000); } else mount({}); });
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════════════════════════
   VideoFmt — what a clip is actually written as. MP4 by default; the gear offers the rest.

     NATIVE    the browser's own encoder writes this container, codecs and all.
     MATROSKA  WebM bytes. WebM *is* a Matroska profile, so a .mkv written this way is a
               real Matroska file — VLC, mpv and ffmpeg read it without a murmur.
     WRAPPED   recorded in the nearest container this browser can encode and written under
               this name. MOV and MP4 are both ISO base media, so the swap is honest.
     MERIDIAN  no browser encoder involved — Meridian writes the container itself, frame by
               frame. Motion-JPEG inside a real RIFF AVI, or a real GIF89a.
     NOT HERE  this browser has no encoder that can get there. The button says so.
   ══════════════════════════════════════════════════════════════════════════════ */
const VideoFmt=(()=>{
  const sup=m=>{ try{ return !!(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)); }catch(e){ return false; } };

  const WEBM=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(sup)||'';
  const OGG =['video/ogg;codecs=theora,vorbis','video/ogg'].find(sup)||'';
  const FAM={mp4:()=>MP4,webm:()=>WEBM,ogg:()=>OGG};

  const FMTS=[
    {id:'mp4', ext:'mp4', label:'MP4',  type:'video/mp4',        via:'mr',    want:'mp4',  blurb:'H.264 · the one every phone, editor and player takes'},
    {id:'mkv', ext:'mkv', label:'MKV',  type:'video/x-matroska', via:'mr',    want:'webm', blurb:'Matroska · WebM is a Matroska profile, so these bytes are a real .mkv'},
    {id:'mov', ext:'mov', label:'MOV',  type:'video/quicktime',  via:'mr',    want:'mp4',  blurb:'QuickTime · the same ISO base media as MP4, written under .mov'},
    {id:'webm',ext:'webm',label:'WEBM', type:'video/webm',       via:'mr',    want:'webm', blurb:'VP8 / VP9 · the browser\'s own container, smallest of the lot'},
    {id:'avi', ext:'avi', label:'AVI',  type:'video/x-msvideo',  via:'mjpeg', blurb:'Motion-JPEG in a RIFF container Meridian writes itself · big files, plays anywhere'},
    {id:'gif', ext:'gif', label:'GIF',  type:'image/gif',        via:'gif',   blurb:'GIF89a, encoded here frame by frame · silent, short, loops forever'},
    {id:'ogv', ext:'ogv', label:'OGV',  type:'video/ogg',        via:'mr',    want:'ogg',  blurb:'Ogg Theora · only where the browser still encodes it'},
  ];
  const byId=id=>FMTS.find(f=>f.id===id)||FMTS[0];
  function state(f){ f=typeof f==='string'?byId(f):f;
    if(f.via==='mjpeg'||f.via==='gif')return {ok:true,badge:'MERIDIAN',mime:'',silent:f.via==='gif'};
    const m=(FAM[f.want]||FAM.webm)(); if(!m)return {ok:false,badge:'NOT HERE',mime:''};
    const native=(f.id==='mp4'&&f.want==='mp4')||(f.id==='webm'&&f.want==='webm')||(f.id==='ogv'&&f.want==='ogg');
    return {ok:true,badge:native?'NATIVE':(f.id==='mkv'?'MATROSKA':'WRAPPED'),mime:m}; }

  const stamp=()=>Date.now().toString(36);

  /* ── RIFF / AVI writer — Motion-JPEG video, 16-bit PCM audio, proper idx1 ── */
  function buildAVI(jpegs,pcm,o){ const W=o.w,H=o.h,fps=Math.max(1,o.fps||15),sr=o.sampleRate|0,hasA=!!(pcm&&pcm.length&&sr);

    S('RIFF'); U(total); S('AVI ');
    S('LIST'); U(hdrl); S('hdrl');
      S('avih'); U(56); U(Math.round(1e6/fps)); U(Math.round(maxV*fps)); U(0); U(0x10|0x100); U(jpegs.length); U(0); U(hasA?2:1); U(maxV); U(W); U(H); U(0);U(0);U(0);U(0);
      S('LIST'); U(4+(8+56)+(8+40)); S('strl');
        S('strh'); U(56); S('vids'); S('MJPG'); U(0); H16(0); H16(0); U(0); U(scale); U(rate); U(0); U(jpegs.length); U(maxV); U(0xFFFFFFFF); U(0); I16(0);I16(0);I16(W);I16(H);
        S('strf'); U(40); U(40); U(W); U(H); H16(1); H16(24); S('MJPG'); U(W*H*3); U(0);U(0);U(0);U(0);
      if(hasA){ const ba=2,bps=sr*ba;
        S('LIST'); U(4+(8+56)+(8+18)); S('strl');
          S('strh'); U(56); S('auds'); U(1); U(0); H16(0); H16(0); U(0); U(ba); U(bps); U(0); U(pcm.length); U(bps>>2); U(0xFFFFFFFF); U(ba); I16(0);I16(0);I16(0);I16(0);
          S('strf'); U(18); H16(1); H16(1); U(sr); U(bps); H16(ba); H16(16); H16(0); }

    chunks.forEach(c=>{ const off=p-moviTop; S(c.id); U(c.data.length); u.set(c.data,p); p+=c.data.length; if(c.data.length&1){ v.setUint8(p,0); p++; } idx.push([c.id,c.data.length,off]); });
    S('idx1'); U(chunks.length*16); idx.forEach(a=>{ S(a[0]); U(a[0]==='00dc'?0x10:0); U(a[2]); U(a[1]); });
    return new Blob([buf.slice(0,p)],{type:'video/x-msvideo'}); }

  /* ── GIF89a writer — median-cut palette, 15-bit nearest cache, variable-width LZW ── */
  function medianCut(samples,n){ let boxes=[samples];
    const span=b=>{ const mn=[255,255,255],mx=[0,0,0]; for(const q of b)for(let c=0;c<3;c++){ if(q[c]<mn[c])mn[c]=q[c]; if(q[c]>mx[c])mx[c]=q[c]; } return [mn,mx]; };
    while(boxes.length<n){ let bi=-1,br=0;
      for(let i=0;i<boxes.length;i++){ if(boxes[i].length<2)continue; const mm=span(boxes[i]); const r=Math.max(mm[1][0]-mm[0][0],mm[1][1]-mm[0][1],mm[1][2]-mm[0][2])*Math.log(boxes[i].length+1); if(r>br){br=r;bi=i;} }
      if(bi<0||br<=0)break; const b=boxes[bi],mm=span(b); let ch=0; if(mm[1][1]-mm[0][1]>mm[1][ch]-mm[0][ch])ch=1; if(mm[1][2]-mm[0][2]>mm[1][ch]-mm[0][ch])ch=2;
      b.sort((x,y)=>x[ch]-y[ch]); const m=b.length>>1; boxes.splice(bi,1,b.slice(0,m),b.slice(m)); }
    return boxes.map(b=>{ let r=0,g=0,l=0; for(const q of b){r+=q[0];g+=q[1];l+=q[2];} const k=b.length||1; return [r/k|0,g/k|0,l/k|0]; }); }
  function lzw(ix,min,out){ const clear=1<<min,eoi=clear+1; let dict=new Map(),next=eoi+1,size=min+1,cur=0,bits=0; const bytes=[];
    const emit=c=>{ cur|=c<<bits; bits+=size; while(bits>=8){ bytes.push(cur&255); cur>>>=8; bits-=8; } };
    emit(clear); let prefix=ix[0];
    for(let i=1;i<ix.length;i++){ const k=ix[i],kk=prefix*512+k;
      if(dict.has(kk)){ prefix=dict.get(kk); continue; }
      emit(prefix);

    out.push(min); for(let i=0;i<bytes.length;i+=255){ const s=bytes.slice(i,i+255); out.push(s.length); for(let j=0;j<s.length;j++)out.push(s[j]); } out.push(0); }
  function buildGIF(frames,o){ const W=o.w,H=o.h,delay=Math.max(2,Math.round(100/Math.max(1,o.fps||12)));

    const nearest=(r,g,b)=>{ const key=(r>>3)<<10|(g>>3)<<5|(b>>3); const v=cache[key]; if(v>=0)return v; let best=0,bd=1e9;

    for(let i=0;i<palN;i++){ const c=pal[i]||[0,0,0]; out.push(c[0],c[1],c[2]); }

    frames.forEach(f=>{ out.push(0x21,0xF9,0x04,0x04); u16(delay); out.push(0,0);
      out.push(0x2C); u16(0); u16(0); u16(W); u16(H); out.push(0);

    out.push(0x3B); return new Blob([new Uint8Array(out)],{type:'image/gif'}); }

  /* ── one recorder interface over all of it ──
        make(canvas, audioTracks, {fmt,fps,bitrate,base}) → {start(), stop()→{blob,name,type,fmt,badge,note}} */
  function make(canvas,tracks,o){ o=o||{}; const asked=byId(o.fmt||'mp4'); const f=resolve(asked.id); const s=state(f);
    let note=f.id!==asked.id?asked.label+' needs an encoder this browser has not got — saved as '+f.label:'';
    if(f.via==='gif'&&tracks&&tracks.length)note='GIF carries no sound — the picture only';
    const base=(o.base||'clip')+'-'+stamp();
    const done=blob=>({blob,name:base+'.'+f.ext,type:f.type,fmt:f.id,badge:s.badge,note});
    if(f.via==='mr'){ const ms=new MediaStream([...canvas.captureStream(o.fps||30).getVideoTracks(),...(tracks||[])]); let rec=null,chunks=[];

        start(){ chunks=[]; rec=new MediaRecorder(ms,s.mime?{mimeType:s.mime,videoBitsPerSecond:o.bitrate||6e6}:undefined); rec.ondataavailable=e=>{ if(e.data.size)chunks.push(e.data); }; rec.start(250); },
        stop(){ return new Promise(res=>{ const out=()=>res(done(new Blob(chunks,{type:f.type}))); if(!rec)return out(); rec.onstop=out; try{ rec.stop(); }catch(e){ out(); } rec=null; }); } }; }
    /* Meridian's own containers: frames off the canvas on a clock */
    const gif=f.via==='gif'; const fps=gif?12:15; const cap=gif?480:960; const MAXF=gif?400:2400;
    const sc=document.createElement('canvas'),sg=sc.getContext('2d',{willReadFrequently:gif});
    let iv=null,jpegs=[],rgba=[],t0=0,pcm=[],sr=0,ac=null,node=null,srcNode=null,W=0,H=0,busy=false;
    function grab(){ const cw=canvas.width,ch=canvas.height; if(cw<2||ch<2)return; if((gif?rgba.length:jpegs.length)>=MAXF)return;

      if(gif){ sg.drawImage(canvas,0,0,W,H); rgba.push(sg.getImageData(0,0,W,H).data); return; }
      if(busy)return; busy=true; sg.drawImage(canvas,0,0,W,H); sc.toBlob(b=>{ busy=false; if(b)jpegs.push(b.arrayBuffer()); },'image/jpeg',.82); }
    return { fmt:f, badge:s.badge, note, meridian:true,
      start(){ jpegs=[]; rgba=[]; pcm=[]; W=0; t0=performance.now(); grab(); iv=setInterval(grab,1000/fps);
        if(!gif&&tracks&&tracks.length){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); sr=ac.sampleRate; srcNode=ac.createMediaStreamSource(new MediaStream(tracks)); node=ac.createScriptProcessor(4096,1,1);
          node.onaudioprocess=e=>{ const d=e.inputBuffer.getChannelData(0); for(let i=0;i<d.length;i++){ const x=d[i]<-1?-1:d[i]>1?1:d[i]; pcm.push(x<0?x*32768:x*32767); } };
          const mute=ac.createGain(); mute.gain.value=0; srcNode.connect(node); node.connect(mute); mute.connect(ac.destination); }catch(e){ sr=0; } } },
      async stop(){ clearInterval(iv); iv=null; const dur=Math.max(.3,(performance.now()-t0)/1000);
        if(node){ try{ node.disconnect(); srcNode.disconnect(); }catch(e){} node=null; } if(ac){ try{ await ac.close(); }catch(e){} ac=null; }
        let blob;
        if(gif){ const real=Math.max(1,Math.min(fps,rgba.length/dur)); blob=buildGIF(rgba,{w:W||2,h:H||2,fps:real}); }
        else { const bufs=await Promise.all(jpegs); const real=Math.max(1,Math.min(fps,bufs.length/dur)); blob=buildAVI(bufs.map(b=>new Uint8Array(b)),sr?new Int16Array(pcm):null,{w:W||2,h:H||2,fps:real,sampleRate:sr}); }
        pcm=[]; rgba=[]; jpegs=[]; return done(blob); } }; }

  return { list:()=>FMTS, byId, state, resolve, make, get has(){ return {mp4:!!MP4,webm:!!WEBM,ogg:!!OGG}; } }; })();

/* ══════════════════════════════════════════════════════════════════════════════
   Lens — the sensor heads. A phone camera hands over ordinary visible-light RGB, so each of
   these is a full per-pixel pipeline that turns that RGB into what the named sensor would
   have seen: a UV-pass filter's violet world with fluorescence blooming out of it, an 850 nm
   infrared conversion with the Wood effect on foliage, an image intensifier's auto-gained
   green phosphor with its tube vignette and grain, a thermal camera's auto-ranging ironbow
   with a temperature scale, and a spatial-audio radar driven by the live microphone.

   Everything runs on a capped work buffer (thermal deliberately lowest — real thermal
   sensors are coarse) and is drawn straight onto the output canvas, so whatever a lens does
   is in the photo, in the clip, and in the screen recording.
   ══════════════════════════════════════════════════════════════════════════════ */
const Lens=(()=>{
  const LENSES=[['off','NONE','the plain sensor'],['uv','UV','365 nm · fluorescence'],['ir','IR','850 nm pass'],['night','NIGHT','image intensifier'],['heat','HEAT','thermal · ironbow'],['sonar','3D SOUND','spatial audio radar']];
  const CAP={uv:900,ir:900,night:760,heat:360,sonar:1200};
  const work=document.createElement('canvas'),wg=work.getContext('2d',{willReadFrequently:true});
  const glow=document.createElement('canvas'),gl=glow.getContext('2d');
  const cl=x=>x<0?0:x>255?255:x;

  const IRON=(()=>{ const S=[[0,[0,0,10]],[.14,[24,0,74]],[.30,[104,0,112]],[.48,[186,28,56]],[.66,[238,96,10]],[.82,[255,178,22]],[.93,[255,240,148]],[1,[255,255,255]]]; const L=new Uint8Array(768);
    for(let i=0;i<256;i++){ const t=i/255; let a=S[0],b=S[S.length-1];
      for(let s=0;s<S.length-1;s++) if(t>=S[s][0]&&t<=S[s+1][0]){ a=S[s]; b=S[s+1]; break; }
      const k=(t-a[0])/Math.max(1e-6,b[0]-a[0]); for(let c=0;c<3;c++)L[i*3+c]=a[1][c]+(b[1][c]-a[1][c])*k; } return L; })();

  /* ── the microphone side of 3D SOUND ── */
  const Sound=(()=>{ let ac=null,stream=null,anL=null,anR=null,anM=null,dL,dR,fq,on=false,stereo=false,sweep=0; const trail=[];
    async function start(){ if(on)return true;
      try{ stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:2,echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); }catch(e){ return false; }
      try{ const s=stream.getAudioTracks()[0].getSettings?stream.getAudioTracks()[0].getSettings():{}; stereo=(s.channelCount||1)>1; }catch(e){ stereo=false; }
      ac=new (window.AudioContext||window.webkitAudioContext)(); const src=ac.createMediaStreamSource(stream); const sp=ac.createChannelSplitter(2);
      anL=ac.createAnalyser(); anR=ac.createAnalyser(); anM=ac.createAnalyser(); anL.fftSize=1024; anR.fftSize=1024; anM.fftSize=2048; anM.smoothingTimeConstant=.72;
      try{ src.connect(sp); sp.connect(anL,0); sp.connect(anR,1); }catch(e){ src.connect(anL); src.connect(anR); }
      src.connect(anM); dL=new Uint8Array(anL.fftSize); dR=new Uint8Array(anR.fftSize); fq=new Uint8Array(anM.frequencyBinCount); on=true; trail.length=0; return true; }
    function stop(){ on=false; trail.length=0; if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } if(ac){ try{ ac.close(); }catch(e){} ac=null; } anL=anR=anM=null; }
    const rms=(an,buf)=>{ an.getByteTimeDomainData(buf); let s=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; s+=v*v; } return Math.sqrt(s/buf.length); };
    function read(){ sweep=(sweep+.022)%(Math.PI*2); if(!on)return {live:false,sweep};
      const l=rms(anL,dL),r=rms(anR,dR); const lvl=Math.max(l,r); anM.getByteFrequencyData(fq);
      let sum=0,wsum=0,peak=0,pi=0; for(let i=1;i<fq.length;i++){ const v=fq[i]; sum+=v; wsum+=v*i; if(v>peak){peak=v;pi=i;} }
      const nyq=(ac?ac.sampleRate:48000)/2; const hz=pi*nyq/fq.length; const centroid=sum>0?(wsum/sum)/fq.length:0;
      const bal=(r-l)/(r+l+1e-6);

      const el=Math.max(-1,Math.min(1,(centroid-.16)*3.2))*54;     /* bright = high and in front of you */
      const db=lvl>1e-5?20*Math.log10(lvl):-90;
      const bands=[]; const n=14; for(let b=0;b<n;b++){ const a=Math.floor(Math.pow(b/n,1.7)*fq.length),z=Math.max(a+1,Math.floor(Math.pow((b+1)/n,1.7)*fq.length)); let m=0; for(let i=a;i<z&&i<fq.length;i++)m=Math.max(m,fq[i]); bands.push(m/255); }
      if(lvl>.012){ trail.push({az,el,r:Math.max(.12,1-Math.min(1,lvl*4.2)),t:performance.now(),lvl}); if(trail.length>26)trail.shift(); }

    return { start,stop,read, get on(){return on;} }; })();

  /* ── auto-exposure / auto-range state, smoothed so the picture does not strobe ── */
  let gainS=2,loS=0,hiS=255;
  function sampleStats(d){ let sum=0,lo=255,hi=0,n=0; for(let i=0;i<d.length;i+=64){ const v=(d[i]*77+d[i+1]*151+d[i+2]*28)>>8; sum+=v; n++; if(v<lo)lo=v; if(v>hi)hi=v; } return {mean:n?sum/n:64,lo,hi}; }
  function bloom(g,W,H,amt,tint){ const w=Math.max(2,W>>2),h=Math.max(2,H>>2); if(glow.width!==w||glow.height!==h){glow.width=w;glow.height=h;}
    gl.clearRect(0,0,w,h); gl.filter='blur(3px) brightness(1.5)'; gl.drawImage(work,0,0,w,h); gl.filter='none';
    g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=amt; if(tint)g.filter=tint; g.drawImage(glow,0,0,W,H); g.restore(); }

  function apply(out,g,id,o){ o=o||{}; if(!id||id==='off')return; const W=out.width,H=out.height; if(W<4||H<4)return;
    if(id==='sonar'){ drawSonar(out,g,o); return; }
    const cap=CAP[id]||900; const k=Math.min(1,cap/W); const w=Math.max(4,Math.round(W*k)),h=Math.max(4,Math.round(H*k));
    if(work.width!==w||work.height!==h){work.width=w;work.height=h;}
    wg.filter=id==='heat'?'blur(1.2px)':'none'; wg.drawImage(out,0,0,w,h); wg.filter='none';
    const im=wg.getImageData(0,0,w,h),d=im.data; const S=sampleStats(d); let temp=null;

    { const bx=W-u*2.2,by=cy-R,bh=R*2; g.strokeStyle=C+'.4)'; g.lineWidth=1; g.strokeRect(bx,by,u*1.2,bh);

/* ── the picture-in-picture inset, shared by the Camera tile and the Recorder so a SCREEN + CAM
      clip looks the same in the preview as it does in the file ── */
function drawPipInset(g,W,H,v,b){ if(!v||!v.videoWidth)return; b=b||{}; const m=Math.min(W,H);
  const pw=Math.max(24,W*(b.size||.22)),ph=pw*v.videoHeight/v.videoWidth,pad=Math.max(6,m*.022),cn=b.corner||'br';
  const x=cn[1]==='l'?pad:W-pw-pad, y=cn[0]==='t'?pad:H-ph-pad, rr=Math.min(pw,ph)/2;
  g.save();
  if(b.shape==='circle'){ g.beginPath(); g.arc(x+pw/2,y+ph/2,rr,0,6.283); g.clip(); }
  if(b.mirror!==false){ g.translate(x+pw,y); g.scale(-1,1); g.drawImage(v,0,0,pw,ph); } else g.drawImage(v,x,y,pw,ph);
  g.restore();

/* ── Recorder — a screen, tile or screen+cam recording that outlives the Camera tile. The lens

  return { prepare,start,stop,release,setPip, get canvas(){return cv;}, get active(){return !!vrec;}, get prepared(){return prepared&&!!stream;}, get opts(){return opts;}, set(o){ Object.assign(opts,o); if(opts.mode==='both')opts.pip=true; } }; })();

M.on('stop-rec',()=>{ try{ Recorder.stop(); }catch(e){} });
