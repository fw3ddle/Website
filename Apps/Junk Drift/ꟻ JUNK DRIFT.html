function wpick(pool){let t=0;for(const p of pool)t+=p[1];let r=R()*t;for(const p of pool){r-=p[1];if(r<=0)return p[0];}return pool[0][0];}

function txtRaw(s,x,y,col,sc){cx.fillStyle=col;for(let i=0;i<s.length;i++){const g=FD[s[i]];if(!g)continue;for(let p=0;p<15;p++)if(g.charCodeAt(p)===49)cx.fillRect(x+i*4*sc+(p%3)*sc,y+((p/3)|0)*sc,sc,sc);}}

const ICON={},ICONR={};
for(const k in ICS){const [c,x]=mk(8,8);const [c2,x2]=mk(8,8);ICS[k].forEach((row,j)=>{for(let i=0;i<8;i++){const ch=row[i];if(ch&&ch!=='.'){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1);const hh=hsh(i*31+j*7+k.length*101);x2.fillStyle=hh<.35?'#8c5028':hh<.5?'#b8642c':PAL[ch];x2.fillRect(i,j,1,1);}}});ICON[k]=c;ICONR[k]=c2;}
const iconOf=it=>(it.rusty?ICONR:ICON)[it.t]||ICON.mystery;

let UID=1;
function rollToy(m){const ks=STATS.map(s=>s[0]);const o={};const n=(1+(R()<.4?1:0))*m;for(let i=0;i<n;i++){const k=pick(ks);o[k]=(o[k]||0)+Math.round(rf(-3,6.5)*10)/10;}return o;}
function newItem(t,o){const it=Object.assign({id:UID++,t,wear:0},o||{});if(JT[t].gamble&&!it.roll)it.roll=rollToy(t==='toymonster'?2:1);if(t==='mystery'&&!it.hid)it.hid=pick(MYST);return it;}
function itemName(it){return (it.rusty?'RUSTY ':'')+JT[it.t].n;}
function itemStats(it,zone){const d=JT[it.t];const base=it.roll||d.s;const cond=(1-it.wear*.5)*(it.rusty?.7:1);const af=zone?(d.aff[zone]!=null?d.aff[zone]:1):1;const o={};for(const k in base){let v=base[k];if(v>0)v*=cond*af*(zone==='deco'&&k==='sty'?1.5:1);o[k]=v;}return o;}

/* ---------- cart build ---------- */
const CELLS=[{z:'chassis'},{z:'chassis'},{z:'chassis'},{z:'wheels',w:'F'},{z:'wheels',w:'F'},{z:'wheels',w:'R'},{z:'wheels',w:'R'},{z:'aero'},{z:'aero'},{z:'engine'},{z:'engine'},{z:'deco'},{z:'deco'},{z:'deco'}];
const ZONES=[['chassis','CHASSIS',[0,1,2]],['wheels','WHEELS',[3,4,5,6]],['aero','AERO',[7,8]],['engine','ENGINE',[9,10]],['deco','DECO',[11,12,13]]];
const BASE={spd:10,acc:8,grp:6,bnc:4,aero:3,arm:2,stb:4,sty:0,chaos:0,mag:0};
function computeBuild(cells){
 const st=Object.assign({},BASE);let w=4;const cnt={},inZ={},flags={},quirks=[];
 cells.forEach((it,i)=>{if(!it)return;const z=CELLS[i].z;const s=itemStats(it,z);for(const k in s)st[k]+=s[k];w+=JT[it.t].w*(it.rusty?1.1:1);cnt[it.t]=(cnt[it.t]||0)+1;(inZ[z]=inZ[z]||{})[it.t]=(inZ[z][it.t]||0)+1;});
 const zc=(z,...ts)=>ts.reduce((a,t)=>a+((inZ[z]&&inZ[z][t])||0),0), c=(...ts)=>ts.reduce((a,t)=>a+(cnt[t]||0),0);
 const caps=c('cap')+c('crown')*2;
 if(caps>=2)st.aero+=.18*caps*caps;
 if(caps>=5){quirks.push(['BOTTLECAP WING','STACKED CAPS. HUGE LIFT, TRACTION GONE.']);flags.wing=1;st.grp-=caps*.6;}
 const spoons=c('spoon','fork','bentspoon'),springs=c('spring','coil','longspring','flatspring');
 if(spoons>=3&&springs>=1){quirks.push(['GRIPPY POGO','GRIPS TIGHT. BOUNCES ON EVERY BUMP.']);flags.pogo=1;}
 if(zc('aero','spoon','bentspoon','fork')){quirks.push(['SPOON SPOILER','A SPOON AS A WING. DOWNFORCE AT SPEED.']);flags.downforce=1;}
 const hub=t=>t&&['hubcap','discwheel','hubblade'].includes(t.t);
 if((hub(cells[3])&&hub(cells[4]))||(hub(cells[5])&&hub(cells[6]))){quirks.push(['DOUBLE-HUBBED','TWO HUBCAPS, ONE WHEEL. SPINS LIKE MAD.']);flags.dhub=1;st.sty+=3;st.stb-=1;}
 if(!cells[3]&&!cells[4]&&!cells[5]&&!cells[6]){quirks.push(['BARE AXLES','NO WHEEL JUNK. ALL SPARKS.']);st.grp-=3;flags.bare=1;}

 if(c('spork')){flags.spork=1;if(zc('engine','spork')){quirks.push(['SPORK-CENTERED','THE SPORK DRIVES. Z: SPORK PULSE.']);for(const k in st)if(k!=='chaos')st[k]+=1;}else quirks.push(['THE SPORK HUMS','Z WITH NO WEAPON: SPORK PULSE.']);}
 if(c('kettle')&&zc('engine','kettle')){quirks.push(['STEAM KETTLE','WHISTLES. BOOST PADS LAST LONGER.']);flags.steam=1;}
 if(c('rustknot')){quirks.push(['RUST KNOT','SOMETHING IS WRONG WITH THIS CART.']);flags.rust=1;}
 if(st.mag>=6){quirks.push(['MAGPIE','PULLS JUNK FROM A DISTANCE.']);}

function autoBuild(items,mode){
 const M=MODES[mode];const pairs=[];

function trackStep(c,dt,ctl){
 const F=frameAt(c.s);const cell=T.cells[T.cof[F.i]];
 const gT=-G3*F.t[1],gN=-G3*F.n[1],gB=-G3*F.b[1];
 const rough=cell.t==='junkyard';
 const top=c.top*(c.boost>0?1.35:1)*(rough?.86:1);
 let a=gT;if(ctl.thr>0&&c.v<top)a+=c.acc*ctl.thr;if(ctl.brk>0)a-=(16+c.grip)*ctl.brk*(c.v>=0?1:-1);if(c.v>top)a-=(c.v-top)*2;a-=c.v*.03;
 c.v+=a*dt;if(c.v<-8)c.v=-8;
 const Fn=c.v*c.v*F.kn-gN;let adh=G3*(.35+c.grip*.02)+(c.b.flags.downforce?Math.max(0,c.v)*.5:0);if(cell.t==='flip')adh=G3*2.6;if(cell.t==='loop')adh+=G3*.25;
 if(Fn<-adh&&c.v>3){toAir(c,F);return;}
 const slide=1/(1+c.grip*.12);
 c.vu+=(ctl.steer*c.steerA+(gB-c.v*c.v*F.kb)*slide)*dt;c.vu*=Math.exp(-(2+c.grip*.3)*dt);c.u+=c.vu*dt;
 const lim=F.w/2-.8;if(Math.abs(c.u)>lim){const sd=Math.sign(c.u);c.u=sd*lim;if(c.vu*sd>0){if(c.vu*sd>4&&c===player){sfx('land');}c.vu*=-.3;}c.v*=1-.6*dt;if(R()<.3&&c.v>8)part(vmad(c.pos,F.b,sd*.7),[rf(-2,2),rf(1,3),rf(-2,2)],pick(['#ffd23c','#ff8c28']),.25);}
 c.s+=c.v*dt;if(c.s<0){c.s=0;c.v=Math.max(c.v,0);}
 if(c.s>=T.len-1){const F2=frameAt(T.len-1.1);toAir(c,F2);return;}
 const i2=Math.floor(c.s/DS);if(T.gap[i2]){const F2=syncPose(c);toAir(c,F2);return;}
 const F2=syncPose(c);c.lastS=c.s;
 for(const pd of T.pads){if(c.s<pd.s0||c.s>pd.s1||c.u<pd.u0-.4||c.u>pd.u1+.4)continue;
  if(pd.k==='boost'){if(c.boost<.3&&c===player)sfx('boost');c.boost=c.b.flags.steam?1.6:1;c.v=Math.max(c.v,c.top*1.35);}
  else if(pd.k==='spring'&&c.v>8){pd.hidden=0;const v=c.v;c.v=v*.5;toAir(c,F2,vscl(F2.n,26));if(c===player){sfx('hop');toast('HIDDEN SPRING!','#3cdcf0');}return;}

 c.hopCd-=dt;
 if(ctl.hop&&c.hopCd<=0&&cell.t!=='flip'){c.hopCd=.3;toAir(c,F2,vscl(F2.n,c.hopV));if(c===player)sfx('hop');return;}

 if(c.b.flags.bare&&c.v>8&&R()<dt*30)part(c.pos,[rf(-2,2),rf(1,3),rf(-2,2)],pick(['#ffd23c','#ff8c28']),.25);

function airStep(c,dt,ctl){
 c.airT+=dt;c.vel[1]-=G3*(1-c.lift)*dt;
 if(ctl.steer)c.vel=vmad(c.vel,c.ar,ctl.steer*5*dt);

 else{const vd=vnorm(c.vel);const e=vdot(vcross(c.af,vd),c.ar);ang=clamp(e*2.2,-1.6,1.6)*dt;}

 // find nearest track sample near the last one
 let bi=-1,bd=1e9;const i0=Math.max(0,c.lastI-12),i1=Math.min(T.N-1,c.lastI+160);
 for(let i=i0;i<=i1;i+=2){const d=vsub(c.pos,T.P[i]);const dd=d[0]*d[0]+d[1]*d[1]+d[2]*d[2];if(dd<bd){bd=dd;bi=i;}}
 if(bi>=0){for(let i=Math.max(0,bi-2);i<=Math.min(T.N-1,bi+2);i++){const d=vsub(c.pos,T.P[i]);const dd=vdot(d,d);if(dd<bd){bd=dd;bi=i;}}
  const d=vsub(c.pos,T.P[bi]);const h=vdot(d,T.NN[bi]),u=vdot(d,T.BB[bi]),al=vdot(d,T.TT[bi]);
  const hw=T.Wd[bi]/2;if(bd<36&&!T.gap[bi]&&Math.abs(u)>hw-.8&&Math.abs(u)<hw+.4&&h<.7&&h>-.5){const vb=vdot(c.vel,T.BB[bi]);if(vb*u>0){c.vel=vmad(c.vel,T.BB[bi],-1.3*vb);c.pos=vmad(c.pos,T.BB[bi],-Math.sign(u)*.05);if(c===player)sfx('land');}}
  if(bd<36){if(!T.gap[bi]&&Math.abs(u)<hw+.3&&h<=.05&&h>-1.6&&c.prevH>-.05&&vdot(c.vel,T.NN[bi])<0&&c.airT>.03){land(c,bi,al,u);return;}c.prevH=h;}else c.prevH=1;
  c.lastI=bi;}
 if(c.pos[1]<.4||c.airT>7){c.rr=c.pos[1]<.4?'ground':'airtime';burst(c.pos,14,['#a8a4bc','#5c5874','#f4f0ff']);respawn(c);}
}
function land(c,i,al,u){
 c.s=clamp(i*DS+al,0,T.len-1.2);c.u=clamp(u,-(T.Wd[i]/2-.8),T.Wd[i]/2-.8);const F=frameAt(c.s);
 const vt=vdot(c.vel,F.t),vb=vdot(c.vel,F.b),vn=-vdot(c.vel,F.n);
 const ok=vdot(c.au,F.n)>Math.cos(c.tol)&&vdot(c.af,F.t)>0;const flips=Math.floor((Math.abs(c.airRot)+.8)/TAU);
 c.mode='track';c.v=vt;c.vu=vb*.4;c.airRot=0;syncPose(c);c.lastS=c.s;

  if(flips>0){c.boost=Math.max(c.boost,(.7+flips*.5)*(1+c.st.sty*.06));c.v=Math.max(c.v,c.top*(1.1+flips*.1));c.stunts+=flips;if(c===player){pop(cp,(flips>1?flips+'X ':'')+'FLIP! BOOST','#3cdcf0');sfx('boost');}}
  if(vn>6){burst(c.pos,4,['#a8a4bc','#5c5874'],3);if(c===player)sfx('land');}
  if(vn>11&&c.bounceK>.06&&T.cells[T.cof[i]].t!=='flip'){toAir(c,F,vscl(F.n,vn*c.bounceK));return;}
  if(vn>20&&c.basket.length>=c.cap-1)spill(c,'OVERFLOW!');
 }else{
  c.v=Math.max(0,vt)*.3;c.stun=.7;c.inv=.4;damage(c,8+vn*.5);burst(cp,14,['#ffd23c','#e8343c','#a8a4bc','#f4f0ff'],8);
  if(c.basket.length)spill(c,'WIPEOUT!');if(c===player){sfx('crash');pop(cp,'WIPEOUT','#e8343c');}
 }
}

/* ---------- weapons ---------- */
function fire(c){
 if(!c.weapon){if(c.b.flags.spork&&c.pulseCd<=0){c.pulseCd=9;sporkPulse(c);}return;}
 const w=c.weapon;c.weapon=null;
 if(w==='plasma'){projs.push({s:c.s+1.5,u:c.mode==='track'?c.u:0,v:Math.max(c.v,10)+30,owner:c,life:1.4});if(near(c))sfx('fire');}
 else if(w==='mine'){T.objs.push(Object.assign({k:'mine',owner:c,arm:.6},posOn(Math.max(0,c.s-2.5),c.mode==='track'?c.u:0,.25)));if(c===player)sfx('dump');}
 else if(w==='emp')emp(c,12);
}
function emp(c,r){const cp=center(c);for(let i=0;i<36;i++){const a=i/36*TAU;part(cp,[Math.cos(a)*r*2.5,rf(-1,1),Math.sin(a)*r*2.5],'#3cdcf0',.35,0,.15);}if(near(c))sfx('boom');
 for(const o of carts){if(o===c||o.finished)continue;if(vlen(vsub(o.pos,c.pos))<r&&o.inv<=0){o.v*=.5;o.vel=vscl(o.vel,.5);o.stun=.5;if(R()<.5)spill(o,'EMP!');if(o===player)toast('EMP HIT','#3cdcf0',1.2);}}}
function sporkPulse(c){emp(c,11);const cp=center(c);let n=0;for(const o of T.objs){if(o.k==='junk'&&!o.gone&&vlen(vsub(o.p,cp))<13&&c.basket.length<c.cap){take(c,o);n++;}}if(c===player){toast('SPORK PULSE · '+n+' PULLED','#ffd23c');sfx('hum');}}
function stow(c){if(!c.weapon||c.basket.length>=c.cap)return false;c.basket.push(newItem(c.weapon));if(c===player){pop(center(c),'STOWED '+JT[c.weapon].n,'#c83cdc');sfx('pick');}c.weapon=null;return true;}
function dump(c){if(!c.basket.length)return;const it=c.basket.pop();dropJunk(c,it,'DUMPED '+JT[it.t].n);if(c===player)sfx('dump');}
function take(c,o){o.gone=1;const it=o.item||newItem(o.t);c.basket.push(it);c.picked++;
 if(c===player){sfx('pick');const nm=o.own?'GOT YOUR '+JT[it.t].n+' BACK':o.ghost?'RUSTY '+JT[it.t].n:it.t==='mystery'?'MYSTERY ???':JT[it.t].gamble?'BROKEN TOY':JT[it.t].n;pop(o.p,'+'+nm,o.own?'#8ce83c':it.t==='spork'?'#ffd23c':'#f4f0ff');if(it.t==='spork')toast('...SOMETHING IN THE BASKET IS HUMMING.','#ffd23c',3);}
 if(o.own){S.lost=S.lost.filter(x=>x.id!==it.id);if(c!==player)toast(c.name+' SCOOPED YOUR '+JT[it.t].n+'!','#ff8c28');}}

/* ---------- AI ---------- */
function aiInput(c,dt){
 const inp={thr:1,brk:0,pit:0,hop:false,steer:0};
 if(c.mode==='air'){const F=frameAt(clamp(c.lastI*DS+Math.max(0,vdot(c.vel,c.af))*.35,0,T.len-1));if(c.trick&&c.vel[1]>4&&c.airT<.5){inp.pit=-1;}else{c.trick=0;const e=vdot(vcross(c.af,F.t),c.ar);inp.pit=Math.abs(e)<.05?0:clamp(-e*4,-1,1);}return inp;}
 c.trick=R()<c.skill*.15;
 let tu=c.lane;let best=99;const room=c.basket.length<c.cap;
 for(const o of T.objs){if(o.gone||o.s==null)continue;const ds=o.s-c.s;if(ds<1.5||ds>26)continue;
  const bad=o.k==='mine'||(o.k==='junk'&&(o.volatile||(o.dumped&&!room)));
  if(o.k==='junk'&&room&&!bad&&ds<best&&R()<.98){best=ds;tu=o.u;}
  if(o.k==='crate'&&!c.weapon&&ds<best){best=ds;tu=o.u;}}
 for(const pd of T.pads){const ds=pd.s0-c.s;if(ds<0||ds>18)continue;if(pd.k==='spike'){tu=pd.u0<0?2.2:-2.2;if(ds<3&&Math.abs(c.vu)<3&&R()<c.skill*.3)inp.hop=true;}if(pd.k==='boost')tu=clamp(tu,pd.u0+.5,pd.u1-.5);}
 for(const o of T.objs){if(o.k!=='mine'||o.gone)continue;const ds=o.s-c.s;if(ds>1&&ds<12&&Math.abs(o.u-c.u)<1.3)tu=o.u>0?o.u-2.2:o.u+2.2;}
 inp.steer=clamp((tu-c.u)*.9-c.vu*.35,-1,1);
 c.aiT-=dt;if(c.aiT<=0){c.aiT=rf(.4,.9);
  if(c.weapon){const ahead=carts.find(o=>o!==c&&o.s>c.s+2&&o.s<c.s+30);const behind=carts.find(o=>o!==c&&o.s<c.s&&o.s>c.s-18);const cl=carts.filter(o=>o!==c&&vlen(vsub(o.pos,c.pos))<11).length;
   if(c.weapon==='plasma'&&ahead)fire(c);else if(c.weapon==='mine'&&behind)fire(c);else if(c.weapon==='emp'&&cl>=1)fire(c);else if(R()<.15&&c.basket.length<c.cap-1)stow(c);}
  if(c.basket.length>=c.cap&&R()<.12)dump(c);
  if(c.s<(c.stallS||0)+2){c.stallT=(c.stallT||0)+1;if(c.stallT>6&&!c.finished){c.stallT=0;c.rr='stall';respawn(c);}}else{c.stallS=c.s;c.stallT=0;}
 }
 return inp;
}

/* ---------- race ---------- */
function aiCells(raceN){const n=clamp(6+raceN+ri(-1,2),5,13);const pool=SPAWN.junk.concat([['fork',.4],['discwheel',.3],['coil',.3],['plasma',.3],['rocketnub',.3],['gear',.3]]);const items=[];for(let i=0;i<n;i++)items.push(newItem(wpick(pool)));return autoBuild(items,ri(0,MODES.length-1)).cells;}
function startRace(){

 const unmapped=S.sporkWins>=2&&S.cells.some(it=>it&&it.t==='spork');
 if(T){freeM(T.mesh);freeM(T.padMesh);}
 genTrack(S.race,biome,unmapped);
 for(const c of carts)if(c!==titleDemo)freeM(c.mesh);carts=[];
 const riv=RIVALS.slice();for(let i=riv.length-1;i>0;i--){const j=ri(0,i);[riv[i],riv[j]]=[riv[j],riv[i]];}

 for(let i=0;i<3;i++){const r=riv[i];carts.push(makeCart({name:r.name,col:r.col,helm:r.helm,cells:aiCells(S.race),ai:true,skill:clamp(.45+S.race*.05+rf(-.1,.1),.3,.95),s:grid[i][0],u:grid[i][1],lane:rf(-1.2,1.2)}));}
 player=makeCart({name:'KESS',col:'#3cdcf0',helm:'#f4f0ff',cells:S.cells,ai:false,cap:S.cap,s:6.5,u:1.6});
 carts.push(player);for(const c of carts){syncPose(c);phys(c);}
 raceT=0;countdown=3.2;parts=[];pops=[];projs=[];toasts=[];raceOver=0;lastCell=-1;cellBanner=null;paused=false;endSeq=0;snapCam();
 state='race';
 if(unmapped)toast('AN UNMAPPED CELL WAITS AT THE END.','#f4f0ff',4);
}
function placeOrder(){return carts.slice().sort((a,b)=>{if(a.finished&&b.finished)return a.ftime-b.ftime;if(a.finished)return -1;if(b.finished)return 1;return b.lastS-a.lastS;});}
function playerInput(){
 const t=touchHeld();const air=player.mode==='air';
 const up=K.ArrowUp||K.KeyW,dn=K.ArrowDown||K.KeyS;if(!up)player.lockU=0;if(!dn)player.lockD=0;
 const steer=((K.ArrowRight||K.KeyD||t.right)?1:0)-((K.ArrowLeft||K.KeyA||t.left)?1:0);
 if(air)return {thr:0,brk:0,steer,hop:false,pit:((up&&!player.lockU)?1:0)-((dn&&!player.lockD)?1:0)+(t.dn?1:0)-(t.up?1:0)};
 return {thr:(up||t.gas)?1:0,brk:(dn||t.brk)?1:0,steer,hop:!!(K.Space||t.hop),pit:0};
}
function updateRace(dt){
 if(paused)return;
