<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--fg);
  font-family:var(--font-px);font-size:calc(11px * var(--scale));line-height:1.5;letter-spacing:var(--ls);font-weight:var(--fwt);font-style:var(--fit);
  -webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;touch-action:none;

button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{-webkit-user-select:text;user-select:text;touch-action:manipulation;-webkit-touch-callout:default}
button{cursor:pointer;background:none;border:0;padding:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--ink)}
::-webkit-scrollbar-track{background:var(--ink)}
.bevel{background:var(--pop-bg);border:1px solid var(--edge);border-radius:var(--r);
  box-shadow:inset 1px 1px 0 var(--line), inset -1px -1px 0 #000, 0 0 0 1px var(--ink3), 4px 4px 0 rgba(0,0,0,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;min-height:26px;border-radius:var(--r);
  background:var(--btn-bg);border:1px solid #000;box-shadow:inset 1px 1px 0 var(--btn-hi),inset -1px -1px 0 #000;
  color:var(--btn-fg);font-family:var(--font-px);font-size:.9em}
.btn:active,.btn.on{box-shadow:inset -1px -1px 0 var(--line),inset 1px 1px 0 #000;background:var(--ink3)}
.btn.acc{color:var(--sky);background:var(--accent);box-shadow:inset 1px 1px 0 #fff8,inset -1px -1px 0 #0006}
.inp{background:var(--inp-bg);border:1px solid var(--inp-edge);box-shadow:inset 1px 1px 0 #000;color:var(--inp-fg);border-radius:var(--r);
  padding:6px 8px;font-family:var(--font-tt);font-size:17px;outline:0;min-height:28px;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--accent)}

.viewer video{max-width:100%;max-height:calc(100% - 40px);background:#000}
.viewer .vbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:6px 10px;background:#000c;color:#ccc;font-size:.8em}

.viewer{position:relative}

.viewer.player canvas.big{width:min(100%,640px);height:160px;image-rendering:pixelated;border:1px solid var(--line)}

.bbar .inp{flex:1;min-width:0}

.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

#ctx{position:fixed;z-index:1500;min-width:180px;max-width:min(320px,calc(100vw - 16px));display:none;flex-direction:column;padding:4px;font-size:.9em;max-height:70vh;overflow:auto}
#ctx.open{display:flex}
#ctx .it{display:flex;align-items:center;gap:8px;padding:7px 10px;color:var(--fg);border-radius:var(--r);cursor:pointer}
#ctx .it:hover{background:var(--ink3);color:var(--accent)}
#ctx .it small{display:block;color:var(--fg3);font-size:.8em}
#ctx .ic{width:14px;text-align:center;color:var(--fg2)}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.dict{flex:1;display:flex;flex-direction:column}

.notes{flex:1;resize:none;border:0;outline:0;background:var(--n-bg);color:var(--n-fg);padding:12px;font-family:var(--font-tt);font-size:18px;line-height:1.25;-webkit-user-select:text;user-select:text}
.nbar{display:flex;gap:6px;padding:6px;border-top:1px solid #000;box-shadow:0 -1px 0 var(--line);align-items:center;font-size:8px;color:var(--fg3)}
</style>
</head>
<body>
<div id="app" class="body"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MERIDIAN NATIVE APP RUNTIME — the thin floor a Meridian app stands on when
   it lives in its own file. The OS frames the file (same origin, srcdoc), sends
   one OPEN message with what the app needs (the argument it was opened with,
   a snapshot of the virtual disk, the portal list, the downloads, the theme)
   and the app talks back over postMessage: save this photo, write this file,
   open that tile, I'm recording. Storage is shared (same IndexedDB, same
   localStorage) so nothing here is copied — only mirrored.
   ═══════════════════════════════════════════════════════════════════════════ */
'use strict';
const APP_ID='notes';
let M_VERSION='1.7.2', HOME='/home/felix', USER={uname:'felix',host:'meridian',name:'Felix'}, SITE='https://www.fweddle.com/';
const HOSTED=window.parent!==window;

/* ── the bridge ── */
const M=(()=>{ const q={}; let seq=0; const handlers={};
  const post=(action,data,transfer)=>{ if(!HOSTED)return; try{ parent.postMessage(Object.assign({meridian:true,native:true,app:APP_ID,action},data||{}),'*',transfer||[]); }catch(e){ console.warn('bridge',e); } };
  const call=(action,data,transfer)=>new Promise((res,rej)=>{ if(!HOSTED)return rej(new Error('not inside Meridian')); const rid=++seq; q[rid]={res,rej}; post(action,Object.assign({rid},data||{}),transfer); setTimeout(()=>{ if(q[rid]){ q[rid].rej(new Error('Meridian did not answer: '+action)); delete q[rid]; } },30000); });
  addEventListener('message',e=>{ const d=e.data; if(!d||!d.meridian)return;
    if(d.reply!==undefined){ const p=q[d.rid]; if(p){ delete q[d.rid]; d.error?p.rej(new Error(d.error)):p.res(d.result); } return; }
    if(d.theme){ applyTheme(d.theme); return; }
    (handlers[d.action]||[]).forEach(f=>{ try{ f(d); }catch(err){ console.error(err); } }); });
  const on=(a,f)=>{ (handlers[a]=handlers[a]||[]).push(f); };
  return {post,call,on,launch:(app,arg)=>post('launch',{app,payload:arg}),title:t=>post('title',{title:t}),toast:m=>post('toast',{msg:m}),close:()=>post('close'),split:()=>post('split')};
})();

/* ── theme: the OS pushes its palette; the same variable names the OS uses ── */
function applyTheme(t){ if(!t||!t.vars)return; const R=document.documentElement.style; Object.entries(t.vars).forEach(([k,v])=>{ if(v)R.setProperty('--'+k,v); });
  if(t.vars.fg2&&!t.vars.fg3)R.setProperty('--fg3',`color-mix(in srgb,${t.vars.fg2} 60%,${t.vars.sky||'#000'})`);
  if(t.vars.accent&&!t.vars.lime)R.setProperty('--lime',t.vars.accent); if(t.vars.accent&&!t.vars.particle)R.setProperty('--particle',t.vars.accent);
  if(t.font)R.setProperty('--font-px',t.font); }
const cssVar=(n)=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ── the little things every tile leans on ── */
const toast=(m)=>{ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); } t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2200); };
const notify=(title,body)=>toast(body?title+' · '+body:title);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const Audio=(()=>{ let ctx; return { blip(f,d){ try{ if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(),g=ctx.createGain(); o.type='square'; o.frequency.value=f||660; g.gain.value=.05; o.connect(g); g.connect(ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(d||.1)); o.stop(ctx.currentTime+(d||.1)+.02); }catch(e){} }, get vol(){ return .4; }, set(){} }; })();
const SFX={on:false,ui(){},set(){}};
const pickFile=(accept)=>new Promise(res=>{ let f=document.getElementById('filePick'); if(!f){ f=document.createElement('input'); f.type='file'; f.id='filePick'; f.hidden=true; document.body.appendChild(f); } f.accept=accept||''; f.value=''; f.onchange=()=>res(f.files[0]||null); f.click(); });
const Build={ dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); } };
const Resources={ fmt(n){ n=+n||0; return n>1073741824?(n/1073741824).toFixed(2)+' GB':n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024|0)+' KB':n+' B'; } };
const renderAll=()=>{}; const world=document.body;
/* IndexedDB blob store — the same database the OS uses (same origin) */
const Store=(()=>{ let dbp; const db=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('meridian',1);r.onupgradeneeded=()=>r.result.createObjectStore('apps');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=async(mode,fn)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('apps',mode);const rq=fn(t.objectStore('apps'));rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});};
  return {get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k)),keys:()=>tx('readonly',s=>s.getAllKeys())}; })();

/* ── the virtual disk, mirrored: reads come from the snapshot, writes go home ── */
const FS=(()=>{ let root={}; let meta={};
  const isDir=n=>!!n&&typeof n==='object';
  const norm=(cwd,p)=>{ if(!p)p='.'; if(p[0]==='~')p=HOME+p.slice(1); const parts=(p[0]==='/'?p:cwd+'/'+p).split('/'); const out=[]; for(const s of parts){ if(!s||s==='.')continue; if(s==='..')out.pop(); else out.push(s);} return '/'+out.join('/'); };
  const get=(path)=>{ let n=root; for(const s of String(path||'').split('/').filter(Boolean)){ if(n&&typeof n==='object'&&s in n)n=n[s]; else return undefined; } return n; };
  const parent=(path)=>{ const parts=path.split('/').filter(Boolean); const name=parts.pop(); return [get('/'+parts.join('/')),name]; };
  const bytes=n=>isDir(n)?Object.values(n).reduce((a,c)=>a+bytes(c),0):new TextEncoder().encode(String(n)).length;
  const home=()=>M.post('fs',{op:'sync'});
  return {norm,get,isDir,bytes, _load(r,m){ root=r||{}; meta=m||{}; },
    write(path,text){ const [p,n]=parent(path); if(!p||typeof p!=='object')return false; p[n]=String(text); meta[path]=Date.now(); M.post('fs',{op:'write',args:[path,String(text)]}); return true; },
    mtime(path){ return meta[path]||0; },
    put(path,node){ const [p,n]=parent(path); if(!p||typeof p!=='object')return false; p[n]=node; M.post('fs',{op:'put',args:[path,node]}); return true; },
    mkdir(path){ const [p,n]=parent(path); if(!p||typeof p!=='object'||n in p)return false; p[n]={}; M.post('fs',{op:'mkdir',args:[path]}); return true; },
    mkdirp(path){ const parts=path.split('/').filter(Boolean); let cur=''; for(const s of parts){ cur+='/'+s; const n=get(cur); if(n===undefined){ const [q,nm]=parent(cur); q[nm]={}; } else if(!isDir(n))return false; } M.post('fs',{op:'mkdirp',args:[path]}); return true; },
    rm(path){ const [p,n]=parent(path); if(!p||!(n in p))return false; delete p[n]; M.post('fs',{op:'rm',args:[path]}); return true; },
    rename(path,name){ const [p,n]=parent(path); if(!p||!(n in p)||!name||name.includes('/')||name in p)return false; p[name]=p[n]; delete p[n]; M.post('fs',{op:'rename',args:[path,name]}); return true; },
    unique(path){ const i=path.lastIndexOf('/'); const dir=path.slice(0,i),name=path.slice(i+1); const m=name.match(/^(.*?)(?: \((\d+)\))?(\.[^.]*)?$/); let k=(+m[2]||1)+1,c; do{ c=dir+'/'+m[1]+' ('+k+')'+(m[3]||''); k++; }while(get(c)!==undefined); return c; } };
})();

/* ── the portals' media, mirrored the same way ── */
let _images=[],_sounds=[],_downloads=[],_portals=[];
const Images={ all:()=>_images, async add(file,kind){ const it=await M.call('images-add',{file,kind}); if(it){ _images.push(it); } return it; }, get:id=>M.call('images-get',{id}), async remove(id){ await M.call('images-remove',{id}); _images=_images.filter(i=>i.id!==id); } };
const Videos={ async add(blob,meta){ const it=await M.call('videos-add',{blob,meta}); if(it)_images.push(it); return it; }, async url(id){ const b=await Store.get('vid:'+id); return b?URL.createObjectURL(b):null; }, remove:id=>M.call('videos-remove',{id}), addFile:f=>M.call('videos-addfile',{file:f}) };
const Sounds={ all:()=>_sounds, byId:id=>_sounds.find(x=>x.id===id), async addBlob(blob,name,sub,o){ const it=await M.call('sounds-add',{blob,name,sub,o:o||{}}); if(it)_sounds.push(it); return it; }, addFile:(f,sub)=>M.call('sounds-addfile',{file:f,sub}) };
const Downloads={ all:()=>_downloads, byId:id=>_downloads.find(x=>x.id===id), files:dir=>_downloads.filter(x=>(x.path||'')===(dir||'')), ext:n=>(String(n).split('.').pop()||'').toLowerCase(), async add(blob,name,dir,o){ const it=await M.call('downloads-add',{blob,name,dir:dir||'',o:o||{}}); if(it)_downloads.push(it); return it; }, async url(id){ const b=await Store.get('dl:'+id); return b?URL.createObjectURL(b):null; } };
const Portals={ all:()=>_portals, byId:id=>_portals.find(p=>p.id===id), dir:p=>p&&p.dir };

/* ── tiles: opening another app means asking the OS to ── */
const APPS=new Proxy({},{get:(t,k)=>typeof k==='string'?{id:k,name:k}:undefined,has:()=>true});
const deskStub={ open:(app,arg)=>M.launch(app&&app.id||String(app),arg), get grid(){ return document.body; } };
const WM={ open:(app,arg)=>M.launch(app&&app.id||String(app),arg), setTitle:(w,t)=>{ w.title=t; M.title(t); }, get active(){ return deskStub; }, allWins:()=>[window.__W].filter(Boolean), split:()=>M.split(), desks:[deskStub] };
const Nav={ go:()=>M.post('home') };
/* a context menu of our own — the OS's lives above us, we can't reach it */
function showCtx(x,y,items){ let m=document.getElementById('ctx'); if(!m){ m=document.createElement('div'); m.id='ctx'; m.className='bevel'; document.body.appendChild(m); document.addEventListener('pointerdown',e=>{ if(!m.contains(e.target))m.classList.remove('open'); },true); }
  m.innerHTML=''; items.forEach(it=>{ if(it==='-'){ const h=document.createElement('hr'); m.appendChild(h); return; } const d=document.createElement('div'); d.className='it'; d.innerHTML=`<span class="ic">${it.ico||''}</span><span>${esc(it.label||'')}${it.small?'<small>'+esc(it.small)+'</small>':''}</span>`; d.onclick=()=>{ m.classList.remove('open'); it.run&&it.run(); }; m.appendChild(d); });
  m.classList.add('open'); m.style.left=Math.max(4,Math.min(x,innerWidth-m.offsetWidth-4))+'px'; m.style.top=Math.max(4,Math.min(y,innerHeight-m.offsetHeight-4))+'px'; }
const closeOverlays=()=>{ const m=document.getElementById('ctx'); if(m)m.classList.remove('open'); };
const iconURL=()=>'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const appIcon=iconURL;

/* ── registration: the app file declares itself exactly as it did inside the OS ── */
const reg=a=>{ window.__APP=a; };

/* ── boot: say ready, wait for OPEN, mount ── */
(function(){
  let mounted=false;
  function mount(pay){ pay=pay||{}; if(pay.version)M_VERSION=pay.version; if(pay.home)HOME=pay.home; if(pay.user)USER=pay.user; if(pay.site)SITE=pay.site;
    FS._load(pay.fs,pay.fsmeta); _images=pay.images||[]; _sounds=pay.sounds||[]; _downloads=pay.downloads||[]; _portals=pay.portals||[]; if(pay.theme)applyTheme(pay.theme);
    const app=window.__APP; if(!app){ toast('this file registers no app'); return; }
    const w=window.__W={id:'w1',app,el:document.body,body:document.getElementById('app')||document.body,desk:deskStub,arg:pay.arg,title:app.name,close:()=>M.close(),clone:()=>M.split(),src:'local',get bar(){ return null; }};
    if(mounted){ if(app.reopen){ w.arg=pay.arg; app.reopen(w,pay.arg); } else { w.body.innerHTML=''; app.mount(w); } return; }
    mounted=true; document.title=app.name+' · Meridian'; app.mount(w); }
  M.on('open',d=>{ window.__PAY=d.payload; mount(d.payload); });
  M.on('reopen',d=>mount(Object.assign({},window.__PAY||{},{arg:d.payload&&d.payload.arg})));
  M.on('closing',()=>{ const w=window.__W; if(w&&w.app&&w.app.onClose)try{ w.app.onClose(w); }catch(e){} });
  window.addEventListener('DOMContentLoaded',()=>{ if(HOSTED){ M.post('ready'); setTimeout(()=>{ if(!mounted)mount({}); },4000); } else mount({}); });
})();

</script>
<script>
/* ── Notes ────────────────────────────────────────────────────── */
reg({id:'notes',name:'Notes',icon:'notes',w:480,h:380,single:true,
mount(w){
  const path=HOME+'/notes.txt';
  w.body.innerHTML=`<textarea class="notes" spellcheck="false" placeholder="type here. saved to ~/notes.txt — cat it from the terminal."></textarea><div class="nbar"><span class="st">~/notes.txt</span><span style="margin-left:auto" class="cnt"></span><button class="btn" data-a="dl">↓ .TXT</button></div>`;
  const ta=w.body.querySelector('textarea'),st=w.body.querySelector('.st'),cnt=w.body.querySelector('.cnt'); ta.value=FS.get(path)||''; let h;
  const upd=()=>{cnt.textContent=ta.value.length+' ch · '+(ta.value.split(/\s+/).filter(Boolean).length)+' w';};
  ta.oninput=()=>{st.textContent='~/notes.txt ·'; clearTimeout(h); h=setTimeout(()=>{FS.write(path,ta.value);st.textContent='~/notes.txt ✓';},400); upd();}; upd();
  w.body.querySelector('[data-a=dl]').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ta.value],{type:'text/plain'}));a.download='notes.txt';a.click();};
}});

</script>
</body>
</html>
