\u003c/div>\n          \u003cdiv class=\"gw\" id=\"gw\">\u003cdiv class=\"grid\" id=\"grid\">\u003c/div>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"flash\" id=\"flash\">\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"deck\">\n      \u003cdiv class=\"stick\" id=\"stick\" role=\"group\" aria-label=\"joystick\">\u003cdiv class=\"base\">\u003c/div>\u003cdiv class=\"shaft\">\u003cdiv class=\"ball\">\u003c/div>\u003c/div>\u003c/div>\n      \u003cspan class=\"sp\">\u003c/span>\n      \u003cdiv class=\"btns\">\n        \u003cbutton class=\"rb big\" id=\"go\" title=\"start\" aria-label=\"start\">▶\u003c/button>\n        \u003cbutton class=\"rb yel\" id=\"fold\" title=\"next folder\" aria-label=\"next folder\">\u003c/button>\n        \u003cbutton class=\"rb blu\" id=\"sync\" title=\"sync repo\" aria-label=\"sync repo\">⟳\u003c/button>\n        \u003cbutton class=\"rb grn\" data-fwx title=\"layout\">\u003c/button>\n        \u003cbutton class=\"rb wht\" id=\"snd\" title=\"sound\" aria-label=\"sound\">♪\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"door\">\u003cbutton class=\"slot\" id=\"coin1\" title=\"insert coin\" aria-label=\"insert coin\">\u003c/button>\u003cdiv class=\"grille\">\u003c/div>\u003cbutton class=\"slot\" id=\"coin2\" title=\"insert coin\" aria-label=\"insert coin\">\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cscript>/*@@CORE@@*/\u003c/script>\n\u003cscript>\n(async function () {\n  const $ = s => document.querySelector(s);\n  const esc = FW.esc;\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)');\n  FW.starfield($('#stars'), { density: 700, colors: ['#ffffff', '#ff6ad5', '#ffd36e', '#3fffb0', '#9fb8ff'], hold: false });\n\n  let ITEMS = [], CATS = [], sel = 0, credits = 0;\n  const short = t => String(t).split(/ — | - | inspired/i)[0].trim();\n\n  /* ---------- bulbs ---------- */\n  function bulbs() {\n    const n = Math.max(8, Math.floor($('.marquee').clientWidth / 22));\n    $('#bt').innerHTML = $('#bb').innerHTML = '\u003ci>\u003c/i>'.repeat(n);\n  }\n\n  /* ---------- sound: tiny square blips, silent until the first touch ---------- */\n  let AC = null, armed = false, mute = FW.ls('arcade.mute', '') === '1';\n  const arm = () => { armed = true; };\n  addEventListener('pointerdown', arm, { once: true }); addEventListener('keydown', arm, { once: true });\n  function blip(f, d, type) {\n    if (!armed || mute) return;\n    try {\n      AC = AC || new (window.AudioContext || window.webkitAudioContext)();\n      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;\n      o.type = type || 'square'; o.frequency.setValueAtTime(f, t);\n      if (type === 'coin') { o.type = 'square'; o.frequency.setValueAtTime(988, t); o.frequency.setValueAtTime(1319, t + .06); }\n      g.gain.setValueAtTime(.03, t); g.gain.exponentialRampToValueAtTime(.0001, t + (d || .05));\n      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + (d || .05) + .02);\n    } catch (e) { /* no audio */ }\n  }\n  function sndUI() { $('#snd').textContent = mute ? '♪̸' : '♪'; $('#snd').style.opacity = mute ? .55 : 1; }\n\n  /* ---------- screen ---------- */\n  function render() {\n    CATS = [...new Set(ITEMS.map(i => i.cat))].sort(FW.catSort);\n    ITEMS.sort((a, b) => FW.catSort(a.cat, b.cat) || a.order - b.order);\n    $('#tabs').innerHTML = CATS.map(c => '\u003cbutton class=\"tab\" data-c=\"' + esc(c) + '\" style=\"--th:' + FW.catMeta(c).hue + '\" title=\"' + esc(c) + '\">' + FW.iconSVG(c, 3) + '\u003c/button>').join('');\n    $('#grid').innerHTML = ITEMS.map((it, i) => '\u003cbutton class=\"cell\" data-i=\"' + i + '\" style=\"--ch:' + FW.catMeta(it.cat).hue + '\" title=\"' + esc(it.title) + '\" aria-label=\"' + esc(it.title) + '\">' +\n      '\u003cimg src=\"' + esc(FW.thumb(it)) + '\" data-sig=\"' + it.id + '\" alt=\"\" loading=\"lazy\" draggable=\"false\">\u003c/button>').join('') +\n      '\u003cdiv class=\"cur\" id=\"cur\">\u003ci>1P\u003c/i>\u003c/div>';\n    cols();\n    choose(Math.min(sel, ITEMS.length - 1), true);\n  }\n  function cols() {\n    const narrow = innerWidth \u003c= 640, n = ITEMS.length;\n    const c = narrow ? (n > 20 ? 5 : 4) : (n > 20 ? 6 : n > 12 ? 5 : 4);\n    $('#grid').style.setProperty('--cols', c);\n    return c;\n  }\n  function placeCursor() {\n    const cell = $('#grid').children[sel], cur = $('#cur');\n    if (!cell || !cur) return;\n    cur.style.width = cell.offsetWidth + 'px'; cur.style.height = cell.offsetHeight + 'px';\n    cur.style.transform = 'translate(' + cell.offsetLeft + 'px,' + cell.offsetTop + 'px)';\n  }\n  function stats(it) {\n    const h = FW.hashStr(it.id);\n    const rows = [['♥', '#ff3d6e', 4 + h % 7], ['★', '#ffd36e', 3 + (h >>> 5) % 8], ['⚡', '#3fffb0', 2 + (h >>> 10) % 9]];\n    return rows.map(r => '\u003cdiv class=\"st\" style=\"--c:' + r[1] + '\">\u003cspan>' + r[0] + '\u003c/span>\u003cb>' + Array.from({ length: 10 }, (_, k) => '\u003ci class=\"' + (k \u003c r[2] ? 'on' : '') + '\">\u003c/i>').join('') + '\u003c/b>\u003c/div>').join('');\n  }\n  function choose(i, quiet) {\n    if (!ITEMS.length) return;\n    sel = (i + ITEMS.length) % ITEMS.length;\n    const it = ITEMS[sel], hue = FW.catMeta(it.cat).hue;\n    document.documentElement.style.setProperty('--h', hue);\n    [...$('#grid').querySelectorAll('.cell')].forEach((c, k) => c.classList.toggle('on', k === sel));\n    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.c === it.cat));\n    const im = $('#pimg'); im.dataset.sig = it.id; delete im.dataset.fell; im.src = FW.thumb(it); im.alt = it.title;\n    $('#pbadge').innerHTML = FW.iconSVG(it.cat, 3);\n    $('#fold').innerHTML = FW.iconSVG(nextCat(it.cat), 2, '#000');\n    $('#pname').textContent = short(it.title);\n    $('#pframe').title = it.title;\n    $('#stats').innerHTML = stats(it);\n    if (!reduced.matches) { const f = $('#pframe'); f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop'); }\n    placeCursor();\n    const cell = $('#grid').children[sel];\n    if (cell && !quiet) cell.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n    if (!quiet) blip(440 + (sel % 6) * 60, .04);\n  }\n  const nextCat = c => CATS[(CATS.indexOf(c) + 1) % CATS.length];\n  function move(dx, dy) {\n    const c = cols(), n = ITEMS.length;\n    if (dy) { let j = sel + dy * c; if (j \u003c 0) j = Math.min(n - 1, (Math.ceil(n / c) - 1) * c + (sel % c)); else if (j >= n) j = sel % c; choose(j); }\n    else choose(sel + dx);\n    tilt(dx, dy);\n  }\n  function cycleFolder() {\n    const c = nextCat(ITEMS[sel].cat), j = ITEMS.findIndex(i => i.cat === c);\n    if (j >= 0) choose(j);\n    press($('#fold'));\n  }\n  function launch() {\n    const it = ITEMS[sel]; if (!it) return;\n    press($('#go'));\n    if (credits > 0) { credits--; coinsUI(); }\n    blip(523, .06); setTimeout(() => blip(784, .1), 70);\n    if (reduced.matches) { FW.openItem(it); return; }\n    const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');\n    setTimeout(() => FW.openItem(it), 240);\n  }\n  function press(b) { if (!b) return; b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 120); }\n\n  /* ---------- joystick ---------- */\n  const stick = $('#stick');\n  function tilt(dx, dy) {\n    if (reduced.matches) return;\n    stick.style.setProperty('--tx', (dx * 18) + 'deg');\n    stick.classList.toggle('y', !!dy); stick.style.setProperty('--sy', dy \u003c 0 ? 1.08 : dy > 0 ? .8 : 1);\n    clearTimeout(tilt.t); tilt.t = setTimeout(() => { stick.style.setProperty('--tx', '0deg'); stick.style.setProperty('--sy', 1); }, 140);\n  }\n  let drag = null;\n  stick.addEventListener('pointerdown', e => { stick.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, dir: null, t: 0 }; wake(); });\n  stick.addEventListener('pointermove', e => {\n    if (!drag) return;\n    const dx = e.clientX - drag.x, dy = e.clientY - drag.y, d = Math.hypot(dx, dy);\n    let dir = null;\n    if (d > 16) dir = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];\n    stick.style.setProperty('--tx', Math.max(-22, Math.min(22, dx * .6)) + 'deg');\n    const key = dir ? dir.join() : null;\n    if (key !== drag.dir) {\n      drag.dir = key; clearInterval(drag.t);\n      if (dir) { move(dir[0], dir[1]); drag.t = setInterval(() => move(dir[0], dir[1]), 210); }\n    }\n  });\n  const endDrag = () => { if (!drag) return; clearInterval(drag.t); drag = null; stick.style.setProperty('--tx', '0deg'); stick.style.setProperty('--sy', 1); };\n  stick.addEventListener('pointerup', endDrag); stick.addEventListener('pointercancel', endDrag);\n\n  /* ---------- coins ---------- */\n  function coinsUI() { $('#credits').innerHTML = Array.from({ length: 4 }, (_, k) => '\u003ci class=\"' + (k \u003c credits ? '' : 'off') + '\">\u003c/i>').join(''); }\n  function coin(b) { credits = Math.min(4, credits + 1); coinsUI(); blip(0, .16, 'coin'); b.classList.add('lit'); setTimeout(() => b.classList.remove('lit'), 260); wake(); }\n\n  /* ---------- attract mode: when idle, the cursor wanders by itself ---------- */\n  let idleT = 0, attract = 0;\n  function wake() { clearInterval(attract); attract = 0; clearTimeout(idleT); if (!reduced.matches) idleT = setTimeout(startAttract, 9000); }\n  function startAttract() {\n    attract = setInterval(() => {\n      const r = Math.random(), c = cols();\n      const j = r \u003c .25 ? sel + 1 : r \u003c .5 ? sel - 1 : r \u003c .75 ? sel + c : sel - c;\n      const was = armed; armed = false; choose(Math.max(0, Math.min(ITEMS.length - 1, j)), true); armed = was;\n      tilt(r \u003c .25 ? 1 : r \u003c .5 ? -1 : 0, r \u003c .5 ? 0 : r \u003c .75 ? 1 : -1);\n    }, 1300);\n  }\n  ['pointerdown', 'keydown', 'wheel'].forEach(ev => addEventListener(ev, wake, { passive: true }));\n\n  /* ---------- input ---------- */\n  $('#grid').addEventListener('click', e => {\n    const c = e.target.closest('.cell'); if (!c) return;\n    const i = +c.dataset.i;\n    if (i === sel) launch(); else choose(i);\n  });\n  $('#tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (!t) return; const j = ITEMS.findIndex(i => i.cat === t.dataset.c); if (j >= 0) choose(j); });\n  $('#pframe').addEventListener('click', launch);\n  $('#go').addEventListener('click', launch);\n  $('#fold').addEventListener('click', cycleFolder);\n  $('#snd').addEventListener('click', () => { mute = !mute; FW.lsSet('arcade.mute', mute ? '1' : ''); sndUI(); armed = true; blip(660, .05); });\n  $('#coin1').addEventListener('click', e => coin(e.currentTarget));\n  $('#coin2').addEventListener('click', e => coin(e.currentTarget));\n  $('#sync').addEventListener('click', async () => {\n    press($('#sync')); FW.lsSet('arcade.gh', '1');\n    ITEMS = await FW.all({ gh: true, force: true }); render();\n    FW.toast('⟳ ' + ITEMS.filter(i => i.cat === 'repo').length);\n  });\n  addEventListener('keydown', e => {\n    const a = document.activeElement;\n    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;\n    if (e.key === 'ArrowRight') { e.preventDefault(); move(1, 0); }\n    else if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1, 0); }\n    else if (e.key === 'ArrowDown') { e.preventDefault(); move(0, 1); }\n    else if (e.key === 'ArrowUp') { e.preventDefault(); move(0, -1); }\n    else if (e.key === 'Tab' && !e.shiftKey && !(a && a.closest && a.closest('.btns,.door'))) { e.preventDefault(); cycleFolder(); }\n    else if ((e.key === 'Enter' || e.key === ' ') && !(a && a.tagName === 'BUTTON')) { e.preventDefault(); launch(); }\n    else if (e.key === 'c' || e.key === '5') coin($('#coin1'));\n  });\n  let rt = 0;\n  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { bulbs(); cols(); placeCursor(); }, 80); });\n\n  bulbs(); sndUI(); coinsUI();\n  ITEMS = await FW.all({ gh: FW.ls('arcade.gh', '') === '1' });\n  render();\n  requestAnimationFrame(placeCursor);\n  wake();\n})();\n\u003c/script>\n"}, "garden": {"name": "Garden", "glyph": "✿", "pos": "bl", "html": "\u003cstyle>\n  /* EXPERIMENT 09 · GARDEN - solarpunk pixel orchard; every folder grows a tree, every app is a fruit.\n     The sky follows your real local time. */\n  :root{--fw-accent:#9cff7a}\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;overflow:hidden;background:#05051a;color:#fff;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}\n  #scroller{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:#ffffff33 #0000}\n  #stage{position:relative;height:100%}\n  #cv{display:block;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}\n  #cv.hot{cursor:pointer}\n  .sign{position:absolute;transform:translateX(-50%);padding:4px 7px;background:#3a2414;border:2px solid #1a0f08;box-shadow:inset 0 2px 0 #5c3b20,0 3px 0 #0007;line-height:0;pointer-events:none}\n  .sign::after{content:\"\";position:absolute;left:50%;top:100%;width:4px;height:14px;margin-left:-2px;background:#3a2414;border:1px solid #1a0f08;border-top:0}\n  header{position:fixed;left:14px;top:12px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 28px)}\n  .mark{font-weight:700;font-size:16px;padding:5px 10px;background:#0009;border:1px solid #ffffff33}\n  .gb{background:#0009;border:1px solid #ffffff33;color:#fff;font:inherit;padding:6px 10px;cursor:pointer}\n  .gb:hover{border-color:#9cff7a;color:#9cff7a}\n  header input{background-color:#0009;border:1px solid #ffffff33;color:#fff;font:inherit;--fws-min:32px;--fws-h:32px;--fws-w:min(200px,calc(100vw - 150px))}\n  header input:focus{border-color:#9cff7a}\n  .gb{min-width:32px;height:32px}\n  .gb[data-fwx]{font-size:15px;padding:0 8px}\n  .tip{position:fixed;z-index:6;pointer-events:none;display:none;background:#000d;border:1px solid #fff;padding:3px 8px;font-size:12px;white-space:nowrap}\n  .card{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);z-index:7;display:none;gap:12px;align-items:center;width:min(520px,calc(100% - 24px));background:#0c0a07ee;border:2px solid hsl(var(--h) 70% 55%);box-shadow:0 0 0 3px #000;padding:10px}\n  .card.on{display:flex}\n  .card img{width:86px;height:86px;object-fit:cover;flex:none;border:1px solid #000;background:#000}\n  .card>div{min-width:0;padding-right:20px}\n  .card b{display:block;font-size:16px;margin:2px 0 10px;overflow-wrap:anywhere}\n  .card a{background:hsl(var(--h) 80% 55%);color:#000;font-weight:700;padding:5px 12px;text-decoration:none;letter-spacing:.1em}\n  .card .x{position:absolute;top:4px;right:6px;background:none;border:0;color:#fff;font:inherit;cursor:pointer}\n\u003c/style>\n\u003cdiv id=\"scroller\">\u003cdiv id=\"stage\">\u003ccanvas id=\"cv\">\u003c/canvas>\u003c/div>\u003c/div>\n\u003cheader>\u003cdiv class=\"mark\">ꟻweddle.com\u003c/div>\u003cinput id=\"q\">\u003cbutton class=\"gb\" data-fwx title=\"layout\">\u003c/button>\u003cbutton class=\"gb\" id=\"sync\" title=\"sync repo\">⟳\u003c/button>\u003c/header>\n\u003cdiv class=\"tip\" id=\"tip\">\u003c/div>\n\u003cdiv class=\"card\" id=\"card\">\u003cbutton class=\"x\" id=\"cx\" aria-label=\"close\">✕\u003c/button>\u003cimg id=\"ci\" alt=\"\">\u003cdiv>\u003cb id=\"ct\">\u003c/b>\u003ca id=\"co\" target=\"_blank\" rel=\"noopener\" title=\"open\">↗\u003c/a>\u003c/div>\u003c/div>\n\u003cscript>/*@@CORE@@*/\u003c/script>\n\u003cscript>\n(async function () {\n  const $ = s => document.querySelector(s);\n  const cv = $('#cv'), ctx = cv.getContext('2d');\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)');\n  let S = 3, AW = 0, AH = 0, WW = 0;\n  let ITEMS = [], TREES = [], FRUIT = [], hover = null, sel = null, query = '';\n  const IMG = new Map();\n  let sky = null, phase = '';\n  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];\n\n  function getImg(it) {\n    let im = IMG.get(it.id);\n    if (!im) { im = new Image(); im.onerror = () => { im.onerror = null; im.src = FW.sigil(it.id); }; im.src = FW.thumb(it); IMG.set(it.id, im); }\n    return im;\n  }\n  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];\n  function skyPhase() {\n    const h = new Date().getHours() + new Date().getMinutes() / 60;\n    if (h \u003c 5 || h >= 21) return 'night';\n    if (h \u003c 7.5) return 'dawn';\n    if (h \u003c 17.5) return 'day';\n    return 'dusk';\n  }\n  const SKY = {\n    night: ['#04041a', '#0b0b2e', '#1d1446'], dawn: ['#1d1446', '#7a3f82', '#f39a62'],\n    day: ['#2f98c4', '#7fd1c7', '#f7e9b8'], dusk: ['#24163f', '#9c3f69', '#f7a24f']\n  };\n  const groundY = x => Math.round(AH * 0.86 + Math.sin(x * 0.021) * 3 + Math.sin(x * 0.0067 + 1.3) * 6);\n\n  /* static layer: dithered sky gradient, sun/moon, dithered hills */\n  function paintStatic() {\n    phase = skyPhase();\n    sky = document.createElement('canvas'); sky.width = WW; sky.height = AH;\n    const sc = sky.getContext('2d'), d = sc.createImageData(WW, AH), px = d.data;\n    const cols = SKY[phase].map(hex);\n    const night = phase === 'night';\n    for (let y = 0; y \u003c AH; y++) {\n      const t = y / AH, seg = t \u003c 0.5 ? 0 : 1, f = (t \u003c 0.5 ? t : t - 0.5) * 2;\n      for (let x = 0; x \u003c WW; x++) {\n        const thr = (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;\n        const c = f > thr ? cols[seg + 1] : cols[seg];\n        const gy = groundY(x);\n        const i = (y * WW + x) * 4;\n        if (y >= gy) {\n          const depth = y - gy;\n          const g = depth \u003c 2 ? (night ? [40, 90, 60] : [120, 210, 90]) : ((x + y) & 1) && depth \u003c 8 ? (night ? [22, 54, 40] : [70, 150, 70]) : (night ? [14, 26, 24] : [46, 92, 52]);\n          px[i] = g[0]; px[i + 1] = g[1]; px[i + 2] = g[2];\n        } else { px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2]; }\n        px[i + 3] = 255;\n      }\n    }\n    sc.putImageData(d, 0, 0);\n    // sun or moon on an arc across the sky by hour\n    const h = new Date().getHours() + new Date().getMinutes() / 60;\n    const k = night ? ((h + 24 - 21) % 24) / 8 : (h - 5) / 16;\n    const bx = Math.round(Math.min(AW, WW) * (0.1 + 0.8 * k)), by = Math.round(AH * 0.42 - Math.sin(k * Math.PI) * AH * 0.3);\n    const r = 7;\n    for (let y = -r; y \u003c= r; y++) for (let x = -r; x \u003c= r; x++) {\n      if (x * x + y * y > r * r) continue;\n      if (night && (x + 3) * (x + 3) + (y - 1) * (y - 1) \u003c r * r * 0.8) continue;\n      sc.fillStyle = night ? '#f2f0d8' : (x * x + y * y > r * r * 0.6 ? '#ffd36e' : '#fff3c2');\n      sc.fillRect(bx + x, by + y, 1, 1);\n    }\n  }\n\n  /* each folder grows its own seeded tree */\n  function grow(cat, n, small) {\n    const R = FW.rng(FW.hashStr(cat));\n    const depth = Math.max(2, Math.min(6, Math.ceil(Math.log2(Math.max(1, n))) + 1));\n    const len0 = AH * (small ? 0.09 : 0.14) * (0.85 + R() * 0.3);\n    const spread = 0.34 + R() * 0.24, ratio = 0.7 + R() * 0.08;\n    function node(d, len, ang) {\n      const nd = { len, ang, d, ph: R() * 6.28, kids: [], leaves: [] };\n      for (let i = 0; i \u003c 5; i++) nd.leaves.push([(R() - 0.5) * 7, (R() - 0.5) * 5, R()]);\n      if (d \u003c depth) {\n        nd.kids.push(node(d + 1, len * ratio * (0.85 + R() * 0.3), -spread * (0.7 + R() * 0.6)));\n        nd.kids.push(node(d + 1, len * ratio * (0.85 + R() * 0.3), spread * (0.7 + R() * 0.6)));\n      }\n      return nd;\n    }\n    return { root: node(0, len0, (R() - 0.5) * 0.12), depth };\n  }\n  function layout() {\n    const by = new Map();\n    ITEMS.forEach(it => { if (!by.has(it.cat)) by.set(it.cat, []); by.get(it.cat).push(it); });\n    const cats = [...by.keys()].sort(FW.catSort);\n    S = innerWidth \u003c 700 ? 2 : 3;\n    AW = Math.ceil(innerWidth / S); AH = Math.ceil(innerHeight / S);\n    WW = Math.max(AW, cats.length * 74 + 20);\n    cv.width = WW; cv.height = AH;\n    cv.style.width = WW * S + 'px';\n    $('#stage').style.width = WW * S + 'px';\n    ctx.imageSmoothingEnabled = false;\n    document.querySelectorAll('.sign').forEach(s => s.remove());\n    TREES = cats.map((c, i) => {\n      const M = Math.min(40, WW * 0.06), x = Math.round(M + (WW - 2 * M) * (i + 0.5) / cats.length);\n      const items = by.get(c).sort((a, b) => a.order - b.order);\n      const t = Object.assign(grow(c, items.length, false), { cat: c, x, y: groundY(x), items, hue: FW.catMeta(c).hue });\n      const sg = document.createElement('div');\n      sg.className = 'sign';\n      sg.innerHTML = FW.iconSVG(c, 2, 'hsl(' + t.hue + ',85%,72%)');\n      sg.title = c;\n      sg.style.left = x * S + 'px'; sg.style.top = (t.y + 4) * S + 'px';\n      $('#stage').appendChild(sg);\n      return t;\n    });\n    paintStatic();\n    seedMotes();\n  }\n\n  /* pixel line, thickness w */\n  function line(x0, y0, x1, y1, w, col) {\n    ctx.fillStyle = col;\n    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0;\n    for (let i = 0; i \u003c= n; i++) { const t = n ? i / n : 0; ctx.fillRect(Math.round(x0 + (x1 - x0) * t - w / 2), Math.round(y0 + (y1 - y0) * t - w / 2), w, w); }\n  }\n\n  let motes = [];\n  function seedMotes() { motes = []; for (let i = 0; i \u003c 60; i++) motes.push({ x: Math.random() * WW, y: Math.random() * AH * 0.85, ph: Math.random() * 6.28, sp: 0.3 + Math.random() }); }\n\n  let last = 0;\n  function frame(ts) {\n    requestAnimationFrame(frame);\n    if (ts - last \u003c 32) return;\n    const dt = Math.min(80, ts - last); last = ts;\n    if (skyPhase() !== phase) paintStatic();\n    ctx.drawImage(sky, 0, 0);\n    const night = phase === 'night';\n    const t = reduced.matches ? 0 : ts;\n    const wind = Math.sin(t * 0.0004) * 0.6 + Math.sin(t * 0.0011) * 0.3;\n    if (night) for (let i = 0; i \u003c 90; i++) {\n      const h = FW.hash32(i * 977 + 13);\n      const x = h % WW, y = (h >>> 10) % Math.floor(AH * 0.6);\n      if (Math.sin(t * 0.002 + i) > 0.2) { ctx.fillStyle = i % 7 ? '#ffffffaa' : '#9fb8ff'; ctx.fillRect(x, y, 1, 1); }\n    }\n    FRUIT = [];\n    TREES.forEach(tr => drawTree(tr, t, wind));\n    // drifting motes: fireflies at night, pollen by day\n    motes.forEach(m => {\n      if (!reduced.matches) { m.x += (wind * 0.25 + Math.sin(t * 0.001 + m.ph) * 0.1) * m.sp * dt / 16; m.y += Math.cos(t * 0.0013 + m.ph) * 0.08 * dt / 16; }\n      if (m.x \u003c 0) m.x += WW; if (m.x >= WW) m.x -= WW;\n      const on = night ? Math.sin(t * 0.004 * m.sp + m.ph) > 0.3 : true;\n      if (on) { ctx.fillStyle = night ? '#fff27a' : (m.ph > 3 ? '#ffffffcc' : '#ffb3d9cc'); ctx.fillRect(m.x | 0, m.y | 0, 1, 1); }\n    });\n    drawFruit(t);\n  }\n\n  function drawTree(tr, t, wind) {\n    const tips = [];\n    const leafHue = 95 + (tr.hue % 50);\n    (function walk(nd, x, y, a) {\n      const sway = (wind * 0.035 + Math.sin(t * 0.0021 + nd.ph) * 0.012) * nd.d;\n      const ang = a + nd.ang + sway;\n      const x2 = x + Math.sin(ang) * nd.len, y2 = y - Math.cos(ang) * nd.len;\n      const w = Math.max(1, tr.depth + 1 - nd.d - 2);\n      line(x, y, x2, y2, Math.min(4, w), 'hsl(' + (20 + (tr.hue % 20)) + ',35%,' + (18 + nd.d * 3) + '%)');\n      if (nd.d >= 2) nd.leaves.forEach(l => {\n        ctx.fillStyle = 'hsl(' + leafHue + ',' + (55 + l[2] * 25) + '%,' + (phase === 'night' ? 22 + l[2] * 10 : 34 + l[2] * 18) + '%)';\n        ctx.fillRect(Math.round(x2 + l[0]), Math.round(y2 + l[1]), 2, 2);\n      });\n      if (!nd.kids.length) tips.push([x2, y2]);\n      nd.kids.forEach(k => walk(k, x2, y2, ang));\n    })(tr.root, tr.x, tr.y, 0);\n    const n = tr.items.length;\n    tr.items.forEach((it, i) => {\n      const ti = n === 1 ? Math.floor(tips.length / 2) : Math.round(i * (tips.length - 1) / (n - 1));\n      const tip = tips[ti];\n      FRUIT.push({ it, x: tip[0], y: tip[1], hue: tr.hue });\n    });\n  }\n\n  function drawFruit(t) {\n    // the hovered/selected fruit is drawn last so it sits on top\n    const order = FRUIT.slice().sort((a, b) => (a.it === (hover && hover.it) || a.it === sel) - (b.it === (hover && hover.it) || b.it === sel));\n    order.forEach(f => {\n      const big = (hover && hover.it === f.it) || sel === f.it;\n      const F = big ? 19 : 13;\n      const x = Math.round(f.x - F / 2), y = Math.round(f.y + 3);\n      f.box = [x - 1, y - 1, F + 2, F + 2];\n      ctx.fillStyle = 'hsl(' + f.hue + ',35%,22%)'; ctx.fillRect(Math.round(f.x), Math.round(f.y), 1, 3);\n      const lit = query && match(f.it) && Math.sin(t * 0.008) > 0;\n      ctx.fillStyle = lit ? '#fff' : big ? '#fff' : 'hsl(' + f.hue + ',80%,' + '52%' + ')';\n      ctx.fillRect(x - 1, y - 1, F + 2, F + 2);\n      const im = getImg(f.it);\n      ctx.globalAlpha = query && !match(f.it) ? 0.3 : 1;\n      if (im.complete && im.naturalWidth) { try { ctx.drawImage(im, x, y, F, F); } catch (e) { /* broken */ } }\n      else { ctx.fillStyle = '#000'; ctx.fillRect(x, y, F, F); }\n      ctx.globalAlpha = 1;\n      ctx.fillStyle = '#ffffff66'; ctx.fillRect(x, y, 2, 1);\n    });\n  }\n\n  function hitAt(e) {\n    const r = cv.getBoundingClientRect();\n    const ax = (e.clientX - r.left) / S, ay = (e.clientY - r.top) / S;\n    for (let i = FRUIT.length - 1; i >= 0; i--) {\n      const b = FRUIT[i].box; if (!b) continue;\n      if (ax >= b[0] - 2 && ax \u003c= b[0] + b[2] + 2 && ay >= b[1] - 2 && ay \u003c= b[1] + b[3] + 2) return FRUIT[i];\n    }\n    return null;\n  }\n  cv.addEventListener('pointermove', e => {\n    const f = hitAt(e); hover = f; cv.classList.toggle('hot', !!f);\n    const tip = $('#tip');\n    if (f && e.pointerType === 'mouse') { tip.textContent = f.it.title; tip.style.display = 'block'; tip.style.left = Math.min(innerWidth - 200, e.clientX + 14) + 'px'; tip.style.top = (e.clientY - 30) + 'px'; }\n    else tip.style.display = 'none';\n  });\n  cv.addEventListener('pointerleave', () => { hover = null; $('#tip').style.display = 'none'; });\n  cv.addEventListener('click', e => { const f = hitAt(e); if (!f) { closeCard(); return; } if (sel === f.it) FW.openItem(f.it); else openCard(f.it); });\n\n  function openCard(it) {\n    sel = it;\n    const c = $('#card'); c.style.setProperty('--h', FW.catMeta(it.cat).hue);\n    const im = $('#ci'); im.dataset.sig = it.id; delete im.dataset.fell; im.src = FW.thumb(it);\n    $('#ct').textContent = it.title;\n    $('#co').href = it.link;\n    c.classList.add('on');\n  }\n  function closeCard() { sel = null; $('#card').classList.remove('on'); }\n  $('#cx').onclick = closeCard;\n  function match(it) { return (it.title + ' ' + it.cat + ' ' + it.tags.join(' ') + ' ' + it.desc).toLowerCase().includes(query); }\n  FW.search($('#q'), q => {\n    query = q.toLowerCase();\n    const f = query && FRUIT.find(q => match(q.it));\n    if (f) $('#scroller').scrollTo({ left: f.x * S - innerWidth / 2, behavior: reduced.matches ? 'auto' : 'smooth' });\n  });\n  $('#sync').onclick = async () => { FW.lsSet('garden.gh', '1'); ITEMS = await FW.all({ gh: true, force: true }); layout(); FW.toast('⟳ ' + ITEMS.filter(i => i.cat === 'repo').length); };\n  addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });\n  let rt = 0;\n  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 150); });\n\n  ITEMS = await FW.all({ gh: FW.ls('garden.gh', '') === '1' });\n  layout();\n  requestAnimationFrame(frame);\n})();\n\u003c/script>\n"}, "codex": {"name": "Codex", "glyph": "❦", "pos": "br", "html": "\u003cstyle>\n  /* EXPERIMENT 10 · CODEX - the site as an illuminated book: contents, chapters, plates, an index */\n  :root{--paper:#efe5cc;--paper2:#e4d7b6;--ink:#2a1d12;--ink2:#6b5538;--fw-accent:#efe5cc}\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font:15px/1.55 \"Iowan Old Style\",\"Palatino Linotype\",Palatino,Georgia,serif}\n  #stars{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}\n  .desk{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:44px 14px 54px}\n  .book{position:relative;width:min(1080px,100%);aspect-ratio:1.5;max-height:100%;display:flex;perspective:2400px;filter:drop-shadow(0 30px 40px #000)}\n  .pg{position:relative;flex:1;height:100%;background:var(--paper);overflow:hidden;padding:5.5% 7% 7%}\n  .pg.l{border-radius:6px 0 0 6px;background:linear-gradient(90deg,var(--paper2),var(--paper) 8%,var(--paper) 88%,#cdbd98)}\n  .pg.r{border-radius:0 6px 6px 0;background:linear-gradient(90deg,#cdbd98,var(--paper) 12%,var(--paper) 92%,var(--paper2))}\n  .pg::before{content:\"\";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% 20%,#ffffff22,#0000 60%),repeating-linear-gradient(0deg,#0000 0 3px,#00000006 3px 4px)}\n  .flip{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;z-index:5;transition:transform .75s cubic-bezier(.45,.05,.3,1)}\n  .flip .pg{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}\n  .flip .back{transform:rotateY(180deg)}\n  .book.single{aspect-ratio:.7;width:min(520px,100%)}\n  .single .pg.l{display:none}\n  .single .front .glyph{font-size:110px}\n  .single .pg.r{border-radius:6px}\n  .single .flip{width:100%}\n  .num{position:absolute;bottom:3.2%;left:0;right:0;text-align:center;font-size:12px;color:var(--ink2);letter-spacing:.2em}\n  .run{position:absolute;top:2.6%;left:7%;right:7%;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.3em;color:var(--ink2);border-bottom:1px solid #2a1d1233;padding-bottom:4px;min-height:22px}\n  h3{font-weight:normal;margin:0}\n  .front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%}\n  .front .glyph{font:900 min(16vw,150px)/1 ui-monospace,Menlo,monospace;color:#7a1f3d;text-shadow:3px 3px 0 #e0b04a}\n  .orn{letter-spacing:.6em;color:#7a1f3d;margin:14px 0 0;padding-left:.6em}\n  .toc{margin-top:9%}\n  .toc ol{list-style:none;padding:0;margin:0}\n  .toc li,.idx li{display:flex;gap:8px;align-items:center;cursor:pointer;padding:3px 0}\n  .toc li{padding:7px 0;font-size:1.05em}\n  .toc li:hover,.idx li:hover{color:#7a1f3d}\n  .toc li .dots,.idx li .dots{flex:1;border-bottom:1px dotted #2a1d1266;align-self:flex-end;margin-bottom:.45em;min-width:12px}\n  .toc li .rn{width:2.4em;color:#7a1f3d}\n  .toc li .ic{width:34px;display:flex;justify-content:center;color:hsl(var(--h) 55% 34%)}\n  .chap{display:flex;flex-direction:column;align-items:center;height:100%;padding-top:5%}\n  .illum{width:min(38%,170px);aspect-ratio:1;display:grid;place-items:center;background:hsl(var(--h) 55% 34%);border:4px double #e0b04a;box-shadow:inset 0 0 0 4px hsl(var(--h) 55% 24%),3px 3px 0 #2a1d1244;color:#f3d27a}\n  .illum svg{width:62%;height:auto}\n  .chap .rn{margin:4% 0 5%;color:#7a1f3d;letter-spacing:.3em;font-size:1.1em}\n  .thumbs{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--ts,58px),1fr));gap:8px}\n  .thumbs button{border:0;padding:0;background:none;cursor:pointer;font:inherit;color:var(--ink2);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}\n  .thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--ink);background:#000;display:block}\n  .thumbs button:hover img{outline:2px solid #7a1f3d}\n  .plate{display:flex;flex-direction:column;height:100%;padding-top:4%}\n  .frame{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4%;border:3px double var(--ink);background:#d9cba6;position:relative;container-type:size}\n  .frame img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(84cqw,84cqh);height:min(84cqw,84cqh);object-fit:cover;border:1px solid var(--ink);box-shadow:4px 4px 0 #2a1d1255;background:#000}\n  .frame::after{content:\"\";position:absolute;inset:6px;border:1px solid #2a1d1244;pointer-events:none}\n  .plate h3{text-align:center;font-size:clamp(15px,1.9vw,21px);margin:4% 0 2%;font-style:italic;line-height:1.25}\n  .plate .act{text-align:center;margin-bottom:5%}\n  .plate a{color:#7a1f3d;text-decoration:none;border:1px solid #7a1f3d66;padding:2px 10px;margin:0 3px}\n  .plate a:hover{background:#7a1f3d;color:var(--paper)}\n  .run .ic{color:var(--ink2);line-height:0}\n  .idx{columns:2;column-gap:2em;font-size:.86em;list-style:none;padding:0;margin:9% 0 0}\n  .idx li{break-inside:avoid}\n  .hud{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px;z-index:9;font:12px ui-monospace,Menlo,monospace}\n  .hud button{background:#0009;border:1px solid #ffffff33;color:#efe5cc;font:inherit;font-size:14px;padding:6px 11px;cursor:pointer;line-height:1}\n  .hud button:hover{border-color:#efe5cc}\n  .edge{position:absolute;top:0;bottom:0;width:4.5%;z-index:4;cursor:pointer}\n  .edge.l{left:0}.edge.r{right:0}\n  .edge:hover{background:linear-gradient(90deg,#0000,#2a1d1210)}\n  .edge.l:hover{background:linear-gradient(270deg,#0000,#2a1d1210)}\n\u003c/style>\n\u003ccanvas id=\"stars\" aria-hidden=\"true\">\u003c/canvas>\n\u003cdiv class=\"desk\">\u003cdiv class=\"book\" id=\"book\">\u003cdiv class=\"pg l\" id=\"L\">\u003c/div>\u003cdiv class=\"pg r\" id=\"R\">\u003c/div>\u003cdiv class=\"edge l\" id=\"eL\" title=\"previous\">\u003c/div>\u003cdiv class=\"edge r\" id=\"eR\" title=\"next\">\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"hud\">\u003cbutton id=\"prev\" title=\"previous\">◂\u003c/button>\u003cbutton id=\"toc\" title=\"contents\">☰\u003c/button>\u003cbutton id=\"ix\" title=\"index\">⁂\u003c/button>\u003cbutton id=\"next\" title=\"next\">▸\u003c/button>\u003cbutton data-fwx title=\"layout\">\u003c/button>\u003c/div>\n\u003cscript>/*@@CORE@@*/\u003c/script>\n\u003cscript>\n(async function () {\n  const $ = s => document.querySelector(s);\n  const esc = FW.esc;\n  FW.starfield($('#stars'), { density: 520, colors: ['#ffffff', '#ffe9b0', '#e0b04a', '#9fb8ff'], ignore: '.book,button' });\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)');\n  let ITEMS = [], PAGES = [], at = 0, busy = false;\n  const roman = n => { const m = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; };\n  const ROM = n => n >= 40 ? String(n) : roman(n);\n  const single = () => innerWidth \u003c 760;\n  const span = () => single() ? 1 : 2;\n\n  /* pages: frontispiece, contents, (illumination + one plate per entry) per folder, index */\n  const IDX_PER = 26;\n  function build() {\n    const by = new Map();\n    ITEMS.forEach(it => { if (!by.has(it.cat)) by.set(it.cat, []); by.get(it.cat).push(it); });\n    const cats = [...by.keys()].sort(FW.catSort);\n    PAGES = [];\n    const ref = new Map();\n    PAGES.push({ kind: 'front' }, { kind: 'toc' });\n    let plate = 0;\n    const chapters = cats.map((c, ci) => {\n      const ch = { c, ci, start: PAGES.length, items: by.get(c).sort((a, b) => a.order - b.order) };\n      PAGES.push({ kind: 'chap', ch });\n      ch.items.forEach(it => { plate++; ref.set(it.id, PAGES.length); PAGES.push({ kind: 'plate', it, n: plate, ch }); });\n      return ch;\n    });\n    if (PAGES.length % 2) PAGES.push({ kind: 'blank' });\n    const all = ITEMS.slice().sort((a, b) => a.title.localeCompare(b.title));\n    PAGES.indexAt = PAGES.length;\n    for (let i = 0; i \u003c all.length || i === 0; i += IDX_PER) PAGES.push({ kind: 'index', list: all.slice(i, i + IDX_PER) });\n    PAGES.push({ kind: 'blank', orn: true });\n    if (PAGES.length % 2) PAGES.push({ kind: 'blank', orn: true });\n    PAGES.chapters = chapters; PAGES.ref = ref;\n  }\n\n  function pageHTML(i) {\n    const p = PAGES[i];\n    if (!p) return '';\n    const num = i > 1 ? '\u003cdiv class=\"num\">' + (i - 1) + '\u003c/div>' : '';\n    const run = (a, b) => '\u003cdiv class=\"run\">\u003cspan>' + a + '\u003c/span>\u003cspan>' + b + '\u003c/span>\u003c/div>';\n    const ico = (c, px) => '\u003cspan class=\"ic\" title=\"' + esc(c) + '\">' + FW.iconSVG(c, px || 2) + '\u003c/span>';\n    if (p.kind === 'front') return '\u003cdiv class=\"front\">\u003cdiv class=\"glyph\">ꟻ\u003c/div>\u003cdiv class=\"orn\">✦ ✦ ✦\u003c/div>\u003c/div>';\n    if (p.kind === 'toc') return run('', 'ꟻ') + '\u003cdiv class=\"toc\">\u003col>' +\n      PAGES.chapters.map(ch => '\u003cli data-go=\"' + ch.start + '\" style=\"--h:' + FW.catMeta(ch.c).hue + '\" title=\"' + esc(ch.c) + '\">\u003cspan class=\"rn\">' + ROM(ch.ci + 1) + '.\u003c/span>' + ico(ch.c, 3) + '\u003cspan class=\"dots\">\u003c/span>' + (ch.start - 1) + '\u003c/li>').join('') +\n      '\u003cli data-go=\"' + PAGES.indexAt + '\" title=\"index\">\u003cspan class=\"rn\">\u003c/span>\u003cspan class=\"ic\">⁂\u003c/span>\u003cspan class=\"dots\">\u003c/span>' + (PAGES.indexAt - 1) + '\u003c/li>\u003c/ol>\u003c/div>' + num;\n    if (p.kind === 'chap') {\n      const n = p.ch.items.length, ts = n > 16 ? 34 : n > 8 ? 44 : 58;\n      return run(ROM(p.ch.ci + 1), '') + '\u003cdiv class=\"chap\" style=\"--h:' + FW.catMeta(p.ch.c).hue + '\">\u003cdiv class=\"illum\" title=\"' + esc(p.ch.c) + '\">' + FW.iconSVG(p.ch.c, 8) + '\u003c/div>' +\n        '\u003cdiv class=\"rn\">' + ROM(p.ch.ci + 1) + '\u003c/div>\u003cdiv class=\"thumbs\" style=\"--ts:' + ts + 'px\">' +\n        p.ch.items.map(it => '\u003cbutton data-go=\"' + PAGES.ref.get(it.id) + '\" title=\"' + esc(it.title) + '\">\u003cimg src=\"' + esc(FW.thumb(it)) + '\" data-sig=\"' + it.id + '\" alt=\"' + esc(it.title) + '\">' + (PAGES.ref.get(it.id) - 1) + '\u003c/button>').join('') +\n        '\u003c/div>\u003c/div>' + num;\n    }\n    if (p.kind === 'plate') {\n      const it = p.it;\n      return run(ico(p.ch.c), ROM(p.n)) + '\u003cdiv class=\"plate\">\u003cdiv class=\"frame\">\u003cimg src=\"' + esc(FW.thumb(it)) + '\" data-sig=\"' + it.id + '\" alt=\"' + esc(it.title) + '\">\u003c/div>' +\n        '\u003ch3>' + esc(it.title) + '\u003c/h3>\u003cdiv class=\"act\">\u003ca href=\"' + esc(it.link) + '\" target=\"_blank\" rel=\"noopener\" title=\"open\">↗\u003c/a>' + '\u003c/div>\u003c/div>' + num;\n    }\n    if (p.kind === 'index') {\n      return run('', '⁂') + '\u003cul class=\"idx\">' + p.list.map(it => '\u003cli data-go=\"' + PAGES.ref.get(it.id) + '\">' + esc(it.title) + '\u003cspan class=\"dots\">\u003c/span>' + (PAGES.ref.get(it.id) - 1) + '\u003c/li>').join('') + '\u003c/ul>' + num;\n    }\n    if (p.orn) return '\u003cdiv class=\"front\">\u003cdiv class=\"orn\">✦\u003c/div>\u003c/div>' + num;\n    return num;\n  }\n\n  function show() {\n    const s = span();\n    $('#book').classList.toggle('single', s === 1);\n    if (s === 2) { at -= at % 2; $('#L').innerHTML = pageHTML(at); $('#R').innerHTML = pageHTML(at + 1); }\n    else $('#R').innerHTML = pageHTML(at);\n  }\n\n  /* page turn: a two-faced leaf rotates over the spine */\n  function turn(to) {\n    const s = span();\n    to = Math.max(0, Math.min(PAGES.length - 1, to));\n    if (s === 2) to -= to % 2;\n    if (busy || to === at) return;\n    if (reduced.matches) { at = to; show(); return; }\n    busy = true;\n    const fwd = to > at, book = $('#book');\n    const f = document.createElement('div');\n    f.className = 'flip';\n    if (s === 2) {\n      f.style.left = fwd ? '50%' : '0';\n      f.style.transformOrigin = fwd ? 'left center' : 'right center';\n      f.innerHTML = '\u003cdiv class=\"pg ' + (fwd ? 'r' : 'l') + '\">' + (fwd ? $('#R').innerHTML : $('#L').innerHTML) + '\u003c/div>\u003cdiv class=\"pg back ' + (fwd ? 'l' : 'r') + '\">' + pageHTML(fwd ? to : to + 1) + '\u003c/div>';\n      if (fwd) $('#R').innerHTML = pageHTML(to + 1); else $('#L').innerHTML = pageHTML(to);\n    } else {\n      f.style.left = '0'; f.style.transformOrigin = 'left center';\n      f.innerHTML = '\u003cdiv class=\"pg r\">' + (fwd ? $('#R').innerHTML : pageHTML(to)) + '\u003c/div>\u003cdiv class=\"pg back r\">\u003c/div>';\n      if (fwd) $('#R').innerHTML = pageHTML(to);\n      else f.style.transform = 'rotateY(-180deg)';\n    }\n    book.appendChild(f);\n    requestAnimationFrame(() => requestAnimationFrame(() => {\n      if (s === 2) f.style.transform = fwd ? 'rotateY(-180deg)' : 'rotateY(180deg)';\n      else f.style.transform = fwd ? 'rotateY(-180deg)' : 'rotateY(0deg)';\n    }));\n    setTimeout(() => { at = to; f.remove(); show(); busy = false; }, 780);\n  }\n  const next = () => turn(at + span()), prev = () => turn(at - span());\n\n  $('#book').addEventListener('click', async e => {\n    const g = e.target.closest('[data-go]');\n    if (g) { turn(+g.dataset.go); return; }\n    if (e.target.id === 'eR') next();\n    if (e.target.id === 'eL') prev();\n  });\n  $('#next').onclick = next; $('#prev').onclick = prev;\n  $('#toc').onclick = () => turn(1);\n  $('#ix').onclick = () => turn(PAGES.indexAt);\n  addEventListener('keydown', e => {\n    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }\n    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }\n    else if (e.key === 'Home') turn(0); else if (e.key === 'End') turn(PAGES.length - 1);\n  });\n  let sx = null;\n  $('#book').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });\n  $('#book').addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) (dx \u003c 0 ? next : prev)(); sx = null; });\n  addEventListener('resize', show);\n\n  ITEMS = await FW.all({ gh: FW.ls('codex.gh', '') === '1' });\n  build(); show();\n})();\n\u003c/script>\n"}, "hive": {"name": "Hive", "glyph": "⬢", "pos": "br", "html": "\u003cstyle>\n  /* EXPERIMENT 11 · HIVE - a honeycomb spiralling out from ꟻ, with a 2D fisheye lens that follows you */\n  :root{--fw-accent:#ffd36e}\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}\n  #stars,#comb{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}\n  #field{position:fixed;inset:0;touch-action:none;cursor:crosshair;overflow:hidden}\n  #field.pan{cursor:grabbing}\n  .hx{position:absolute;left:0;top:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:hsl(var(--h) 75% 55%);will-change:transform;transform-origin:50% 50%;display:block;text-decoration:none}\n  .hx .in{position:absolute;inset:3px;clip-path:inherit;background:#000;overflow:hidden}\n  .hx img{width:100%;height:100%;object-fit:cover;display:block}\n  .hx.dim{opacity:.13}\n  .hx.core{background:#fff}\n  .hx.core .in{display:grid;place-items:center;font:900 28px ui-monospace,Menlo,monospace;color:#000;background:#ffd36e}\n  .bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;max-width:calc(100% - 128px);background:#05050ae8;border:1px solid hsl(var(--h,45) 80% 60%);padding:8px 14px;box-shadow:0 0 0 3px #000;pointer-events:none;white-space:nowrap}\n  .bar .k{color:hsl(var(--h,45) 90% 70%);line-height:0}\n  .bar b{font-size:14px;overflow:hidden;text-overflow:ellipsis;min-width:0}\n  .top{position:fixed;left:12px;top:12px;right:12px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}\n  .top>*{pointer-events:auto}\n  .mark{font-weight:700;font-size:15px;padding:5px 10px;background:#000c;border:1px solid #ffffff33}\n  .chip{background:#000c;border:1px solid hsl(var(--h) 80% 60% / .6);color:hsl(var(--h) 85% 68%);font:inherit;cursor:pointer;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);padding:6px 16px;line-height:0;min-height:30px}\n  .chip.sym{line-height:1;color:#fff}\n  .chip:hover{background:hsl(var(--h) 80% 55%);color:#000}\n  .top input{background-color:#000c;border:1px solid #ffffff33;color:#fff;font:inherit;--fws-min:30px;--fws-h:30px;--fws-w:min(190px,62vw)}\n  .top input:focus{border-color:#ffd36e}\n  .chip.sym{min-height:30px}\n\u003c/style>\n\u003ccanvas id=\"stars\" aria-hidden=\"true\">\u003c/canvas>\n\u003ccanvas id=\"comb\" aria-hidden=\"true\">\u003c/canvas>\n\u003cdiv id=\"field\">\u003c/div>\n\u003cdiv class=\"top\" id=\"top\">\u003c/div>\n\u003cdiv class=\"bar\" id=\"bar\">\u003cspan class=\"k\" id=\"bk\">\u003c/span>\u003cb id=\"bt\">\u003c/b>\u003c/div>\n\u003cscript>/*@@CORE@@*/\u003c/script>\n\u003cscript>\n(async function () {\n  const $ = s => document.querySelector(s);\n  const esc = FW.esc;\n  FW.starfield($('#stars'), { density: 700, colors: ['#ffffff', '#ffd36e', '#ffb000', '#9fb8ff'], hold: false });\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)');\n  const field = $('#field'), comb = $('#comb'), cctx = comb.getContext('2d');\n  const SQ3 = Math.sqrt(3);\n  let ITEMS = [], CELLS = [], R = 44, pan = { x: innerWidth / 2, y: innerHeight / 2 }, lens = { x: innerWidth / 2, y: innerHeight / 2 };\n  let query = '', idleT = -1e9, near = null;\n\n  /* axial hex spiral, ring by ring, outward from the centre */\n  function spiral(n) {\n    const D = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];\n    const out = [[0, 0]];\n    for (let k = 1; out.length \u003c n; k++) {\n      let q = D[4][0] * k, r = D[4][1] * k;\n      for (let i = 0; i \u003c 6; i++) for (let j = 0; j \u003c k; j++) { out.push([q, r]); q += D[i][0]; r += D[i][1]; }\n    }\n    return out.slice(0, n);\n  }\n  function build() {\n    const list = ITEMS.slice().sort((a, b) => FW.catSort(a.cat, b.cat) || a.order - b.order);\n    const pos = spiral(list.length + 1);\n    field.innerHTML = '';\n    CELLS = [{ core: true, q: 0, r: 0 }].concat(list.map((it, i) => ({ it, q: pos[i + 1][0], r: pos[i + 1][1] })));\n    CELLS.forEach(c => {\n      const a = document.createElement(c.core ? 'div' : 'a');\n      a.className = 'hx' + (c.core ? ' core' : '');\n      if (c.core) a.innerHTML = '\u003cdiv class=\"in\">ꟻ\u003c/div>';\n      else {\n        a.href = c.it.link; a.target = '_blank'; a.rel = 'noopener'; a.title = c.it.title;\n        a.style.setProperty('--h', FW.catMeta(c.it.cat).hue);\n        a.innerHTML = '\u003cdiv class=\"in\">\u003cimg src=\"' + esc(FW.thumb(c.it)) + '\" data-sig=\"' + c.it.id + '\" alt=\"' + esc(c.it.title) + '\" draggable=\"false\">\u003c/div>';\n      }\n      c.el = a;\n      field.appendChild(a);\n    });\n    const cats = [...new Set(list.map(i => i.cat))];\n    $('#top').innerHTML = '\u003cdiv class=\"mark\">ꟻweddle.com\u003c/div>' + cats.map(c => '\u003cbutton class=\"chip\" data-c=\"' + esc(c) + '\" title=\"' + esc(c) + '\" style=\"--h:' + FW.catMeta(c).hue + '\">' + FW.iconSVG(c, 2) + '\u003c/button>').join('') +\n      '\u003cinput id=\"q\">\u003cbutton class=\"chip sym\" style=\"--h:45\" data-fwx title=\"layout\">\u003c/button>\u003cbutton class=\"chip sym\" style=\"--h:150\" id=\"sync\" title=\"sync repo\">⟳\u003c/button>';\n    $('#q').value = query;\n    FW.search($('#q'), q => {\n      query = q.toLowerCase(); applyQuery();\n      const c = query && CELLS.find(c => !c.core && match(c.it));\n      if (c) focusCell(c);\n    });\n    applyQuery();\n    update();\n  }\n  const center = c => [pan.x + R * SQ3 * (c.q + c.r / 2), pan.y + R * 1.5 * c.r];\n\n  function drawComb() {\n    const W = comb.width = innerWidth, H = comb.height = innerHeight;\n    cctx.clearRect(0, 0, W, H);\n    cctx.strokeStyle = 'rgba(255,211,110,.09)';\n    cctx.lineWidth = 1;\n    const qr = Math.ceil(Math.max(W, H) / (R * 1.5)) + 2;\n    const r0 = Math.round(-pan.y / (R * 1.5));\n    for (let r = r0 - qr; r \u003c= r0 + qr; r++) {\n      const q0 = Math.round((-pan.x / (R * SQ3)) - r / 2);\n      for (let q = q0 - qr; q \u003c= q0 + qr; q++) {\n        const [x, y] = center({ q, r });\n        if (x \u003c -R || y \u003c -R || x > W + R || y > H + R) continue;\n        cctx.beginPath();\n        for (let i = 0; i \u003c 6; i++) { const a = Math.PI / 180 * (60 * i - 30); cctx.lineTo(Math.round(x + R * Math.cos(a)) + 0.5, Math.round(y + R * Math.sin(a)) + 0.5); }\n        cctx.closePath(); cctx.stroke();\n      }\n    }\n  }\n\n  /* the lens: hexes swell and push outward near it */\n  function update() {\n    const w = R * SQ3, h = R * 2, sig = R * 3.1, M = reduced.matches ? 0.6 : 1.5, K = 0.55;\n    let best = null, bd = Infinity;\n    CELLS.forEach(c => {\n      const [bx, by] = center(c);\n      const dx = bx - lens.x, dy = by - lens.y, d2 = dx * dx + dy * dy;\n      const g = Math.exp(-d2 / (2 * sig * sig));\n      const s = 1 + M * g, k = 1 + K * g;\n      const x = lens.x + dx * k, y = lens.y + dy * k;\n      c.el.style.width = w + 'px'; c.el.style.height = h + 'px';\n      c.el.style.transform = 'translate(' + (x - w / 2).toFixed(1) + 'px,' + (y - h / 2).toFixed(1) + 'px) scale(' + s.toFixed(3) + ')';\n      c.el.style.zIndex = Math.round(s * 100);\n      if (!c.core && d2 \u003c bd) { bd = d2; best = c; }\n    });\n    if (best !== near) { near = best; caption(); }\n  }\n  function caption() {\n    const bar = $('#bar');\n    if (!near) return;\n    const it = near.it, m = FW.catMeta(it.cat);\n    bar.style.setProperty('--h', m.hue);\n    $('#bk').innerHTML = FW.iconSVG(it.cat, 2);\n    $('#bt').textContent = it.title;\n  }\n\n  let raf = 0;\n  const kick = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; update(); }); };\n  let panAnim = 0;\n  function glide(tx, ty) {\n    cancelAnimationFrame(panAnim);\n    const fx = pan.x, fy = pan.y, t0 = performance.now();\n    (function f(ts) {\n      const k = reduced.matches ? 1 : Math.min(1, (ts - t0) / 700), e = 1 - Math.pow(1 - k, 3);\n      pan.x = fx + (tx - fx) * e; pan.y = fy + (ty - fy) * e;\n      drawComb(); update();\n      if (k \u003c 1) panAnim = requestAnimationFrame(f);\n    })(t0);\n  }\n\n  /* input: mouse moves the lens; drag pans; touch drags pan with the lens at centre */\n  const ptrs = new Map(); let downP = null, moved = false, pinch = null;\n  field.addEventListener('pointerdown', e => {\n    ptrs.set(e.pointerId, [e.clientX, e.clientY]);\n    downP = [e.clientX, e.clientY]; moved = false; cancelAnimationFrame(panAnim);\n    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); }\n  });\n  field.addEventListener('pointermove', e => {\n    idleT = performance.now();\n    if (e.pointerType === 'mouse') { lens.x = e.clientX; lens.y = e.clientY; }\n    else { lens.x = innerWidth / 2; lens.y = innerHeight / 2; }\n    if (ptrs.has(e.pointerId)) {\n      const p = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);\n      if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoom(d / pinch, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch = d; moved = true; return; }\n      if (!moved && Math.hypot(e.clientX - downP[0], e.clientY - downP[1]) > 6) { moved = true; field.classList.add('pan'); try { field.setPointerCapture(e.pointerId); } catch (err) { /* gone */ } }\n      if (moved) { pan.x += e.clientX - p[0]; pan.y += e.clientY - p[1]; drawComb(); }\n    }\n    kick();\n  });\n  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size \u003c 2) pinch = null; field.classList.remove('pan'); };\n  addEventListener('pointerup', up); addEventListener('pointercancel', up);\n  field.addEventListener('click', e => {\n    if (moved) { e.preventDefault(); moved = false; return; }\n    const a = e.target.closest('.hx');\n    if (a && a.classList.contains('core')) { e.preventDefault(); glide(innerWidth / 2, innerHeight / 2); }\n  }, true);\n  function zoom(f, cx, cy) {\n    const nR = Math.max(22, Math.min(96, R * f)), k = nR / R;\n    pan.x = cx - (cx - pan.x) * k; pan.y = cy - (cy - pan.y) * k; R = nR;\n    drawComb(); kick();\n  }\n  field.addEventListener('wheel', e => { e.preventDefault(); zoom(Math.exp(-e.deltaY * 0.0012), e.clientX, e.clientY); }, { passive: false });\n\n  /* idle: the lens wanders on its own, a slow lissajous */\n  (function idle(ts) {\n    requestAnimationFrame(idle);\n    if (reduced.matches || ptrs.size || performance.now() - idleT \u003c 6000) return;\n    const t = ts * 0.00025;\n    lens.x = innerWidth / 2 + Math.sin(t * 1.3) * innerWidth * 0.3;\n    lens.y = innerHeight / 2 + Math.sin(t * 1.7 + 1) * innerHeight * 0.28;\n    update();\n  })(0);\n\n  function match(it) { return (it.title + ' ' + it.cat + ' ' + it.tags.join(' ') + ' ' + it.desc).toLowerCase().includes(query); }\n  function applyQuery() { CELLS.forEach(c => { if (!c.core) c.el.classList.toggle('dim', !!query && !match(c.it)); }); }\n  function focusCell(c) {\n    const tx = innerWidth / 2 - R * SQ3 * (c.q + c.r / 2), ty = innerHeight / 2 - R * 1.5 * c.r;\n    idleT = performance.now(); lens.x = innerWidth / 2; lens.y = innerHeight / 2;\n    glide(tx, ty);\n  }\n  $('#top').addEventListener('click', async e => {\n    const b = e.target.closest('button'); if (!b) return;\n    if (b.dataset.c) { const c = CELLS.find(c => !c.core && c.it.cat === b.dataset.c); if (c) focusCell(c); }\n    else if (b.id === 'sync') { FW.lsSet('hive.gh', '1'); ITEMS = await FW.all({ gh: true, force: true }); build(); FW.toast('⟳ ' + ITEMS.filter(i => i.cat === 'repo').length); }\n  });\n  addEventListener('resize', () => { drawComb(); update(); });\n\n  ITEMS = await FW.all({ gh: FW.ls('hive.gh', '') === '1' });\n  R = innerWidth \u003c 600 ? 34 : 46;\n  build(); drawComb();\n})();\n\u003c/script>\n"}, "marquee": {"name": "Marquee", "glyph": "Aa", "pos": "br", "html": "\u003cstyle>\n  /* MARQUEE - a type-specimen index: every title set huge, drifting; hover to see it */\n  :root{--fw-accent:#ff6ad5}\n  *{box-sizing:border-box}\n  html,body{margin:0;background:#000;color:#fff;overflow-x:hidden}\n  #stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated;pointer-events:none}\n  .wrap{position:relative;z-index:1;padding:10px 0 90px}\n  .div{display:flex;align-items:center;gap:14px;padding:34px 18px 10px;color:hsl(var(--h) 95% 66%)}\n  .div::after{content:\"\";flex:1;height:2px;background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 8px)}\n  .ln{--h:300;display:block;position:relative;overflow:hidden;white-space:nowrap;text-decoration:none;color:#fff;border-top:1px solid #ffffff14;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent}\n  .ln:last-child{border-bottom:1px solid #ffffff14}\n  .trk{display:inline-flex;align-items:center;will-change:transform;animation:slide var(--dur,40s) linear infinite;animation-direction:var(--dir,normal)}\n  .seg{display:inline-flex;align-items:center;gap:.28em;padding-right:.28em;font-size:clamp(46px,9.2vw,148px);line-height:1.02;padding-block:.04em}\n  .seg .fw-ico{width:.32em;height:auto;opacity:.75}\n  .f0 .seg{font:900 clamp(46px,9.2vw,148px)/1.02 \"Arial Black\",\"Helvetica Neue\",Helvetica,system-ui,sans-serif;letter-spacing:-.035em;text-transform:uppercase}\n  .f1 .seg{font:italic 400 clamp(50px,10vw,160px)/1.14 \"Iowan Old Style\",\"Palatino Linotype\",Palatino,Georgia,serif;letter-spacing:-.02em}\n  .f2 .seg{font:700 clamp(40px,8vw,128px)/1.08 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.05em;text-transform:uppercase}\n  .ln.o .seg span{color:transparent;-webkit-text-stroke:2px hsl(var(--h) 95% 66%)}\n  .ln:hover,.ln:focus-visible,.ln.act{background:hsl(var(--h) 95% 62%);color:#000}\n  .ln:hover .seg span,.ln:focus-visible .seg span,.ln.act .seg span{color:#000;-webkit-text-stroke:0}\n  .ln:hover .trk,.ln:focus-visible .trk,.ln.act .trk{animation-play-state:paused}\n  .ln.dim{opacity:.18}\n  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n  .peek{position:fixed;left:0;top:0;z-index:20;width:200px;height:200px;pointer-events:none;opacity:0;transition:opacity .12s;border:3px solid hsl(var(--h) 95% 62%);background:#000;box-shadow:8px 8px 0 #000,0 0 40px hsl(var(--h) 95% 55% / .5)}\n  .peek.on{opacity:1}\n  .peek img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}\n  .tools{position:fixed;left:12px;bottom:12px;z-index:10;display:flex;gap:6px}\n  .tb{width:38px;height:38px;display:grid;place-items:center;background:#000d;border:1px solid #ffffff40;color:#fff;font:16px ui-monospace,monospace;cursor:pointer;padding:0}\n  .tb:hover,.tb:focus-visible{border-color:#ff6ad5;color:#ff6ad5;outline:none}\n  .tb[hidden]{display:none}\n  @media (max-width:600px){.peek{width:150px;height:150px}.ln.o .seg span{-webkit-text-stroke:1.5px hsl(var(--h) 95% 66%)}}\n  @media (prefers-reduced-motion:reduce){.trk{animation:none}}\n\u003c/style>\n\u003ccanvas id=\"stars\" aria-hidden=\"true\">\u003c/canvas>\n\u003cdiv class=\"wrap\" id=\"wrap\">\u003c/div>\n\u003cdiv class=\"peek\" id=\"peek\">\u003cimg id=\"pimg\" alt=\"\">\u003c/div>\n\u003cdiv class=\"tools\">\u003cbutton class=\"tb\" data-fwx title=\"layout\">\u003c/button>\u003cbutton class=\"tb\" id=\"sync\" title=\"sync repo\" aria-label=\"sync repo\">⟳\u003c/button>\u003c/div>\n\u003cscript>/*@@CORE@@*/\u003c/script>\n\u003cscript>\n(async function () {\n  const $ = s => document.querySelector(s);\n  const esc = FW.esc;\n  FW.starfield($('#stars'), { density: 700, hold: false });\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)');\n  const coarse = matchMedia('(pointer: coarse)');\n  let ITEMS = [], act = null;\n\n  /* his long titles, cut to the name part */\n  const short = t => String(t).split(/\\s+[—–-]\\s+|\\s+inspired\\b|!/i)[0].trim() || t;\n\n  function render() {\n    const by = new Map();\n    ITEMS.forEach(it => { if (!by.has(it.cat)) by.set(it.cat, []); by.get(it.cat).push(it); });\n    const cats = [...by.keys()].sort(FW.catSort);\n    let n = 0, h = '';\n    cats.forEach(c => {\n      const hue = FW.catMeta(c).hue;\n      h += '\u003cdiv class=\"div\" style=\"--h:' + hue + '\">' + FW.iconSVG(c, 4) + '\u003c/div>';\n      by.get(c).forEach(it => {\n        const R = FW.rng(FW.hashStr(it.id));\n        const font = 'f' + (n % 3), outline = (n % 2) ? ' o' : '';\n        const seg = '\u003cspan class=\"seg\">\u003cspan>' + esc(short(it.title)) + '\u003c/span>' + FW.iconSVG(c, 2) + '\u003c/span>';\n        h += '\u003ca class=\"ln ' + font + outline + '\" href=\"' + esc(it.link) + '\" target=\"_blank\" rel=\"noopener\" title=\"' + esc(it.title) + '\" data-id=\"' + it.id + '\" ' +\n          'style=\"--h:' + hue + ';--dir:' + (n % 2 ? 'reverse' : 'normal') + '\" data-sp=\"' + (26 + R() * 46).toFixed(1) + '\">' +\n          '\u003cspan class=\"trk\">' + seg + seg + '\u003c/span>' + '\u003c/a>';\n        n++;\n      });\n    });\n    $('#wrap').innerHTML = h;\n    requestAnimationFrame(fill);\n  }\n\n  /* repeat each title until half the track is wider than the screen, so the loop is seamless */\n  function fill() {\n    const vw = innerWidth;\n    document.querySelectorAll('.ln').forEach(ln => {\n      const trk = ln.querySelector('.trk'), seg = trk.querySelector('.seg');\n      const w = seg.getBoundingClientRect().width || 1;\n      const k = Math.max(1, Math.ceil(vw / w) + 1);\n      const one = seg.outerHTML;\n      trk.innerHTML = one.repeat(k * 2);\n      trk.style.setProperty('--dur', ((k * w) / +ln.dataset.sp).toFixed(1) + 's');\n      if (!reduced.matches) trk.style.animationDelay = (-Math.random() * 30).toFixed(1) + 's';\n    });\n  }\n\n  /* the thumbnail that floats beside the cursor */\n  const peek = $('#peek'), pimg = $('#pimg');\n  function show(ln, x, y) {\n    const it = ITEMS.find(i => i.id === ln.dataset.id); if (!it) return;\n    peek.style.setProperty('--h', FW.catMeta(it.cat).hue);\n    if (pimg.dataset.sig !== it.id) { pimg.dataset.sig = it.id; delete pimg.dataset.fell; pimg.src = FW.thumb(it); }\n    const s = peek.offsetWidth;\n    const px = Math.max(8, Math.min(innerWidth - s - 8, x + 28)), py = Math.max(8, Math.min(innerHeight - s - 8, y - s / 2));\n    peek.style.transform = 'translate(' + px + 'px,' + py + 'px) rotate(' + ((x / innerWidth - 0.5) * 8).toFixed(1) + 'deg)';\n    peek.classList.add('on');\n  }\n  function hide() { peek.classList.remove('on'); }\n  const wrap = $('#wrap');\n  wrap.addEventListener('pointermove', e => {\n    if (e.pointerType !== 'mouse') return;\n    const ln = e.target.closest('.ln');\n    if (ln) show(ln, e.clientX, e.clientY); else hide();\n  });\n  wrap.addEventListener('pointerleave', hide);\n  /* touch: first tap reveals, second opens */\n  wrap.addEventListener('click', e => {\n    const ln = e.target.closest('.ln'); if (!ln) return;\n    if (!coarse.matches) return;\n    if (act !== ln) {\n      e.preventDefault();\n      if (act) act.classList.remove('act');\n      act = ln; ln.classList.add('act');\n      const r = ln.getBoundingClientRect();\n      show(ln, Math.min(innerWidth * 0.55, innerWidth - 170), r.top + r.height / 2 + (r.top > innerHeight / 2 ? -110 : 110));\n    }\n  });\n  addEventListener('scroll', () => { if (!coarse.matches) hide(); }, { passive: true });\n  document.addEventListener('focusin', e => {\n    const ln = e.target.closest && e.target.closest('.ln');\n    if (ln) { const r = ln.getBoundingClientRect(); show(ln, innerWidth * 0.6, r.top + r.height / 2); }\n  });\n\n  $('#sync').onclick = async () => {\n    FW.lsSet('marquee.gh', '1');\n    ITEMS = await FW.all({ gh: true, force: true }); render();\n    FW.toast('⟳ ' + ITEMS.filter(i => i.cat === 'repo').length);\n  };\n  let rt = 0;\n  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fill, 200); });\n\n\n  ITEMS = await FW.all({ gh: FW.ls('marquee.gh', '') === '1' });\n  render();\n})();\n\u003c/script>\n"}, "teletext": {"name": "Teletext", "glyph": "▤", "pos": "tr", "html": "\u003cstyle>\n  /* TELETEXT - the site as a 40x25 teletext service. 100 is the index; type a page number. */\n  :root{--fw-accent:#ffff00}\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:#000;color:#fff;font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}\n  #stars{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;opacity:.5}\n  .room{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 12px}\n  .tv{position:relative;padding:14px;background:linear-gradient(#26262c,#121216);border-radius:22px;box-shadow:inset 0 2px 0 #ffffff1c,inset 0 -5px 0 #0008,0 24px 60px #000}\n  .scr{position:relative;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 0 0 3px #050506,0 0 34px #ffffff10}\n  #tt{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default;touch-action:manipulation}\n  #tt.hot{cursor:pointer}\n  .scr::after{content:\"\";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(#0000 0 2px,#0000002e 2px 3px),radial-gradient(ellipse at center,#0000 62%,#0007 100%)}\n  .remote{display:none;flex-direction:column;gap:6px;width:min(360px,100%)}\n  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}\n  .fast{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}\n  .rk{height:42px;border:1px solid #ffffff33;background:#16161b;color:#fff;font:18px ui-monospace,monospace;cursor:pointer;border-radius:8px;box-shadow:0 3px 0 #000}\n  .rk:active{transform:translateY(2px);box-shadow:0 1px 0 #000}\n  .fk{height:26px;border:0;border-radius:13px;cursor:pointer;box-shadow:0 3px 0 #000}\n  .fk:active{transform:translateY(2px)}\n  .tools{position:fixed;left:12px;bottom:12px;display:flex;gap:6px;z-index:5}\n  .tb{width:38px;height:38px;display:grid;place-items:center;background:#000d;border:1px solid #ffffff40;color:#fff;font:16px ui-monospace,monospace;cursor:pointer;padding:0}\n  .tb:hover,.tb:focus-visible{border-color:#ffff00;color:#ffff00;outline:none}\n  .tb[hidden]{display:none}\n  @media (max-width:760px),(pointer:coarse){\n    .room{justify-content:flex-start;padding-top:58px}\n    .remote{display:flex}\n    .tools{position:static;justify-content:center}\n    .tv{padding:8px;border-radius:14px}\n  }\n\u003c/style>\n\u003ccanvas id=\"stars\" aria-hidden=\"true\">\u003c/canvas>\n\u003cdiv class=\"room\">\n  \u003cdiv class=\"tv\">\u003cdiv class=\"scr\">\u003ccanvas id=\"tt\" tabindex=\"0\" aria-label=\"teletext\">\u003c/canvas>\u003c/div>\u003c/div>\n  \u003cdiv class=\"remote\" id=\"remote\">\n    \u003cdiv class=\"fast\">\u003cbutton class=\"fk\" data-f=\"0\" style=\"background:#f00\" aria-label=\"red\">\u003c/button>\u003cbutton class=\"fk\" data-f=\"1\" style=\"background:#0f0\" aria-label=\"green\">\u003c/button>\u003cbutton class=\"fk\" data-f=\"2\" style=\"background:#ff0\" aria-label=\"yellow\">\u003c/button>\u003cbutton class=\"fk\" data-f=\"3\" style=\"background:#0ff\" aria-label=\"cyan\">\u003c/button>\u003c/div>\n    \u003cdiv class=\"pad\">\n      \u003cbutton class=\"rk\" data-d=\"1\">1\u003c/button>\u003cbutton class=\"rk\" data-d=\"2\">2\u003c/button>\u003cbutton class=\"rk\" data-d=\"3\">3\u003c/button>\n      \u003cbutton class=\"rk\" data-d=\"4\">4\u003c/button>\u003cbutton class=\"rk\" data-d=\"5\">5\u003c/button>\u003cbutton class=\"rk\" data-d=\"6\">6\u003c/button>\n      \u003cbutton class=\"rk\" data-d=\"7\">7\u003c/button>\u003cbutton class=\"rk\" data-d=\"8\">8\u003c/button>\u003cbutton class=\"rk\" data-d=\"9\">9\u003c/button>\n      \u003cbutton class=\"rk\" data-k=\"back\" aria-label=\"back\">◀\u003c/button>\u003cbutton class=\"rk\" data-d=\"0\">0\u003c/button>\u003cbutton class=\"rk\" data-k=\"open\" aria-label=\"open\">↗\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"tools\" id=\"tools\">\u003cbutton class=\"tb\" data-fwx title=\"layout\">\u003c/button>\u003cbutton class=\"tb\" id=\"sync\" title=\"sync repo\" aria-label=\"sync repo\">⟳\u003c/button>\u003c/div>\n\u003c/div>\n\u003cscript>/*@@CORE@@*/\u003c/script>\n\u003cscript>\n(async function () {\n  const $ = s => document.querySelector(s);\n  FW.starfield($('#stars'), { density: 900, hold: false });\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)');\n  const cv = $('#tt'), ctx = cv.getContext('2d');\n  const COLS = 40, ROWS = 25;\n  /* the eight teletext colours */\n  const PAL = ['#000000', '#ff0000', '#00ff00', '#ffff00', '#0000ff', '#ff00ff', '#00ffff', '#ffffff'];\n  const K = 0, RD = 1, GR = 2, YE = 3, BL = 4, MA = 5, CY = 6, WH = 7;\n  const short = t => String(t).split(/\\s+[—–-]\\s+|\\s+inspired\\b|!/i)[0].trim() || t;\n  /* folder hue -> nearest teletext colour */\n  function ttCol(cat) {\n    const h = FW.catMeta(cat).hue;\n    const hues = [[0, RD], [60, YE], [120, GR], [180, CY], [240, BL], [300, MA], [360, RD]];\n    let best = WH, bd = 999;\n    hues.forEach(([x, c]) => { const d = Math.abs(h - x); if (d \u003c bd) { bd = d; best = c; } });\n    return best === BL ? CY : best;\n  }\n\n  let ITEMS = [], PAGES = new Map(), FOLDERS = [], cur = 100, hist = [], entry = '', bad = 0, hits = [];\n  let cw = 10, ch = 12, k = 1, flash = false;\n\n  /* ---------- page map ---------- */\n  function buildPages() {\n    PAGES = new Map(); FOLDERS = [];\n    const by = new Map();\n    ITEMS.forEach(it => { if (!by.has(it.cat)) by.set(it.cat, []); by.get(it.cat).push(it); });\n    [...by.keys()].sort(FW.catSort).slice(0, 8).forEach((c, i) => {\n      const base = 200 + i * 100, list = by.get(c).sort((a, b) => a.order - b.order).slice(0, 99);\n      const f = { cat: c, base, list, col: ttCol(c) };\n      FOLDERS.push(f);\n      PAGES.set(base, { kind: 'folder', f });\n      list.forEach((it, j) => PAGES.set(base + j + 1, { kind: 'app', f, it, j }));\n    });\n    PAGES.set(100, { kind: 'index' });\n    if (!PAGES.has(cur)) cur = 100;\n  }\n\n  /* ---------- drawing primitives (all in cell units) ---------- */\n  const X = c => Math.round(c * cw), Y = r => Math.round(r * ch);\n  function fill(c0, r0, c1, r1, col) { ctx.fillStyle = PAL[col]; ctx.fillRect(X(c0), Y(r0), X(c1) - X(c0), Y(r1) - Y(r0)); }\n  let mW = 1;\n  function txt(c, r, s, fg, o) {\n    o = o || {};\n    const chars = Array.from(String(s));\n    if (o.bg != null) fill(c, r, c + chars.length * (o.dw ? 2 : 1), r + (o.dh ? 2 : 1), o.bg);\n    ctx.fillStyle = PAL[fg];\n    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';\n    chars.forEach((chr, i) => {\n      if (c + i * (o.dw ? 2 : 1) >= COLS) return;\n      ctx.save();\n      ctx.translate(X(c + i * (o.dw ? 2 : 1)) + cw / (o.dw ? 1 : 2), Y(r) + (o.dh ? ch : ch / 2));\n      ctx.scale(Math.min(1.25, (cw * 0.94) / mW) * (o.dw ? 2 : 1), o.dh ? 2 : 1);\n      ctx.fillText(chr, 0, ch * 0.04);\n      ctx.restore();\n    });\n  }\n  /* a \"sixel\": teletext mosaic cells are 2 wide by 3 tall */\n  function sx(x, y, col) { ctx.fillStyle = PAL[col]; const x0 = Math.round(x * cw / 2), y0 = Math.round(y * ch / 3); ctx.fillRect(x0, y0, Math.round((x + 1) * cw / 2) - x0, Math.round((y + 1) * ch / 3) - y0); }\n  function icon(cat, c, r, s, col) {\n    const rows = FW.iconRows(cat);\n    rows.forEach((row, y) => { for (let x = 0; x \u003c row.length; x++) if (row[x] === '#') for (let a = 0; a \u003c s; a++) for (let b = 0; b \u003c s; b++) sx(c * 2 + x * s + a, r * 3 + y * s + b, col); });\n    return { w: Math.ceil(rows[0].length * s / 2), h: Math.ceil(rows.length * s / 3) };\n  }\n  function region(c0, r0, c1, r1, go) { hits.push([c0, r0, c1, r1, go]); }\n\n  /* thumbnails become chunky 8-colour mosaics (ordered dither); cross-origin ones stay pixelated true-colour */\n  const MOS = new Map();\n  const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];\n  function mosaic(it, w, h) {\n    const key = it.id + '|' + w + 'x' + h;\n    let m = MOS.get(key);\n    if (m) return m;\n    m = { ready: false };\n    MOS.set(key, m);\n    const im = new Image();\n    im.onload = () => {\n      const c = document.createElement('canvas'); c.width = w; c.height = h;\n      const x = c.getContext('2d'); x.imageSmoothingEnabled = im.naturalWidth > w * 1.5;\n      /* cover-crop the image into a w x h sixel grid (sixels are 5:4) */\n      const ar = (w * 5) / (h * 4), ir = im.naturalWidth / im.naturalHeight;\n      let sw = im.naturalWidth, sh = im.naturalHeight, ox = 0, oy = 0;\n      if (ir > ar) { sw = sh * ar; ox = (im.naturalWidth - sw) / 2; } else { sh = sw / ar; oy = (im.naturalHeight - sh) / 2; }\n      x.drawImage(im, ox, oy, sw, sh, 0, 0, w, h);\n      try {\n        const d = x.getImageData(0, 0, w, h).data, q = new Uint8Array(w * h);\n        for (let y = 0; y \u003c h; y++) for (let xx = 0; xx \u003c w; xx++) {\n          const i = (y * w + xx) * 4, t = 40 + (BAY[(y & 3) * 4 + (xx & 3)] + 0.5) * 11;\n          q[y * w + xx] = (d[i] > t ? 1 : 0) | (d[i + 1] > t ? 2 : 0) | (d[i + 2] > t ? 4 : 0);\n        }\n        m.q = q;\n      } catch (e) { m.cv = c; }\n      m.ready = true; draw();\n    };\n    im.onerror = () => { im.onerror = null; im.src = FW.sigil(it.id); };\n    im.src = FW.thumb(it);\n    return m;\n  }\n  /* teletext stores colours as R=1 G=2 B=4 bits; map to the palette order above */\n  const BITS = [K, RD, GR, YE, BL, MA, CY, WH];\n  function drawMosaic(it, c, r, cols, rows) {\n    const w = cols * 2, h = rows * 3, m = mosaic(it, w, h);\n    fill(c, r, c + cols, r + rows, K);\n    if (!m.ready) { for (let y = 0; y \u003c h; y += 2) for (let x = (y / 2) % 2; x \u003c w; x += 2) sx(c * 2 + x, r * 3 + y, BL); return; }\n    if (m.q) { for (let y = 0; y \u003c h; y++) for (let x = 0; x \u003c w; x++) { const v = BITS[m.q[y * w + x]]; if (v) sx(c * 2 + x, r * 3 + y, v); } }\n    else { ctx.imageSmoothingEnabled = false; ctx.drawImage(m.cv, X(c), Y(r), X(c + cols) - X(c), Y(r + rows) - Y(r)); }\n  }\n\n  /* ---------- pages ---------- */\n  function header() {\n    const d = new Date();\n    const time = [d.getHours(), d.getMinutes(), d.getSeconds()].map(v => String(v).padStart(2, '0')).join(':');\n    const typed = bad ? String(bad) : entry ? (entry + '---').slice(0, 3) : String(cur);\n    const pcol = bad ? RD : (entry ? YE : WH);\n    if (!(entry && !flash)) txt(1, 0, 'P' + typed, pcol, { dh: true });\n    txt(7, 0, 'ꟻweddle.com', YE, { dh: true });\n    txt(19, 0, String(cur), CY, { dh: true });\n    txt(COLS - 9, 0, time, YE, { dh: true });\n  }\n  function fastext(labels) {\n    const cols = [RD, GR, YE, CY];\n    labels.forEach((l, i) => {\n      if (l == null) return;\n      const s = typeof l === 'number' ? String(l) : l.t;\n      const c0 = i * 10;\n      txt(c0 + Math.floor((10 - Array.from(s).length) / 2), 24, s, cols[i]);\n      region(c0, 24, c0 + 10, 25, typeof l === 'number' ? l : l.go);\n    });\n  }\n  function fastTargets() {\n    const p = PAGES.get(cur);\n    if (!p || p.kind === 'index') return FOLDERS.slice(0, 4).map(f => f.base);\n    if (p.kind === 'folder') {\n      const i = FOLDERS.indexOf(p.f);\n      const prev = i > 0 ? FOLDERS[i - 1].base : 100, next = FOLDERS[(i + 1) % FOLDERS.length].base;\n      return [{ t: '◀' + prev, go: prev }, 100, { t: next + '▶', go: next }, p.f.list.length ? p.f.base + 1 : null];\n    }\n    const n = p.f.list.length, prev = p.j > 0 ? cur - 1 : p.f.base, next = p.j \u003c n - 1 ? cur + 1 : p.f.base;\n    return [{ t: '◀' + prev, go: prev }, p.f.base, { t: next + '▶', go: next }, 100];\n  }\n\n  const LOGO = ['#####', '....#', '....#', '.####', '....#', '....#', '....#'];\n  function pageIndex() {\n    /* rainbow mosaic band */\n    const band = [RD, YE, GR, CY, MA];\n    for (let y = 6; y \u003c 12; y++) for (let x = 0; x \u003c COLS * 2; x++) if (((x + y * 2) >> 2) % 2) sx(x, y, band[((x + y * 2) >> 3) % band.length]);\n    /* folder blocks: big mosaic icon, page number underneath */\n    const n = FOLDERS.length, per = n > 4 ? 3 : 2, bw = Math.floor(COLS / per);\n    FOLDERS.forEach((f, i) => {\n      const col = i % per, row = Math.floor(i / per);\n      const c0 = col * bw, r0 = 5 + row * 9;\n      const s = 2, rows = FW.iconRows(f.cat), iw = Math.ceil(rows[0].length * s / 2);\n      icon(f.cat, c0 + Math.floor((bw - iw) / 2), r0 + 1 m() && r \u003c max) txt(21, r++, line.trim(), col);\n    };\n    if (short(it.title) !== it.title) { wrap(it.title, WH, 13); r++; }\n    wrap(decodeURIComponent(it.link.replace(/^https?:\\/\\/(www\\.)?/, '').replace(/[?#].*$/, '')), CY, 15);\n    fill(21, 16, 39, 20, GR);\n    txt(29, 17, '↗', K, { dh: true, dw: true });\n    region(21, 16, 39, 20, 'open');\n    txt(21, 21, String(p.j + 1) + '/' + f.list.length, CY);\n  }\n\n  function draw() {\n    hits = [];\n    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);\n    ctx.font = 'bold ' + Math.round(ch * 0.9) + 'px ui-monospace,\"Courier New\",Menlo,Consolas,monospace';\n    mW = ctx.measureText('M').width || 1;\n    const p = PAGES.get(cur) || { kind: 'index' };\n    if (p.kind === 'index') pageIndex();\n    else if (p.kind === 'folder') pageFolder(p.f);\n    else pageApp(p);\n    header();\n    fastext(fastTargets());\n  }\n\n  /* ---------- size: fit 40x25 crisply ---------- */\n  function size() {\n    const narrow = innerWidth \u003c= 760 || matchMedia('(pointer:coarse)').matches;\n    const dpr = Math.min(3, devicePixelRatio || 1);\n    const availW = innerWidth - (narrow ? 40 : 80), availH = innerHeight - (narrow ? 58 + 360 : 90);\n    const s = Math.max(0.5, Math.min(availW / (COLS * 10), Math.max(160, availH) / (ROWS * 12)));\n    const cssW = Math.floor(COLS * 10 * s), cssH = Math.floor(ROWS * 12 * s);\n    cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';\n    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);\n    k = dpr; cw = cv.width / COLS; ch = cv.height / ROWS;\n    draw();\n  }\n\n  /* ---------- navigation ---------- */\n  function go(n, noHist) {\n    if (n === 'open') { const p = PAGES.get(cur); if (p && p.it) FW.openItem(p.it); return; }\n    if (!PAGES.has(n)) { bad = n; draw(); setTimeout(() => { bad = 0; entry = ''; draw(); }, 900); return; }\n    if (n !== cur && !noHist) hist.push(cur);\n    cur = n; entry = ''; draw();\n  }\n  function digi rdAt(c).it);\n  });\n  let lastTap = '';\n  const clues = $('#clues');\n  clues.addEventListener('pointerover', e => { const a = e.target.closest('.cl'); if (a && e.pointerType === 'mouse') setActive(WORDS[+a.dataset.i]); });\n  clues.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setActive(null); });\n  clues.addEventListener('focusin', e => { const a = e.target.closest('.cl'); if (a) setActive(WORDS[+a.dataset.i]); });\n  clues.addEventListener('click', e => {\n    const a = e.target.closest('.cl'); if (!a || !coarse.matches) return;\n    const w = WORDS[+a.dataset.i];\n    if (active !== w) { e.preventDefault(); setActive(w); }\n  });\n\n  $('#rv').onclick = () => { all = !all; FW.lsSet('crossword.all', all ? '1' : ''); CELLS.forEach(c => c.el.classList.toggle('rv', all || [...c.w].some(i => i != null && revealed.has(i)))); $('#rv').classList.toggle('on', all); };\n  $('#sync').onclick = async () => {\n    FW.lsSet('crossword.gh', '1');\n    ITEMS = await FW.all({ gh: true, force: true }); render();\n    FW.toast('⟳ ' + ITEMS.filter(i => i.cat === 'repo').length);\n  };\n  let rt = 0;\n  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fit, 120); });\n\n\n  ITEMS = await FW.all({ gh: FW.ls('crossword.gh', '') === '1' });\n  render();\n})();\n\u003c/script>\n"}, "sphere": {"name": "Sphere", "glyph": "◍", "pos": "br", "html": "\u003cstyle>\n  /* SPHERE - every app tiled over a slowly turning 3D form; drag to spin, morph between\n     sphere, torus, double helix and a flat plane */\n  :root{--fw-accent:#9fe8ff}\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}\n  #stars{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}\n  #cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;image-rendering:pixelated}\n  #cv.drag{cursor:grabbing}\n  #cv.h
