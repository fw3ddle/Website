(FW.ls('repo.open', '[]'))); } catch (e) { /* bad json */ }\n  if (!SORTS.some(s => s[0] === st.sort)) st.sort = 'new';\n  const enc = p => '#' + encodeURIComponent(p);\n  const hue = n => FW.catMeta(n).hue;\n  const top = p => p.split('/')[0];\n  const img = (it, cls) => '\u003cimg class=\"' + (cls || '') + '\" src=\"' + esc(FW.thumb(it)) + '\" data-sig=\"' + it.id + '\" alt=\"' + esc(it.title) + '\" loading=\"lazy\" draggable=\"false\">';\n  /* top-level folders are categories: shown by pixel icon. deeper folders (from repo sync) keep their real names */\n  const dirLabel = (d, px) => d.path.includes('/') ? '\u003cspan class=\"dico\" style=\"--h:' + hue(top(d.path)) + '\">\u003c/span>\u003cspan>' + esc(d.name) + '\u003c/span>'\n    : '\u003cspan class=\"ci\" style=\"--h:' + hue(d.name) + '\">' + FW.iconSVG(d.name, px || 2) + '\u003c/span>';\n\n  async function load(gh, force) {\n    ITEMS = await FW.all({ gh, force });\n    build(); readHash(); render();\n  }\n  function mk(path, name) { return { path, name, dirs: new Map(), files: [], n: 0 }; }\n  function build() {\n    ROOT = mk('', '');\n    for (const it of ITEMS) {\n      const parts = it.path.split('/');\n      let n = ROOT;\n      for (let i = 0; i \u003c parts.length - 1; i++) {\n        let c = n.dirs.get(parts[i]);\n        if (!c) { c = mk(parts.slice(0, i + 1).join('/'), parts[i]); n.dirs.set(parts[i], c); }\n        n = c;\n      }\n      n.files.push(it);\n    }\n    (function count(n) { n.n = n.files.length; n.dirs.forEach(d => { n.n += count(d); }); return n.n; })(ROOT);\n  }\n  function nodeAt(p) {\n    if (!p) return ROOT;\n    let n = ROOT;\n    for (const part of p.split('/')) { n = n.dirs.get(part); if (!n) return null; }\n    return n;\n  }\n  const byPath = p => ITEMS.find(i => i.path === p);\n  function deep(n) { const a = n.files.slice(); n.dirs.forEach(d => a.push(...deep(d))); return a; }\n  function sortFiles(a) {\n    const s = st.sort;\n    return a.slice().sort(s === 'az' ? (x, y) => x.title.localeCompare(y.title)\n      : s === 'type' ? (x, y) => x.ext.localeCompare(y.ext) || x.title.localeCompare(y.title)\n      : (x, y) => y.order - x.order);\n  }\n  const sortDirs = a => a.slice().sort((x, y) => FW.catSort(x.name, y.name));\n\n  function readHash() {\n    let h = '';\n    try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = ''; }\n    const f = byPath(h);\n    if (f) { st.file = f; st.cwd = h.split('/').slice(0, -1).join('/'); }\n    else { st.file = null; st.cwd = nodeAt(h) ? h : ''; }\n    st.pv = false;\n  }\n  addEventListener('hashchange', () => {\n    /* following a link always leaves search, otherwise the file you picked never shows */\n    st.q = ''; $('#q').value = ''; $('#q').classList.remove('fw-has');\n    readHash(); render(); scrollTo(0, 0); $('#tree').classList.remove('show');\n  });\n\n  /* ---------- render ---------- */\n  function render() { renderTabs(); renderTree(); renderMain(); }\n\n  function renderTabs() {\n    const t = st.cwd ? top(st.cwd) : (st.file ? top(st.file.path) : '');\n    let h = '\u003ca href=\"#\" class=\"' + (!t ? 'on' : '') + '\" title=\"all\" aria-label=\"All\">⌘\u003c/a>';\n    sortDirs([...ROOT.dirs.values()]).forEach(d => {\n      h += '\u003ca href=\"' + enc(d.path) + '\" class=\"' + (t === d.name ? 'on' : '') + '\" title=\"' + esc(d.name) + '\" aria-label=\"' + esc(d.name) + '\">' + dirLabel(d, 2) + '\u003c/a>';\n    });\n    $('#tabs').innerHTML = h;\n  }\n\n  function treeHTML(n, depth) {\n    let h = '';\n    sortDirs([...n.dirs.values()]).forEach(d => {\n      const open = st.open.has(d.path) || (st.cwd + '/').startsWith(d.path + '/') || (st.file && (st.file.path + '/').startsWith(d.path + '/'));\n      h += '\u003cdiv class=\"tn ' + (st.cwd === d.path && !st.file ? 'cur' : '') + '\" style=\"--d:' + depth + '\">' +\n        '\u003cbutton class=\"tw\" data-tog=\"' + esc(d.path) + '\" aria-label=\"toggle\" aria-expanded=\"' + open + '\">' + (open ? '▼' : '▶') + '\u003c/button>' +\n        '\u003ca href=\"' + enc(d.path) + '\" title=\"' + esc(d.name) + '\">' + dirLabel(d) + '\u003c/a>\u003c/div>';\n      if (open) h += treeHTML(d, depth + 1);\n    });\n    sortFiles(n.files).forEach(f => {\n      h += '\u003cdiv class=\"tn ' + (st.file === f ? 'cur' : '') + '\" style=\"--d:' + depth + '\">\u003cspan class=\"tw\">\u003c/span>' +\n        '\u003ca href=\"' + enc(f.path) + '\" title=\"' + esc(f.title) + '\">' + img(f, 'ti') + esc(f.title) + '\u003c/a>\u003c/div>';\n    });\n    return h;\n  }\n  function renderTree() { $('#tree').innerHTML = treeHTML(ROOT, 0); }\n\n  function crumbsHTML(path) {\n    let h = '\u003ca href=\"#\" title=\"root\">ꟻ\u003c/a>';\n    if (!path) return h;\n    const parts = path.split('/');\n    parts.forEach((p, i) => {\n      const sub = parts.slice(0, i + 1).join('/');\n      const label = i === 0 ? '\u003cspan class=\"ci\" style=\"--h:' + hue(p) + '\">' + FW.iconSVG(p, 2) + '\u003c/span>' : esc(p);\n      if (st.file && i === parts.length - 1) return;\n      h += '\u003cspan class=\"sl\">/\u003c/span>\u003ca href=\"' + enc(sub) + '\" title=\"' + esc(p) + '\">' + label + '\u003c/a>';\n    });\n    return h;\n  }\n\n  function barHTML() {\n    const s = SORTS.find(x => x[0] === st.sort);\n    return '\u003cdiv class=\"bar\">' +\n      '\u003cbutton class=\"btn menu-btn\" id=\"menu\" title=\"files\" aria-label=\"Files\">☰\u003c/button>' +\n      '\u003cdiv class=\"path mono\">' + (st.q ? '⌕' : crumbsHTML(st.file ? st.file.path : st.cwd)) + '\u003c/div>' +\n      '\u003cspan class=\"sp\">\u003c/span>' +\n      (st.file ? '' : '\u003cbutton class=\"btn mono\" id=\"sort\" title=\"sort: ' + s[2] + '\" aria-label=\"Sort by ' + s[2] + '\">' + s[1] + '\u003c/button>' +\n      '\u003cdiv class=\"seg\" role=\"group\" aria-label=\"View\">\u003cbutton data-view=\"grid\" class=\"' + (st.view === 'grid' ? 'on' : '') + '\" title=\"thumbnails\" aria-label=\"Thumbnails\">▦\u003c/button>\u003cbutton data-view=\"list\" class=\"' + (st.view === 'list' ? 'on' : '') + '\" title=\"list\" aria-label=\"List\">☰\u003c/button>\u003c/div>') +\n      '\u003cbutton class=\"btn\" data-fwx title=\"layout\">\u003c/button>' +\n      '\u003c/div>';\n  }\n\n  function dirCard(d) {\n    const th = sortFiles(deep(d)).slice(0, 4);\n    let m = th.map(t => img(t)).join('');\n    for (let i = th.length; i \u003c 4; i++) m += '\u003ci>\u003c/i>';\n    return '\u003ca class=\"card\" style=\"--h:' + hue(top(d.path)) + '\" href=\"' + enc(d.path) + '\" title=\"' + esc(d.name) + '\">\u003cdiv class=\"mosaic\">' + m + '\u003c/div>' +\n      '\u003cdiv class=\"meta\">' + (d.path.includes('/') ? '\u003cb class=\"mono\">' + esc(d.name) + '/\u003c/b>' : '\u003cspan class=\"ci\">' + FW.iconSVG(d.name, 2) + '\u003c/span>') + '\u003c/div>\u003c/a>';\n  }\n  function fileCard(f) {\n    return '\u003ca class=\"card\" style=\"--h:' + hue(f.cat) + '\" href=\"' + enc(f.path) + '\" title=\"' + esc(f.title) + '\">' + img(f, 'th') +\n      '\u003cspan class=\"go\" data-open=\"' + f.id + '\" title=\"open\" aria-label=\"Open ' + esc(f.title) + '\">↗\u003c/span>\u003c/a>';\n  }\n  function dirRow(d) {\n    return '\u003ca class=\"row\" href=\"' + enc(d.path) + '\" title=\"' + esc(d.name) + '\">\u003cspan class=\"ci\" style=\"--h:' + hue(top(d.path)) + '\">' + (d.path.includes('/') ? '\u003cspan class=\"dico\" style=\"--h:' + hue(top(d.path)) + '\">\u003c/span>' : FW.iconSVG(d.name, 2)) + '\u003c/span>' +\n      '\u003cspan class=\"nm mono\">' + (d.path.includes('/') ? '\u003cspan>' + esc(d.name) + '\u003c/span>' : '') + '\u003c/span>\u003cspan class=\"ex\">\u003c/span>\u003c/a>';\n  }\n  function fileRow(f) {\n    return '\u003ca class=\"row\" href=\"' + enc(f.path) + '\" title=\"' + esc(f.title) + '\">' + img(f) + '\u003cspan class=\"nm\">\u003cspan>' + esc(f.title) + '\u003c/span>' +\n      (st.q ? '\u003csmall class=\"ci\" style=\"--h:' + hue(f.cat) + '\">' + FW.iconSVG(f.cat, 1) + '\u003c/small>' : '') + '\u003c/span>\u003cspan class=\"ex mono\">' + esc(f.ext) + '\u003c/span>\u003c/a>';\n  }\n\n  function listing(dirs, files, up) {\n    if (!dirs.length && !files.length) return '\u003cdiv class=\"empty\">∅\u003c/div>';\n    if (st.view === 'grid') return '\u003cdiv class=\"grid\">' + dirs.map(dirCard).join('') + files.map(fileCard).join('') + '\u003c/div>';\n    let h = '';\n    if (up != null) h += '\u003ca class=\"row\" href=\"' + enc(up) + '\" title=\"up\">\u003cspan>\u003c/span>\u003cspan class=\"nm mono\">..\u003c/span>\u003cspan>\u003c/span>\u003c/a>';\n    return h + dirs.map(dirRow).join('') + files.map(fileRow).join('');\n  }\n\n  /* the README is only the \"languages\" bar: one coloured share per folder */\n  function readmeHTML() {\n    const cats = sortDirs([...ROOT.dirs.values()]);\n    if (!cats.length) return '';\n    return '\u003cdiv class=\"box\">\u003cdiv class=\"lang\">' + cats.map(d => '\u003cspan title=\"' + esc(d.name) + '\" style=\"flex:' + d.n + ';background:hsl(' + hue(d.name) + ' 70% 58%)\">\u003c/span>').join('') + '\u003c/div>' +\n      '\u003cdiv class=\"legend\">' + cats.map(d => '\u003ca href=\"' + enc(d.path) + '\" title=\"' + esc(d.name) + '\">\u003ci style=\"background:hsl(' + hue(d.name) + ' 70% 58%)\">\u003c/i>\u003cspan class=\"ci\" style=\"--h:' + hue(d.name) + '\">' + FW.iconSVG(d.name, 2) + '\u003c/span>\u003c/a>').join('') + '\u003c/div>\u003c/div>';\n  }\n\n  function fileView(f) {\n    const canPv = !f.external && (/^html?$/.test(f.ext) || FW.isImgName('x.' + f.ext));\n    return '\u003cdiv class=\"box\">\u003cdiv class=\"fv\">' + img(f, 'big') + '\u003cdiv>\u003ch2>' + esc(f.title) + '\u003c/h2>' +\n      '\u003cdiv class=\"act\">\u003ca class=\"btn green\" href=\"' + esc(f.link) + '\" target=\"_blank\" rel=\"noopener\" title=\"open\" aria-label=\"Open\">↗\u003c/a>' +\n      (canPv ? '\u003cbutton class=\"btn\" id=\"pv\" title=\"' + (st.pv ? 'close preview' : 'preview here') + '\" aria-label=\"Preview\">' + (st.pv ? '■' : '▶') + '\u003c/button>' : '') +\n      '\u003cbutton class=\"btn\" id=\"copy\" title=\"copy link\" aria-label=\"Copy link\">⧉\u003c/button>' +\n      '\u003c/div>\u003c/div>\u003c/div>' +\n      (st.pv ? '\u003cdiv class=\"pv\">' + (/^html?$/.test(f.ext) ? '\u003ciframe src=\"' + esc(f.link) + '\" title=\"' + esc(f.title) + '\">\u003c/iframe>' : '\u003cimg src=\"' + esc(f.link) + '\" alt=\"\">') + '\u003c/div>' : '') +\n      '\u003c/div>';\n  }\n\n  function renderMain() {\n    let h = barHTML();\n    if (st.q) {\n      const q = st.q.toLowerCase();\n      const hits = sortFiles(ITEMS.filter(i => (i.title + ' ' + i.cat + ' ' + i.tags.join(' ') + ' ' + i.path).toLowerCase().includes(q)));\n      h += '\u003cdiv class=\"box\">' + listing([], hits, null) + '\u003c/div>';\n    } else if (st.file) {\n      h += fileView(st.file);\n    } else {\n      const n = nodeAt(st.cwd) || ROOT;\n      const up = st.cwd ? st.cwd.split('/').slice(0, -1).join('/') : null;\n      h += '\u003cdiv class=\"box\">' + listing(sortDirs([...n.dirs.values()]), sortFiles(n.files), up) + '\u003c/div>';\n      if (!st.cwd) h += readmeHTML();\n    }\n    $('#main').innerHTML = h;\n  }\n\n  /* ---------- events ---------- */\n  document.addEventListener('click', async e => {\n    const t = e.target.closest('[data-tog],[data-view],[data-open],#copy,#pv,#menu,#sort');\n    if (!t) return;\n    if (t.dataset.tog != null) {\n      const p = t.dataset.tog;\n      if (st.open.has(p)) st.open.delete(p); else st.open.add(p);\n      FW.lsSet('repo.open', JSON.stringify([...st.open]));\n      renderTree();\n    } else if (t.dataset.view) {\n      st.view = t.dataset.view; FW.lsSet('repo.view', st.view); renderMain();\n    } else if (t.dataset.open) {\n      e.preventDefault(); e.stopPropagation();\n      const it = ITEMS.find(i => i.id === t.dataset.open);\n      if (it) FW.openItem(it);\n    } else if (t.id === 'sort') {\n      const i = SORTS.findIndex(s => s[0] === st.sort);\n      st.sort = SORTS[(i + 1) % SORTS.length][0]; FW.lsSet('repo.sort', st.sort); renderTree(); renderMain();\n    } else if (t.id === 'menu') { e.stopPropagation(); $('#tree').classList.toggle('show'); }\n    else if (t.id === 'copy') {\n      const u = new URL(st.file.link, location.href).href;\n      try { await navigator.clipboard.writeText(u); FW.toast('⧉'); } catch (err) { FW.toast(u, 5000); }\n    } else if (t.id === 'pv') { st.pv = !st.pv; renderMain(); }\n  });\n  /* tapping outside the phone tree closes it */\n  document.addEventListener('pointerdown', e => {\n    const tr = $('#tree');\n    if (tr.classList.contains('show') && !e.target.closest('#tree,#menu')) tr.classList.remove('show');\n  });\n  FW.search($('#q'), v => { st.q = v; renderMain(); });\n  document.addEventListener('keydown', e => {\n    const a = document.activeElement;\n    if (e.key === '/' && !(a && /^(INPUT|TEXTAREA)$/.test(a.tagName))) { e.preventDefault(); $('#q').focus(); }\n    if (e.key === 'Escape') {\n      $('#tree').classList.remove('show');\n    }\n  });\n  $('#sync').addEventListener('click', async () => {\n    const b = $('#sync'); b.disabled = true; b.textContent = '…';\n    FW.lsSet('repo.gh', '1');\n    await load(true, true);\n    b.disabled = false; b.textContent = '⟳';\n    FW.toast('⟳ ' + ITEMS.filter(i => i.origin === 'repo').length);\n  });\n\n\n  await load(FW.ls('repo.gh', '') === '1', false);\n})();\n\u003c/script>\n"}, "starmap": {"name": "Starmap", "glyph": "✷", "pos": "bl", "html": "\u003cstyle>\n  /* EXPERIMENT 03 · STARMAP - every folder is a sun, every app a planet */\n  :root{--fw-accent:#ffd36e}\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}\n  #map{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:grab}\n  #map.pan{cursor:grabbing}\n  #map.hot{cursor:pointer}\n  .hud{position:fixed;left:12px;top:12px;width:208px;max-height:calc(100% - 24px);overflow:auto;background:#05050cdd;border:1px solid #ffffff2a;box-shadow:0 0 0 3px #000;z-index:5}\n  .hud h1{margin:0;padding:6px 6px 6px 12px;font-size:15px;border-bottom:1px solid #ffffff22;display:flex;align-items:center;gap:6px;font-weight:700;min-height:44px}\n  .hud h1 a{color:#fff;text-decoration:none;white-space:nowrap;margin-right:auto}\n  #q{background-color:#111120;border:1px solid #ffffff2a;color:#fff;font:inherit;--fws-h:31px;--fws-min:34px;--fws-w:100%}\n  #q:hover{border-color:#fff}\n  #q:focus{border-color:#ffd36e;background-color:#0c0c18}\n  #list{display:flex;flex-wrap:wrap;gap:4px;padding:8px}\n  .sys{display:grid;place-items:center;width:44px;height:38px;cursor:pointer;border:1px solid transparent;background:none;color:hsl(var(--h) 90% 65%);padding:0;line-height:0}\n  .sys:hover,.sys.on{background:#ffffff12;border-color:hsl(var(--h) 90% 65% / .7)}\n  .tools{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-top:1px solid #ffffff22}\n  .tb{background:#111120;border:1px solid #ffffff2a;color:#fff;font:inherit;font-size:14px;padding:5px 9px;cursor:pointer;min-width:34px;height:31px}\n  .tb:hover{border-color:#fff}\n  .card{position:fixed;right:12px;top:12px;width:280px;background:#05050cee;border:1px solid hsl(var(--h) 80% 60%);box-shadow:0 0 0 3px #000,0 0 40px hsl(var(--h) 80% 50% / .25);z-index:6;display:none}\n  .card.on{display:block}\n  .card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#000}\n  .card .b{padding:12px 14px}\n  .card .k{color:hsl(var(--h) 90% 65%);line-height:0}\n  .card h2{margin:8px 0 10px;font-size:16px;line-height:1.3;word-break:break-word}\n  .card .act{display:flex;gap:6px;flex-wrap:wrap}\n  .go{background:hsl(var(--h) 80% 55%);color:#000;border:0;font:inherit;font-weight:700;font-size:15px;padding:6px 16px;cursor:pointer;text-decoration:none}\n  .card .x{position:absolute;top:6px;right:6px;width:28px;height:28px;background:#000c;color:#fff;border:1px solid #ffffff44;cursor:pointer;font:inherit}\n  .mob{display:none}\n  @media (max-width:700px){\n    .hud{width:auto;right:12px}\n    .hud:not(.open)>:not(h1){display:none!important}\n    .hud:not(.open) h1{border-bottom:0}\n    .hud.open{max-height:70%;overflow:auto}\n    .mob{display:inline-block}\n    .card{left:12px;right:12px;top:auto;bottom:62px;width:auto;display:none;grid-template-columns:110px 1fr}\n    .card.on{display:grid}\n    .card img{height:100%;aspect-ratio:auto}\n  }\n\u003c/style>\n\u003ccanvas id=\"map\" aria-label=\"Star map of Fweddle apps\">\u003c/canvas>\n\u003cdiv class=\"hud\" id=\"hud\">\n  \u003ch1>\u003ca href=\"/\" aria-label=\"fweddle.com\">ꟻweddle.com\u003c/a>\u003cbutton class=\"tb\" data-fwx title=\"layout\">\u003c/button>\u003cbutton class=\"tb mob\" id=\"mob\" title=\"menu\" aria-label=\"Menu\">☰\u003c/button>\u003c/h1>\n  \u003cdiv id=\"list\">\u003c/div>\n  \u003cdiv class=\"tools\">\n    \u003cinput id=\"q\" aria-label=\"search\">\n    \u003cbutton class=\"tb\" id=\"home\" title=\"overview (0)\" aria-label=\"Overview\">⌂\u003c/button>\n    \u003cbutton class=\"tb\" id=\"sync\" title=\"sync the GitHub repo\" aria-label=\"Sync repo\">⟳\u003c/button>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\" id=\"card\">\u003cbutton class=\"x\" id=\"cx\" title=\"close\" aria-label=\"Close\">✕\u003c/button>\u003cimg id=\"ci\" alt=\"\">\u003cdiv class=\"b\">\u003cdiv class=\"k\" id=\"ck\">\u003c/div>\u003ch2 id=\"ct\">\u003c/h2>\u003cdiv class=\"act\">\u003ca class=\"go\" id=\"co\" target=\"_blank\" rel=\"noopener\" title=\"open\" aria-label=\"Open\">↗\u003c/a>\u003cbutton class=\"tb\" id=\"cf\" title=\"follow its orbit\" aria-label=\"Track\">◎\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cscript>/*@@CORE@@*/\u003c/script>\n\u003cscript>\n(async function () {\n  const $ = s => document.querySelector(s);\n  const esc = FW.esc;\n  const cv = $('#map'), ctx = cv.getContext('2d');\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)');\n  let W = 0, H = 0;\n  const cam = { x: 0, y: 0, z: 0.5 };\n  let fly = null, follow = null, hover = null, sel = null, query = '';\n  let ITEMS = [], SYS = [];\n  const PS = 46; // planet size, world px\n  const IMG = new Map();\n\n  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; ctx.imageSmoothingEnabled = false; }\n  resize();\n  addEventListener('resize', resize);\n\n  function getImg(it) {\n    let im = IMG.get(it.id);\n    if (!im) {\n      im = new Image();\n      im.onerror = () => { im.onerror = null; im.src = FW.sigil(it.id); };\n      im.src = FW.thumb(it);\n      IMG.set(it.id, im);\n    }\n    return im;\n  }\n\n  /* ---------- layout: systems on a golden spiral ---------- */\n  function layout() {\n    const by = new Map();\n    ITEMS.forEach(it => { if (!by.has(it.cat)) by.set(it.cat, []); by.get(it.cat).push(it); });\n    const cats = [...by.keys()].sort(FW.catSort);\n    SYS = [];\n    cats.forEach((c, k) => {\n      const a = k * 2.39996, r = k ? 1050 * Math.sqrt(k) : 0;\n      SYS.push(makeSys(c, by.get(c), Math.cos(a) * r, Math.sin(a) * r));\n    });\n    renderList();\n  }\n  function makeSys(cat, items, x, y) {\n    const m = FW.catMeta(cat), seed = FW.hashStr(cat);\n    const dir = seed % 2 ? 1 : -1;\n    const planets = [];\n    let ring = 0, inRing = 0, cap = 6;\n    items.forEach(it => {\n      if (inRing >= cap) { ring++; inRing = 0; cap = 6 + ring * 5; }\n      planets.push({ it, ring, slot: inRing, a0: 0, spd: 0 });\n      inRing++;\n    });\n    const rings = ring + 1;\n    planets.forEach(p => {\n      const count = planets.filter(q => q.ring === p.ring).length;\n      p.r = 150 + p.ring * 100;\n      p.a0 = (p.slot / count) * Math.PI * 2 + (seed % 628) / 100 + p.ring * 0.7;\n      p.spd = dir * 0.000045 / (1 + p.ring * 0.7);\n    });\n    const parts = [];\n    for (let i = 0; i \u003c 140; i++) {\n      const rr = Math.pow(FW.hash32(seed + i * 17) / 4294967296, 0.6) * 58;\n      parts.push({ r: rr, a: (FW.hash32(seed + i * 31) / 4294967296) * 6.283, s: (0.3 + (1 - rr / 58)) * 0.0012 * dir, l: 40 + (1 - rr / 58) * 45 });\n    }\n    return { cat, x, y, hue: m.hue, items, planets, rings, R: 150 + (rings - 1) * 100 + 70, parts };\n  }\n\n  const toS = (wx, wy) => [(wx - cam.x) * cam.z + W / 2, (wy - cam.y) * cam.z + H / 2];\n  const toW = (sx, sy) => [(sx - W / 2) / cam.z + cam.x, (sy - H / 2) / cam.z + cam.y];\n  const ppos = (s, p, t) => { const a = p.a0 + t * p.spd; return [s.x + Math.cos(a) * p.r, s.y + Math.sin(a) * p.r]; };\n\n  /* ---------- draw ---------- */\n  let T = 0, lastTs = 0;\n  function frame(ts) {\n    const dt = Math.min(50, ts - lastTs || 16); lastTs = ts;\n    if (!reduced.matches) T += dt;\n    if (fly) {\n      const k = Math.min(1, (ts - fly.t0) / fly.ms), e = k \u003c 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;\n      cam.x = fly.x0 + (fly.x1 - fly.x0) * e; cam.y = fly.y0 + (fly.y1 - fly.y0) * e;\n      cam.z = Math.exp(Math.log(fly.z0) + (Math.log(fly.z1) - Math.log(fly.z0)) * e);\n      if (k >= 1) fly = null;\n    } else if (follow) {\n      const s = SYS.find(q => q.planets.includes(follow));\n      if (s) { const [px, py] = ppos(s, follow, T); cam.x += (px - cam.x) * 0.08; cam.y += (py - cam.y) * 0.08; }\n    }\n    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);\n    drawBg(ts);\n    SYS.forEach(s => drawSys(s, ts));\n    if (hover) drawTip(hover);\n    requestAnimationFrame(frame);\n  }\n\n  function drawBg(ts) {\n    const layers = [[0.08, 70, 1, 0.35], [0.22, 90, 1, 0.6], [0.45, 120, 2, 0.9]];\n    layers.forEach(([par, cell, sz, br], li) => {\n      const ox = -cam.x * cam.z * par, oy = -cam.y * cam.z * par;\n      const c0 = Math.floor(-ox / cell) - 1, r0 = Math.floor(-oy / cell) - 1;\n      const c1 = c0 + Math.ceil(W / cell) + 2, r1 = r0 + Math.ceil(H / cell) + 2;\n      for (let cy = r0; cy \u003c r1; cy++) for (let cx = c0; cx \u003c c1; cx++) {\n        const h = FW.hash32(cx * 73856093 ^ cy * 19349663 ^ li * 83492791);\n        if (h % 3 === 0) continue;\n        const x = Math.round(cx * cell + (h % cell) + ox), y = Math.round(cy * cell + ((h >>> 8) % cell) + oy);\n        const tw = 0.5 + 0.5 * Math.sin(ts * 0.001 * (1 + (h >>> 16) % 3) + h);\n        ctx.fillStyle = 'rgba(' + (h % 5 === 0 ? '159,184,255' : h % 7 === 0 ? '202,168,255' : '255,255,255') + ',' + (br * (0.4 + 0.6 * tw)).toFixed(2) + ')';\n        ctx.fillRect(x, y, sz, sz);\n      }\n    });\n  }\n\n  function hit(s, q) { return !q || s.planets.some(p => match(p.it)); }\n  function match(it) { return !query || (it.title + ' ' + it.cat + ' ' + it.tags.join(' ') + ' ' + it.desc).toLowerCase().includes(query); }\n\n  function drawSys(s, ts) {\n    const [sx, sy] = toS(s.x, s.y), R = s.R * cam.z;\n    if (sx + R \u003c -40 || sx - R > W + 40 || sy + R \u003c -40 || sy - R > H + 40) return;\n    const dim = query && !hit(s, true) ? 0.25 : 1;\n    ctx.globalAlpha = dim;\n    // orbit rings - dotted pixels\n    for (let r = 0; r \u003c s.rings; r++) {\n      const rr = (150 + r * 100) * cam.z, n = Math.max(24, Math.min(240, Math.floor(rr / 3)));\n      ctx.fillStyle = 'hsla(' + s.hue + ',70%,60%,.28)';\n      for (let i = 0; i \u003c n; i++) {\n        const a = i / n * 6.283 + (ts * 0.00002 * (r % 2 ? 1 : -1));\n        ctx.fillRect(Math.round(sx + Math.cos(a) * rr), Math.round(sy + Math.sin(a) * rr), 1, 1);\n      }\n    }\n    // the sun: a churning pixel blob\n    const px = Math.max(1, Math.round(3 * cam.z));\n    s.parts.forEach(p => {\n      const a = p.a + T * p.s;\n      ctx.fillStyle = 'hsl(' + ((s.hue + (1 - p.l / 85) * 40) % 360) + ',95%,' + p.l + '%)';\n      ctx.fillRect(Math.round(sx + Math.cos(a) * p.r * cam.z), Math.round(sy + Math.sin(a) * p.r * cam.z), px, px);\n    });\n    const glow = 62 * cam.z;\n    for (let i = 0; i \u003c 28; i++) {\n      const a = i / 28 * 6.283 + ts * 0.0003, f = Math.sin(ts * 0.004 + i * 2.1) > 0.4;\n      if (!f) continue;\n      ctx.fillStyle = 'hsla(' + s.hue + ',95%,70%,.6)';\n      ctx.fillRect(Math.round(sx + Math.cos(a) * glow), Math.round(sy + Math.sin(a) * glow), px, px);\n    }\n    // the folder's pixel icon floats above its sun\n    if (cam.z > 0.08) {\n      const ip = Math.max(2, Math.min(6, Math.round(5 * cam.z)));\n      FW.iconDraw(ctx, s.cat, sx, sy - 70 * cam.z - 6 * ip, ip, '#000');\n      FW.iconDraw(ctx, s.cat, sx - 1, sy - 70 * cam.z - 6 * ip - 1, ip, 'hsl(' + s.hue + ',90%,72%)');\n    }\n    // planets\n    const sz = Math.max(4, Math.round(PS * cam.z));\n    s.planets.forEach(p => {\n      const [wx, wy] = ppos(s, p, T);\n      const [x, y] = toS(wx, wy);\n      if (x \u003c -sz || y \u003c -sz || x > W + sz || y > H + sz) return;\n      const on = p === hover || p === sel;\n      ctx.globalAlpha = dim * (query && !match(p.it) ? 0.25 : 1);\n      const b = on ? 3 : 2;\n      ctx.fillStyle = on ? '#fff' : 'hsl(' + s.hue + ',70%,' + '45%' + ')';\n      ctx.fillRect(Math.round(x - sz / 2) - b, Math.round(y - sz / 2) - b, sz + b * 2, sz + b * 2);\n      const im = getImg(p.it);\n      if (im.complete && im.naturalWidth) {\n        try { ctx.drawImage(im, Math.round(x - sz / 2), Math.round(y - sz / 2), sz, sz); } catch (e) { /* broken image */ }\n      } else { ctx.fillStyle = '#000'; ctx.fillRect(Math.round(x - sz / 2), Math.round(y - sz / 2), sz, sz); }\n      ctx.globalAlpha = dim;\n    });\n    ctx.globalAlpha = 1;\n  }\n\n  function drawTip(p) {\n    const s = SYS.find(q => q.planets.includes(p));\n    if (!s) return;\n    const [x, y] = toS(...ppos(s, p, T));\n    ctx.font = '12px ui-monospace,Menlo,Consolas,monospace';\n    const w = ctx.measureText(p.it.title).width + 14;\n    ctx.fillStyle = '#000'; ctx.fillRect(Math.round(x - w / 2), Math.round(y - PS * cam.z / 2 - 30), Math.round(w), 20);\n    ctx.strokeStyle = '#fff'; ctx.strokeRect(Math.round(x - w / 2) + 0.5, Math.round(y - PS * cam.z / 2 - 30) + 0.5, Math.round(w), 20);\n    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';\n    ctx.fillText(p.it.title, Math.round(x), Math.round(y - PS * cam.z / 2 - 16));\n  }\n\n  /* ---------- picking ---------- */\n  function pick(sx, sy) {\n    const sz = Math.max(10, PS * cam.z);\n    for (let i = SYS.length - 1; i >= 0; i--) {\n      const s = SYS[i];\n      for (const p of s.planets) {\n        const [x, y] = toS(...ppos(s, p, T));\n        if (Math.abs(sx - x) \u003c sz / 2 + 3 && Math.abs(sy - y) \u003c sz / 2 + 3) return { p, s };\n      }\n    }\n    for (const s of SYS) {\n      const [x, y] = toS(s.x, s.y);\n      if (Math.hypot(sx - x, sy - y) \u003c Math.max(16, 64 * cam.z)) return { s };\n    }\n    return null;\n  }\n\n  function flyTo(x, y, z, ms) { follow = null; fly = { x0: cam.x, y0: cam.y, z0: cam.z, x1: x, y1: y, z1: Math.max(0.06, Math.min(4, z)), t0: performance.now(), ms: reduced.matches ? 1 : (ms || 900) }; }\n  function fitSys(s) { flyTo(s.x, s.y, Math.min(W, H) / (s.R * 2.3)); markList(s); }\n  function overview(ms) {\n    if (!SYS.length) return;\n    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;\n    SYS.forEach(s => { x0 = Math.min(x0, s.x - s.R); y0 = Math.min(y0, s.y - s.R); x1 = Math.max(x1, s.x + s.R); y1 = Math.max(y1, s.y + s.R); });\n    const padL = innerWidth > 700 ? 250 : 0;\n    const z = Math.min((W - padL) / (x1 - x0), (H - (padL ? 0 : 60)) / (y1 - y0)) * 0.9;\n    flyTo((x0 + x1) / 2 - padL / 2 / z, (y0 + y1) / 2 - (padL ? 0 : 20 / z), z, ms);\n    markList(null);\n  }\n\n  function showCard(p) {\n    sel = p;\n    const it = p.it;\n    const c = $('#card');\n    c.style.setProperty('--h', FW.catMeta(it.cat).hue);\n    $('#ci').src = FW.thumb(it); $('#ci').dataset.sig = it.id; delete $('#ci').dataset.fell;\n    $('#ck').innerHTML = FW.iconSVG(it.cat, 2);\n    $('#ct').textContent = it.title;\n    $('#co').href = it.link;\n    $('#cf').textContent = follow === p ? '◉' : '◎';\n    c.classList.add('on');\n  }\n  function hideCard() { sel = null; follow = null; $('#card').classList.remove('on'); }\n\n  /* ---------- input: pan, zoom, pinch, click ---------- */\n  const ptrs = new Map();\n  let downAt = null, panned = false, pinch0 = null;\n  cv.addEventListener('pointerdown', e => {\n    cv.setPointerCapture(e.pointerId);\n    ptrs.set(e.pointerId, [e.clientX, e.clientY]);\n    fly = null;\n    if (ptrs.size === 1) { downAt = [e.clientX, e.clientY]; panned = false; }\n    if (ptrs.size === 2) {\n      const [a, b] = [...ptrs.values()];\n      pinch0 = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: cam.z, w: toW((a[0] + b[0]) / 2, (a[1] + b[1]) / 2) };\n    }\n  });\n  cv.addEventListener('pointermove', e => {\n    if (!ptrs.has(e.pointerId)) {\n      if (e.pointerType === 'mouse') {\n        const h = pick(e.clientX, e.clientY);\n        hover = h && h.p ? h.p : null;\n        cv.classList.toggle('hot', !!h);\n      }\n      return;\n    }\n    const prev = ptrs.get(e.pointerId);\n    ptrs.set(e.pointerId, [e.clientX, e.clientY]);\n    if (ptrs.size === 2 && pinch0) {\n      const [a, b] = [...ptrs.values()];\n      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);\n      cam.z = Math.max(0.06, Math.min(4, pinch0.z * d / pinch0.d));\n      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;\n      cam.x = pinch0.w[0] - (mx - W / 2) / cam.z; cam.y = pinch0.w[1] - (my - H / 2) / cam.z;\n      panned = true; return;\n    }\n    if (ptrs.size === 1) {\n      if (!panned && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) { panned = true; follow = null; cv.classList.add('pan'); }\n      if (panned) { cam.x -= (e.clientX - prev[0]) / cam.z; cam.y -= (e.clientY - prev[1]) / cam.z; }\n    }\n  });\n  const up = e => {\n    if (!ptrs.has(e.pointerId)) return;\n    ptrs.delete(e.pointerId);\n    if (ptrs.size \u003c 2) pinch0 = null;\n    cv.classList.remove('pan');\n    if (ptrs.size === 0 && !panned && e.type === 'pointerup') {\n      const h = pick(e.clientX, e.clientY);\n      if (h && h.p) showCard(h.p);\n      else if (h && h.s) { hideCard(); fitSys(h.s); }\n      else hideCard();\n    }\n  };\n  cv.addEventListener('pointerup', up);\n  cv.addEventListener('pointercancel', up);\n  cv.addEventListener('wheel', e => {\n    e.preventDefault(); fly = null;\n    const before = toW(e.clientX, e.clientY);\n    cam.z = Math.max(0.06, Math.min(4, cam.z * Math.exp(-e.deltaY * 0.0015)));\n    cam.x = before[0] - (e.clientX - W / 2) / cam.z; cam.y = before[1] - (e.clientY - H / 2) / cam.z;\n  }, { passive: false });\n  cv.addEventListener('dblclick', e => { const w = toW(e.clientX, e.clientY); flyTo(w[0], w[1], cam.z * 2, 500); });\n  addEventListener('keydown', e => {\n    if (document.activeElement.tagName === 'INPUT') { if (e.key === 'Escape') document.activeElement.blur(); return; }\n    const k = e.key, step = 120 / cam.z;\n    if (k === '+' || k === '=') cam.z = Math.min(4, cam.z * 1.25);\n    else if (k === '-') cam.z = Math.max(0.06, cam.z / 1.25);\n    else if (k === '0') overview();\n    else if (k === 'Escape') hideCard();\n    else if (k === 'ArrowLeft') cam.x -= step; else if (k === 'ArrowRight') cam.x += step;\n    else if (k === 'ArrowUp') cam.y -= step; else if (k === 'ArrowDown') cam.y += step;\n    else if (k === 'Enter' && sel) FW.openItem(sel.it);\n  });\n\n  /* ---------- HUD ---------- */\n  function renderList() {\n    $('#list').innerHTML = SYS.map((s, i) => '\u003cbutton class=\"sys\" data-i=\"' + i + '\" style=\"--h:' + s.hue + '\" title=\"' + esc(s.cat) + '\" aria-label=\"' + esc(s.cat) + '\">' + FW.iconSVG(s.cat, 2) + '\u003c/button>').join('');\n  }\n  function markList(s) { document.querySelectorAll('.sys').forEach(b => b.classList.toggle('on', SYS[+b.dataset.i] === s)); }\n  $('#list').addEventListener('click', e => { const b = e.target.closest('.sys'); if (b) { fitSys(SYS[+b.dataset.i]); $('#hud').classList.remove('open'); } });\n  FW.search($('#q'), v => { query = v.toLowerCase(); });\n  $('#q').addEventListener('keydown', e => {\n    if (e.key !== 'Enter' || !query) return;\n    for (const s of SYS) for (const p of s.planets) if kitAudioContext)(); } catch (e) { AC = false; } } };\n  addEventListener('pointerdown', wake, true); addEventListener('keydown', wake, true);\n  function tone(f0, f1, dur, type, vol, delay) {\n    if (!AC || !SND) return;\n    const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();\n    o.type = type || 'square'; o.frequency.setValueAtTime(f0, t);\n    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);\n    g.gain.setValueAtTime(vol || .035, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);\n    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .03);\n  }\n  function hiss(dur, vol) {\n    if (!AC || !SND) return;\n    const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);\n    for (let i = 0; i \u003c n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2) * (Math.random() \u003c .3 ? 1 : .3);\n    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();\n    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = 900; g.gain.value = vol || .1;\n    s.connect(f).connect(g).connect(AC.destination); s.start();\n  }\n  const SFX = {\n    open: () => { tone(520, 780, .06); tone(780, 1040, .06, 'square', .025, .05); },\n    close: () => tone(700, 280, .08),\n    err: () => tone(150, 110, .2, 'sawtooth', .05),\n    tick: () => tone(1500, 0, .015, 'square', .012),\n    crunch: () => { hiss(.4, .14); tone(90, 50, .3, 'square', .04); },\n    jack: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0, .12, 'square', .03, i * .08)),\n    boot: () => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0, .3, 'triangle', .05, i * .13)),\n    luck: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0, .1, 'triangle', .04, i * .07)),\n    spin: () => { for (let i = 0; i \u003c 14; i++) tone(900 + (i % 3) * 120, 0, .02, 'square', .012, i * .06); }\n  };\n  function setSnd(on) { SND = on; FW.lsSet('desk.snd  spin;\n      el.addEventListener('click', e => { const r = e.target.closest('.reel'); if (r && !busy && landed[+r.dataset.r]) FW.openItem(landed[+r.dataset.r]); });\n      el.addEventListener('keydown', e => { if (e.key === ' ' && e.target === lever) { e.preventDefault(); spin(); } });\n    }, 380, 250, from);\n  }\n  function burst(near, cat) {\n    if (reduced.matches) return;\n    const b = near.getBoundingClientRect(), fx = $('#fx');\n    for (let i = 0; i \u003c 18; i++) {\n      const d = document.createElement('div');\n      d.innerHTML = FW.iconSVG(cat, 3, 'hsl(' + (FW.catMeta(cat).hue + i * 20) % 360 + ',90%,65%)');\n      d.style.left = b.left + b.width / 2 + 'px'; d.style.top = b.top + b.height / 2 + 'px';\n      fx.appendChild(d);\n      const a = Math.random() * Math.PI * 2, r = rnd(80, 200);\n      d.animate([{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 }, { transform: 'translate(calc(-50% + ' + Math.cos(a) * r + 'px),calc(-50% + ' + (Math.sin(a) * r + 60) + 'px)) scale(1) rotate(' + rnd(-200, 200) + 'deg)', opacity: 0 }], { duration: rnd(800, 1300), easing: EASE }).onfinish = () => d.remove();\n    }\n  }\n\n  /* ================= data ================= */\n  async function sync() {\n    FW.lsSet('desk.gh', '1');\n    FW.toast('⟳ …');\n    ITEMS = await FW.all({ gh: true, force: true });\n    refresh();\n    if (ITEMS.some(i => i.cat === 'repo')) explorer('repo'); else FW.toast('⟳ 0');\n  }\n  function refresh() { renderDesk(); Object.values(wins).forEach(W => W.redraw && W.redraw()); }\n\n  let rt = 0;\n  addEventListener('resize', () => {\n    clearTimeout(rt);\n    rt = setTimeout(() => {\n      sizeWall(); renderDesk();\n      Object.values(wins).forEach(W => {\n        const el = W.el;\n        if (mobile()) el.classList.add('max');\n        el.style.left = Math.max(0, Math.min(el.offsetLeft, innerWidth - 80)) + 'px';\n        el.style.top = Math.max(0, Math.min(el.offsetTop, innerHeight - 80)) + 'px';\n      });\n    }, 150);\n  });\n\n  document.body.classList.toggle('meridian', MER);\n  setStartFace();\n  sizeWall();\n  ITEMS = await FW.all({ gh: FW.ls('desk.gh', '') === '1' });\n  renderDesk();\n})();\n\u003c/script>\n"}, "terminal": {"name": "Terminal", "glyph": "›_", "pos": "tr", "html": "\u003cstyle>\n  /* TERMINAL - fwsh on a phosphor CRT, thumbnails in the shell */\n  :root{--fg:#33ff66;--dim:#1a8c3a;--bg:#010a03;--glow:#33ff6688;--fw-accent:#33ff66}\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:#000;overflow:hidden}\n  #stars{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;opacity:.55}\n  .crt{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;color:var(--fg);font:15px/1.45 \"VT323\",\"Courier New\",ui-monospace,Menlo,monospace;text-shadow:0 0 4px var(--glow),0 0 1px var(--fg);background:radial-gradient(ellipse at center,color-mix(in srgb,var(--bg) 70%,transparent) 0%,#000000cc 100%)}\n  .crt::before{content:\"\";position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(#0000 0 2px,#00000066 2px 3px)}\n  .crt::after{content:\"\";position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,#0000 55%,#000c 100%)}\n  #out{flex:1;min-height:0;overflow-y:auto;padding:58px 22px 6px;scrollbar-width:thin;scrollbar-color:var(--dim) #0000;overscroll-behavior:contain}\n  .ln{white-space:pre-wrap;word-break:break-word;min-height:1.45em}\n  .ln.dim{color:var(--dim)}\n  .ln.err{color:#ff5a5a;text-shadow:0 0 4px #ff5a5a88}\n  .u{color:var(--fg);font-weight:bold}\n  .p{color:var(--dim)}\n  .cmdk{color:#fff}\n  .lk{color:var(--fg);text-decoration:underline;cursor:pointer;background:none;border:0;font:inherit;padding:0;text-shadow:inherit}\n  .lk:hover,.lk:focus-visible{background:var(--fg);color:#000;text-shadow:none;outline:none}\n  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin:8px 0 10px;max-width:980px;white-space:normal}\n  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:none;border:0;padding:0;color:var(--fg);font:inherit;font-size:13px;text-align:left;cursor:pointer;text-shadow:inherit;min-width:0}\n  .tile img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--dim);filter:sepia(.3) saturate(1.3) brightness(.92);box-shadow:0 0 10px var(--glow);background:#000}\n  .tile .d{width:100%;aspect-ratio:1;border:1px dashed var(--dim);display:grid;place-items:center;color:var(--fg);filter:drop-shadow(0 0 4px var(--glow))}\n  .tile:hover img,.tile:focus-visible img{border-color:var(--fg);filter:none;outline:2px solid var(--fg)}\n  .tile:hover .d,.tile:focus-visible .d{border-style:solid;border-color:var(--fg)}\n  .tile:focus-visible{outline:none}\n  .tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .tile i{font-style:normal;color:var(--dim)}\n  .cardx{display:flex;gap:18px;margin:8px 0 10px;flex-wrap:wrap;white-space:normal}\n  .cardx img{width:160px;height:160px;object-fit:cover;border:1px solid var(--fg);box-shadow:0 0 16px var(--glow);background:#000}\n  table{border-collapse:collapse}\n  td{padding:0 18px 0 0;vertical-align:top;white-space:nowrap}\n  .row{display:flex;align-items:center;padding:6px 22px 14px;flex:none}\n  .row .ps{white-space:pre}\n  #in{flex:1;background:none;border:0;outline:none;color:#fff;font:inherit;text-shadow:inherit;caret-color:var(--fg);padding:0;min-width:0;font-size:max(16px,1em)}\n  .keys{display:none;gap:6px;padding:0 12px 10px;flex-wrap:wrap;flex:none}\n  .keys button{background:none;border:1px solid var(--dim);color:var(--fg);font:inherit;font-size:14px;padding:4px 10px;text-shadow:inherit;cursor:pointer}\n  .keys button:active{background:var(--fg);color:#000}\n  @media (max-width:700px),(pointer:coarse){.keys{display:flex}.crt{font-size:14px}#out{padding:56px 12px 6px}.row{padding:6px 12px 8px}}\n  @media (prefers-reduced-motion:no-preference){.crt{animation:flick 6s infinite steps(1)}}\n  @keyframes flick{0%,100%{opacity:1}47%{opacity:.96}48%{opacity:1}}\n\u003c/style>\n\u003ccanvas id=\"stars\" aria-hidden=\"true\">\u003c/canvas>\n\u003cdiv class=\"crt\" id=\"crt\">\n  \u003cdiv id=\"out\" role=\"log\" aria-live=\"polite\">\u003c/div>\n  \u003cdiv class=\"row\">\u003cspan class=\"ps\" id=\"ps\">\u003c/span>\u003cinput id=\"in\" autocomplete=\"off\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" enterkeyhint=\"go\" aria-label=\"command\">\u003c/div>\n  \u003cdiv class=\"keys\">\u003cbutton data-run=\"ls\">ls\u003c/button>\u003cbutton data-run=\"cd ..\">cd ..\u003c/button>\u003cbutton data-run=\"tree\">tree\u003c/button>\u003cbutton data-run=\"help\">help\u003c/button>\u003cbutton data-fill=\"find \">find\u003c/button>\u003cbutton data-run=\"clear\">clear\u003c/button>\u003c/div>\n\u003c/div>\n\u003cscript>/*@@CORE@@*/\u003c/script>\n\u003cscript>\n(async function () {\n  const $ = s => document.querySelector(s);\n  const esc = FW.esc;\n  const out = $('#out'), inp = $('#in'), crt = $('#crt');\n  const sky = FW.starfield($('#stars'), { density: 700, colors: ['#33ff66', '#33ff66', '#b6ffc8', '#ffffff'], ignore: '.crt' });\n  const coarse = matchMedia('(pointer:coarse)');\n\n  /* keep the shell inside the visible area when an on-screen keyboard opens */\n  const vv = window.visualViewport;\n  function fitVV() {\n    if (!vv) return;\n    crt.style.height = vv.height + 'px';\n    crt.style.top = vv.offsetTop + 'px';\n    out.scrollTop = out.scrollHeight;\n  }\n  if (vv) { vv.addEventListener('resize', fitVV); vv.addEventListener('scroll', fitVV); }\n\n  const THEMES = {\n    green: ['#33ff66', '#1a8c3a', '#010a03'], amber: ['#ffb000', '#8c6100', '#0a0600'],\n    ice: ['#9fe8ff', '#4a8ca3', '#01070a'], rose: ['#ff6ad5', '#9a3a80', '#0a0108'], white: ['#e8e8e8', '#7a7a7a', '#060606']\n  };\n  function theme(n) {\n    const t = THEMES[n]; if (!t) return false;\n    const r = document.documentElement.style;\n    r.setProperty('--fg', t[0]); r.setProperty('--dim', t[1]); r.setProperty('--bg', t[2]); r.setProperty('--glow', t[0] + '88'); r.setProperty('--fw-accent', t[0]);\n    FW.lsSet('term.theme', n); return true;\n  }\n  theme(FW.ls('term.theme', 'green'));\n  if (FW.ls('term.stars', 'on') === 'off') { sky.paused = true; $('#stars').style.display = 'none'; }\n\n  let ITEMS = [], cwd = '', lastList = [];\n  let hist = []; try { hist = JSON.parse(FW.ls('term.hist', '[]')); if (!Array.isArray(hist)) hist = []; } catch (e) { hist = []; }\n  let hi = hist.length, draft = '';\n  const t0 = Date.now();\n  const slug = s => String(s).toLowerCase().replace(/[^a-z0-9ꟻ]+/g, '-').replace(/^-|-$/g, '') || 'x';\n  /* titles are long; the shell uses the part before any \" — \", \" - \" or \" inspired\" */\n  const short = t => String(t).split(/\\s+[—–-]\\s+|\\s+inspired\\b/i)[0].trim() || String(t);\n  const name = it => slug(short(it.title));\n  const dirs = () => [...new Set(ITEMS.map(i => i.cat))].sort(FW.catSort);\n  const dirOf = s => { const k = slug(String(s).replace(/^~?\\/+/, '').replace(/\\/+$/, '')); return dirs().find(d => slug(d) === k); };\n  const inDir = d => ITEMS.filter(i => i.cat === d).sort((a, b) => name(a).localeCompare(name(b)));\n  const pathStr = () => '~' + (cwd ? '/' + slug(cwd) : '');\n  const promptHTML = () => '\u003cspan class=\"u\">guest@fweddle\u003c/span>:\u003cspan class=\"p\">' + esc(pathStr()) + '\u003c/span>$ ';\n  function setPrompt() { $('#ps').innerHTML = promptHTML(); }\n\n  function print(html, cls) {\n    const d = document.createElement('div'); d.className = 'ln ' + (cls || ''); d.innerHTML = html; out.appendChild(d);\n    out.scrollTop = out.scrollHeight;\n    d.querySelectorAll('img').forEach(im => { if (!im.complete) im.addEventListener('load', () => { out.scrollTop = out.scrollHeight; }, { once: true }); });\n    return d;\n  }\n  const say = (t, cls) => print(esc(t), cls);\n  const img = it => '\u003cimg src=\"' + esc(FW.thumb(it)) + '\" data-sig=\"' + it.id + '\" alt=\"' + esc(it.title) + '\">';\n\n  /* name, number (from the latest listing) or prefix -> item */\n  function resolve(arg, pool) {\n    if (!arg) return null;\n    const a = arg.trim();\n    if (/^\\d+$/.test(a)) return lastList[+a - 1] || null;\n    const s = slug(a);\n    pool = pool || (cwd ? inDir(cwd).concat(ITEMS) : ITEMS);\n    return pool.find(i => name(i) === s) || pool.find(i => slug(i.title) === s) || pool.find(i => name(i).startsWith(s)) || pool.find(i => name(i).includes(s)) || null;\n  }\n\n  function tilesItems(list, showCat) {\n    lastList = list;\n    return '\u003cdiv class=\"tiles\">' + list.map((it, i) =>\n      '\u003cbutton class=\"tile\" data-open=\"' + it.id + '\" title=\"' + esc(it.title) + '\">' + img(it) +\n      '\u003cspan>\u003ci>' + (i + 1) + '.\u003c/i> ' + esc(name(it)) + (it.external ? ' ↗' : '') + '\u003c/span>' + (showCat ? '\u003ci>' + esc(slug(it.cat)) + '/\u003c/i>' : '') + '\u003c/button>').join('') + '\u003c/div>';\n  }\n  function tilesDirs() {\n    return '\u003cdiv class=\"tiles\">' + dirs().map(d =>\n      '\u003cbutton class=\"tile\" data-run=\"cd ' + esc(slug(d)) + '\" title=\"' + esc(slug(d)) + '/\">\u003cdiv class=\"d\">' + FW.iconSVG(d, 5) + '\u003c/div>\u003cspan>' + esc(slug(d)) + '/\u003c/span>\u003c/button>').join('') + '\u003c/div>';\n  }\n  function longList(list) {\n    lastList = list;\n    return '\u003ctable>' + list.map((it, i) => '\u003ctr>\u003ctd class=\"p\">' + (it.external ? 'lrwxrwxrwx' : '-rwxr-xr-x') + '\u003c/td>\u003ctd class=\"p\">' + esc((it.ext || 'file').padEnd(5)) + '\u003c/td>\u003ctd>' +\n      '\u003cbutton class=\"lk\" data-open=\"' + it.id + '\" title=\"' + esc(it.title) + '\">' + (i + 1) + '. ' + esc(name(it)) + '\u003c/button>' + (it.external ? ' \u003cspan class=\"p\">-> ' + esc(it.link.replace(/^https?:\\/\\//, '').slice(0, 40)) + '\u003c/span>' : '') + '\u003c/td>\u003c/tr>').join('') + '\u003c/table>';\n  }\n  function card(it) {\n    return '\u003cdiv class=\"cardx\">' + img(it) + '\u003cdiv>\u003cdiv class=\"u\">' + esc(it.title) + '\u003c/div>\u003cdiv class=\"p\">~/' + esc(slug(it.cat)) + '/' + esc(name(it)) + ' · ' + esc(it.ext || 'file') + (it.size ? ' · ' + esc(FW.fmtSize(it.size)) : '') + '\u003c/div>\u003cbr>' +\n      '\u003cbutton class=\"lk\" data-open=\"' + it.id + '\">[ open ]\u003c/button>' + '\u003c/div>\u003c/div>';\n  }\n  function launch(it) { say('opening ' + name(it) + ' …', 'dim'); FW.openItem(it); }\n\n  const CMDS = {\n    help: ['commands', () => {\n      print(Object.keys(CMDS).filter(k => CMDS[k][0]).map(k => '\u003cbutton class=\"lk\" data-run=\"' + k + '\">' + k + '\u003c/button>' + ' '.repeat(Math.max(1, 9 - k.length)) + '\u003cspan class=\"p\">' + esc(CMDS[k][0]) + '\u003c/span>').join('\\n'));\n    }],\n    ls: ['list (ls -l for detail)', a => {\n      const long = a.includes('-l');\n      const target = a.filter(x => x !== '-l')[0];\n      const d = target ? (/^(~\\/?|\\/|\\.\\.\\/?)$/.test(target) ? '' : dirOf(target)) : cwd;\n      if (target && d === undefined) return say('ls: ' + target + ': no such folder', 'err');\n      if (!d) return print(tilesDirs());\n      const list = inDir(d);\n      print(long ? longList(list) : tilesItems(list));\n    }],\n    cd: ['change folder', a => {\n      const t = a[0] || '~';\n      if (t === '~' || t === '/' || t === '~/' || t === '..' || t === '../') { cwd = ''; setPrompt(); return CMDS.ls[1]([]); }\n      const d = dirOf(t);\n      if (!d) return say('cd: ' + t + ': no such folder', 'err');\n      cwd = d; setPrompt();\n      CMDS.ls[1]([]);\n    }],\n    tree: ['everything at once', () => {\n      const ds = dirs();\n      let s = '\u003cspan class=\"u\">~\u003c/span>\\n';\n      ds.forEach((d, di) => {\n        const lastD = di === ds.length - 1;\n        const list = inDir(d);\n        s += (lastD ? '└── ' : '├── ') + '\u003cbutton class=\"lk\" data-run=\"cd ' + esc(slug(d)) + '\">' + esc(slug(d)) + '/\u003c/button>\\n';\n        list.forEach((it, i) => {\n          s += (lastD ? '    ' : '│   ') + (i === list.length - 1 ? '└── ' : '├── ') + '\u003cbutton class=\"lk\" data-open=\"' + it.id + '\" title=\"' + esc(it.title) + '\">' + esc(name(it)) + '\u003c/button>' + (it.external ? ' \u003cspan class=\"p\">↗\u003c/span>' : '') + '\\n';\n        });\n      });\n      print(s);\n    }],\n    open: ['open an app (name or number)', a => {\n      if (!a.length) return say('usage: open \u003cname|number>', 'dim');\n      const it = resolve(a.join(' '));\n      if (!it) return say('open: ' + a.join(' ') + ': not found', 'err');\n      launch(it);\n    }],\n    cat: ['inspect an app', a => {\n      if (!a.length) return say('usage: cat \u003cname|number>', 'dim');\n      const it = resolve(a.join(' '));\n      if (!it) return say('cat: ' + a.join(' ') + ': not found', 'err');\n      print(card(it));\n    }],\n    find: ['search', a => {\n      const q = a.join(' ').toLowerCase();\n      if (!q) return say('usage: find \u003cwords>', 'dim');\n      const hits = ITEMS.filter(i => (i.title + ' ' + i.cat + ' ' + i.tags.join(' ')).toLowerCase().includes(q));\n      if (!hits.length) return say('find: nothing for \"' + q + '\"', 'err');\n      print(tilesItems(hits, true));\n    }],\n    sync: ['pull every page from the repo', async () => {\n      say('…', 'dim');\n      FW.lsSet('term.gh', '1');\n      ITEMS = await FW.all({ gh: true, force: true });\n      const n = ITEMS.filter(i => i.cat === 'repo').length;\n      n ? print('\u003cbutton class=\"lk\" data-run=\"cd repo\">~/repo\u003c/button> \u003cspan class=\"p\">' + n + '\u003c/span>') : say('nothing new', 'dim');\n    }],\n    theme: [Object.keys(THEMES).join(' · '), a => { if (!theme(a[0])) say('theme ' + Object.keys(THEMES).join(' | '), 'dim'); }],\n    stars: ['on · off', a => {\n      const off = a[0] === 'off' ? true : a[0] === 'on' ? false : !sky.paused;\n      sky.paused = off; $('#stars 3c/div>\n\u003c/div>\n\u003cscript>/*@@CORE@@*/\u003c/script>\n\u003cscript>\n(async function () {\n  const $ = s => document.querySelector(s);\n  const esc = FW.esc;\n  FW.starfield($('#stars'), { density: 520, colors: ['#ff6ad5', '#c774e8', '#ad8cff', '#94d0ff', '#7cffcb', '#ffffff', '#ffffff'], ignore: '.tile,button,input,select' });\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)');\n  const SIZES = { s: '110px', m: '150px', l: '210px' };\n  const st = { cat: 'all', q: '', sort: 'fresh', size: FW.ls('holo.size', 'm'), seed: 1 };\n  let ITEMS = [];\n  const els = new Map();\n\n  function visible() {\n    const q = st.q.toLowerCase();\n    let a = ITEMS.filter(i => (st.cat === 'all' || i.cat === st.cat) &&\n      (!q || (i.title + ' ' + i.cat + ' ' + i.tags.join(' ')).toLowerCase().includes(q)));\n    if (st.sort === 'shuffle') a.sort((x, y) => FW.hash32(FW.hashStr(x.id) ^ st.seed) - FW.hash32(FW.hashStr(y.id) ^ st.seed));\n    else a.sort((x, y) => y.order - x.order);\n    return a;\n  }\n  /* the newest thing in each folder gets the big foil */\n  function featured() {\n    const best = new Map();\n    ITEMS.forEach(i => { const b = best.get(i.cat); if (!b || i.order > b.order) best.set(i.cat, i); });\n    return new Set([...best.values()].map(i => i.id));\n  }\n\n  function tileEl(it, feat) {\n    const h = FW.hashStr(it.id) % 9;\n    const shape = feat ? 'big' : h === 0 ? 'wide' : h === 1 ? 'tall' : '';\n    const a = document.createElement('a');\n    a.className = 'tile ' + shape;\n    a.href = it.link; a.target = '_blank'; a.rel = 'noopener'; a.title = it.title;\n    a.style.setProperty('--h', FW.catMeta(it.cat).hue);\n    a.innerHTML = '\u003cimg src=\"' + esc(FW.thumb(it)) + '\" data-sig=\"' + it.id + '\" alt=\"' + esc(it.title) + '\" loading=\"lazy\" draggable=\"false\">\u003ci class=\"holo\">\u003c/i>' +\n      '\u003cspan class=\"k\">' + FW.iconSVG(it.cat, 2) + '\u003c/span>';\n    a.addEventListener('pointermove', e => {\n      if (redu
