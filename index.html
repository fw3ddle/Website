px;padding:0 8px}\n    .shapes .tb{width:30px}\n  }\n\u003c/style>\n\u003ccanvas id=\"stars\" aria-hidden=\"true\">\u003c/canvas>\n\u003ccanvas id=\"cv\" aria-label=\"apps on a turning sphere\">\u003c/canvas>\n\u003cdiv class=\"bar\">\n  \u003ca class=\"brand\" href=\"/\">ꟻweddle.com\u003c/a>\n  \u003cspan class=\"sp\">\u003c/span>\n  \u003cdiv class=\"shapes\" id=\"shapes\">\u003c/div>\n  \u003cinput id=\"q\">\n  \u003cbutton class=\"tb\" id=\"sync\" title=\"sync repo\">⟳\u003c/button>\n  \u003cbutton class=\"tb\" data-fwx title=\"layout\">\u003c/button>\n\u003c/div>\n\u003cdiv class=\"rail\" id=\"rail\">\u003c/div>\n\u003cdiv class=\"tip\" id=\"tip\">\u003c/div>\n\u003cscript>/*@@CORE@@*/\u003c/script>\n\u003cscript>\n(async function () {\n  const $ = s => document.querySelector(s);\n  FW.starfield($('#stars'), { density: 620, colors: ['#ffffff', '#ffffff', '#9fe8ff', '#caa8ff', '#7cffcb'], hold: false });\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)');\n  const cv = $('#cv'), ctx = cv.getContext('2d');\n  let W = 0, H = 0, DPR = 1;\n  let ITEMS = [], TILES = [], CATS = [], query = '';\n  const cam = { yaw: 0.4, pitch: -0.28, zoom: 1, vy: 0, vp: 0 };\n  let shape = FW.ls('sphere.shape', 'sphere');\n  let morph = null;                 // { from:[...], to:[...], t0, ms }\n  let aim = null;                   // camera tween { y0,p0,y1,p1,t0,ms }\n  let hover = null, drawn = [], flash = null;\n  const D = 3.2;                    // camera distance in unit radii\n  const PX = 40;                    // thumbnails are resampled to PX x PX for chunky pixels\n  const ease = t => t \u003c .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;\n\n  function resize() {\n    DPR = Math.min(2, devicePixelRatio || 1);\n    W = innerWidth; H = innerHeight;\n    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);\n  }\n  resize();\n  addEventListener('resize', resize);\n\n  /* every thumbnail is resampled once onto a tiny canvas, then drawn big with smoothing off */\n  function pixThumb(it) {\n    const c = document.createElement('canvas'); c.width = c.height = PX;\n    const x = c.getContext('2d');\n    x.fillStyle = '#000'; x.fillRect(0, 0, PX, PX);\n    const im = new Image();\n    const paint = () => {\n      const s = Math.min(im.naturalWidth, im.naturalHeight);\n      if (!s) return;\n      x.imageSmoothingEnabled = s > PX * 1.5;   // average big images, keep tiny pixel art crisp\n      x.drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, PX, PX);\n    };\n    im.onload = paint;\n    im.onerror = () => { im.onerror = null; im.src = FW.sigil(it.id); };\n    im.src = FW.thumb(it);\n    return c;\n  }\n\n  /* ---------- shapes: unit-scale positions, normals and tile sizes ---------- */\n  const GOLD = Math.PI * (3 - Math.sqrt(5));\n  function layoutFor(name, n) {\n    const out = [];\n    if (name === 'sphere') {\n      const side = Math.min(0.42, Math.sqrt(4 * Math.PI / n) * 0.56);\n      for (let i = 0; i \u003c n; i++) {\n        const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), th = i * GOLD;\n        const p = [Math.cos(th) * r, y, Math.sin(th) * r];\n        out.push({ p, n: p.slice(), s: side });\n      }\n    } else if (name === 'torus') {\n      const R0 = 0.78, r0 = 0.36;\n      const side = Math.min(0.34, Math.sqrt(4 * Math.PI * Math.PI * R0 * r0 / n) * 0.55);\n      for (let i = 0; i \u003c n; i++) {\n        const u = 2 * Math.PI * (i + 0.5) / n, v = 2 * Math.PI * ((i * 0.618034) % 1);\n        const cu = Math.cos(u), su = Math.sin(u), cvv = Math.cos(v), sv = Math.sin(v);\n        out.push({ p: [(R0 + r0 * cvv) * cu, r0 * sv, (R0 + r0 * cvv) * su], n: [cvv * cu, sv, cvv * su], s: side });\n      }\n    } else if (name === 'helix') {\n      const per = Math.ceil(n / 2), turns = 1.6 + per / 14, len = 2.3;\n      const side = Math.max(0.08, Math.min(0.3, len / per * 0.85));\n      for (let i = 0; i \u003c n; i++) {\n        const strand = i % 2, k = Math.floor(i / 2), t = per > 1 ? k / (per - 1) : 0.5;\n        const a = t * turns * 2 * Math.PI + strand * Math.PI;\n        const p = [Math.cos(a) * 0.55, len / 2 - t * len, Math.sin(a) * 0.55];\n        out.push({ p, n: [Math.cos(a), 0, Math.sin(a)], s: side });\n      }\n    } else {\n      const cols = Math.max(1, Math.ceil(Math.sqrt(n * 1.5))), rows = Math.ceil(n / cols);\n      const cell = Math.min(0.62, 2.5 / cols, 1.9 / rows);\n      for (let i = 0; i \u003c n; i++) {\n        const c = i % cols, r = Math.floor(i / cols);\n        out.push({ p: [(c - (cols - 1) / 2) * cell, ((rows - 1) / 2 - r) * cell, 0], n: [0, 0, 1], s: cell * 0.86 });\n      }\n    }\n    return out;\n  }\n  const SHAPES = [\n    ['sphere', 'sphere', ['..###..', '.#####.', '###.###', '##...##', '###.###', '.#####.', '..###..']],\n    ['torus', 'torus', ['.#####.', '#######', '##...##', '#.....#', '##...##', '#######', '.#####.']],\n    ['helix', 'helix', ['#....##', '.#..#..', '..##...', '..##...', '.#..#..', '#....#.', '#....##']],\n    ['plane', 'plane', ['##.##.#', '##.##.#', '.......', '##.##.#', '##.##.#', '.......', '##.##.#']]\n  ];\n  const tinySVG = rows => {\n    let d = ''; rows.forEach((r, y) => { for (let x = 0; x \u003c r.length; x++) if (r[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; });\n    return '\u003csvg viewBox=\"0 0 7 7\" width=\"14\" height=\"14\" shape-rendering=\"crispEdges\">\u003cpath fill=\"currentColor\" d=\"' + d + '\"/>\u003c/svg>';\n  };\n  $('#shapes').innerHTML = SHAPES.map(s => '\u003cbutton class=\"tb\" data-shape=\"' + s[0] + '\" title=\"' + s[1] + '\">' + tinySVG(s[2]) + '\u003c/button>').join('');\n  function markShape() { document.querySelectorAll('[data-shape]').forEach(b => b.classList.toggle('on', b.dataset.shape === shape)); }\n\n  function build(keepMorph) {\n    const list = ITEMS.slice().sort((a, b) => FW.catSort(a.cat, b.cat) || a.order - b.order);\n    const old = new Map(TILES.map(t => [t.it.id, t]));\n    const L = layoutFor(shape, list.length);\n    TILES = list.map((it, i) => {\n      const prev = old.get(it.id);\n      return { it, img: prev ? prev.img : pixThumb(it), hue: FW.catMeta(it.cat).hue, cur: keepMorph && prev ? prev.cur : L[i], i };\n    });\n    CATS = [...new Set(list.map(i => i.cat))];\n    $('#rail').innerHTML = CATS.map(c => '\u003cbutton data-cat=\"' + FW.esc(c) + '\" style=\"--h:' + FW.catMeta(c).hue + '\" title=\"' + FW.esc(c) + '\">' + FW.iconSVG(c, 2) + '\u003c/button>').join('');\n    markShape();\n  }\n  function setShape(name) {\n    if (!SHAPES.some(s => s[0] === name)) return;\n    const n = TILES.length, to = layoutFor(name, n);\n    const from = TILES.map(t => current(t));\n    shape = name; FW.lsSet('sphere.shape', name); markShape();\n    aimShape(reduced.matches ? 1 : 1300);\n    if (reduced.matches) { TILES.forEach((t, i) => { t.cur = to[i]; }); morph = null; return; }\n    morph = { from, to, t0: performance.now(), ms: 1300 };\n  }\n  function current(t) {\n    if (!morph) return t.cur;\n    const k = ease(Math.min(1, (performance.now() - morph.t0) / morph.ms));\n    const a = morph.from[t.i], b = morph.to[t.i];\n    const lerp = (u, v) => u.map((x, j) => x + (v[j] - x) * k);\n    return { p: lerp(a.p, b.p), n: lerp(a.n, b.n), s: a.s + (b.s - a.s) * k };\n  }\n\n  /* ---------- rotation + projection ---------- */\n  function rot(v, yaw, pitch) {\n    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);\n    const x = v[0] * cy - v[2] * sy, z1 = v[0] * sy + v[2] * cy;\n    const y = v[1] * cp - z1 * sp, z = v[1] * sp + z1 * cp;\n    return [x, y, z];\n  }\n  const radius = () => Math.min(W, H) * (W \u003c 640 ? 0.34 : 0.33) * cam.zoom;\n  function proj(v) {\n    const f = D / (D - v[2]), R = radius();\n    return [W / 2 + v[0] * R * f, H / 2 - v[1] * R * f, f];\n  }\n\n  /* guide-lines: the underlying form drawn as dotted pixels */\n  let guideT = 0, guideCache = null;\n  function guides() {\n    if (guideCache && guideCache.shape er(b => {\n      b.y -= b.v * dt * (reduced.matches ? 0.3 : 1);\n      const x = b.x + Math.sin(ts * 0.004 + b.ph) * 1.2;\n      if (b.r === 1) px(x, b.y);\n      else { px(x - 1, b.y); px(x + 1, b.y); px(x, b.y - 1); px(x, b.y + 1); }\n      return b.y > SURF + 1;\n    });\n  }\n  function drawMotes(ts) {\n    ctx.fillStyle = phase === 'night' ? '#7cffcb' : 'rgba(255,255,255,.35)';\n    motes.forEach(m => {\n      if (phase === 'night' && Math.sin(ts * 0.002 + m.ph * 5) \u003c 0.4) return;\n      px(m.x + Math.sin(ts * 0.0005 + m.ph) * 3, m.y + Math.cos(ts * 0.0004 + m.ph) * 2);\n    });\n  }\n  function drawFins(f, ts, x, y, sx) {\n    // fins, tails, flippers and tentacles are drawn live so they move\n    const g = f.g, wag = reduced.matches ? 0 : Math.sin(ts * 0.012 + f.ph * 4);\n    const fin = 'hsl(' + f.hue + ',80%,' + (phase === 'night' ? 55 : 60) + '%)';\n    ctx.fillStyle = fin;\n    const back = sx > 0 ? x : x + g.w, dirx = sx > 0 ? -1 : 1, mid = y + g.h / 2;\n    if (f.kind === 'fish' || f.kind === 'angel') {\n      const tl = Math.round(g.h * 0.45);\n      for (let k = 1; k \u003c= tl; k++) { const spread = Math.round(k * 0.8); px(back + dirx * k, mid - spread + wag * k * 0.25, 1, spread * 2 + 1); }\n      // dorsal fin\n      const df = f.kind === 'angel' ? Math.round(g.h * 0.45) : Math.round(g.h * 0.25);\n      for (let k = 0; k \u003c df; k++) px(x + g.w / 2 - k * 0.6 * sx, y - k, Math.max(1, Math.round(g.w * 0.3) - k), 1);\n      if (f.kind === 'angel') for (let k = 0; k \u003c df; k++) px(x + g.w / 2 - k * 0.6 * sx, y + g.h + k - 1, Math.max(1, Math.round(g.w * 0.25) - k), 1);\n    } else if (f.kind === 'turtle') {\n      const head = sx > 0 ? x + g.w : x - 4;\n      ctx.fillStyle = '#6fbf73'; px(head, mid - 3, 4, 5); ctx.fillStyle = '#000'; px(head + (sx > 0 ? 2 : 1), mid - 2);\n      ctx.fillStyle = '#5aa35e';\n      const p = Math.round(wag * 2);\n      px(x + g.w * 0.65, y + g.h - 1 + p, 4, 2); px(x + g.w * 0.65, y - 1 - p, 4, 2);\n      px(x + g.w * 0.15, y + g.h - 1 - p, 3, 2); px(x + g.w * 0.15, y - 1 + p, 3, 2);\n    } else if (f.kind === 'jelly') {\n      const n = 5;\n      for (let i = 0; i \u003c n; i++) {\n        const tx = x + 2 + i * (g.w - 4) / (n - 1), len = Math.round(g.w * 0.8);\n        ctx.fillStyle = i % 2 ? fin : 'hsla(' + f.hue + ',90%,80%,.8)';\n        for (let k = 1; k \u003c len; k++) px(tx + Math.sin(ts * 0.004 + k * 0.5 + i) * (k * 0.12), y + g.h + k - 1);\n      }\n      if (phase === 'night') {\n        // bioluminescence: a dithered round halo that breathes\n        const r = g.w * (0.85 + Math.sin(ts * 0.003 + f.ph) * 0.12), cx = x + g.w / 2, cy = y + g.h * 0.8;\n        ctx.fillStyle = 'hsla(' + f.hue + ',100%,72%,.5)';\n        for (let yy = -r; yy \u003c= r; yy++) for (let xx = -r; xx \u003c= r; xx++) {\n          const d = Math.hypot(xx, yy) / r;\n          if (d > 1 || d \u003c 0.55) continue;\n          if (((Math.round(cx + xx) + Math.round(cy + yy)) & 1) || d > 0.85 && ((Math.round(cx + xx) ^ Math.round(cy + yy)) & 2)) continue;\n          px(cx + xx, cy + yy);\n        }\n      }\n    }\n  }\n  function drawFlag(f, x, y) {\n    // the school's leader carries its folder's pixel icon on a little flag\n    const rows = FW.iconRows(f.it.cat), iw = rows[0].length, ih = rows.length;\n    const pole = Math.round(f.g.h * 0.7) + 6, top = Math.round(y - pole), cx = Math.round(x + f.g.w / 2);\n    ctx.fillStyle = '#d9d2c0'; px(cx, top, 1, pole);\n    const fx = cx + 1, fw = iw + 2, fh = ih + 2;\n    ctx.fillStyle = '#0a0f1c'; px(fx, top, fw, fh);\n    FW.iconDraw(ctx, f.it.cat, fx + fw / 2, top + fh / 2, 1, 'hsl(' + f.hue + ',85%,62%)');\n  }\n  function drawFish(ts) {\n    const ql = query.toLowerCase();\n    const order = FISH.slice().sort((a, b) => (a === hover || a === tapSel) - (b === hover || b === tapSel) || a.y - b.y);\n    for (const f of order) {\n      if (!f.side) continue;\n      const g = f.g, match = !ql || f.it.title.toLowerCase().includes(ql);\n      ctx.globalAlpha = match ? 1 : 0.3;\n      const x = Math.round(f.x - g.w / 2), y = Math.round(f.y - g.h / 2);\n      if (f.face > 0.5) {\n        // turned to face you\n        const fs = f.front.width, k = (f.face - 0.5) * 2;\n        const w = Math.max(1, Math.round(fs * k)), fx = Math.round(f.x - w / 2), fy = Math.round(f.y - fs / 2 - 1);\n        ctx.fillStyle = 'hsl(' + f.hue + ',80%,60%)';\n        px(fx - 3, f.y - 2, 3, 4); px(fx + w, f.y - 2, 3, 4);                    // side fins\n        ctx.drawImage(f.front, 0, 0, fs, fs + 3, fx, fy, w, fs + 3);\n        if (f.lead) drawFlag(f, fx + w / 2 - g.w / 2, fy);\n      } else {\n        const sx = f.flip >= 0 ? 1 : -1, squash = Math.max(0.15, Math.abs(f.flip)) * (1 - f.face * 1.6);\n        const w = Math.max(1, Math.round(g.w * Math.max(0.15, squash)));\n        const dx = Math.round(f.x - w / 2);\n        drawFins(f, ts, dx, y, sx);\n        ctx.save();\n        if (sx \u003c 0) { ctx.translate(dx + w, y); ctx.scale(-1, 1); ctx.drawImage(f.side, 0, 0, w, g.h); }\n        else ctx.drawImage(f.side, dx, y, w, g.h);\n        ctx.restore();\n        if (f.lead) drawFlag(f, dx + (w - g.w) / 2, y);\n        if (ql && match && Math.sin(ts * 0.012) > 0) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(dx - 1.5, y - 1.5, w + 3, g.h + 3); }\n      }\n      ctx.globalAlpha = 1;\n    }\n  }\n  function drawRipples(dt) {\n    ripples = ripples.filter(r => {\n      r.r += dt * 70; r.a -= dt * 1.4;\n      if (r.a \u003c= 0) return false;\n      ctx.fillStyle = 'rgba(255,255,255,' + r.a.toFixed(2) + ')';\n      const n = Math.max(12, Math.round(r.r * 1.6));\n      for (let k = 0; k \u003c n; k++) { const a = k / n * Math.PI * 2; px(r.x + Math.cos(a) * r.r, r.y + Math.sin(a) * r.r * 0.8); }\n      return true;\n    });\n  }\n  function drawSurface(ts) {\n    ctx.fillStyle = phase === 'night' ? '#6f9ad6' : '#f2ffff';\n    for (let x = 0; x \u003c AW; x += 1) {\n      const y = SURF + Math.round(Math.sin(x * 0.12 + ts * 0.002) * 0.8 + Math.sin(x * 0.05 - ts * 0.0013));\n      px(x, y);\n    }\n  }\n\n  let last = 0;\n  function frame(ts) {\n    requestAnimationFrame(frame);\n    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;\n    if (dayPhase() !== phase) paintBg();\n    step(dt, ts);\n    ctx.drawImage(bg, 0, 0);\n    drawRays(ts);\n    drawCaustics(ts);\n    drawMotes(ts);\n    drawWeeds(ts);\n    drawChest(ts, dt);\n    drawDiver(ts, dt);\n    drawFish(ts);\n    drawBubbles(dt, ts);\n    drawRipples(dt);\n    drawSurface(ts);\n  }\n\n  /* ---------- input ---------- */\n  function toArt(e) { return [e.clientX / S, e.clientY / S]; }\n  function pick(ax, ay) {\n    let best = null, bd = 1e9;\n    for (const f of FISH) {\n      const g = f.g, pad = 3;\n      if (ax > f.x - g.w / 2 - pad && ax \u003c f.x + g.w / 2 + pad && ay > f.y - g.h / 2 - pad && ay \u003c f.y + g.h / 2 + pad) {\n        const d = (ax - f.x) ** 2 + (ay - f.y) ** 2;\n        if (d \u003c bd) { bd = d; best = f; }\n      }\n    }\n    return best;\n  }\n  function tip(f, e) {\n    const t = $('#tip');\n    if (!f) { t.style.display = 'none'; return; }\n    t.textContent = f.it.title; t.style.setProperty('--h', f.hue); t.style.display = 'block';\n    const x = f.x * S, y = (f.y - f.g.h) * S - 40;\n    t.style.left = Math.max(8, Math.min(innerWidth - t.offsetWidth - 8, x - t.offsetWidth / 2)) + 'px';\n    t.style.top = Math.max(54, y) + 'px';\n    void e;\n  }\n  function tapGlass(ax, ay) {\n    ripples.push({ x: ax, y: ay, r: 2, a: 0.9 });\n    FISH.forEach(f => {\n      const dx = f.x - ax, dy = f.y - ay, d = Math.hypot(dx, dy) || 1;\n      if (d \u003c 90) { const k = (90 - d) / 90 * 70; f.vx += dx / d * k; f.vy += dy / d * k * 0.6; }\n    });\n    for (let i = 0; i \u003c 6; i++) bubble(ax + (Math.random() - 0.5) * 8, ay, 1);\n  }\n  let pinnedTip = 0;\n  art.addEventListener('pointermove', e => {\n    if (e.pointerType !== 'mouse') return;\n    const [ax, ay] = toArt(e);\n    const f = pick(ax, ay);\n    if (f !== hover) { hover = f; art.classList.toggle('hot', !!f); }\n    tip(hover, e);\n  });\n  art.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { hover = null; tip(null); } });\n  art.addEventListener('pointerup', e => {\n    const [ax, ay] = toArt(e);\n    if (ay \u003c SURF) return;\n    const f = pick(ax, ay);\n    if (e.pointerType === 'mouse') {\n      if (f) FW.openItem(f.it); else tapGlass(ax, ay);\n      return;\n    }\n    // touch: first tap turns a fish to face you, a second tap opens it\n    if (f && f === tapSel) { FW.openItem(f.it); tapSel = null; tip(null); return; }\n    if (f) { tapSel = f; tip(f, e); clearTimeout(pinnedTip); pinnedTip = setTimeout(() => { tapSel = null; tip(null); }, 4000); return; }\n    tapSel = null; tip(null); tapGlass(ax, ay);\n  });\n  setInterval(() => { if (hover || tapSel) tip(hover || tapSel); }, 120);\n  addEventListener('keydown', e => {\n    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;\n    if (e.key === ' ') { e.preventDefault(); tapGlass(AW / 2, (SURF + SAND) / 2); }\n  });\n\n  FW.search($('#q'), q => { query = q; });\n  $('#sync').addEventListener('click', async () => {\n    FW.lsSet('aquarium.gh', '1');\n    ITEMS = await FW.all({ gh: true, force: true });\n    spawn(ITEMS.slice().sort((a, b) => FW.catSort(a.cat, b.cat) || a.order - b.order));\n    FW.toast('⟳ ' + ITEMS.filter(i => i.cat === 'repo').length);\n  });\n  let rt = 0;\n  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });\n\n  resize();\n  ITEMS = await FW.all({ gh: FW.ls('aquarium.gh', '') === '1' });\n  spawn(ITEMS.slice().sort((a, b) => FW.catSort(a.cat, b.cat) || a.order - b.order));\n  requestAnimationFrame(frame);\n})();\n\u003c/script>\n"}, "dream": {"name": "Dream", "glyph": "⟲", "pos": "br", "html": "\u003cstyle>\n  /* DREAM - a whole layout rolled from one seed: arrangement, palette, background,\n     tile shape, frame, hover, idle mot     '<button class="lb ' + B.pos + '" id="lb" aria-haspopup="dialog" aria-label="layout" title="layout"></button>' +
    '<div class="p" id="p" role="dialog" aria-label="layouts"></div><div class="fx" id="fx"></div>';
  var $ = function (id) { return root.getElementById(id); };
  var panel = $('p'), fx = $('fx'), lb = $('lb');
  lb.textContent = cur.glyph;

  /* ---------- toolbar slot: a layout's own [data-fwx] button replaces the corner one ---------- */
  function slot() {
    var all = document.querySelectorAll('[data-fwx]');
    for (var i = 0; i < all.length; i++) { var r = all[i].getBoundingClientRect(); if (r.width && r.height && getComputedStyle(all[i]).visibility !== 'hidden') return all[i]; }
    return null;
  }
  function anchor() { return slot() || lb; }
  var syncQ = 0;
  function syncFallback() { if (syncQ) return; syncQ = requestAnimationFrame(function () { syncQ = 0; lb.classList.toggle('gone', !!slot()); }); }
  new MutationObserver(syncFallback).observe(document.body, { childList: true, subtree: true });
  addEventListener('resize', syncFallback);
  syncFallback();

  /* ---------- panel ---------- */
  function kept() { try { return JSON.parse(ls('fwx.kept') || '[]'); } catch (e) { return []; } }
  function render() {
    var k = kept(), curSeed = B.key === 'dream' ? B.seed : 0;
    var isKept = curSeed && k.indexOf(curSeed) >= 0;
    panel.innerHTML =
      '<div class="g">' + B.list.filter(function (L) { return L.key !== 'dream'; }).map(function (L) {
        return '<button class="L' + (L.key === B.key ? ' cur' : '') + '" data-k="' + esc(L.key) + '" title="' + esc(L.name) + '"><b>' + esc(L.glyph) + '</b><span>' + esc(L.name.toLowerCase()) + '</span></button>';
      }).join('') + '</div>' +
      '<div class="sep"></div>' +
      '<div class="row"><button class="b hot" id="dr" title="dream a new layout">⟲</button>' +
      (curSeed ? '<button class="b' + (isKept ? ' on' : '') + '" id="kp" title="keep this dream">' + (isKept ? '♥' : '♡') + '</button>' : '') +
      '<button class="b" id="cp" title="copy link">⧉</button>' +
      (ls('fwx.layout') ? '<button class="b" id="rs" title="default">↺</button>' : '') + '</div>' +
      (k.length ? '<div class="k">' + k.map(function (s) {
        return '<button class="' + (s === curSeed ? 'cur' : '') + '" data-s="' + s + '" title="#' + s + '">' + esc(nameOf(s)) + '<i data-rm="' + s + '" title="forget">✕</i></button>';
      }).join('') + '</div>' : '');
  }
  var openAt = null;
  function place(a) {
    var r = a.getBoundingClientRect(), pw = panel.offsetWidth, ph = panel.offsetHeight;
    var below = r.top + r.height / 2 < innerHeight / 2;
    var top = below ? r.bottom + 10 : r.top - 10 - ph;
    var left = r.left + r.width / 2 > innerWidth / 2 ? r.right - pw : r.left;
    top = Math.max(8, Math.min(innerHeight - ph - 8, top));
    left = Math.max(8, Math.min(innerWidth - pw - 8, left));
    panel.style.left = left + 'px'; panel.style.top = top + 'px';
    panel.style.transformOrigin = (r.left + r.width / 2 - left) + 'px ' + (r.top + r.height / 2 - top) + 'px';
  }
  function open(a) {
    a = a && a.getBoundingClientRect ? a : anchor();
    openAt = a;
    render(); panel.classList.add('on'); place(a);
    lb.classList.add('open'); a.classList && a.classList.add('fwx-open');
    if (!reduce) panel.animate([{ opacity: 0, transform: 'scale(.86)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: OUT });
    setTimeout(function () { var c = panel.querySelector('.cur') || panel.querySelector('button'); if (c) c.focus({ preventScroll: true }); }, 60);
  }
  function close() {
    if (!panel.classList.contains('on')) return;
    var done = function () { panel.classList.remove('on'); };
    lb.classList.remove('open'); if (openAt && openAt.classList) openAt.classList.remove('fwx-open');
    if (reduce) return done();
    var an = panel.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.9)' }], { duration: 180, easing: IN });
    an.onfinish = done;
  }
  function toggle(a) { panel.classList.contains('on') ? close() : open(a); }

  /* ---------- transitions: each layout has its own way in ---------- */
  var STYLES = ['card', 'iris', 'blinds', 'pixels'];
  function styleFor(key) {
    var h = 0; for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return key === 'dream' ? 'pixels' : STYLES[h % STYLES.length];
  }
  function el(cls, css, parent) { var d = document.createElement('div'); d.className = cls; if (css) d.style.cssText = css; (parent || fx).appendChild(d); return d; }
  function glyph(text, size, parent) { var g = el('gl', 'font-size:' + size + 'px', parent); g.textContent = text; return g; }
  function play(a) { return new Promise(function (res) { if (!a) return res(); a.onfinish = res; a.oncancel = res; }); }
  function rectOf(n) { var r = n.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; }
  var full = function () { return { x: 0, y: 0, w: innerWidth, h: innerHeight }; };
  var R = function (r) { return { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' }; };
  function veil(from, to, dur, ease) {
    var v = el('veil');
    return play(v.animate([{ opacity: from, backdropFilter: 'blur(' + from * 10 + 'px)' }, { opacity: to, backdropFilter: 'blur(' + to * 10 + 'px)' }], { duration: dur, easing: ease, fill: 'forwards' }));
  }

  /* cover the screen, starting from rect `src`; resolves once fully covered */
  function exit(style, src, g) {
    fx.innerHTML = ''; fx.classList.add('block');
    if (reduce) { var s0 = el('sheet', 'inset:0'); glyph(g, 96, s0); return play(s0.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, fill: 'forwards' })); }
    veil(0, .55, 520, IN);
    var F = full(), cx = src.x + src.w / 2, cy = src.y + src.h / 2;
    if (style === 'card') {
      var s = el('sheet', 'border:1px solid ' + GOLD);
      var gg = glyph(g, 96, s);
      var a = s.animate([Object.assign(R(src), { borderRadius: '6px', borderColor: GOLD }), Object.assign(R(F), { borderRadius: '0px', borderColor: BG })], { duration: 720, easing: IO, fill: 'forwards' });
      gg.animate([{ transform: 'translate(-50%,-50%) scale(' + Math.max(.15, Math.min(src.w, src.h) / 160) + ')' }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 720, easing: IO, fill: 'forwards' });
      return play(a);
    }
    if (style === 'iris') {
      var rr = Math.hypot(Math.max(cx, F.w - cx), Math.max(cy, F.h - cy));
      var s2 = el('sheet', 'inset:0');
      var g2 = glyph(g, 96, s2);
      g2.animate([{ opacity: 0, transform: 'translate(-50%,-50%) scale(.4) rotate(-20deg)' }, { opacity: 0, offset: .45 }, { opacity: 1, transform: 'translate(-50%,-50%) scale(1) rotate(0)' }], { duration: 760, easing: OUT, fill: 'forwards' });
      return play(s2.animate([{ clipPath: 'circle(0px at ' + cx + 'px ' + cy + 'px)' }, { clipPath: 'circle(' + rr + 'px at ' + cx + 'px ' + cy + 'px)' }], { duration: 680, easing: IN, fill: 'forwards' }));
    }
    if (style === 'blinds') {
      var n = innerWidth < 600 ? 6 : 10, w = Math.ceil(F.w / n), last;
      for (var i = 0; i < n; i++) {
        var d = Math.abs((i + .5) * w - cx) / F.w;
        var b = el('sheet', 'top:0;bottom:0;left:' + (i * w - 1) + 'px;width:' + (w + 2) + 'px;transform-origin:' + (i % 2 ? 'bottom' : 'top'));
        last = b.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 520, delay: d * 380, easing: IO, fill: 'both' });
      }
      var g3 = glyph(g, 96);
      g3.animate([{ opacity: 0, transform: 'translate(-50%,-50%) scale(.6)' }, { opacity: 0, offset: .6 }, { opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }], { duration: 900, easing: OUT, fill: 'forwards' });
      return play(last).then(function () { return new Promise(function (r) { setTimeout(r, 120); }); });
    }
    /* pixels */
    var cs = Math.ceil(Math.max(F.w, F.h) / (innerWidth < 600 ? 9 : 16)), cols = Math.ceil(F.w / cs), rows = Math.ceil(F.h / cs), maxd = 0, lastA, cells = [];
    for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) { var dd = Math.hypot(x * cs + cs / 2 - cx, y * cs + cs / 2 - cy); maxd = Math.max(maxd, dd); cells.push([x, y, dd]); }
    cells.forEach(function (c) {
      var p = el('sheet', 'left:' + (c[0] * cs - .5) + 'px;top:' + (c[1] * cs - .5) + 'px;width:' + (cs + 1) + 'px;height:' + (cs + 1) + 'px');
      var an = p.animate([{ transform: 'scale(0)', borderRadius: '50%' }, { transform: 'scale(1)', borderRadius: '0' }], { duration: 340, delay: c[2] / maxd * 460, easing: OUT, fill: 'both' });
      if (!lastA || c[2] >= maxd - 1) lastA = an;
    });
    var g4 = glyph(g, 96);
    g4.animate([{ opacity: 0, transform: 'translate(-50%,-50%) scale(.5)' }, { opacity: 0, offset: .55 }, { opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }], { duration: 860, easing: OUT, fill: 'forwards' });
    return play(lastA).then(function () { return new Promise(function (r) { setTimeout(r, 80); }); });
  }

  /* uncover the screen into rect `dst` (the new layout's button) */
  function entry(style, g, dst) {
    fx.innerHTML = ''; fx.classList.add('block');
    var F = full(), cx = dst.x + dst.w / 2, cy = dst.y + dst.h / 2, done;
    var finish = function () { fx.innerHTML = ''; fx.classList.remove('block'); pulse(); };
    if (reduce) { var s0 = el('sheet', 'inset:0'); html.classList.remove('fwx-cover'); return play(s0.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' })).then(finish); }
    var v = el('veil', 'opacity:.55');
    v.animate([{ opacity: .55, backdropFilter: 'blur(5px)' }, { opacity: 0, backdropFilter: 'blur(0px)' }], { duration: 900, delay: 150, easing: OUT, fill: 'forwards' });
    if (style === 'card') {
      var s = el('sheet', 'inset:auto;border:1px solid ' + BG);
      Object.assign(s.style, R(F));
      var gg = glyph(g, 96, s);
      html.classList.remove('fwx-cover');
      gg.animate([{ transform: 'translate(-50%,-50%) scale(1)' }, { transform: 'translate(-50%,-50%) scale(' + Math.max(.12, Math.min(dst.w, dst.h) / 200) + ')' }], { duration: 780, easing: IO, fill: 'forwards' });
      done = s.animate([Object.assign(R(F), { borderRadius: '0px', borderColor: BG, opacity: 1 }), Object.assign(R(dst), { borderRadius: '6px', borderColor: GOLD, opacity: 1, offset: .88 }), Object.assign(R(dst), { borderRadius: '6px', borderColor: GOLD, opacity: 0 })], { duration: 880, easing: IO, fill: 'forwards' });
    } else if (style === 'iris') {
      var rr = Math.hypot(Math.max(cx, F.w - cx), Math.max(cy, F.h - cy));
      var s2 = el('sheet', 'inset:0'); var g2 = glyph(g, 96, s2);
      html.classList.remove('fwx-cover');
      g2.animate([{ opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }, { opacity: 0, transform: 'translate(-50%,-50%) scale(1.6) rotate(12deg)' }], { duration: 380, easing: IN, fill: 'forwards' });
      done = s2.animate([{ clipPath: 'circle(' + rr + 'px at ' + cx + 'px ' + cy + 'px)' }, { clipPath: 'circle(0px at ' + cx + 'px ' + cy + 'px)' }], { duration: 820, delay: 120, easing: OUT, fill: 'forwards' });
    } else if (style === 'blinds') {
      var n = innerWidth < 600 ? 6 : 10, w = Math.ceil(F.w / n);
      var g3 = glyph(g, 96);
      for (var i = 0; i < n; i++) {
        var d = Math.abs((i + .5) * w - cx) / F.w;
        var b = el('sheet', 'top:0;bottom:0;left:' + (i * w - 1) + 'px;width:' + (w + 2) + 'px;transform-origin:' + (i % 2 ? 'top' : 'bottom'));
        var an = b.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(0)' }], { duration: 560, delay: 200 + d * 420, easing: IO, fill: 'both' });
        if (!done || d * 420 > (done._d || 0)) { done = an; done._d = d * 420; }
      }
      fx.appendChild(g3);
      html.classList.remove('fwx-cover');
      g3.animate([{ opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }, { opacity: 0, transform: 'translate(-50%,-50%) scale(.7)' }], { duration: 260, easing: IN, fill: 'forwards' });
    } else {
      var cs = Math.ceil(Math.max(F.w, F.h) / (innerWidth < 600 ? 9 : 16)), cols = Math.ceil(F.w / cs), rows = Math.ceil(F.h / cs), maxd = 0, cells = [];
      for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) { var dd = Math.hypot(x * cs + cs / 2 - cx, y * cs + cs / 2 - cy); maxd = Math.max(maxd, dd); cells.push([x, y, dd]); }
      var g4 = glyph(g, 96);
      cells.forEach(function (c) {
        var p = el('sheet', 'left:' + (c[0] * cs - .5) + 'px;top:' + (c[1] * cs - .5) + 'px;width:' + (cs + 1) + 'px;height:' + (cs + 1) + 'px');
        var an = p.animate([{ transform: 'scale(1)', borderRadius: '0' }, { transform: 'scale(0)', borderRadius: '50%' }], { duration: 360, delay: 160 + (1 - c[2] / maxd) * 520, easing: IN, fill: 'both' });
        if (c[2] <= (done ? done._m : Infinity)) { done = an; done._m = c[2]; }
      });
      fx.appendChild(g4);
      html.classList.remove('fwx-cover');
      g4.animate([{ opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }, { opacity: 0, transform: 'translate(-50%,-50%) scale(.4)' }], { duration: 300, easing: IN, fill: 'forwards' });
    }
    return play(done).then(finish);
  }
  function pulse() {
    var a = anchor(); if (reduce || !a || !a.animate) return;
    a.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25) rotate(-8deg)', offset: .4 }, { transform: 'scale(1)' }], { duration: 520, easing: OUT });
  }

  var going = false;
  function go(key, seed, from) {
    if (going) return; going = true;
    lsSet('fwx.layout', key);
    if (seed) lsSet('fwx.seed', seed);
    var u = new URL(location.href);
    u.searchParams.delete('layout'); u.searchParams.delete('seed'); u.hash = '';
    var style = styleFor(key), g = glyphOf(key);
    var src = from ? rectOf(from) : rectOf(anchor());
    close();
    ssSet('fwx.in', JSON.stringify({ style: style, glyph: g, cover: true }));
    exit(style, src, g).then(function () {
      if (u.href === location.href) location.reload(); else location.replace(u.href);
    });
  }

  /* arriving from a switch: start covered, then ease into the new layout's button */
  (function arrive() {
    var s; try { s = JSON.parse(ssGet('fwx.in') || 'null'); } catch (e) { s = null; }
    ssDel('fwx.in');
    if (!s) { html.classList.remove('fwx-cover'); return; }
    var start = function () {
      syncFallback();
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        lb.classList.toggle('gone', !!slot());
        var a = anchor(); var r = rectOf(a);
        if (!r.w) r = { x: innerWidth / 2 - 20, y: innerHeight / 2 - 20, w: 40, h: 40 };
        entry(s.style || 'card', s.glyph || cur.glyph, r).catch(function () { fx.innerHTML = ''; fx.classList.remove('block'); html.classList.remove('fwx-cover'); });
      }); });
    };
    setTimeout(start, 260);
    setTimeout(function () { html.classList.remove('fwx-cover'); }, 4000);
  })();

  panel.addEventListener('click', function (e) {
    var rm = e.target.closest('[data-rm]');
    if (rm) { e.stopPropagation(); lsSet('fwx.kept', JSON.stringify(kept().filter(function (s) { return s !== +rm.dataset.rm; }))); render(); place(openAt || anchor()); return; }
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.k) { if (t.dataset.k === B.key) { close(); return; } go(t.dataset.k, 0, t); }
    else if (t.id === 'dr') go('dream', ((Math.random() * 1e9) >>> 0) || 1, t);
    else if (t.dataset.s) go('dream', +t.dataset.s, t);
    else if (t.id === 'kp') { var k = kept(); var i = k.indexOf(B.seed); if (i >= 0) k.splice(i, 1); else k.unshift(B.seed); lsSet('fwx.kept', JSON.stringify(k.slice(0, 30))); render(); place(openAt || anchor()); }
    else if (t.id === 'rs') { lsDel('fwx.layout'); go(B.def, 0, t); }
    else if (t.id === 'cp') {
      var u = new URL(location.href); u.hash = ''; u.search = '';
      u.searchParams.set('layout', B.key); if (B.key === 'dream') u.searchParams.set('seed', B.seed);
      var say = function (m) { if (window.FW) FW.toast(m, 3500); };
      try { navigator.clipboard.writeText(u.href).then(function () { say('⧉ ' + u.href); }, function () { say(u.href); }); } catch (err) { say(u.href); }
    }
  });
  lb.addEventListener('click', function (e) { e.stopPropagation(); toggle(lb); });
  lb.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  /* a layout's toolbar button: handled here, never by the layout */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('[data-fwx]');
    if (!a) return;
    e.preventDefault(); e.stopPropagation();
    toggle(a);
  }, true);
  document.addEventListener('pointerdown', function (e) {
    if (!panel.classList.contains('on')) return;
    if (e.composedPath().indexOf(host) >= 0) return;
    if (e.target.closest && e.target.closest('[data-fwx]')) return;
    close();
  }, true);
  addEventListener('keydown', function (e) { if (e.key === 'Escape' && panel.classList.contains('on')) close(); }, true);
  addEventListener('resize', function () { if (panel.classList.contains('on')) place(openAt || anchor()); });

  window.FWX = { open: open, close: close, toggle: toggle, go: go, layouts: B.list, current: B.key };
})();
</script>
</body>
</html>
